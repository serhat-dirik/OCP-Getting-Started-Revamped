# =============================================================================
# ogsr-bootstrap — FSC entrypoint values contract
# =============================================================================
# RHDP (Field Sourced Content) auto-injects deployer.*, gitops.*, and — when
# provisioned — litemaas.* and multi_user.* onto the `field-content` Application's
# Helm values. Everything else has a safe default so the chart also installs on any
# OpenShift 4.20+ cluster (BYO / partner) with one small values override.
# NO cluster domain is ever hardcoded here (privacy guard forbids live domains) —
# deployer.domain is the single source and stays "" until the platform injects it.
# =============================================================================

# --- RHDP-injected: cluster coordinates (set by the platform — DO NOT hardcode) ---
deployer:
  domain: ""        # injected e.g. apps.cluster-xyz.example.com  (ingress apps domain)
  apiUrl: ""        # injected e.g. https://api.cluster-xyz.example.com:6443

# --- RHDP-injected: self-reference so child Applications point back at this repo ---
# Under FSC these mirror the three order parameters (GitOps Repo URL / Revision / Path).
gitops:
  repoURL: "https://github.com/serhat-dirik/OCP-Getting-Started-Revamped"
  revision: "main"
  path: "helm/bootstrap"   # informational: the path RHDP points `field-content` at

# --- RHDP-injected (only when a MaaS key was provisioned): LiteMaaS / MaaS LLM ------
# Default disabled. When enabled AND apiUrl + apiKey are both set, the maas-secret Job materializes
# the OpenShift Lightspeed `credentials` Secret (key: apitoken) from apiKey and the ai-assist stack
# (OpenShift Lightspeed) installs automatically — no separate stacks.lightspeed flip needed. If no
# endpoint/key is provisioned, Lightspeed AUTO-SKIPS (the ai-assist stack is not rendered), so a
# BYO/partner cluster with no LLM needs no extra config to opt out.
litemaas:
  enabled: false
  apiUrl: ""              # OpenAI/vLLM-compatible base, ends in /v1
  apiKey: ""              # sk-…  (injected; never committed — lives only in the rendered Secret)
  # EMPTY MEANS DISCOVER, and empty is the right default (owner decision 2026-07-25: "we may not
  # know what AI model the installer will bring"). MaaS keys are MODEL-SCOPED, so a guessed default
  # that does not match the key is not a cosmetic mismatch — it is an HTTP 401
  # key_model_access_denied the attendee meets inside the AI modules, long after the order said
  # Ready. The two clusters this workshop has run on had keys scoped to OPPOSITE models
  # (inverted-scope incident 2026-07-19), which is exactly what a hardcoded default cannot survive.
  # The maas-secret Job asks the endpoint what it serves (GET {apiUrl}/models) and stages the
  # answer; set a value here only to PIN one, and it is still checked against what the endpoint
  # offers. Twin of bootstrap/install.sh's discover_maas_model().
  #
  # BOTH apiUrl AND model ALSO reach the ATTENDEE'S PAGE, not just the entry states: templates/
  # applications.yaml passes them to workshop-config as showroom.maasEndpoint / showroom.maasModel,
  # which become the {maas_endpoint} / {maas_model} Antora attributes in every cockpit. See the
  # `showroom:` block below for what happens when they are absent.
  model: ""

# --- Cockpit attributes that describe THIS deployment --------------------------------
# Three Antora attributes in the served content name the environment rather than the product:
# {cluster_ocp_version}, {maas_model} and {maas_endpoint}. content/antora.yml and showroom/site*.yml
# declare them SOFTLY (`set-from-cluster@` / a sentinel model name) so a build never fails; the
# deploy is expected to override them with what is actually true here. workshop-config emits each
# key ONLY when its value is non-empty — an empty override would merge a BLANK over the soft default
# and the sentence would silently lose its subject, which is the worse failure.
#
# WHY THIS BLOCK EXISTS. bootstrap/install.sh (the laptop path) resolves all three and passes them.
# This chart passed NONE of them until 2026-08-08, so an RHDP-deployed workshop served the sentinels
# BY CONSTRUCTION — an SA read a literal `set-from-cluster` on screen in front of a customer. Two of
# the three are now threaded from litemaas.* above. The third is this key, and it is NOT the same
# kind of value:
#
#   ocpVersion is a LIVE CLUSTER READING, and on this path nothing that renders the chart can take
#   it. Argo CD's repo-server renders with `helm template`, which never opens a cluster connection
#   at all — measured 2026-08-08: `helm template` against a deliberately BOGUS KUBECONFIG returned
#   rc=0 with `lookup` yielding an empty map, rather than the "Kubernetes cluster unreachable" a
#   connection attempt would have produced. So `lookup` is not an option here, and a Job that reads
#   the version cannot inject it either: everything this chart renders is owned by the `field-content`
#   Application, which runs selfHeal=true (see README Option B2), so a patched-in helm parameter is
#   reverted on the next reconcile. That leaves the deployer as the only source on this path.
#
# SO THIS VALUE IS DEPLOYER-ASSERTED AND UNVERIFIED AT RENDER TIME. That cuts both ways, and the
# project's own rule is that a plausible-but-wrong number nobody questions is worse than a visible
# placeholder everybody questions. templates/job-cockpit-attributes.yaml therefore reads the live
# clusterversion AFTER the sync and says out loud whether what you typed matches — and when you
# typed nothing, prints the exact string to put here. Leave it empty and the cockpits render the
# visible placeholder: wrong, but legibly wrong. Shape is validated below and by that Job; anything
# not release-shaped is rejected rather than served.
showroom:
  ocpVersion: ""   # e.g. "4.22.8" — the release THIS cluster runs (oc get clusterversion version)

# --- RHDP-injected (only when multi-user was requested): attendee roster ------------
# num_users drives the htpasswd roster + workshop-config userCount. `users` is the
# optional explicit FSC roster ([{username: user1}, …]); when empty the chart derives
# userPrefix1..userPrefix{num_users}.
multi_user:
  num_users: 5
  userPrefix: "user"
  users: []
  # When the platform base CI already provisions the userN htpasswd identities from the FSC
  # roster, set false to skip the htpasswd Secret + OAuth IdP Job. Default true (self-provision,
  # as bootstrap/install.sh does) so the chart also stands users up on a BYO cluster.
  manageHtpasswd: true

# --- Shared workshop password (console/CLI htpasswd login AND Gitea) -----------------
# A SHARED, throwaway, non-secret value by design (the attendee users are disposable).
# Keep it simple/memorable. Overridable per order.
workshop_user_password: "openshift"

# --- Module selection → platform stacks (mirrors bootstrap/vars.yaml modules_disabled) ------
# The deployer thinks in MODULES, not stacks. Leave modulesDisabled empty and the WHOLE workshop
# is delivered — the chart installs the UNION of platform stacks the enabled modules require
# (moduleCatalog below, generated from /modules.yaml). Disable the modules you are not teaching to
# lighten the cluster: a stack needed ONLY by disabled modules is not installed. Entries are `mNN`
# (module number, e.g. m13) or a slug (e.g. observability-health-scale); plain list only, no ranges.
# core-devtools, batch and progressive-delivery are ALWAYS installed (baseline) and are unaffected.
modulesDisabled: []

# --- Expert stack overrides (rarely needed) ----------------------------------------------------
# Additive only: set one true to FORCE that platform stack on regardless of module selection (e.g. a
# PoC cluster that wants a capability with no matching module enabled). Leaving them false is normal —
# module selection above already turns on exactly what the enabled modules need. To REMOVE a stack,
# disable the module(s) that need it (modulesDisabled), don't flip these to false.
stacks:
  lightspeed: false   # ai-assist stack (OpenShift Lightspeed). Normally auto-driven by litemaas.* (below).
                      # This is the ADDITIVE half only (force on). To force it OFF, see `lightspeed:` below.
  auth: false         # auth stack (Red Hat build of Keycloak)
  resilience: false   # resilience stack (OADP + RHSI). PREREQ: ODF/MCG for the S3 target.
  mesh: false         # OSSM 3 + Kiali
  serverless: false   # OpenShift Serverless (Knative)
  mta: false          # Migration Toolkit for Applications
  observability: false # COO + Loki + Tempo + OTel
  appsec: false       # SonarQube
  portal: false       # Red Hat Developer Hub (RHDH)
  trust: false        # RHACS + RHTAS
  trustDemo: false    # RHTPA (stack dir: trust-demo) — M09 demo-flavor add-on (no module requires it)

# --- Lightspeed hard-off (twin of bootstrap/vars.yaml `lightspeed: false`) ---------------------
# Leave UNSET (null) for the normal auto contract: Lightspeed is on iff litemaas.* carries an
# endpoint + key, off otherwise. Set to false to keep the ai-assist stack off even on a cluster
# where a MaaS credential IS provisioned — the deployer's explicit "no assistant on this cluster".
#
# This is NOT the same as litemaas.enabled=false, and that difference is the reason the key exists.
# litemaas.enabled=false also withholds ogsr-system/ogsr-maas-credentials — the workshop's OWN MaaS
# credential, which the AI entry states (agentic-ai, ai-assisted-development, app-modernization,
# jobs-batch-kueue) PREFER over any adopted Lightspeed secret. Turning off the assistant that way
# silently takes the AI beats of four modules with it. `lightspeed: false` drops only the stack.
lightspeed: null

# --- Console plugins (mirrors bootstrap/vars.yaml console_plugins) --------------------
# ON by default (owner 2026-07-19: the Pipelines/GitOps/ACS plugins are mostly console links —
# not worth a deployer decision). workshop-config's hook Job MERGES its known plugin names
# (gitops/workshop-config/values.yaml consolePlugins.names) into consoles.operator.openshift.io
# .spec.plugins append-if-absent, and ONLY for a name that already has a matching ConsolePlugin CR
# (an operator we didn't install is skipped, never dangled); uninstall removes only the names it
# recorded adding (console_plugins_added). The console pods roll when .spec.plugins changes — that
# is normal OpenShift behavior, not a workshop defect. Set false only if a shared cluster must not
# change its console at all.
consolePlugins:
  enabled: true

# --- Namespaces (parameterized: the ogsr- rename is a values flip) -------------------
# gitea/showroom MUST match the namespaces the reused portfolio + workshop-config
# components actually deploy into. Renamed to ogsr- (owner decision 2026-07-17) in
# lockstep with those layers; this is the single flip point — the giteaHost helper +
# userinfo URLs derive from namespaces.gitea, so no template edit is needed.
namespaces:
  gitea: "ogsr-gitea"
  showroom: "ogsr-showroom"
  system: "ogsr-system"             # owner-labeled home for the uninstall-state CM + bootstrap SA
  lightspeed: "openshift-lightspeed" # product-canonical — never prefix (OLM owns the name)
  config: "openshift-config"         # product-canonical — never prefix

# --- In-cluster Gitea mirror coordinates (match git-mirror + workshop-config) --------
gitea:
  org: "parasol"
  repo: "ocp-getting-started"

# --- Argo CD instance the child Applications live in ---------------------------------
# project: our own AppProject, not the built-in `default` (which permits every repo, destination
# and resource kind, and on an adopted Argo CD is shared with the organisation's Applications).
# templates/appproject.yaml creates it at sync-wave -1; set "default" to skip creating it and fall
# back to the built-in project.
argocd:
  namespace: "openshift-gitops"
  project: "ogsr-platform"
  # --- application-controller sizing -----------------------------------------------------------
  # The operator default is 2Gi, and 2Gi does not survive this workshop: the workshop-config
  # Application alone carries 636 resources and the controller is OOMKilled (exit 137) before
  # anything materializes — measured on a clean cluster, where the whole workshop layer came up as
  # 3 namespaces instead of ~70 with no sync operation ever recorded. On the script path
  # platform-portfolio/argocd-bootstrap/install.sh raises it (operator/argocd-controller-
  # resources.yaml). Nothing on the FSC path did, so the two paths produced different clusters from
  # the same source — which is exactly the drift helm/bootstrap exists to not have.
  #
  # CONSENT. On an ADOPTED Argo CD the script ASKS before touching the org's CR (and refuses
  # without a TTY unless OGSR_ADOPTED_ARGOCD_MEMORY=apply). A Job has no terminal, so this value IS
  # that consent, given up front at order time: under FSC the cluster is provisioned for the
  # workshop, so the order is the consent. On a BYO cluster whose Argo CD belongs to your
  # organisation and is shared with your own Applications, set manageControllerResources=false and
  # raise it yourself — the install will then say plainly that it did not, and why.
  # REVERSIBILITY. The Job records the CR's prior spec.controller.resources (and the fact that WE
  # changed it) into ogsr-uninstall-state BEFORE patching, and REFUSES to patch if it cannot record
  # them — same rule the script follows, so ogsr-uninstall.sh can put the controller back.
  manageControllerResources: true
  controllerResources:
    limits: {cpu: "2", memory: 6Gi}
    requests: {cpu: 250m, memory: 2Gi}

# --- RHDP integration + non-invasive delivery labels --------------------------------
owner: "ogsr"                        # workshop.redhat.com/owner — enumeration + safe uninstall
demoApplication: "ocp-getting-started"  # demo.redhat.com/application — RHDP health grouping

# --- Job images (idempotent, restricted-SCC-safe, no runtime dnf) -------------------
images:
  # oc + curl + bash on every connected cluster; ≥512Mi (oc OOMs at 256Mi).
  cli: "registry.redhat.io/openshift4/ose-cli:latest"
  # ships /usr/bin/htpasswd (httpd-tools); UBI, pullable without a pull secret.
  htpasswd: "registry.access.redhat.com/ubi9/httpd-24:latest"

# BEGIN gen-module-stacks — GENERATED by tools/gen-module-stacks.sh, DO NOT EDIT
# Regenerate after editing modules.yaml (CI drift gate). Consumed by templates/_helpers.tpl
# (ogsr-bootstrap.requiredStacks) to derive the platform-stack set from .Values.modulesDisabled:
# Helm can't read /modules.yaml, so the ordered slug->stacks catalog is generated here.
moduleCatalog:
  - slug: platform-orientation
    stacks: [] # foundations: deploy/scale/heal on baseline core-devtools only
  - slug: build-deliver
    stacks: [] # image/S2I/Dockerfile builds + DB + polyglot svc — all baseline
  - slug: devspaces-inner-loop
    stacks: [] # Dev Spaces ships in baseline core-devtools
  - slug: config-multienv
    stacks: [] # ConfigMaps/Secrets/probes/promotion — all baseline
  - slug: storage-stateful
    stacks: [] # PVC/StorageClass/StatefulSet — all baseline
  - slug: jobs-batch-kueue
    stacks: [] # Kueue is baseline (batch); AI batch inference hits MaaS directly, no stack
  - slug: pipelines-fundamentals
    stacks: [] # Tekton + Pipelines-as-Code ship in baseline core-devtools
  - slug: app-security-testing
    stacks: [appsec, trust] # SAST=SonarQube (appsec); image-scan gate + Chains signing=RHACS/RHTAS (trust)
  - slug: trusted-supply-chain
    stacks: [trust] # RHACS + Trusted Artifact Signer (RHTAS): sign/attest/SBOM/admission
  - slug: gitops-fundamentals
    stacks: [] # Argo CD ships with the baseline GitOps operator
  - slug: gitops-at-scale
    stacks: [] # Argo Rollouts is baseline (progressive-delivery)
  - slug: developer-hub-golden-paths
    stacks: [portal] # Red Hat Developer Hub (RHDH)
  - slug: observability-health-scale
    stacks: [observability] # COO + Loki + Tempo + OpenTelemetry (metrics/logs/traces)
  - slug: securing-apps-keycloak
    stacks: [auth] # Red Hat build of Keycloak + per-user realms
  - slug: multi-tenancy-workload-security
    stacks: [] # RBAC/quotas/SCC/PodSecurity + a read-only tour of the live OAuth config (no auth stack required)
  - slug: networking-dev-devops
    stacks: [] # Services/Routes/Gateway API (baseline) + NetworkPolicy + UDN (OVN) — mesh is a later module
  - slug: deployment-targets-scheduling
    stacks: [] # node selectors/taints/affinity/topology-spread/PDB — all baseline
  - slug: registry-images-catalog-governance
    stacks: [] # internal registry/ImageStreams/mirroring/policy — all baseline
  - slug: service-mesh-advanced-gateways
    stacks: [mesh] # OSSM 3 (Sail/Istio) + Kiali
  - slug: serverless-zero-to-hero
    stacks: [serverless] # Knative Serving
  - slug: eventing-deep-dive
    stacks: [serverless] # Knative Eventing + Serverless Logic (SonataFlow) ship in the serverless stack
  - slug: resilience-multicluster-dr
    stacks: [resilience, mesh] # OADP + Service Interconnect (resilience); app-level failover runs over OSSM 3 (mesh) per this module's design
  - slug: app-modernization
    stacks: [mta] # Migration Toolkit for Applications; MTA Developer Lightspeed uses MaaS directly (no ai-assist stack)
  - slug: agentic-ai
    stacks: [] # MaaS endpoint + on-cluster MCP servers, materialized by the entry state — no platform stack
  - slug: ai-assisted-development
    stacks: [] # coding assistant via a least-privilege MCP ServiceAccount + MaaS — no platform stack
  - slug: packaging-distributing
    stacks: [] # Helm/OCI + OLM bundle dissection — all baseline
# END gen-module-stacks
