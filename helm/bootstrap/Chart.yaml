apiVersion: v2
name: ogsr-bootstrap
description: >-
  OCP-Getting-Started FSC entrypoint. Red Hat Demo Platform (Field Sourced Content)
  points its `field-content` Application at this chart; it deploys the in-cluster Gitea
  mirror anchor, the platform-portfolio stacks and the workshop-config layer as child
  Argo CD Applications (app-of-apps), and GitOps-ifies the imperative bootstrap steps
  (htpasswd users, OAuth IdP, MaaS secret, node shaping, uninstall-state capture) as
  in-cluster Jobs. Workshop-agnostic where the portfolio is; workshop-specific on top.
type: application
# 0.4.0 — parity pass against bootstrap/install.sh: batch-pool taint floor, adopted-resource
# protection, OperatorGroup uniqueness gate, application-controller sizing, MaaS
# resolve-and-validate-before-stage, `lightspeed: false` hard-off. The bump is load-bearing:
# these are hook-only + values changes, and Argo's manifest cache can re-serve a stale render
# across an unchanged chart version (it survives SHA changes and Redis flushes).
version: 0.4.0
appVersion: "1.0.0"
