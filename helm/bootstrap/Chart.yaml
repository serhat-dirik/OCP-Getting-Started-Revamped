apiVersion: v2
name: ogsr-bootstrap
description: >-
  OCP-Getting-Started FSC entrypoint. Red Hat Demo Platform (Field Sourced Content)
  points its `field-content` Application at this chart; it deploys the in-cluster Gitea
  mirror anchor, the platform-portfolio stacks and the workshop-config layer as child
  Argo CD Applications (app-of-apps), and GitOps-ifies the imperative bootstrap steps
  (htpasswd users, OAuth IdP, MaaS secret, node shaping, uninstall-state capture) as
  in-cluster Jobs. Workshop-agnostic where the portfolio is; workshop-specific on top.
type: application
# 0.5.0 — the cockpit attributes that describe THIS deployment ({cluster_ocp_version},
# {maas_model}, {maas_endpoint}) are now passed to workshop-config. This path passed NONE of them,
# so an RHDP-deployed workshop served the sentinels from content/antora.yml by construction — an SA
# read a literal `set-from-cluster` on screen in front of a customer. Adds the deployer-asserted
# `showroom.ocpVersion` (a live read is impossible under Argo's `helm template`), threads
# litemaas.apiUrl/model through, and adds the `ogsr-cockpit-attributes` hook + a UserInfo notice so
# a remaining gap is announced at deploy time instead of on a page. Same load-bearing bump as 0.4.0:
# hook + values changes, and Argo's manifest cache can re-serve a stale render across an unchanged
# chart version (it survives SHA changes and Redis flushes) — which would make this fix a no-op.
version: 0.5.1
appVersion: "1.0.0"
