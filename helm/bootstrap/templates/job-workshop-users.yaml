# =============================================================================
# Cluster sign-in + cluster config (Sync hook, wave -8) — the declarative twin of
# bootstrap/install.sh's [2/6] cluster steps and its ogsr-idp-migrate.sh. Attendees sign in
# through RHDP's Keycloak IdP (`rhbk`); workshop-config's cluster-idp-users hook keeps
# user1..N in its realm. This Job only retires an older deploy's `workshop-users` HTPasswd
# IdP (test+remove, never a full-list apply) and its Identities, so oauth-openshift has ONE
# redirect-type IdP and every cockpit tab signs in inside its frame. A cluster with no
# OpenID IdP is not an FSC target: use bootstrap/install.sh (it provisions one).
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: ogsr-workshop-users
  namespace: {{ .Values.namespaces.system }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-8"
  labels:
    {{- include "ogsr-bootstrap.ownerLabels" . | nindent 4 }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "ogsr-bootstrap.ownerLabels" . | nindent 8 }}
    spec:
      serviceAccountName: ogsr-bootstrap
      restartPolicy: Never
      containers:
        - name: apply
          image: {{ .Values.images.cli }}
          command: ["/bin/bash", "-c"]
          env:
            - name: CONFIG_NS
              value: {{ .Values.namespaces.config | quote }}
          args:
            - |
              set -euo pipefail
              ok(){ echo "✅ $*"; }

              # Retire a legacy `workshop-users` HTPasswd IdP (same steps as bootstrap/ogsr-idp-migrate.sh):
              # entry removed by test+remove, its Identities deleted and dropped from their Users (the
              # next Keycloak sign-in claims the same User), its Secret deleted. Refuses to remove it
              # when no OpenID IdP would remain.
              names="$(oc get oauth cluster -o jsonpath='{range .spec.identityProviders[*]}{.name}{"\t"}{.type}{"\n"}{end}')"
              idx=-1; i=0; openid=0
              while IFS=$'\t' read -r n t; do
                [[ -n "$n" ]] || continue
                [[ "$n" == workshop-users && "$idx" -lt 0 ]] && idx="$i"
                [[ "$t" == OpenID ]] && openid=$((openid + 1))
                i=$((i + 1))
              done <<< "$names"
              if [[ "$idx" -ge 0 && "$openid" -ge 1 ]]; then
                oc patch oauth cluster --type=json -p "[{\"op\":\"test\",\"path\":\"/spec/identityProviders/${idx}/name\",\"value\":\"workshop-users\"},{\"op\":\"remove\",\"path\":\"/spec/identityProviders/${idx}\"}]" >/dev/null
                ok "removed legacy OAuth IdP 'workshop-users' (other IdPs untouched)"
              elif [[ "$idx" -ge 0 ]]; then
                echo "❌ legacy IdP 'workshop-users' kept: no OpenID IdP would remain (not an RHDP cluster?)"; exit 1
              fi
              ids="$(oc get identities -o jsonpath='{range .items[?(@.providerName=="workshop-users")]}{.metadata.name}{"\t"}{.user.name}{"\n"}{end}')"
              while IFS=$'\t' read -r id u; do
                [[ -n "$id" ]] || continue
                oc delete identity "$id" >/dev/null
                if [[ -n "$u" ]] && oc get user "$u" >/dev/null 2>&1; then
                  keep=""
                  for x in $(oc get user "$u" -o jsonpath='{.identities[*]}'); do
                    [[ "$x" == "$id" ]] || keep="${keep:+${keep},}\"${x}\""
                  done
                  oc patch user "$u" --type=merge -p "{\"identities\":[${keep}]}" >/dev/null
                fi
                ok "identity ${id} removed; user/${u} kept"
              done <<< "$ids"
              oc delete secret htpasswd-workshop-users -n "$CONFIG_NS" --ignore-not-found >/dev/null
              _idps="$(oc get oauth cluster -o jsonpath='{.spec.identityProviders[*].name}')"
              ok "cluster sign-in providers: ${_idps:-none}"

              # ImageStream imports only from the workshop's registries (dedicated cluster). Same list
              # and reasoning as bootstrap/install.sh step 2a''; never registrySources.
              oc patch image.config.openshift.io/cluster --type=merge \
                -p '{"spec":{"allowedRegistriesForImport":[{"domainName":"registry.redhat.io"},{"domainName":"registry.access.redhat.com"},{"domainName":"quay.io"},{"domainName":"image-registry.openshift-image-registry.svc:5000"}]}}' >/dev/null
              ok "image import allowlist applied"

              # Self-provisioning off + the project-request template (bootstrap/install.sh step 2a''').
              oc annotate clusterrolebinding self-provisioners rbac.authorization.kubernetes.io/autoupdate=false --overwrite >/dev/null
              oc patch clusterrolebinding self-provisioners --type=merge -p '{"subjects":null}' >/dev/null
              oc patch project.config.openshift.io/cluster --type=merge -p '{"spec":{"projectRequestTemplate":{"name":"project-request"}}}' >/dev/null
              ok "self-provisioning off; project-request template set"

              # Cockpit tabs embed: router drops X-Frame-Options, sets frame-ancestors (install.sh step 2a'''').
              _frame_domain="$(oc get ingresses.config cluster -o jsonpath='{.spec.domain}')"
              oc patch ingresscontroller/default -n openshift-ingress-operator --type=merge -p "{\"spec\":{\"httpHeaders\":{\"actions\":{\"response\":[{\"name\":\"X-Frame-Options\",\"action\":{\"type\":\"Delete\"}},{\"name\":\"Content-Security-Policy\",\"action\":{\"type\":\"Set\",\"set\":{\"value\":\"frame-ancestors 'self' https://*.${_frame_domain}\"}}}]}}}}" >/dev/null
              ok "router frame headers set"
              # Router tolerates the batch-pool taint, or a one-replica-per-worker router's rollout stalls
              # at N-1 (bootstrap/install.sh step 2a'''' has the full reasoning).
              oc patch ingresscontroller/default -n openshift-ingress-operator --type=merge -p '{"spec":{"nodePlacement":{"tolerations":[{"key":"workshop.redhat.com/pool","operator":"Equal","value":"batch","effect":"NoSchedule"}]}}}' >/dev/null
              ok "router tolerates the batch-pool taint"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 512Mi
