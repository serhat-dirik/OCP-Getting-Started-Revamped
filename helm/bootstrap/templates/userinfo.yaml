# =============================================================================
# RHDP UserInfo ConfigMap (sync-wave -1) — the `demo.redhat.com/userinfo` label
# tells RHDP to surface this ConfigMap's data keys to the requester (access URLs,
# roster, the shared non-secret password). URLs are deterministic from
# deployer.domain, so this renders early — the requester sees access info while the
# child apps are still deploying.
# =============================================================================
{{- $domain := .Values.deployer.domain }}
{{- /* Which of the three per-deployment cockpit attributes this order did NOT supply. Rendered
       into a content_notice key below, so a deployer learns the served pages will carry a
       placeholder BEFORE they present from them — the failure this guards was found by an SA
       reading a literal sentinel on screen in front of a customer, which is the last possible
       moment to find it. Render-time knowledge only (which values were passed), so it needs no
       cluster read; job-cockpit-attributes.yaml does the live comparison after the sync and
       prints the exact string that closes each gap. The key is omitted entirely when nothing is
       missing: a row that always says "fine" is a row nobody reads. */ -}}
{{- $missing := list -}}
{{- if not (include "ogsr-bootstrap.cockpitOcpVersion" .) -}}{{- $missing = append $missing "{cluster_ocp_version} — the OpenShift release the pages name. Fix: showroom.ocpVersion=<oc get clusterversion version -o jsonpath='{.status.desired.version}'>" -}}{{- end -}}
{{- if eq (include "ogsr-bootstrap.lightspeedEnabled" .) "true" -}}
{{- if not (include "ogsr-bootstrap.cockpitMaasModel" .) -}}{{- $missing = append $missing "{maas_model} — the model name the AI pages introduce. Fix: pin litemaas.model (the modules still use the model discovered in-cluster; only the pages are wrong)" -}}{{- end -}}
{{- if not (include "ogsr-bootstrap.cockpitMaasEndpoint" .) -}}{{- $missing = append $missing "{maas_endpoint} — the model endpoint the AI pages name. Fix: set litemaas.apiUrl" -}}{{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ogsr-userinfo
  namespace: {{ .Values.namespaces.system }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    demo.redhat.com/userinfo: ""
    {{- include "ogsr-bootstrap.ownerLabels" . | nindent 4 }}
data:
  demo_title: "OpenShift Application Platform — Getting Started"
  access_instructions: |
    Each attendee has their own Showroom cockpit (lab guide + in-browser terminal +
    console/tool tabs). Open your showroom_url below and log in to the OpenShift
    console with your username and the shared workshop password. Child Applications
    (platform stacks + workshop layer) keep deploying for ~15-25 min after the order
    reports Ready — track them in the Argo CD UI (argocd_url).
  console_url: "https://console-openshift-console.{{ $domain }}"
  argocd_url: "https://openshift-gitops-server-{{ .Values.argocd.namespace }}.{{ $domain }}"
  gitea_url: "https://{{ include "ogsr-bootstrap.giteaHost" . }}"
  cluster_domain: {{ $domain | quote }}
{{- if $missing }}
  content_notice: |
    HEADS UP — some of what the lab pages say about THIS environment was not set for this
    deployment, so it renders a visible placeholder instead of the real value. The workshop itself
    is unaffected; what is wrong is the page's claim about this cluster — which is exactly the
    sentence a presenter reads out loud. Check before you present:
    {{- range $missing }}
      - {{ . }}
    {{- end }}
    Set them on the order and re-sync the field-content Application. For the exact values, see the
    ogsr-cockpit-attributes Job log in {{ .Values.namespaces.system }} — it reads this cluster and
    prints the string that closes each gap.
{{- end }}
  workshop_users: {{ include "ogsr-bootstrap.userList" . | quote }}
  workshop_password: {{ .Values.workshop_user_password | quote }}
  showroom_urls: |
    {{- if .Values.multi_user.users }}
    {{- range .Values.multi_user.users }}
    {{ .username }}: https://showroom-{{ .username }}.{{ $domain }}
    {{- end }}
    {{- else }}
    {{- range $i := until (int .Values.multi_user.num_users) }}
    {{ printf "%s%d" $.Values.multi_user.userPrefix (add $i 1) }}: https://showroom-{{ printf "%s%d" $.Values.multi_user.userPrefix (add $i 1) }}.{{ $domain }}
    {{- end }}
    {{- end }}
