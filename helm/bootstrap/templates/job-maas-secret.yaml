{{- if .Values.litemaas.enabled }}
# =============================================================================
# MaaS secret (Sync hook, wave -8) — the declarative twin of bootstrap/install.sh's
# [2/6] steps 2b and 2b'. Materializes TWO secrets from the RHDP-injected litemaas.apiKey:
#
#   1. ALWAYS: {{ .Values.namespaces.system }}/ogsr-maas-credentials (apitoken + model + endpoint)
#      — the WORKSHOP'S OWN credential, which the AI entry states PREFER. Written whether or not
#      OpenShift Lightspeed is adopted. That "whether or not" is the whole point: on an adopted,
#      Azure-OpenAI-wired Lightspeed the modules previously had only Lightspeed's provider secret to
#      read, whose `Bearer` key is an Azure AD JWT for a different provider — it staged green and
#      returned 401 for every attendee (cluster ksls5, 2026-07-29).
#   2. GUARDED: openshift-lightspeed/credentials (apitoken) — skipped when Lightspeed is already
#      installed (olsconfig/cluster present), because it carries its own provider secret and we
#      NEVER overwrite it.
#
# Records lightspeed_ns_created / lightspeed_secret_created so the uninstall removes only what we
# made; ogsr-maas-credentials is torn down with the ogsr-system namespace. Enable the ai-assist stack
# (stacks.lightspeed) alongside so the OLSConfig that consumes secret 2 is deployed.
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: ogsr-maas-secret
  namespace: {{ .Values.namespaces.system }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-8"
  labels:
    {{- include "ogsr-bootstrap.ownerLabels" . | nindent 4 }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "ogsr-bootstrap.ownerLabels" . | nindent 8 }}
    spec:
      serviceAccountName: ogsr-bootstrap
      restartPolicy: Never
      containers:
        - name: maas
          image: {{ .Values.images.cli }}
          command: ["/bin/bash", "-c"]
          env:
            - name: STATE_NS
              value: {{ .Values.namespaces.system | quote }}
            - name: LS_NS
              value: {{ .Values.namespaces.lightspeed | quote }}
            - name: OWNER
              value: {{ .Values.owner | quote }}
            # Injected MaaS key — rendered straight into the in-cluster Secret (never committed).
            - name: MAAS_KEY
              value: {{ .Values.litemaas.apiKey | quote }}
            # Model travels WITH the credential (per-user MaaS key is model-scoped; the two clusters' keys
            # are scoped to OPPOSITE models — inverted-scope incident 2026-07-19). Written alongside
            # apitoken so the entry-states' converge Jobs prefer it over their chart fallback.
            - name: MAAS_MODEL
              value: {{ .Values.litemaas.model | default "llama-scout-17b" | quote }}
            # Endpoint travels with the credential for the same reason the model does: the entry states
            # read model+endpoint from the SAME secret the key came from, so a credential is never
            # paired with an endpoint it was not issued for.
            - name: MAAS_URL
              value: {{ .Values.litemaas.apiUrl | quote }}
          args:
            - |
              set -euo pipefail
              CM="ogsr-uninstall-state"
              ok(){ echo "✅ $*"; }; info(){ echo "▶ $*"; }
              record_once(){
                local k="$1" v="$2" cur
                cur="$(oc get configmap "$CM" -n "$STATE_NS" -o jsonpath="{.data['$k']}" 2>/dev/null || true)"
                [[ -n "$cur" ]] && return 0
                oc patch configmap "$CM" -n "$STATE_NS" --type merge -p "{\"data\":{\"$k\":\"$v\"}}" >/dev/null 2>&1 || true
              }

              [[ -n "$MAAS_KEY" ]] || { echo "❌ litemaas.enabled but litemaas.apiKey is empty"; exit 1; }

              # 1. The workshop's OWN credential — ALWAYS, adopted Lightspeed or not. endpoint travels
              # WITH key+model so the AI entry states never pair a credential from one source with an
              # endpoint from another (that mispairing is what broke M23 on ksls5).
              info "creating ${STATE_NS}/ogsr-maas-credentials (apitoken + model=${MAAS_MODEL} + endpoint) — the workshop's own MaaS credential"
              oc create secret generic ogsr-maas-credentials \
                --from-literal=apitoken="$MAAS_KEY" --from-literal=model="$MAAS_MODEL" \
                --from-literal=endpoint="$MAAS_URL" -n "$STATE_NS" \
                --dry-run=client -o yaml \
                | oc label --local -f - "workshop.redhat.com/owner=${OWNER}" --overwrite -o yaml \
                | oc apply -f - >/dev/null
              ok "ogsr-maas-credentials applied — the AI entry states prefer it over any adopted Lightspeed secret"

              # 2. The Lightspeed provider secret — only when Lightspeed is OURS to configure.
              if oc get olsconfig cluster >/dev/null 2>&1; then
                record_once lightspeed_preinstalled true
                ok "OpenShift Lightspeed pre-installed — leaving its provider secret untouched"
                exit 0
              fi

              if oc get namespace "$LS_NS" >/dev/null 2>&1; then
                record_once lightspeed_ns_created false
              else
                record_once lightspeed_ns_created true
                oc create namespace "$LS_NS" --dry-run=client -o yaml \
                  | oc label --local -f - "workshop.redhat.com/owner=${OWNER}" --overwrite -o yaml \
                  | oc apply -f - >/dev/null
              fi

              info "creating ${LS_NS}/credentials (apitoken + model=${MAAS_MODEL}) — MaaS token + model"
              oc create secret generic credentials \
                --from-literal=apitoken="$MAAS_KEY" --from-literal=model="$MAAS_MODEL" -n "$LS_NS" \
                --dry-run=client -o yaml \
                | oc label --local -f - "workshop.redhat.com/owner=${OWNER}" --overwrite -o yaml \
                | oc apply -f - >/dev/null
              record_once lightspeed_secret_created true
              ok "MaaS credentials secret applied (apitoken + model)"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 512Mi
{{- end }}
