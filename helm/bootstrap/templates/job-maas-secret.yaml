{{- if .Values.litemaas.enabled }}
# =============================================================================
# MaaS secret (Sync hook, wave -8) — the declarative twin of bootstrap/install.sh's
# [2/6] steps 2b and 2b'. Materializes TWO secrets from the RHDP-injected litemaas.apiKey:
#
#   1. ALWAYS: {{ .Values.namespaces.system }}/ogsr-maas-credentials (apitoken + model + endpoint)
#      — the WORKSHOP'S OWN credential, which the AI entry states PREFER. Written whether or not
#      OpenShift Lightspeed is adopted. That "whether or not" is the whole point: on an adopted,
#      Azure-OpenAI-wired Lightspeed the modules previously had only Lightspeed's provider secret to
#      read, whose `Bearer` key is an Azure AD JWT for a different provider — it staged green and
#      returned 401 for every attendee (a live cluster, 2026-07-29).
#   2. GUARDED: openshift-lightspeed/credentials (apitoken) — skipped when Lightspeed is already
#      installed (olsconfig/cluster present), because it carries its own provider secret and we
#      NEVER overwrite it.
#
# Records lightspeed_ns_created / lightspeed_secret_created so the uninstall removes only what we
# made; ogsr-maas-credentials is torn down with the ogsr-system namespace. Enable the ai-assist stack
# (stacks.lightspeed) alongside so the OLSConfig that consumes secret 2 is deployed.
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: ogsr-maas-secret
  namespace: {{ .Values.namespaces.system }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-8"
  labels:
    {{- include "ogsr-bootstrap.ownerLabels" . | nindent 4 }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "ogsr-bootstrap.ownerLabels" . | nindent 8 }}
    spec:
      serviceAccountName: ogsr-bootstrap
      restartPolicy: Never
      containers:
        - name: maas
          image: {{ .Values.images.cli }}
          command: ["/bin/bash", "-c"]
          env:
            - name: STATE_NS
              value: {{ .Values.namespaces.system | quote }}
            - name: LS_NS
              value: {{ .Values.namespaces.lightspeed | quote }}
            - name: OWNER
              value: {{ .Values.owner | quote }}
            # Injected MaaS key — rendered straight into the in-cluster Secret (never committed).
            - name: MAAS_KEY
              value: {{ .Values.litemaas.apiKey | quote }}
            # Model travels WITH the credential (per-user MaaS key is model-scoped; the two clusters' keys
            # are scoped to OPPOSITE models — inverted-scope incident 2026-07-19). Written alongside
            # apitoken so the entry-states' converge Jobs prefer it over their chart fallback.
            # EMPTY MEANS DISCOVER — never a hardcoded fallback. A guessed model that the key is
            # not scoped to is an HTTP 401 key_model_access_denied inside the AI modules, long
            # after the order said Ready (owner decision 2026-07-25; inverted-scope incident
            # 2026-07-19). Resolved against the live endpoint below.
            - name: MAAS_MODEL
              value: {{ .Values.litemaas.model | default "" | quote }}
            # Endpoint travels with the credential for the same reason the model does: the entry states
            # read model+endpoint from the SAME secret the key came from, so a credential is never
            # paired with an endpoint it was not issued for.
            - name: MAAS_URL
              value: {{ .Values.litemaas.apiUrl | quote }}
          args:
            - |
              set -euo pipefail
              CM="ogsr-uninstall-state"
              ok(){ echo "✅ $*"; }; info(){ echo "▶ $*"; }
              record_once(){
                local k="$1" v="$2" cur
                cur="$(oc get configmap "$CM" -n "$STATE_NS" -o jsonpath="{.data['$k']}" 2>/dev/null || true)"
                [[ -n "$cur" ]] && return 0
                oc patch configmap "$CM" -n "$STATE_NS" --type merge -p "{\"data\":{\"$k\":\"$v\"}}" >/dev/null 2>&1 || true
              }

              warn(){ echo "⚠️  $*" >&2; }; err(){ echo "❌ $*" >&2; }
              [[ -n "$MAAS_KEY" ]] || { err "litemaas.enabled but litemaas.apiKey is empty"; exit 1; }
              [[ -n "$MAAS_URL" ]] || { err "litemaas.enabled but litemaas.apiUrl is empty"; exit 1; }

              # ── RESOLVE + VALIDATE, THEN STAGE — never the reverse ───────────────────────────
              # Twin of bootstrap/install.sh's discover_maas_model(). Ask the OpenAI-compatible
              # endpoint what it actually serves and resolve the model from the answer. We never
              # guess a name: the per-user MaaS key is scoped to ONE model, so a name the key does
              # not cover returns HTTP 401 key_model_access_denied — inside the AI modules, at
              # workshop time, not here. The two clusters this workshop has run on had keys scoped
              # to OPPOSITE models (inverted-scope incident 2026-07-19).
              #
              # This doubles as the KEY's gate. A credential that the endpoint refuses is NOT
              # staged: on a live cluster (2026-07-29) an unvalidated key staged green and returned 401 for
              # every attendee. The entry states then degrade to an explicit "AI path unavailable"
              # instead of failing mid-module.
              #
              # The API key travels in an Authorization header only and is never printed, not even
              # on failure — LiteLLM's 401 body echoes the whole token back, so no body is captured.
              BASE="${MAAS_URL%/}"
              case "$BASE" in */v1) MODELS_URL="${BASE}/models" ;; *) MODELS_URL="${BASE}/v1/models" ;; esac
              info "discovering available models from ${MODELS_URL}"
              TMP="$(mktemp)"; trap 'rm -f "$TMP"' EXIT
              CODE="$(curl -sS --max-time 30 -o "$TMP" -w '%{http_code}' \
                        -H "Authorization: Bearer ${MAAS_KEY}" -H 'Accept: application/json' \
                        "$MODELS_URL" 2>/dev/null || echo 000)"
              # OpenAI list-models contract: {"object":"list","data":[{"id":"…"},…]}. No yq/jq in
              # this image — sed over the ids is enough for a flat list of quoted strings.
              IDS="$(sed -nE 's/.*"id"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' "$TMP" | grep . || true)"
              rm -f "$TMP"; trap - EXIT

              if [[ -z "$IDS" ]]; then
                err "model discovery failed — GET ${MODELS_URL} returned HTTP ${CODE} with no model list."
                err "   401/403 → litemaas.apiKey is wrong, expired, or not entitled on this endpoint"
                err "   404     → litemaas.apiUrl is not an OpenAI-compatible base (it should end in /v1)"
                err "   000     → endpoint unreachable from this cluster (DNS / proxy / TLS / egress)"
                warn "NOT staging the credential — a key that failed its gate must never reach the modules."
                warn "   The AI beats (agentic-ai, ai-assisted-development, app-modernization,"
                warn "   jobs-batch-kueue) will report 'AI path unavailable'; every other module is unaffected."
                warn "   To enable them: fix litemaas.apiUrl / litemaas.apiKey on the order, re-sync, then"
                warn "   ws reset <module> --user <userN> for each AI module."
                # Exit 0, not 1: an unusable optional credential must not deny the operator the other
                # 22 modules. The same trade bootstrap/install.sh makes on an adopted-Lightspeed
                # cluster — and the modules record their own explicit aiPathAvailable=false verdict.
                exit 0
              fi

              COUNT="$(printf '%s\n' "$IDS" | grep -c . | tr -d ' ')"
              if [[ -n "$MAAS_MODEL" ]]; then
                # here-string, not `printf | grep -qxF`: under pipefail an early match can SIGPIPE
                # the producer and a genuine match then reads as a non-match.
                if grep -qxF "$MAAS_MODEL" <<< "$IDS"; then
                  ok "litemaas.model '${MAAS_MODEL}' confirmed — the endpoint offers it (${COUNT} model(s) available)"
                else
                  warn "litemaas.model '${MAAS_MODEL}' is NOT among the ${COUNT} model(s) ${MODELS_URL} offers — using it anyway because you set it explicitly."
                  warn "   endpoint offers: $(printf '%s' "$IDS" | tr '\n' ' ')"
                  warn "   if the AI modules fail with key_model_access_denied, this is why — pin one of the names above."
                fi
              else
                MAAS_MODEL="$(printf '%s\n' "$IDS" | head -1)"
                if [[ "$COUNT" == "1" ]]; then
                  ok "model discovered: ${MAAS_MODEL} (the only model this endpoint offers)"
                else
                  ok "model discovered: ${MAAS_MODEL} (first of ${COUNT}: $(printf '%s' "$IDS" | tr '\n' ' '))"
                  info "   set litemaas.model to pin a different one if your key is scoped elsewhere"
                fi
              fi

              # 1. The workshop's OWN credential — ALWAYS, adopted Lightspeed or not. endpoint travels
              # WITH key+model so the AI entry states never pair a credential from one source with an
              # endpoint from another (that mispairing is what broke M23 on a live cluster).
              info "creating ${STATE_NS}/ogsr-maas-credentials (apitoken + model=${MAAS_MODEL} + endpoint) — the workshop's own MaaS credential"
              oc create secret generic ogsr-maas-credentials \
                --from-literal=apitoken="$MAAS_KEY" --from-literal=model="$MAAS_MODEL" \
                --from-literal=endpoint="$MAAS_URL" -n "$STATE_NS" \
                --dry-run=client -o yaml \
                | oc label --local -f - "workshop.redhat.com/owner=${OWNER}" --overwrite -o yaml \
                | oc apply -f - >/dev/null
              ok "ogsr-maas-credentials applied — the AI entry states prefer it over any adopted Lightspeed secret"

              # 2. The Lightspeed provider secret — only when Lightspeed is OURS to configure.
              if oc get olsconfig cluster >/dev/null 2>&1; then
                record_once lightspeed_preinstalled true
                ok "OpenShift Lightspeed pre-installed — leaving its provider secret untouched"
                exit 0
              fi

              if oc get namespace "$LS_NS" >/dev/null 2>&1; then
                record_once lightspeed_ns_created false
              else
                record_once lightspeed_ns_created true
                oc create namespace "$LS_NS" --dry-run=client -o yaml \
                  | oc label --local -f - "workshop.redhat.com/owner=${OWNER}" --overwrite -o yaml \
                  | oc apply -f - >/dev/null
              fi

              info "creating ${LS_NS}/credentials (apitoken + model=${MAAS_MODEL}) — MaaS token + model"
              oc create secret generic credentials \
                --from-literal=apitoken="$MAAS_KEY" --from-literal=model="$MAAS_MODEL" -n "$LS_NS" \
                --dry-run=client -o yaml \
                | oc label --local -f - "workshop.redhat.com/owner=${OWNER}" --overwrite -o yaml \
                | oc apply -f - >/dev/null
              record_once lightspeed_secret_created true
              ok "MaaS credentials secret applied (apitoken + model)"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 512Mi
{{- end }}
