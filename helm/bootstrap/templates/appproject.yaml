# AppProject for the platform Applications this chart creates — the declarative twin of the one
# platform-portfolio/argocd-bootstrap/install.sh applies on the script path. Keep the two in step.
# Sync-wave -1 so it exists before the Applications that name it; an Application referencing a
# missing project never syncs, and the error points at the Application rather than the cause.
{{- if ne .Values.argocd.project "default" }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Values.argocd.project }}
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    portfolio.redhat.com/layer: platform
    demo.redhat.com/application: {{ .Values.demoApplication | quote }}
    {{- include "ogsr-bootstrap.ownerLabels" . | nindent 4 }}
spec:
  description: Platform portfolio stacks (operators, third-party tools, platform config)
  # Both install phases: the external repo RHDP points this chart at (wave 0, the mirror anchor)
  # and the in-cluster Gitea mirror everything else sources from (wave 1+).
  sourceRepos:
    - {{ trimSuffix ".git" .Values.gitops.repoURL | quote }}
    - {{ printf "%s.git" (trimSuffix ".git" .Values.gitops.repoURL) | quote }}
    - {{ trimSuffix ".git" (include "ogsr-bootstrap.mirrorRepoURL" .) | quote }}
    - {{ include "ogsr-bootstrap.mirrorRepoURL" . | quote }}
  # Namespace patterns, not a resource-kind allow-list — see the comment in
  # platform-portfolio/argocd-bootstrap/appproject.template.yaml for the reasoning.
  destinations:
    - {server: https://kubernetes.default.svc, namespace: 'ogsr-*'}
    - {server: https://kubernetes.default.svc, namespace: 'openshift-*'}
    - {server: https://kubernetes.default.svc, namespace: '*-operator'}
    - {server: https://kubernetes.default.svc, namespace: 'istio-*'}
    - {server: https://kubernetes.default.svc, namespace: 'knative-*'}
    - {server: https://kubernetes.default.svc, namespace: 'trust*'}
    - {server: https://kubernetes.default.svc, namespace: 'sso-*'}
    - {server: https://kubernetes.default.svc, namespace: rhdh}
    - {server: https://kubernetes.default.svc, namespace: rhtpa}
    - {server: https://kubernetes.default.svc, namespace: skupper}
    - {server: https://kubernetes.default.svc, namespace: sonarqube}
    - {server: https://kubernetes.default.svc, namespace: stackrox}
    # The workshop layer rides the same project: per-user namespaces (userN-dev, userN-cicd, …)
    # plus the bare `openshift` namespace the shared Java 21 ImageStream lands in — neither is
    # matched by the platform patterns above, and both are what workshop-config deploys into.
    - {server: https://kubernetes.default.svc, namespace: '{{ .Values.multi_user.userPrefix }}*'}
    - {server: https://kubernetes.default.svc, namespace: openshift}
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
{{- end }}
