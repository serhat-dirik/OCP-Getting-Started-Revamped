# =============================================================================
# App-of-apps — child Argo CD Applications (reuse platform-portfolio/stacks/* and
# gitops/workshop-config; nothing duplicated here).
# =============================================================================
# Two-phase git-localize, expressed through sync-waves:
#   wave 0  pp-core-devtools  — sourced from GitHub (gitops.repoURL). It is the MIRROR
#           ANCHOR: its own internal waves deploy gitea (wave 0) then the git-mirror job
#           (wave 1). It must come from GitHub because it CONTAINS the mirror-builder — you
#           cannot source the thing that builds the mirror from the mirror it builds.
#   wave 1  pp-batch [+ pp-ai-assist / pp-auth / pp-resilience]  — sourced FROM the
#           in-cluster mirror (the git-localize payoff); Argo gates this wave on
#           pp-core-devtools becoming Healthy, i.e. after the mirror job has populated Gitea.
#   wave 2  workshop-config  — the workshop layer, sourced FROM the mirror (exactly the
#           source bootstrap/install.sh step 5 uses today).
# Naming matches install.sh (pp-<stack>, workshop-config) so ogsr-uninstall.sh treats an
# FSC install identically to a script install.
# =============================================================================
{{- $root := . -}}
{{- $mirror := include "ogsr-bootstrap.mirrorRepoURL" . -}}
{{- $rev := .Values.gitops.revision -}}

# --- wave 0: core-devtools (mirror anchor: gitea + git-mirror + dev tooling) ----------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pp-core-devtools
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    portfolio.redhat.com/stack: core-devtools
    demo.redhat.com/application: {{ .Values.demoApplication | quote }}
    {{- include "ogsr-bootstrap.ownerLabels" . | nindent 4 }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ $rev }}
    path: platform-portfolio/stacks/core-devtools
    kustomize:
      # Rewrite the stack's child Applications to this same repo/revision/project (as the portfolio
      # stack-app.template.yaml does), so the whole tree pins to the ordered source. The children
      # ship an unresolvable .invalid placeholder repoURL on purpose: a patch that stops matching
      # fails loudly instead of syncing from a repo nobody configured.
      patches:
        - target:
            kind: Application
          patch: |-
            - op: replace
              path: /spec/source/repoURL
              value: {{ .Values.gitops.repoURL }}
            - op: replace
              path: /spec/source/targetRevision
              value: {{ $rev }}
            - op: replace
              path: /spec/project
              value: {{ .Values.argocd.project }}
        # git-mirror only: which repo the in-cluster Gitea pull-mirrors. Always the EXTERNAL repo —
        # a mirror pointed at itself never sees another commit. Targets a name that exists only in
        # core-devtools; kustomize ignores a target that matches nothing.
        - target:
            kind: Application
            name: pp-git-mirror
          patch: |-
            - op: add
              path: /spec/source/kustomize
              value:
                patches:
                  - target:
                      kind: ConfigMap
                      name: git-mirror-repos-portfolio
                    patch: |-
                      - op: replace
                        path: /data/repos
                        value: |
                          {{ .Values.gitea.repo }}={{ .Values.gitops.repoURL }}
                      - op: replace
                        path: /data/revision
                        value: {{ $rev }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.argocd.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}

# --- wave 1: remaining platform stacks, sourced FROM the in-cluster mirror -------------
{{- /* progressive-delivery is baseline: M11 (core catalog) needs the Rollouts controller; the
     CRDs shipping with GitOps hide its absence (CRs apply, nothing reconciles) — QA 2026-07-18.
     The rest are DERIVED from module selection: the union of stacks the enabled modules require
     (ogsr-bootstrap.requiredStacks, from .Values.modulesDisabled + moduleCatalog), plus ai-assist
     when Lightspeed is on. No per-stack booleans here — module selection is the interface. */ -}}
{{- $mirrorStacks := list "batch" "progressive-delivery" -}}
{{- range $st := (splitList " " (include "ogsr-bootstrap.requiredStacks" $root)) -}}
{{- if $st }}{{ $mirrorStacks = append $mirrorStacks $st }}{{- end -}}
{{- end -}}
{{- if eq (include "ogsr-bootstrap.lightspeedEnabled" $root) "true" }}{{ $mirrorStacks = append $mirrorStacks "ai-assist" }}{{- end -}}
{{- range $stack := $mirrorStacks }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pp-{{ $stack }}
  namespace: {{ $root.Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    portfolio.redhat.com/stack: {{ $stack | quote }}
    demo.redhat.com/application: {{ $root.Values.demoApplication | quote }}
    {{- include "ogsr-bootstrap.ownerLabels" $root | nindent 4 }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $root.Values.argocd.project }}
  source:
    repoURL: {{ $mirror }}
    targetRevision: {{ $rev }}
    path: platform-portfolio/stacks/{{ $stack }}
    kustomize:
      patches:
        - target:
            kind: Application
          patch: |-
            - op: replace
              path: /spec/source/repoURL
              value: {{ $mirror }}
            - op: replace
              path: /spec/source/targetRevision
              value: {{ $rev }}
            - op: replace
              path: /spec/project
              value: {{ $root.Values.argocd.project }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $root.Values.argocd.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
{{- end }}

# --- wave 2: workshop layer (users, RBAC, quotas, entry-state AppProject, showroom,
#     Gitea seeding), sourced FROM the mirror — the git-localize payoff -----------------
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workshop-config
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    workshop.redhat.com/layer: workshop-config
    demo.redhat.com/application: {{ .Values.demoApplication | quote }}
    {{- include "ogsr-bootstrap.ownerLabels" . | nindent 4 }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ $mirror }}
    targetRevision: {{ $rev }}
    path: gitops/workshop-config
    helm:
      parameters:
        - name: userCount
          value: {{ .Values.multi_user.num_users | quote }}
        - name: clusterDomain
          value: {{ .Values.deployer.domain | quote }}
        # Seed per-user realm-{user} imports only when the auth stack is installed — i.e. when the
        # securing-apps-keycloak module is enabled (or auth is forced via the expert override).
        - name: sso.enabled
          value: {{ has "auth" (splitList " " (include "ogsr-bootstrap.requiredStacks" .)) | quote }}
        # Console plugins (backlog #24) — ON by default, matching bootstrap/vars.yaml's
        # `console_plugins` (also default-on); set consolePlugins.enabled=false to opt out.
        # The merge is always append-if-absent and only for plugins whose operator is present.
        - name: consolePlugins.enabled
          value: {{ .Values.consolePlugins.enabled | quote }}
        # Modules hidden from the attendee showroom nav/library (comma-joined slugs; "" = none).
        # workshop-config renders one hide-attribute per slug into each cockpit's Antora build.
        - name: modulesDisabledCSV
          value: {{ include "ogsr-bootstrap.disabledSlugsCSV" . | quote }}
        # The two in-cluster BuildConfigs (Parasol images, showroom antora-ext) clone the workshop
        # source directly, so they follow gitops.repoURL too — otherwise a fork/FSC order would
        # build its cockpit and app images from the upstream project.
        - name: parasolImages.build.repoUrl
          value: {{ printf "%s.git" (trimSuffix ".git" .Values.gitops.repoURL) | quote }}
        - name: parasolImages.build.revision
          value: {{ $rev | quote }}
        - name: showroom.build.repoUrl
          value: {{ printf "%s.git" (trimSuffix ".git" .Values.gitops.repoURL) | quote }}
        - name: showroom.build.revision
          value: {{ $rev | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.argocd.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
