---
# THE OBJECT-SET DETECTORS, both directions in one fixture. canary-dev matches the source exactly
# (so no `value` finding can mask the result); canary-cicd is MISSING entirely (-> absent-copy, the
# shape of "a suffix was added to workshop-config and never to quotaSpec"); and canary-extra exists
# only here (-> absent-source, the shape of "the copy renders a namespace the workshop does not
# actually provision"). Neither is visible to a field-by-field comparison, which only ever runs on
# objects BOTH sides render — which is exactly why they need their own case.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workshop-quota
  namespace: canary-dev
spec:
  hard:
    requests.cpu: 1
    requests.memory: 6Gi
    limits.cpu: "8"
    limits.memory: 12Gi
    pods: 30
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workshop-limits
  namespace: canary-dev
spec:
  limits:
    - type: Container
      default:
        cpu: 1500m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workshop-quota
  namespace: canary-extra
spec:
  hard:
    requests.cpu: 1
    requests.memory: 6Gi
    limits.cpu: "8"
    limits.memory: 12Gi
    pods: 30
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workshop-limits
  namespace: canary-extra
spec:
  limits:
    - type: Container
      default:
        cpu: 1500m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
