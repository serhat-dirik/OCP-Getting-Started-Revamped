---
# THE REAL DEFECT, REPRODUCED. Identical to copy-clean except the two numbers commit 13ed4ef moved:
# this side kept LimitRange default.cpu at 500m and ResourceQuota limits.cpu at 6 while the source
# went to 1500m and 8. That is byte-for-byte the state gitops/user-namespace was in on 2026-08-14,
# and it is what the `value` detector has to catch. Everything else matches, so a `value` finding is
# the ONLY kind this fixture may produce.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workshop-quota
  namespace: canary-dev
  labels:
    workshop.redhat.com/owner: ogsr
spec:
  hard:
    requests.cpu: 1000m
    requests.memory: 6Gi
    limits.cpu: "6"
    limits.memory: 12Gi
    pods: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workshop-limits
  namespace: canary-dev
  labels:
    workshop.redhat.com/owner: ogsr
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workshop-quota
  namespace: canary-cicd
  labels:
    workshop.redhat.com/owner: ogsr
spec:
  hard:
    requests.cpu: 1000m
    requests.memory: 6Gi
    limits.cpu: "6"
    limits.memory: 12Gi
    pods: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workshop-limits
  namespace: canary-cicd
  labels:
    workshop.redhat.com/owner: ogsr
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 2Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
