---
# The SOURCE side of every canary pair — stands in for gitops/workshop-config's per-user-*.yaml.
# Deliberately spells its quantities the way a hand-written chart does: bare ints for `requests.cpu`
# and `pods`, a quoted string for `limits.cpu`. The clean copy spells the SAME quantities
# differently, which is how the normalizer gets proven by a fixture rather than only by assertion.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workshop-quota
  namespace: canary-dev
spec:
  hard:
    requests.cpu: 1
    requests.memory: 6Gi
    limits.cpu: "8"
    limits.memory: 12Gi
    pods: 30
---
# LimitRange default.cpu is THE field commit 13ed4ef moved; the drifted copy reverts exactly it.
apiVersion: v1
kind: LimitRange
metadata:
  name: workshop-limits
  namespace: canary-dev
spec:
  limits:
    - type: Container
      default:
        cpu: 1500m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
---
# A second namespace, so "one namespace missing" is a detectable state rather than an empty side.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workshop-quota
  namespace: canary-cicd
spec:
  hard:
    requests.cpu: 1
    requests.memory: 6Gi
    limits.cpu: "8"
    limits.memory: 12Gi
    pods: 30
---
# The -cicd fixture carries the larger memory default, mirroring the real chart's cicd branch.
apiVersion: v1
kind: LimitRange
metadata:
  name: workshop-limits
  namespace: canary-cicd
spec:
  limits:
    - type: Container
      default:
        cpu: 1500m
        memory: 2Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
