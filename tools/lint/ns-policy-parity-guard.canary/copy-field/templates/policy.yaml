---
# THE FIELD-SET DETECTORS. Every object exists on both sides and every SHARED field matches, so the
# `value` and `absent-*` detectors must all stay silent. What differs is which fields are set at
# all: canary-dev's quota DROPS `pods` (-> field-absent-copy) and ADDS `persistentvolumeclaims`
# (-> field-absent-source), and its LimitRange drops `defaultRequest.memory`.
#
# This is not a hypothetical shape: quotaSpec's `pvc: ""` convention means "omit
# persistentvolumeclaims from hard", so a suffix gaining or losing that field is one edit away, and
# a comparison that only looked at fields both sides set would call it clean.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workshop-quota
  namespace: canary-dev
spec:
  hard:
    requests.cpu: 1
    requests.memory: 6Gi
    limits.cpu: "8"
    limits.memory: 12Gi
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workshop-limits
  namespace: canary-dev
spec:
  limits:
    - type: Container
      default:
        cpu: 1500m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workshop-quota
  namespace: canary-cicd
spec:
  hard:
    requests.cpu: 1
    requests.memory: 6Gi
    limits.cpu: "8"
    limits.memory: 12Gi
    pods: 30
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workshop-limits
  namespace: canary-cicd
spec:
  limits:
    - type: Container
      default:
        cpu: 1500m
        memory: 2Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
