---
# THE CLEAN CONTROL. Same policy as source/, deliberately differing in every way the REAL pair
# differs and in every way the quantity normalizer is supposed to absorb:
#   * sync-wave / sync-options annotations and an owner label the source has no use for
#   * different comments, different key order
#   * `requests.cpu: 1000m` against the source's `1`, `limits.cpu: 8` against `"8"`,
#     `pods: "30"` against `30` — same objects once applied
# If the guard ever starts flagging any of that, this canary reports findings, the self-test exits 2
# instead of 1, and CI fails. That is the point of making the clean fixture NON-identical.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workshop-quota
  namespace: canary-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    workshop.redhat.com/owner: ogsr
spec:
  hard:
    limits.memory: 12Gi
    limits.cpu: 8
    pods: "30"
    requests.cpu: 1000m
    requests.memory: 6Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workshop-limits
  namespace: canary-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    workshop.redhat.com/owner: ogsr
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 256Mi
        cpu: 100m
      default:
        memory: 1Gi
        cpu: 1500m
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workshop-quota
  namespace: canary-cicd
  labels:
    workshop.redhat.com/owner: ogsr
spec:
  hard:
    requests.cpu: 1000m
    requests.memory: 6Gi
    limits.cpu: 8
    limits.memory: 12Gi
    pods: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workshop-limits
  namespace: canary-cicd
  labels:
    workshop.redhat.com/owner: ogsr
spec:
  limits:
    - type: Container
      default:
        cpu: 1500m
        memory: 2Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
