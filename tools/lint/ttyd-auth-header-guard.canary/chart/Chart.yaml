---
# Canary fixture for tools/lint/ttyd-auth-header-guard.py. NOT a workshop chart — it is never
# installed anywhere, and chart discovery in the real run deliberately excludes every path
# containing `.canary` so these deliberate defects can never redden the tree scan.
#
# It exists so the guard can prove, on every CI run, that each of its detectors actually fires
# before anyone believes a clean result on gitops/workshop-config. The shapes it plants are the
# ones that cost an evening on 2026-08-16 plus the near-misses that must stay quiet:
#
#   clean.yaml           the real cockpit's shape, plus four decoys that MUST NOT fire
#   broken-token.yaml    the exact measured regression — the access token interpolated into the
#                        header ttyd reads, positioned AFTER a `;` that sits inside the quotes
#   broken-variants.yaml a renamed + re-cased header, a `map` that forwards, a `set` that
#                        forwards, an over-length literal, and an empty value
apiVersion: v2
name: ttyd-auth-header-guard-canary
description: Static fixture chart for the ttyd auth-header guard's self-test.
type: application
version: 0.1.0
appVersion: "0.1.0"
