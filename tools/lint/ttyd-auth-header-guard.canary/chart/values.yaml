---
# THE VARIABLE NAMES AND THE HEADER NAMES ARE VALUES, NOT LITERALS IN THE TEMPLATES — on purpose.
# The guard RENDERS rather than greps, and this is what proves it: `grep -n
# 'http_x_forwarded_access_token' templates/` finds nothing in broken-token.yaml, because the token
# variable only exists after `helm template` has run. A grep-based guard would report that file
# clean.
tokenVar: $http_x_forwarded_access_token
userVar: $http_x_forwarded_user

# The header ttyd is told to read. Both halves of every pair below come from values so that the
# guard has to FOLLOW `-H` to the `proxy_set_header` line rather than recognise a fixed string.
sharedHeader: X-Ws-Session

# The rename case. `ttydFlagName` and `nginxFieldName` are the SAME header in different case —
# HTTP field names are case-insensitive and libwebsockets lowercases them, so a guard that compares
# them literally would report this cockpit clean while its terminals were dead.
renamedTtydFlagName: X-Cockpit-Identity
renamedNginxFieldName: x-cockpit-identity

# 34 characters of literal, no variables: over the measured deny floor (30) with nothing left to
# reason about at runtime.
overlongLiteral: uuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuu
