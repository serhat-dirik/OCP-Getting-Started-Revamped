# CANARY. `resources:` is a SCALAR, not a list — a plausible typo that kustomize rejects and that
# leaves nothing in the repo able to say what this stack ships. An ABSENT resources: is fine (some
# stacks compose other ways) and must stay silent; a malformed one must not, because every consumer
# now depends on the reader's answer and the reader has no answer to give here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: apps/only-one.yaml
