---
# Emitted at BOTH solve values. Four workshop containers live here — one violating, three compliant —
# plus three upstream containers that the guard must leave alone.
#
# why: the plain, obvious shape. If this one ever stops being reported the guard has gone blind in the
# simplest case, and everything below it is worthless.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-plain-bad
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary-plain-bad
  template:
    metadata:
      labels:
        app: canary-plain-bad
    spec:
      containers:
        # A workshop-built image with NO imagePullPolicy — Kubernetes defaults a non-:latest tag to
        # IfNotPresent, so a node with `1.1` cached serves the old layers. THE defect.
        - name: claims
          image: {{ .Values.workshopImage }}
---
# why: the compliant twin. Proves the guard does not simply flag every workshop image it sees.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-plain-good
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary-plain-good
  template:
    metadata:
      labels:
        app: canary-plain-good
    spec:
      containers:
        - name: claims
          image: {{ .Values.workshopImage }}
          imagePullPolicy: Always
---
# why: initContainers and a per-user built image ({user}-dev, the packaging-distributing shape).
# Both are workshop-built and both are compliant, so this document must contribute two clean
# workshop containers and zero findings.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-init-good
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary-init-good
  template:
    metadata:
      labels:
        app: canary-init-good
    spec:
      initContainers:
        - name: seed
          image: {{ .Values.internalRegistry }}/{{ .Values.user }}{{ .Values.userBuiltImageSuffix }}
          imagePullPolicy: Always
      containers:
        - name: notifications
          image: {{ .Values.internalRegistry }}/{{ .Values.user }}{{ .Values.userBuiltImageSuffix }}
          imagePullPolicy: Always
---
# why: the negative side of the classifier. None of these three is ours — the Samples Operator
# imagestream in the cluster-owned `openshift` namespace, an upstream :latest (already Always by
# Kubernetes default) and a version-pinned vendor image. All are policy-free on purpose: if the
# classifier ever widens, this document turns the mistake into a self-test failure instead of a
# repo-wide false alarm.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-upstream-untouched
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary-upstream-untouched
  template:
    metadata:
      labels:
        app: canary-upstream-untouched
    spec:
      containers:
        - name: db
          image: {{ .Values.clusterImage }}
        - name: showcase
          image: {{ .Values.upstreamLatestImage }}
        - name: udi
          image: {{ .Values.upstreamPinnedImage }}
