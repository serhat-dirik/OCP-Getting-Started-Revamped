---
# Same value vocabulary the real entry states use, so the fixture is rendered by exactly the same
# code path (and the same --set flags) as the charts this guard actually gates.
user: user1
clusterDomain: example.com
solve: false

# A shared workshop-built image: internal registry, non-`openshift` namespace, mutable tag.
workshopImage: image-registry.openshift-image-registry.svc:5000/ogsr-parasol-images/parasol-claims:1.1
# A per-user workshop-built image (the packaging-distributing BuildConfig shape). The `{user}-dev`
# namespace is interpolated in the template, so the classifier is exercised on a rendered value
# rather than a literal — the same way it meets the real charts.
userBuiltImageSuffix: -dev/parasol-notifications:1.0
internalRegistry: image-registry.openshift-image-registry.svc:5000
# Upstream images that must NEVER be demanded: the cluster's own Samples Operator imagestreams,
# a :latest (already Always by Kubernetes default) and a version-pinned vendor image.
clusterImage: image-registry.openshift-image-registry.svc:5000/openshift/postgresql:15-el9
upstreamLatestImage: quay.io/openshift-knative/showcase:latest
upstreamPinnedImage: registry.redhat.io/devspaces/udi-rhel9:3.29
