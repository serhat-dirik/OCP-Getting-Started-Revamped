---
# Canary fixture for tools/lint/image-pull-policy-guard.py. NOT a workshop entry state — it is never
# installed anywhere. It exists so the guard can prove, on every CI run, that each of its detectors
# actually fires before anyone believes a clean result on the real tree.
#
# It deliberately reproduces every SHAPE the real tree has, including the two that a line-oriented
# check cannot see: a Deployment emitted from a named template in _helpers.tpl (the config-multienv
# blind spot that swallowed this defect class twice) and a PodSpec nested inside an OpenShift
# Template.objects[] (registry-images-catalog-governance ships one).
apiVersion: v2
name: image-pull-policy-guard-canary
description: Static fixture chart for the image pull-policy guard's self-test.
type: application
version: 0.1.0
appVersion: "0.1.0"
