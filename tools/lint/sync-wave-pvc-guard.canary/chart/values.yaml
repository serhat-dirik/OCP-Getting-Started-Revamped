---
# The same value vocabulary the real charts use, so the fixture is rendered through exactly the same
# code path (and the same --set flags) as the charts this guard actually gates.
#
# `solve` mirrors the entry-state charts' solve world; `shared` mirrors gitops/workshop-config's
# showroom.shared.enabled — the flag that is FALSE by default and whose render carried the measured
# deadlock. Both gate extra objects below, so a guard that stopped rendering a permutation loses
# named expectations instead of quietly checking less.
solve: false
shared: false

# Two namespaces, so the (namespace, claimName) key that resolves a mount is exercised rather than
# assumed. Claim resolution is namespace-local on a cluster; a guard keyed on name alone would pair
# objects that can never see each other.
namespace: canary-ns
otherNamespace: canary-ns-b

# An Immediate-binding class from BINDING_MODES. Named through a value rather than inlined so the
# fixture reads like the real chart it imitates (jobs-batch-kueue passes its class as
# `datasetStorageClass`), and so a class removed from BINDING_MODES turns this into a blocker the
# self-test notices.
immediateClass: ocs-external-storagecluster-cephfs
