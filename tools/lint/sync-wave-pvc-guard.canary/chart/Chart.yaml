---
# Canary fixture for tools/lint/sync-wave-pvc-guard.py. NOT a workshop entry state — it is never
# installed anywhere. It exists so the guard can prove, on every CI run, that each of its detectors
# actually fires before anyone believes a clean result on the real tree.
#
# It reproduces every shape the real tree has, including the ones no text scan can see: a PVC and
# the Deployment that mounts it emitted TOGETHER from a named template in _helpers.tpl (the shape
# showroom-shared.yaml uses, where one `range` emits both sides and grep sees a single wave
# annotation it cannot pair), a `hook: Sync` consumer sharing the sync phase's wave line
# (jobs-batch-kueue's shape), a CronJob whose volumes are two levels deeper than a Deployment's, and
# a StatefulSet whose volumeClaimTemplates must NOT be judged.
#
# THE AUTHORITATIVE EXPECTATIONS ARE IN self_test(), BY OBJECT NAME. The `# EXPECT:` comment on each
# object below says what that object proves; the Python asserts which named objects each rule fired
# on, so a fixture object that is renamed, deleted or silently stops being rendered fails the
# self-test rather than shrinking a total nobody checks.
apiVersion: v2
name: sync-wave-pvc-guard-canary
description: Static fixture chart for the PVC sync-wave guard's self-test.
type: application
version: 0.1.0
appVersion: "0.1.0"
