{{/*
Objects that exist ONLY under a non-default flag. Rendering a chart with default values never
produces any of this, and that is not a hypothetical: the deadlock this guard exists to prevent
lived for its whole life inside `showroom.shared.enabled=true`, a flag that is false by default, so
every casual `helm template gitops/workshop-config` anyone ran showed a healthy chart.

self_test() renders three permutations and expects a DIFFERENT set of named violations from each, so
a value set that stops being rendered loses a named expectation rather than quietly checking less.
*/}}
{{- if .Values.solve }}
---
# EXPECT: pvc-before-consumer — only under solve=true. Entry-state solve worlds materialize
# workloads (and their storage) the default render never emits, which is why every chart is rendered
# at both values.
{{ include "canary.pvcPair" (dict "name" "canary-solve-early" "namespace" .Values.namespace
                                 "pvcWave" "1" "appWave" "2" "class" "") }}
{{- end }}
{{- if .Values.shared }}
---
# EXPECT: pvc-before-consumer — only under shared=true, mirroring showroom.shared.enabled. This is
# the permutation the real defect lived in: false by default, so the render that carried it is the
# one nobody looks at.
{{ include "canary.pvcPair" (dict "name" "canary-shared-early" "namespace" .Values.namespace
                                 "pvcWave" "2" "appWave" "3" "class" "") }}
{{- end }}
