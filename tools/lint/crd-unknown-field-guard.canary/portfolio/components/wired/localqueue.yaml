# PLANTED DEFECT: `spec.clusterQueuee` is a typo for `clusterQueue`. LocalQueue's spec names three
# fields and preserves nothing, so the API server prunes it — and the Application would then read
# OutOfSync forever, which is the failure this whole guard exists for.
#
# It sits in a component NO overlay path reaches directly: the guard only renders this file because
# it followed the stack's Application to get here. That is what makes it the wiring detector.
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: canary-wired-queue
  namespace: canary-wired
spec:
  clusterQueuee: canary-cluster-queue
  # The legal field beside it.
  stopPolicy: None
