# PLANTED DEFECT THAT MUST NOT BE REPORTED — the price of the wiring rule, made visible.
#
# `spec.namespaceSelectorr` is a typo for `namespaceSelector` and would be pruned at admission just
# like every other defect in this canary. The guard stays silent about it for exactly one reason:
# no stack Application points at this overlay, so no portfolio install deploys it and the guard does
# not render it. expectations.yaml declares that silence under `mustNotBeRendered`, and the
# self-test asserts BOTH halves — the field is still here, and it still produced no finding. Delete
# it and the control proves nothing while the self-test goes on passing, which is the failure shape
# this whole file was written to make impossible.
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: canary-unwired-queue
spec:
  namespaceSelectorr: {}
  # The legal field beside it.
  queueingStrategy: BestEffortFIFO
