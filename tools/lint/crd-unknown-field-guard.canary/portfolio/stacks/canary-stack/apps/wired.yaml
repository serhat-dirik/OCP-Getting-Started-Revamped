# The child Application that WIRES components/wired. The guard follows spec.source.path to decide
# what to render, so this file is the only reason that overlay is in scope.
#
# This object is also a false-positive control in its own right: it is an ordinary custom resource
# and every field here is real, so the run must produce no finding about it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canary-wired
  namespace: openshift-gitops
spec:
  project: canary
  source:
    repoURL: https://set-by-parent-application.invalid
    targetRevision: main
    path: tools/lint/crd-unknown-field-guard.canary/portfolio/components/wired
  destination:
    server: https://kubernetes.default.svc
    namespace: canary-wired
