# The child Application that WOULD wire components/unwired — and does not, because the stack's
# kustomization.yaml has it commented out. Present on disk and absent from the render, which is
# precisely the real tree's loki-logging situation.
#
# Uncomment it in kustomization.yaml and components/unwired enters the render set on the next run,
# and its planted ClusterQueue defect starts failing the build. That is the self-healing property
# the wiring rule is claimed to have; this file is what makes the claim testable.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canary-unwired
  namespace: openshift-gitops
spec:
  project: canary
  source:
    repoURL: https://set-by-parent-application.invalid
    targetRevision: main
    path: tools/lint/crd-unknown-field-guard.canary/portfolio/components/unwired
  destination:
    server: https://kubernetes.default.svc
    namespace: canary-unwired
