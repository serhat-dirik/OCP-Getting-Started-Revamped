# Canary stack — the app-of-apps whose child Applications ARE the wiring the guard reads.
#
# `apps/unwired.yaml` is deliberately commented out, exactly as
# platform-portfolio/stacks/observability/apps/loki-logging.yaml is in the real tree. That is what
# makes components/unwired unwired, and it is the shape the portfolio's own installer reads
# (argocd-bootstrap/lib-components.sh: kustomize_resources reads `resources:`, never a glob).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - apps/wired.yaml
  # - apps/unwired.yaml
