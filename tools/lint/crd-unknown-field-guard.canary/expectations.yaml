# What the canary chart claims about itself, asserted by crd-unknown-field-guard.py --self-test.
#
# WHY THIS FILE EXISTS AND NOT A COUNT. "the canary produced N findings" cannot tell which case
# produced which, so blinding one detector while another quietly covers for it leaves the total
# unchanged — measured elsewhere in this repo on click-to-run-guard, where two fixture cases carried
# comments claiming to prove a rule that a DIFFERENT rule was keeping quiet. The self-test therefore
# asserts SET EQUALITY against `mustFire`: a missing entry fails, and so does a finding nobody
# declared.
#
# `mustNotFire` is the half that is easy to fake, so it is asserted in BOTH directions: the field
# must be ABSENT from the findings, and it must still be PRESENT in the rendered canary. A control
# somebody deletes stops controlling anything while the self-test goes on passing — which is the
# same "gate that inspected nothing" shape this guard was written about.
#
# `path` is written exactly as the guard names a finding: `[0]` is a list index, `[key]` a map key.

mustFire:
  - kind: DevWorkspace
    path: spec.template.schemaVersion
    why: >-
      the first half of the 9c97d80 defect. A devfile DOCUMENT key sent into a
      DevWorkspaceTemplateSpec: pruned at admission, so the entry app read OutOfSync forever.
  - kind: DevWorkspace
    path: spec.template.metadata
    why: >-
      the second half of 9c97d80. Also proves `metadata` is only privileged at the ROOT of an
      object — nested, it is an ordinary field and prunes like any other.
  - kind: DevWorkspace
    path: spec.template.components.[0].container.sourceMappingg
    why: >-
      a typo one level inside an ARRAY item. Drop the `items` descent and this alone goes quiet
      while everything else still fires.
  - kind: ResourceFlavor
    path: speec
    why: >-
      a misspelt ROOT-level field. Nothing under it is ever stored, and helm renders it happily.
  - kind: Pipeline
    path: spec.params.[0].properties.[shape].typo
    why: >-
      an unknown field inside a MAP VALUE. `properties` is additionalProperties, so `shape` is a
      legal key — but its value has a schema, and treating "it is a map" as "stop looking" would
      miss this.
  - kind: Broker
    path: spec.wrongPlace
    why: >-
      a custom resource nested in an OpenShift Template's `objects[]`. Read only top-level
      documents and a whole CR stops being checked.
  - kind: ArgoCD
    path: spec.repo.volumes.[0].ephemeral.volumeClaimTemplate.metadata.labels
    why: >-
      a CLOSED object — the CRD declares that level as `type: object` with no properties and no
      preserve-unknown-fields, so the entire subtree prunes however correctly it is spelt.
  - kind: Task
    path: spec.steps.[0].scriptt
    why: >-
      emitted only at solve=true. Drop that render and this is the finding that disappears.

mustNotFire:
  - kind: DevWorkspace
    path: spec.template.attributes.wildButLegal
    why: >-
      `spec.template.attributes` sets x-kubernetes-preserve-unknown-fields, so ANY key here is
      stored verbatim — confirmed on a live cluster 2026-08-06 by a server-side dry-run that kept
      it while pruning the two planted fields on the SAME object. That is what makes it a real
      control rather than a decoration.
  - kind: Trigger
    path: spec.wildButLegal
    why: >-
      knative sets preserve-unknown-fields on the whole of Trigger.spec, so CRD pruning cannot
      touch it and this guard must stay silent. Measured caveat, same dry-run: knative's own
      admission WEBHOOK rejects the object anyway ("cannot decode incoming new object: json:
      unknown field"). Webhooks are a different mechanism and are outside this guard's model.
  - kind: ResourceFlavor
    path: spec.nodeLabels.anyKeyAtAll
    why: >-
      a free-form map: arbitrary KEYS are the entire purpose of additionalProperties, and flagging
      them would fire on every label and annotation map in the repo.
  - kind: Pipeline
    path: spec.params.[0].properties.[shape].type
    why: >-
      the legal field beside the planted one inside the same map value — proof that walking into a
      map's values does not turn every value into a finding.
  - kind: Deployment
    path: spec.notADeploymentField
    why: >-
      a BUILT-IN kind. No CRD, no openAPIV3Schema, so this mechanism does not apply and the object
      must be skipped rather than guessed about. Widen the built-in skip and every planted defect
      above goes quiet; narrow it and this fires.
  - kind: DevWorkspace
    path: spec.template.components.[0].container.image
    why: >-
      an ordinary, correctly-spelt field. The base control: if this fires, the walker is flagging
      everything and the other controls prove nothing.

mustBeUncheckable:
  - NoSnapshotHere
