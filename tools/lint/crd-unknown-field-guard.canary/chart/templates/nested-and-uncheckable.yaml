---
# A custom resource hiding INSIDE an OpenShift Template. `objects[]` are created as ordinary objects
# once the template is processed, so a field the CRD does not define prunes there just the same —
# and a guard that only reads top-level documents would never see it. (The Template itself is a
# built-in kind and is skipped; its contents are not.)
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: canary-template
objects:
  - apiVersion: eventing.knative.dev/v1
    kind: Broker
    metadata:
      name: canary-nested-broker
      namespace: {{ .Values.user }}-canary
    spec:
      config:
        name: canary-config
      wrongPlace: true            # planted: Broker.spec defines only config and delivery
---
# A custom resource whose CRD has NO snapshot. This must be reported as UN-CHECKABLE and exit 2 —
# never skipped, and never spelled the same way as "checked and clean". A gate that goes green over
# something it never inspected is this project's most expensive recurring defect.
apiVersion: canary.crd-unknown-field-guard.invalid/v1
kind: NoSnapshotHere
metadata:
  name: canary-no-snapshot
  namespace: {{ .Values.user }}-canary
spec:
  anything: true
---
# A CLOSED OBJECT: the ArgoCD CRD declares this `metadata` as a bare `type: object` with no
# properties and no x-kubernetes-preserve-unknown-fields (verified against the CRD on 2026-08-06),
# so the API server prunes the WHOLE subtree. It is worth telling apart from an ordinary
# misspelling: nothing you write here can ever be stored, however correctly you spell it.
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: canary-argocd
  namespace: {{ .Values.user }}-canary
spec:
  repo:
    volumes:
      - name: scratch
        ephemeral:
          volumeClaimTemplate:
            metadata:
              labels:             # planted: pruned, because this level names no fields at all
                app: canary
            spec:
              accessModes:
                - ReadWriteOnce
