{{- if .Values.solve }}
---
# Emitted ONLY at solve=true, exactly as a real entry state materializes extra workloads in its
# solve world. Its planted defect is the proof that BOTH renders reach the walker: drop the
# solve=true render and this finding disappears while the solve=false one still passes, which is a
# blinding this repo has measured on two other guards.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: canary-solve-task
  namespace: {{ .Values.user }}-canary
spec:
  steps:
    - name: echo
      image: registry.example.com/canary/tools:1
      scriptt: |                   # planted: the field is `script`
        echo "hello from {{ .Values.clusterDomain }}"
{{- end }}
