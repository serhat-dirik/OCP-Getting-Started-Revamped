---
# THE DEFECT OF 9c97d80, FIELD FOR FIELD. `spec.template` is a DevWorkspaceTemplateSpec, not a
# devfile document: it defines attributes, commands, components, dependentProjects, events, parent,
# projects, starterProjects and variables, and nothing else. `schemaVersion` and `metadata` are
# devfile DOCUMENT keys, so the API server prunes both at admission — they sat in last-applied,
# never in the stored object, and the entry app read OutOfSync forever on a healthy world.
apiVersion: workspace.devfile.io/v1alpha2
kind: DevWorkspace
metadata:
  name: canary-devworkspace
  namespace: {{ .Values.user }}-canary
spec:
  started: false
  template:
    schemaVersion: 2.2.0            # planted: pruned at admission
    metadata:                       # planted: pruned at admission
      name: canary
    attributes:                     # legal: this level sets x-kubernetes-preserve-unknown-fields,
      wildButLegal: "anything at all"   # so ANY key here survives. The false-positive control.
    components:
      - name: tools
        container:
          image: registry.example.com/canary/tools:1
          memoryLimit: 1Gi
          sourceMappingg: /projects   # planted: a typo one level inside an ARRAY item
