# Canary component descriptor for cockpit-attribute-emission-guard.py --self-test.
#
# NOT a copy of content/antora.yml — a fixture that plants one instance of every VALUE SHAPE the
# real descriptor carries, so the classifier is tested rather than the current contents of the
# tree. A canary derived from live content quietly becomes an exit 2 the day that content changes.
#
# Shapes planted, and why each one is here:
#   * reserved-domain soft defaults, with and without a scheme and with and without a path
#   * both `set-from-…` sentinels
#   * REAL-valued soft defaults (user, password) that must NOT be demanded of a cockpit
#   * `real_host_url` — a genuine RHDP-shaped host that merely contains the word "example" as a
#     DNS label. If the reserved-domain rule ever over-matches it, a correctly-defaulted attribute
#     becomes a false positive and the gate gets switched off.
#   * HARD (no trailing `@`) attributes, which a cockpit cannot override and which must therefore
#     never enter the required set at all.
name: canary
title: "Canary"
version: ~

asciidoc:
  attributes:
    # --- HARD: not overridable by a cockpit ConfigMap, so out of scope by construction. The
    #     hard_placeholder_url one is the trap: placeholder-shaped, but a cockpit key could not
    #     win against it anyway, so demanding one would send an author on a fix that cannot work.
    experimental: true
    lab_page_label: "Lab"
    hard_placeholder_url: "https://hard.apps.example.com"

    # --- SOFT + placeholder-shaped: the set this gate exists for.
    ocp_console_url: "https://console.apps.example.com@"
    cluster_domain: "apps.example.com@"
    rhdh_url: "https://backstage-developer-hub-rhdh.apps.example.com@"
    student_argo_url: "https://student-gitops-server-student-gitops.apps.example.com@"
    sonarqube_url: "https://sonarqube-sonarqube.apps.example.com@"
    acs_console_url: "https://central-stackrox.apps.example.com@"
    mta_url: "https://mta-openshift-mta.apps.example.com@"
    maas_endpoint: "https://maas.example.com/v1@"
    maas_model: "set-from-ogsr-maas-credentials@"
    cluster_ocp_version: "set-from-cluster@"

    # --- SOFT but REAL: `user1` is a live attendee slot and `openshift` is the actual shared
    #     password. Neither is a placeholder, and demanding `password` of a ConfigMap would be this
    #     guard asking for a credential leak.
    user: "user1@"
    password: "openshift@"

    # --- SOFT and real, containing the word "example" as a DNS label rather than as the reserved
    #     domain. Must classify as a real value.
    real_host_url: "https://gitea-ogsr-gitea.apps.cluster-abc.example.opentlc.com@"
