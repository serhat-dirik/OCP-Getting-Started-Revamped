---
# Canary fixture for copy-drift-guard.py, mode "structural" — the SOURCE side. Never applied to a
# cluster; it exists so the guard's detectors can be proven to fire before a clean result on the
# real tree is believed. Shaped like pipelines/pipeline/parasol-claims-build.yaml.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: canary-pipeline
  labels:
    app.kubernetes.io/part-of: canary
spec:
  params:
    - name: image
      type: string
      description: Fully-qualified target image reference.
      default: registry.example.com/canary:latest
    - name: max-size-mb
      type: string
      description: Image size budget in MB.
      default: "500"
  tasks:
    - name: build
      taskRef:
        resolver: cluster
        params:
          - name: name
            value: buildah
