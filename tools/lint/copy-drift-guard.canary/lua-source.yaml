---
# Canary fixture for copy-drift-guard.py — the SOURCE side of the Lua-in-a-subtree pair. Never
# applied to a cluster. Shaped like platform-portfolio/argocd-bootstrap/operator/
# argocd-controller-resources.yaml: a resourceHealthChecks override plus unrelated content that
# the pair's declared `subtree` must exclude from the comparison.
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: canary-argocd
spec:
  # Deliberately NOT part of the shared subtree — if the guard compared whole documents it would
  # report this as drift, which is how it proves `subtree` is doing its job.
  controller:
    resources:
      limits:
        memory: 6Gi
  resourceHealthChecks:
    - group: example.com
      kind: Widget
      check: |
        -- Canary health check. This comment differs from the copy's on purpose.
        local health_status = {}
        if obj.status ~= nil then
          health_status.status = "Healthy"
          health_status.message = obj.status.state .. " reported by the canary"
          return health_status
        end
        health_status.status = "Progressing"
        return health_status
