# Canary COPY that must compare CLEAN through the heredoc + Lua path: the executable Lua is
# identical to lua-source.yaml's, but the comments differ and there is one extra comment line —
# exactly the shape of the real argocd-subscription-health-check pair.
apiVersion: batch/v1
kind: Job
metadata:
  name: canary-health-tuning
  namespace: {{ .Values.namespace }}
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: tune
          image: registry.example.com/cli:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              PATCH_FILE="$(mktemp)"; trap 'rm -f "$PATCH_FILE"' EXIT
              cat > "$PATCH_FILE" <<'PATCHEOF'
              spec:
                resourceHealthChecks:
                  - group: example.com
                    kind: Widget
                    check: |
                      -- Canary health check. Deliberately DIFFERENT comment text from the source,
                      -- and one comment line longer, so a clean verdict here proves comments are
                      -- ignored rather than merely absent.
                      local health_status = {}
                      if obj.status ~= nil then
                        health_status.status = "Healthy"
                        health_status.message = obj.status.state .. " reported by the canary"
                        return health_status
                      end
                      health_status.status = "Progressing"
                      return health_status
              PATCHEOF
              oc patch argocd canary-argocd --type=merge --patch-file="$PATCH_FILE"
