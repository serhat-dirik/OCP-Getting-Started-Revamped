# Canary COPY for the allow-list-misuse detector. Its pair wrongly allow-lists
# spec.params[0].default — a key the SOURCE also sets — and this copy gives it a different value.
# The guard must report BOTH the misuse and the changed value: an allow-list that can swallow a
# real change is the failure mode this whole tool exists to prevent.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: canary-pipeline
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: canary
    {{- include "copy-drift-canary.ownerLabels" . | nindent 4 }}
spec:
  params:
    - name: image
      type: string
      description: Fully-qualified target image reference.
      default: registry.example.com/canary:SWALLOWED
    - name: max-size-mb
      type: string
      description: Image size budget in MB.
      default: "500"
  tasks:
    - name: build
      taskRef:
        resolver: cluster
        params:
          - name: name
            value: buildah
