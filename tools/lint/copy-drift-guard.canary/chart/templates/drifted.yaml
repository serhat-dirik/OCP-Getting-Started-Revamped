# Canary COPY carrying three REAL semantic drifts at once, one per detector:
#   value   — spec.params[1].default is 900, the source says 500
#   added   — an extra label the pair does not allow-list
#   missing — spec.params[0].type has been dropped
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: canary-pipeline
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: canary
    workshop.redhat.com/canary: "undeclared"
    {{- include "copy-drift-canary.ownerLabels" . | nindent 4 }}
spec:
  params:
    - name: image
      description: Fully-qualified target image reference.
      default: registry.example.com/canary:latest
    - name: max-size-mb
      type: string
      description: Image size budget in MB.
      default: "900"
  tasks:
    - name: build
      taskRef:
        resolver: cluster
        params:
          - name: name
            value: buildah
