# Canary COPY whose Lua has one CHANGED BRANCH (Healthy -> Degraded). Same comment-only noise as
# job-clean.yaml, so a detection here can only come from the executable line: this is the proof
# that ignoring comments did not also blind the guard to code.
apiVersion: batch/v1
kind: Job
metadata:
  name: canary-health-tuning
  namespace: {{ .Values.namespace }}
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: tune
          image: registry.example.com/cli:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              PATCH_FILE="$(mktemp)"; trap 'rm -f "$PATCH_FILE"' EXIT
              cat > "$PATCH_FILE" <<'PATCHEOF'
              spec:
                resourceHealthChecks:
                  - group: example.com
                    kind: Widget
                    check: |
                      -- Canary health check. Deliberately DIFFERENT comment text from the source,
                      -- and one comment line longer, so the only thing left to detect is the code.
                      local health_status = {}
                      if obj.status ~= nil then
                        health_status.status = "Degraded"
                        health_status.message = obj.status.state .. " reported by the canary"
                        return health_status
                      end
                      health_status.status = "Progressing"
                      return health_status
              PATCHEOF
              oc patch argocd canary-argocd --type=merge --patch-file="$PATCH_FILE"
