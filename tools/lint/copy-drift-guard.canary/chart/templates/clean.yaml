# Canary COPY that must compare CLEAN: it differs from manifest-source.yaml only by the two
# allow-listed additions (namespace, owner label) plus comments, key order and quoting style —
# every difference a byte-identity gate would have wrongly failed on.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: canary-pipeline
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: canary
    {{- include "copy-drift-canary.ownerLabels" . | nindent 4 }}
spec:
  params:
    # Reordered keys and a quoted scalar on purpose: neither is a semantic change.
    - type: string
      name: image
      default: "registry.example.com/canary:latest"
      description: Fully-qualified target image reference.
    - name: max-size-mb
      type: string
      description: Image size budget in MB.
      default: "500"
  tasks:
    - name: build
      taskRef:
        resolver: cluster
        params:
          - name: name
            value: buildah
