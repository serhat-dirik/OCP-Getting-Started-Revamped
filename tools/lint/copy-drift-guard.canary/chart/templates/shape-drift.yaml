# Canary COPY for the two SHAPE detectors, which no fixture reached until 2026-08-01: blinding
# either one left `--self-test` at 1 and the real run at 0, so both CI signals called them proven.
# They are shape changes rather than value changes, which is why the value/added/missing fixtures
# next door cannot witness them:
#   type   — metadata.labels is a STRING here and a mapping in the source. A copy whose mapping
#            collapsed to a scalar (a stray `|`, a templating accident) compares equal key-by-key
#            to nothing at all, so without this detector the whole subtree stops being compared.
#   length — spec.tasks carries two entries, the source one. An EXTRA list item is invisible to the
#            missing/added detectors: those walk mapping keys, and a list index is not a key.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: canary-pipeline
  namespace: {{ .Values.namespace }}
  labels: "app.kubernetes.io/part-of=canary"
spec:
  params:
    - name: image
      type: string
      description: Fully-qualified target image reference.
      default: registry.example.com/canary:latest
    - name: max-size-mb
      type: string
      description: Image size budget in MB.
      default: "500"
  tasks:
    - name: build
      taskRef:
        resolver: cluster
        params:
          - name: name
            value: buildah
    - name: an-extra-task-the-source-does-not-have
      taskRef:
        resolver: cluster
        params:
          - name: name
            value: buildah
