name: lint
on: [push]
jobs:
  alpha:
    runs-on: ubuntu-latest
    steps:
      - name: alpha
        run: |
          # a note about tools/lint/commented-out-guard.py, which was deleted — NOT wiring
          rc=0
          python3 tools/lint/alpha-guard.py --self-test || rc=$?
          [ "$rc" -ne 1 ] && exit 1
          python3 tools/lint/alpha-guard.py
