name: lint
on: [push]
jobs:
  alpha:
    runs-on: ubuntu-latest
    steps:
      - name: alpha
        run: |
          python3 tools/lint/alpha-guard.py --self-test
          python3 tools/lint/alpha-guard.py
      - name: ghost
        run: |
          python3 tools/lint/ghost-guard.py --self-test
          python3 tools/lint/ghost-guard.py
