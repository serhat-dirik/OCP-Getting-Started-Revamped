# CANARY — editor contributed by `uri`. The exact shape that shipped 2026-07-18..2026-08-17 and
# produced an IDE whose built-in terminal silently did nothing.
apiVersion: workspace.devfile.io/v1alpha2
kind: DevWorkspace
metadata:
  name: canary-ws
spec:
  started: true
  contributions:
    - name: editor
      uri: https://devspaces.apps.example.com/dashboard/api/editors/devfile?che-editor=che-code
