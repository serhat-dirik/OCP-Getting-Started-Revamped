# CANARY — contributions present, but none named `editor`. Workspace reaches Running with an
# empty mainUrl and the dashboard times out with "has not received an IDE URL".
apiVersion: workspace.devfile.io/v1alpha2
kind: DevWorkspace
metadata:
  name: canary-ws
spec:
  started: true
  contributions:
    - name: not-the-editor
      kubernetes:
        name: something-else
