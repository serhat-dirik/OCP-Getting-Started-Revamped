# CANARY — references a DevWorkspaceTemplate by name that this chart never renders. Passes a
# grep for `kubernetes.name`; the workspace still starts with no editor at all.
apiVersion: workspace.devfile.io/v1alpha2
kind: DevWorkspace
metadata:
  name: canary-ws
spec:
  started: true
  contributions:
    - name: editor
      kubernetes:
        name: che-code-never-rendered
