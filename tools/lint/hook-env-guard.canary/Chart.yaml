---
# Canary fixture chart for tools/lint/hook-env-guard.py. NOT a workshop entry state — it lives under
# tools/lint/, is never referenced by an Argo Application, and is never installed anywhere.
#
# WHY IT EXISTS (measured 2026-08-01). The self-test used to re-implement the guard's pipeline
# inline: it called scripts_in() + env_names() + assigned_names() + REF itself, so check_chart() —
# the function main() actually runs — was never executed by any CI signal. Blinding check_chart's
# `findings.append` while leaving its counters intact kept --self-test at 1 AND the real run at 0.
# Rendering this chart through check_chart() is what closes that: the self-test now drives the same
# entry point main() does, under both `solve` worlds, with helm doing the rendering.
apiVersion: v2
name: hook-env-guard-canary
description: Static fixture chart for tools/lint/hook-env-guard.py --self-test. Not for installation.
type: application
version: 0.1.0
appVersion: "0.1.0"
