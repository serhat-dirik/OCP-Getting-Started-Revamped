{{/* An undefined reference that exists ONLY in an initContainer. The real tree has no init container
     carrying a script today, so no scope floor can prove the walk still visits them — and dropping
     "initContainers" from scripts_in()'s key tuple was one of the blindings that left a silent
     clean. This repo hands credentials between an init and a main container, so that walk must not
     quietly stop covering it the day one of those grows a ${VAR}. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: canary-init
spec:
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: prep
          image: {{ .Values.image }}
          args:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              echo "preparing ${ONLY_IN_INIT_CONTAINER}"
      containers:
        - name: hook
          image: {{ .Values.image }}
          args:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              echo "main container is clean, home is $HOME"
