{{/* The exact shape that shipped (d53dccb): ${DST_USER} on the error path, referenced but never
     declared as env and never assigned. Under `set -euo pipefail` it kills the script MID-PRINT of
     its own error message. Present in BOTH solve worlds, so either render missing it is visible. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: canary-bad
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: hook
          image: {{ .Values.image }}
          env:
            - name: DST_NS
              value: {{ .Values.user }}-dev
          args:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              echo "seeding into ${DST_NS}"
              echo "fix: ws reset --user ${DST_USER}"
