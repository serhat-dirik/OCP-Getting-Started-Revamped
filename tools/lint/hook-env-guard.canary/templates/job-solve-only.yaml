{{- if eq (toString .Values.solve) "true" }}
{{/* Materialized ONLY in the solve world, exactly as the real entry states' solve workloads are.
     Dropping the solve=true render was one of the audit's blindings: with both renders producing
     the same documents, nothing distinguishes one call from two. This Job is what makes the two
     renders differ, so a self-test that sees only one world loses a finding by name. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: canary-solve-only
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: hook
          image: {{ .Values.image }}
          args:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              echo "${ONLY_IN_THE_SOLVE_WORLD}"
{{- end }}
