{{/* The must-stay-silent case. Every reference below is defined by one of the four routes the guard
     knows — a declared env var, a plain assignment, a `local`/`for`/`read` binding, or a shell
     builtin — and a false positive here is the failure mode that gets a guard deleted rather than
     fixed. If assigned_names() or SHELL_BUILTINS ever narrows, this Job is what says so. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: canary-good
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: hook
          image: {{ .Values.image }}
          env:
            - name: DST_NS
              value: {{ .Values.user }}-dev
          args:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              CAND=none
              probe() {
                local tok="$1" ep="${2%/}" model="$3" code
                code=0
                echo "${tok} ${ep} ${model} ${code}"
              }
              if [ -n "$CAND" ]; then FROM="a"; else FROM="b"; fi
              for u in 1 2; do echo "${u} ${FROM} ${CAND} ${DST_NS} ${HOME}"; done
              read -r line rest <<< "x y"
              echo "${line}${rest}"
