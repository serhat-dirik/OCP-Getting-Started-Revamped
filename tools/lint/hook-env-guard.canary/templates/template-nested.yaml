{{/* A script nested inside an OpenShift Template.objects[] — the shape a PodSpec-only walk cannot
     see. registry-images-catalog-governance ships one, and a walk that only knows
     .spec.template.spec finds nothing here while reporting a clean scan. */}}
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: canary-template
objects:
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: canary-nested
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: hook
              image: {{ .Values.image }}
              args:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  echo "${NEVER_SET_IN_TEMPLATE}"
