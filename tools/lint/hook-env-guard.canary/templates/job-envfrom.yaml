{{/* envFrom pulls in a key set no manifest can enumerate, so this container's references are NOT
     knowable and the guard skips it with a printed note. The skip is counted PAST, which is the
     point: if it ever widens beyond genuine envFrom containers, "scripts actually evaluated"
     collapses instead of the run reporting a clean scan of nothing. The reference below is
     deliberately undefined — a widened skip stays silent here, but a NARROWED one (dropping the
     envFrom check entirely) turns this Job into an extra finding, so the case fails both ways. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: canary-envfrom
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: hook
          image: {{ .Values.image }}
          envFrom:
            - configMapRef:
                name: canary-not-a-real-configmap
          args:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              echo "this comes from the ConfigMap: ${FROM_A_CONFIGMAP}"
