---
# The same value vocabulary the real entry states use, so the fixture is rendered by exactly the
# same `helm template --set user=… --set clusterDomain=… --set solve=…` call the guard makes against
# gitops/entry-states/*.
user: user1
clusterDomain: example.com
solve: false

# One image for every fixture Job. Which image it is does not matter here — this guard reads the
# embedded shell, not the container reference.
image: registry.example.com/ose-cli:latest
