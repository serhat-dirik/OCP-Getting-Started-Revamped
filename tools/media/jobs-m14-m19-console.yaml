# Console + Kiali rows for the third module block — securing-apps-keycloak, multi-tenancy-workload-
# security, networking-dev-devops, deployment-targets-scheduling, registry-images-catalog-governance,
# service-mesh-advanced-gateways (positions 14-19 in /modules.yaml).
#
# WHY THIS FILE EXISTS. The 2026-08-01 media lane for this block could not shoot any of it: the
# OpenShift console and Kiali both sit behind OpenShift OAuth, the cached console session in
# shot-profile.session.json had expired (a probe capture came back as a 25 KB PNG of the
# "Log in with rhbk / workshop-users" chooser — the exact failure docs/media-capture-conventions.md
# §4 describes), and establishing a new one means a human typing a password, which that lane is
# barred from doing. So the lane did the half that does NOT need a browser: it staged and PROVED
# every cluster state these shots need, and wrote them down here. Everything below marked "state:
# PROVEN" was executed end to end on the capture cluster as user7 on 2026-08-01 and its outcome asserted
# from the API, not assumed.
#
# WHAT IS STILL UNPROVEN, said plainly: every `wait_all_text` / `require_in_frame` string below is
# grounded in the API object or the console's own unauthenticated i18n bundle
# (/static/locales/en/console-app.json, see docs/media-capture-conventions.md §6) — NOT in a
# rendered page, because no page could be rendered. Expect some to need a tweak on the first real
# run; fix them by raising `viewport.height` or naming a different string, never by deleting an
# assertion (RUNBOOK.md rule 4).
#
# THIS FILE IS WRITTEN FOR user7 — the slot whose states were staged, and which is still carrying
# the multi-tenancy-workload-security and service-mesh-advanced-gateways states as of 2026-08-01
# 04:00. To shoot as a different attendee: `sed -i '' 's/user7/userN/g'` here, and the pre_sh
# staging re-runs for that user automatically (every stage script takes the user as its argument).
# The console session must belong to THAT user, or every namespaced URL below renders Access
# restricted.
#
# ORDER IS LOAD-BEARING, and not for the usual reason. Four of these modules
# (multi-tenancy-workload-security, networking-dev-devops, deployment-targets-scheduling,
# registry-images-catalog-governance) all materialise into {user}-dev and declare each other in
# conflictsWith BOTH ways, so `ws start` on any one EVICTS the previous and PURGES the namespace.
# Running this file top to bottom is therefore a one-way street: once the registry rows are past,
# their state is gone. Do not reorder, and use `--only` plus `--no-pre` for retries.
# service-mesh-advanced-gateways owns {user}-mesh alone and conflicts with nothing, so its rows can
# run at any point.
#
# NO `reshoot: true` anywhere in this file — nothing here overwrites an existing asset.

jobs:

  # ===== registry-images-catalog-governance — FIRST, because ws start here purges {user}-dev ======
  #
  # state: PROVEN 2026-08-01. `ws start registry-images-catalog-governance --user user7` (2m03s)
  # seeds the parasol-claims ImageStream with a single `1.0` tag resolving to an immutable digest
  # (`oc get istag parasol-claims:1.0 -n user7-dev` → sha256:ca7598…). stage-m18-registry.sh then
  # runs the lab's own exercise 2 and exercise 5 and asserts BOTH outcomes: that `1.0` and `prod`
  # report the identical digest, and that the namespaced Template exists.
  - slug: registry-images-catalog-governance
    filename: registry-images-catalog-governance-01-imagestream-detail.png
    pre_sh: ./tools/ws/ws start registry-images-catalog-governance --user user7
    pre_wait_s: 20
    url: https://console-openshift-console.{domain}/k8s/ns/user7-dev/imagestreams/parasol-claims
    # "sha256:" is the caption's subject and is rendered only by the Tags rows; the bare tag name
    # "1.0" appears in half a dozen places and would pass on the wrong page by itself.
    wait_all_text: ["parasol-claims", "sha256:"]
    forbid_text: ["Access restricted", "An error occurred", "not found", "Log in with"]
    require_in_frame: ["sha256:"]
    viewport: {width: 1600, height: 1200}
    settle_ms: 4000

  # The promote. Both tags must be in the SAME frame — the entire teaching point is the two
  # identical digests side by side, so require_in_frame names "prod", the row that arrives second.
  - slug: registry-images-catalog-governance
    filename: registry-images-catalog-governance-02-imagestream-two-tags.png
    pre_sh: ./tools/media/stage-m18-registry.sh user7
    pre_wait_s: 10
    url: https://console-openshift-console.{domain}/k8s/ns/user7-dev/imagestreams/parasol-claims
    wait_all_text: ["parasol-claims", "prod", "sha256:"]
    forbid_text: ["Access restricted", "An error occurred", "not found", "Log in with"]
    require_in_frame: ["prod", "sha256:"]
    viewport: {width: 1600, height: 1200}
    settle_ms: 4000

  # The namespaced catalog entry. The page and the type-filter names are already browser-grounded in
  # the lab (comment dated 2026-07-29: the nav is Ecosystem → Software Catalog, the page lands on
  # /catalog/ns/{user}-dev headed "Software Catalog", and the type filters include "Templates").
  # UNVERIFIED: that `?catalogType=Template` is the query parameter that pre-applies that filter —
  # it was read off the console's routing convention, not observed. If the filter does not apply,
  # the tile is still on the page (the wait will pass) and the shot just shows an unfiltered
  # catalogue; re-run with the filter clicked by hand rather than accepting that.
  - slug: registry-images-catalog-governance
    filename: registry-images-catalog-governance-03-developer-catalog-template.png
    url: https://console-openshift-console.{domain}/catalog/ns/user7-dev?catalogType=Template
    filter_text: "Parasol"
    wait_all_text: ["Software Catalog", "Parasol Claims Quickstart"]
    forbid_text: ["Access restricted", "An error occurred", "Log in with"]
    require_in_frame: ["Parasol Claims Quickstart"]
    settle_ms: 6000

  # The cluster-wide governance read. Attendees really can read this singleton — proven not with
  # `oc auth can-i` (which lies about cluster-scoped resources, see CLAUDE.md) but with the actual
  # read: `oc get images.config.openshift.io cluster --as=user7 --as-group=workshop-attendees`
  # returned the object on 2026-08-01. No staging: it is a cluster singleton nothing here mutates.
  #
  # The YAML tab, not the Details tab, and deliberately. The row's caption points at
  # allowedRegistriesForImport being EMPTY — "empty = open" — and an unset field cannot be asserted
  # by its own name anywhere, because it is not rendered. What IS rendered, and what proves the
  # point, is the literal `spec: {}` this cluster carries (verified 2026-08-01). The Details tab
  # would need a field label nobody in this pass has seen; `internalRegistryHostname` anchors the
  # frame to the object and ties the shot to the module's own internal-registry beat.
  - slug: registry-images-catalog-governance
    filename: registry-images-catalog-governance-04-cluster-image-config.png
    url: https://console-openshift-console.{domain}/k8s/cluster/config.openshift.io~v1~Image/cluster/yaml
    wait_all_text: ["internalRegistryHostname", "config.openshift.io"]
    forbid_text: ["Access restricted", "An error occurred", "not found", "Log in with"]
    require_in_frame: ["internalRegistryHostname"]
    viewport: {width: 1600, height: 1100}
    settle_ms: 4000

  # ===== deployment-targets-scheduling — evicts the registry state above ==========================
  #
  # state: PROVEN 2026-08-01. `ws start deployment-targets-scheduling --user user7` brings up the
  # six-pod claims stack with parasol-claims at 2 replicas scattered across nodes — which IS shot 01
  # (the Node column with different values), so it is shot BEFORE the staging script narrows things.
  - slug: deployment-targets-scheduling
    filename: deployment-targets-scheduling-01-pods-by-node.png
    pre_sh: ./tools/ws/ws start deployment-targets-scheduling --user user7
    pre_wait_s: 30
    url: https://console-openshift-console.{domain}/k8s/ns/user7-dev/pods
    # "Node" is the column header the caption points at; the two workload names prove it is the
    # project-scoped list and not some other pod table.
    wait_all_text: ["parasol-claims", "statement-batch", "Node"]
    forbid_text: ["Access restricted", "An error occurred", "Log in with"]
    require_in_frame: ["statement-batch"]
    viewport: {width: 1600, height: 1100}
    settle_ms: 5000

  # The anti-affinity rule, on the Deployment's own YAML tab. The lab already grounded (2026-07-26)
  # that parasol-claims' detail page carries a YAML tab directly — no Actions menu hop needed — and
  # that it renders the COMPLETE resource, so spec.template.spec.affinity is exposed by construction.
  # stage-m17-scheduling.sh asserts the rule is real by checking the three replicas landed on three
  # DISTINCT nodes, not merely that the patch returned 0.
  - slug: deployment-targets-scheduling
    filename: deployment-targets-scheduling-02-edit-deployment-affinity.png
    pre_sh: ./tools/media/stage-m17-scheduling.sh user7
    pre_wait_s: 10
    url: https://console-openshift-console.{domain}/k8s/ns/user7-dev/deployments/parasol-claims/yaml
    wait_all_text: ["podAntiAffinity", "requiredDuringSchedulingIgnoredDuringExecution", "kubernetes.io/hostname"]
    forbid_text: ["Access restricted", "An error occurred", "Log in with"]
    # The YAML editor scrolls INTERNALLY, so the rule can sit outside the frame on a page that
    # otherwise passes every text wait. Scroll to it, then insist it is actually in the picture.
    scroll_to_text: "podAntiAffinity"
    require_in_frame: ["podAntiAffinity", "topologyKey"]
    viewport: {width: 1600, height: 1100}
    settle_ms: 5000

  - slug: deployment-targets-scheduling
    filename: deployment-targets-scheduling-03-batch-pending.png
    parked: >-
      NOT CAPTURABLE ON THIS CLUSTER, and not a content bug. The shot is of statement-batch stuck
      Pending on an untolerated taint, which needs the batch-pool node to actually carry
      workshop.redhat.com/pool=batch:NoSchedule. Bootstrap only applies that taint once the worker
      pool has 3+ nodes; the capture cluster had 2 real workers (5 nodes, 3 of them control-plane), so the
      pool node is labelled and deliberately UNTAINTED — verified 2026-08-01, `oc get nodes -l
      workshop.redhat.com/pool=batch` shows TAINTS <none>. With no taint the nodeSelector-only patch
      schedules cleanly and there is no Pending pod and no FailedScheduling event to photograph, as
      the lab's own IMPORTANT block in exercise 4 spells out. Shoot this on a 3+-worker cluster.

  # ALLOWED DISRUPTIONS = 2 needs THREE healthy replicas against minAvailable 1; at the entry
  # state's 2 replicas the console would render 1 and quietly contradict the lab's own expected
  # output. stage-m17-scheduling.sh scales to 3 first and then POLLS status.disruptionsAllowed until
  # it reads 2 — the controller does not compute it instantly, and a shot taken at 0 is a valid PNG
  # of the wrong number.
  #
  # The column label is "Allowed disruptions" in SENTENCE CASE. Bundle-grounded 2026-08-01: the
  # console does not reuse the CLI printer columns here, and console-app.json carries that exact
  # string with no upper-case variant in any served bundle. `ALLOWED DISRUPTIONS` is the CLI's.
  - slug: deployment-targets-scheduling
    filename: deployment-targets-scheduling-04-pdb-allowed-disruptions.png
    url: https://console-openshift-console.{domain}/k8s/ns/user7-dev/poddisruptionbudgets
    wait_all_text: ["parasol-claims", "Allowed disruptions"]
    forbid_text: ["Access restricted", "An error occurred", "Log in with"]
    require_in_frame: ["Allowed disruptions"]
    settle_ms: 4000

  # ===== networking-dev-devops — evicts the scheduling state above ================================
  #
  # state: PROVEN 2026-08-01. `ws start networking-dev-devops --user user7` brings up exactly three
  # Services, all ClusterIP with no external address: claims-db 5432, parasol-claims 8080,
  # parasol-web 8080. Shoot this BEFORE the default-deny staging — that policy takes parasol-claims
  # to 0/1, and a Services page is a more honest picture with the app healthy.
  - slug: networking-dev-devops
    filename: networking-dev-devops-01-services-clusterip.png
    pre_sh: ./tools/ws/ws start networking-dev-devops --user user7
    pre_wait_s: 30
    url: https://console-openshift-console.{domain}/k8s/ns/user7-dev/services
    wait_all_text: ["parasol-web", "parasol-claims", "claims-db", "ClusterIP"]
    forbid_text: ["Access restricted", "An error occurred", "Log in with"]
    require_in_frame: ["claims-db"]
    settle_ms: 4000

  # RETARGETED, and the manifest row was corrected to match. The row originally asked for the
  # *Create NetworkPolicy* YAML editor with the manifest PASTED but not yet created — a state that
  # only exists after a human types into the console's editor, which this harness cannot do (there
  # is no type-into-editor job field, and no deep link arrives pre-filled). The created object's own
  # YAML tab shows both lines the caption circles — the empty `podSelector: {}` and the two
  # policyTypes — so the teaching value survives intact and the shot becomes capturable headlessly.
  # stage-m16-networking.sh asserts policyTypes really is ["Ingress","Egress"] before the shot.
  - slug: networking-dev-devops
    filename: networking-dev-devops-03-networkpolicy-yaml.png
    pre_sh: ./tools/media/stage-m16-networking.sh user7
    pre_wait_s: 5
    url: https://console-openshift-console.{domain}/k8s/ns/user7-dev/networkpolicies/default-deny-all/yaml
    wait_all_text: ["default-deny-all", "policyTypes", "Ingress", "Egress"]
    forbid_text: ["Access restricted", "An error occurred", "not found", "Log in with"]
    scroll_to_text: "policyTypes"
    require_in_frame: ["policyTypes", "podSelector"]
    viewport: {width: 1600, height: 1100}
    settle_ms: 5000

  - slug: networking-dev-devops
    filename: networking-dev-devops-02-create-edge-route.png
    parked: >-
      Needs a human. The row asks for the Create Route FORM already filled in — Service
      parasol-web, Secure Route ticked, TLS termination Edge, Insecure traffic Allow. Reaching that
      state means choosing from three dropdowns and ticking a box; capture.py can click a named
      button (click_text) and tick a named checkbox (check_text) but cannot drive a PatternFly
      select, and no deep link arrives pre-filled. Shoot by hand during a login window, or drop the
      row: the created Route's YAML tab shows termination: edge and
      insecureEdgeTerminationPolicy: Allow and IS harness-capturable, but it photographs the
      outcome rather than the form the tab is teaching.

  - slug: networking-dev-devops
    filename: networking-dev-devops-04-pod-terminal-blocked.png
    parked: >-
      Needs a human. The subject is a probe TYPED into the console's in-pod Terminal tab and left
      hanging (</dev/tcp/claims-db/5432> timing out) beside a parasol-claims pod terminal that
      prints OPEN. The terminal is an xterm.js canvas: nothing in the harness can type into it, and
      every text assertion is blind to it because the canvas has no innerText (the same trap the
      Showroom cockpit terminal has). Shoot by hand, or prefer the module's already-specified
      deny-then-allow GIF, which carries this beat better than a still.

  # ===== multi-tenancy-workload-security — evicts the networking state above =====================
  #
  # state: PROVEN 2026-08-01, and LIVE on user7 as this was written. The entry state ships
  # root-demander at replicas: 0 (a 0-replica Deployment is Healthy, so `ws prep` converges);
  # stage-m15-multitenancy.sh scales it to 1 and polls until the refusal event exists.
  #
  # THE EVENT IS ON THE REPLICASET, NOT THE DEPLOYMENT. The pod is refused at admission and is
  # therefore never created, so there is no pod to carry the event and the ReplicaSet controller
  # emits FailedCreate against itself. The manifest row says "Deployment → Events tab"; that page
  # may well show nothing. url_sh resolves the live ReplicaSet name (it changes on every
  # re-materialisation, so it can never be hardcoded) and shoots ITS Events tab. Measured message:
  #   Error creating: pods "root-demander-…-" is forbidden: unable to validate against any security
  #   context constraint: [… provider restricted-v2: .containers[0].runAsUser: Invalid value: 0:
  #   must be in the ranges: [1001990000, 1001999999] …]
  # The caption's "0 of 1 pods" lives on the Deployment page, not this one — if both must be in one
  # frame, this row needs splitting into two shots. Decide that with the image in hand.
  - slug: multi-tenancy-workload-security
    filename: multi-tenancy-workload-security-01-deploy-0of1-event.png
    pre_sh: ./tools/ws/ws start multi-tenancy-workload-security --user user7 && ./tools/media/stage-m15-multitenancy.sh user7
    pre_wait_s: 15
    # {domain} is substituted into url_sh by capture.py before the shell runs it — use that, not
    # $OGSR_DOMAIN, so the file does not depend on the variable reaching this subshell.
    url_sh: >-
      echo "https://console-openshift-console.{domain}/k8s/ns/user7-dev/replicasets/$(oc get rs
      -n user7-dev -l app=root-demander -o jsonpath='{range .items[?(@.spec.replicas>0)]}{.metadata.name}{"\n"}{end}'
      | head -1)/events"
    wait_all_text: ["FailedCreate", "security context constraint", "runAsUser"]
    forbid_text: ["Access restricted", "An error occurred", "Log in with"]
    require_in_frame: ["security context constraint"]
    viewport: {width: 1600, height: 1100}
    settle_ms: 5000

  - slug: multi-tenancy-workload-security
    filename: multi-tenancy-workload-security-02-create-rolebinding.png
    parked: >-
      Needs a human, and the module's own manifest already said so. The row wants the Create
      RoleBinding modal already filled with subject type ServiceAccount, subject payments-ci and
      role edit. It is a form with no pre-fillable deep link, and the harness cannot type into it.
      The manifest already prefers a GIF for this multi-click flow
      (multi-tenancy-workload-security-04-grant-role.gif) — record that instead and drop the still.

  # ===== service-mesh-advanced-gateways — {user}-mesh, conflicts with nothing =====================
  #
  # state: PROVEN 2026-08-01, and LIVE on user7 as this was written. stage-m19-mesh.sh runs
  # exercise 1's per-workload enrollment and then proves a sidecar actually joined — checking
  # .spec.initContainers as well as .spec.containers, because Istio 1.28 (OSSM 3) injects a NATIVE
  # sidecar, i.e. an initContainer with restartPolicy: Always. A check that greps only
  # .spec.containers reports "injection did not happen" against pods that are already 2/2 and
  # serving; that false alarm cost this lane twenty minutes on 2026-08-01.
  - slug: service-mesh-advanced-gateways
    filename: service-mesh-advanced-gateways-05-deployment-inject-label.png
    pre_sh: ./tools/ws/ws start service-mesh-advanced-gateways --user user7 && ./tools/media/stage-m19-mesh.sh user7
    pre_wait_s: 15
    url: https://console-openshift-console.{domain}/k8s/ns/user7-mesh/deployments/parasol-web/yaml
    wait_all_text: ["sidecar.istio.io/inject", "parasol-web"]
    forbid_text: ["Access restricted", "An error occurred", "Log in with"]
    scroll_to_text: "sidecar.istio.io/inject"
    require_in_frame: ["sidecar.istio.io/inject"]
    viewport: {width: 1600, height: 1100}
    settle_ms: 5000

  - slug: service-mesh-advanced-gateways
    filename: service-mesh-advanced-gateways-01-kiali-graph-mtls.png
    parked: >-
      Blocked on a SECOND login, not just the console one. Kiali on this cluster runs auth strategy
      "openshift" (`oc get kiali -n istio-system -o jsonpath='{.spec.auth}'` →
      {"strategy":"openshift"}, 2026-08-01), so its route sits behind the same OAuth hop as the
      console AND, per tools/media/README.md, a console session does not carry to it — the profile
      must be logged in through Kiali separately. Beyond that the graph needs exercise-3 traffic
      generation, which this pass did not stage or prove. Stage it with the lab's own exercise-3
      traffic loop before shooting; the enrollment half is already done by stage-m19-mesh.sh.

  - slug: service-mesh-advanced-gateways
    filename: service-mesh-advanced-gateways-02-kiali-versioned-split.png
    parked: >-
      Same Kiali login blocker as shot 01, plus more lab state: it needs exercise 4 complete
      (parasol-fraud v2 deployed, the DestinationRule subsets and the 90/10 VirtualService applied)
      AND traffic flowing, so the graph draws two versioned workloads with weighted edges. Not
      staged or proven in this pass.

  - slug: service-mesh-advanced-gateways
    filename: service-mesh-advanced-gateways-03-kiali-health-red.png
    parked: >-
      Same Kiali login blocker as shot 01, plus exercise 5's fault injection or exercise 6's
      AuthorizationPolicy deny in flight — a transient state that has to be photographed WHILE the
      failing traffic runs. Not staged or proven in this pass.

  - slug: service-mesh-advanced-gateways
    filename: service-mesh-advanced-gateways-06-import-virtualservice.png
    parked: >-
      Needs a human. The subject is the masthead + → Import YAML editor with the 90/10
      VirtualService PASTED but not yet created; the harness cannot type into the console's editor.
      The created VirtualService's YAML tab shows the same weight: 90 / weight: 10 route entries
      and IS harness-capturable, but it photographs the outcome rather than the Import YAML flow
      the Console tab is teaching. Decide which the tab needs before shooting.

  # ===== securing-apps-keycloak ==================================================================
  #
  # Rows 05 and 06 are already on disk and are now embedded in lab.adoc (2026-08-01). Row 08 is the
  # only one left and it is optional.
  - slug: securing-apps-keycloak
    filename: securing-apps-keycloak-08-import-fraud.png
    parked: >-
      Needs a human, and the manifest already marks it optional. Same shape as the two Import YAML
