# Product-UI views that need NO lab state — capturable on any healthy install.
#
# ALL FOUR ARE ALREADY ON DISK and ✅ CAPTURED in their manifests, so on this cluster capture.py
# prints `KEEP` for every one and the file is a no-op. That is deliberate: it stays here as the
# recipe for a FRESH cluster, where these are the cheapest four shots in the pass and need nothing
# but a login. Do not add `reshoot: true` to refresh them — see RUNBOOK.md "the clobber guard".
#
# `{domain}` is substituted at run time from --domain / $OGSR_DOMAIN. Never hardcode a live cluster
# domain: CI's privacy guard fails the build on one in any tracked file.
#
# The rest of these modules' shots (an Argo app mid-sync, a scaffolder task page) depend on lab
# state and have to be captured while actually running the lab — they are NOT here.
jobs:
  # gitops-fundamentals #1: the STUDENT Argo instance, not the platform one. The point of the shot
  # is that attendees log in via OpenShift (Dex), not the local admin box.
  - slug: gitops-fundamentals
    filename: gitops-fundamentals-01-argo-login.png
    url: https://student-gitops-server-student-gitops.{domain}/
    # Present only on the pre-auth login page: once a session exists Argo redirects straight to the
    # applications list and this string is gone. So it doubles as "we are NOT already logged in".
    wait_text: "LOG IN VIA OPENSHIFT"

  # developer-hub #1: the Catalog. RHDH gates on a "Select a sign-in method" chooser offering Guest
  # and GitHub; the lab tells attendees to click Enter (guest), so the capture does the same.
  - slug: developer-hub-golden-paths
    filename: developer-hub-golden-paths-01-catalog-components.png
    url: https://backstage-developer-hub-rhdh.{domain}/catalog
    click_text: ["Enter"]
    # "Owner" is a Catalog table column — absent from the sign-in gate, so it proves we are past the
    # chooser. `parasol-claims` proves the table has ROWS: an empty catalog renders the header too.
    wait_all_text: ["Owner", "parasol-claims"]

  # developer-hub #3: the Create page listing the golden-path Software Templates.
  - slug: developer-hub-golden-paths
    filename: developer-hub-golden-paths-03-create-templates.png
    url: https://backstage-developer-hub-rhdh.{domain}/create
    click_text: ["Enter"]
    # Same reasoning: the heading alone renders before (and without) any template card.
    wait_all_text: ["Templates", "Parasol"]

  # securing-apps-keycloak #6: the realm-branded Keycloak login form. The manifest's ideal is a
  # recording of the app -> Keycloak -> app redirect, which needs the module's entry state and a
  # sign-in; this is the still of the login page itself, reached via the realm's account console.
  # Realm name is per-attendee (realm-<user>) — repoint before capturing on another cluster.
  - slug: securing-apps-keycloak
    filename: securing-apps-keycloak-06-keycloak-login.png
    url: https://keycloak-sso-workshop.{domain}/realms/realm-user1/account/
    # The form, not just the word: "Sign in" is also on a Keycloak error page's header chrome,
    # whereas the Password field only exists once the credential form itself has rendered.
    wait_all_text: ["Sign in", "Password"]
