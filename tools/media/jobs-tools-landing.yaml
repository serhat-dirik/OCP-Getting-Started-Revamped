# Product-UI views that need NO lab state — capturable on any healthy install.
#
# `{domain}` is substituted at run time from --domain / $OGSR_DOMAIN. Never hardcode a live
# cluster domain: CI's privacy guard fails the build on one in any tracked file.
#
# The rest of these modules' shots (an Argo app mid-sync, a scaffolder task page) depend on
# lab state and have to be captured while actually running the lab — they are NOT here.
jobs:
  # gitops-fundamentals #1: the STUDENT Argo instance, not the platform one. The point of the
  # shot is that attendees log in via OpenShift (Dex), not the local admin box.
  - slug: gitops-fundamentals
    filename: gitops-fundamentals-01-argo-login.png
    url: https://student-gitops-server-student-gitops.{domain}/
    wait_text: "LOG IN VIA OPENSHIFT"

  # developer-hub #1: the Catalog. RHDH gates on a "Select a sign-in method" chooser offering
  # Guest and GitHub; the lab tells attendees to click Enter (guest), so the capture does the
  # same. "Owner" is a Catalog table column — it is absent from the sign-in gate, so waiting on
  # it proves we are past the chooser and on the real table.
  - slug: developer-hub-golden-paths
    filename: developer-hub-golden-paths-01-catalog-components.png
    url: https://backstage-developer-hub-rhdh.{domain}/catalog
    click_text: ["Enter"]
    wait_text: "Owner"

  # developer-hub #3: the Create page listing the golden-path Software Templates.
  - slug: developer-hub-golden-paths
    filename: developer-hub-golden-paths-03-create-templates.png
    url: https://backstage-developer-hub-rhdh.{domain}/create
    click_text: ["Enter"]
    wait_text: "Templates"

  # securing-apps-keycloak #6: the realm-branded Keycloak login form. The manifest's ideal is a
  # recording of the app -> Keycloak -> app redirect, which needs the module's entry state and a
  # sign-in; this is the still of the login page itself, reached via the realm's account console.
  # Realm name is per-attendee (realm-<user>) — repoint before capturing on another cluster.
  - slug: securing-apps-keycloak
    filename: securing-apps-keycloak-06-keycloak-login.png
    url: https://keycloak-sso-workshop.{domain}/realms/realm-user1/account/
    wait_text: "Sign in"
