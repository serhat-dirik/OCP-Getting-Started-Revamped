# One-off: the subset of outstanding media-manifest rows that the cluster state staged for the
# 2026-07-30 grounding pass can actually satisfy, before those namespaces are reset. See the audit
# in this session's report for the full walk of user1-dev / user1-ai / user1-cicd / user1-batch —
# only ONE row cleared the bar; everything else needed either staging this run must not perform
# (ws start/solve/reset, scaling, creating PipelineRuns) or a product/page this harness cannot
# reach (RHACS, Rekor UI, the Traces multi-click flow).
#
# NO `reshoot: true` anywhere in this file — nothing here overwrites an existing asset.
#
# Note on field names: this repo's capture.py uses `wait_text` / `wait_all_text` for positive
# text assertions and `check_text` only for tickable checkboxes (see capture.py's Job dataclass,
# ~line 132) — NOT for general state assertions. The job below uses `wait_all_text` +
# `forbid_text` + `require_in_frame`, which is what the actual schema provides for "assert the
# view AND the state, and that it's in the picture."

jobs:

  # ===== agentic-ai — {user}-ai; read-only, no pre_sh, no staging =============================
  #
  # Current live state (verified via `oc get deploy,pods,svc,route -n user1-ai`, read-only,
  # 2026-07-30): parasol-agent 1/1, claims-db 1/1, policy-docs 1/1, all Running/Ready, no
  # CrashLoopBackOff, no pending rollout. This is exactly the state the manifest row and
  # lab.adoc:148 describe ("three workloads — parasol-agent, claims-db, and policy-docs — each
  # drawn as a D (Deployment) icon inside a dark-blue double ring, which fills in once the pod
  # passes its readiness probe"). No agent invocation was made to reach this state — it is the
  # namespace as staged.
  - slug: agentic-ai
    filename: agentic-ai-01-topology-three-pods.png
    url: https://console-openshift-console.{domain}/topology/ns/user1-ai
    # Name all three objects; a landmark like "Topology" alone is satisfied by the page chrome
    # before any node renders (the same trap README.md rule 2 documents for m12/m13).
    wait_all_text: ["parasol-agent", "claims-db", "policy-docs"]
    forbid_text: ["Access restricted", "An error occurred", "not found", "Log in with"]
    # The three node labels must be in the shot, not merely in the DOM off-screen — three nodes
    # comfortably fit the default viewport, but assert it rather than assume it (RUNBOOK rule 4 /
    # the trusted-supply-chain-03 lesson).
    require_in_frame: ["parasol-agent", "claims-db", "policy-docs"]
    settle_ms: 10000

