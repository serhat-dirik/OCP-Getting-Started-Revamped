  #                            not exist and cannot be produced without a PipelineRun create (hard
  #                            rule 3). -03 (imagestream-tags) is already captured and on disk —
  #                            no reshoot. Also noted per the mid-run Pipeline-Details-canvas
  #                            warning: any future Pipeline/PipelineRun shot here must wait for
  #                            networkidle (or the graph DOM), and check_text/wait_all_text must
