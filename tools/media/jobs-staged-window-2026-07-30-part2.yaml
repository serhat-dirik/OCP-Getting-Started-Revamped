# One-off, second pass: shots the 2026-07-30 staged window can ALSO satisfy, found after
# jobs-staged-window-2026-07-30.yaml landed the agentic-ai Topology shot and closed the window's
# first sweep. Re-verified live against `oc get` on 2026-07-30, same session.
#
# NO `reshoot: true` anywhere in this file — nothing here overwrites an existing asset.

jobs:

  # ===== serverless-zero-to-hero — {user}-dev; read-only, no pre_sh, no staging ================
  #
  # Live state verified 2026-07-30 (`oc get ksvc,revision -n user1-dev`): the parasol-claims ksvc's
  # only revision, parasol-claims-v1, is READY=True with ACTUAL/DESIRED REPLICAS both 0 — Knative
  # scaled it to zero on its own after the entry-state materialization went idle. This is exactly
  # the manifest's row 1 ("holding zero pods") and needed no traffic drive/generate/scale action —
  # the marquee "scaled to zero" state was simply what the namespace was already doing.
  #
  # Row 2 (scaled-up-under-burst) is NOT attempted here: it needs a live traffic burst, which is a
  # state-creating action outside "capture what is already true" for this pass. Row 3 (v1/v2 split)
  # and row 4 (Eventing Broker/Trigger/PingSource) are NOT satisfiable — this entry state has only
  # one revision (no v2 exists) and `oc get broker,trigger,pingsource -n user1-dev` returned no
  # resources.
  - slug: serverless-zero-to-hero
    filename: serverless-zero-to-hero-01-topology-scaled-to-zero.png
    url: https://console-openshift-console.{domain}/topology/ns/user1-dev
    # Name the ksvc AND the zero-pod state, not just page furniture (README rule 2). The Topology
    # canvas itself needs network-idle to paint nodes at all (README rule 2 / the m12/m13 trap) —
    # settle_ms below is generous for that.
    wait_all_text: ["parasol-claims"]
    forbid_text: ["Access restricted", "An error occurred", "not found", "Log in with"]
    # The node label must be IN the shot, not merely in the DOM (RUNBOOK rule 4).
    require_in_frame: ["parasol-claims"]
    settle_ms: 10000

  # ===== agentic-ai — {user}-ai; read-only, no pre_sh, no staging ==============================
  #
  # Two more static, already-grounded views (lab.adoc:151/159-162 and :474/482-488, both grounded
  # 2026-07-30 by direct browsing and left as prose corrections with no image embed yet). Both
  # describe views that are stable regardless of what the agent is doing — they do not need an
  # /agent/ask call, unlike the pod-log-tool-schemas and metrics-tokens rows (skipped below).

  # Container details page: reached in the console via Topology -> click parasol-agent -> Resources
  # tab -> click the pod -> click the container row — but it is also a directly-addressable object
  # page, so it is reached here by URL instead of by driving four clicks through an SVG topology
  # canvas (click_text only matches button/a/div[role=button]/label elements; a topology node is
  # none of those). Same page, no click-path risk.
  - slug: agentic-ai
    filename: agentic-ai-09-pod-container-details.png
    url_sh: |
      POD=$(oc get pod -n user1-ai -l app=parasol-agent -o jsonpath='{.items[0].metadata.name}')
      echo "https://console-openshift-console.{domain}/k8s/ns/user1-ai/pods/$POD/containers/parasol-agent"
    wait_all_text: ["Readiness probe", "Liveness probe", "image-registry.openshift-image-registry.svc"]
    forbid_text: ["Access restricted", "An error occurred", "not found", "Log in with"]
    require_in_frame: ["Readiness probe", "Liveness probe"]
    settle_ms: 4000

  # Topology side panel, Resources tab: this one genuinely lives only inside the Topology graph
  # interaction (click the node, then the Resources tab) — there is no equivalent object-page URL
  # for a Topology side-panel tab. Attempted via click_text on the chance the node/tab are
  # accessible-role elements; if the topology node does not match click_text's selector set
  # (button, a, div[role="button"], label — an SVG graph node typically is none of these), the
  # click silently no-ops (README: "Missing buttons are skipped, not fatal") and the subsequent
  # wait_all_text assertion fails closed rather than shooting the wrong (unclicked) view. That
  # failure is the correct, safe outcome for an UI this harness cannot reliably drive — see the
  # report for what actually happened.
  - slug: agentic-ai
    filename: agentic-ai-10-deployment-resources-tab.png
    url: https://console-openshift-console.{domain}/topology/ns/user1-ai
    click_text: ["parasol-agent", "Resources"]
    wait_all_text: ["Pods", "Services", "Routes", "View logs"]
    forbid_text: ["Access restricted", "An error occurred", "not found", "Log in with"]
    require_in_frame: ["Pods", "Services", "Routes", "View logs"]
    settle_ms: 4000

