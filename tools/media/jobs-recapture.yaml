# Re-capture batch — the images the manifests flag ❌ RE-CAPTURE that no job file covered.
#
# WHY THIS FILE EXISTS. Eight images carry a ❌ RE-CAPTURE flag. Checking each against the job specs
# rather than against the manifests (2026-07-29) showed the manifests are NOT a reliable backlog:
#
#   observability-01-observe-metrics   ALREADY FIXED — recaptured + committed df7acda 14:53 today;
#                                      its `reshoot` flag was correctly removed, but the manifest row
#                                      still says ❌ RE-CAPTURE. Manifest is stale, not the image.
#   pipelines-01-pipelinerun-graph     covered by jobs-pipelines-fundamentals.yaml (reshoot: true)
#   observability-02-observe-traces    parked — the Traces page cannot be driven from a URL
#   observability-03-topology-hpa      parked — the HPA ceiling of 4 replicas CANNOT be scheduled on
#                                      this cluster (one untainted worker, 9Mi free). Environmental.
#   gitops-07-gitea-edit-overlay       parked — needs an UNCOMMITTED edit in progress
#
# That leaves the three below. Two had no spec at all, which is why they were never re-shot; the
# third is parked here with its reason so it stops reappearing as untriaged work.
#
# THE ASSERT IS THE POINT. Both previous failures were shots that succeeded at capturing the wrong
# thing: build-deliver-04 waited on a heading and got a two-node topology missing the very workload
# its caption is about. So each job below asserts, in `wait_all_text`, every element the caption
# promises — if the state is not there the run REFUSES to shoot rather than producing a plausible
# wrong PNG, and a refusal is a finding, not a failure.

jobs:
  - slug: build-deliver
    filename: build-deliver-04-topology-built-and-wired.png
    reshoot: true
    # The asset on disk (1c8a6f3, 07-17) shows TWO nodes, ungrouped, with no parasol-notifications and
    # no visible connector — it contradicts the grouped-topology step it illustrates. Naming all three
    # workloads here is the fix: a topology missing one of them can no longer be photographed.
    #
    # REQUIRES `oc` ON THE WORKSHOP CLUSTER — unlike the shot below, this one cannot be taken from a
    # browser session alone. Measured live on cluster-ksls5 2026-07-29: user1-dev holds claims-db,
    # parasol-claims and parasol-web, all 1/1, and NO parasol-notifications. So the state this caption
    # describes does not currently exist anywhere and `ws solve build-deliver` has to build it.
    #
    # OPEN CONTENT QUESTION, not a capture problem: parasol-notifications has been absent every time
    # this shot was attempted, which is why the committed asset shows two nodes. Either the module's
    # solve state does not create it — in which case the entry state is wrong — or the caption names a
    # workload the lab never produces, in which case the caption is wrong. Whoever runs this must
    # settle that before re-shooting; a green capture would otherwise just re-photograph the same gap.
    pre_sh: >-
      ./tools/ws/ws start build-deliver --user user1 &&
      ./tools/ws/ws solve build-deliver --user user1
    pre_wait_s: 60
    url: https://console-openshift-console.{domain}/topology/ns/user1-dev
    wait_all_text: ["parasol-claims", "claims-db", "parasol-notifications"]
    forbid_text: ["Access restricted", "No resources found", "not available"]
    settle_ms: 10000

  - slug: platform-orientation
    filename: platform-orientation-04-unified-console-landmarks.png
    reshoot: true
    # Owner review 2026-07-14 asked for this as `user1`, on the CURRENT nav — i.e. with the Pipelines,
    # GitOps and ACS console plugins mounted. Asserting the plugin nav entries is what distinguishes
    # "the console rendered" from "the console rendered WITH our plugins": pipelines-01 failed exactly
    # this way, firing before the Tekton plugin mounted and degrading to core tabs.
    # The Quick create (+) menu is a landmark to annotate, not a state to open — it renders in a portal
    # that did not surface in the accessibility tree when grounded on 2026-07-29, so it is not asserted.
    # NO pre_sh, deliberately. Checked live on cluster-ksls5 2026-07-29 through the authenticated
    # attendee session: user1-dev already exists and the nav already carries Pipelines/GitOps/ACS, so
    # this shot needs no state change at all. Running `ws start` here would PURGE and rebuild a healthy
    # namespace for a screenshot that does not need it — 5-25 minutes of risk for nothing.
    #
    # FIRST ATTEMPT PASSED EVERY ASSERT AND WAS STILL UNUSABLE (2026-07-29). The asserts were
    # ["user1-dev", "Pipelines", "GitOps"] — every one of those is NAV text, present the instant the
    # console shell renders. None of them says anything about the panel the screenshot is ABOUT, so the
    # run happily photographed an empty topology canvas with a loading spinner, seconds after `ws start`
    # had purged the namespace. Exactly the failure class this file's own header warns about.
    # The fix is to assert a workload that only exists once the canvas has actually drawn.
    pre_wait_s: 20
    url: https://console-openshift-console.{domain}/topology/ns/user1-dev
    wait_all_text: ["user1-dev", "Pipelines", "GitOps", "parasol-claims", "claims-db"]
    forbid_text: ["Access restricted", "Error Loading", "not available"]
    settle_ms: 20000

  - slug: gitops-fundamentals
    filename: gitops-fundamentals-02-new-app-form.png
    parked: >-
      The manifest asks for the Argo CD "+ NEW APP" panel already FILLED IN — Application Name
      claims-dev-user1, Project proj-user1, Sync Policy Manual, repo/revision/path/namespace — and its
      own row calls it bespoke. That is a form-fill, not a URL: the panel holds no state that a link can
      reach, so nothing this harness does can produce it. The committed asset is not wrong in content,
      it is scrolled past the GENERAL section so Application Name, Project and Sync Policy sit
      off-screen. Options are (a) a human fills the form and screenshots it, or (b) the caption is
      rewritten to describe only the fields that ARE visible. Both are decisions, not capture work.
