# M07 (pipelines-fundamentals) capture list — see tools/media/README.md and RUNBOOK.md.
#
# CONFLICT WARNING, READ FIRST. pipelines-fundamentals and trusted-supply-chain both own
# {user}-cicd and declare each other in `conflictsWith`. Starting either one EVICTS the other's
# entry app and PURGES the namespace — including the signed ImageStream that
# trusted-supply-chain-03 needs. Take every M08 shot before running anything in this file.
#
# WHAT WAS WRONG WITH THE OLD VERSION (2026-07-29 audit). Every job hardcoded a PipelineRun name
# captured on 2026-07-26 — `…-run-2762r`, `…-run-s2cns`. Those runs no longer exist on any cluster;
# the namespace currently holds trusted-supply-chain's world instead. Four jobs would have spent a
# minute each timing out on a 404. Runs are created with `generateName`, so a literal name in a job
# file is correct exactly once. They are resolved with `url_sh` now.
#
# `{domain}` is substituted at run time from --domain / $OGSR_DOMAIN, in `url` and `url_sh` only.
# NEVER hardcode a live cluster domain: CI's privacy guard fails the build on one in any tracked
# file.
#
# Four of these six are already on disk and marked ✅ CAPTURED in the manifest, so capture.py skips
# them (`KEEP`) unless a job says `reshoot: true`. That is intentional — see RUNBOOK.md "the
# clobber guard". Only shot 01 is a genuine re-shoot.
jobs:

  # --- 01: the RE-SHOOT, and the ONE job in this file that runs. Shot as **user2**, deliberately.
  #
  # THE SLOT IS AN OWNER DECISION (2026-08-01), taken against this module's own manifest note, which
  # asked for user1 so all five frames would show the same namespace. `user1-cicd` on the capture
  # cluster is holding **trusted-supply-chain** — its signed `.sig`/`.att` ImageStream tags are in
  # place and that module's own row 1 is still uncaptured. The two modules declare each other in
  # `conflictsWith` both ways, so `ws start pipelines-fundamentals --user user1` would purge that
  # namespace and destroy an unshot state to gain cosmetic consistency. `user2-cicd` already held a
  # finished green five-Task run, so this frame shows `user2-cicd` beside four neighbours showing
  # `user1-cicd`. That is the accepted cost; do not "fix" it by rebuilding user1.
  #
  # The staging script REUSES a green run when the namespace already has one and only falls back to
  # `ws start` + `ws solve` (~9 min warm, ~13 cold) when it does not — so on a namespace that is
  # already correct this job costs seconds and touches nothing.
  - slug: pipelines-fundamentals
    filename: pipelines-fundamentals-01-pipelinerun-graph.png
    # `reshoot: true` was REMOVED on 2026-08-01, the moment the good shot landed. The flag existed
    # for one specific replacement (the old asset predated the Tekton console plugin and had no
    # graph); leaving it armed means the next wholesale run of this file overwrites a verified frame
    # with whatever `user2-cicd` looks like then — the clobber that cost the M10 drift diff. The job
    # stays here so the shot is reproducible on a fresh cluster; re-arm the flag deliberately, and
    # only if the manifest row goes back to ❌ RE-CAPTURE.
    pre_sh: ./tools/media/stage-pipelines-fundamentals.sh user2
    pre_wait_s: 10
    # The newest run whose `Succeeded` condition is True — not merely the newest, which could be a
    # failed or still-running one, and `url_sh` cannot tell those apart from the URL alone. Empty
    # output fails the job loudly rather than navigating to a truncated URL and shooting whatever
    # answers. Indexing conditions by TYPE, not by [0]: the array order is not part of the contract.
    url_sh: >-
      run=$(oc -n user2-cicd get pipelinerun
      -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.conditions[?(@.type=="Succeeded")].status}{"\n"}{end}'
      | awk '$2=="True"{print $1}' | tail -1);
      test -n "$run" && echo "https://console-openshift-console.{domain}/k8s/ns/user2-cicd/tekton.dev~v1~PipelineRun/$run"
    # All five Task names, not just one: a PipelineRun page WITHOUT the Tekton console plugin still
    # renders the run name and its Details/YAML tabs, which is exactly how the pulled 2026-07-26
    # shot passed review the first time. Only the plugin's DAG draws every pipelineTask.
    wait_all_text: ["fetch-source", "unit-test", "build-image", "image-report", "deploy"]
    forbid_text: ["Access restricted", "An error occurred", "not found", "Log in with"]
    # The graph is the subject. innerText carries the TaskRuns section far below the fold, so a text
    # wait alone cannot tell the DAG from a list of the same names — this measures the boxes.
    require_in_frame: ["fetch-source", "image-report"]
    viewport: {width: 1600, height: 1200}
    settle_ms: 8000

  # --- 03: the RED break-fix run. NOT materialisable by any entry state or solve hook: the failure
  # is the attendee breaking a unit test in their fork in exercise 3. `ws solve` only ever produces
  # a green run. The asset on disk is ✅ CAPTURED, so this job is a placeholder that documents why
  # there is nothing to re-run — do not point it at a green run's URL.
  - slug: pipelines-fundamentals
    filename: pipelines-fundamentals-03-pipelinerun-failed.png
    parked: >-
      Needs a FAILED run, which only exists after a human breaks a test in their Gitea fork
      (exercise 3). No entry state or solve hook produces one. The captured asset is good; leave it.

  # --- 04: results on the Output tab, not Details. Same run as 01, resolved the same way.
  - slug: pipelines-fundamentals
    filename: pipelines-fundamentals-04-pipelinerun-results.png
    url_sh: >-
      run=$(oc get pipelinerun -n user1-cicd --sort-by=.metadata.creationTimestamp
      -o jsonpath='{range .items[?(@.status.conditions[0].status=="True")]}{.metadata.name}{"\n"}{end}'
      | tail -1);
      test -n "$run" && echo "https://console-openshift-console.{domain}/k8s/ns/user1-cicd/tekton.dev~v1~PipelineRun/$run/output"
    # Corrects a long-standing content error: results are on the Output tab, NOT on Details. The
    # result NAME is the proof the tab rendered its table; the heading alone is on the empty tab.
    wait_all_text: ["PipelineRun results", "image-within-budget"]

  # --- 05: the Pipeline (not PipelineRun) topology graph.
  - slug: pipelines-fundamentals
    filename: pipelines-fundamentals-05-pipeline-details-graph.png
    url: https://console-openshift-console.{domain}/k8s/ns/user1-cicd/tekton.dev~v1~Pipeline/parasol-claims-build-test-deploy
    # `image-report` is the pipelineTask name the graph draws; `shared-workspace` is the workspace
    # row further down the Details page. Neither is on the Pipelines LIST page, which is what a
    # weaker wait would have accepted. NOTE: the resolved Task name (`image-size-report`) lives in
    # the cluster-resolver params and may only be visible on the YAML tab — do not wait on it.
    wait_all_text: ["image-report", "shared-workspace"]

  # --- 06: the Pipelines-as-Code Repository. Shipped by the entry state, so `ws start` is enough.
  - slug: pipelines-fundamentals
    filename: pipelines-fundamentals-06-pac-repository.png
    url: https://console-openshift-console.{domain}/k8s/ns/user1-cicd/pipelinesascode.tekton.dev~v1alpha1~Repository/parasol-claims
    # Note there is NO "Git provider" field on this page, despite what the lab used to claim.
    # `parasol-claims` pairs the object with the field so the Repositories LIST page cannot satisfy
    # this wait on its own.
    wait_all_text: ["Webhook secret", "parasol-claims"]

  # --- 02: the Gitea webhook form. Interactive: the attendee fills Target URL, content type and
  # secret in Gitea's Add Webhook page. A URL-only job can reach the empty form, which is not the
  # shot the manifest describes.
  - slug: pipelines-fundamentals
    filename: pipelines-fundamentals-02-gitea-webhook.png
    parked: >-
      Gitea's Add Webhook form has to be FILLED to be worth a picture (PaC controller route,
      application/json, the shared secret, Push Events). Nothing pre-fills it from a URL, and Gitea
      has its own local login that the console session does not carry. Needs a human. Remember
      ?lang=en-US on any Gitea URL — Gitea honours Accept-Language and renders translated.
