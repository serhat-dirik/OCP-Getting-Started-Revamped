# M07 (pipelines-fundamentals) capture list — see tools/media/README.md.
#
# `{domain}` is substituted at run time from --domain / $OGSR_DOMAIN. NEVER hardcode a live
# cluster domain here: CI's privacy guard fails the build on one in any tracked file.
#
# The `wait_text` values are not guesses — each was read off the live 4.22.5 console during the
# 2026-07-26 grounding pass. They are chosen to appear ONLY on the settled page: the console
# shell, its nav sidebar and even document.title all resolve seconds before the plugin-provided
# tabs and tables mount, so waiting on anything less captures a half-rendered page.
#
# RUN NAMES ARE PER-CLUSTER. The two PipelineRun jobs below reference runs created on
# 2026-07-26. Re-point them at your own runs before capturing: `oc get pipelineruns -n
# <user>-cicd`. A green run and a failed run are both needed (the failed one is the whole
# point of exercise 3).
jobs:
  - slug: pipelines-fundamentals
    filename: pipelines-fundamentals-01-pipelinerun-graph.png
    url: https://console-openshift-console.{domain}/k8s/ns/user1-cicd/tekton.dev~v1~PipelineRun/parasol-claims-build-test-deploy-run-2762r
    # Only present once the run's Conditions table has rendered, well after the graph frame.
    wait_text: "Tasks Completed"

  - slug: pipelines-fundamentals
    filename: pipelines-fundamentals-03-pipelinerun-failed.png
    url: https://console-openshift-console.{domain}/k8s/ns/user1-cicd/tekton.dev~v1~PipelineRun/parasol-claims-build-test-deploy-run-s2cns
    # A failed run's Details page grows this panel; it is absent on a green run.
    wait_text: "Log snippet"

  - slug: pipelines-fundamentals
    filename: pipelines-fundamentals-04-pipelinerun-results.png
    url: https://console-openshift-console.{domain}/k8s/ns/user1-cicd/tekton.dev~v1~PipelineRun/parasol-claims-build-test-deploy-run-2762r/output
    # Corrects a long-standing content error: results are on the Output tab, NOT on Details.
    wait_text: "PipelineRun results"

  - slug: pipelines-fundamentals
    filename: pipelines-fundamentals-05-pipeline-details-graph.png
    url: https://console-openshift-console.{domain}/k8s/ns/user1-cicd/tekton.dev~v1~Pipeline/parasol-claims-build-test-deploy
    # The Tasks list naming each resolved Task renders after the topology graph.
    wait_text: "image-size-report"

  - slug: pipelines-fundamentals
    filename: pipelines-fundamentals-06-pac-repository.png
    url: https://console-openshift-console.{domain}/k8s/ns/user1-cicd/pipelinesascode.tekton.dev~v1alpha1~Repository/parasol-claims
    # Note there is NO "Git provider" field on this page, despite what the lab used to claim.
    wait_text: "Webhook secret"
