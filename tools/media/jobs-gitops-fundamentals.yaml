# M10 (gitops-fundamentals) Argo CD app-state captures.
#
# STATE-DEPENDENT: each shot needs the app in a particular condition, so these are NOT a
# single batch — run them one at a time as you drive the exercise, with --only or by
# commenting out the rest. The sequence is:
#   03  right after create, before any sync   -> OutOfSync / Missing
#   04  after SYNC completes                  -> Synced / Healthy
#   05  after drifting a live replica count   -> OutOfSync with the diff open
#   06  after enabling auto-sync + self-heal  -> the Sync Policy panel
#
# The profile must be signed into the STUDENT Argo as the attendee via `workshop-users`;
# a console session does not carry (see README).
jobs:
  - slug: gitops-fundamentals
    filename: gitops-fundamentals-03-app-outofsync-missing.png
    url: https://student-gitops-server-student-gitops.{domain}/applications/ogsr-student-gitops/claims-dev-user1
    # "Missing" only appears while nothing has been applied yet — it is the state itself,
    # which makes it the right thing to wait on rather than a generic page landmark.
    wait_text: "Missing"
    settle_ms: 6000

  - slug: gitops-fundamentals
    filename: gitops-fundamentals-04-app-synced-healthy.png
    url: https://student-gitops-server-student-gitops.{domain}/applications/ogsr-student-gitops/claims-dev-user1
    wait_text: "Healthy"
    settle_ms: 6000

  # 05: drift. The lab's own step is `oc scale deployment/parasol-claims --replicas=3`, which
  # makes live disagree with Git (Git says 1). Run that FIRST — the diff only exists while the
  # app is OutOfSync. click_text drives the app's DIFF button and then the "Compact diff"
  # toggle, which collapses the manifest to just the differing lines (the whole point of the
  # shot). Both are clicked via their DOM rect — Argo's buttons do not resolve as locators.
  - slug: gitops-fundamentals
    filename: gitops-fundamentals-05-drift-diff.png
    url: https://student-gitops-server-student-gitops.{domain}/applications/ogsr-student-gitops/claims-dev-user1
    wait_text: "OutOfSync"
    click_text: ["DIFF"]
    check_text: ["Compact diff"]
    settle_ms: 7000

  # 06: the Sync Policy block on the app's DETAILS panel, after exercise 3 turns on auto-sync
  # and self-heal. Measured on this cluster: self-heal reverted an `oc scale --replicas=3`
  # drift in under 8s (the lab says ~4s — it is watch-triggered, not the 90s reconcile).
  - slug: gitops-fundamentals
    filename: gitops-fundamentals-06-enable-selfheal.png
    url: https://student-gitops-server-student-gitops.{domain}/applications/ogsr-student-gitops/claims-dev-user1
    wait_text: "Healthy"
    click_text: ["DETAILS"]
    # SYNC POLICY sits below the fold in the details drawer, which scrolls internally.
    scroll_to_text: "SYNC POLICY"
    settle_ms: 5000

  # 08: the SAME diff view, but the drift came from GIT this time, not the cluster — exercise 4
  # commits count 2 -> 3 in overlays/stage/kustomization.yaml, so desired is 3 and live is 2.
  # That inversion is the module's point, so it is worth having both shots.
  - slug: gitops-fundamentals
    filename: gitops-fundamentals-08-stage-gitdriven-diff.png
    url: https://student-gitops-server-student-gitops.{domain}/applications/ogsr-student-gitops/claims-stage-user1
    wait_text: "OutOfSync"
    click_text: ["DIFF"]
    check_text: ["Compact diff"]
    settle_ms: 7000
