# gitops-fundamentals — Argo CD app-state captures.
#
# SIX OF THESE EIGHT ARE ALREADY DONE. The manifest marks 01/03/04/05/06/08 ✅ CAPTURED, and
# capture.py now refuses to overwrite a file that exists unless the job sets `reshoot: true`. So
# running this file is safe by default: the six print `KEEP` and nothing good is lost. Do not add
# `reshoot: true` to any of them to "refresh" the set — 05 is the module's signature shot and the
# state that produced it (a live/Git replica disagreement with the diff panel open and Compact diff
# ticked) is not one you get back by re-running a job.
#
# STATE-DEPENDENT, one direction. If you ever DO recapture on a fresh cluster, these are not a
# batch — drive the exercise and shoot as you go:
#   03  right after CREATE, before any sync    -> OutOfSync / Missing
#   04  after SYNC completes                   -> Synced / Healthy
#   05  after drifting a live replica count    -> OutOfSync with the diff open
#   06  after enabling auto-sync + self-heal   -> the Sync Policy panel
#   08  after the exercise-4 commit in Gitea   -> the same diff, driven from Git instead
#
# AND NOTE WHAT `ws solve` CANNOT GIVE YOU. Solve creates claims-dev-<user> and claims-stage-<user>
# already synced, so it produces 04 and 06 but never 03 (Missing exists only before the first sync)
# and never 05 (the drift is the attendee's `oc scale`). The apps are attendee-created in exercise
# 1 through the `+ NEW APP` panel; as of this writing ogsr-student-gitops holds none, so every job
# below except 07 would fail on a cold cluster until someone walks the lab.
#
# The profile must be signed into the STUDENT Argo as the attendee via `workshop-users`; a console
# session does not carry (see README).
jobs:
  - slug: gitops-fundamentals
    filename: gitops-fundamentals-03-app-outofsync-missing.png
    url: https://student-gitops-server-student-gitops.{domain}/applications/ogsr-student-gitops/claims-dev-user1
    # "Missing" only exists while nothing has been applied yet — it is the state itself, which
    # makes it the right thing to wait on. Pairing it with OutOfSync rules out a half-rendered
    # tree that has drawn the health column but not the sync column.
    wait_all_text: ["Missing", "OutOfSync"]
    settle_ms: 6000

  - slug: gitops-fundamentals
    filename: gitops-fundamentals-04-app-synced-healthy.png
    url: https://student-gitops-server-student-gitops.{domain}/applications/ogsr-student-gitops/claims-dev-user1
    # "Healthy" alone is true of an app that is Healthy but still OutOfSync — which is the state
    # shot 05 captures. Both words, or the two shots make the same claim.
    wait_all_text: ["Healthy", "Synced"]
    forbid_text: ["OutOfSync"]
    settle_ms: 6000

  # 05: drift. The lab's own step is `oc scale deployment/parasol-claims --replicas=3`, which makes
  # live disagree with Git (Git says 1). Run that FIRST — the diff only exists while the app is
  # OutOfSync. click_text drives the app's DIFF button; check_text ticks "Compact diff", which
  # collapses the manifest to just the differing lines (the whole point of the shot) and is
  # idempotent because Argo PERSISTS that toggle across visits — a blind click turned it off on the
  # second capture and silently produced the full manifest. Both are driven by DOM rect: Argo's
  # buttons do not resolve as Playwright locators.
  - slug: gitops-fundamentals
    filename: gitops-fundamentals-05-drift-diff.png
    url: https://student-gitops-server-student-gitops.{domain}/applications/ogsr-student-gitops/claims-dev-user1
    wait_text: "OutOfSync"
    click_text: ["DIFF"]
    check_text: ["Compact diff"]
    settle_ms: 7000

  # 06: the Sync Policy block on the app's DETAILS panel, after exercise 3 turns on auto-sync and
  # self-heal. Measured on this cluster: self-heal reverted an `oc scale --replicas=3` drift in
  # under 8s (the lab says ~4s — it is watch-triggered, not the 90s reconcile).
  - slug: gitops-fundamentals
    filename: gitops-fundamentals-06-enable-selfheal.png
    url: https://student-gitops-server-student-gitops.{domain}/applications/ogsr-student-gitops/claims-dev-user1
    wait_text: "Healthy"
    click_text: ["DETAILS"]
    # SYNC POLICY sits below the fold in the details drawer, which scrolls internally. This is also
    # the assertion that the drawer opened at all — a missing scroll target fails the job.
    scroll_to_text: "SYNC POLICY"
    settle_ms: 5000

  # 08: the SAME diff view, but the drift came from GIT this time, not the cluster — exercise 4
  # commits count 2 -> 3 in overlays/stage/kustomization.yaml, so desired is 3 and live is 2. That
  # inversion is the module's point, so it is worth having both shots.
  - slug: gitops-fundamentals
    filename: gitops-fundamentals-08-stage-gitdriven-diff.png
    url: https://student-gitops-server-student-gitops.{domain}/applications/ogsr-student-gitops/claims-stage-user1
    wait_text: "OutOfSync"
    click_text: ["DIFF"]
    check_text: ["Compact diff"]
    settle_ms: 7000

  # 07: PARKED. It was a plain job; it cannot be one.
  - slug: gitops-fundamentals
    filename: gitops-fundamentals-07-gitea-edit-overlay.png
    parked: >-
      The manifest asks for the Gitea editor showing `count: 2` changed to `count: 3` with the
      Commit Changes panel — i.e. an UNCOMMITTED edit in progress. Opening Gitea's _edit URL shows
      whatever the file currently holds, and the entry state re-asserts the fork's canonical content
      on every start/reset, so on a clean cluster that is `count: 2` and the shot contradicts its
      caption. Making it right means either typing in the editor (interactive) or pushing the
      exercise-4 commit to the attendee's fork first, which needs their Gitea credentials. Also note
      the committed asset was flagged ❌ RE-CAPTURE for a second reason: the Commit Changes panel is
      below the fold, so whoever redoes it must scroll. Remember ?lang=en-US on the URL — Gitea
      honours Accept-Language and one capture came back entirely in Turkish. COORDINATOR DECISION.

  # 02: not a job at all, recorded so nobody wonders. The `+ NEW APP` panel is a modal with no
  # route of its own, and the manifest wants it FILLED (name, project, Manual sync policy, repo,
  # revision, path, namespace). Marked ❌ RE-CAPTURE because the existing asset is scrolled past the
  # GENERAL section. Needs a human driving the form.
