# One-off, third pass on the 2026-07-30 staged window: `ws solve` was run for storage-stateful and
# then observability-health-scale a few minutes apart. Both entry apps own {user}-dev and are
# declared conflictsWith in both directions (gitops/entry-states/storage-stateful/ws-meta.yaml,
# gitops/entry-states/observability-health-scale/ws-meta.yaml) — so the later solve (observability)
# EVICTED storage-stateful and purged its StatefulSet/PVC before this pass started. Verified live
# 2026-07-30: `oc get pvc,statefulset -n user1-dev` returns "No resources found" and claims-db is a
# plain Deployment, not the StatefulSet the storage-stateful lab creates. That window had already
# closed by the time this file was written — see the report for the full walk.
#
# The two jobs below are the rows that survive that fact: neither depends on the state that was
# just evicted. storage-stateful-02 is a cluster-scoped StorageClass, unaffected by which module
# owns {user}-dev. multi-tenancy-workload-security-03 is the workshop-config ResourceQuota, present
# in every user namespace regardless of which module's entry app materialized it.
#
# NO `reshoot: true` anywhere in this file — nothing here overwrites an existing asset.

jobs:

  # ===== storage-stateful — cluster-scoped StorageClass; read-only, no pre_sh ===================
  #
  # Confirmed grounded in lab.adoc (section "5. Inspect the storage chain", grounded 2026-07-30 as
  # attendee user1): the detail page at /k8s/cluster/storageclasses/<name> shows Provisioner,
  # Reclaim policy, Volume binding mode and Allow volume expansion. `oc auth can-i get
  # storageclasses --as=user1 --as-group=workshop-attendees` returns yes (cluster-scoped resources
  # are readable by attendees). Live values confirmed via `oc get sc
  # ocs-external-storagecluster-ceph-rbd -o yaml`: provisioner
  # openshift-storage.rbd.csi.ceph.com, volumeBindingMode WaitForFirstConsumer, allowVolumeExpansion
  # true, annotation storageclass.kubernetes.io/is-default-class: "true".
  - slug: storage-stateful
    filename: storage-stateful-02-storageclass.png
    url: https://console-openshift-console.{domain}/k8s/cluster/storageclasses/ocs-external-storagecluster-ceph-rbd
    wait_all_text:
      - "ocs-external-storagecluster-ceph-rbd"
      - "openshift-storage.rbd.csi.ceph.com"
      - "WaitForFirstConsumer"
    forbid_text: ["Access restricted", "An error occurred", "not found", "Log in with"]
    require_in_frame:
      - "openshift-storage.rbd.csi.ceph.com"
      - "WaitForFirstConsumer"
    settle_ms: 4000

  # ===== multi-tenancy-workload-security — ResourceQuota gauges; read-only, no pre_sh ============
  #
  # Grounded in lab.adoc already (comment dated 2026-07-26, verified live OCP 4.22.5): the
  # ResourceQuota detail page leads with used/hard gauges over a "Resource type / Capacity / Used /
  # Max" table listing limits.cpu, limits.memory, persistentvolumeclaims, pods, requests.cpu,
  # requests.memory. Live state confirmed via `oc get resourcequota workshop-quota -n user1-dev -o
  # yaml`: requests.memory 832Mi used / 6Gi hard (non-zero gauge, not an empty bar), pods 4/30,
  # requests.cpu 550m/3. This object is not tied to storage-stateful or observability-health-scale —
  # it is the workshop-config baseline quota present in every {user}-dev regardless of which
  # entry app owns the namespace right now.
  - slug: multi-tenancy-workload-security
    filename: multi-tenancy-workload-security-03-resourcequota-gauges.png
    url: https://console-openshift-console.{domain}/k8s/ns/user1-dev/resourcequotas/workshop-quota
    wait_all_text:
      - "workshop-quota"
      - "requests.memory"
      - "requests.cpu"
    forbid_text: ["Access restricted", "An error occurred", "not found", "Log in with"]
    require_in_frame:
      - "requests.memory"
    settle_ms: 4000

  # ----- Everything else considered from the task brief and ruled out, recorded so the reasons
  # stay next to the decision:
  #
  #   storage-stateful-01-pvc-bound.png            needs the `claims-db-data` PVC Bound in
  #                                                 {user}-dev. Evicted — see header note. `oc get
  #                                                 pvc -n user1-dev` returns nothing right now.
  #
  #   observability-health-scale-03-topology-hpa-scale.png   needs the pod ring AT four replicas
  #                                                 under live load. Live state (`oc get hpa
  #                                                 parasol-claims -n user1-dev`): 2/2 replicas,
  #                                                 cpu 5%/60% target — the floor, not the ceiling,
  #                                                 and no load generator is bursting it. Driving a
  #                                                 burst to force the scale-out is exactly the
  #                                                 mutation hard rule 3 forbids in this window; the
  #                                                 module's own manifest already flags the prior
  #                                                 asset on disk as a "calm" false negative of the
  #                                                 same shape. Unchanged from the 2026-07-29 parked
  #                                                 finding in RUNBOOK.md (cluster capacity) — now
  #                                                 also blocked by hard rule 3 regardless of
  #                                                 capacity.
  #
  #   jobs-batch-kueue-01-workloads-admitted.png,
  #   jobs-batch-kueue-02-preempted-conditions.png  both need an in-flight 2-admitted/3-pending or
  #                                                 preempted admission pattern. Live state (`oc get
  #                                                 job,cronjob,workload -n user1-batch`): every Job
  #                                                 is Complete (monthly-statement-solve 6/6,
  #                                                 claims-data-seed/maas-copy/queued-sample 1/1),
  #                                                 the CronJob `nightly-statement` is Suspended with
  #                                                 zero Active runs, and the one Workload is
  #                                                 Admitted+Finished. Reaching either manifest row
  #                                                 means submitting the lab's `batch-low`/
  #                                                 `batch-high` Jobs — object creation, forbidden by
  #                                                 hard rule 3 this window.
  #
  #   multi-tenancy-workload-security-01-deploy-0of1-event.png   needs a `root-demander` Deployment
  #                                                 scaled up so restricted-v2 rejects it. `oc get
  #                                                 deploy --all-namespaces` shows no `root-demander`
  #                                                 deployment anywhere on the cluster right now —
  #                                                 reaching this state means creating/scaling it,
  #                                                 forbidden by hard rule 3.
  #
  #   multi-tenancy-workload-security-02-create-rolebinding.png   the manifest wants the Create
  #                                                 binding FORM already filled (subject=
  #                                                 ServiceAccount payments-ci, role=edit). It is a
  #                                                 modal with no deep-link that arrives pre-filled,
  #                                                 and filling a form is outside a read-only,
  #                                                 no-apply capture job.
