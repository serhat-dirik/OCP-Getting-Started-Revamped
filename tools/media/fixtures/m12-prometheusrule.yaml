# The exact PrometheusRule M12 exercise 2 has the attendee create. Kept as a fixture so the
# capture sweep creates the SAME object the lab does — a shot of a rule the lab never mentions
# would be a lie in a document.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: parasol-claims-alerts
  labels:
    app: parasol-claims
spec:
  groups:
    - name: parasol-claims.rules
      rules:
        - alert: ParasolClaimsErrorRateHigh
          expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 0.1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "parasol-claims is returning server errors"
            description: "The claims API 5xx rate has exceeded 0.1/s for 2m."
