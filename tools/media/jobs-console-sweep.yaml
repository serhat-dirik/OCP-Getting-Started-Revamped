# Console sweep — the console screenshots that are "put the cluster in a state, open a URL, wait
# for real content, shoot". One login, one browser context.
#
# READ tools/media/RUNBOOK.md BEFORE RUNNING THIS. The order below is only half the story; the
# other half is what must already be true when the run starts, and which blocks destroy which.
#
#   cd tools/media
#   KUBECONFIG=~/.kube/<cluster>.config OGSR_DOMAIN=apps.<cluster>.<base> \
#     .venv/bin/python capture.py --jobs jobs-console-sweep.yaml \
#       --profile ~/.ogsr-shot-profile \
#       --login https://console-openshift-console.$OGSR_DOMAIN
#
# ORDER IS LOAD-BEARING, TWICE OVER.
#
#  1. `ws start` EVICTS conflicting modules from the user's namespaces (conflictsWith) and PURGES
#     the namespace. M12 and M13 both own {user}-dev, so starting M13 destroys M12's world. M13
#     therefore comes last, and nothing above it may be re-run afterwards.
#  2. Inside M12 the state moves in ONE direction — healthy baseline → database broken → alert
#     firing → restored → autoscaled. Shot 05 is explicitly the "before" of shot 04; they are the
#     same rule at opposite states and cannot both be true at once.
#
# capture.py now refuses to overwrite a screenshot that is already on disk unless the job says
# `reshoot: true`, so a careless re-run can no longer replace a good capture with a valid-but-wrong
# one. Set that flag only where the module's media-manifest.md marks the row ❌ RE-CAPTURE.
#
# NOT IN HERE, and why — none of these are URL-and-shoot:
#   gitops-at-scale-01-appset-created      terminal output, not a browser view (asciinema/ttyd)
#   gitops-at-scale-03-gitea-image-bump    mid-edit Gitea editor — interactive typing
#   gitops-at-scale-04/05-canary-*         TRANSIENT rollout states; must be caught mid-flight
#   trusted-supply-chain-01-acs-violation  RHACS is a separate product with its own login
#   trusted-supply-chain-02-pipelinerun-*  6–12 min build; see jobs-trusted-supply-chain.yaml
#   trusted-supply-chain-04-rekor-entry    Rekor Search UI, separate host, needs an SBOM hash
#   devspaces-inner-loop-02/03             needs a running DevWorkspace + IDE
#   developer-hub-golden-paths-04/05/06    requires RUNNING the scaffolder, which creates a repo
#   pipelines-fundamentals-*               conflicts with M08 over {user}-cicd; separate file
#   build-deliver-03-buildconfig-to-imagestream
#       Wants the Topology Resources panel showing a COMPLETED Build + the `parasol-claims:latest`
#       ImageStream tag. Neither exists on any state we can materialise: the entry state is an
#       empty dev namespace by design, and `solve-endstate.yaml` deploys the PREBUILT
#       ogsr-parasol-images/parasol-claims:1.0 — no BuildConfig, no Build, no S2I tag. The
#       artifacts only appear if a human actually walks exercise 1's Import-from-Git form.
#       Shooting it from the solve state would be a valid PNG of the wrong thing. It has no
#       `// media-pass:` embed point, so it stays uncaptured. (Measured 2026-07-28: the sweep's
#       `wait_text: parasol-claims` timed out on an empty topology — the wait was right.)
jobs:

  # ===== M12 observability — {user}-dev; the state moves one way, so the order is the file ======
  #
  # `ws start` re-materialises the whole namespace, which is also what returns claims-db to 1 and
  # clears any HPA or burst pod left by a previous attempt. It purges {user}-dev, so the
  # PrometheusRule fixture has to be applied after it, not before.

  # --- 01: baseline. Observe → Metrics with one of the lab's own queries plotting a real line.
  # PROJECT-scoped (/dev-monitoring/ns/…), not the cluster-wide query browser. The cluster-wide
  # page calls the NON-tenancy Prometheus API, which answers an attendee 403 — which is exactly
  # what the asset pulled on 2026-07-28 showed ("Access restricted", "No datapoints found") while
  # its wait on the word "Metrics" passed happily. forbid_text is what stops that recurring.
  - slug: observability-health-scale
    filename: observability-health-scale-01-observe-metrics.png
    reshoot: true                       # manifest row 1: ❌ RE-CAPTURE (asset on disk is an error page)
    pre_sh: >-
      ./tools/ws/ws start observability-health-scale --user user1 &&
      oc apply -n user1-dev -f tools/media/fixtures/m12-prometheusrule.yaml
    pre_wait_s: 90
    url: >-
      https://console-openshift-console.{domain}/dev-monitoring/ns/user1-dev/metrics?query0=sum(rate(http_server_requests_seconds_count%7Buri%3D%22%2Fapi%2Fclaims%22%7D%5B5m%5D))
    # The metric name proves the query reached the box; "Metrics" alone is satisfied by the nav.
    # This is the lab's own first query, and the built-in load generator guarantees it has data —
    # unlike claims_created_total, which only moves if something POSTs a claim.
    wait_all_text: ["http_server_requests_seconds_count"]
    forbid_text: ["Access restricted", "An error occurred", "No datapoints found", "Bad Request"]
    settle_ms: 12000

  # --- 05: the "before". PROJECT-scoped alerting rules — grounded 2026-07-28, and it is the URL
  # the lab itself links. The cluster-wide /monitoring/alertrules shows an attendee `0 - 0 of 0`
  # with or without filters and has no Project selector, so the old job could only ever fail.
  # `?alert-source=user` matters: the page defaults to a Source: Platform chip that matches nothing
  # the attendee wrote.
  - slug: observability-health-scale
    filename: observability-health-scale-05-observe-alerting-inactive.png
    url: https://console-openshift-console.{domain}/dev-monitoring/ns/user1-dev/alertrules?alert-source=user
    # Both, deliberately: the rule name alone is equally true on the FIRING page later in this run.
    # "Warning" is the severity column — pairing it with the name proves the row rendered rather
    # than just the heading.
    wait_all_text: ["ParasolClaimsErrorRateHigh", "Warning"]
    # If anything is already active this is not a baseline. Fail rather than caption it "inactive".
    forbid_text: ["Firing", "Pending"]
    settle_ms: 8000

  # --- 02: PARKED. See the reason; do not "fix" it by pointing at /observe/traces.
  - slug: observability-health-scale
    filename: observability-health-scale-02-observe-traces.png
    parked: >-
      The Traces page cannot be driven from a URL. The shot the manifest asks for means choosing
      the tempo-traces instance in a dropdown, choosing the parasol-claims service (or typing the
      TraceQL query), sorting by duration and opening a trace — four interactions with no grounded
      query-parameter equivalent. Landing on /observe/traces yields the "No Tempo instance
      selected" landing state, which is precisely the asset pulled on 2026-07-28, and any wait a
      URL-only job can satisfy is satisfied by that empty page. Needs a human, or a grounded
      deep-link format. COORDINATOR DECISION.

  # --- 04: the signature shot. Requires a REAL fault with enough server errors behind it; see
  # stage-m12-alert.sh for why `oc scale claims-db --replicas=0` on its own never fires this rule.
  # The staging script exits non-zero if it did not observe 5xx, so a failed injection skips the
  # job instead of photographing an Inactive rule.
  - slug: observability-health-scale
    filename: observability-health-scale-04-alert-firing.png
    pre_sh: ./tools/media/stage-m12-alert.sh user1
    # The script returns ~100s after the scale-down (90s burst). The rule is Pending from ~45s and
    # Firing from ~165s; it resolves when the burst leaves the 5m rate window, ~360s. 90 puts the
    # shot near 200s — inside the window with margin at both ends.
    pre_wait_s: 90
    url: https://console-openshift-console.{domain}/dev-monitoring/ns/user1-dev/alertrules?alert-source=user
    # "Firing" is the whole caption. Without it this job and job 05 above make the same assertion,
    # and one of the two shots is then guaranteed to be mislabelled.
    wait_all_text: ["ParasolClaimsErrorRateHigh", "Firing"]
    settle_ms: 10000

  # --- 03: restore, then autoscale under real load. stage-m12-hpa.sh does the rollout restart the
  # lab insists on (poisoned connection pool) and blocks until four replicas are actually Ready —
  # an idle HPA sits at its floor of 2, which is what the pulled asset showed.
  - slug: observability-health-scale
    filename: observability-health-scale-03-topology-hpa-scale.png
    reshoot: true                       # manifest row 3: ❌ RE-CAPTURE (asset is a calm 3-node topology)
    pre_sh: ./tools/media/stage-m12-hpa.sh user1
    pre_wait_s: 20
    url: https://console-openshift-console.{domain}/topology/ns/user1-dev
    # The graph, not the shell: both workloads must be drawn. The replica count is asserted in the
    # staging script against the API, which is a far better witness than any text on this page.
    wait_all_text: ["parasol-claims", "claims-db"]
    settle_ms: 12000

  # ===== M08 trusted-supply-chain — {user}-cicd ================================================
  # NO `ws start` here on purpose. Re-materialising this module re-runs the warm build (6–12 min,
  # waitSeconds 1500) for state that is already on the cluster. The RUNBOOK has you assert it
  # BEFORE the login window; pre_sh below only checks, so a missing state fails this one job fast
  # instead of eating the session.
  - slug: trusted-supply-chain
    filename: trusted-supply-chain-03-imagestream-tags.png
    # Was pointed at the ImageStreams LIST page while the manifest asks for the DETAIL page's Tags
    # section — the list page satisfied `wait_text: ImageStreams` instantly and would have written
    # a valid PNG of the wrong view.
    pre_sh: >-
      oc get istag -n user1-cicd -o name | grep -q '[.]sig$' ||
      { echo "no signed tag in user1-cicd — run ./tools/ws/ws start trusted-supply-chain --user user1 first (6-12 min)" >&2; exit 1; }
    url: https://console-openshift-console.{domain}/k8s/ns/user1-cicd/imagestreams/parasol-claims
    # `.sig` is the Tekton Chains signature tag, grounded on this console 2026-07-28. It exists only
    # on the detail page's Tags section — the list page never renders it.
    wait_all_text: ["Tags", ".sig"]
    settle_ms: 10000

  # ===== M13 securing-apps-keycloak — LAST: starting it PURGES {user}-dev and evicts M12 ========
  - slug: securing-apps-keycloak
    filename: securing-apps-keycloak-05-claims-env.png
    # The entry state does NOT carry the OIDC variables — every one of them sits behind
    # `{{- if .Values.solve }}` in parasol-claims.yaml. `ws start` alone therefore renders an
    # Environment tab holding only POSTGRESQL_HOST, while `wait_text: Environment` (a tab label on
    # the shell) passes at once. stage-m13-oidc.sh replays exercise 2's own `oc set env`, so the
    # shot shows exactly the rows the lab tells the attendee to add — not the solve end state,
    # which enforces a different permission policy. (It reads the realm from the live Route:
    # capture.py substitutes {domain} in `url`/`url_sh` only, never in `pre_sh`.)
    pre_sh: >-
      ./tools/ws/ws start securing-apps-keycloak --user user1 &&
      ./tools/media/stage-m13-oidc.sh user1
    pre_wait_s: 15
    url: >-
      https://console-openshift-console.{domain}/k8s/ns/user1-dev/deployments/parasol-claims/environment
    # Name the variables, not the tab. "Environment" is on the shell before any row renders.
    wait_all_text:
      - "QUARKUS_OIDC_TENANT_ENABLED"
      - "QUARKUS_HTTP_AUTH_PERMISSION_CLAIMS_PATHS"
    settle_ms: 10000
