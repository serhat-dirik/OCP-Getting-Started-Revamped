# First module block (m01-m07) — every media-manifest row still outstanding, in the ONLY order the
# cluster allows. Written 2026-08-01 on the shared build cluster, attendee slot **user2**.
#
# READ THIS BEFORE RUNNING IT.
#
# 1. The whole file is blocked on ONE human OAuth login. Measured 2026-08-01: the cached console
#    session in tools/media/shot-profile.session.json answers HTTP 401 to
#    /api/kubernetes/apis/user.openshift.io/v1/users/~ (i.e. it is dead), the cockpit at
#    showroom-user2 is password-free but its "OCP Console" tab is an EXTERNAL link — the console
#    lives on its own subdomain, does not share the cockpit's session, and its iframe is refused by
#    X-Frame-Options — and injecting an API token as a session cookie does not work (capture.py's
#    own header records that measurement). So: `--login https://console-openshift-console.$OGSR_DOMAIN`,
#    a human completes the hop in the window that opens, and every job below then runs unattended.
#
# 2. The order is load-bearing twice. `config-multienv` photographs ONE namespace at FIVE moments of
#    the same lab, so its jobs must run top to bottom — `stage-config-multienv.sh` advances the lab
#    one phase per job and cannot go backwards. And `storage-stateful` is LAST because
#    `ws start storage-stateful` purges {user}-dev and evicts config-multienv (both directions are
#    declared in gitops/entry-states/*/ws-meta.yaml). Nothing above it survives it.
#
# 3. Slots — SETTLED 2026-08-01, the file is no longer single-user. config-multienv,
#    jobs-batch-kueue and storage-stateful are **user2**; pipelines-fundamentals is **user1**.
#    The split is deliberate: that module's four existing screenshots are all user1, so shooting its
#    fifth as user2 would have dropped one `user2-cicd` frame into the middle of four `user1-cicd`
#    ones, which its media-manifest row specifically asks to avoid. A user1 console session existed
#    by the time these ran, so the row got the slot it wanted. `config-multienv` and
#    `jobs-batch-kueue` had no existing shots, so their slot was free choice and stayed user2.
#    Whatever you repoint, the console session must belong to THAT user or every namespaced URL
#    renders "Access restricted" — the staging scripts all take the user as their first argument.
#
# 4. `pipelines-fundamentals-01` is the only `reshoot: true` in the file. Its manifest row says
#    ❌ RE-CAPTURE: the committed file was shot before the Tekton console plugin mounted, so the
#    five-Task graph its caption promises is entirely missing. The plugin IS mounted on this cluster
#    (`oc get consoles.operator.openshift.io cluster -o jsonpath='{.spec.plugins}'` lists
#    pipelines-console-plugin), so the graph will render. Take the flag back off once the good shot
#    is on disk.

jobs:

  # ============================================================================================
  # M04 config-multienv — five rows, five moments of one lab, in sequence. See the header.
  # ============================================================================================

  # ---- ex.1: the deliberate break. Staged and VERIFIED live 2026-08-01 as user2: the phase waits
  # for a real CrashLoopBackOff waiting-reason before returning, so the badge the caption promises
  # cannot be missing from the state (it can still be off-screen — hence require_in_frame).
  - slug: config-multienv
    filename: config-multienv-01-crashloop-pod.png
    pre_sh: ./tools/media/stage-config-multienv.sh user2 break
    pre_wait_s: 15
    # The pod name is generated, and it is the NEWEST pod that is broken (the old healthy one keeps
    # serving — that is the lab's whole point), so it has to be resolved after staging.
    url_sh: >-
      echo "https://console-openshift-console.{domain}/k8s/ns/user2-dev/pods/$(oc get pods -n user2-dev
      -l app=parasol-claims --sort-by=.metadata.creationTimestamp
      -o jsonpath='{.items[-1:].metadata.name}')/logs"
    # "CrashLoopBackOff" was REMOVED from the waits on 2026-08-01, after it failed the job twice on
    # a namespace that was in exactly the right state. It is not a stable string: the pod cycles
    # start -> Error -> CrashLoopBackOff -> start, so the console's status badge changes under the
    # poll, and the backoff window it is actually displayed in is a fraction of each cycle early on
    # (10s, then 20s, 40s, 80s...). A wait that must be true CONTINUOUSLY cannot be pinned to a
    # value that is only true intermittently — measured: `oc` reported the waiting reason flipping
    # between CrashLoopBackOff and <none> on 4s sampling, while the restart count climbed 4 -> 5.
    #
    # The log line is the honest anchor and it is also what this exercise is about: it is written
    # once and stays in the stream. `wrong-db-host` is asserted alongside it so the shot cannot pass
    # on some other host-resolution failure. The badge is still normally in frame — verify by eye
    # and describe in the alt text whatever the frame actually shows, never what it ought to show.
    wait_all_text: ["UnknownHostException", "wrong-db-host"]
    forbid_text: ["Access restricted", "Log in with", "not found"]
    require_in_frame: ["UnknownHostException"]
    settle_ms: 6000

  # ---- ex.2: config externalised. ConfigMap Data, plaintext keys — the honest contrast partner of
  # the Secret shot below.
  - slug: config-multienv
    filename: config-multienv-02-configmap-secret.png
    pre_sh: ./tools/media/stage-config-multienv.sh user2 configured
    pre_wait_s: 10
    url: https://console-openshift-console.{domain}/k8s/ns/user2-dev/configmaps/claims-config
    wait_all_text: ["claims-config", "APP_ENV", "POSTGRESQL_HOST", "QUARKUS_LOG_LEVEL"]
    forbid_text: ["Access restricted", "Log in with", "not found"]
    # MEASURED 2026-08-01: the Data section runs from y=791 to y=1450 — one key every ~150px, five
    # of them. The default 1000px frame cut it after the first (POSTGRESQL_HOST alone sits at
    # y=1131), which is how the first attempt failed. 1650 frames the whole object: breadcrumb,
    # name, and all five plaintext keys, which is what "the ConfigMap Data view" means and what
    # makes it the honest contrast partner of the masked Secret in row 6.
    # All five keys are asserted in-frame, not just the two the row originally named — a viewport
    # that silently clipped the last key is the exact failure being fixed here.
    require_in_frame: ["APP_ENV", "POSTGRESQL_HOST", "QUARKUS_LOG_LEVEL"]
    viewport: { width: 1600, height: 1650 }
    settle_ms: 6000

  # ---- ex.3: the Secret, MASKED. the media-capture conventions rule 1: "Reveal values" must
  # stay OFF, so this job clicks nothing. The detail page renders values hidden by default, which is
  # exactly the picture the lab wants — key names visible, value not. The credential is in any case
  # the lab's fabricated teaching value (POSTGRESQL_PASSWORD=parasol), not a real one.
  # This file is an ADDITION to the manifest: row 2 asked for one image of two objects, which no
  # single console page shows.
  - slug: config-multienv
    filename: config-multienv-06-secret-masked.png
    url: https://console-openshift-console.{domain}/k8s/ns/user2-dev/secrets/claims-creds
    wait_all_text: ["claims-creds", "POSTGRESQL_PASSWORD", "Reveal values"]
    forbid_text: ["Access restricted", "Log in with", "not found"]
    # MEASURED 2026-08-01: Data at y=791, POSTGRESQL_PASSWORD at 844, POSTGRESQL_USER at 993. The
    # default 1000px frame caught only the first key, and the row's Annotate note asks for the
    # Secret's key nameS — plural — so 1250 is the height that actually delivers the row (1100 got
    # both key NAMES but clipped the second masked value box). BOTH keys
    # are asserted in-frame for that reason.
    # Privacy (the media-capture conventions rule 1): nothing here clicks "Reveal values". The
    # captured frame shows each value as "Value hidden" and five bullet glyphs; the link is in shot
    # precisely to prove it was left alone.
    require_in_frame: ["POSTGRESQL_PASSWORD", "POSTGRESQL_USER", "Reveal values"]
    viewport: { width: 1600, height: 1250 }
    settle_ms: 6000

  # ---- ex.4: the readiness gate holding traffic. RESOLVED 2026-08-01 — the warning below was
  # right, and the Service page was shot, opened, and thrown away before it could be committed.
  #
  # What the three candidates actually render, with the state PROVEN broken (Endpoints' ENDPOINTS
  # column blank, `curl` returning 503):
  #   · Service detail (the original target) — renders *Pod selector*, *Service routing*, hostname,
  #     ClusterIP and port mapping, and NOTHING that differs from a perfectly healthy Service. The
  #     unready pods still match the selector, exactly as the old comment feared. A valid PNG of the
  #     wrong thing; deleted.
  #   · Endpoints detail — renders Name/Namespace/Labels/Annotations/Created and then simply STOPS.
  #     There is no addresses or subsets section on this console build, so an empty Endpoints object
  #     is indistinguishable from one the console declines to show. Teaches nothing; rejected.
  #   · Pods LIST — `parasol-claims-… | Running | 0/1` sitting directly above `claims-db-… |
  #     Running | 1/1`. That is the readiness gate in one frame: the pod is up but NOT ready, which
  #     is precisely why nothing is behind the Service, and the healthy database row beside it gives
  #     the reader the contrast for free. Chosen.
  # The list is deliberately NOT filtered to parasol-claims: the claims-db 1/1 row is half the
  # lesson, and filtering it out would leave a single ambiguous line.
  # The Route's 503 cannot share this frame — the lab already prints `Route: 503` from curl, and a
  # shot of the router's generic error page was considered and rejected as adding nothing.
  - slug: config-multienv
    filename: config-multienv-03-readiness-503.png
    pre_sh: ./tools/media/stage-config-multienv.sh user2 readiness-broken
    pre_wait_s: 10
    url: https://console-openshift-console.{domain}/k8s/ns/user2-dev/pods
    # "0/1" is the whole assertion — the pod NAME alone passes on a healthy 1/1 pod, which is the
    # state this exercise contrasts against and the mistake that cost two deleted captures here.
    # claims-db is asserted too so the frame is proven to carry the healthy comparison row.
    wait_all_text: ["parasol-claims", "claims-db", "0/1"]
    forbid_text: ["Access restricted", "Log in with", "not found"]
    require_in_frame: ["0/1", "parasol-claims"]
    settle_ms: 5000

  # ---- ex.5: the quota refusal. The ReplicaFailure condition sits at the BOTTOM of the Deployment
  # details page, well below a 1000px fold — hence the taller viewport AND the scroll. Do not
  # "fix" a require_in_frame failure here by deleting the assertion; the whole subject is that
  # message.
  - slug: config-multienv
    filename: config-multienv-04-quota-replicafailure.png
    pre_sh: ./tools/media/stage-config-multienv.sh user2 quota
    pre_wait_s: 10
    url: https://console-openshift-console.{domain}/k8s/ns/user2-dev/deployments/claims-hog
    # MEASURED 2026-08-01, replacing three guesses that all failed on the real page:
    #  · `scroll_to_text: "ReplicaFailure"` could never work. The console HUMANISES the condition
    #    type in its Conditions table — the captured frame reads "Replica Failure", with a space —
    #    so a search for the API's camel-case spelling matches no text node at all, exactly as a
    #    TreeWalker over the settled page reported, while `oc` says ReplicaFailure=True
    #    reason=FailedCreate. It is scrolled to "Conditions", the table's heading, which IS an
    #    exact node.
    #  · "ReplicaFailure" is likewise gone from `wait_all_text` for the same reason. The message
    #    "exceeded quota" is the caption's actual subject and it IS rendered verbatim, so it
    #    carries the assertion on its own.
    #  · The 1400px viewport was not tall enough either: unscrolled, "exceeded quota" sits at
    #    y=1845..1884. Scrolling the Conditions heading to centre brings it to roughly y=760 in a
    #    1100px frame, which also frames the table properly instead of shooting a screen of
    #    whitespace with one line at the bottom.
    wait_all_text: ["claims-hog", "exceeded quota"]
    forbid_text: ["Access restricted", "Log in with"]
    scroll_to_text: "Conditions"
    require_in_frame: ["exceeded quota"]
    viewport: { width: 1600, height: 1100 }
    settle_ms: 4000

  # ---- ex.6: three environments side by side.
  - slug: config-multienv
    filename: config-multienv-05-three-envs.png
    parked: >-
      COMPOSITE, not a screenshot. The manifest row itself says so: three separate Topology captures
      (user2-dev 1 pod / user2-stage 2 / user2-prod 3) assembled side by side by hand. capture.py
      writes one frame per job and has no compositing step, and one console page cannot show three
      namespaces. Staging IS solved — `stage-config-multienv.sh user2 promote` reaches the state —
      so this needs a person to take three shots and join them, or the row rewritten as three files.

  # ============================================================================================
  # M06 jobs-batch-kueue — {user}-batch, independent of everything above.
  # ============================================================================================

  # Staging PROVEN live as user2 on the build cluster, 2026-08-01: `queued` settled at exactly 2 admitted
  # of 5 Workloads, `preempted` produced Evicted=True(Preempted) / Admitted=False(NoReservation) /
  # Preempted=True(InClusterQueue) / Requeued=True(Preempted) — the lab's expected output verbatim.
  #
  # The API version in these URLs is **v1beta2**, checked, not assumed: this operator serves v1beta1
  # AND v1beta2 and v1beta2 is the storage version (`oc get crd workloads.kueue.x-k8s.io`). The
  # module's own manifest still says v1beta1 in prose.
  - slug: jobs-batch-kueue
    filename: jobs-batch-kueue-01-workloads-admitted.png
    pre_sh: ./tools/media/stage-jobs-batch-kueue.sh user2 queued
    pre_wait_s: 5
    url: https://console-openshift-console.{domain}/k8s/ns/user2-batch/kueue.x-k8s.io~v1beta2~Workload
    # RISK, stated so a failure is read correctly: this is a generic custom-resource LIST page. The
    # Workload CRD does define additionalPrinterColumns (Queue / Reserved in / Admitted / Finished /
    # Age), but whether THIS console build renders them for a CR list is unverified — and without
    # them the page is six names and nothing else, which teaches nothing. `require_in_frame:
    # ["Admitted"]` is deliberately the caption's own word: if the column is not rendered the job
    # FAILS instead of committing a picture of a flat list. If it fails that way, the row's premise
    # is wrong (a content finding), and the honest replacement is the Workload DETAIL page, as in 02.
    wait_all_text: ["batch-low-1", "batch-low-5"]
    forbid_text: ["Access restricted", "Log in with", "not found"]
    require_in_frame: ["Admitted"]
    settle_ms: 5000

  - slug: jobs-batch-kueue
    filename: jobs-batch-kueue-02-preempted-conditions.png
    pre_sh: ./tools/media/stage-jobs-batch-kueue.sh user2 preempted
    pre_wait_s: 5
    # The victim is whichever low Workload Kueue chose to evict — resolved, never guessed.
    url_sh: >-
      echo "https://console-openshift-console.{domain}/k8s/ns/user2-batch/kueue.x-k8s.io~v1beta2~Workload/$(oc
      -n user2-batch get workloads -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.conditions[?(@.type=="Preempted")].status}{"\n"}{end}'
      | awk '$2=="True"{print $1}' | head -1)"
    wait_all_text: ["Preempted", "Requeued", "Evicted"]
    forbid_text: ["Access restricted", "Log in with", "not found"]
    scroll_to_text: "Preempted"
    require_in_frame: ["Preempted", "Requeued"]
    viewport: { width: 1600, height: 1400 }
    settle_ms: 5000

  # ============================================================================================
  # M07 pipelines-fundamentals — SHOT AS user1, not user2 like the rest of this file.
  #
  # The header's point 3 asked for exactly this decision and it was taken on 2026-08-01, once a
  # user1 console session existed: this module's four EXISTING screenshots are all user1, so a
  # user2 frame would have put one `user2-cicd` picture in the middle of four `user1-cicd` ones for
  # no reason a reader could understand. The media-manifest row asks for the same thing. Everything
  # else in this file stays user2 — only these two jobs move, and the staging script takes the user
  # as its argument, so nothing else had to change.
  # ============================================================================================

  # The staging script REUSES a green run if one is already in the namespace and only rebuilds when
  # there is none — `ws solve` here is ~9 min warm and ~13 cold, and a human's login window is the
  # scarce resource. A run was pre-built as user2 on 2026-08-01 for exactly that reason.
  # `tekton.dev~v1` is checked, not assumed: v1beta1 and v1 are both served, v1 is the storage
  # version (`oc get crd pipelineruns.tekton.dev`).
  # ⚠ DO NOT RUN THIS JOB. It is kept only as the record of a decision that was REVERSED.
  #
  # This row was CAPTURED on 2026-08-01 as **user2** and committed in 5c85333 — the five-Task DAG
  # renders, every node green, run Succeeded. The owner took the user2 option explicitly, for a
  # reason this comment block predates: `user1-cicd` holds trusted-supply-chain, whose own marquee
  # row is STILL UNCAPTURED, and `stage-pipelines-fundamentals.sh user1` rebuilds that namespace.
  # Running this job would therefore destroy an uncaptured subject in order to re-photograph a
  # captured one, AND clobber the committed frame.
  #
  # The consistency argument below is real but was outweighed: one `user2-cicd` frame among four
  # `user1-cicd` ones is a cosmetic inconsistency; losing trusted-supply-chain's staged state is not.
  #
  # Also note `stage-pipelines-fundamentals.sh` matches ANY green PipelineRun in `{user}-cicd`, not
  # the five-Task one — on user1 today that is trusted-supply-chain's, so it would report success
  # having staged the wrong pipeline entirely.
  - slug: pipelines-fundamentals
    filename: pipelines-fundamentals-01-pipelinerun-graph.png
    skip: true      # CAPTURED as user2 in 5c85333 — see the block above before changing this
    pre_sh: ./tools/media/stage-pipelines-fundamentals.sh user1
    pre_wait_s: 20
    # Resolve the newest run whose Succeeded condition is TRUE. "Newest run" alone is not the same
    # claim — a failed or still-running one is the wrong picture and url_sh cannot tell them apart.
    url_sh: >-
      echo "https://console-openshift-console.{domain}/k8s/ns/user1-cicd/tekton.dev~v1~PipelineRun/$(oc
      -n user1-cicd get pipelinerun
      -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.conditions[?(@.type=="Succeeded")].status}{"\n"}{end}'
      | awk '$2=="True"{print $1}' | tail -1)"
    # Name the five Tasks, not just the run: a PipelineRun page WITHOUT the plugin still renders the
    # run's name and its Details/YAML tabs, which is precisely how the pulled shot passed review.
    wait_all_text: ["fetch-source", "unit-test", "build-image", "image-report", "deploy"]
    forbid_text: ["Access restricted", "Log in with"]
    require_in_frame: ["fetch-source", "deploy"]
    settle_ms: 8000

  - slug: pipelines-fundamentals
    filename: pipelines-fundamentals-02-gitea-webhook.png
    parked: >-
      Gitea's Add Webhook form, FILLED. Two blockers, either one fatal: the form has no addressable
      pre-filled state (a person types into it), and Gitea keeps its own local login which the
      console session does not carry — and typing a login password is not something this capture
      path can do. Unchanged from RUNBOOK.md's not-capturable table. The lab's fields are spelled out
      in prose, which is what an attendee actually follows.

  # ============================================================================================
  # M05 storage-stateful — LAST. `ws start storage-stateful` PURGES user2-dev and evicts
  # config-multienv. Nothing above this line can be re-run afterwards without re-staging.
  # ============================================================================================

  - slug: storage-stateful
    filename: storage-stateful-01-pvc-bound.png
    pre_sh: >-
      ./tools/ws/ws start storage-stateful --user user2 &&
      ./tools/ws/ws solve storage-stateful --user user2
    pre_wait_s: 30
    url: https://console-openshift-console.{domain}/k8s/ns/user2-dev/persistentvolumeclaims/claims-db-data
    # "Bound" is the state; the name alone passes on a Pending PVC, which is the wrong picture and
    # the one the lab explicitly contrasts against (WaitForFirstConsumer means it IS Pending until a
    # pod claims it). The PVC exists only in the solve end state — it is gated behind `.Values.solve`
    # in gitops/entry-states/storage-stateful/templates/claims-db.yaml — hence the `ws solve` above.
    # "Pending" is deliberately NOT in forbid_text: it can appear in an unrelated event row on a
    # perfectly Bound PVC, and a false failure costs a login window. require_in_frame proves the state.
    wait_all_text: ["claims-db-data", "Bound"]
    forbid_text: ["Access restricted", "Log in with", "not found"]
    require_in_frame: ["Bound"]
    settle_ms: 4000

  # ============================================================================================
  # Ruled out entirely — kept here so the reason sits next to the row rather than in a report.
  # ============================================================================================

  - slug: platform-orientation
    filename: platform-orientation-02-deploy-image-dialog.png
    parked: >-
      The Deploy Image form, FILLED and green-Validated. `capture.py` has no generic form-fill — only
      `filter_text`, which types into a list's filter box — so reaching this state means a human
      typing the registry reference into /deploy-image?ns={user}-dev and waiting for the validation
      tick. The file already on disk is NOT usable and is not embedded: read 2026-08-01, it shows
      user5/user5-dev, the pre-`ogsr-` registry path `…/parasol-images/parasol-web:1.0` (lab.adoc
      says `ogsr-parasol-images`), and it is cropped just below *Application name*, so *Resource
      type* — the field the step warns about — is off-frame. Whoever re-shoots it: set the shot up
      so Resource type = Deployment is visible.

  - slug: build-deliver
    filename: build-deliver-03-buildconfig-to-imagestream.png
    parked: >-
      Wants a completed Build plus the S2I ImageStream tag. No materialisable state has one: the
      entry state is an empty dev namespace by design and `ws solve build-deliver` deploys a PREBUILT
      image, so no BuildConfig exists unless a human performs exercise 1's import by hand. It also
      has no `// media-pass:` embed point in lab.adoc, so its absence breaks nothing. Unchanged from
      RUNBOOK.md.

  - slug: devspaces-inner-loop
    filename: devspaces-inner-loop-02-debug-5005.png
    parked: >-
      A che-code IDE paused on a breakpoint. Needs a running DevWorkspace, two extensions installed
      into it by hand, and a debug session driven through the browser IDE — and Dev Spaces sits
      behind its own OAuth hop. Not a URL-addressable state. The lab already ships a `jdb` terminal
      fallback that always works, and its embed comment is deliberately left in lab.adoc.

  - slug: devspaces-inner-loop
    filename: devspaces-inner-loop-03-devfile-endpoints.png
    parked: >-
      The Endpoints view inside a running workspace after the devfile restart. Same blocker as 02
      (live workspace + IDE), and it has no embed point in lab.adoc — exercise 4's verification is
      the PONG from the devfile task, not a screenshot. Enrichment only.
