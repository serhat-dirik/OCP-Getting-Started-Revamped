# M08 (app-security-testing) — the SonarQube SAST beat, shot ANONYMOUSLY.
#
# SonarQube needs no login for either of these views (media-manifest.md documents the anonymous
# read surface). What the rows need is the RED analysis, which is DATA, not access: on a cluster
# where the module has been driven to its green end state the same URLs render a *passing*
# project — a picture of the opposite of the lesson.
#
# STATE THIS FILE REQUIRES (produce it before running, as the attendee, in the attendee's slot):
#   ws start app-security-testing --user <u>
#   then the lab's own exercise-1 PipelineRun, verbatim, with
#     git-revision: seed-appsec        sonar-project-key: parasol-claims-<u>
#   It stops red at sast-sonar in ~3 min. Confirm the state anonymously BEFORE shooting:
#     curl -sk "$SQ/api/issues/search?rules=java:S2068&resolved=false&ps=5"   # total >= 1
#     curl -sk "$SQ/api/qualitygates/project_status?projectKey=parasol-claims-<u>"  # status ERROR
#
# The `open=` issue key in row 2's URL is PER-ANALYSIS — never reuse the one below. Read it from
# that first curl (`.issues[0].key`) and substitute it.
#
# Row 2 renders the seeded literal P@rasol-Partner-2026! verbatim. That is deliberate and must NOT
# be redacted — see the ⚠️ PRIVACY section of the module's media-manifest.md, which is the single
# documented exception in this repo and does not generalise.
#
# Run:  .venv/bin/python capture.py --jobs jobs-m08-sonarqube.yaml --no-auth
jobs:
  # Row 3 — the quality gate. Filename kept from the manifest.
  - slug: app-security-testing
    filename: app-security-testing-03-sonarqube-quality-gate.png
    # The URL that produced the committed frame. On a RE-SHOOT prefer
    #   /dashboard?id=parasol-claims-<u>&codeScope=overall
    # — the Overview opens on the New Code tab, where every tile reads 0 under a big red "Failed"
    # headline; that is the right page showing nothing. codeScope=overall selects the tab that
    # actually carries the failing condition, without clicking.
    url: https://sonarqube-sonarqube.{domain}/dashboard?id=parasol-claims-user4
    # Object AND state: the project, the verdict, and the exact failing condition (which renders
    # as two stacked lines, "1 Vulnerabilities" then "is greater than 0" — assert them separately).
    wait_all_text:
      - "Quality Gate"
      - "Failed"
      - "1 condition failed"
      - "Vulnerabilities"
      - "is greater than 0"
    # A project that has never been analysed renders an onboarding page; a green one renders
    # "Passed". Refuse both rather than shoot a valid picture of the wrong lesson.
    forbid_text:
      - "Passed"
      - "The main branch of this project is empty"
    # Neither "Failed" NOR "Quality Gate" can go in require_in_frame: the hidden New Code tab panel
    # (and a tooltip) carry both strings earlier in DOM order, so the frame check resolves the
    # hidden node first and fails on a perfectly correct page ("present but has no box"). Same trap
    # the Rekor row hit with "Log Index". Assert instead on strings unique to the visible panel —
    # the warning banner sits immediately BELOW the big "Failed" verdict, so if the banner is in
    # frame the verdict is too.
    require_in_frame:
      - "The last analysis has warnings."
      - "1 condition failed"
      - "is greater than 0"
    viewport: {width: 1600, height: 1000}

  # Row 3b — the finding itself. Split out of row 3 because one file cannot hold two views:
  # the gate lives on the Overview page and the rule/file/line lives in the issue detail pane.
  - slug: app-security-testing
    filename: app-security-testing-03b-sonarqube-s2068-issue.png
    # On a re-shoot, append &types=VULNERABILITY to narrow the left-hand list from all seven issues
    # to the one that matters. Left off the committed frame, which shows the unfiltered list.
    url: https://sonarqube-sonarqube.{domain}/project/issues?id=parasol-claims-user4&open=bb9576b4-0418-40bb-a4f2-76f0bee4514f
    # Rule name + key + the file + the line, all of which only appear once the issue is OPENED —
    # the collapsed list row carries none of them.
    # "Line affected:" and "L18" are SEPARATE DOM nodes — innerText renders them as
    # "Line affected:\nL18", so the single string "Line affected: L18" can never match however
    # correct the page is. Likewise the rule name and key run together: "…hard-codedjava:S2068".
    wait_all_text:
      - "Credentials should not be hard-coded"
      - "java:S2068"
      - "PartnerGateway.java"
      - "Line affected:"
      - "L18"
    forbid_text: ["No issues match"]
    require_in_frame:
      - "Credentials should not be hard-coded"
      - "java:S2068"
      - "Line affected:"
    viewport: {width: 1600, height: 1000}
