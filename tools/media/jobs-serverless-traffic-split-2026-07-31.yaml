# serverless-zero-to-hero — traffic-split + eventing shots, 2026-07-31
#
# Live state verified 2026-07-31 as attendee user1 (`oc get ksvc,revision -n user1-dev`,
# `oc get broker,trigger,pingsource -n user1-dev`), NOT staged by this file — read-only, no
# pre_sh. This became possible only after a fix landed upstream of this pass: as of 2026-07-30
# the ksvc had only ONE revision and no eventing objects at all (see
# jobs-staged-window-2026-07-30-part2.yaml's comment block, which parked both these shots for
# exactly that reason). Today `user1-dev` carries:
#
#   parasol-claims-v1   tag=stable     percent=80
#   parasol-claims-v2   tag=candidate  percent=20
#   broker.eventing.knative.dev/default            Ready
#   trigger.eventing.knative.dev/claims-processor   broker=default  subscriber=parasol-claims  Ready
#   pingsource.sources.knative.dev/claim-ticker     sink=default broker                        Ready
#
# Both revisions are at 0/0 actual/desired replicas (idle) — that is fine for these two shots,
# neither of which needs live traffic or a pod ring. row 2 of the manifest
# (serverless-zero-to-hero-02-topology-scaled-up.png, 3/3 pods under burst) is NOT in this file:
# it needs a driven load burst, which is out of scope for a read-only capture pass and was not
# attempted.
#
# NO `reshoot: true` — neither output exists on disk yet.

jobs:

  # ===== Serverless -> Serving -> Services -> parasol-claims -> Details tab (80/20 split) ========
  # RE-GROUNDED live 2026-07-31 as user1 (Playwright + Chrome, session cookie, console origin
  # confirmed via /api/kubernetes/apis/user.openshift.io/v1/users/~ = user1). The PREVIOUS url
  # below (`/serving/ns/user1-dev`, the Services LIST page) is not a 404 — it loads fine — but it
  # does NOT carry "stable"/"candidate"/"80%"/"20%": that list page's columns are only
  # Name/URL/Conditions/Ready/Reason/Revision/Created, so the old wait_all_text could never have
  # passed on it. Confirmed by clicking through live:
  #   Serverless (sidebar, expands) -> Serving (sidebar sub-item, href /serving/all-namespaces)
  #     -> Services tab (default) -> parasol-claims (row link)
  #     -> lands on /k8s/ns/user1-dev/serving.knative.dev~v1~Service/parasol-claims
  #   Tabs on THAT page, literal labels: Details | YAML | Revisions | Routes | Pods
  #   The DETAILS tab (default) renders a "Revisions" section with, per row: REV badge + revision
  #   name, traffic percent (80% / 20%), and the per-tag sub-route as a full clickable URL —
  #   https://stable-parasol-claims-user1-dev...  and  https://candidate-parasol-claims-user1-dev...
  #   — so "stable"/"candidate" appear only INSIDE those URLs, never as a separate "Tag" column
  #   or label (confirmed: the literal string "Tag" does not appear on this page at all).
  #   Neither the per-service "Revisions" TAB nor the Serving-level "Routes" tab
  #   (/serving/ns/user1-dev/routes, Traffic column "80% -> parasol-claims-v1" / "20% ->
  #   parasol-claims-v2") shows the tag names — only this Details page does, and only via URL text.
  - slug: serverless-zero-to-hero
    filename: serverless-zero-to-hero-03-serverless-services-revisions.png
    url: https://console-openshift-console.{domain}/k8s/ns/user1-dev/serving.knative.dev~v1~Service/parasol-claims
    # Name the ksvc, BOTH revision tags (present only inside the sub-route URL text), and BOTH
    # percentages — a list page and an empty/wrong namespace both could otherwise pass on
    # "parasol-claims" alone (README rule 2).
    wait_all_text: ["parasol-claims", "stable", "candidate", "80%", "20%"]
    forbid_text: ["Access restricted", "An error occurred", "not found", "Log in with"]
    require_in_frame: ["stable", "candidate", "80%", "20%"]
    settle_ms: 8000

  # ===== Serverless -> Eventing: default Broker + claims-processor Trigger + claim-ticker PingSource
  # PARTIALLY re-grounded 2026-07-31: /eventing/ns/user1-dev IS a real, working route (same family
  # as /serving/ns/<namespace> — confirmed live, lands on a page titled "Eventing", Project scoped
  # correctly to user1-dev, tabs Event Sources | Brokers | Triggers | Channels | Subscriptions).
  # BUT it is a single list page whose DEFAULT tab is "Event Sources", which on this pass showed
  # "No Event Sources found" — so claim-ticker (a PingSource) did NOT appear there at the moment
  # checked. The Triggers tab DOES show claims-processor (broker=default, subscriber=parasol-claims,
  # Ready). This job as written (one page load, wait_all_text for all three objects at once) cannot
  # pass: the three objects it wants are spread across at least two different tabs of this same
  # list page, not co-resident on one settled view. NOT fixed further here — out of scope for the
  # serverless-zero-to-hero lab.adoc CAPTURE-VERIFY markers this pass was scoped to (exercise 5 /
  # eventing is a different beat). Left `parked` so a wholesale run of this file does not hang or
  # mis-shoot; re-plan this job specifically when the eventing beat is worked.
  - slug: serverless-zero-to-hero
    filename: serverless-zero-to-hero-04-serverless-eventing.png
    parked: "2026-07-31: claims-processor/default/claim-ticker are not co-resident on one settled view of /eventing/ns/user1-dev — Event Sources tab showed 'No Event Sources found' this pass while Triggers tab showed claims-processor; needs either a per-tab job split or a re-check of why claim-ticker isn't listed. Out of scope for this pass (traffic-split markers only)."
