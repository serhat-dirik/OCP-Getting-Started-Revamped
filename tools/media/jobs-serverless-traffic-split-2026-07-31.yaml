# serverless-zero-to-hero — traffic-split + eventing shots, 2026-07-31
#
# Live state verified 2026-07-31 as attendee user1 (`oc get ksvc,revision -n user1-dev`,
# `oc get broker,trigger,pingsource -n user1-dev`), NOT staged by this file — read-only, no
# pre_sh. This became possible only after a fix landed upstream of this pass: as of 2026-07-30
# the ksvc had only ONE revision and no eventing objects at all (see
# jobs-staged-window-2026-07-30-part2.yaml's comment block, which parked both these shots for
# exactly that reason). Today `user1-dev` carries:
#
#   parasol-claims-v1   tag=stable     percent=80
#   parasol-claims-v2   tag=candidate  percent=20
#   broker.eventing.knative.dev/default            Ready
#   trigger.eventing.knative.dev/claims-processor   broker=default  subscriber=parasol-claims  Ready
#   pingsource.sources.knative.dev/claim-ticker     sink=default broker                        Ready
#
# Both revisions are at 0/0 actual/desired replicas (idle) — that is fine for these two shots,
# neither of which needs live traffic or a pod ring. row 2 of the manifest
# (serverless-zero-to-hero-02-topology-scaled-up.png, 3/3 pods under burst) is NOT in this file:
# it needs a driven load burst, which is out of scope for a read-only capture pass and was not
# attempted.
#
# NO `reshoot: true` — neither output exists on disk yet.

jobs:

  # ===== Serverless -> Services -> parasol-claims Revisions list (80/20 split) =================
  # URL pattern confirmed against OldContent's grounded precedent
  # (OldContent/repos/showroom/.../serverless/instructions.0.adoc:62 links
  # `/serving/ns/<namespace>` for "Serverless > Serving"). Same console generation family.
  - slug: serverless-zero-to-hero
    filename: serverless-zero-to-hero-03-serverless-services-revisions.png
    url: https://console-openshift-console.{domain}/serving/ns/user1-dev
    # Name the ksvc, BOTH revision tags, and BOTH percentages — a list page and an empty/wrong
    # namespace both could otherwise pass on "parasol-claims" alone (README rule 2).
    wait_all_text: ["parasol-claims", "stable", "candidate", "80%", "20%"]
    forbid_text: ["Access restricted", "An error occurred", "not found", "Log in with"]
    require_in_frame: ["stable", "candidate", "80%", "20%"]
    settle_ms: 6000

  # ===== Serverless -> Eventing: default Broker + claims-processor Trigger + claim-ticker PingSource
  - slug: serverless-zero-to-hero
    filename: serverless-zero-to-hero-04-serverless-eventing.png
    url: https://console-openshift-console.{domain}/eventing/ns/user1-dev
    wait_all_text: ["default", "claims-processor", "claim-ticker"]
    forbid_text: ["Access restricted", "An error occurred", "not found", "Log in with"]
    require_in_frame: ["default", "claims-processor", "claim-ticker"]
    settle_ms: 6000
