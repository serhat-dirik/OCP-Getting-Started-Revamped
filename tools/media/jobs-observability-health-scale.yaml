# SUPERSEDED — deliberately empty. Do not add jobs here.
#
# This file held M12's shots 01, 05 and 02 and wrote the SAME THREE FILENAMES as
# jobs-console-sweep.yaml. That is the dangerous shape: two files claiming the same output, each
# expecting a different cluster state, and nothing anywhere saying which one wins. Running the
# wrong one second silently replaces a correct screenshot with a valid-but-wrong one — the failure
# this whole harness exists to prevent.
#
# Where the three went:
#
#   01-observe-metrics    jobs-console-sweep.yaml. The URL here was the CLUSTER-scoped query
#                         browser, which answers an attendee 403 ("Access restricted"); that is
#                         literally what the committed asset showed. The sweep uses the
#                         project-scoped /dev-monitoring/ns/<ns>/metrics page and refuses to shoot
#                         an error page (forbid_text).
#   05-observe-alerting   jobs-console-sweep.yaml and jobs-m12-alerts.yaml. Same scope bug; the
#                         cluster-wide alerting page shows an attendee `0 - 0 of 0`.
#   02-observe-traces     PARKED in jobs-console-sweep.yaml. The Traces page needs four
#                         interactions (instance dropdown, service, query, open a trace) and has
#                         no grounded deep-link, so a URL-only job can only ever capture the
#                         "No Tempo instance selected" landing state.
#
# tools/media/RUNBOOK.md is the order of operations for the whole media pass.
