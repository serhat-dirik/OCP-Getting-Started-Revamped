# M12 Observability, Health & Scale — console captures.
#
# ORDER IS LOAD-BEARING. These shots are state-dependent and the lab state moves in one
# direction: healthy baseline -> break claims-db -> alert fires -> restore -> HPA scales.
# Rows 01/05 MUST be taken at the healthy baseline (05 is explicitly the "before" of 04).
# Re-running this file after the state has moved on silently overwrites good shots with
# valid-but-wrong ones. Capture in phases, commit as you go.
#
# Phase 1 (healthy baseline)  : 01, 05, 02   <- this file
# Phase 2 (claims-db scaled 0): 04           <- jobs-observability-alert-firing.yaml
# Phase 3 (HPA under load)    : 03           <- jobs-observability-hpa.yaml
jobs:
  # --- 01: Observe -> Metrics, the claims throughput query graphed -------------------------
  - slug: observability-health-scale
    filename: observability-health-scale-01-observe-metrics.png
    url: >-
      https://console-openshift-console.{domain}/monitoring/query-browser?query0=sum(rate(http_server_requests_seconds_count%7Bnamespace%3D%22user1-dev%22%2Curi%3D%22%2Fapi%2Fclaims%22%7D%5B5m%5D))
    wait_text: "Metrics"
    settle_ms: 12000
    viewport: {width: 1600, height: 1000}

  # --- 05: Observe -> Alerting -> Alerting rules, the new rule Inactive --------------------
  # The "before" of shot 04. Only truthful while claims-db is healthy and no 5xx are flowing.
  - slug: observability-health-scale
    filename: observability-health-scale-05-observe-alerting-inactive.png
    url: https://console-openshift-console.{domain}/monitoring/alertrules
    wait_text: "ParasolClaimsErrorRateHigh"
    settle_ms: 8000
    viewport: {width: 1600, height: 1000}

  # --- 02: Observe -> Traces, a trace OPEN ------------------------------------------------
  # The already-committed 02 proves the page works; this replaces it with a trace expanded,
  # which is the teaching point of exercise 4.
  - slug: observability-health-scale
    filename: observability-health-scale-02-observe-traces.png
    url: https://console-openshift-console.{domain}/observe/traces
    wait_text: "Traces"
    settle_ms: 15000
    viewport: {width: 1600, height: 1000}
