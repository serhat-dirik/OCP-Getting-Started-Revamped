# M08 trusted-supply-chain — the scan-gate shot, split out from the console sweep.
#
# WHY IT IS NOT IN THE SWEEP. The run this photographs takes 6–12 minutes to build and nothing on
# the cluster materialises it: the entry state ships only the warm CLEAN build. Waiting for it
# inside the owner's one console login would burn a quarter of the window on cluster time that
# needs no browser. So:
#
#   1. BEFORE the login window:   ./tools/media/stage-m08-scan.sh user1
#   2. Then, inside the window:   capture.py --jobs tools/media/jobs-trusted-supply-chain.yaml …
#
# The other three M08 rows are elsewhere or unreachable:
#   03-imagestream-tags   in jobs-console-sweep.yaml (needs no staging beyond the entry state)
#   01-acs-violation      RHACS is a separate product with its own login — not this harness
#   04-rekor-entry        see jobs-rekor.yaml (parked: needs a real SBOM hash to search by)
jobs:

  - slug: trusted-supply-chain
    filename: trusted-supply-chain-02-pipelinerun-scan-failed.png
    # PARKED 2026-07-29. The 2026-07-29 attempt failed with "never saw 'acs-scan'", and the reason
    # is worth writing down because the URL it shot was not wrong — the NAMESPACE was.
    #
    # `url_sh` below resolves the newest PipelineRun whose Succeeded condition is False, in
    # {user}-cicd. That namespace no longer belongs to this module: `entry-pipelines-fundamentals-user1`
    # took it over (Argo app created 11:21), which by ws-meta.yaml's `conflictsWith` EVICTED
    # trusted-supply-chain and purged the namespace. So the newest failed run was
    # `solve-parasol-claims-…`, an M07 build-test-deploy run whose tasks are fetch-source /
    # unit-test / build-image / image-report / deploy. There is no `acs-scan` task in it, the wait
    # said so, and the job refused to shoot. That is the guard doing its job — the picture would
    # have been a real failed PipelineRun from the wrong pipeline.
    #
    # `parasol-claims-supply-chain` does not exist in that namespace either, so `stage-m08-scan.sh`
    # exits 1 on its own pre-flight ("no parasol-claims-supply-chain Pipeline") rather than seeding
    # anything.
    #
    # WHY IT IS NOT SIMPLY RE-STAGED. Recovering the state means
    # `./tools/ws/ws start trusted-supply-chain --user user1`, and that is not a local decision:
    #   1. It evicts pipelines-fundamentals and PURGES {user}-cicd while an M07 `ws solve` Job is
    #      ACTIVE in there (three PipelineRuns Running concurrently at the time of writing). RUNBOOK
    #      Phase 3 is last precisely because it is the destroyer; it ran early, and undoing it by
    #      hand destroys whatever that lane is still doing.
    #   2. The cluster cannot currently schedule the builds either way. Both the module's warm build
    #      and this scan run need build pods on a cluster whose only untainted worker has ~9Mi of
    #      free memory and whose control planes have ~100-300m of free CPU; M07's own build pods sat
    #      Pending for 10+ minutes with "0/5 nodes are available: 1 Insufficient memory, 1 node(s)
    #      had untolerated taint(s), 3 Insufficient cpu" before one finally landed. Two 6-12 minute
    #      builds back to back is not a wait, it is a coin toss.
    #
    # TO UN-PARK: delete this `parked:` key once {user}-cicd is free (no in-flight pipelines-
    # fundamentals work) and the cluster has room for a 1536Mi build pod, then
    #   ./tools/ws/ws start trusted-supply-chain --user user1     # 6-12 min, rebuilds the signed image
    #   ./tools/media/stage-m08-scan.sh user1                     # 6-12 min, seeds the failed run
    # and run this file. Everything below is unchanged and still correct.
    parked: >-
      {user}-cicd is currently owned by pipelines-fundamentals — trusted-supply-chain was evicted and
      the namespace purged, so there is no parasol-claims-supply-chain Pipeline to run and no
      acs-scan task to photograph. Recovering it means purging a namespace with another lane's
      `ws solve` still running in it, and the cluster has no schedulable room for the two 6-12 minute
      builds that would follow. Coordinator decision, not a workaround away.
    # The newest FAILED run. `status=="False"` is the Succeeded condition being false, i.e. the run
    # the gate refused. Resolving it is not optional: runs use generateName, so any literal name in
    # a job file is correct exactly once (four jobs in the M07 file rotted that way).
    # An empty result exits non-zero and the job is skipped — which is what should happen if
    # stage-m08-scan.sh was never run.
    url_sh: >-
      run=$(oc get pipelinerun -n user1-cicd --sort-by=.metadata.creationTimestamp
      -o jsonpath='{range .items[?(@.status.conditions[0].status=="False")]}{.metadata.name}{"\n"}{end}'
      | tail -1);
      test -n "$run" && echo "https://console-openshift-console.{domain}/k8s/ns/user1-cicd/tekton.dev~v1~PipelineRun/$run"
    # The old job waited on "PipelineRuns" — a heading the LIST page carries whether or not the
    # seeded run exists. These three are the shot itself: the two task names must be drawn by the
    # pipelines-console-plugin (a page with only Details and YAML tabs is a plugin that failed to
    # load in this browser session, not a cluster without it), and "Failed" is the verdict the
    # caption promises.
    wait_all_text: ["build-image", "acs-scan", "Failed"]
    settle_ms: 10000
