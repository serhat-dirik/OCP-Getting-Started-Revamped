# solution-map.yaml — content for the Parasol solution map (tools/diagrams/solution-map.py).
#
# One architecture picture for the whole course: the Parasol application in the middle, the
# platform capabilities around it. Every module gets a variant that lights up what it builds or
# touches ("you are here"); platform-orientation and build-deliver also get one per exercise.
#
# Ids are shared across tiles and components. An edge lights up when BOTH its ends are lit, so
# listing two connected components is how a variant shows the connection between them.
# Module titles and the slug list come from /modules.yaml; the generator fails if they drift.
#
# Regenerate:  python3 tools/diagrams/solution-map.py   (from the repo root)

# Capability groups. band: top = how code becomes a running app; bottom = what the platform
# does for it while it runs. span = how many of the five grid columns the group covers.
groups:
  - id: g-build
    title: Build & inner loop
    band: top
    span: 2
    tiles:
      - {id: build,      label: Builds,           sub: S2I · Dockerfile}
      - {id: registry,   label: Image registry,   sub: ImageStreams}
      - {id: catalog,    label: Software catalog, sub: Templates · images}
      - {id: devspaces,  label: Dev Spaces,       sub: Inner loop · IDE}
  - id: g-deliver
    title: Deliver
    band: top
    span: 3
    tiles:
      - {id: pipelines,   label: Pipelines,        sub: Build-test-deploy}
      - {id: appsec,      label: Security testing, sub: SAST · SCA · DAST}
      - {id: supplychain, label: Supply chain,     sub: Signing · SBOM}
      - {id: gitops,      label: GitOps,           sub: Argo CD · self-heal}
      - {id: rollouts,    label: Rollouts,         sub: Canary · blue-green}
      - {id: devhub,      label: Developer Hub,    sub: Golden paths}
  - id: g-run
    title: Run
    band: bottom
    span: 1
    tiles:
      - {id: deploy,     label: Deploy & scale,   sub: Self-healing}
      - {id: config,     label: Config & secrets, sub: Probes · promotion}
      - {id: storage,    label: Storage,          sub: PVCs · StatefulSets}
      - {id: jobs,       label: Jobs & queues,    sub: CronJobs · Kueue}
      - {id: scheduling, label: Scheduling,       sub: Affinity · taints}
      - {id: packaging,  label: Packaging,        sub: Helm · operators}
  - id: g-connect
    title: Connect
    band: bottom
    span: 1
    tiles:
      - {id: routes,     label: Routes & gateways, sub: Expose apps}
      - {id: netiso,     label: Network isolation, sub: Policies · UDN}
      - {id: mesh,       label: Service mesh,      sub: mTLS · traffic}
      - {id: serverless, label: Serverless,        sub: Scale to zero}
      - {id: eventing,   label: Eventing,          sub: Brokers · workflows}
  - id: g-observe
    title: Observe
    band: bottom
    span: 1
    tiles:
      - {id: metrics,    label: Metrics & alerts, sub: Dashboards · traces}
      - {id: autoscale,  label: Autoscaling,      sub: HPA · load}
      - {id: logging,    label: Logging,          sub: Logs · events}
      - {id: lightspeed, label: AI assistant,     sub: Lightspeed}
  - id: g-secure
    title: Secure & govern
    band: bottom
    span: 1
    tiles:
      - {id: identity,   label: Identity & SSO,   sub: Keycloak · OIDC}
      - {id: tenancy,    label: Multi-tenancy,    sub: RBAC · quotas · SCC}
      - {id: imagegov,   label: Image governance, sub: Allowed sources}
      - {id: policy,     label: Admission policy, sub: Policy as code}
      - {id: extsecrets, label: External secrets, sub: Secret store sync}
  - id: g-resilience
    title: Resilience
    band: bottom
    span: 1
    tiles:
      - {id: ha,       label: High availability, sub: Replicas · PDBs}
      - {id: failover, label: Site failover,     sub: Multi-cluster · DR}

# The Parasol application: what the labs deploy, by the names the labs use.
# col 1-5, row 1-3 on the application panel's grid. external: drawn dashed (outside the cluster).
components:
  - {id: broker,        label: Event broker,          sub: Triggers,            col: 3, row: 1}
  - {id: consumer,      label: claims-consumer,       sub: Event sink · DLQ,    col: 4, row: 1}
  - {id: premium,       label: premium-calculator,    sub: Serverless function, col: 5, row: 1}
  - {id: users,         label: Users,                 sub: Browser,             col: 1, row: 2, pill: true}
  - {id: web,           label: parasol-web,           sub: Claims portal,       col: 2, row: 2}
  - {id: claims,        label: parasol-claims,        sub: Claims API,          col: 3, row: 2}
  - {id: claims-db,     label: claims-db,             sub: PostgreSQL,          col: 4, row: 2}
  - {id: notifications, label: parasol-notifications, sub: Node.js · Python,    col: 5, row: 2}
  - {id: batch,         label: Batch jobs,            sub: Statements · AI,     col: 1, row: 3}
  - {id: model,         label: Model endpoint,        sub: LLM inference,       col: 2, row: 3, external: true}
  - {id: fraud,         label: parasol-fraud,         sub: Fraud scoring,       col: 3, row: 3}
  - {id: newsvc,        label: New service,           sub: From golden path,    col: 5, row: 3}

# Real connections the labs build. Each must join two neighbouring cells (same row or column).
edges:
  - [users, web]          # Route (platform-orientation, networking)
  - [web, claims]         # user token / mesh call path (keycloak, mesh, networking)
  - [claims, claims-db]   # build-deliver ex5 wires it; most modules run it
  - [claims, fraud]       # token exchange (keycloak), mTLS hop (mesh)
  - [broker, claims]      # Trigger to the parasol-claims ksvc (serverless ex6)
  - [broker, consumer]    # Trigger to claims-consumer (eventing)
  - [batch, model]        # fraud-inference Job (jobs-batch-kueue ex6)

# slug -> ids it builds or touches. A module with `exercises` below may omit its entry here:
# it then lights the union of its exercises.
modules:
  platform-orientation: []
  build-deliver: []
  devspaces-inner-loop: [devspaces, claims, claims-db]
  config-multienv: [config, claims, claims-db]
  storage-stateful: [storage, claims, claims-db]
  jobs-batch-kueue: [jobs, batch, model]
  observability-health-scale: [metrics, autoscale, ha, claims, claims-db]
  application-logging: [logging, claims]
  pipelines-fundamentals: [pipelines, claims]
  app-security-testing: [appsec, pipelines, claims]
  trusted-supply-chain: [supplychain, claims]
  gitops-fundamentals: [gitops, claims, claims-db]
  gitops-at-scale: [gitops, rollouts, claims, claims-db]
  developer-hub-golden-paths: [devhub, build, newsvc]
  securing-apps-keycloak: [identity, web, claims, fraud, batch]
  multi-tenancy-workload-security: [tenancy]
  networking-dev-devops: [routes, netiso, users, web, claims, claims-db]
  deployment-targets-scheduling: [scheduling, ha, web, claims, claims-db, batch]
  registry-images-catalog-governance: [registry, imagegov, catalog, claims]
  platform-guardrails: [policy, extsecrets, claims, claims-db]
  service-mesh-advanced-gateways: [mesh, routes, web, claims, fraud, claims-db]
  serverless-zero-to-hero: [serverless, eventing, claims, premium, broker]
  eventing-deep-dive: [eventing, broker, consumer]
  resilience-multicluster-dr: [ha, failover, mesh, claims]
  packaging-distributing: [packaging, notifications]

# Per-exercise variants (numbers match the `== N.` headings of the module's lab.adoc).
exercises:
  platform-orientation:
    1: [tenancy, deploy]                           # console tour: your project, Quick create
    2: [deploy, web]                               # deploy parasol-web from an image
    3: [deploy, web]                               # scale out, self-healing
    4: [routes, users, web]                        # publish with a Route
    5: [logging, web]                              # logs and events
    6: [deploy, routes, logging, users, web]       # the whole lab in six commands
    7: [lightspeed]                                # ask OpenShift Lightspeed
  build-deliver:
    1: [build, registry, claims]                   # S2I import of parasol-claims
    2: [build, registry, claims]                   # the same app, Dockerfile strategy
    3: [build, registry, routes, notifications]    # polyglot: parasol-notifications
    4: [catalog, claims-db]                        # catalog template -> claims-db
    5: [config, routes, claims, claims-db]         # Secret envFrom wires claims -> claims-db
