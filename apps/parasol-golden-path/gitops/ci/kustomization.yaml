# CI for ${{ values.name }}, applied by Argo CD into ${{ values.user }}-cicd like any other config:
# the Pipelines-as-Code Repository (which repo triggers runs here) and the two pipelines.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${{ values.user }}-cicd
resources:
  - repository.yaml
  - pipeline-build.yaml
  - pipeline-release.yaml
