# Connects the app repo to Pipelines-as-Code: a push to it runs the PipelineRuns in its .tekton/
# folder, here, in ${{ values.user }}-cicd. The token and webhook secret in golden-pac-secret are
# provided by the platform team for your org.
#
# url, git_provider.url and the two conforma params are facts about the cluster (its Git address and
# its Tekton Chains signing identity), so the platform's ApplicationSet fills them in when Argo CD
# applies this file; the values below are placeholders.
apiVersion: pipelinesascode.tekton.dev/v1alpha1
kind: Repository
metadata:
  name: ${{ values.name }}
  labels:
    backstage.io/kubernetes-id: ${{ values.name }}
spec:
  url: https://gitea.example.com/${{ values.org }}/${{ values.name }}
  git_provider:
    type: gitea
    url: https://gitea.example.com
    secret:
      name: golden-pac-secret
      key: token
    webhook_secret:
      name: golden-pac-secret
      key: webhook-secret
  params:
    - name: conforma_identity
      value: set-by-the-platform
    - name: conforma_issuer
      value: set-by-the-platform
