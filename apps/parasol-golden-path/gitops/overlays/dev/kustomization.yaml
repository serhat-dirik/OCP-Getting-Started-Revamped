apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${{ values.user }}-dev
resources:
  - ../../base
patches:
  - path: release.yaml
    target:
      kind: Deployment
      name: ${{ values.name }}
  # Developer Hub's Topology groups workloads by app.kubernetes.io/part-of: one group per environment,
  # named after its namespace, so dev and stage do not draw as one group of identical names.
  - target:
      kind: Deployment
      name: ${{ values.name }}
    patch: |-
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1part-of
        value: ${{ values.user }}-dev
