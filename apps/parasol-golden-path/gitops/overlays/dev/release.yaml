# What runs in dev. The build pipeline rewrites this file after every push that passes all gates.
- op: replace
  path: /spec/replicas
  value: 0
- op: replace
  path: /spec/template/spec/containers/0/image
  value: image-registry.openshift-image-registry.svc:5000/${{ values.user }}-cicd/${{ values.name }}:not-built-yet
