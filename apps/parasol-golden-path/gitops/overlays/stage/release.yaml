# What runs in stage. The release pipeline rewrites this file when you tag a release.
- op: replace
  path: /spec/replicas
  value: 0
- op: replace
  path: /spec/template/spec/containers/0/image
  value: image-registry.openshift-image-registry.svc:5000/${{ values.user }}-cicd/${{ values.name }}:not-built-yet
