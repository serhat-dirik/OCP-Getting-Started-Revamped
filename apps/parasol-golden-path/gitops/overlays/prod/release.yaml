# What runs in prod. The release pipeline rewrites this file after stage runs the same digest.
- op: replace
  path: /spec/replicas
  value: 0
- op: replace
  path: /spec/template/spec/containers/0/image
  value: image-registry.openshift-image-registry.svc:5000/${{ values.user }}-cicd/${{ values.name }}:not-built-yet
