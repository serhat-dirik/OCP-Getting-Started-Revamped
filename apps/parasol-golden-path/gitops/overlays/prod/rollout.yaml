apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ${{ values.name }}
  labels:
    app: ${{ values.name }}
    app.kubernetes.io/name: ${{ values.name }}
    # Developer Hub's Topology groups by part-of: one group per environment.
    app.kubernetes.io/part-of: ${{ values.user }}-prod
    backstage.io/kubernetes-id: ${{ values.name }}
spec:
  replicas: 0
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ${{ values.name }}
  template:
    metadata:
      labels:
        app: ${{ values.name }}
        backstage.io/kubernetes-id: ${{ values.name }}
    spec:
      containers:
        - name: ${{ values.name }}
          image: image-registry.openshift-image-registry.svc:5000/${{ values.user }}-cicd/${{ values.name }}:not-built-yet
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
  strategy:
    canary:
      stableService: ${{ values.name }}
      canaryService: ${{ values.name }}-canary
      steps:
        # Half the pods run the new release, then the analysis decides: pass promotes, fail rolls back.
        - setWeight: 50
        - pause: {duration: 20s}
        - analysis:
            templates:
              - templateName: ${{ values.name }}-canary-check
        - setWeight: 100
