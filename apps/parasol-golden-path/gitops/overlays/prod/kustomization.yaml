# Production runs the service as an Argo Rollouts canary: a new release takes half the pods, an
# automated health analysis runs, and only a passing analysis promotes it to all of them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${{ values.user }}-prod
resources:
  - rollout.yaml
  - services.yaml
  - route.yaml
  - analysis-template.yaml
patches:
  - path: release.yaml
    target:
      kind: Rollout
      name: ${{ values.name }}
