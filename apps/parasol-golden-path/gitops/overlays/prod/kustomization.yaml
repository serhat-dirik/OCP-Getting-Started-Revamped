# Production runs the service as an Argo Rollouts canary: a new release takes half the pods, an
# automated health analysis runs, and only a passing analysis promotes it to all of them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${{ values.user }}-prod
# rollout.yaml is not listed until the first release: the release pipeline adds it, so production's
# Rollout is created with the released image and goes straight to all pods (a canary needs a stable
# version to compare against). Every later release is a canary.
resources:
  - services.yaml
  - route.yaml
  - analysis-template.yaml
patches:
  - path: release.yaml
    target:
      kind: Rollout
      name: ${{ values.name }}
