# The service's entry in the Developer Hub software catalog, registered by the template.
# The annotations switch on the component's tabs:
#   backstage.io/kubernetes-id  Topology and Kubernetes: every object labelled with it, in dev, stage and prod
#   tekton.dev/cicd             CI: the PipelineRuns labelled with the same id
#   argocd/app-selector         CD: the Argo CD Applications for ci, dev, stage and prod
#   backstage.io/techdocs-ref   Docs: mkdocs.yml and docs/ in this repository, built by Developer Hub
# The links are the Links card on the Overview tab, each opening in its own browser tab.
# __OGSR_APPS_DOMAIN__ is the cluster's apps domain, written in when the workshop seeds this template.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: Parasol service created from the golden path (build, scan, sign, verify, GitOps to production).
  annotations:
    backstage.io/kubernetes-id: ${{ values.name }}
    tekton.dev/cicd: "true"
    argocd/app-selector: backstage-name=${{ values.name }}
    backstage.io/techdocs-ref: dir:.
  tags:
    - java
    - quarkus
    - golden-path
  links:
    - title: Open in Dev Spaces
      icon: code
      url: https://devspaces.__OGSR_APPS_DOMAIN__/dashboard/#/ide/${{ values.user }}-devspaces/parasol-quote
    - title: Source code (Gitea)
      icon: github
      url: https://gitea-ogsr-gitea.__OGSR_APPS_DOMAIN__/${{ values.org }}/${{ values.name }}
    - title: GitOps repository (Gitea)
      icon: github
      url: https://gitea-ogsr-gitea.__OGSR_APPS_DOMAIN__/${{ values.org }}/${{ values.name }}-gitops
    - title: Argo CD applications
      icon: dashboard
      url: https://student-gitops-server-student-gitops.__OGSR_APPS_DOMAIN__/applications?search=${{ values.name }}
    - title: Pipelines (OpenShift console)
      icon: dashboard
      url: https://console-openshift-console.__OGSR_APPS_DOMAIN__/pipelines/ns/${{ values.user }}-cicd
    - title: Prod rollout (OpenShift console)
      icon: dashboard
      url: https://console-openshift-console.__OGSR_APPS_DOMAIN__/k8s/ns/${{ values.user }}-prod/argoproj.io~v1alpha1~Rollout/${{ values.name }}
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: parasol-insurance
