# The service's entry in the Developer Hub software catalog, registered by the template.
# The annotations switch on the component's tabs:
#   backstage.io/kubernetes-id  Topology and Kubernetes: every object labelled with it, in dev, stage and prod
#   tekton.dev/cicd             CI: the PipelineRuns labelled with the same id
#   argocd/app-selector         CD: the Argo CD Applications for ci, dev, stage and prod
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: Parasol service created from the golden path (build, scan, sign, verify, GitOps to production).
  annotations:
    backstage.io/kubernetes-id: ${{ values.name }}
    tekton.dev/cicd: "true"
    argocd/app-selector: backstage-name=${{ values.name }}
  tags:
    - java
    - quarkus
    - golden-path
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: parasol-insurance
