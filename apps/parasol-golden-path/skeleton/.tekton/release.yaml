# Pipelines-as-Code: pushing a tag (for example v1.0.0) runs the release pipeline, which promotes
# the image already built from the tagged commit to stage and then prod. It builds nothing.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: ${{ values.name }}-release
  labels:
    backstage.io/kubernetes-id: ${{ values.name }}
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[refs/tags/*]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  pipelineRef:
    resolver: cluster
    params:
      - {name: kind, value: pipeline}
      - {name: name, value: ${{ values.name }}-release}
      - {name: namespace, value: ${{ values.user }}-cicd}
  params:
    - {name: revision, value: "{{ revision }}"}
    - {name: tag, value: "{{ git_tag }}"}
    - {name: conforma-identity, value: "{{ conforma_identity }}"}
    - {name: conforma-issuer, value: "{{ conforma_issuer }}"}
  taskRunTemplate:
    serviceAccountName: pipeline
