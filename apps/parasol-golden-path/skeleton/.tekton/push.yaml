# Pipelines-as-Code: every push to main runs the build pipeline in ${{ values.user }}-cicd.
# This file says WHEN to run; the pipeline itself (${{ values.name }}-build) lives in the GitOps
# repo's ci/ folder, so the platform team can improve it for every service in one place.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: ${{ values.name }}-push
  labels:
    backstage.io/kubernetes-id: ${{ values.name }}
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  pipelineRef:
    resolver: cluster
    params:
      - {name: kind, value: pipeline}
      - {name: name, value: ${{ values.name }}-build}
      - {name: namespace, value: ${{ values.user }}-cicd}
  params:
    - {name: revision, value: "{{ revision }}"}
    - {name: conforma-identity, value: "{{ conforma_identity }}"}
    - {name: conforma-issuer, value: "{{ conforma_issuer }}"}
  taskRunTemplate:
    serviceAccountName: pipeline
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
