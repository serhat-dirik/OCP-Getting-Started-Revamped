# Binary-source BuildConfig for ${{ values.name }} (Docker strategy).
#
# Builds from source you upload: `oc start-build <name> --from-dir=.` sends the
# working tree to the cluster, which builds the Dockerfile in it. The golden path
# scaffolds no pipeline; wire one yourself if you want builds on every push.
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ${{ values.name }}
  labels:
    app.kubernetes.io/name: ${{ values.name }}
    app.kubernetes.io/part-of: parasol
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ${{ values.name }}
  labels:
    app.kubernetes.io/name: ${{ values.name }}
    app.kubernetes.io/part-of: parasol
spec:
  triggers:
    - type: ConfigChange
  runPolicy: Serial
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: ${{ values.name }}:latest
