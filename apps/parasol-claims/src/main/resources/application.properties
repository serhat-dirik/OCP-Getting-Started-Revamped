# Parasol Insurance - Claims service (REST + PostgreSQL, Quarkus)
quarkus.application.name=parasol-claims

# Bind all interfaces on 8080 (the port the OpenShift Service and Route target).
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# ---------------------------------------------------------------------------
# HTTP security response headers (curriculum: app-security-testing DevSecOps DAST gate). Quarkus
# adds each header to every HTTP response via quarkus.http.header.<key>.value.
# A ZAP (Zed Attack Proxy) baseline scan flags any of these as MISSING, so this
# block is what turns the app-security-testing DAST gate from red to green. Harmless to every
# other module (a JSON API is unaffected by CSP/nosniff/frame headers).
#   X-Content-Type-Options  stop MIME-type sniffing
#   Content-Security-Policy  lock the origin; frame-ancestors 'none' = no framing
#   X-Frame-Options          belt-and-suspenders anti-clickjacking
#   Referrer-Policy          never leak the URL in the Referer header
#   Permissions-Policy       deny powerful browser features this API never uses
#   Strict-Transport-Security  force HTTPS at the edge (checked over TLS only)
#   Cache-Control              don't let a browser store claim data (ZAP flags cacheable content)
#   Cross-Origin-Resource-Policy  block cross-origin embedding of API responses (ZAP rule 90004)
# ---------------------------------------------------------------------------
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; frame-ancestors 'none'
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Referrer-Policy".value=no-referrer
quarkus.http.header."Permissions-Policy".value=geolocation=(), camera=(), microphone=()
quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains
quarkus.http.header."Cache-Control".value=no-store
quarkus.http.header."Cross-Origin-Resource-Policy".value=same-origin

# ---------------------------------------------------------------------------
# Graceful shutdown. On SIGTERM (a rollout, or `oc scale` to 0) Quarkus stops
# accepting new requests and drains in-flight ones for at most this long before
# exiting. A short bound means a scaled-down pod dies crisply and well within a
# small terminationGracePeriodSeconds, so rollouts and scale-downs finish promptly instead of
# sitting out a grace period. (This was originally justified by resilience-multicluster-dr's
# "fail a site by scaling to zero" step; that module no longer runs this image, so the bound now
# stands on the general rollout argument alone - it is not load-bearing for any single module.)
# ---------------------------------------------------------------------------
quarkus.shutdown.timeout=2S

# ---------------------------------------------------------------------------
# Site awareness. The GET / landing (RootResource) carries a compact "site":"<SITE>"
# marker when the SITE env var is set - the same wire contract parasol-notifications
# implements - so a site-aware deployment can self-identify. NOTHING sets SITE on this
# image today (enumerated 2026-08-06): it was written for resilience-multicluster-dr,
# which now runs an inline Node responder as its per-site service instead, so every
# current deployment gets the clean single-site landing. RootResourceSiteTest keeps the
# compact format pinned.
#
# DB-free boot. The root never touches the datasource, so this image can run with no
# PostgreSQL beside it - QUARKUS_DATASOURCE_ACTIVE=false and QUARKUS_HIBERNATE_ORM_ACTIVE=false
# (the /api/claims data endpoints are inactive in that mode). Two module worlds use this:
# ai-assisted-development's seeded diagnosis target and app-modernization's modernized service.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Datasource. db-kind is PostgreSQL everywhere except tests. Every production
# value is env-overridable so the SAME image runs across dev/stage/prod with
# only config changing - this is the app M04 teaches config externalization on.
# Defaults point at a Service named 'parasol-db' in the same namespace.
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${POSTGRESQL_USER:parasol}
%prod.quarkus.datasource.password=${POSTGRESQL_PASSWORD:parasol}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRESQL_HOST:parasol-db}:${POSTGRESQL_PORT:5432}/${POSTGRESQL_DATABASE:parasol}

# Schema + deterministic seed. drop-and-create reloads the 30 fixed claims
# (CLM-1001..CLM-1030) from import.sql on every boot, so labs get reproducible
# output. For the persistence exercises in M05+ (data must survive a restart),
# override QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY=update (or none).
#
# NOTE the strategy dependency: Quarkus runs sql-load-script under drop-and-create and
# create ONLY. Under update/none the 30 seeds do not load — which is the point on those
# paths — and neither does import.sql's CREATE SEQUENCE. The claim_number_seq that
# POST /api/claims draws from is therefore created at startup by ClaimNumberSequence,
# which runs whatever the strategy is, so the create path works on an empty database
# (numbering from CLM-1001) as well as on a seeded one (CLM-1031).
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# ---------------------------------------------------------------------------
# Observability is curriculum and ships ON by default under the /q path:
#   /q/health/live, /q/health/ready   SmallRye Health   (config-multienv, observability-health-scale)
#   /q/metrics                         Micrometer/Prom   (observability-health-scale dashboards)
# Keep the HTTP server binder on so that module can group request metrics by app.
# ---------------------------------------------------------------------------
quarkus.micrometer.binder.http-server.enabled=true

# ---------------------------------------------------------------------------
# Logging (curriculum: application-logging). Same ships-on/switched-off shape as OpenTelemetry
# below: the CAPABILITY is in the image, the SWITCH is per deployment, so every other module keeps
# the console it captured its output against and nothing here is a rebuild.
#
# Three knobs, and the exact environment variables that flip them:
#   quarkus.log.console.json.enabled       QUARKUS_LOG_CONSOLE_JSON_ENABLED=true
#       One JSON object per record on stdout instead of a formatted sentence. Off here because a
#       reader following any other module should see the familiar Quarkus console.
#   quarkus.log.category."com.parasol".level   QUARKUS_LOG_CATEGORY__COM_PARASOL__LEVEL=DEBUG
#       THIS app's chatter only — reads are logged at DEBUG (see ClaimResource), writes at INFO.
#       Set to DEBUG to see request-level detail without turning the framework up with it. The
#       double underscores are how a quoted config segment is spelled as an environment variable.
#   quarkus.http.access-log.enabled        QUARKUS_HTTP_ACCESS_LOG_ENABLED=true
#       One line per HTTP request from the server, independent of anything the app logs. Off by
#       default because its default pattern writes the full request line INCLUDING THE QUERY
#       STRING — which is how a credential passed as ?api_key=... ends up in a log file. The lab
#       makes exactly that mistake on purpose and then fixes it.
#
# The root level is deliberately left at its INFO default: a category set to DEBUG is still
# printed, because the console handler's own threshold (quarkus.log.console.level) is ALL.
# ---------------------------------------------------------------------------
quarkus.log.console.json.enabled=false
quarkus.log.category."com.parasol".level=INFO
quarkus.http.access-log.enabled=false

# OpenTelemetry: REST + JDBC auto-instrumentation is built into the image. The
# OTLP exporter is switched OFF by default (no collector exists until observability-health-scale);
# that module turns it on against Tempo with:
#   QUARKUS_OTEL_SDK_DISABLED=false
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://<tempo-otlp>:4317
# Keeping it off here means clean logs for every other module.
quarkus.otel.sdk.disabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:}

# ---------------------------------------------------------------------------
# OIDC - this is a bearer-only resource server (curriculum: securing-apps-keycloak). It
# ships DISABLED so the API stays anonymous for every other module and no auth server is
# contacted at boot (module independence). That module sets, per user, via env:
#   QUARKUS_OIDC_TENANT_ENABLED=true
#   QUARKUS_OIDC_AUTH_SERVER_URL=https://sso-workshop.<domain>/realms/realm-<user>
#   QUARKUS_OIDC_CLIENT_ID / QUARKUS_OIDC_CREDENTIALS_SECRET
# and adds @RolesAllowed("claims-adjuster") on the guarded ClaimResource method.
# ---------------------------------------------------------------------------
quarkus.oidc.tenant-enabled=false
quarkus.oidc.application-type=service
# Keycloak realm roles live under realm_access.roles (not groups) - set so
# @RolesAllowed(...) matches Keycloak realm roles once the tenant is enabled. Inert now.
quarkus.oidc.roles.role-claim-path=realm_access/roles
# Never auto-start a Keycloak Dev Services container in dev/test - the workshop
# always points OIDC at the shared rhbk via env (securing-apps-keycloak). Keeps dev mode and CI offline.
quarkus.keycloak.devservices.enabled=false

# ---- %dev: `mvn quarkus:dev` just works. With a container runtime (Podman /
# Dev Spaces) Quarkus Dev Services starts a throwaway PostgreSQL automatically.
# In M03 you point dev mode at the in-cluster PostgreSQL instead by exporting
# QUARKUS_DATASOURCE_JDBC_URL / _USERNAME / _PASSWORD.

# ---- %test: in-memory H2, so the build and CI never need a PostgreSQL. ----
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:claims;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
