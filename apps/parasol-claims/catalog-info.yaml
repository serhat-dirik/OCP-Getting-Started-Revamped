# Backstage / Red Hat Developer Hub catalog entities for parasol-claims (module
# developer-hub-golden-paths).
#
# Declares the shared `parasol-insurance` System once (here, on the core service),
# then the parasol-claims Component and its API. parasol-web and
# parasol-notifications reference this same System from their own catalog-info.yaml.
#
# Kept portable (no cluster domain hardcoded): the integrations are driven by
# annotations, and RHDH derives the source link from the catalog location.
#
# THE WHOLE ROOM READS ONE ENTITY. An earlier version of this comment said the
# developer-hub-golden-paths entry state "injects environment-specific links when it registers
# per-user forks". Both halves are false and it is worth being blunt about, because an attendee
# who believes it goes looking for their own component and cannot find it:
#   - components/rhdh/app-config.yaml registers the SHARED parasol/* org repos as its only catalog
#     locations. build-deliver DOES fork parasol-claims per attendee, but a fork is never a catalog
#     location, so the portal keeps showing the shared entity.
#   - nothing injects links. The developer-hub-golden-paths entry state does the opposite — it
#     DEregisters catalog Locations — and the per-user catalog-info it writes has no links: block.
#     The lab says it plainly: "The Developer Hub portal is shared with the whole room."
# Per-user entities come only from services an attendee scaffolds into {user}-svcs.
#
# The janus-idp.io/tekton annotation below is INERT on this platform, and that resolves the TODO
# that used to sit here asking which key RHDH 1.10 wants. The question does not arise: RHDH is
# 1.10.3 and the only dynamic plugin the portfolio enables is the Gitea scaffolder backend
# (components/rhdh/dynamic-plugins.yaml) — no Tekton plugin reads janus-idp.io/tekton OR
# tektonci/* here. The annotation is kept as a correct-by-convention hint for anyone who enables
# the plugin later; confirm the key against that plugin's own docs at the time, not now.
---
# The owning team. Every Parasol Component/API/System/Template sets `owner: parasol`; declaring the
# Group here (alongside the shared System) makes those ownership links resolve in the RHDH catalog
# instead of showing as dangling references.
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: parasol
  description: The Parasol Insurance engineering team — owner of every Parasol service and API.
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: parasol-insurance
  description: Parasol Insurance claims platform — the services behind the workshop story.
  tags:
    - parasol
    - insurance
spec:
  owner: parasol
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: parasol-claims
  description: Core claims service (REST + PostgreSQL, Quarkus). Owns the CLM-1001..CLM-1030 dataset.
  annotations:
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-id: parasol-claims
    argocd/app-name: parasol-claims
    janus-idp.io/tekton: parasol-claims
  tags:
    - java
    - quarkus
    - rest
    - postgresql
  links:
    - url: https://quarkus.io/guides/
      title: Quarkus guides
      icon: docs
spec:
  type: service
  lifecycle: production
  owner: parasol
  system: parasol-insurance
  providesApis:
    - parasol-claims-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: parasol-claims-api
  description: Parasol claims REST API — claims CRUD, status workflow, and audit history.
  tags:
    - rest
spec:
  type: openapi
  lifecycle: production
  owner: parasol
  system: parasol-insurance
  definition: |
    openapi: 3.0.3
    info:
      title: Parasol Claims API
      version: "1.1"
      description: Core claims service for Parasol Insurance.
    paths:
      /api/claims:
        get:
          summary: List claims (optional page & size)
          responses:
            "200": { description: A list of claims }
        post:
          summary: Create a claim
          responses:
            "201": { description: The created claim }
            "400": { description: Invalid claimant or type }
      /api/claims/{claimNumber}:
        get:
          summary: Get one claim by its number
          parameters:
            - { name: claimNumber, in: path, required: true, schema: { type: string } }
          responses:
            "200": { description: The claim }
            "404": { description: No such claim }
      /api/claims/{claimNumber}/history:
        get:
          summary: A claim's audit timeline
          parameters:
            - { name: claimNumber, in: path, required: true, schema: { type: string } }
          responses:
            "200": { description: The claim and its ordered events }
            "404": { description: No such claim }
      /api/claims/{claimNumber}/status:
        put:
          summary: Advance a claim's workflow status
          parameters:
            - { name: claimNumber, in: path, required: true, schema: { type: string } }
          responses:
            "200": { description: The updated claim }
            "400": { description: Invalid status }
