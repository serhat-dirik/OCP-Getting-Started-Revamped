# Backstage / Red Hat Developer Hub catalog entities for parasol-web (the
# developer-hub-golden-paths module).
#
# References the shared `parasol-insurance` System declared in parasol-claims's
# catalog-info.yaml. Portable — the only URL below is an external doc link, no cluster domain.
#
# RHDH reads THIS file from the SHARED `parasol/parasol-web` Gitea repo, registered as a catalog
# location in platform-portfolio/components/rhdh/app-config.yaml (catalog.locations) and seeded from
# this directory by workshop-config's appRepoSeed. There is no per-user fork of this repo and nothing
# injects per-user links, so the whole room reads ONE parasol-web entity — an attendee looking for
# their own copy will not find one. The only per-user entities on that portal are the services
# attendees scaffold into their own `{user}-svcs` org (developer-hub-golden-paths), each of which
# ships its own generated catalog-info.yaml.
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: parasol-web
  description: Parasol claims-portal web frontend (Quarkus). The first app attendees deploy (M01).
  annotations:
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-id: parasol-web
    argocd/app-name: parasol-web
    janus-idp.io/tekton: parasol-web
  tags:
    - java
    - quarkus
    - frontend
  links:
    - url: https://quarkus.io/guides/
      title: Quarkus guides
      icon: docs
spec:
  type: website
  lifecycle: production
  owner: parasol
  system: parasol-insurance
  providesApis:
    - parasol-web-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: parasol-web-api
  description: Read-only seeded claims summary that backs the portal landing page.
  tags:
    - rest
spec:
  type: openapi
  lifecycle: production
  owner: parasol
  system: parasol-insurance
  definition: |
    openapi: 3.0.3
    info:
      title: Parasol Web API
      version: "1.1"
      description: Seeded claims summary for the Parasol claims portal.
    paths:
      /api/claims:
        get:
          summary: The five seeded portal claims (CLM-1001..CLM-1005)
          responses:
            "200": { description: A fixed list of five claims }
