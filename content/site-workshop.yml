---
# Antora playbook — WORKSHOP rendering (attendee guide, the default flavor).
# All three site-*.yml playbooks resolve the SAME single `modules` component and
# differ only in asciidoc.attributes (flavor flag), site.title, and output.dir.
site:
  title: "OpenShift Application Platform — Getting Started"
  start_page: modules::index.adoc

asciidoc:
  attributes:
    # Flavor flag: selects nav-workshop.adoc via modules/ROOT/nav.adoc (every playbook
    # sets exactly one flavor attribute; pages also key ifdef blocks off these).
    workshop: true
    # Content-currency stamp rendered on the home page. CI overrides it per deploy
    # (pages-preview passes --attribute "build-info=Content current through <sha> ·
    # <utc>"); this default marks local previews so staleness is never ambiguous
    # again (an already-current site was twice read as "not updated", 2026-07-10).
    #
    # Reworded 2026-08-14 (third false-stale report): the prior "Site build <sha> ·
    # <utc>" phrasing read as a CI-run timestamp, inviting readers to eyeball the date
    # and conclude "stale" — even though pages-preview's path filter only skips
    # commits that cannot change a rendered byte, so an old-looking stamp can still be
    # fully content-current. "Content current through <sha>" states what a reader
    # actually needs to know and stays true however long the site goes un-rebuilt.
    build-info: Local preview build (unstamped)

content:
  sources:
    # IMPORTANT: build from inside content/ (all tooling does: `cd content && antora …`,
    # or `npm run build:workshop`, or utilities/lab-serve). Antora resolves a local
    # content-source `url` other than "." relative to the invocation directory, so
    # from content/ the `..` below points at the repo root (a git repo). `start_path`
    # then selects content/antora.yml. Antora reads the local worktree, so uncommitted
    # edits render during preview.
    - url: ..
      start_path: content

ui:
  supplemental_files: ./supplemental-ui
  bundle:
    # RHDP Showroom theme, PatternFly 6 release (current OCP-console look).
    url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/patternfly-6/ui-bundle.zip
    snapshot: true

antora:
  extensions:
    - require: '@sntke/antora-mermaid-extension'
      # VENDORED, not CDN (2026-08-05). This value is substituted verbatim into the emitted
      # `<script type="module">import mermaid from '…'</script>`, which the theme renders through
      # partials/header.hbs — so Handlebars expressions resolve, and {{{uiRootPath}}} yields the
      # page-relative path to the published UI root (`../../_` two levels deep, `_` at the root).
      # QUOTED because a YAML scalar may not start with a bare `{`.
      #
      # Was https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs: on an air-gapped or
      # egress-restricted cluster that import fails and EVERY diagram on EVERY page renders as raw
      # text, and the cockpit serves from in-cluster where egress is not guaranteed.
      #
      # The library and all 45 files of its lazy-loaded chunk closure live in
      # content/supplemental-ui/js/vendor/mermaid/ — read that directory's README before touching
      # this: the ESM entry is 76 bytes and import()s a separate chunk per diagram type (vendoring
      # only the entry looks fine until someone writes a sequenceDiagram), and the entry is
      # deliberately `.js`, not upstream's `.mjs`, because quay.io/rhpds/nginx:1.25 has no `mjs`
      # MIME mapping and browsers refuse to execute a module served as octet-stream.
      # Keep this value identical across all five playbooks (content/site-{workshop,demo,
      # instructor}.yml, showroom/site.yml, showroom/site-demo.yml) — drift is a defect.
      mermaid_library_url: "{{{uiRootPath}}}/js/vendor/mermaid/mermaid.esm.min.js"
      script_stem: header-scripts
      mermaid_initialize_options:
        start_on_load: true
        # Legibility defaults (project ruling 2026-07-10). NOTE: keys MUST be snake_case — the
        # extension lowercases raw camelCase (themeVariables -> "themevariables", silently
        # ignored by mermaid; proven from the emitted initialize() call) but converts
        # snake_case to correct camelCase. Paired with the supplemental head-styles
        # override that scales .mermaid svg to the content column.
        theme: default
        theme_variables:
          font_size: "18px"
        flowchart:
          html_labels: true
          use_max_width: true
          node_spacing: 45
          rank_spacing: 50
          padding: 12
    - require: '@andrew-jones/antora-tabs-extension'
      # Remember the attendee's CLI-vs-Console tab choice across every page (localStorage).
      sync_storage_key: preferred-tab

runtime:
  cache_dir: ./.cache/antora

output:
  # Built from content/, so `../www/workshop` lands at the repo root: <repo>/www/workshop.
  dir: ../www/workshop
