name: modules
title: "OpenShift Application Platform — Getting Started"
version: ~
start_page: ROOT:index.adoc
nav:
  # Flavor-selecting wrapper — includes nav-{workshop,demo,instructor}.adoc per the
  # playbook's flavor attribute. Register ONLY this file (registering all three would
  # render every sidebar in every flavor).
  - modules/ROOT/nav.adoc

asciidoc:
  attributes:
    # --- Authoring / UX toggles (Showroom conventions, 01-ARCHITECTURE §2) ---
    experimental: true            # enables kbd:/btn:/menu: UI macros
    page-pagination: true         # prev/next buttons at the bottom of every page
    tabs-sync-option: ""          # CLI|Console tabs flip together site-wide — attendee picks a path ONCE (project ruling 2026-07-11)
    idprefix: ""                  # stable section IDs for deep-links
    idseparator: "-"
    # Page-kind word in every lab page's title. HARD on purpose: measured precedence is
    # playbook-hard > component descriptor > playbook-soft, so site-demo.yml overrides it
    # to "Demo" while workshop/instructor keep "Lab". "Lab" is the wrong word on a screen
    # shared with a customer.
    lab_page_label: "Lab"

    # --- Zero-touch Showroom identity (overridden at RHDP deploy time) ---
    lab_name: "OpenShift Application Platform — Getting Started@"
    guid: "dev-local@"

    # --- Environment values: SAFE DEV DEFAULTS, @-soft-set so a deploy playbook
    #     (site.yml) or the Showroom deployer can override them. Content NEVER
    #     hardcodes these — pages reference {user}, {ocp_console_url}, ... only. ---
    user: "user1@"
    password: "openshift@"
    ocp_console_url: "https://console.apps.example.com@"
    cluster_domain: "apps.example.com@"
    gitea_url: "https://gitea.example.com@"
    devspaces_url: "https://devspaces.apps.example.com@"
    # RHACS (Advanced Cluster Security) Central console — used by app-security-testing for the
    # instructor demo + screenshots. Route pattern on the workshop cluster:
    # central-stackrox.{cluster_domain}. Content references {acs_console_url} only.
    acs_console_url: "https://central-stackrox.apps.example.com@"
    # SonarQube (Community Build) dashboard — used by app-security-testing for the SAST finding +
    # screenshots. Route on the workshop cluster: sonarqube-sonarqube.{cluster_domain}.
    # Content references {sonarqube_url} only.
    sonarqube_url: "https://sonarqube-sonarqube.apps.example.com@"
    # Red Hat Developer Hub portal (developer-hub-golden-paths): shared, read-mostly, guest sign-in.
    # Content references {rhdh_url} only. Route pattern on the workshop cluster:
    # backstage-developer-hub-rhdh.{cluster_domain}
    rhdh_url: "https://backstage-developer-hub-rhdh.apps.example.com@"
    # Student Argo CD instance (gitops-fundamentals onward): attendee-writable GitOps UI,
    # OpenShift-SSO login. Route pattern on the workshop cluster:
    # student-gitops-server-student-gitops.{cluster_domain}
    student_argo_url: "https://student-gitops-server-student-gitops.apps.example.com@"
    # Migration Toolkit for Applications (MTA 8) web console. Route on the workshop cluster:
    # mta-openshift-mta.{cluster_domain}. Content references {mta_url} only (app-modernization).
    mta_url: "https://mta-openshift-mta.apps.example.com@"
    maas_endpoint: "https://maas.example.com/v1@"
    # MaaS model id served by {maas_endpoint}. THERE IS NO DEFAULT — project owner's ruling,
    # 2026-07-30: "this may change in every setup, whatever available the workshop should work with
    # it. there is no default, only expected parameters."
    #
    # This read `llama-scout-17b` until then, and the value was live and wrong: `ws maas show`
    # reported every AI namespace correctly converged on qwen3-14b from the workshop credential,
    # while the built docs rendered llama-scout-17b — a model this cluster's key answers with HTTP
    # 401. The runtime was right and the instructions were wrong, which is the worse way round: an
    # attendee pastes the model name the page gave them and gets a failure the page promised was a
    # success. Note the default had ALREADY flipped once for exactly this reason, in the opposite
    # direction. Two clusters, two opposite scopes — there is no value that is right everywhere,
    # which is the ruling above stated as a fact about the world.
    #
    # Set per install from the ogsr-system/ogsr-maas-credentials Secret (`ws maas show` prints it);
    # tools/lint/maas-model-no-default-guard.py fails the build if a concrete value reappears here.
    # The value is deliberately NOT angle-bracketed. It used to read
    # "<set-from-ogsr-maas-credentials>" and that rendered as NOTHING in a browser: Asciidoctor
    # emitted the angle brackets unescaped inside <code>, so the page shipped a literal
    # <set-from-ogsr-maas-credentials> element that every browser parsed as an unknown tag and
    # dropped. Attendees read "it is " and "serving " — the sentence lost its subject, in three
    # places in concept.adoc and two in lab.adoc, with no build warning at any log level.
    # Verified in the built HTML on 2026-07-31, not inferred. Keep this value plain text.
    maas_model: "set-from-ogsr-maas-credentials@"

    # The LIVE cluster version, as read from the cluster the attendee is on — distinct from
    # {ocp_version}, which versions.yaml documents as a MINIMUM supported release, not a reading.
    # One attribute cannot be both a pinned floor and a live value, and trying to make it both is
    # the actual defect underneath F-05: {ocp_version} rendered 4.22.6 against a 4.22.8 cluster
    # across 85 uses, because a build-time snapshot was being read as a runtime fact.
    #
    # THIS DEFAULT IS LOAD-BEARING AND MUST STAY. Asciidoctor's attribute-missing default is
    # `skip`, so a page referencing an attribute no layer defines ships literal {braces} to the
    # reader with ZERO warnings and a rc-0 build — there is no CI net under this. The three
    # CI/preview playbooks never read showroom/site.yml, so its soft default covers the cockpit
    # only; this one covers everything else.
    #
    # `@` makes it SOFT so the per-user showroom ConfigMap overrides it. Precedence was measured,
    # not assumed (three single-variable Antora 3.1.15 builds, 2026-08-07):
    #   playbook-hard  >  component descriptor  >  playbook-soft
    # The deploy-time channel is ConfigMap showroom-userdata-{user} -> /user_data/user_data.yml,
    # merged into THIS file's attributes by the cockpit entrypoint — the same path that already
    # carries cluster_domain, ocp_console_url, gitea_url and maas_model. A hard value here would
    # outrank the attendee's own cluster reading and silently serve the git-baked one instead.
    #
    # NO PAGE CONSUMES THIS, AND THAT IS THE CORRECT NUMBER — do not "finish the wiring".
    # Measured 2026-08-08: 0 live (non-comment) references across the 141 .adoc files under
    # content/. The F-05 sweep retired all 85 {ocp_version} uses without needing it even once,
    # because the provenance split leaves a live reading almost nothing to say: past-tense records
    # freeze to a literal beside their date, product-timeline claims ("GA in 4.NN") lose the version
    # or take a floor ({ocp_image_policy_version}, {service_mesh_minimum}), and captured output
    # stays captured. Where a page handles real per-cluster variance it already does the better
    # thing and has the READER run a command — `oc get csv -n openshift-mta`
    # (app-modernization/instructor.adoc), the live model probe at app-modernization/lab.adoc:305 —
    # or describes both branches (LoadBalancer `<pending>`, no RWX StorageClass). That works on a
    # cluster this project has never seen; an attribute only works where the deploy channel filled
    # it in, which on the FSC path it may not have.
    #
    # SO WHY KEEP THE PLUMBING. Two concrete reasons:
    #   1. It is NOT unused outside content/. bootstrap/install.sh reports it in preflight,
    #      helm/bootstrap/templates/userinfo.yaml names it in the deployer's content_notice, and
    #      helm/bootstrap/templates/job-cockpit-attributes.yaml grades the declared value against
    #      the live cluster on every deploy. Deleting this blinds three checks that pass today.
    #   2. It is the honest answer for a page that genuinely needs the reader's release, so the
    #      next author has somewhere to go instead of reaching for {ocp_version} again.
    #
    # THE RULE FOR USING IT — and note NOTHING ENFORCES THIS. version-anchor-guard's ATTR_RE is
    # \{(ocp[A-Za-z0-9_]*_version|ocp_version)\}, which cannot match a name starting `cluster_`.
    # Measured 2026-08-08 on a scratch fixture: a lab page carrying {cluster_ocp_version} passes
    # clean while {ocp_version} and a bare 4.22.8 on the same page both fire. This is therefore the
    # ONLY OpenShift-release-bearing token that reaches concept/lab/wrapup ungated. Use it solely
    # for a PRESENT-TENSE statement about the cluster the reader is on right now, where a command
    # in the same block cannot say it better. Never for provenance, never for "GA in", never for a
    # floor. It also carries the PATCH (4.22.8); anything needing the MINOR — the operator catalog
    # index tag at packaging-distributing/lab.adoc:1104 is the catalogue's one real candidate —
    # needs a derivative this plumbing does not provide.
    #
    # IF YOU ADD THE FIRST CONSUMER, change tools/ws/ws in the same slice:
    # doctor_cockpit_attr_findings deliberately does NOT grade this key's ABSENCE, and says so,
    # because no page referenced it. The moment one does, an absent key renders `set-from-cluster`
    # to that attendee and doctor must go red — the same lockstep DOCTOR_MAAS_MODULES already
    # carries for {maas_model}.
    cluster_ocp_version: "set-from-cluster@"

    # --- Flavor flags are INTENTIONALLY UNSET here (off by default) so that
    #     ifdef::demo[] / ifdef::instructor[] evaluate false in the workshop build.
    #     site-demo.yml sets `demo: true`; site-instructor.yml sets `instructor: true`. ---
