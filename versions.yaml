    already using 3.33'. The 3.33.2.1 recorded above therefore sits BELOW a known-CVE fix. It is left
    unchanged only because it is not a versions.yaml-only edit: nine apps/ poms set
    quarkus.platform.version=3.33.2.1 and the developer-hub-golden-paths lab prints that literal in a
    pom snippet, so bumping this attribute alone would make prose contradict the code. Raise all of
    them together in one slice."
  entitlement: OCP

