istio:
  # ADDED 2026-07-31. The Istio version our Sail Istio CR asks for in spec.version (mirrors
  # service_mesh.istio_version; kept as its own top-level entry, same pattern as argocd/gitops
  # above, so gen-attributes emits {istio_version} for content prose). It was added because pages
  # hardcoded "Istio 1.28" / "Istio v1.28.6" in rendered prose with no attribute to reference.
  # STATUS 2026-08-05: that gap is CLOSED — service-mesh-advanced-gateways concept/lab/instructor
  # now interpolate {istio_version}. The literals that remain in resilience-multicluster-dr and in
  # the mesh troubleshooting/instructor footers are NOT defects: they are `//` grounding-provenance
  # comments, "Last verified on ..." footers, and captured terminal output, all of which must stay
  # literal because they record what was actually observed on a given date.
  version: "v1.28.6"        # GROUNDED-ON, not a ceiling: what the CR requests on the cluster today
  minimum: "v1.28.6"        # the floor the workshop requires — newer Istio minors are EXPECTED and fine
  verified: 2026-08-05
  source: >
    live `oc get istio -A -o jsonpath spec.version` (read-only) — matches service_mesh.istio_version.
    Re-read 2026-08-05 AFTER the operator moved to OSSM 3.4.1: Istio CR `default` still requests
    v1.28.6, status Healthy, activeRevision `default`. What the 3.4.1 operator will ACCEPT was read
    the same day from `oc explain istio.spec.version`, whose ENUM lists: v1.30-latest, v1.30.3,
    v1.30.1, v1.28-latest, v1.28.10, v1.28.8, v1.28.6, v1.28.5, v1.28.4, and the v1.27 / v1.26 lines.
  notes: "DOCS AND CLUSTER DISAGREE — recorded here rather than resolved, because both are true.
    DOCS: the Red Hat blog 'Introducing Red Hat OpenShift Service Mesh 3.4' (2026-07-09) says 3.4
    'updates the version of Istio to 1.30, and Kiali to 2.27', and that it 'jumps 2 minor Istio
    releases from OpenShift Service Mesh 3.3' (which ran Istio 1.28). So 1.30 is the headline
    data-plane version of the OSSM minor we are on.
    CLUSTER: our Istio CR still asks for v1.28.6 and is Healthy, and v1.28.6 is still in the 3.4.1
    operator's accepted enum — so nothing is broken and the recorded value is not stale-as-in-wrong.
    Two consequences worth knowing before quoting this number: v1.28.6 is neither the newest minor
    the operator offers (v1.30.3) nor the newest patch of its own minor (v1.28.10); and because the
    CR names an exact patch, the mesh data plane does NOT float the way the operator does — the
    operator walked 3.3.5 -> 3.4.0 -> 3.4.1 on its own while Istio stayed put. Treat v1.28.6 as the
    floor we have exercised, never as a supported ceiling, and re-ground the sample rather than
    pinning the CR harder if a newer Istio is wanted."
  entitlement: OCP

