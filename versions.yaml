# ---------- M24 AI-ASSISTED DEVELOPMENT (vibe coding, safely) — verified 2026-07-15 vs live cluster + upstream ----------
kubernetes_mcp_server:
  repo: github.com/containers/kubernetes-mcp-server   # upstream Go; THE M24 tool
  image: "ghcr.io/containers/kubernetes-mcp-server@sha256:5df586e2c7ced2a3125f6e78923388d80b69de0a2ad1470325b05318f12725bd"
  version: "0.0.65"          # multi-arch manifest-list digest of tag v0.0.65 (released 2026-07-14)
  verified: 2026-07-15
  source: >
    github.com/containers/kubernetes-mcp-server releases + docs/configuration.md; digest resolved live via
    `oc image info ghcr.io/containers/kubernetes-mcp-server:v0.0.65` on ocp-ws-revamped 2026-07-15.
  notes: >
    THE M24 tool (Red Hat's openshift-mcp-server Tech Preview is a FORK of this — document it as the product
    path, do NOT default the graded lab on it). Pre-1.0, DAILY churn → PIN BY DIGEST and re-verify every
    flag/name/image at build. Deployed as a plain Deployment (no operator) run as a scoped ServiceAccount;
    in-cluster it auto-detects the projected SA token and acts with EXACTLY that identity's RBAC. HTTP
    transport with --port: SSE at /sse, Streamable HTTP at /mcp (NOT the Quarkus /mcp/sse path). Flags:
    --read-only + --disable-destructive are DEFENCE-IN-DEPTH, NOT a security boundary — CVE-2026-46519 showed
    a sibling project's (TypeScript Flux159/mcp-server-kubernetes) read-only flag filtered tool discovery but
    not execution → bypassable; RBAC on the SA is the boundary. --toolsets default core,config,helm; M24 pins
    core,config to shrink the surface + bound MaaS token spend. Do NOT deploy the Flux159 CVE project.
  entitlement: OCP           # the server itself is OCP-installable; MaaS usage below is the [ADD-ON]
maas:
  endpoint_attribute: "{maas_endpoint}"   # content references the endpoint ONLY via this attribute, never inline
  model: qwen3-14b                         # REVERTED 2026-07-31 — see note; was llama-scout-17b since the
                                            # 2026-07-18 task #67 correction, but that is not what is live today.
  source_secret: ogsr-system/ogsr-maas-credentials   # CORRECTED 2026-07-31 — see note; was openshift-lightspeed/credentials
  source_key: apitoken
  verified: 2026-07-31
  source: >
    docs/research/m23-build-note.md + m24-build-note.md + field-sourced-content-note.md §3 (FSC
    litemaas.model default) — historical context only, superseded below; live read-only checks on
    2026-07-31: ogsr-system/ogsr-maas-credentials (keys apitoken/endpoint/model — model decoded live
    reads qwen3-14b, endpoint matches {maas_endpoint}, apitoken NOT decoded); per-user ConfigMap
    maas-config in user6-ai and user6-batch (both read model: qwen3-14b, same endpoint); per-user Secret
    maas-credentials in the same namespaces (key GENAI_API_KEY, value not decoded).
  notes: >
    Models-as-a-Service (LiteMaaS/LiteLLM on RHDP), OpenAI-compatible /v1, per-user SHORT-LIVED virtual keys.
    MODEL REVERTED 2026-07-31: a same-day smoke pass found the model actually served is qwen3-14b, written
    into each user's maas-config ConfigMap by a cluster-wide hook (not by any chart) — confirmed independently
    here via read-only inspection of user6-ai/user6-batch's maas-config CMs and the ogsr-system master secret.
    This reverses the 2026-07-18 task #67 correction (which moved the recorded model TO llama-scout-17b after
    a live 401 key_model_access_denied against qwen3-14b) — whatever changed between 07-18 and 07-31, qwen3-14b
    is what a per-user key will actually authorize today. Since keys are MODEL-SCOPED, citing the wrong model
    here is an auth failure for content, not a cosmetic mismatch — re-verify at the next module touching MaaS
    rather than trusting either historical date over the other.
    SECRET PATH CORRECTED 2026-07-31: openshift-lightspeed/credentials was previously recorded as the
    source, keys "Bearer + apitoken" — live, that secret carries ONLY a "Bearer" key, no "apitoken". The
    secret that actually carries apitoken + endpoint + model is ogsr-system/ogsr-maas-credentials (the
    cluster-wide hook's master secret); the PER-USER Secret it produces (maas-credentials, in each
    <user>-<module> namespace) carries the token under key GENAI_API_KEY, not apitoken. Content/tooling
    reading a per-user Secret must use GENAI_API_KEY.
    NEVER hardcode the host or key in content or evidence — the shared RHDP host lives in the entry-state
    values.yaml (the CI privacy guard tolerates it, queued for parameterization in the packaging wave) and
    reaches content only as {maas_endpoint}; it is deliberately NOT repeated in this file either. [ADD-ON]
    entitlement — no [OCP] module may depend on it.
  entitlement: ADD-ON
