# Product versions this workshop is built and verified against.
#
# This is the single source of truth. Content never hardcodes a version — it references
# attributes generated from this file by tools/gen-attributes.sh, and CI fails if the
# generated file drifts from what is here.
#
# Each product carries its own `verified` date, and that is the one to trust: the top-level
# date below covers the file as a whole and is not moved when a single product is re-checked.
# Before relying on any entry, confirm its `verified` date is recent enough for your purpose,
# or re-check it against docs.redhat.com.
#
# Versions are MINIMUMS, not caps. Newer releases on a cluster are expected and fine.
#
verified: 2026-07-08

ocp:
  channel: stable-4.22
  version: "4.22.6"         # minimum, not a cap
  grounded_on: "4.22.8"     # the build actually running on the workshop cluster (see verified)
  eus_line: "4.22"          # even-numbered minors are Extended Update Support (24 months)
  verified: 2026-08-05
  eus_verified: 2026-08-05  # re-confirmed against the published policy + life-cycle data, see source
  source: >
    access.redhat.com/support/policy/updates/openshift; live cluster read-only
    `oc get clusterversion version` -> status.desired.version 4.22.8, spec.channel stable-4.22 (2026-08-05).
    EUS re-checked against docs 2026-08-05: the updates-policy page states "Red Hat denotes even numbered
    minor releases (eg 4.12, 4.14, 4.16) as Extended Update Support (EUS) releases", and the Red Hat
    Product Life Cycles data for OpenShift Container Platform 4 shows 4.22 carrying an Extended Update
    Support phase (4.21, an odd minor, shows none) — so the 4.22 EUS line is confirmed, not assumed.
  notes: "Targets the 4.22 EUS line. version: is a MINIMUM, not a cap — newer clusters are fine.
    grounded_on: records the build this file was last checked against; do not treat it as a floor.
    The 24 months quoted above is the INCLUDED window (roughly 18 months of standard support plus the
    6-month EUS Term 1 that comes with Premium). Terms 2 and 3 are paid add-ons of 12 months each and
    take an EUS minor to a 48-month maximum — quote 24 unless the customer has bought the add-ons."
  entitlement: OCP

