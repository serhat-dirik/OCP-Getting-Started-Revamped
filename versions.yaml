# SINGLE SOURCE OF TRUTH for product versions used by this workshop.
# Rule (01-ARCHITECTURE §6): content/slides reference versions ONLY via attributes
# generated from this file. Any session touching a module must confirm `verified`
# is <60 days old for that product, or re-verify against docs.redhat.com first.
#
# Primary source: live OLM packagemanifests on a build cluster, queried 2026-07-08.
# Cross-checks: docs.redhat.com / developers.redhat.com / access.redhat.com.
#
# This top-level date deliberately stays at 2026-07-08 even though `ocp:` was re-verified on
# 2026-07-29. It covers ALL 37 attributes (40 -> 37 after the same-day 81bcf79 dead-pin removal),
# and only OCP was re-read from a live cluster that day —
# moving it would silently claim the operator versions below had been re-checked too. Each product
# carries its own `verified`, and that is the one to trust.
verified: 2026-07-08

ocp:
  channel: stable-4.22
  version: "4.22.6"           # MINIMUM, not a cap — newer patch/minor on other clusters is expected and fine (owner ruling 2026-07-31, see notes).
  eus_line: "4.22"          # 4.22 = EUS (even-numbered, 24-mo). See eus_verified below.
  verified: 2026-07-31
  eus_verified: 2026-07-08  # NOT re-checked on 2026-07-31 — see notes. Re-verify before quoting support dates.
  source: access.redhat.com/support/policy/updates/openshift
  # 2026-07-29: the workshop now TARGETS 4.22, an owner decision. The RHDP cluster had moved to 4.22.5
  # while this file still said 4.21.22, and the two must agree before any console path is grounded:
  # nav DOES change between minors (4.22 carries `Ecosystem` and `Favorites`, which 4.21 does not), so
  # grounding 4.22 screens into pages claiming 4.21 would have produced confidently-wrong instructions
  # rather than merely unverified ones. 195 rendered occurrences of {ocp_version} rode on this.
  #
  # 2026-07-31 RE-GROUND: two clusters existed this session — cluster 1 (4.21.25, a minor BEHIND) was
  # mid-teardown and is NOT a grounding source; cluster 2 (the survivor, and the one content is
  # grounded on) reads 4.22.6 live (`oc get clusterversion version -o jsonpath='{.status.desired.version}'`,
  # read-only). Bumped from the previously-recorded 4.22.5. Per owner ruling 2026-07-31 (the ADR-0007
  # Service Mesh pin was judged WRONG for the same reason): record what was grounded on plus a MINIMUM,
  # never a maximum/cap — newer versions are expected on clusters this project does not control, and
  # content must not be re-downgraded to chase an older cluster.
  #
  # WHAT WAS VERIFIED TODAY, and what was not. version+channel: read live from cluster 2
  # (`oc get clusterversion` -> 4.22.6, channel stable-4.22). eus_line: NOT re-checked against the
  # support policy — it is carried over from this file's own 2026-07-08 note ("4.21 is NOT EUS; 4.22 is
  # next EUS") plus the fact that 4.22 has now shipped. That inference is sound but it is an inference,
  # so it keeps its own older eus_verified date rather than borrowing today's. Re-verify at
  # access.redhat.com before any content quotes an EUS support window.
  notes: Targets 4.22 (EUS line). Grounding cluster (cluster 2) runs 4.22.6 (live, read-only, 2026-07-31). Minimum, not a cap.
  entitlement: OCP

