    ...template.spec.terminationGracePeriodSeconds + containers.lifecycle.preStop; node/machineset/daemonset inventory;
    docs.redhat.com OCP 4.20 Nodes "Controlling pod placement onto nodes (scheduling)" + pod topology spread + pod disruption budget
  notes: "All scheduling primitives are core-GA: nodeSelector, node/pod (anti)affinity, topologySpreadConstraints, taints+tolerations, Deployment strategy (RollingUpdate maxSurge/maxUnavailable vs Recreate), PodDisruptionBudget (policy/v1), DaemonSet (apps/v1), graceful shutdown (terminationGracePeriodSeconds + preStop + SIGTERM)."
