  verified: 2026-07-08
  source: developers.redhat.com/blog/2026/06/26/whats-new-openshift-gitops-121
  notes: >
    Argo Rollouts (RolloutManager + Rollout CRDs present on cluster) GA since GitOps 1.13.
    Argo CD Image Updater and Argo CD CLI now GA in 1.21. GitOps Console Plugin = Tech Preview in 1.21.
    Rollouts UI extension: ArgoCD CR field spec.server.enableRolloutsUI (verified live against the
    argocds.argoproj.io v1beta1 CRD, csv v1.21.1, 2026-07-31; confirmed against Red Hat docs section
    "Enabling Argo Rollouts UI on an Argo CD instance"). The extension image is digest-pinned by the
    operator itself (env ARGOCD_EXTENSION_IMAGE on the CSV) -- no separate version to track here.
    KNOWN GAP as of csv v1.21.1 (live-tested 2026-07-31, not yet reported upstream): the field does
    populate /tmp/extensions on the server pod, but argocd-server does not serve it at any of the
    three URL conventions tried (ticket-assumed .../resources/argo-rollouts/ui/extensions.js, the
    literal on-disk path .../resources/extension-Rollout.js/extensions-Rollout.js, and the
    <group>/<kind> pattern .../argoproj.io/Rollout/ui/extensions.js from argoproj/argo-cd#7454) --
    all 404, checked both via the route and via curl inside the pod against localhost:8080. No known
    additional supported field closes this; spec.cmdParams on this CRD only allowlists
    controller.resource.health.persist and applicationsetcontroller.enable.tokenref.strict.mode, so
    server.enable.proxy.extension (the classic proxy-extension flag) cannot be set declaratively
    either, and a diagnostic manual test of that key made no difference. Someone with an Argo CD
    login should confirm in-browser before relying on this for content.
  entitlement: OCP

