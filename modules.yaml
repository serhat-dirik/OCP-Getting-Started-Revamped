# modules.yaml — ORDERED module catalog and the SINGLE SOURCE OF TRUTH for module order.
#
# Position in this list IS the module's number (1-based): the first entry is module 1,
# the eighth is module 8, and so on. Numbers are DECOUPLED from slugs (owner decision
# 2026-07-17) — a slug never encodes its number, so a module keeps its identity when the
# catalog is reordered. To reorder or renumber: move entries here, then reorder the nav
# lines to match; tools/check-module-order.sh guards that the two stay in sync. Everything
# downstream keys off the slug (content dirs, entry states, verify scripts, Argo app names),
# so it follows automatically — with TWO exceptions Helm cannot read this file for (a chart
# sees only its own root): the workshop-config chart's per-user Argo RBAC needs the slug list,
# and the helm/bootstrap FSC chart needs the slug->stacks map below. Both are GENERATED into
# the chart — after any add/remove/reorder/stacks edit here, run:
#   tools/gen-module-slugs.sh    (refreshes moduleSlugs in gitops/workshop-config/values.yaml)
#   tools/gen-module-stacks.sh   (refreshes moduleCatalog in helm/bootstrap/values.yaml)
# CI drift-gates both, like versions.yaml -> tools/gen-attributes.sh.
#
# Consumers: tools/ws/ws (ws start m08 -> position 8 -> slug; ws start <slug> direct),
# tools/slides/build-deck.py (deck order), tools/check-module-order.sh (nav-order guard),
# bootstrap/install.sh + helm/bootstrap (module->stack derivation, see `stacks:` below).
#
# `title` is the module's display name (no number). Entitlement tags ([ADS]/[ADD-ON]) and
# the nav track groupings live in the nav/index, not here.
#
# `stacks:` — the platform-portfolio stacks a module's LAB actually depends on, grounded in
# each module's entry state (gitops/entry-states/<slug>/) and content, NOT guessed. This drives
# the deployer-facing `modules_disabled` control (bootstrap/vars.yaml): the installer enables the
# UNION of stacks required by the ENABLED modules, and a stack needed only by disabled modules is
# never installed. Modules with no extra dependency carry `stacks: []`.
#
#   THREE stacks are ALWAYS installed and are therefore never listed here:
#     • core-devtools — Pipelines, GitOps operator, Dev Spaces, Web Terminal, monitoring (UWM),
#                       Gitea (git-localize anchor), cert-manager, Gateway API.
#     • batch         — Red Hat build of Kueue + KEDA. Baseline: workshop-config ships per-user
#                       Kueue queues unconditionally, and M06 teaches Kueue.
#     • progressive-delivery — Argo Rollouts. Baseline: M11 is core catalog and its canary/
#                       rollback beats are dead without the controller.
#
#   OpenShift Lightspeed (the `ai-assist` stack) is NOT a module dependency and is NOT listed
#   here: it is governed by the MaaS credential (auto-skipped when no endpoint/key is set — see
#   bootstrap/vars.yaml `lightspeed`). Modules that USE a model endpoint (jobs-batch-kueue batch
#   inference, app-modernization's MTA Lightspeed, agentic-ai, ai-assisted-development) reach the
#   MaaS endpoint directly via credentials their entry state materializes — they do not require the
#   Lightspeed operator, so they keep `stacks: []`.
#
#   `trust-demo` (RHTPA) is a DEMO-flavor add-on only, not required by any module's core lab, so no
#   module lists it; enable it as an expert override if you present the M09 demo flavor.
#
# Write stacks lists out explicitly (plain lists only — no ranges).
modules:
  - slug: platform-orientation
    title: "Platform Orientation & First App"
    stacks: []   # foundations: deploy/scale/heal on baseline core-devtools only
  - slug: build-deliver
    title: "Ways to Build & Deliver Apps"
    stacks: []   # image/S2I/Dockerfile builds + DB + polyglot svc — all baseline
  - slug: devspaces-inner-loop
    title: "Dev Spaces & the Inner Loop"
    stacks: []   # Dev Spaces ships in baseline core-devtools
  - slug: config-multienv
    title: "Config, Secrets & Multi-Environment"
    stacks: []   # ConfigMaps/Secrets/probes/promotion — all baseline
  - slug: storage-stateful
    title: "Storage & Stateful Apps"
    stacks: []   # PVC/StorageClass/StatefulSet — all baseline
  - slug: jobs-batch-kueue
    title: "Jobs, Batch & Queued Workloads"
    stacks: []   # Kueue is baseline (batch); AI batch inference hits MaaS directly, no stack
  - slug: pipelines-fundamentals
    title: "Pipelines Fundamentals & Task Libraries"
    stacks: []   # Tekton + Pipelines-as-Code ship in baseline core-devtools
  - slug: app-security-testing
    title: "Application Security Testing (SAST · SCA · DAST)"
    stacks: [appsec, trust]   # SAST=SonarQube (appsec); image-scan gate + Chains signing=RHACS/RHTAS (trust)
  - slug: trusted-supply-chain
    title: "Trusted Software Supply Chain"
    stacks: [trust]   # RHACS + Trusted Artifact Signer (RHTAS): sign/attest/SBOM/admission
  - slug: gitops-fundamentals
    title: "GitOps Fundamentals"
    stacks: []   # Argo CD ships with the baseline GitOps operator
  - slug: gitops-at-scale
    title: "GitOps at Scale & Progressive Delivery"
    stacks: []   # Argo Rollouts is baseline (progressive-delivery)
  - slug: developer-hub-golden-paths
    title: "Developer Hub & Golden Paths"
    stacks: [portal]   # Red Hat Developer Hub (RHDH)
  - slug: observability-health-scale
    title: "Observability, Health & Scale"
    stacks: [observability]   # COO + Loki + Tempo + OpenTelemetry (metrics/logs/traces)
  - slug: securing-apps-keycloak
    title: "Securing Apps with Keycloak"
    stacks: [auth]   # Red Hat build of Keycloak + per-user realms
  - slug: multi-tenancy-workload-security
    title: "Multi-Tenancy & Workload Security"
    stacks: []   # RBAC/quotas/SCC/PodSecurity + a read-only tour of the live OAuth config (no auth stack required)
  - slug: networking-dev-devops
    title: "Networking for Dev & DevOps"
    stacks: []   # Services/Routes/Gateway API (baseline) + NetworkPolicy + UDN (OVN) — mesh is a later module
  - slug: deployment-targets-scheduling
    title: "Deployment Targets & Scheduling"
    stacks: []   # node selectors/taints/affinity/topology-spread/PDB — all baseline
  - slug: registry-images-catalog-governance
    title: "Registry, Images & Catalog Governance"
    stacks: []   # internal registry/ImageStreams/mirroring/policy — all baseline
  - slug: service-mesh-advanced-gateways
    title: "Service Mesh 3 & Advanced Gateways"
    stacks: [mesh]   # OSSM 3 (Sail/Istio) + Kiali
  - slug: serverless-zero-to-hero
    title: "Serverless Zero-to-Hero"
    stacks: [serverless]   # Knative Serving
  - slug: eventing-deep-dive
    title: "Eventing Deep-Dive & Serverless Workflows"
    stacks: [serverless]   # Knative Eventing + Serverless Logic (SonataFlow) ship in the serverless stack
  - slug: resilience-multicluster-dr
    title: "Resilience, Multi-Cluster & DR"
    stacks: [resilience, mesh]   # OADP + Service Interconnect (resilience); app-level failover runs over OSSM 3 (mesh) per this module's design
  - slug: app-modernization
    title: "Application Modernization (MTA + Lightspeed)"
    stacks: [mta]   # Migration Toolkit for Applications; MTA Developer Lightspeed uses MaaS directly (no ai-assist stack)
  - slug: agentic-ai
    title: "Agentic AI on OpenShift"
    stacks: []   # MaaS endpoint + on-cluster MCP servers, materialized by the entry state — no platform stack
  - slug: ai-assisted-development
    title: "AI-Assisted Development on OpenShift"
    stacks: []   # coding assistant via a least-privilege MCP ServiceAccount + MaaS — no platform stack
  - slug: packaging-distributing
    title: "Packaging & Distributing Your App"
    stacks: []   # Helm/OCI + OLM bundle dissection — all baseline
