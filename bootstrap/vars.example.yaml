# Workshop bootstrap inputs. Copy to vars.yaml (gitignored) and fill in.
# bootstrap/install.sh reads THIS file; secrets live only here, never in git.
# This file is the primary interface — everything a deployer needs is documented inline below.

# Number of attendee users to provision (user1 .. userN).
# Typical workshop sizes are 12 (small), 20 (normal) and 30 (large) — check INSTALL.md
# section 2 before choosing, because the cohort size decides how many nodes you need.
# The 5 below is a deliberately small default for a first install or a test cluster; you can
# grow or shrink a running cluster later with `tools/ws/ws scale-users N`.
users: 5

# Ingress apps domain (e.g. apps.cluster-x.example.com). Leave "" to auto-detect from the cluster.
cluster_domain: ""

# ── Which modules to deliver ──────────────────────────────────────────────────────────────
# Leave modules_disabled empty and you get the WHOLE workshop: every module runs and the installer
# turns on exactly the platform stacks those modules need (Service Mesh, Serverless, Developer Hub,
# RHACS/signing, Keycloak, OADP, MTA, observability, …). You do NOT pick stacks — you pick modules.
#
# To run a SHORTER workshop, list the modules you are NOT teaching here and they disappear two ways:
#   • hidden from the attendee cockpit (nav + module library), and
#   • any platform stack needed ONLY by a disabled module is not installed (lighter, faster cluster).
# A stack shared by several modules stays as long as ONE of them is still enabled.
#
# Entries are module numbers (mNN, e.g. m13) or slugs (e.g. observability-health-scale). Plain list
# only — write ranges out (m20, m21, m22 — not m20..m22). Module numbers are in modules.yaml.
# Example — foundations + delivery only, drop the advanced electives:
#   modules_disabled: [m19, m20, m21, m22, m23, m24, m25]
modules_disabled: []

# ── AI / OpenShift Lightspeed ─────────────────────────────────────────────────────────────
# Models-as-a-Service (MaaS) LLM endpoint. endpoint + model are NOT secrets; api_key IS. Set all three
# to give attendees OpenShift Lightspeed and the AI beats in the AI/modernization modules. LEAVE
# api_key as CHANGEME (or endpoint blank) and the installer AUTO-SKIPS Lightspeed — no
# `lightspeed: false` needed on a cluster without an LLM, and the AI beats degrade to an explicit
# "AI path unavailable" state rather than failing.
#
# THERE IS NO DEFAULT MODEL, and `model` below is not a suggestion to edit — it is a REQUIRED input
# with a placeholder in it. You choose the model before you deploy and name it here, together with the
# key that is scoped to it. MaaS virtual keys are MODEL-SCOPED: a name your key does not cover is not
# a cosmetic mismatch, it is an HTTP 401 key_model_access_denied that surfaces INSIDE the AI modules
# (agentic-ai, ai-assisted-development, app-modernization, jobs-batch-kueue) at workshop time — long
# after this installer said "complete". Two clusters this workshop has run on had keys scoped to
# OPPOSITE models, so no value shipped in this file could be right for your deployment; a plausible-
# looking wrong one is worse than a placeholder, because nobody questions a real-looking model id.
# The installer never guesses: if you leave `model` empty it ASKS your endpoint what it serves (GET
# /v1/models) and uses that answer, and if you set it, it checks your value against the same list and
# tells you when it is not there. Pin it explicitly whenever your endpoint offers more than one model
# — only your key's scope decides which of them actually answers, and the endpoint list does not.
#
# WHERE IT LANDS: whenever api_key is set, the installer writes ogsr-system/ogsr-maas-credentials
# (api_key + model + endpoint together) — the workshop's OWN credential, which every AI module
# prefers. It is written even on a cluster where OpenShift Lightspeed was already installed and
# adopted; without it those modules fall back to the adopted assistant's provider credential, which
# on an Azure-OpenAI wiring is a token for a different provider entirely (it staged green and
# returned 401 for every attendee — a live cluster, 2026-07-29). The installer VALIDATES api_key +
# endpoint against the live endpoint before it mutates anything, so a bad key fails here, loudly,
# instead of inside the AI modules at workshop time.
maas:
  endpoint: https://<your-maas-endpoint>/v1   # OpenAI-compatible base, ends in /v1
  api_key: CHANGEME
  # REQUIRED — replace this placeholder with your model, or set "" to have the installer read the
  # model from your endpoint. The placeholder itself is never used as a model name (it is ignored
  # exactly like an empty value, loudly), so an unedited copy of this file cannot become a 401.
  model: <the-model-your-api_key-is-scoped-to>

# Shared password for ALL workshop users (console/CLI htpasswd login + Gitea account). This is a
# WORKSHOP password by design: one simple, memorable, SHARED value handed to every attendee — the
# users are throwaway, so it is NOT a real credential and needn't be secure. Keep it simple (e.g.
# "openshift"). Set "CHANGEME" to have the installer mint a random one and record it in
# .credentials.local.txt.
workshop_user_password: openshift

# ── Where the workshop's own source comes from ────────────────────────────────────────────
# Every Argo CD Application, the in-cluster Gitea mirror and the content builds pull from HERE.
# The upstream project is only the default: point these at your fork, an internal GitLab, or any
# other git host to run the workshop from your own copy. The installer checks before it creates a
# single Application that the repo is reachable, that repo_revision exists there, and that it
# actually carries platform-portfolio/ — a typo fails in seconds with the URL in the message.
#
# Two-phase sourcing, automatic: bootstrap installs from repo_url (it has to — that is what builds
# the in-cluster mirror), then re-points the platform stacks at the Gitea mirror once the mirror
# serves the same commit and Argo can verify its TLS. From then on reconciliation is cluster-local
# and `ws git-refresh` is the single content-update path. If either check fails the stacks simply
# stay on repo_url, which is a perfectly good configuration — the installer says which and why.
#
# A private repo is NOT supported here: nothing in the install supplies git credentials to Argo.
repo_url: https://github.com/serhat-dirik/OCP-Getting-Started-Revamped
repo_revision: main
# revision: main   # deprecated alias for repo_revision, still honoured for older vars.yaml files

# ── Expert overrides (rarely needed — most deliveries never set these) ─────────────────────
# lightspeed: false        # hard-off even if a MaaS key is set (otherwise auto: on iff MaaS present)
# console_plugins: false   # ON by default (Pipelines/GitOps/ACS console links); set false to leave a
#                          # shared cluster's console untouched. Merge is always append-if-absent and
#                          # only for plugins whose operator is present; uninstall removes only what it added.
# Force a platform stack ON even when no enabled module needs it (e.g. a PoC). Additive only — to
# REMOVE a stack, disable the module(s) that need it above, don't set one of these false:
# auth: true               # Red Hat build of Keycloak
# mesh: true               # OSSM 3 + Kiali
# serverless: true         # OpenShift Serverless (Knative)
# mta: true                # Migration Toolkit for Applications
# observability: true      # COO + Loki + Tempo + OTel
# appsec: true             # SonarQube
# portal: true             # Red Hat Developer Hub
# trust: true              # RHACS + Trusted Artifact Signer
# resilience: true         # OADP + Service Interconnect (PREREQ: ODF/MCG for the S3 target)
# trust_demo: true         # RHTPA — Trusted Profile Analyzer, the M09 demo-flavor add-on (no module needs it)
