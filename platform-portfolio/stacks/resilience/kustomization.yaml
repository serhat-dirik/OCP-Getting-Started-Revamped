# resilience stack — the platform prerequisite of resilience-multicluster-dr: Red Hat Service Interconnect
# (Skupper v2) for its [ADD-ON] cross-site section. Shared single install, never per-user; the resilient
# claims stack + {user}-site-b are the workshop layer / entry state on top. The module's core labs (in-site
# resiliency, cross-site failover) run over the `mesh` stack.
# OADP left this stack on 2026-11-13 for the `backup` stack: no module uses it, and its ODF prerequisite
# held pp-oadp Missing (and `adm ready` red) on every cluster without ODF.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # [ADD-ON] cross-site connectivity (RHSI / Skupper v2). Both workshop clusters carry skupper-operator
  # channel `stable-2` (-> v2.2.1-rh-1), so this installs cleanly. On a PoC cluster whose catalog lacks
  # stable-2 (bare stable / stable-1.x = legacy Skupper v1, CR+CLI-incompatible with v2), do not install
  # this stack — no core lab beat depends on RHSI.
  # Verify a cluster first — bare-name `get packagemanifest` is UNRELIABLE when >1 catalog carries the
  # package (it silently returns one, hiding redhat-operators behind community). Enumerate with a selector:
  #   oc get packagemanifests -n openshift-marketplace --field-selector=metadata.name=skupper-operator \
  #     -o json | jq -r '.items[]|select(.status.catalogSource=="redhat-operators").status.defaultChannel'   # -> stable-2
  - apps/service-interconnect.yaml
# Non-invasive delivery (Wave 1): stamp the child pp-* Applications so uninstall can target them.
labels:
  - pairs:
      workshop.redhat.com/owner: ogsr
    includeSelectors: false
