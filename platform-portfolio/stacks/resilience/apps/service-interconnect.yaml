# Wave 0: Red Hat Service Interconnect (Skupper v2) operator — the ADD-ON connectivity layer for
# resilience-multicluster-dr's OPTIONAL cross-site section, and the only child of the resilience stack.
# Needs a catalog that offers channel stable-2 (see stacks/resilience/kustomization.yaml). No core lab
# beat depends on it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pp-service-interconnect
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    portfolio.redhat.com/component: service-interconnect
spec:
  project: ogsr-platform
  source:
    # Placeholder: the parent pp-<stack> Application rewrites repoURL/targetRevision/project via
    # kustomize patches, so the source is whatever --repo-url the install was given (external repo
    # at bootstrap, in-cluster Gitea mirror after the phase-2 flip). An .invalid host means a
    # missing parent patch fails loudly instead of syncing from an unconfigured repo.
    repoURL: https://set-by-parent-application.invalid
    targetRevision: main
    path: platform-portfolio/components/service-interconnect
  destination:
    server: https://kubernetes.default.svc
    namespace: skupper
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 15
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
