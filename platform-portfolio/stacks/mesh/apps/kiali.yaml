# Wave 1: the Kiali mesh console — after service-mesh (wave 0), so istiod exists in istio-system when the
# Kiali CR reconciles. Its workload lands in istio-system; the operator lives in openshift-kiali-operator.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pp-kiali
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    portfolio.redhat.com/component: kiali
spec:
  project: ogsr-platform
  source:
    # Placeholder: the parent pp-<stack> Application rewrites repoURL/targetRevision/project via
    # kustomize patches, so the source is whatever --repo-url the install was given (external repo
    # at bootstrap, in-cluster Gitea mirror after the phase-2 flip). An .invalid host means a
    # missing parent patch fails loudly instead of syncing from an unconfigured repo.
    repoURL: https://set-by-parent-application.invalid
    targetRevision: main
    path: platform-portfolio/components/kiali
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-kiali-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 15
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
