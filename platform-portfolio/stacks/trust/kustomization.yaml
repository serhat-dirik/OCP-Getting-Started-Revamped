# trust stack — supply-chain security prerequisites. app-of-apps: RHACS (scan gate + admission) +
# trust-signing (Tekton Chains cosign key) + ZTWIM (SPIFFE workload identity) + RHTAS (Fulcio trusts
# that identity: keyless signing + Rekor). App-waves order CREATION (rhacs 0 -> ztwim 1 -> rhtas 3):
# child Applications carry no health, so anything that needs another app READY waits for it in its
# own hook. RHTPA is a separate OPTIONAL trust-demo stack. See README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - apps/rhacs-operator.yaml
  - apps/trust-signing.yaml
  - apps/rhacs-central.yaml
  - apps/zero-trust-workload-identity-operator.yaml
  - apps/workload-identity.yaml
  - apps/rhtas.yaml
# Non-invasive delivery (Wave 1): stamp the child pp-* Applications so uninstall can target them.
labels:
  - pairs:
      workshop.redhat.com/owner: ogsr
    includeSelectors: false
