# Wave 1: Zero Trust Workload Identity Manager OPERATOR (SPIRE). Operator-only, so an adopting
# cluster skips it. Shares wave 1 with rhacs-central, which installs no operator.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pp-zero-trust-workload-identity-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    portfolio.redhat.com/component: zero-trust-workload-identity-operator
spec:
  project: ogsr-platform
  source:
    # Placeholder: the parent pp-<stack> Application rewrites repoURL/targetRevision/project via
    # kustomize patches, so the source is whatever --repo-url the install was given (external repo
    # at bootstrap, in-cluster Gitea mirror after the phase-2 flip). An .invalid host means a
    # missing parent patch fails loudly instead of syncing from an unconfigured repo.
    repoURL: https://set-by-parent-application.invalid
    targetRevision: main
    path: platform-portfolio/components/zero-trust-workload-identity-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: zero-trust-workload-identity-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 15
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
