# Wave 3: RHTAS operator + Securesign (the sigstore stack: Fulcio, Rekor, TUF, TSA) + the Fulcio
# SPIFFE-issuer hook. Created after the ZTWIM apps (waves 1-2); the hook does not rely on that order.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pp-rhtas
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    portfolio.redhat.com/component: rhtas
spec:
  project: ogsr-platform
  source:
    # Placeholder: the parent pp-<stack> Application rewrites repoURL/targetRevision/project via
    # kustomize patches, so the source is whatever --repo-url the install was given (external repo
    # at bootstrap, in-cluster Gitea mirror after the phase-2 flip). An .invalid host means a
    # missing parent patch fails loudly instead of syncing from an unconfigured repo.
    repoURL: https://set-by-parent-application.invalid
    targetRevision: main
    path: platform-portfolio/components/rhtas
  destination:
    server: https://kubernetes.default.svc
    namespace: trusted-artifact-signer
  # Fulcio's issuer list and trustedCA are set by the fulcio-spiffe-issuer hook (cluster-specific:
  # the SPIFFE issuer and trust domain), so Argo leaves both alone. RespectIgnoreDifferences makes a
  # re-sync keep the live values instead of re-applying the manifest's default issuer.
  ignoreDifferences:
    - group: rhtas.redhat.com
      kind: Securesign
      name: securesign
      namespace: trusted-artifact-signer
      jqPathExpressions:
        - .spec.fulcio.config.oidcIssuers
        - .spec.fulcio.trustedCA
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 15
      backoff: {duration: 20s, factor: 2, maxDuration: 5m}
