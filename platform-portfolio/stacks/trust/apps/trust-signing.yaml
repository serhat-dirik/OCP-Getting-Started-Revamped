# Wave 0: give Tekton Chains a cosign key (independent of the operators — only needs openshift-pipelines
# from core-devtools). Populates the operator-owned signing-secrets via a hook Job (idempotent).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pp-trust-signing
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    portfolio.redhat.com/component: trust-signing
spec:
  project: ogsr-platform
  source:
    # Placeholder: the parent pp-<stack> Application rewrites repoURL/targetRevision/project via
    # kustomize patches, so the source is whatever --repo-url the install was given (external repo
    # at bootstrap, in-cluster Gitea mirror after the phase-2 flip). An .invalid host means a
    # missing parent patch fails loudly instead of syncing from an unconfigured repo.
    repoURL: https://set-by-parent-application.invalid
    targetRevision: main
    path: platform-portfolio/components/trust-signing
  destination:
    server: https://kubernetes.default.svc
    namespace: trust-signing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 15
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
