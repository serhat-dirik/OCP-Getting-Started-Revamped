# Wave 2: SPIFFE workload identity — the hook that creates the ZTWIM operands (or adopts the
# cluster's own) and lets Fulcio trust their OIDC issuer. Its hook waits for the operator's CRDs
# itself: child Applications carry no health, so this wave orders creation, not readiness.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pp-workload-identity
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    portfolio.redhat.com/component: workload-identity
spec:
  project: ogsr-platform
  source:
    # Placeholder: the parent pp-<stack> Application rewrites repoURL/targetRevision/project via
    # kustomize patches, so the source is whatever --repo-url the install was given (external repo
    # at bootstrap, in-cluster Gitea mirror after the phase-2 flip). An .invalid host means a
    # missing parent patch fails loudly instead of syncing from an unconfigured repo.
    repoURL: https://set-by-parent-application.invalid
    targetRevision: main
    path: platform-portfolio/components/workload-identity
  destination:
    server: https://kubernetes.default.svc
    namespace: ogsr-workload-identity
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 15
      backoff: {duration: 20s, factor: 2, maxDuration: 5m}
