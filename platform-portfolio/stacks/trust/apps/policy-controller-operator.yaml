# Wave 4: RHTAS policy-controller OPERATOR (Sigstore admission). Operator-only, so an adopting
# cluster skips it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pp-policy-controller-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    portfolio.redhat.com/component: policy-controller-operator
spec:
  project: ogsr-platform
  source:
    # Placeholder: the parent pp-<stack> Application rewrites repoURL/targetRevision/project via
    # kustomize patches, so the source is whatever --repo-url the install was given (external repo
    # at bootstrap, in-cluster Gitea mirror after the phase-2 flip). An .invalid host means a
    # missing parent patch fails loudly instead of syncing from an unconfigured repo.
    repoURL: https://set-by-parent-application.invalid
    targetRevision: main
    path: platform-portfolio/components/policy-controller-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-policy-controller
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 15
      backoff: {duration: 20s, factor: 2, maxDuration: 5m}
