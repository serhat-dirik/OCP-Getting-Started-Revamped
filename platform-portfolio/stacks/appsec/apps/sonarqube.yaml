# The SonarQube shared service (SAST) for M08 — DevSecOps. One self-contained Application: the
# SonarSource Community Build chart (kustomize helmCharts inflation), its external PostgreSQL, an edge
# Route, and the bootstrap hook Job (admin-password change + CI-token mint), all wave-ordered inside
# this app (Namespace -2 -> DB/RBAC -1 -> chart+Route 0 -> bootstrap hook 1). Same single-app shape as
# pp-rhacs-central. repoURL is the monorepo (rewritten by the stack template to the install --repo-url).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    # App-wave 0 = self-contained component: no operator, no operand Application depends on it.
    argocd.argoproj.io/sync-wave: "0"
  name: pp-sonarqube
  namespace: openshift-gitops
  labels:
    portfolio.redhat.com/component: sonarqube
spec:
  project: ogsr-platform
  source:
    # Placeholder: the parent pp-<stack> Application rewrites repoURL/targetRevision/project via
    # kustomize patches, so the source is whatever --repo-url the install was given (external repo
    # at bootstrap, in-cluster Gitea mirror after the phase-2 flip). An .invalid host means a
    # missing parent patch fails loudly instead of syncing from an unconfigured repo.
    repoURL: https://set-by-parent-application.invalid
    targetRevision: main
    path: platform-portfolio/components/sonarqube
  destination:
    server: https://kubernetes.default.svc
    namespace: sonarqube
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 15
      backoff: {duration: 20s, factor: 2, maxDuration: 5m}
