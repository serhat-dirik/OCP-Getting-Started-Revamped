# backup stack — OADP (Velero) backing up to an in-cluster NooBaa S3 bucket. PREREQ: ODF / MCG, which
# provides the ObjectBucketClaim the backup target is made of; without it pp-oadp stays OutOfSync/Missing.
# No workshop module needs it, so bootstrap/install.sh never installs it: it is a PoC stack
# (argocd-bootstrap/install.sh --stacks backup, on an OCP 4.20+ cluster with ODF). See README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - apps/oadp.yaml
# Non-invasive delivery (Wave 1): stamp the child pp-* Applications so uninstall can target them.
labels:
  - pairs:
      workshop.redhat.com/owner: ogsr
    includeSelectors: false
