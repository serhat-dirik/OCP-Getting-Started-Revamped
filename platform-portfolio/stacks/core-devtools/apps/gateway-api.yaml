# Wave 2: activate the OpenShift Gateway API implementation (GatewayClass openshift-default) so
# Gateway/HTTPRoute exposure is available cluster-wide (M16+). No operator to install — the ingress
# operator installs istiod when the GatewayClass appears; this app just declares the CR GitOps-natively.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pp-gateway-api
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    portfolio.redhat.com/component: gateway-api
spec:
  project: ogsr-platform
  source:
    # Placeholder: the parent pp-<stack> Application rewrites repoURL/targetRevision/project via
    # kustomize patches, so the source is whatever --repo-url the install was given (external repo
    # at bootstrap, in-cluster Gitea mirror after the phase-2 flip). An .invalid host means a
    # missing parent patch fails loudly instead of syncing from an unconfigured repo.
    repoURL: https://set-by-parent-application.invalid
    targetRevision: main
    path: platform-portfolio/components/gateway-api
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 15
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
