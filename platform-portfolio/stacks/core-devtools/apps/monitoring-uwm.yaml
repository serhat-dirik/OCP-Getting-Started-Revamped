# Wave 2: enable user-workload monitoring — app metrics are curriculum (M01 logs/metrics, M13).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pp-monitoring-uwm
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    portfolio.redhat.com/component: monitoring-uwm
spec:
  project: ogsr-platform
  source:
    # Placeholder: the parent pp-<stack> Application rewrites repoURL/targetRevision/project via
    # kustomize patches, so the source is whatever --repo-url the install was given (external repo
    # at bootstrap, in-cluster Gitea mirror after the phase-2 flip). An .invalid host means a
    # missing parent patch fails loudly instead of syncing from an unconfigured repo.
    repoURL: https://set-by-parent-application.invalid
    targetRevision: main
    path: platform-portfolio/components/monitoring-uwm
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-monitoring
  syncPolicy:
    automated:
      prune: false   # never prune the shared monitoring config namespace
      selfHeal: true
    syncOptions:
      - ServerSideApply=true   # cluster-monitoring-config may pre-exist on managed clusters (RHDP)
    retry:
      limit: 15
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
