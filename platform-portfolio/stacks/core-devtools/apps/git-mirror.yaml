# Wave 1: make the in-cluster Gitea pull-mirror the upstream repos (git-localize, D15).
# The job waits for Gitea itself, so wave ordering is belt-and-braces, not a hard dependency.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pp-git-mirror
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    portfolio.redhat.com/component: git-mirror
spec:
  project: ogsr-platform
  source:
    # Placeholder: the parent pp-<stack> Application rewrites repoURL/targetRevision/project via
    # kustomize patches, so the source is whatever --repo-url the install was given (external repo
    # at bootstrap, in-cluster Gitea mirror after the phase-2 flip). An .invalid host means a
    # missing parent patch fails loudly instead of syncing from an unconfigured repo.
    repoURL: https://set-by-parent-application.invalid
    targetRevision: main
    path: platform-portfolio/components/git-mirror
  destination:
    server: https://kubernetes.default.svc
    namespace: ogsr-gitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 15
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
