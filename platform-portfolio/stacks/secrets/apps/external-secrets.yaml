# Wave 0: External Secrets Operator + its singleton ExternalSecretsConfig + the egress NetworkPolicy
# that lets the ESO controller reach a SecretStore backend in a tenant namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pp-external-secrets
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    portfolio.redhat.com/component: external-secrets
spec:
  project: ogsr-platform
  source:
    # Placeholder: the parent pp-<stack> Application rewrites repoURL/targetRevision/project via
    # kustomize patches, so the source is whatever --repo-url the install was given (external repo
    # at bootstrap, in-cluster Gitea mirror after the phase-2 flip). An .invalid host means a
    # missing parent patch fails loudly instead of syncing from an unconfigured repo.
    repoURL: https://set-by-parent-application.invalid
    targetRevision: main
    path: platform-portfolio/components/external-secrets
  destination:
    server: https://kubernetes.default.svc
    # The OPERATOR namespace. No CreateNamespace=true: the component owns external-secrets-operator
    # (namespace.yaml, wave -2). The NetworkPolicy carries its own metadata.namespace, so it lands in
    # the operand namespace regardless of this default — see README § AppProject destination.
    namespace: external-secrets-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Not decoration: on a cold cluster the NetworkPolicy (wave 3) targets `external-secrets`, a
    # namespace the OPERATOR creates while reconciling ExternalSecretsConfig (wave 2). The first
    # attempts can legitimately fail with "namespace not found" for a minute or two. Retry with
    # backoff is how that converges; a sleep in a script is how it does not.
    retry:
      limit: 15
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
