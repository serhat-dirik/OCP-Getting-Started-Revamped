# secrets stack — the platform prerequisite for the `platform-guardrails` module. app-of-apps: one
# child today (External Secrets Operator). The secret BACKEND is deliberately not here — each
# attendee gets their own OpenBao from the entry state, so there is no shared vault to install.
# See README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - apps/external-secrets.yaml
# Non-invasive delivery (Wave 1): stamp the child pp-* Applications so uninstall can target them.
labels:
  - pairs:
      workshop.redhat.com/owner: ogsr
    includeSelectors: false
