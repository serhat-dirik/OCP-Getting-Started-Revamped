# Wave 1: the Backstage instance (Red Hat Developer Hub) — app-config, dynamic plugins, and the
# `developer-hub` Backstage CR. Runs after the operator (wave 0) so the CRD exists.
# SkipDryRunOnMissingResource lets the CR apply before the operator has finished registering the
# CRD schema on a cold cluster (the wave already orders them, this covers the race window).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pp-rhdh
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    portfolio.redhat.com/component: rhdh
spec:
  project: ogsr-platform
  source:
    # Placeholder: the parent pp-<stack> Application rewrites repoURL/targetRevision/project via
    # kustomize patches, so the source is whatever --repo-url the install was given (external repo
    # at bootstrap, in-cluster Gitea mirror after the phase-2 flip). An .invalid host means a
    # missing parent patch fails loudly instead of syncing from an unconfigured repo.
    repoURL: https://set-by-parent-application.invalid
    targetRevision: main
    path: platform-portfolio/components/rhdh
  destination:
    server: https://kubernetes.default.svc
    namespace: rhdh
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 15
      backoff: {duration: 20s, factor: 2, maxDuration: 5m}
