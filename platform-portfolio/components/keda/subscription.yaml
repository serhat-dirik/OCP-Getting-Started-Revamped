# Custom Metrics Autoscaler (KEDA-based) — event/queue-driven scale (M06 mention, M13/M21 use).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  annotations:
    # Wave 0 = the controller. Its operand (KedaController, wave 2) is deleted first, so the operator
    # is still running to execute the finalizer.
    argocd.argoproj.io/sync-wave: "0"
  name: openshift-custom-metrics-autoscaler-operator
  namespace: openshift-keda
spec:
  channel: stable
  installPlanApproval: Automatic
  name: openshift-custom-metrics-autoscaler-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
