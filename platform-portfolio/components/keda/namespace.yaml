# Suggested namespace of the Custom Metrics Autoscaler (KEDA) operator.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Wave -2 = namespace: created first, deleted LAST, so nothing we own is orphaned inside it.
    argocd.argoproj.io/sync-wave: "-2"
  name: openshift-keda
  labels:
    portfolio.redhat.com/component: keda
