# The operator deploys KEDA only once a KedaController exists (name must be 'keda').
apiVersion: keda.sh/v1alpha1
kind: KedaController
metadata:
  name: keda
  namespace: openshift-keda
  annotations:
    # Wave 2 = operand: deleted FIRST, while the custom-metrics-autoscaler operator is still running to execute its finalizer.
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  watchNamespace: ""
