# All-namespaces OperatorGroup — RHDH supports ONLY AllNamespaces install mode (verified live via
# packagemanifest installModes). Empty spec (no selector, no targetNamespaces) = AllNamespaces, so
# the operator can reconcile a Backstage CR in any namespace (here: `rhdh`). Same shape as the
# rhacs-operator OperatorGroup; one OperatorGroup per namespace is the OLM constraint.
# ONE OperatorGroup PER NAMESPACE, always: with two, OLM fails every CSV in it (TooManyOperatorGroups)
# while the pods keep running, so an operator the org owns breaks silently. argocd-bootstrap/install.sh
# preflights rhdh-operator and refuses to install if it already carries a foreign one. See README § OperatorGroups.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  annotations:
    # Wave 0 = the controller's scope. Deleted after every operand, so OLM still has a group
    # while the RHDH operator runs its finalizers.
    argocd.argoproj.io/sync-wave: "0"
  name: rhdh-operator
  namespace: rhdh-operator
spec:
  upgradeStrategy: Default
