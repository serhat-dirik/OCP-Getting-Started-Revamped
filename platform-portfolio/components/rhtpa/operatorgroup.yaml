# SingleNamespace OperatorGroup targeting rhtpa ONLY — RHTPA is OwnNamespace/SingleNamespace (verified
# live: defaultChannel stable-v1.1). An AllNamespaces OperatorGroup would fail OLM resolution.
# ONE OperatorGroup PER NAMESPACE, always: with two, OLM fails every CSV in it (TooManyOperatorGroups)
# while the pods keep running, so an operator the org owns breaks silently. argocd-bootstrap/install.sh
# preflights rhtpa and refuses to install if it already carries a foreign one. See README § OperatorGroups.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  annotations:
    # Wave 0 = the controller's scope. Deleted after every operand, so OLM still has a group
    # while rhtpa-operator runs its finalizers.
    argocd.argoproj.io/sync-wave: "0"
  name: rhtpa
  namespace: rhtpa
spec:
  targetNamespaces:
    - rhtpa
