# Namespace for Red Hat Trusted Profile Analyzer (RHTPA) — the enterprise SBOM/VEX explorer. INSTALLS
# SingleNamespace (NOT AllNamespaces): the ~12-pod stack + operator live here together.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Wave -2 = namespace: created first, deleted LAST, so nothing we own is orphaned inside it.
    argocd.argoproj.io/sync-wave: "-2"
  name: rhtpa
  labels:
    portfolio.redhat.com/component: rhtpa
