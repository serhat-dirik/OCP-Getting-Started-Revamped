# RHTPA operator (Red Hat Trusted Profile Analyzer) — OPTIONAL, instructor-demo only.
# No spec.channel: OLM resolves the package's defaultChannel on the target cluster, so the install is
# portable across catalog snapshots and a later installer gets the current supported RHTPA.
# This component installs ONLY the operator: the TrustedProfileAnalyzer CR needs an OIDC realm, object
# storage (NooBaa OBC) and Postgres — documented as contracts in README.md, never shipped here.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhtpa-operator
  namespace: rhtpa
  annotations:
    # Wave 0 = the controller. No operand ships with this component.
    # See platform-portfolio/README.md § Sync waves.
    argocd.argoproj.io/sync-wave: "0"
spec:
  installPlanApproval: Automatic
  name: rhtpa-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
