# The Backstage (Red Hat Developer Hub) workload namespace — the Backstage CR, app-config, dynamic
# plugins, the bundled PostgreSQL, and the operator-created route all live here.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Wave -2 = namespace: created first, deleted LAST, so nothing we own is orphaned inside it.
    argocd.argoproj.io/sync-wave: "-2"
  name: rhdh
  labels:
    portfolio.redhat.com/component: rhdh
