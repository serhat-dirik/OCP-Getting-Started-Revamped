# Read-only cluster access for Developer Hub's Kubernetes plugin, which backs the Topology,
# Kubernetes and CI (Tekton) tabs of a component. It lists, across namespaces, only the objects
# labelled with a component's backstage.io/kubernetes-id. The backend authenticates with the pod's
# own projected ServiceAccount token (kubelet-rotated, never stored), because the cluster entry in
# app-config-rhdh sets authProvider serviceAccount without a token.
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: developer-hub-reader
  namespace: rhdh
  labels:
    portfolio.redhat.com/component: rhdh
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: ogsr-developer-hub-reader
  labels:
    portfolio.redhat.com/component: rhdh
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, configmaps, limitranges, resourcequotas]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [route.openshift.io]
    resources: [routes]
    verbs: [get, list, watch]
  - apiGroups: [tekton.dev]
    resources: [pipelineruns, taskruns]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [rollouts]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: ogsr-developer-hub-reader
  labels:
    portfolio.redhat.com/component: rhdh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ogsr-developer-hub-reader
subjects:
  - kind: ServiceAccount
    name: developer-hub-reader
    namespace: rhdh
