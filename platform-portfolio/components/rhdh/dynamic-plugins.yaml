# Dynamic plugins for RHDH (spec.application.dynamicPluginsConfigMapName). Includes the operator's
# default plugin set (TechDocs, catalog, scaffolder core, …) and adds the Gitea scaffolder module so
# the golden-path template can publish:gitea.
#
# @backstage/plugin-scaffolder-backend-module-gitea is a FIRST-PARTY @backstage/* core module (not a
# third-party community plugin) — it is NOT bundled in the RHDH 1.10.2 image, so it is installed as an
# external dynamic plugin from npm (integrity-pinned). Version 0.2.19 is version-matched to RHDH 1.10.2:
# it declares @backstage/plugin-scaffolder-node ^0.13.0, satisfied by the image's 0.13.1 (0.2.20+ want
# ^0.13.2+, which the image does not satisfy). Verified live 2026-07-11: the plugin loads clean and
# publish:gitea + catalog:register run end to end. Re-pin on RHDH upgrades (match scaffolder-node).
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    # Wave -1 = prerequisite: in place before the rest of the component, removed after it.
    argocd.argoproj.io/sync-wave: "-1"
  name: dynamic-plugins-rhdh
  namespace: rhdh
  labels:
    portfolio.redhat.com/component: rhdh
data:
  dynamic-plugins.yaml: |
    includes:
      - dynamic-plugins.default.yaml
    plugins:
      - package: "@backstage/plugin-scaffolder-backend-module-gitea@0.2.19"
        integrity: "sha512-wFtDjPrJQQOwrSic+LxJWzI3wXkjrEYmag6glF5KbLAH3Jurj14bYDxWMgihUXayrH2l8a76Wj0aDCozsA8w3w=="
        disabled: false
      # Keycloak users/groups → catalog User/Group entities (bundled in the image). Inert until
      # catalog.providers.keycloakOrg is configured — the optional rhdh-auth overlay does that (README).
      - package: ./dynamic-plugins/dist/backstage-community-plugin-catalog-backend-module-keycloak-dynamic
        disabled: false
      # A component's runtime and delivery views (the golden-path template's CI, CD and Topology
      # tabs). Kubernetes and Topology are bundled in the image; enabling them inherits their default
      # mount points. Tekton is an OCI artifact listed in the image's default catalog ({{inherit}}
      # takes its pinned version and mount points from there). Argo CD's frontend and backend are
      # not in that default list, so they are pinned here with the mount points their Package
      # entities document (RHDH 1.10 / Backstage 1.49.4).
      - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes-backend-dynamic
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-community-plugin-topology
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-tekton:{{inherit}}
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd-backend:bs_1.49.4__1.4.0!backstage-community-plugin-argocd-backend
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd:bs_1.49.4__2.8.1!backstage-community-plugin-argocd
        disabled: false
        pluginConfig:
          dynamicPlugins:
            frontend:
              backstage-community.plugin-argocd:
                translationResources:
                  - importName: argocdTranslations
                    ref: argocdTranslationRef
                mountPoints:
                  - mountPoint: entity.page.overview/cards
                    importName: ArgocdDeploymentSummary
                    config:
                      layout:
                        gridColumnEnd:
                          lg: span 8
                          xs: span 12
                      if:
                        allOf:
                          - isArgocdConfigured
                  - mountPoint: entity.page.cd/cards
                    importName: ArgocdDeploymentLifecycle
                    config:
                      layout:
                        gridColumn: 1 / -1
                      if:
                        allOf:
                          - isArgocdConfigured
