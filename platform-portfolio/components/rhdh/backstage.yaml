# The Backstage instance (Red Hat Developer Hub). rhdh.redhat.com/v1alpha4 is the current served
# version (operator also serves v1alpha5). The operator deploys a bundled local PostgreSQL and creates
# the route (backstage-developer-hub) with the app/backend baseUrls auto-configured from it — so no
# cluster domain is hardcoded here.
apiVersion: rhdh.redhat.com/v1alpha4
kind: Backstage
metadata:
  annotations:
    # Wave 2 = operand: deleted FIRST, while the RHDH operator (pp-rhdh-operator, app-wave 0) is still running to execute its finalizer.
    argocd.argoproj.io/sync-wave: "2"
  name: developer-hub
  namespace: rhdh
  labels:
    portfolio.redhat.com/component: rhdh
spec:
  application:
    # The workshop app-config (guest auth, gitea integration, Parasol catalog) is appended to the
    # operator's base config.
    appConfig:
      configMaps:
        - name: app-config-rhdh
    # Adds the Gitea scaffolder module on top of the default plugin set.
    dynamicPluginsConfigMapName: dynamic-plugins-rhdh
    # Gitea credentials for the scaffolder + catalog reader (secret contract — see README).
    extraEnvs:
      secrets:
        - name: rhdh-gitea
    route:
      enabled: true
  # Optional sign-in overlay (contract `rhdh-auth`, see README): every key of that Secret becomes an env
  # var, so APP_CONFIG_* keys override this app-config (e.g. OIDC sign-in). optional: absent = guest.
  # A deployment patch because extraEnvs cannot reference an optional Secret; the operator merges this
  # before it appends its own envFrom entries (psql, rhdh-gitea).
  deployment:
    patch:
      spec:
        template:
          spec:
            containers:
              - name: backstage-backend
                envFrom:
                  - secretRef:
                      name: rhdh-auth
                      optional: true
