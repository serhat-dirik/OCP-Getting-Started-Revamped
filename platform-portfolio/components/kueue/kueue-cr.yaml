# Operator config: deploys the Kueue controller with plain-Job integration (M06 scope).
apiVersion: kueue.openshift.io/v1
kind: Kueue
metadata:
  name: cluster
  namespace: openshift-kueue-operator
  annotations:
    # Wave 2 = operand: deleted FIRST, while kueue-operator is still running to execute its finalizer.
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  managementState: Managed
  config:
    integrations:
      frameworks:
        - BatchJob
