# Red Hat build of Kueue — batch admission control (M06).
# No spec.channel: OLM resolves the package's defaultChannel on the target cluster, so the install is
# portable across catalog snapshots and a later installer gets the current supported Kueue.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: kueue-operator
  namespace: openshift-kueue-operator
  annotations:
    # Wave 0 = the controller. Its operand (Kueue/cluster, wave 2) is deleted first so the operator is
    # still running to execute its finalizer. See platform-portfolio/README.md § Sync waves.
    argocd.argoproj.io/sync-wave: "0"
spec:
  installPlanApproval: Automatic
  name: kueue-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
