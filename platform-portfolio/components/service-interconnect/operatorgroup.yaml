# AllNamespaces OperatorGroup (no targetNamespaces) — the Skupper v2 operator watches the whole cluster so
# it can reconcile Site CRs in any per-user namespace. Verified live 2026-07-26 against
# skupper-operator.v2.2.1-rh-1: AllNamespaces is the ONLY install mode the CSV supports (OwnNamespace,
# SingleNamespace and MultiNamespace are all supported=false), so an empty targetNamespaces is REQUIRED
# here, not merely preferred — a scoped OperatorGroup would leave the CSV unable to install at all.
# ONE OperatorGroup PER NAMESPACE, always: with two, OLM fails every CSV in it (TooManyOperatorGroups)
# while the pods keep running, so an operator the org owns breaks silently. argocd-bootstrap/install.sh
# preflights skupper and refuses to install if it already carries a foreign one. See README § OperatorGroups.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: skupper-operator
  namespace: skupper
  annotations:
    # Wave 0 = the controller's scope. Deleted after every operand, so OLM still has a group
    # while skupper-operator runs its finalizers.
    argocd.argoproj.io/sync-wave: "0"
spec:
  upgradeStrategy: Default
