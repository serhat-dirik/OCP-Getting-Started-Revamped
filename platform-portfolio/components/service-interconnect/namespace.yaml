# Red Hat Service Interconnect (Skupper v2) operator namespace. The operator is cluster-scoped; per-user
# Sites live in the workshop layer's {user}-site-b / {user}-resilience namespaces (M22 entry state), not here.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Wave -2 = namespace: created first, deleted LAST, so nothing we own is orphaned inside it.
    argocd.argoproj.io/sync-wave: "-2"
  name: skupper
  labels:
    portfolio.redhat.com/component: service-interconnect
