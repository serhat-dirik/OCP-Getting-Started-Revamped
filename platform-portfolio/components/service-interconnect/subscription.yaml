# Red Hat Service Interconnect / Skupper operator.
#
# THE ONE CHANNEL THE PORTFOLIO STILL SETS. Everywhere else spec.channel is omitted so OLM resolves the
# package's defaultChannel and a later install picks up newer versions. Here that would install the
# WRONG PRODUCT: skupper-operator's default/bare `stable` (and `stable-1`/`stable-1.x`) is LEGACY
# Skupper v1, whose `skupper.io/v1alpha1` CRs and `skupper init` CLI are incompatible with the v2 API
# (`skupper.io/v2alpha1`: Site/Listener/Connector/Link/AccessGrant/AccessToken) that M21/M22 are written
# against. `stable-2` selects a MAJOR line, not a version — z-streams and minors inside v2 still flow.
# Never copy the redhat-cop/gitops-catalog overlay for this one; it mis-pins `stable`.
# // TODO(verify-on-cluster): stable-2 is absent from some catalog snapshots (C2/km7vw listed only
# alpha/stable/stable-1..stable-1.9). Sync this component only where the packagemanifest lists stable-2:
#   oc get packagemanifests -n openshift-marketplace --field-selector=metadata.name=skupper-operator \
#     -o json | jq -r '.items[]|select(.status.catalogSource=="redhat-operators").status.channels[].name'
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: skupper-operator
  namespace: skupper
  annotations:
    # Wave 0 = the controller. No operand ships with this component (per-user Site CRs are workshop
    # layer). See platform-portfolio/README.md § Sync waves.
    argocd.argoproj.io/sync-wave: "0"
spec:
  channel: stable-2
  installPlanApproval: Automatic
  name: skupper-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
