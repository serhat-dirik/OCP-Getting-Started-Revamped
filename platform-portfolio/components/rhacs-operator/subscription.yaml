# Red Hat Advanced Cluster Security operator (M09 trust stack). Channel `stable` is the current
# 4.x line (v4.11.1, verified live 2026-07-09) — NOT `latest`, which holds the stale 3.74.9 (a
# recorded catalog trap in versions.yaml). Automatic approval keeps it on the stable head.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  annotations:
    # Wave 0 = the controller. Its operand (Central/SecuredCluster, shipped by pp-rhacs-central at app-wave 1) is deleted first, so rhacs-operator
    # is still running to execute the finalizer.
    argocd.argoproj.io/sync-wave: "0"
  name: rhacs-operator
  namespace: rhacs-operator
spec:
  channel: stable
  installPlanApproval: Automatic
  name: rhacs-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
