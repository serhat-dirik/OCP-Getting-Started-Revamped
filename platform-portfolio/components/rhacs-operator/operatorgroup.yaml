# All-namespaces OperatorGroup — the RHACS operator watches every namespace (it manages Central in
# `stackrox` and the SecuredCluster sensor cluster-wide). Empty spec = AllNamespaces (verified live).
# ONE OperatorGroup PER NAMESPACE, always: with two, OLM fails every CSV in it (TooManyOperatorGroups)
# while the pods keep running, so an operator the org owns breaks silently. argocd-bootstrap/install.sh
# preflights rhacs-operator and refuses to install if it already carries a foreign one. See README § OperatorGroups.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  annotations:
    # Wave 0 = the controller's scope. Deleted after every operand, so OLM still has a group
    # while rhacs-operator runs its finalizers.
    argocd.argoproj.io/sync-wave: "0"
  name: rhacs-operator
  namespace: rhacs-operator
spec:
  upgradeStrategy: Default
