# Operator namespace for Red Hat Advanced Cluster Security (RHACS). The operator installs
# AllNamespaces; the Central/SecuredCluster workloads live in the separate `stackrox` namespace.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Wave -2 = namespace: created first, deleted LAST, so nothing we own is orphaned inside it.
    argocd.argoproj.io/sync-wave: "-2"
  name: rhacs-operator
  labels:
    portfolio.redhat.com/component: rhacs-operator
