# OpenShift Pipelines operator — global (openshift-operators has the cluster-wide OperatorGroup).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  annotations:
    # Wave 0 = the controller. Its TektonConfig operand is created by the operator itself, not by us.
    argocd.argoproj.io/sync-wave: "0"
  name: openshift-pipelines-operator-rh
  namespace: openshift-operators
spec:
  channel: latest
  installPlanApproval: Automatic
  name: openshift-pipelines-operator-rh
  source: redhat-operators
  sourceNamespace: openshift-marketplace
