# TektonConfig "config" is created by the operator itself with cluster defaults the moment the
# CSV reconciles (see subscription.yaml's wave-0 comment) — we never own the object's lifecycle.
# This manifest patches ONLY the fields below via strategic-merge; every other section (pipeline,
# chain, dashboard, platforms, ...) is left untouched at whatever the operator defaults to. Verified
# live on cluster2 2026-08-01, which the commit that added this file could not yet claim: the synced
# object still carries the operator's own result.{disabled,is_external_db,options,performance,
# route_enabled} alongside our two fields, and Route tekton-results-api is reencrypt/Redirect.
#
# ADOPTED CLUSTERS — DECIDED, do not re-open. Owner call, 2026-08-01.
#   The mechanics first, because they are real and unchanged: adding this file is what made
#   components/openshift-pipelines stop being "operator-only" (lib-components.sh is_operator_only
#   reads FILENAMES — kustomization/namespace*/operatorgroup*/subscription* only). Before it, §0's
#   adoption preflight classified an already-installed Pipelines as SKIP and dropped
#   pp-openshift-pipelines from the render, touching nothing of theirs. Now that cluster gets the
#   weaker WARN verdict (no OperatorGroup here, so CC_HARD is false and it does not refuse), the
#   install proceeds, and Argo takes over BOTH the org's Subscription — re-channelling it to
#   `latest` with installPlanApproval: Automatic, which on a cluster pinned to a named channel with
#   Manual approval is an unattended operator UPGRADE, not a config tweak — and their cluster-scoped
#   TektonConfig singleton.
#
#   That full consequence was put to the owner explicitly, including the Subscription half rather
#   than only the two fields below, and the answer was to proceed: a customer running Pipelines
#   *alone* is not really the adoption case — they would have Argo CD as well, or neither, and the
#   Argo-present case is a different conversation entirely. The alternative (dropping this file to
#   restore the SKIP verdict) was built, measured and rejected on that ground; its cost was a Tekton
#   Results Route that returns "Client sent an HTTP request to an HTTPS server", which nothing in
#   the workshop uses.
#
#   So this is accepted risk with a known blast radius, NOT an oversight. If you are here because a
#   customer's Pipelines was upgraded by our install, that is this decision, and the fix is option 3
#   from that discussion: teach §0 to classify a component as adoption-skippable despite shipping
#   operand config (argocd-bootstrap-owned) — not to quietly delete this file.
#
# result.route_tls_termination: reencrypt
#   tekton-results-api terminates TLS itself — its Service carries
#   service.beta.openshift.io/serving-cert-secret-name: tekton-results-tls (a service-ca-signed
#   cert), confirmed live on cluster2. The operator's own default is "edge" (router terminates
#   client TLS, forwards PLAIN HTTP to the backend); against a TLS-only backend that plaintext
#   hits the backend's TLS listener and comes back "Client sent an HTTP request to an HTTPS
#   server" (reproduced live 2026-08-01: curl against the public Route). "passthrough" is wrong
#   too — the service-ca cert's SANs are the in-cluster Service DNS names, not the Route's public
#   hostname, so passthrough would leave TLS verification failing for any client that checks
#   server identity against the hostname it dialed. reencrypt lets the router terminate the
#   client leg with its own cert and open a fresh TLS connection to the backend for the second
#   leg, which is exactly what a self-TLS-terminating backend needs.
#   destinationCACertificate is deliberately left unset: every other service-ca-backed reencrypt
#   Route on this cluster (openshift-console/console, openshift-monitoring/alertmanager-main,
#   openshift-monitoring/prometheus-k8s, openshift-storage/noobaa-mgmt, ...) also leaves it unset
#   and works — the router's default trust bundle already trusts the service-ca signer, so no
#   extra CA needs to be handed to it.
#
# result.logs_api: false (explicit, matches the operator default)
#   TaskRun run metadata still archives either way; this only gates whether log BODIES are
#   archived too. Enabling it needs LOGS_TYPE=File backed by a PVC (logging_pvc_name) or an
#   external log store (Loki/S3) — this portfolio is workshop-agnostic and provisions neither, so
#   turning it on here would silently lose logs on every results-api pod restart instead of
#   archiving them. Attendees still get live logs via `tkn` / `oc logs` while the TaskRun pod
#   exists. Revisit only if a sizing tier adds a logging backend.
apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  name: config
  annotations:
    # Wave 1: after the operator Subscription (wave 0) so the CRD is registered first.
    argocd.argoproj.io/sync-wave: "1"
    # SkipDryRunOnMissingResource: first sync can still race operator reconciliation before the CRD
    # exists — don't hard-fail a dry-run against a not-yet-registered kind (same pattern as
    # components/rhtas/securesign.yaml).
    # Prune=false,Delete=false: we patch this object, we do not own it. It is CLUSTER-SCOPED
    # (oc api-resources --api-group=operator.tekton.dev → NAMESPACED=false) and carries the
    # operator's own finalizer `tektonconfigs.operator.tekton.dev`, so letting an Application
    # cascade take it would tear down the ENTIRE Tekton install on any cluster — and if the CSV
    # goes first, the finalizer can never run and the object hangs Terminating forever. Same two
    # keys ogsr-uninstall.sh's merge_sync_options() asserts on adopted resources, for the same
    # reason: protection has to be a property of the resource.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false,Delete=false
    # NOT YET HONOURED BY ANYTHING — inert metadata, staged for the argocd-bootstrap owner.
    # Meaning: "if §0 drops this component as adopted, drop this resource with it; the workshop
    # requires nothing from it." True here and nowhere else in the portfolio so far — every other
    # non-skippable component ships operands the workshop genuinely needs (KnativeServing, Kiali,
    # Securesign, ...), whereas this is a two-field patch on an object the operator creates either
    # way, and the only content that mentions the Route says it is broken and to route around it
    # (app-security-testing/instructor.adoc). Honouring it takes two edits in code this component
    # does not own: is_operator_only() must accept a file whose resources all carry this key, and
    # check-adoption-skip.sh must widen OPERATOR_ONLY_KINDS to "allowed kind OR this annotation"
    # so the render-level gate still catches an operand smuggled in under it.
    portfolio.redhat.com/adoption: drop-with-component
  labels:
    app.kubernetes.io/part-of: tekton-results
spec:
  result:
    route_tls_termination: reencrypt
    logs_api: false
