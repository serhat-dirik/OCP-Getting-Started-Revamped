# ServiceAccount the Vector collector runs as; the ClusterLogForwarder references it and authenticates to LokiStack with its token.
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    # Wave -1 = prerequisite: in place before the rest of the component, removed after it.
    argocd.argoproj.io/sync-wave: "-1"
  name: log-collector
  namespace: openshift-logging
