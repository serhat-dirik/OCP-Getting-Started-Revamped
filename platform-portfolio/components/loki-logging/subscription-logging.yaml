# Red Hat OpenShift Logging operator — provides the Vector collector + the ClusterLogForwarder API.
# No spec.channel: OLM resolves the package's defaultChannel on the target cluster, so the install is
# portable across catalog snapshots and a later installer gets the current supported logging line.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cluster-logging
  namespace: openshift-logging
  annotations:
    # Wave 0 = the controller. Its operand (ClusterLogForwarder, wave 2) is deleted first so the
    # operator is still running to execute its finalizer. See platform-portfolio/README.md § Sync waves.
    argocd.argoproj.io/sync-wave: "0"
spec:
  installPlanApproval: Automatic
  name: cluster-logging
  source: redhat-operators
  sourceNamespace: openshift-marketplace
