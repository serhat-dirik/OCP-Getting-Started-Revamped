# All-namespaces OperatorGroup for the Loki Operator (loki-operator supports AllNamespaces only, verified live 2026-07-09).
# Drop this file if openshift-operators-redhat already carries an OperatorGroup on the target cluster (see namespace comment).
# ONE OperatorGroup PER NAMESPACE, always: with two, OLM fails every CSV in it (TooManyOperatorGroups)
# while the pods keep running, so an operator the org owns breaks silently. argocd-bootstrap/install.sh
# preflights openshift-operators-redhat and refuses to install if it already carries a foreign one. See README § OperatorGroups.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  annotations:
    # Wave 0 = the controller's scope. Deleted after every operand, so OLM still has a group
    # while loki-operator runs its finalizers.
    argocd.argoproj.io/sync-wave: "0"
  name: openshift-operators-redhat
  namespace: openshift-operators-redhat
spec:
  upgradeStrategy: Default
