# Loki Operator (Red Hat log store) — owns LokiStack.
# No spec.channel: OLM resolves the package's defaultChannel on the target cluster, so the install is
# portable across catalog snapshots and a later installer gets the current supported Loki.
# NOTE: a community "loki-operator" (alpha only) shares the package name — source=redhat-operators
# pins the Red Hat build regardless of which channel OLM resolves.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: loki-operator
  namespace: openshift-operators-redhat
  annotations:
    # Wave 0 = the controller. Its operand (LokiStack, wave 2) is deleted first so the operator is
    # still running to execute its finalizer. See platform-portfolio/README.md § Sync waves.
    argocd.argoproj.io/sync-wave: "0"
spec:
  installPlanApproval: Automatic
  name: loki-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
