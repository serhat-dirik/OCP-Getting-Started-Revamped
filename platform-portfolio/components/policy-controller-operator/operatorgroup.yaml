# All-namespaces OperatorGroup: the operator reconciles PolicyController CRs in another namespace
# (policy-controller-operator, from the policy-controller component).
# ONE OperatorGroup PER NAMESPACE, always: with two, OLM fails every CSV in it (TooManyOperatorGroups)
# while the pods keep running, so an operator the org owns breaks silently.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  annotations:
    # Wave 0 = the controller's scope. Deleted after every operand, so OLM still has a group
    # while the operator runs its finalizers.
    argocd.argoproj.io/sync-wave: "0"
  name: openshift-policy-controller
  namespace: openshift-policy-controller
spec:
  upgradeStrategy: Default
