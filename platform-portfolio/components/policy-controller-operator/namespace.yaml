# Operator namespace for the policy-controller operator. Its own namespace, not openshift-operators:
# the operator's webhook Service selects control-plane=controller-manager, which there also matches
# other operators' pods, so admission calls can land on the wrong pod.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Wave -2 = namespace: created first, deleted LAST, so nothing we own is orphaned inside it.
    argocd.argoproj.io/sync-wave: "-2"
  name: openshift-policy-controller
  labels:
    portfolio.redhat.com/component: policy-controller-operator
