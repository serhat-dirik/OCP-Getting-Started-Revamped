# RHTAS policy-controller operator (Sigstore admission webhook under OLM). `stable` is the package's
# default channel (v1.1.2 on cluster-gn67x, 2026-11-15). Automatic approval keeps it on the channel head.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  annotations:
    # Wave 0 = the controller. Its operand (PolicyController) is deleted first, while the operator
    # is still running to process it.
    argocd.argoproj.io/sync-wave: "0"
  name: policy-controller-operator
  namespace: openshift-policy-controller
spec:
  channel: stable
  installPlanApproval: Automatic
  name: policy-controller-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  # The helm-based manager OOMs at its CSV default (512Mi): 8 restarts in 23 min on cluster-gn67x,
  # 2026-11-15. OLM applies this to every container of the operator Deployment.
  config:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
