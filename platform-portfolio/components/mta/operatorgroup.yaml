# OwnNamespace OperatorGroup — mta-operator supports OwnNamespace/SingleNamespace/MultiNamespace but
# NOT AllNamespaces (verified live 2026-07-13), so targetNamespaces MUST be set (an empty/AllNamespaces
# OperatorGroup would leave the Subscription unresolved). Scopes the operator to openshift-mta only.
# ONE OperatorGroup PER NAMESPACE, always: with two, OLM fails every CSV in it (TooManyOperatorGroups)
# while the pods keep running, so an operator the org owns breaks silently. argocd-bootstrap/install.sh
# preflights openshift-mta and refuses to install if it already carries a foreign one. See README § OperatorGroups.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-mta
  namespace: openshift-mta
  annotations:
    # Wave 0 = the controller's scope. Deleted after every operand, so OLM still has a group
    # while mta-operator runs its finalizers.
    argocd.argoproj.io/sync-wave: "0"
spec:
  targetNamespaces:
    - openshift-mta
