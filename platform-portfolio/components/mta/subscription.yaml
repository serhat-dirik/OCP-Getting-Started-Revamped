# Migration Toolkit for Applications (MTA 8) operator. Channel PINNED to stable-v8.0 — the redhat-operators
# DEFAULT channel (currentCSV mta-operator.v8.0.1), re-verified live via packagemanifest 2026-07-25 on an
# OCP 4.22 cluster. It was previously pinned to stable-v8.1: that channel exists in some catalog snapshots
# but NOT others, and where it is absent the Subscription fails ResolutionFailed, pp-mta-hub goes Degraded
# and M23 (app-modernization) is dead on arrival — caught by a clean-cluster install test. Pin the catalog's
# default channel, not the newest one seen on one cluster; PORTABILITY beats a minor-version bump here.
# Catalog is redhat-operators; the community konveyor-operator / windup-operator are BANNED.
# installPlanApproval Automatic so z-stream patches inside 8.0 land without a manual gate.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: mta-operator
  namespace: openshift-mta
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  channel: stable-v8.0
  installPlanApproval: Automatic
  name: mta-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
