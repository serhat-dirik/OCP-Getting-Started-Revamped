# Migration Toolkit for Applications (MTA 8) operator — the analysis engine M23 drives.
#
# NO spec.channel ON PURPOSE. Omitting it makes OLM resolve the package's own defaultChannel from
# whatever catalog snapshot the target cluster happens to carry, which is the only channel guaranteed
# to exist there. Every version-numbered pin we have tried broke somewhere else: stable-v8.1 is absent
# from some snapshots (Subscription → ResolutionFailed, pp-mta-hub Degraded, M23 dead on arrival), and
# pinning stable-v8.0 instead only moves the problem — it goes stale the moment the catalog drops 8.0,
# and it also denies a newer install the newer MTA it should get. Somebody installing this workshop
# months from now should get the current supported MTA, not a version frozen at authoring time.
# Catalog is redhat-operators; the community konveyor-operator / windup-operator are BANNED.
# installPlanApproval Automatic so z-stream patches land without a manual gate.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: mta-operator
  namespace: openshift-mta
  annotations:
    # Wave 0 = the controller. Its operand (Tackle, wave 2) is deleted first, so the operator is still
    # running to execute the Tackle finalizer. See platform-portfolio/README.md § Sync waves.
    argocd.argoproj.io/sync-wave: "0"
spec:
  installPlanApproval: Automatic
  name: mta-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
