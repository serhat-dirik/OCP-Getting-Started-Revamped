# Workload namespace for RHACS Central + SecuredCluster (the operator installs separately in
# rhacs-operator). `stackrox` is the product-conventional name the SecuredCluster sensor expects.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Wave -2 = namespace: created first, deleted LAST, so nothing we own is orphaned inside it.
    argocd.argoproj.io/sync-wave: "-2"
  name: stackrox
  labels:
    portfolio.redhat.com/component: rhacs-central
