# Default mirror set: the repo THIS portfolio was installed from. Both values below are
# placeholders — the parent pp-<stack> Application patches them with the install's --source-repo
# and --revision (see argocd-bootstrap/stack-app.template.yaml), which is what makes a fork or an
# internal GitLab mirror correctly instead of silently mirroring the upstream project.
# Consumers (e.g. the workshop layer) add THEIR repos by creating additional ConfigMaps with the
# same label — the job mirrors the union, so no layer ever edits another layer's objects.
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    # Wave -1 = prerequisite: in place before the rest of the component, removed after it.
    argocd.argoproj.io/sync-wave: "-1"
  name: git-mirror-repos-portfolio
  labels:
    git-mirror.portfolio.redhat.com/repos: "true"
data:
  org: parasol
  # Branch/tag the mirror must serve before downstream layers may source from it. The job waits
  # until the mirror's HEAD on this revision equals origin's — cockpits and Argo build content
  # from the mirror, and consuming it early serves stale content.
  revision: __SET_BY_PARENT_APPLICATION__
  repos: |
    ocp-getting-started=__SET_BY_PARENT_APPLICATION__
