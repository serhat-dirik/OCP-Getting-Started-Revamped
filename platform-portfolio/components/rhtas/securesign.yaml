# Securesign — the full sigstore stack (Trillian+DB, Rekor transparency log, Fulcio CA, CTlog, TUF,
# TSA). One shared instance. The operator generates all certs/keys and the TUF root from this CR
# (Trillian database.create=true; tuf.rootKeySecretRef names the secret the operator creates).
#
# rhtas.redhat.com/v1, the STORAGE version (v1alpha1 is deprecated). Written in v1 so the field paths
# Argo diffs and ignores (.spec.fulcio.config.oidcIssuers, .spec.fulcio.trustedCA) are the ones
# stored, with no conversion round trip in between. Field-for-field the same object the v1alpha1
# manifest produced (live v1 read 2026-11-13, RHTAS 1.5.1): certificate → signer.certificateChain,
# externalAccess → ingress, monitoring.enabled → monitoring.{metrics,serviceMonitor}.enabled. The TUF
# key lists are left to the operator's autodiscovery, as in the operator's own v1 sample.
#
# Fulcio OIDC issuer: this default (the cluster's ServiceAccount issuer, type kubernetes) only stands
# until workload identity is available. fulcio-spiffe-issuer.yaml then REPLACES the list with the
# SPIFFE issuer, and pp-rhtas ignores both fields so a re-sync keeps that. On a cluster without the
# Zero Trust Workload Identity Manager this default stays, so the component installs either way.
apiVersion: rhtas.redhat.com/v1
kind: Securesign
metadata:
  name: securesign
  namespace: trusted-artifact-signer
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Wave 2 = operand: deleted FIRST, while rhtas-operator still runs its finalizer — stranding it
    # wedged trusted-artifact-signer on 2026-07-25.
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/part-of: trusted-artifact-signer
spec:
  ctlog:
    monitoring:
      metrics:
        enabled: true
      serviceMonitor:
        enabled: true
  fulcio:
    config:
      oidcIssuers:
        - clientID: trusted-artifact-signer
          issuer: https://kubernetes.default.svc
          issuerURL: https://kubernetes.default.svc
          type: kubernetes
    ingress:
      enabled: true
    monitoring:
      metrics:
        enabled: true
      serviceMonitor:
        enabled: true
    signer:
      certificateChain:
        commonName: fulcio.trusted-artifact-signer
        organizationName: Parasol Workshop
        organizationEmail: workshop@parasol.local
  rekor:
    ingress:
      enabled: true
    monitoring:
      metrics:
        enabled: true
      serviceMonitor:
        enabled: true
  trillian:
    database:
      create: true
    monitoring:
      metrics:
        enabled: true
      serviceMonitor:
        enabled: true
  tsa:
    ingress:
      enabled: true
    monitoring:
      metrics:
        enabled: true
      serviceMonitor:
        enabled: true
    ntpMonitoring:
      enabled: true
    signer:
      certificateChain:
        rootCA:
          commonName: tsa.trusted-artifact-signer-root
          organizationName: Parasol Workshop
          organizationEmail: workshop@parasol.local
        intermediateCA:
          - commonName: tsa.trusted-artifact-signer-intermediate
            organizationName: Parasol Workshop
            organizationEmail: workshop@parasol.local
        leafCA:
          commonName: tsa.trusted-artifact-signer-leaf
          organizationName: Parasol Workshop
          organizationEmail: workshop@parasol.local
  tuf:
    ingress:
      enabled: true
    pvc:
      accessModes:
        - ReadWriteOnce
      retain: true
      size: 100Mi
    rootKeySecretRef:
      name: tuf-root-keys
