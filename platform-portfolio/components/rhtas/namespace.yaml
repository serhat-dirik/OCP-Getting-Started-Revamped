# Namespace for Red Hat Trusted Artifact Signer (the sigstore stack: Fulcio, Rekor, CTlog, Trillian,
# TUF, TSA). Powers trusted-supply-chain's keyless signing (a SPIFFE workload identity) + Rekor beat.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Wave -2 = namespace: created first, deleted LAST, so nothing we own is orphaned inside it.
    argocd.argoproj.io/sync-wave: "-2"
  name: trusted-artifact-signer
  labels:
    portfolio.redhat.com/component: rhtas
