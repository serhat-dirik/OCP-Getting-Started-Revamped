# Red Hat Trusted Artifact Signer operator (keyless signing + Rekor). Channel `stable` follows the
# newest minor (v1.5.1 on 2026-11-13; the v1 Securesign's `spiffe` issuer type needs 1.5).
# Automatic approval keeps it on the stable head.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  annotations:
    # Wave 0 = the controller. Its operand (Securesign, wave 2) is deleted first, so rhtas-operator
    # is still running to execute the finalizer.
    argocd.argoproj.io/sync-wave: "0"
  name: rhtas-operator
  namespace: trusted-artifact-signer
spec:
  channel: stable
  installPlanApproval: Automatic
  name: rhtas-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
