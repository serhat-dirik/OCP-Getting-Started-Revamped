# OpenShift Dev Spaces operator — global install (openshift-operators cluster-wide OperatorGroup).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  annotations:
    # Wave 0 = the controller. Its operand (CheCluster, wave 2) is deleted first, so the Dev Spaces operator
    # is still running to execute the finalizer.
    argocd.argoproj.io/sync-wave: "0"
  name: devspaces
  namespace: openshift-operators
spec:
  channel: stable
  installPlanApproval: Automatic
  name: devspaces
  source: redhat-operators
  sourceNamespace: openshift-marketplace
