# Dev Spaces control-plane namespace — the operator reconciles the CheCluster here.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Wave -2 = namespace: created first, deleted LAST, so nothing we own is orphaned inside it.
    argocd.argoproj.io/sync-wave: "-2"
  name: openshift-devspaces
  labels:
    portfolio.redhat.com/component: devspaces
