# Red Hat build of Keycloak operator — the M14 workshop auth backend, scoped to sso-workshop only.
# No spec.channel: OLM resolves the package's defaultChannel on the target cluster, so the install is
# portable across catalog snapshots and a later installer gets the current supported RHBK rather than a
# version frozen at authoring time.
# WATCH: the keycloaks/keycloakrealmimports CRDs are cluster-scoped and SHARED with any other Keycloak
# on the cluster (e.g. an OpenShift login IdP in ns `keycloak`). A newer operator reconciles those CRDs
# additively — proven non-disruptive across a v26.4 IdP when this component installed v26.6 (see
# stacks/auth/README.md) — but a future major that changes the stored CRD version would touch the org's
# instance too. If that ever happens, adopt their operator instead of installing ours.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhbk-operator
  namespace: sso-workshop
  labels:
    portfolio.redhat.com/component: keycloak-operator
  annotations:
    # Wave 0 = the controller. Its operand (the Keycloak CR) ships in the separate pp-keycloak
    # Application at app-wave 1, so it is deleted first. See platform-portfolio/README.md § Sync waves.
    argocd.argoproj.io/sync-wave: "0"
spec:
  installPlanApproval: Automatic
  name: rhbk-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
