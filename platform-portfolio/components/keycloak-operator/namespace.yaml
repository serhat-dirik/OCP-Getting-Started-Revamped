# Workshop-owned Red Hat build of Keycloak namespace. DISTINCT from the cluster's login-IdP
# namespace `keycloak` (that RHBK backs real console/admin logins — READ-ONLY, never touched here).
# rhbk-operator supports only OwnNamespace/SingleNamespace (verified live: installModes AllNamespaces=false),
# so this workshop instance MUST run its own operator scoped to its own namespace.
#
# RE-MEASURED 2026-08-06, and it is the fact that settles RHBK coexistence: AllNamespaces=false AND
# MultiNamespace=false on EVERY channel the package publishes (all nine, stable-v22 through
# stable-v26.6). An OperatorGroup for this operator can therefore only ever resolve to exactly ONE
# namespace, so an organisation running their own RHBK cannot also watch this one without giving up
# watching theirs. "Adopt the org's operator and just own our namespace" is not merely awkward for
# RHBK, it is unreachable — which is why this component keeps creating the namespace it subscribes
# into. Coexistence is achieved the other way, and it is proven rather than assumed: on the cluster
# this was measured on, THREE independent rhbk-operator installs ran side by side (the org's login IdP
# at v26.4, one pulled in as an MTA dependency at v26.6, and this one at v26.6), each OwnNamespace-
# scoped, all three sharing the one cluster-scoped Keycloak CRD, every OperatorGroup a singleton.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Wave -2 = namespace: created first, deleted LAST, so nothing we own is orphaned inside it.
    argocd.argoproj.io/sync-wave: "-2"
  name: sso-workshop
  labels:
    portfolio.redhat.com/component: keycloak-operator
