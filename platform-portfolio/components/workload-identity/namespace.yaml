# Home of the workload-identity hook Job only. Deliberately NOT the operator's namespace: a sibling
# that deploys into zero-trust-workload-identity-manager would strand it, and the operator component
# could no longer be adoption-skipped (lib-components.sh component_strands).
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Wave -2 = namespace: created first, deleted LAST, so nothing we own is orphaned inside it.
    argocd.argoproj.io/sync-wave: "-2"
  name: ogsr-workload-identity
  labels:
    portfolio.redhat.com/component: workload-identity
