# Identity of the operands hook Job. The rhtas component binds this same ServiceAccount to the Fulcio
# issuer script's Roles (components/rhtas/fulcio-spiffe-issuer.yaml), so whichever hook finishes
# last points Fulcio at the issuer.
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    # Wave -1 = prerequisite: in place before the rest of the component, removed after it.
    argocd.argoproj.io/sync-wave: "-1"
  name: workload-identity-operands
  namespace: ogsr-workload-identity
  labels:
    portfolio.redhat.com/component: workload-identity
---
# Create and read the five ZTWIM singletons (all cluster-scoped, all named `cluster`), wait for their
# CRDs, and read the apps domain that becomes the trust domain. No write on anything else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    # Wave -1 = prerequisite: in place before the rest of the component, removed after it.
    argocd.argoproj.io/sync-wave: "-1"
  name: ogsr-workload-identity-operands
  labels:
    portfolio.redhat.com/component: workload-identity
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["config.openshift.io"]
    resources: ["ingresses"]
    resourceNames: ["cluster"]
    verbs: ["get"]
  # create cannot be narrowed by name; the hook only ever creates `cluster`, and only when absent.
  - apiGroups: ["operator.openshift.io"]
    resources: ["zerotrustworkloadidentitymanagers", "spireservers", "spireagents", "spiffecsidrivers", "spireoidcdiscoveryproviders"]
    verbs: ["create"]
  - apiGroups: ["operator.openshift.io"]
    resources: ["zerotrustworkloadidentitymanagers", "spireservers", "spireagents", "spiffecsidrivers", "spireoidcdiscoveryproviders"]
    resourceNames: ["cluster"]
    verbs: ["get", "patch", "update"]
---
# Binds the hook's ServiceAccount to the rules above.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    # Wave -1 = prerequisite: in place before the rest of the component, removed after it.
    argocd.argoproj.io/sync-wave: "-1"
  name: ogsr-workload-identity-operands
  labels:
    portfolio.redhat.com/component: workload-identity
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ogsr-workload-identity-operands
subjects:
  - kind: ServiceAccount
    name: workload-identity-operands
    namespace: ogsr-workload-identity
