# SPIFFE workload identity on this cluster: a PostSync hook creates the Zero Trust Workload Identity
# Manager operands (trust domain = the cluster's apps domain, read at runtime) when none exist, waits
# for the OIDC discovery endpoint, then lets Fulcio trust it (the rhtas component's issuer script).
# No operand is an Argo-managed manifest: the trust domain and issuer are cluster-specific and
# immutable once set, and an adopted ZTWIM must never be touched. See operands-job.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - operands-job.yaml
# Non-invasive delivery (Wave 1): owner label lets an admin enumerate the footprint
# (oc get <kind> -A -l workshop.redhat.com/owner=ogsr) and ogsr-uninstall.sh find it.
labels:
  - pairs:
      workshop.redhat.com/owner: ogsr
    includeSelectors: false
    includeTemplates: false
