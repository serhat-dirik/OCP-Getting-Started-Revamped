# UIPlugin: enables the console "Observe -> Dashboards (Perses)" view — the Red Hat build of Perses, GA in
# COO 1.5. The CRD forces the name 'monitoring' for type Monitoring, so this is a cluster singleton.
# What COO 1.5 creates for it (source: rhobs/observability-operator v1.5.2, uiplugin/monitoring.go): a
# monitoring console plugin (COO adds it to consoles.operator.openshift.io spec.plugins itself) and a
# Perses server in this operator's namespace with Kubernetes authN/authZ — a user sees the
# PersesDashboards of exactly the namespaces their own RBAC lets them read, and a datasource without a
# credential secret forwards the caller's own bearer token (rhobs/perses proxy.go), so metric tenancy is
# enforced by Thanos, not by Perses. No datasource here: a tenant datasource is per-namespace
# (thanos-querier :9092?namespace=<ns>) and belongs to whoever creates the namespace.
# acm / incidents / clusterHealthAnalyzer stay off: nothing in the portfolio uses them.
apiVersion: observability.openshift.io/v1alpha1
kind: UIPlugin
metadata:
  name: monitoring
  annotations:
    # Wave 2 = operand: deleted FIRST, while COO still runs to remove Perses and unregister the plugin.
    argocd.argoproj.io/sync-wave: "2"
    # UIPlugin CRD arrives with COO — skip dry-run until it exists.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    portfolio.redhat.com/component: cluster-observability-operator
spec:
  type: Monitoring
  monitoring:
    perses:
      enabled: true
