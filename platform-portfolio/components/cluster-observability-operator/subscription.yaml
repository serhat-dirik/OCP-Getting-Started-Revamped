# Cluster Observability Operator — console Observe plugins (Dashboards/Traces/Logs) + monitoring CRs. Channel verified 2026-07-09.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  annotations:
    # Wave 0 = the controller. Its operand (the UIPlugins, wave 2) is deleted first, so COO
    # is still running to execute the finalizer.
    argocd.argoproj.io/sync-wave: "0"
  name: cluster-observability-operator
  namespace: openshift-cluster-observability-operator
spec:
  channel: stable
  installPlanApproval: Automatic
  name: cluster-observability-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
