# OpenShift Serverless operator — Knative Serving + Eventing (M20/M21).
# No spec.channel: OLM resolves the package's defaultChannel on the target cluster, so the install is
# portable across catalog snapshots and a later installer gets the current supported Serverless rather
# than a minor frozen at authoring time. The labs use the stable Knative surfaces (`kn`, Service,
# Broker/Trigger) that do not change across 1.3x minors, so there is nothing here to pin for.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: serverless-operator
  namespace: openshift-serverless
  annotations:
    # Wave 0 = the controller. Its operands (KnativeServing/KnativeEventing, wave 2) are deleted first
    # so the operator is still running to execute their finalizers — stranding those finalizers is what
    # wedged knative-serving and knative-eventing on 2026-07-25.
    argocd.argoproj.io/sync-wave: "0"
spec:
  installPlanApproval: Automatic
  name: serverless-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
