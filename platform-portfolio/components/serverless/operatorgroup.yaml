# AllNamespaces OperatorGroup (no targetNamespaces) — serverless-operator supports AllNamespaces ONLY
# (verified live 2026-07-13). Same shape as the service-mesh / tempo components' OperatorGroups.
# ONE OperatorGroup PER NAMESPACE, always: with two, OLM fails every CSV in it (TooManyOperatorGroups)
# while the pods keep running, so an operator the org owns breaks silently. argocd-bootstrap/install.sh
# preflights openshift-serverless and refuses to install if it already carries a foreign one. See README § OperatorGroups.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: serverless-operator
  namespace: openshift-serverless
  annotations:
    # Wave 0 = the controller's scope. Deleted after every operand, so OLM still has a group
    # while serverless-operator runs its finalizers.
    argocd.argoproj.io/sync-wave: "0"
spec:
  upgradeStrategy: Default
