# Single-pod Tempo trace store for the shared workshop pipeline. Memory backend = inherently low
# retention (traces live only in the pod's memory ring), the shared-cluster-safe choice per the M13
# note's retention watchout; switch to backend: pv (+ size) if trace persistence across restarts is wanted.
# Exposes OTLP gRPC :4317 / HTTP :4318 on Service tempo-traces — the OpenTelemetryCollector exports here.
# Base fields (storage.traces.backend, jaegerui, resources) from the live tempo-operator v0.21.0-2 alm-example.
# Verified on install 2026-07-11 (tempo-operator v0.21.0-2, Tempo 2.10.5): spec.ingestion.otlp.grpc/http.enabled
# is the correct path (CR reconciled Ready=True), and the operator creates Service "tempo-traces" exposing OTLP
# gRPC :4317 / HTTP :4318 (plus 3200) — the endpoint the OpenTelemetryCollector exports to.
apiVersion: tempo.grafana.com/v1alpha1
kind: TempoMonolithic
metadata:
  name: traces
  namespace: ogsr-observability-workshop
  annotations:
    # Wave 2 = operand: deleted FIRST, while tempo-product still runs its finalizer. THE case this
    # vocabulary exists for — tempo.grafana.com/finalizer on this CR held ogsr-observability-workshop
    # open through a complete uninstall on 2026-07-25 and had to be cleared by hand.
    argocd.argoproj.io/sync-wave: "2"
    # TempoMonolithic CRD arrives with the operator — skip dry-run until it exists.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Multi-tenancy is what makes the console's Observe -> Traces page usable. Without it the page
  # states plainly: "No Tempo instances yet ... Instances without multi-tenancy are not
  # supported." observability-health-scale sends attendees to that page, so the module's exercise
  # 4 has no working path until this is on (task #86).
  #
  # mode: openshift means the operator fronts Tempo with a tempo-gateway that performs a
  # SubjectAccessReview per query against OpenShift RBAC — so attendee access is granted with a
  # normal Role/RoleBinding rather than a second auth system. Schema verified against the live
  # CRD 2026-07-26: `enabled` and `mode` are both required, mode is one of static|openshift, and
  # each authentication entry requires BOTH tenantName and tenantId.
  #
  # One tenant, not one per attendee. Traces here are platform telemetry the whole room reads
  # together; per-user tenants would multiply the gateway's config for no teaching benefit.
  multitenancy:
    enabled: true
    mode: openshift
    authentication:
      - tenantName: workshop
        tenantId: "1610b0c3-c509-4592-a256-a1871353dbfa"
  storage:
    traces:
      backend: memory
  ingestion:
    otlp:
      grpc:
        enabled: true
      http:
        enabled: true
  jaegerui:
    enabled: true
    route:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
