# Tempo Operator + shared observability namespace + a single-pod TempoMonolithic trace store.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# FILENAME IS LOAD-BEARING: bootstrap/ogsr-uninstall.sh finds the namespaces a component creates by
# globbing `namespace*.yaml` / `namespaces*.yaml` in the component directory. This file used to be
# called observability-namespace.yaml, which that glob does not match — so ogsr-observability-workshop
# was invisible to teardown and survived a "complete" uninstall on 2026-07-25. Any new namespace
# manifest must be named namespace*.yaml, never <something>-namespace.yaml.
resources:
  - namespace.yaml
  - namespace-observability.yaml
  - operatorgroup.yaml
  - subscription.yaml
  - tempomonolithic.yaml
  # Must follow tempomonolithic.yaml: these grant against the tenant that CR declares.
  - tenant-rbac.yaml
# Non-invasive delivery (Wave 1): owner label lets an admin enumerate the footprint
# (oc get <kind> -A -l workshop.redhat.com/owner=ogsr) and ogsr-uninstall.sh find it.
labels:
  - pairs:
      workshop.redhat.com/owner: ogsr
    includeSelectors: false
    includeTemplates: false
