# Suggested namespace of the Tempo Operator (tempo-product, AllNamespaces install mode).
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Wave -2 = namespace: created first, deleted LAST, so nothing we own is orphaned inside it.
    argocd.argoproj.io/sync-wave: "-2"
  name: openshift-tempo-operator
  labels:
    portfolio.redhat.com/component: tempo
