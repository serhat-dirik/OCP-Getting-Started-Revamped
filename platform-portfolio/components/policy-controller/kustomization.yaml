# Sigstore admission (RHTAS policy-controller): the PolicyController webhook, enforced only on
# namespaces labelled policy.rhtas.com/include=true, allowing images no ClusterImagePolicy matches,
# plus a TrustRoot for THIS cluster's Trusted Artifact Signer (hook: its TUF root is cluster data).
# Which images need which signature is the consumer's ClusterImagePolicy, not this component's.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - policycontroller.yaml
  - trust-root.yaml
# Non-invasive delivery (Wave 1): owner label lets an admin enumerate the footprint
# (oc get <kind> -A -l workshop.redhat.com/owner=ogsr) and ogsr-uninstall.sh find it.
labels:
  - pairs:
      workshop.redhat.com/owner: ogsr
    includeSelectors: false
    includeTemplates: false
