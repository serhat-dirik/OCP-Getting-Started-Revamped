# Namespace of the policy-controller webhook (the PolicyController operand).
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Wave -2 = namespace: created first, deleted LAST, so nothing we own is orphaned inside it.
    argocd.argoproj.io/sync-wave: "-2"
  name: policy-controller-operator
  labels:
    portfolio.redhat.com/component: policy-controller
