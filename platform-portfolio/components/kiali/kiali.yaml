# The Kiali console for the shared OSSM3 mesh. Lives in istio-system alongside istiod. sync-wave 1 +
# SkipDryRunOnMissingResource: the kiali.io CRD arrives with the operator (wave 0). Minimal by design —
# the platform baseline just stands Kiali up against the istio-system control plane with OpenShift OAuth
# login (attendees reach it as themselves; per-user namespace visibility follows their OpenShift RBAC).
# Metrics: Kiali reads the cluster's own monitoring (Thanos querier) — see monitoring.yaml for the RBAC
# and the istiod/proxy scrape config. Without external_services.prometheus Kiali falls back to
# prometheus.istio-system:9090, which does not exist on OpenShift, and every graph is empty (found
# 2026-11-12). Trace (Tempo) wiring stays out of the platform baseline.
apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali
  namespace: istio-system
  annotations:
    # Wave 2 = operand: deleted FIRST, while kiali-ossm is still running to execute its finalizer.
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    portfolio.redhat.com/component: kiali
spec:
  version: default
  istio_namespace: istio-system
  external_services:
    prometheus:
      # Kiali's own ServiceAccount token (cluster-monitoring-view, monitoring.yaml); TLS is verified
      # against the service CA the operator already mounts (kiali-cabundle-openshift).
      auth:
        type: bearer
        use_kiali_token: true
      thanos_proxy:
        enabled: true
      url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
  auth:
    # OpenShift OAuth — attendees log in with their cluster identity; Kiali scopes visible namespaces to
    # what each user can access (so user4 sees user4-mesh, not peers). No anonymous access on a shared cluster.
    strategy: openshift
  deployment:
    view_only_mode: false
    logger:
      log_level: info
