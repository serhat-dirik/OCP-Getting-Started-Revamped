# OpenShift Service Mesh Console (OSSMC): puts Kiali's views inside the OpenShift console — a "Service
# Mesh" nav section (Overview, Traffic Graph, Istio Config, Mesh) plus a Service Mesh tab on workload,
# service and project pages — so nobody has to leave the console for Kiali's own route. The plugin calls
# the Kiali API through the console with the signed-in user's token, so a user sees only the namespaces
# their own RBAC can read (Kiali auth strategy is openshift, kiali.yaml). Source: openshift-docs
# service-mesh-docs-3.5, ossm-install-console-plugin-ocp-cli.adoc. The kiali operator deploys the plugin
# into this CR's namespace and adds 'ossmconsole' to consoles.operator.openshift.io spec.plugins itself;
# deleting the CR reverses both. OSSMC supports ONE Kiali per cluster: kiali names ours explicitly.
apiVersion: kiali.io/v1alpha1
kind: OSSMConsole
metadata:
  name: ossmconsole
  namespace: istio-system
  annotations:
    # Wave 3 = after the Kiali CR (wave 2) it connects to; deleted first, while kiali-ossm still runs.
    argocd.argoproj.io/sync-wave: "3"
    # The kiali.io CRDs arrive with the operator (wave 0).
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    portfolio.redhat.com/component: kiali
spec:
  # 'default' = the operator's own OSSMC version, which matches the Kiali server (kiali.yaml also says
  # 'default') — OSSMC and the Kiali server must be the same minor version.
  version: default
  kiali:
    serviceName: kiali
    serviceNamespace: istio-system
