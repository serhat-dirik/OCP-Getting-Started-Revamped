# Home namespace for the trust-signing bootstrap Job. The Job itself writes the cosign key into the
# operator-owned `signing-secrets` in openshift-pipelines (via a scoped Role there) — nothing signs here.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Wave -2 = namespace: created first, deleted LAST, so nothing we own is orphaned inside it.
    argocd.argoproj.io/sync-wave: "-2"
  name: trust-signing
  labels:
    portfolio.redhat.com/component: trust-signing
