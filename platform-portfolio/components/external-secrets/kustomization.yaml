# External Secrets Operator for Red Hat OpenShift — operator install + the singleton operand +
# the one egress grant that makes a cross-namespace SecretStore reachable. See README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - operatorgroup.yaml
  - subscription.yaml
  # Must follow subscription.yaml: this is the CR the installed operator reconciles.
  - externalsecretsconfig.yaml
  # Must follow externalsecretsconfig.yaml: it lands in the namespace that CR causes to exist.
  - networkpolicy.yaml
# Non-invasive delivery (Wave 1): stamp every workshop-created resource with the owner label so an
# admin can enumerate the footprint (oc get <kind> -A -l workshop.redhat.com/owner=ogsr) and
# bootstrap/ogsr-uninstall.sh can find it.
#
# includeSelectors:false IS LOAD-BEARING HERE, not boilerplate copied from cert-manager. This
# component ships a NetworkPolicy, and the label transformer would otherwise add
# workshop.redhat.com/owner=ogsr to BOTH spec.podSelector (which would then match no ESO pod, since
# the operator does not label its own pods with ours) and to the egress namespaceSelector (harmless
# but redundant). The policy would render, apply, go green in Argo, and grant nothing.
labels:
  - pairs:
      workshop.redhat.com/owner: ogsr
    includeSelectors: false
    includeTemplates: false
