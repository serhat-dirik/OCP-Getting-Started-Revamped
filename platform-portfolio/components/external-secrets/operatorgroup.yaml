# AllNamespaces OperatorGroup — ESO's CRDs and its ExternalSecretsConfig are CLUSTER-SCOPED, so the
# operator cannot be scoped to one namespace: an empty spec is the only shape that resolves to "" and
# lets it reconcile SecretStores in every attendee namespace. (Verified live: status.namespaces = [""].)
# ONE OperatorGroup PER NAMESPACE, always: with two, OLM fails every CSV in it (TooManyOperatorGroups)
# while the pods keep running, so an operator the org owns breaks silently. argocd-bootstrap/install.sh
# §0 preflights external-secrets-operator and REFUSES to install if it already carries a foreign one.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  annotations:
    # Wave 0 = the controller's scope. Deleted after every operand, so OLM still has a group while
    # the ESO operator runs the finalizer on ExternalSecretsConfig.
    argocd.argoproj.io/sync-wave: "0"
  name: external-secrets-operator
  namespace: external-secrets-operator
spec: {}
