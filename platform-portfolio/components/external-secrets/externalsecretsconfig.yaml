# The operand: nothing runs until this exists. The Subscription installs a CONTROLLER that watches
# ExternalSecretsConfig; this CR is what makes it create the `external-secrets` namespace, deploy the
# core controller / webhook / cert-controller, and start reconciling SecretStore + ExternalSecret.
#
# CLUSTER-SCOPED SINGLETON, and the CRD enforces it: x-kubernetes-validations rejects any name but
# `cluster` ("ExternalSecretsConfig is a singleton, .metadata.name must be 'cluster'"). There is
# therefore exactly ONE of these on any cluster — ours or the organisation's, never both.
#
# spec IS DELIBERATELY EMPTY, and ServerSideApply is what makes that non-invasive. The defaults ESO
# ships are what the workshop needs (verified live: appConfig.logLevel 1, controllerConfig {},
# plugins {}). Under client-side apply an empty spec would REPLACE whatever an organisation had
# configured on their singleton — proxy settings, log level, componentConfigs — the moment our
# Application synced. Under ServerSideApply, Argo becomes a field manager that owns only the fields
# it actually sets, and setting none means it takes nothing away. The same reasoning as
# components/monitoring-uwm/cluster-monitoring-config.yaml.
#
# NOT USED HERE: spec.controllerConfig.networkPolicies[], the operator-native way to punch through
# its own deny-all (it generates `eso-user-<name>` policies). Two reasons it is the wrong tool for
# this component. (1) Ownership: an operator-generated policy carries the operator's labels, so it
# is invisible to `oc get networkpolicy -A -l workshop.redhat.com/owner=ogsr` and to
# bootstrap/ogsr-uninstall.sh — a workshop artefact that outlives the workshop. (2) Adoption: the
# rule would have to be written INTO this singleton, so on a cluster where the organisation owns ESO
# we would be editing THEIR cluster-scoped config object to add a workshop-specific egress rule.
# A standalone NetworkPolicy we own (networkpolicy.yaml) is additive, labelled, and deletable.
apiVersion: operator.openshift.io/v1alpha1
kind: ExternalSecretsConfig
metadata:
  name: cluster
  annotations:
    # Wave 2 = operand CR: applied after the operator (wave 0), pruned BEFORE it, so the ESO
    # controller is still alive to run externalsecretsconfigs.../external-secrets-controller — the
    # finalizer that tears the `external-secrets` namespace down cleanly.
    argocd.argoproj.io/sync-wave: "2"
    # SkipDryRunOnMissingResource: the operator.openshift.io CRD arrives with the CSV in wave 0, so
    # on a cold cluster the dry-run at first sync has nothing to validate against.
    # ServerSideApply: see the spec-is-empty paragraph above — this is the non-invasive half.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,ServerSideApply=true
spec: {}
