# External Secrets Operator for Red Hat OpenShift — the secret-sync controller behind the
# `platform-guardrails` module (SecretStore/ExternalSecret against each attendee's own OpenBao).
# Referred to by SLUG, never by number: a module's number is its position in /modules.yaml and the
# catalog is elastic — position 13 was M13 Observability when stacks/observability was written and
# is gitops-at-scale today.
#
# PACKAGE-NAME TRAP, and it is not hypothetical — this cluster carries BOTH (measured 2026-08-23):
#   openshift-external-secrets-operator  redhat-operators     v1.2.0   default channel stable-v1  ✅
#   external-secrets-operator            community-operators  v0.11.0  default channel alpha      ❌
# The community package ships the upstream chart, no ExternalSecretsConfig API, and no Red Hat
# support. `source` + the fully-qualified `name` below pin the supported one; a bare package name
# would let OLM resolve either (CLAUDE.md § packagemanifest bare-name trap).
#
# CHANNEL IS PINNED, unlike cert-manager's deliberately floating Subscription. cert-manager ships no
# operand CR, so a future stable-v2 costs it nothing. This component ships an ExternalSecretsConfig
# on operator.openshift.io/v1alpha1; a major-channel jump is exactly where that API changes, and an
# unattended upgrade that invalidates the CR would take every attendee's SecretStore down mid-lab.
# Same reasoning as service-interconnect's stable-2 pin. Raise it deliberately, with a re-verify.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-external-secrets-operator
  namespace: external-secrets-operator
  annotations:
    # Wave 0 = the controller. See platform-portfolio/README.md § Sync waves.
    argocd.argoproj.io/sync-wave: "0"
spec:
  channel: stable-v1
  installPlanApproval: Automatic
  name: openshift-external-secrets-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
