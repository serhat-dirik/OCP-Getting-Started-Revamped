# Install namespace for the External Secrets Operator for Red Hat OpenShift (AllNamespaces mode).
# NOT the operand namespace: the operator creates `external-secrets` itself when it reconciles the
# ExternalSecretsConfig, and owns its lifecycle (see README § Two namespaces).
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Wave -2 = namespace: created first, deleted LAST, so nothing we own is orphaned inside it.
    argocd.argoproj.io/sync-wave: "-2"
  name: external-secrets-operator
  labels:
    portfolio.redhat.com/component: external-secrets
