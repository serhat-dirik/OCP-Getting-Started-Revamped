# Gitea operator is NOT in OperatorHub — installed from the rhpds/gitea-operator
# OLMDeploy kustomization, pinned to a commit SHA (main is rolling; verified 2026-07-08).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - https://github.com/rhpds/gitea-operator/OLMDeploy?ref=77cdc2b884c160663f7ef0b9040c35898d3ebcce
  - gitea-cr.yaml
# The remote OLMDeploy base ships its objects unwaved (= wave 0), which is already correct for the
# CatalogSource/OperatorGroup/Subscription — the operator is torn down after the Gitea CR at wave 2.
# Its Namespace is the exception: at wave 0 it would be deleted in the same pass as the operator that
# lives in it. Patch it down to the vocabulary's namespace wave so it goes LAST, like every other
# namespace we create. We cannot edit the upstream base, so this patch is the only place to say it.
patches:
  - target:
      kind: Namespace
      name: gitea-operator
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-2"
# Non-invasive delivery (Wave 1): owner label lets an admin enumerate the footprint
# (oc get <kind> -A -l workshop.redhat.com/owner=ogsr) and ogsr-uninstall.sh find it.
labels:
  - pairs:
      workshop.redhat.com/owner: ogsr
    includeSelectors: false
    includeTemplates: false
