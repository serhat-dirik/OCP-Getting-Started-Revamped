# Dedicated namespace for the in-cluster git service (git-localize anchor).
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Wave -2 = namespace: created first, deleted LAST, so nothing we own is orphaned inside it.
    argocd.argoproj.io/sync-wave: "-2"
  name: ogsr-gitea
  labels:
    portfolio.redhat.com/component: gitea
