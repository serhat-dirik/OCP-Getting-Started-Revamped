# Install namespace for OpenShift Lightspeed — the operator, OLSConfig, and its Secret live here.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Wave -2 = namespace: created first, deleted LAST, so nothing we own is orphaned inside it.
    argocd.argoproj.io/sync-wave: "-2"
  name: openshift-lightspeed
  labels:
    portfolio.redhat.com/component: openshift-lightspeed
