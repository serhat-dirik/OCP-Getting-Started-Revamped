# OpenShift Lightspeed operator — the in-console AI assistant, wired to an LLM (MaaS) endpoint.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  annotations:
    # Wave 0 = the controller. Its operand (OLSConfig, wave 2) is deleted first, so lightspeed-operator
    # is still running to execute the finalizer.
    argocd.argoproj.io/sync-wave: "0"
  name: lightspeed-operator
  namespace: openshift-lightspeed
spec:
  channel: stable
  installPlanApproval: Automatic
  name: lightspeed-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
