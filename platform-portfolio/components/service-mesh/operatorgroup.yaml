# AllNamespaces OperatorGroup (no targetNamespaces) — servicemeshoperator3 supports AllNamespaces ONLY
# (verified live 2026-07-13: OwnNamespace/SingleNamespace/MultiNamespace all false). Same shape as the
# tempo component's OperatorGroup.
# ONE OperatorGroup PER NAMESPACE, always: with two, OLM fails every CSV in it (TooManyOperatorGroups)
# while the pods keep running, so an operator the org owns breaks silently. argocd-bootstrap/install.sh
# preflights openshift-service-mesh-operator and refuses to install if it already carries a foreign one. See README § OperatorGroups.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-service-mesh-operator
  namespace: openshift-service-mesh-operator
  annotations:
    # Wave 0 = the controller's scope. Deleted after every operand, so OLM still has a group
    # while servicemeshoperator3 runs its finalizers.
    argocd.argoproj.io/sync-wave: "0"
spec:
  upgradeStrategy: Default
