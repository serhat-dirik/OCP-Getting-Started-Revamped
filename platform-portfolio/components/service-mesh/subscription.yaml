# OpenShift Service Mesh 3 (Sail) operator — the M19 mesh control plane.
# UNPINNED 2026-07-31, reverting the stable-3.3 cap added in 146fda2 and restoring 60339a7's design
# ("let every default channel float"). Owner ruling, same day: record what we grounded on plus a
# MINIMUM, never a maximum — newer operators are EXPECTED on clusters we do not control, and a channel
# cap fights the cluster owner's own operator lifecycle on a healthy cluster. `spec.channel` is omitted
# on purpose so OLM follows whatever redhat-operators declares as the package default (verified
# 2026-07-31 on cluster-s7hkp: defaultChannel = `stable` -> servicemeshoperator3.v3.4.0); omitting it
# also survives a renamed default channel and a mirrored/disconnected catalog, which a literal
# `channel: stable` would not. Six other portfolio Subscriptions (cert-manager, keycloak-operator,
# kueue, mta, rhtpa, serverless) already ship channel-less for the same reason.
# MINIMUM: OSSM >= 3.3.0. What content is grounded on lives in versions.yaml `service_mesh`.
# NEVER select the `candidates` channel — it holds the stale v3.0.0-tp.2 tech-preview build; the
# package default has never pointed there, which is the only reason omission is safe.
# SAFE FOR THE DATA-PLANE PIN: istio.yaml sets Istio spec.version v1.28.6, an ENUM on the operator's
# own CRD that shifts with each operator minor. Verified 2026-07-31 against the downstream operator's
# supported-version list (openshift-service-mesh/sail-operator, pkg/istioversion/versions.ossm.yaml on
# branches release-3.3 and release-3.4): 3.4 still ships v1.28.6 with full charts and marks only the
# 1.26 line eol — so a float to 3.4.x does not invalidate our Istio CR. Re-check that list before
# assuming a float to 3.5 is equally safe.
# installPlanApproval stays Automatic (matches every other operator in this portfolio).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: servicemeshoperator3
  namespace: openshift-service-mesh-operator
  annotations:
    # Wave 0 = the controller. Its operands (Istio/IstioCNI, wave 2) are deleted first so the operator
    # is still running to execute their finalizers. See platform-portfolio/README.md § Sync waves.
    argocd.argoproj.io/sync-wave: "0"
spec:
  # No `channel:` on purpose — see the header. Do not re-add a stable-3.N cap.
  installPlanApproval: Automatic
  name: servicemeshoperator3
  source: redhat-operators
  sourceNamespace: openshift-marketplace
