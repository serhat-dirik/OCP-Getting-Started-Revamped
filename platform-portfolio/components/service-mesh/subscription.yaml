# OpenShift Service Mesh 3 (Sail) operator — the M19 mesh control plane.
# No spec.channel: OLM resolves the package's defaultChannel on the target cluster, so the install is
# portable across catalog snapshots and a later installer gets the current supported OSSM 3 rather than
# a minor frozen at authoring time. The labs use the sailoperator.io Istio/IstioCNI API, which is stable
# across OSSM 3.x minors. NEVER select the `candidates` channel — it holds the stale v3.0.0-tp.2.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: servicemeshoperator3
  namespace: openshift-service-mesh-operator
  annotations:
    # Wave 0 = the controller. Its operands (Istio/IstioCNI, wave 2) are deleted first so the operator
    # is still running to execute their finalizers. See platform-portfolio/README.md § Sync waves.
    argocd.argoproj.io/sync-wave: "0"
spec:
  installPlanApproval: Automatic
  name: servicemeshoperator3
  source: redhat-operators
  sourceNamespace: openshift-marketplace
