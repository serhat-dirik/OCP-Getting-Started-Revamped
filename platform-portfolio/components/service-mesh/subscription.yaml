# OpenShift Service Mesh 3 (Sail) operator — the M19 mesh control plane.
# RE-PINNED 2026-07-31 to channel stable-3.3 (== servicemeshoperator3.v3.3.5, Istio 1.28.x). This
# component was deliberately unpinned in 60339a7 ("let every default channel float"), but service mesh
# is the one component that pin was already protecting against a KNOWN trap: the bare `stable` channel
# floats to a newer OSSM 3 minor (currently v3.4.0), and mixed sidecar/ambient traffic silently bypasses
# waypoint L7 policy across minors in ways ADR-0003 (docs/adr/0003-m16-mesh-mode-sidecar-default.md) and
# versions.yaml's `service_mesh` entry are validated against ONLY on the 3.3 line. Confirmed read-only
# 2026-07-31: the live Subscription (unpinned, as this file shipped it) resolved installedCSV
# servicemeshoperator3.v3.4.0, not the documented v3.3.5 — exactly the drift this pin exists to prevent.
# NEVER select the `candidates` channel — it holds the stale v3.0.0-tp.2. installPlanApproval stays
# Automatic (matches every other pinned operator in this portfolio, e.g. kiali/rhtas/cert-manager): it
# only auto-tracks z-streams INSIDE stable-3.3, it does not walk the channel forward past 3.3.x.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: servicemeshoperator3
  namespace: openshift-service-mesh-operator
  annotations:
    # Wave 0 = the controller. Its operands (Istio/IstioCNI, wave 2) are deleted first so the operator
    # is still running to execute their finalizers. See platform-portfolio/README.md § Sync waves.
    argocd.argoproj.io/sync-wave: "0"
spec:
  channel: stable-3.3
  installPlanApproval: Automatic
  name: servicemeshoperator3
  source: redhat-operators
  sourceNamespace: openshift-marketplace
