# Install namespace for the cert-manager Operator for Red Hat OpenShift (own-namespace mode).
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Wave -2 = namespace: created first, deleted LAST, so nothing we own is orphaned inside it.
    argocd.argoproj.io/sync-wave: "-2"
  name: cert-manager-operator
  labels:
    portfolio.redhat.com/component: cert-manager
