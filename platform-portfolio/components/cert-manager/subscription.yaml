# cert-manager Operator for Red Hat OpenShift — TLS issuance for lab endpoints (M16+).
# No spec.channel: OLM resolves the package's defaultChannel on the target cluster, so the install works
# against any catalog snapshot and a later installer gets the current supported line rather than one
# frozen here. (Today that resolves to stable-v1; a future stable-v2 would be picked up as intended.)
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-cert-manager-operator
  namespace: cert-manager-operator
  annotations:
    # Wave 0 = the controller. See platform-portfolio/README.md § Sync waves.
    argocd.argoproj.io/sync-wave: "0"
spec:
  installPlanApproval: Automatic
  name: openshift-cert-manager-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
