# Operator namespace for the Zero Trust Workload Identity Manager. The operator also deploys its
# operands here (spire-server, spire-agent, the SPIFFE CSI driver, the OIDC discovery provider).
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Wave -2 = namespace: created first, deleted LAST, so nothing we own is orphaned inside it.
    argocd.argoproj.io/sync-wave: "-2"
  name: zero-trust-workload-identity-manager
  labels:
    portfolio.redhat.com/component: zero-trust-workload-identity-operator
