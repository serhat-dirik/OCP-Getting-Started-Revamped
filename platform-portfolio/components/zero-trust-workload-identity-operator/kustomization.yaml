# Zero Trust Workload Identity Manager (SPIRE/SPIFFE) — the OPERATOR ONLY, so on a cluster that
# already runs it this component is adoption-skippable (same split as rhacs-operator/rhacs-central).
# The operands (ZTWIM, SpireServer, SpireAgent, SpiffeCSIDriver, OIDC discovery) come from the
# separate workload-identity component's hook, which creates them only when none exist.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - operatorgroup.yaml
  - subscription.yaml
# Non-invasive delivery (Wave 1): owner label lets an admin enumerate the footprint
# (oc get <kind> -A -l workshop.redhat.com/owner=ogsr) and ogsr-uninstall.sh find it.
labels:
  - pairs:
      workshop.redhat.com/owner: ogsr
    includeSelectors: false
    includeTemplates: false
