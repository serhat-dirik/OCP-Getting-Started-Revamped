# All-namespaces OperatorGroup, as the product docs install it (openshift-docs
# zero-trust-manager-install-cli, enterprise-4.22): its operand CRs are all cluster-scoped.
# ONE OperatorGroup PER NAMESPACE, always: with two, OLM fails every CSV in it (TooManyOperatorGroups)
# while the pods keep running, so an operator the org owns breaks silently. argocd-bootstrap/install.sh
# preflights this namespace and refuses to install if it already carries a foreign one. See README § OperatorGroups.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  annotations:
    # Wave 0 = the controller's scope. Deleted after every operand, so OLM still has a group
    # while the operator runs its finalizers.
    argocd.argoproj.io/sync-wave: "0"
  name: zero-trust-workload-identity-manager
  namespace: zero-trust-workload-identity-manager
spec:
  upgradeStrategy: Default
