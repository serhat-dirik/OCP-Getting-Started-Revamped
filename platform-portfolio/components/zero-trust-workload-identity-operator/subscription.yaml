# Zero Trust Workload Identity Manager operator (SPIRE 1.14 under OLM). `stable-v1` is the package's
# default channel and the one the product docs install (v1.1.3, read 2026-11-13). The catalog marks
# it disconnected: "false", so this component needs a connected cluster. Automatic approval keeps it
# on the channel head.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  annotations:
    # Wave 0 = the controller. Its operands are deleted first (ogsr-uninstall.sh step 2), while the
    # operator is still running to process them.
    argocd.argoproj.io/sync-wave: "0"
  name: openshift-zero-trust-workload-identity-manager
  namespace: zero-trust-workload-identity-manager
spec:
  channel: stable-v1
  installPlanApproval: Automatic
  name: openshift-zero-trust-workload-identity-manager
  source: redhat-operators
  sourceNamespace: openshift-marketplace
