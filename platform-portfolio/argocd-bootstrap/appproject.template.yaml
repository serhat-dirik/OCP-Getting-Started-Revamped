# AppProject for every Application this portfolio creates — rendered by install.sh and applied
# BEFORE the stack Applications, because an Application naming a project that does not exist
# never syncs. NOTE for editors: the two double-underscore markers below (one under sourceRepos,
# one under destinations) are matched as whole LINES by sed (read-file + delete-line), so each
# must appear exactly once in this file — never spell one out in a comment as well.
#
# Why not the built-in `default` project: it permits every repo, every destination and every
# resource kind, and on an ADOPTED Argo CD it is shared with the organisation's own Applications.
# Three things this buys:
#   • a misconfigured Application fails loudly instead of deploying somewhere nobody intended
#   • teardown gets a second, unambiguous handle on what is ours (independent of the owner label)
#   • the org's Applications stay in `default`, untouched by anything we do to ours
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: __PROJECT__
  namespace: __ARGO_NAMESPACE__
  labels:
    # Non-invasive delivery: the owner label is how an admin enumerates our footprint
    # (oc get appproject -A -l workshop.redhat.com/owner=ogsr) and how teardown finds it.
    workshop.redhat.com/owner: ogsr
    portfolio.redhat.com/layer: platform
spec:
  description: Platform portfolio stacks (operators, third-party tools, platform config)
  # Both phases of the install are permitted: the external source repo (phase 1, bootstrap) and
  # the in-cluster Gitea mirror the stacks flip to once it serves the same HEAD (phase 2).
  # install.sh renders the full list — it always includes --repo-url plus every --allow-source-repo.
  sourceRepos:
__SOURCE_REPOS__
  # Scoped by NAMESPACE PATTERN, never by enumerating resource kinds: a project so tight that adding
  # a component means editing this file would rot within two modules. The patterns cover exactly the
  # namespaces the portfolio's components declare — ogsr-* (ours), openshift-* (product-canonical
  # operator namespaces), *-operator (cert-manager-operator, rhacs-operator, rhdh-operator,
  # gitea-operator), plus the handful of operator/operand namespaces whose product names match no
  # pattern. A destination outside this list is a bug in the component, and Argo will say so.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: 'ogsr-*'
    - server: https://kubernetes.default.svc
      namespace: 'openshift-*'
    - server: https://kubernetes.default.svc
      namespace: '*-operator'
    - server: https://kubernetes.default.svc
      namespace: 'istio-*'        # OSSM 3: istio-system, istio-cni
    - server: https://kubernetes.default.svc
      namespace: 'knative-*'      # Serverless: knative-serving, knative-eventing
    - server: https://kubernetes.default.svc
      namespace: 'trust*'         # trust-signing, trusted-artifact-signer
    - server: https://kubernetes.default.svc
      namespace: 'sso-*'          # auth stack: sso-workshop (Keycloak operand)
    - server: https://kubernetes.default.svc
      namespace: rhdh             # Developer Hub operand
    - server: https://kubernetes.default.svc
      namespace: rhtpa            # Trusted Profile Analyzer (trust-demo)
    - server: https://kubernetes.default.svc
      namespace: skupper          # Service Interconnect (RHSI)
    - server: https://kubernetes.default.svc
      namespace: sonarqube        # appsec stack
    - server: https://kubernetes.default.svc
      namespace: stackrox         # RHACS Central operand
__EXTRA_DESTINATIONS__
  # Cluster-scoped resources stay wide open ON PURPOSE. Installing operators means creating
  # Namespaces, CRDs, ClusterRoles/Bindings, SCCs, ConsolePlugins, GatewayClasses, ValidatingWebhook
  # configurations — an allow-list of kinds would be a maintenance tax that buys nothing, since any
  # component able to install an operator can already reach cluster scope. Containment for this
  # project comes from the namespace list above and from the sourceRepos allow-list.
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
