# parasol-claims-devsecops — the app-security-testing DevSecOps CAPSTONE Pipeline (12 gated stages — 11 security + 1 perf).
#
# WHY THIS EXISTS: the reference pipeline attendees run in app-security-testing — every stage of the software supply
# chain has a security gate. It reuses the whole curated library across three renderings of "reuse":
# bundled catalog tasks (git-clone/buildah/openshift-client), the pipelines-fundamentals/trusted-supply-chain curated tasks
# (maven-jdk21, image-size-report, acs-image-check) and the net-new app-security-testing tasks (sonar-scan,
# trivy-scan, roxctl-deployment-check, zap-baseline, k6-load-test). Nothing is copy-pasted — every taskRef is a
# CLUSTER RESOLVER into the shared parasol-tasks library or openshift-pipelines.
#
#   fetch → SAST(sonar) → SCA(trivy) → unit-test → build-image → acs-image-check ┐
#                                                                 → image-report   ├→ deploy-check → deploy(+Route) → DAST(zap) → perf(k6)
#                                                                 → sign-check ─────┘
#
# GATES: sonar-scan (qualitygate.wait), trivy-scan (HIGH/CRITICAL + copyleft), unit-test, acs-image-check
# (Block-Log4Shell), sign-check (unsigned = fail), roxctl-deployment-check (enforced deploy policy),
# zap-baseline (ZAP FAIL), k6-load-test (p95 latency + error-rate budget). On CLEAN source every gate
# passes; the security seeds (per stage) make each fail deterministically — those seeds ship with the
# app-security-testing content/app pass. The perf gate has no seeded regression yet; it passes on the healthy app.
#
# REPORT MODE — `enforce-gates=false`. One param, default "true", fanned out to every gate. It exists
# so a single run can TOUR the whole chain: on the seeded branch with enforce-gates=false all twelve
# stages execute, every scanner runs, every finding lands in its TaskRun log (and in SonarQube/RHACS),
# and nothing blocks. Three properties are load-bearing and none of them is free:
#
#   1. IT WEAKENS ENFORCEMENT, NEVER DETECTION. The obvious knobs — sonar's QUALITY_GATE_WAIT=false,
#      trivy's EXIT_CODE=0 — do the opposite: they stop the tool measuring, so the Task reports a
#      PASS it never made and the pipeline result publishes `true` on a run that found everything.
#      `enforce-gates` drives each Task's FAIL_ON_* switch and leaves every detector at its gating
#      default. Read the two Tasks' headers; both spell this out at the top.
#   2. THE RESULTS STAY TRUE — ALL SIX OF THEM. sast-passed / sca-passed / image-scan-passed /
#      config-check-passed / dast-passed / perf-passed each publish `false` on a report run that
#      found something: reporting-only changes the exit status, not the verdict. dast-passed and
#      perf-passed only started telling the truth on 2026-08-16 (they used to overwrite themselves
#      with `true` on exactly that branch) — the note on the dast-zap stage records why it mattered.
#      This is what tools/verify/app-security-testing.sh grades, and it is why a report run cannot
#      satisfy it: the run Succeeds while its gate verdicts stay false.
#   3. IT IS NOT "NOTHING CAN STOP THE RUN". Three stages have no toggle and still hard-fail:
#      unit-test (maven-jdk21 — `mvn test`), build-image (buildah), and sign-check (the inline
#      `exit 1` below). None of them is seeded to fail, so a report run reaches stage 12 — but a
#      genuinely broken test, build or Chains signer stops it, which is correct.
#   Runs 1 and 3 of the lab leave this at its default and are byte-for-byte the enforced pipeline
#   that shipped before this param existed.
#
# SIZE THE NAMESPACE, NOT THE RUN. Memory AND CPU for the Maven/Quarkus steps come from the
# {user}-cicd namespace default container limit (gitops/workshop-config/templates/per-user-limits.yaml),
# not from this Pipeline and not from per-task taskRunSpecs — so the Pipeline stays runtime-agnostic
# AND a run started from the console *Actions -> Start* form, which cannot set either, gets what any
# other run gets. That is also why this file has no knob for it: PipelineTask has no
# computeResources field at all (tekton.dev/v1, checked with `oc explain` on Pipelines 1.23.1), so
# the ONLY places a step's CPU can come from are the Task body, a PipelineRun's taskRunSpecs, and
# the LimitRange — and of those three only the LimitRange reaches every run.
#
# THIS PIPELINE IS CPU-BOUND, AND THAT DEFAULT IS WHERE ITS RUNTIME IS DECIDED (measured on
# cluster-m24jn, 2026-08-13, `default.cpu: 500m`). Every step runs pegged at its 500m ceiling —
# `oc adm top pod` reads a flat 499m through the whole compile — and the same Maven work on the same
# source, in the same image, on the same node class, at different CPU ceilings:
#     phase                                    500m    1000m   2000m   4000m
#     resolve 459 jars + compile (5 files)      92s      65s     43s     37s
#     mvn test (30 tests / 6 Quarkus boots)    413s     256s    131s     59s
#     mvn -DskipTests package                  185s      93s     47s     24s
# The whole capstone's Maven work is ~690s at 500m and ~120s at 4000m. Nothing in the DAG or in a
# dependency cache competes with that: the intra-run Maven repository tried on 2026-08-13 changed
# unit-test by 6 seconds (see the workspaces block). If this capstone needs to be faster, raise the
# namespace default — and check the {user}-cicd ResourceQuota when you do, because a step limit of
# D gives sast-sonar's three-step pod 3×D against a `limits.cpu: 6` quota, so D above ~1900m stops
# the pod being admitted at all.
#
# LOCKSTEP: this is the CANONICAL copy; the app-security-testing entry state ships the same Pipeline
# at gitops/entry-states/app-security-testing/templates/pipeline.yaml. NOT byte-identical — that copy
# adds metadata.namespace ({user}-cicd) and both files carry their own comments. The specs must match.
# tools/lint/copy-drift-guard.py gates it (pair "app-security-testing-pipeline") in the lint
# workflow's copy-drift job.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: parasol-claims-devsecops
  labels:
    app.kubernetes.io/part-of: parasol-claims
    workshop.redhat.com/module: app-security-testing
    workshop.redhat.com/owner: ogsr
spec:
  params:
    - name: git-url
      type: string
      description: Source repository (defaults to the in-cluster Gitea shared repo).
      default: http://gitea.ogsr-gitea.svc:3000/parasol/parasol-claims.git
    - name: git-revision
      type: string
      description: Branch, tag, or commit to build.
      default: main
    - name: image
      type: string
      description: Fully-qualified target image reference (registry/namespace/name:tag).
      # Own-namespace registry path, so this Pipeline is portable across every {user}-cicd with no edit.
      default: image-registry.openshift-image-registry.svc:5000/$(context.pipelineRun.namespace)/parasol-claims:latest
    - name: sonar-project-key
      type: string
      description: SonarQube project key (per-user recommended, e.g. parasol-claims-user1).
      default: parasol-claims
    - name: max-size-mb
      type: string
      description: Image size budget in MB, enforced (as a report) by image-size-report.
      default: "500"
    - name: enforce-gates
      type: string
      # POSITIVE POLARITY, and that is not a style choice. Tekton cannot negate a param value, so a
      # `report-only` param would have to be inverted inside every Task it reaches — and four of the
      # six gates here resolve from the shared library with their switch already spelled
      # true-means-enforce (FAIL_ON_VIOLATION ×2, FAIL_ON_WARN, FAIL_ON_THRESHOLD). Matching that
      # polarity makes every mapping below a plain pass-through with no inversion anywhere, which is
      # also why the default "true" is provably identical to the hardcoded "true" it replaced.
      description: >-
        "true" (default) runs every security gate ENFORCED — the first violation stops the pipeline.
        "false" runs REPORT MODE: every scanner still runs and still reports its findings, every
        result still records the truth, and no gate blocks. Report mode does not disable unit-test,
        build-image or sign-check, which have no toggle and still fail the run.
      default: "true"
  workspaces:
    # One shared PVC carries the checkout from git-clone through SAST/SCA/unit-test and the image build.
    - name: shared-workspace
    # ZAP writes its session + reports here (mounted at /zap/wrk by the zap-baseline task).
    - name: zap-work
    # k6 writes its HTML dashboard report here (the perf-k6 load-test gate).
    - name: k6-work
    # ONE PVC-BACKED WORKSPACE, and only one: shared-workspace. zap-work and k6-work look identical
    # here and are NOT the same thing — every runner in this repo binds them `emptyDir: {}`, so they
    # do not count against Tekton's Affinity Assistant. A persistent maven-cache CLAIM was declared
    # here 2026-08-07 and removed 2026-08-08; read the ONE PVC-BACKED WORKSPACE PER TASK note in
    # pipelines/pipeline/parasol-claims-build.yaml for the failure and the measurement. The "six
    # sequential runs" argument that justified it does not survive the numbers: a warm cache was
    # worth 1.2% of a run, so six of them are worth about forty seconds of a capstone.
    #
    # AND THE INTRA-RUN VARIANT DOES NOT WORK EITHER — tried and measured 2026-08-13, so that the
    # next person costs themselves an hour and not a release. The idea: give every `source` mapping
    # `subPath: source` and map the two Maven tasks' optional `maven-cache` workspace to THIS SAME
    # shared-workspace at `subPath: maven-repository`. It is genuinely admissible — both mappings
    # resolve to one PersistentVolumeClaim, so the TaskRun mounts one claim and the Affinity
    # Assistant is satisfied (Tekton counts claims, not workspace names; probe PipelineRun
    # p1-probe-2ws-7t7rq Succeeded, its pod carrying a single volume mounted at two subPaths). It
    # also demonstrably worked in the capstone: the run's sast-sonar wrote the tree to the claim and
    # unit-test's Maven read it back. IT JUST DOES NOT MAKE THE RUN FASTER.
    #   baseline (no cache)  unit-test 491s, Maven "Total time: 07:53"
    #   intra-run repository unit-test 497s, Maven "Total time: 07:53"
    # Identical to the second, on the same cluster an hour apart. The dependency fetch was never
    # unit-test's cost: at the 500m CPU limit these steps run under, resolving all 459 jars is ~92s
    # in isolation while the six Quarkus test-application boots are ~400s — and what the download
    # saves, writing 154MB through the PVC gives back. Two independent reasons not to reach for a
    # Maven cache here; the CPU limit is the thing that actually moves this pipeline.
    # It has a second cost that is easy to miss: with both mappings naming shared-workspace,
    # tools/verify/_lib.sh's pipeline_pvc_workspaces_ok counts BINDINGS to a PVC-backed pipeline
    # workspace rather than distinct claims, so `ws verify app-security-testing` goes ❌ on a
    # capstone that is running perfectly ("task 'sast-sonar' binds two PVC-backed workspaces").
    # Anyone reviving this idea has to fix that helper in the same change.
  results:
    - name: sast-passed
      value: $(tasks.sast-sonar.results.quality-gate-passed)
    - name: sca-passed
      value: $(tasks.sca-trivy.results.scan-passed)
    - name: image-scan-passed
      value: $(tasks.image-scan.results.check-passed)
    - name: config-check-passed
      value: $(tasks.deployment-check.results.check-passed)
    - name: dast-passed
      value: $(tasks.dast-zap.results.dast-passed)
    - name: perf-passed
      value: $(tasks.perf-k6.results.perf-passed)
  tasks:
    # 1) Clone the app source into the shared workspace (bundled task, cluster resolver).
    - name: fetch-source
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: git-clone}
          - {name: namespace, value: openshift-pipelines}
      params:
        - {name: URL, value: $(params.git-url)}
        - {name: REVISION, value: $(params.git-revision)}
      workspaces:
        - {name: output, workspace: shared-workspace}

    # 2) SAST: SonarQube analysis + quality-gate gate. FIRST GATE AFTER THE CHECKOUT, and that is an
    #    attendee-experience decision as much as a narrative one: exercise 1's seeded hard-coded
    #    credential (rule S2068) has to go red EARLY in the break-fix loop. Behind unit-test it
    #    would be minutes of green log before the first red gate appears (measured: unit-test alone
    #    is ~8 min of the run).
    - name: sast-sonar
      runAfter: [fetch-source]
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: sonar-scan}
          - {name: namespace, value: ogsr-parasol-tasks}
      params:
        - {name: SONAR_PROJECT_KEY, value: $(params.sonar-project-key)}
        # NOT QUALITY_GATE_WAIT — that one blinds the scanner instead of unblocking the pipeline.
        - {name: FAIL_ON_VIOLATION, value: $(params.enforce-gates)}
      workspaces:
        # ONE workspace, even though sonar-scan also declares an optional `maven-cache`. Read the
        # Pipeline's workspaces block above before binding it — both ways of doing so have been
        # tried and measured, and neither is here by accident.
        - {name: source, workspace: shared-workspace}

    # 3) SCA: Trivy filesystem scan (dependency CVEs) + CycloneDX SBOM artifact. runAfter sast-sonar.
    - name: sca-trivy
      runAfter: [sast-sonar]
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: trivy-scan}
          - {name: namespace, value: ogsr-parasol-tasks}
      params:
        # NOT EXIT_CODE — that is trivy's own integer flag and a "0" there stops trivy telling the
        # Task anything, so the SCA result would publish `true` under a table full of CVEs.
        - {name: FAIL_ON_VIOLATION, value: $(params.enforce-gates)}
      workspaces:
        - {name: source, workspace: shared-workspace}

    # 4) Unit tests (H2-backed, self-contained) — after the source gates pass. Curated maven-jdk21.
    #    NO REPORT-MODE TOGGLE, on purpose: maven-jdk21 declares none, and a failing test is not a
    #    finding to tour — it is a broken build. This stage stops even a report run.
    #    SEQUENTIAL AFTER sca-trivy ON PURPOSE, even though there is no data dependency and running
    #    the two side by side would shave ~25s off a green run. The lab's break-fix ladder is six
    #    runs, each red at ONE gate, and run 2 is "red at sca-trivy, ~3-4 min". A failed task does
    #    not cancel an in-flight sibling — Tekton finalizes the PipelineRun only when the running
    #    TaskRuns finish — so parallelising would make that 3-4 minute beat wait out an 8-minute
    #    unit-test before it reads Failed. 25s of a green run is not worth 5 minutes of every red one.
    - name: unit-test
      runAfter: [sast-sonar, sca-trivy]
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: maven-jdk21}
          - {name: namespace, value: ogsr-parasol-tasks}
      params:
        - name: GOALS
          value: ["-B", "-ntp", "test"]
      workspaces:
        # ONE workspace — same maven-cache story as sast-sonar above.
        - {name: source, workspace: shared-workspace}

    # 5) Build the image from the Containerfile; Tekton Chains SIGNS this TaskRun's image automatically.
    #    NO REPORT-MODE TOGGLE: the bundled buildah task has none, and a build that does not build has
    #    nothing downstream to report on. This stage stops even a report run.
    - name: build-image
      runAfter: [unit-test]
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: buildah}
          - {name: namespace, value: openshift-pipelines}
      params:
        - {name: IMAGE, value: $(params.image)}
        - {name: DOCKERFILE, value: ./Containerfile}
        - {name: TLS_VERIFY, value: "false"}
      workspaces:
        - {name: source, workspace: shared-workspace}

    # 6) Image scan GATE: RHACS build-time check (the trusted-supply-chain Block-Log4Shell policy) on the built image.
    - name: image-scan
      runAfter: [build-image]
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: acs-image-check}
          - {name: namespace, value: ogsr-parasol-tasks}
      params:
        - {name: IMAGE, value: $(params.image)}
        - {name: FAIL_ON_VIOLATION, value: $(params.enforce-gates)}

    # 7) Image size report (report-only) — the curated org library Task in action.
    - name: image-report
      runAfter: [build-image]
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: image-size-report}
          - {name: namespace, value: ogsr-parasol-tasks}
      params:
        - {name: IMAGE, value: $(params.image)}
        - {name: MAX_SIZE_MB, value: $(params.max-size-mb)}

    # 8) Sign + attest: wait for Tekton Chains to sign the build TaskRun (async) and GATE if unsigned.
    #    Inline taskSpec — a small oc poll needs no curated task. cosign verify --key is the richer
    #    attendee terminal beat (trusted-supply-chain); the signed annotation is the authoritative in-pipeline signal.
    #    NO REPORT-MODE TOGGLE, and deliberately not given one: `enforce-gates` softens gates that
    #    judge the ATTENDEE'S CODE, and this one judges the CLUSTER (is Chains installed and signing?).
    #    An unsigned image is a platform fault, not a finding to tour, so the inline `exit 1` below
    #    stops a report run too — after ~3 minutes of polling. Nothing in the seeds touches signing,
    #    so it passes on the seeded branch.
    - name: sign-check
      runAfter: [build-image]
      taskSpec:
        steps:
          - name: verify-signed
            # Digest-pinned; el8 `ose-cli:latest` was frozen on v4.15.0 with unapplied Critical errata.
            image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22@sha256:f8bbc73242af3eae3f8361a9611b29384d3577dba4d5e5b62f4beb2750862c19
            env:
              - name: PR_NAME
                value: $(context.pipelineRun.name)
            script: |
              #!/usr/bin/env bash
              set -uo pipefail
              echo "▶ waiting for Tekton Chains to sign + attest the build image (async)…"
              for i in $(seq 1 18); do
                SIGNED="$(oc get taskrun -l tekton.dev/pipelineRun=${PR_NAME},tekton.dev/pipelineTask=build-image \
                  -o jsonpath='{.items[0].metadata.annotations.chains\.tekton\.dev/signed}' 2>/dev/null || true)"
                if [ "$SIGNED" = "true" ]; then
                  echo "✅ build image signed + in-toto attested by Tekton Chains"
                  exit 0
                fi
                sleep 10
              done
              echo "❌ build image not signed after ~3m — is trust-signing (Tekton Chains cosign key) installed?"
              exit 1

    # 9) Config-security GATE: RHACS deploy-time check on the COMMITTED Deployment manifest (JUnit). The
    #    task reads deploy/parasol-claims-deployment.yaml from the checkout (source workspace) and fails
    #    on a deploy-policy violation — the seeded insecure manifest trips it; the hardened one passes.
    - name: deployment-check
      runAfter: [image-scan, sign-check]
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: roxctl-deployment-check}
          - {name: namespace, value: ogsr-parasol-tasks}
      params:
        - {name: IMAGE, value: $(params.image)}
        - {name: FAIL_ON_VIOLATION, value: $(params.enforce-gates)}
      workspaces:
        - {name: source, workspace: shared-workspace}

    # 10) Deploy the scanned/signed image AND create the browser-facing edge Route (no manual oc expose).
    - name: deploy
      runAfter: [deployment-check]
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: openshift-client}
          - {name: namespace, value: openshift-pipelines}
      params:
        - name: SCRIPT
          value: |
            if oc get deployment parasol-claims >/dev/null 2>&1; then
              oc set image deployment/parasol-claims parasol-claims="$(params.image)"
            else
              # --port=8080 puts a containerPort on the Deployment so `oc expose deployment` can
              # introspect it into a Service (the app listens on 8080).
              oc create deployment parasol-claims --image="$(params.image)" --port=8080
            fi
            # Wire the app to the ephemeral claims-db the app-security-testing entry state provides (tolerant if absent).
            if oc get secret claims-db >/dev/null 2>&1; then
              oc set env deployment/parasol-claims --from=secret/claims-db --containers=parasol-claims
            fi
            # Readiness probe so the Service/Route only front a LISTENING pod (Quarkus boots ~20-30s).
            oc set probe deployment/parasol-claims --readiness \
              --get-url=http://:8080/q/health/ready --initial-delay-seconds=5 --period-seconds=5
            # Force a fresh rollout: the image tag is :latest, so `oc set image` to the same string is a
            # no-op and a re-run's new image would never be pulled — the DAST fix (or any code fix) would
            # never reach the running pod. rollout restart pulls the new :latest every run.
            oc rollout restart deployment/parasol-claims
            oc rollout status deployment/parasol-claims --timeout=300s
            # Service first (the Route targets it), then the edge Route (edge + Allow = browser-reachable
            # over HTTPS; a plain oc expose serves HTTP-only and trips the router HSTS upgrade).
            oc get service parasol-claims >/dev/null 2>&1 || oc expose deployment parasol-claims --port=8080
            oc get route parasol-claims >/dev/null 2>&1 || \
              oc create route edge parasol-claims --service=parasol-claims --insecure-policy=Allow
            echo "▶ parasol-claims Route: https://$(oc get route parasol-claims -o jsonpath='{.spec.host}')"

    # 11) DAST GATE: ZAP baseline against the RUNNING app over the in-cluster Service DNS. FAIL_ON_WARN
    #     is true so missing security headers (a WARN-level finding) gate the build — the seeded app
    #     ships without them (red), the fix adds the Quarkus headers (green).
    #
    #     REPORT MODE IS HONEST HERE TOO, AS OF 2026-08-16, AND IT WAS NOT BEFORE. zap-baseline and
    #     k6-load-test each used to write their result twice — the truthful `false`, then a `true`
    #     straight over it on the very branch their FAIL_ON_* switch selects — so with
    #     enforce-gates=false these two stages printed an honest ⚠️ while `dast-passed` and
    #     `perf-passed` published `true` on a run that found the missing headers. Both Tasks now
    #     write their result once, before the mode is consulted, like the other four. All six
    #     results are therefore verdicts on the CODE, never on the run's exit status — which is
    #     exactly what tools/verify/app-security-testing.sh grades, and why a report run cannot
    #     satisfy it.
    #     THE SECOND HALF OF THAT FIX WAS ONLY VISIBLE ON A CLUSTER, and is worth knowing before
    #     anyone adds another gate here. zap-baseline ALSO handed ZAP `-I` whenever FAIL_ON_WARN was
    #     false — "do not return failure on warning" — so a WARN-only scan exited 0 instead of 2 and
    #     the reporting branch, which tests for 2, was dead code. A report run of THIS pipeline on
    #     the seeded branch printed "✅ DAST passed" and published dast-passed=true while the
    #     deployed app served none of the five headers (measured 2026-08-16, user5-cicd). The rule
    #     that catches this class: report mode may change what a gate DOES, never what it MEASURES —
    #     `-I` was a detection switch, exactly like sonar's QUALITY_GATE_WAIT and trivy's EXIT_CODE,
    #     and softening it destroyed the signal the softening was written around.
    #     STILL NOT SOFTENED HERE, on purpose: a ZAP FAIL rule (rc 1) or a ZAP error (rc 3). The
    #     seeded finding is WARN-level (missing headers), so a report run passes through; a genuine
    #     FAIL rule would stop it.
    - name: dast-zap
      runAfter: [deploy]
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: zap-baseline}
          - {name: namespace, value: ogsr-parasol-tasks}
      params:
        - {name: TARGET_URL, value: "http://parasol-claims.$(context.pipelineRun.namespace).svc:8080"}
        # Was the literal "true"; the param defaults to "true", so an unset run is unchanged.
        - {name: FAIL_ON_WARN, value: $(params.enforce-gates)}
      workspaces:
        - {name: zap-work, workspace: zap-work}

    # 12) PERF GATE: a short k6 load test against the RUNNING app over the in-cluster Service DNS. Gates
    #     on a p95 latency budget + a max error rate — k6's own non-zero exit on a breached threshold IS
    #     the gate (same shape as the DAST gate). The last gate in the gauntlet: a change can pass every
    #     security check and still regress performance.
    - name: perf-k6
      runAfter: [dast-zap]
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: k6-load-test}
          - {name: namespace, value: ogsr-parasol-tasks}
      params:
        - {name: TARGET_URL, value: "http://parasol-claims.$(context.pipelineRun.namespace).svc:8080"}
        # Was the literal "true"; the param defaults to "true", so an unset run is unchanged.
        # Same result-overwrite caveat as dast-zap above — see that stage's ⚠️ note.
        - {name: FAIL_ON_THRESHOLD, value: $(params.enforce-gates)}
      workspaces:
        - {name: k6-work, workspace: k6-work}
