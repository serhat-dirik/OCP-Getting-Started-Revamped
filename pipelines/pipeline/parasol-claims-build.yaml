# parasol-claims-build-test-deploy — the pipelines-fundamentals "build-test-deploy" Pipeline.
#
# WHY THIS EXISTS: the reference application pipeline attendees run, read, and evolve in pipelines-fundamentals.
# Every step is referenced by the CLUSTER RESOLVER (the supported ClusterTask replacement) — the
# bundled git-clone/buildah/openshift-client from the openshift-pipelines namespace, and the two
# curated tasks (maven-jdk21, image-size-report) from the shared parasol-tasks library. Nothing is
# copy-pasted: the whole point of pipelines-fundamentals is reuse.
#
#   fetch-source (git-clone) -> unit-test (parasol-tasks/maven-jdk21) -> build-image (buildah)
#     -> image-report (parasol-tasks/image-size-report) -> deploy (openshift-client)
#
# LOCKSTEP: this is the CANONICAL copy. The pipelines-fundamentals entry state ships the same
# Pipeline at gitops/entry-states/pipelines-fundamentals/templates/pipeline.yaml, which adds
# metadata.namespace ({user}-cicd) and the workshop.redhat.com/owner stamp and carries its own
# comments — the specs must match, nothing else has to. tools/lint/copy-drift-guard.py gates it
# (pair "pipelines-fundamentals-pipeline") in the lint workflow's copy-drift job, so an edit here
# that is not mirrored there fails CI by name instead of surfacing as a broken exercise in the room.
#
# Memory: the {user}-cicd namespace default container limit is sized for these Maven/Quarkus steps in
# gitops/workshop-config/templates/per-user-limits.yaml, so a plain run — the console Actions -> Start
# form, `tkn pipeline start`, a Pipelines-as-Code push, or `ws solve` — needs NO per-task memory
# overrides. The Pipeline itself stays runtime-agnostic (no computeResources baked in).
#
# ONE PVC-BACKED WORKSPACE PER TASK. Settled by measurement 2026-08-08 on cluster-6xxpf (OCP 4.22.8 /
# OpenShift Pipelines 1.23.1) after a persistent Maven cache added on 2026-08-07 made this Pipeline
# unrunnable. Both halves matter, so both are recorded here rather than in a commit message nobody
# reads at the point of temptation.
#
#   IT DOES NOT RUN. Tekton's Affinity Assistant defaults to `coschedule: workspaces` (the OPERATOR
#   default — platform-portfolio's tekton-config.yaml patches only spec.result.*), and in that mode
#   a TaskRun may mount exactly ONE PVC-backed workspace. `unit-test` bound two — shared-workspace
#   (a volumeClaimTemplate) and maven-cache (a claimName) — and every run died 27 seconds in with
#   `TaskRunValidationFailed` / "[User error] more than one PersistentVolumeClaim is bound", before
#   any step started, so the logs were empty and it read like a broken cluster.
#
#   AND IT WAS NOT WORTH FIXING. `coschedule: pipelineruns` lifts the cap and was tried: three real
#   runs of THIS Pipeline in one namespace, same source, same commit —
#     cold cache (bound, empty)          806s wall · unit-test 423s · mvn 06:39
#     warm cache (bound, 178MB/506 jars) 670s wall · unit-test 371s · mvn 05:42
#     NO cache  (this shape, default mode) 678s wall · unit-test 377s · mvn 06:03
#   A warm cache saved 8 seconds of an 11-minute run (1.2%) and the cold run — the one EVERY
#   attendee pays, since the cache starts empty — cost 128 seconds MORE than no cache at all. The
#   dependency download was never the expensive part; Quarkus compile and the test suite are.
#
# So: adding a second PVC-backed workspace here breaks the module on a stock cluster, and the only
# reason anyone wanted one has been measured to be worth nothing. tools/verify/pipelines-fundamentals.sh
# now asserts the constraint against the live Pipeline and the live cluster mode, so a re-add fails
# `ws verify` in two API reads instead of in the room.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: parasol-claims-build-test-deploy
  labels:
    app.kubernetes.io/part-of: parasol-claims
    workshop.redhat.com/module: pipelines-fundamentals
spec:
  params:
    - name: git-url
      type: string
      description: Source repository (defaults to the in-cluster Gitea shared repo).
      default: http://gitea.ogsr-gitea.svc:3000/parasol/parasol-claims.git
    - name: git-revision
      type: string
      description: Branch, tag, or commit to build.
      default: main
    - name: image
      type: string
      description: Fully-qualified target image reference (registry/namespace/name:tag).
      # Defaults to the run's OWN namespace registry path, so this Pipeline is portable across
      # every {user}-cicd namespace with no edit. (context vars resolve in the Pipeline spec,
      # not in a PipelineRun's own params — so the default lives here.)
      default: image-registry.openshift-image-registry.svc:5000/$(context.pipelineRun.namespace)/parasol-claims:latest
    - name: max-size-mb
      type: string
      description: Image size budget in MB, enforced (as a report) by image-size-report.
      default: "500"
  workspaces:
    # One shared PVC carries the checkout from git-clone through unit-test and the image build.
    # EXACTLY ONE PVC-backed workspace, and that is a constraint, not an accident — see the
    # header note. A second one was declared here on 2026-08-07 (a persistent Maven local
    # repository) and removed on 2026-08-08 after it was measured: it made every run of this
    # Pipeline unrunnable, and it bought nothing.
    - name: shared-workspace
  results:
    # Surface the library Task's verdict at the PipelineRun level for `tkn pr describe` / ws doctor.
    - name: image-size-mb
      value: $(tasks.image-report.results.image-size-mb)
    - name: image-within-budget
      value: $(tasks.image-report.results.within-budget)
  tasks:
    # 1) Clone the app source into the shared workspace (bundled task, cluster resolver).
    - name: fetch-source
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      params:
        # Bundled git-clone uses UPPERCASE param names (URL/REVISION).
        - name: URL
          value: $(params.git-url)
        - name: REVISION
          value: $(params.git-revision)
      workspaces:
        - name: output
          workspace: shared-workspace

    # 2) Run the unit tests (H2-backed, self-contained). A failing test gates the build.
    #    Uses the curated parasol-tasks/maven-jdk21 (NOT the bundled maven, which is JDK 17 and
    #    cannot compile this JDK 21 app) — the concrete payoff of curating an org task library.
    - name: unit-test
      runAfter:
        - fetch-source
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: maven-jdk21
          - name: namespace
            value: ogsr-parasol-tasks
      params:
        - name: GOALS
          value:
            - -B
            - -ntp
            - test
      workspaces:
        # ONE workspace, and it must stay one: maven-jdk21 also declares an optional `maven-cache`,
        # and mapping it here alongside `source` gives this TaskRun two PVC-backed workspaces —
        # which the Affinity Assistant refuses in its default mode. Read the header note before
        # adding it back.
        - name: source
          workspace: shared-workspace

    # 3) Build the image from the Containerfile and push it to the internal registry.
    #    TLS_VERIFY=false: the in-cluster registry serves a service-CA cert the build pod
    #    does not trust by default; the push is over the cluster-internal service only.
    - name: build-image
      runAfter:
        - unit-test
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      params:
        - name: IMAGE
          value: $(params.image)
        - name: DOCKERFILE
          value: ./Containerfile
        - name: TLS_VERIFY
          value: "false"
      workspaces:
        - name: source
          workspace: shared-workspace

    # 4) The curated org library Task in action: report image size + budget (cluster resolver
    #    into the SHARED parasol-tasks library — the "why we curate a task library" beat).
    - name: image-report
      runAfter:
        - build-image
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: image-size-report
          - name: namespace
            value: ogsr-parasol-tasks
      params:
        - name: IMAGE
          value: $(params.image)
        - name: MAX_SIZE_MB
          value: $(params.max-size-mb)

    # 5) Roll the freshly-built image out as a Deployment in the pipeline's own namespace
    #    (self-contained: no cross-namespace RBAC; the ns SA pulls its own image).
    - name: deploy
      runAfter:
        - image-report
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            if oc get deployment parasol-claims >/dev/null 2>&1; then
              oc set image deployment/parasol-claims parasol-claims="$(params.image)"
            else
              # --port=8080 puts a containerPort on the Deployment so `oc expose deployment`
              # can introspect it into a Service (the app listens on 8080). Without it, expose
              # fails with "couldn't find port via --port flag or introspection" (G3-pipelines-fundamentals SEV1).
              oc create deployment parasol-claims --image="$(params.image)" --port=8080
            fi
            # Wire the app to the ephemeral claims-db the pipelines-fundamentals entry state provides. Tolerant:
            # if the Secret is absent (e.g. a standalone run) the app just runs DB-less.
            # (No shell $(...) here — it would collide with Tekton variable substitution.)
            if oc get secret claims-db >/dev/null 2>&1; then
              oc set env deployment/parasol-claims --from=secret/claims-db --containers=parasol-claims
            fi
            # Readiness probe so Services/Routes only front a LISTENING pod: oc create deployment
            # ships none, and Quarkus takes ~20-30s to boot+connect the DB — without this, a fresh
            # `oc expose` serves the router 503 page during cold start (G3 re-check residual).
            oc set probe deployment/parasol-claims --readiness \
              --get-url=http://:8080/q/health/ready --initial-delay-seconds=5 --period-seconds=5
            oc rollout status deployment/parasol-claims --timeout=300s
            # Publish the app for the browser so the attendee never runs `oc expose` by hand: a Service,
            # then an EDGE-terminated Route (edge + --insecure-policy=Allow so both HTTP and HTTPS answer;
            # a plain `oc expose` serves HTTP-only and the router's HSTS upgrade then breaks it — the
            # project's browser-routes rule). Idempotent: a re-run skips what already exists. The final
            # jsonpath line prints the URL WITHOUT shell $(...) so nothing collides with Tekton subs.
            oc get service parasol-claims >/dev/null 2>&1 || oc expose deployment parasol-claims --port=8080
            oc get route parasol-claims   >/dev/null 2>&1 || \
              oc create route edge parasol-claims --service=parasol-claims --insecure-policy=Allow
            oc get route parasol-claims -o jsonpath='parasol-claims is live at https://{.spec.host}{"\n"}'
