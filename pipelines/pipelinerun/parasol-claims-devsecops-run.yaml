# parasol-claims-devsecops-run — an ad-hoc PipelineRun for the app-security-testing DevSecOps capstone. `oc create -f`
# this in a {user}-cicd namespace that has the sonar-auth + rox-api-token Secrets (the app-security-testing entry state
# copies them), or `tkn pipeline start parasol-claims-devsecops`.
#
# It carries the pieces that keep the capstone building inside a workshop namespace:
#   * a per-run shared-workspace PVC (volumeClaimTemplate) — carries the checkout through SAST/SCA/build;
#   * a zap-work emptyDir workspace — ZAP's writable /zap/wrk (reports live only for the run);
#   * a k6-work emptyDir workspace — where the perf gate writes its HTML dashboard report.
#
# EXACTLY ONE OF THOSE THREE IS A PVC, and that is load-bearing: with the Affinity Assistant in its
# default `coschedule: workspaces` mode a TaskRun may mount only one PersistentVolumeClaim, and
# emptyDir workspaces do not count. A fourth workspace binding a persistent Maven cache by claimName
# was added 2026-08-07 and removed 2026-08-08 — it made sast-sonar and unit-test fail validation in
# seconds, and a warm cache measured out at 1.2% of a run. See the header note in
# pipelines/pipeline/parasol-claims-build.yaml.
#
# NO per-task memory overrides: the {user}-cicd namespace default container limit is sized (2Gi) for
# these Maven/Quarkus steps in gitops/workshop-config/templates/per-user-limits.yaml, exactly as for
# the pipelines-fundamentals run. This file used to carry taskRunSpecs raising sast-sonar/unit-test to
# 1536Mi "above the 1Gi default" — but b39c31a raised that default to 2Gi and dropped the equivalent
# block from parasol-claims-run.yaml, and this copy was never revisited. The stale overrides had
# inverted: they CAPPED the two Maven-heavy steps 512Mi BELOW what the namespace already grants, so
# `oc create -f` this file gave a build LESS memory than the console Actions -> Start form or a plain
# `tkn pipeline start` of the same Pipeline. Let the namespace default apply.
#
# The image target is derived from the run's own namespace, so this file works unchanged in any
# {user}-cicd namespace. git-revision defaults to main (clean → gates pass); point it at the seeded
# fork branch to exercise the break-fix path.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: parasol-claims-devsecops-run-
  labels:
    app.kubernetes.io/part-of: parasol-claims
    workshop.redhat.com/module: app-security-testing
spec:
  pipelineRef:
    name: parasol-claims-devsecops
  taskRunTemplate:
    # The operator-provisioned per-namespace SA: bound to edit + system:image-builder, so it pushes,
    # deploys, creates the Route, and reads sibling TaskRuns (sign-check) in its own namespace.
    serviceAccountName: pipeline
  params:
    # image is intentionally omitted: the Pipeline defaults it to this run's own namespace path.
    - name: git-revision
      value: main
    - name: max-size-mb
      value: "500"
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    - name: zap-work
      emptyDir: {}
    - name: k6-work
      emptyDir: {}
