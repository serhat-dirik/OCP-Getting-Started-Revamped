# k6-load-test — curated Parasol "company task library" Task (DevSecOps performance gate).
#
# WHY THIS EXISTS: the org's load/performance step — the last gate in the DevSecOps gauntlet. Runs a
# short k6 load test against the DEPLOYED, RUNNING app over its in-cluster Service DNS and GATES on
# latency + error-rate thresholds (a p95 budget and a max error rate). This is the "is it still fast
# enough under load?" gate that sits alongside the security gates: a change can pass every security
# check and still regress performance — this catches that before it ships.
#
# HISTORY: the reference DevSecOps demo carried a Gatling perf test. We re-implement the same intent on
# k6 — a container-native load generator with first-class pass/fail thresholds and a self-contained HTML
# report — consistent with how the rest of this arc was re-implemented on current tooling (Gogs→Gitea,
# StackRox→RHACS, …) rather than ported. k6 exits non-zero when a threshold is breached, so the gate is
# the tool's own exit code (same shape as the zap-baseline DAST gate).
#
# By default (FAIL_ON_THRESHOLD=true) a breached threshold fails the build. Set FAIL_ON_THRESHOLD=false
# to run report-only (measure without gating) while you tune the budget to the cluster's node sizing.
#
# FAIL_ON_THRESHOLD SOFTENS THE EXIT CODE. IT DOES NOT SOFTEN THE VERDICT. Until 2026-08-16 this Task
# wrote perf-passed TWICE on the report-only branch — the truthful 'false', then a 'true' straight
# over it — so a run whose p95 blew the budget published a PASS while the log directly above it said
# ⚠️ thresholds were breached. That is the defect roxctl-deployment-check's own comment warns about
# ("a security gate that reports GREEN because it could not run is worse than no gate at all"), and
# it bit hardest exactly where the gate is deliberately not enforcing: the capstone's report-mode
# run, whose whole purpose is to publish findings without blocking. Now the result is written ONCE,
# before the mode is consulted, and never rewritten. Report-only changes what this Task does to the
# PIPELINE (exit 0); it does not change what this Task SAYS about the app's performance.
# At this Task's own FAIL_ON_THRESHOLD=true default nothing changes at all — that branch was never
# reached — so the correction is inert for every caller that has not opted into report-only.
#
# CANONICAL SOURCE. The identical Task body is installed into the shared parasol-tasks library by the
# workshop layer (gitops/workshop-config/templates/parasol-tasks.yaml) — kept in lockstep by
# tools/lint/copy-drift-guard.py (pair "parasol-task-k6-load-test", lint workflow's copy-drift job).
# The library copy is identical to this one except for an injected workshop.redhat.com/owner label.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: k6-load-test
  namespace: ogsr-parasol-tasks
  labels:
    app.kubernetes.io/part-of: parasol
    workshop.redhat.com/library: parasol-tasks
spec:
  description: >-
    Runs a short k6 load test against a running app's in-cluster Service DNS and fails the build when a
    latency (p95) or error-rate threshold is breached. Writes a self-contained HTML report to the
    k6-work workspace.
  params:
    - name: TARGET_URL
      type: string
      description: In-cluster base URL of the running app (Service DNS), e.g. http://parasol-claims:8080.
      default: "http://parasol-claims:8080"
    - name: VUS
      type: string
      description: Virtual users (concurrent load) to sustain for DURATION.
      default: "10"
    - name: DURATION
      type: string
      description: How long to sustain the load (k6 duration string, e.g. 30s, 1m).
      default: "30s"
    - name: P95_THRESHOLD_MS
      type: string
      description: Gate — 95th-percentile request duration budget in milliseconds.
      default: "800"
    - name: MAX_ERROR_RATE
      type: string
      description: Gate — maximum fraction of failed requests tolerated (0.01 = 1%).
      default: "0.01"
    - name: FAIL_ON_THRESHOLD
      type: string
      description: >-
        "true" (default) fails the build on a breached threshold; "false" runs report-only. It
        controls ENFORCEMENT only: perf-passed reports what k6 actually measured either way, so a
        breached run at "false" succeeds AND publishes perf-passed=false.
      default: "true"
  workspaces:
    # k6 writes its HTML dashboard report here (the run mounts an empty workspace). The container FS is
    # not writable under the restricted-v2 random UID, so the report + script go to the workspace.
    - name: k6-work
  results:
    - name: perf-passed
      description: '"true" if no latency/error threshold was breached, else "false".'
  steps:
    - name: k6-load-test
      # k6 (Grafana Labs, AGPL-3.0), the container-native load generator. Third-party OSS.
      # Pinned to grafana/k6:latest's multi-arch digest — k6 v2.1.0, verified on-cluster 2026-07-17;
      # honours the K6_WEB_DASHBOARD/_EXPORT flags below. Re-pin with:
      #   oc image info --filter-by-os linux/amd64 -o json docker.io/grafana/k6:latest | jq -r .listDigest
      image: docker.io/grafana/k6@sha256:e7eeddf1ce2361df6920d925297f487c0ba549c44be242c6a9c22f28d9b08efa
      workingDir: $(workspaces.k6-work.path)
      env:
        - name: TARGET_URL
          value: $(params.TARGET_URL)
        - name: VUS
          value: $(params.VUS)
        - name: DURATION
          value: $(params.DURATION)
        - name: P95_THRESHOLD_MS
          value: $(params.P95_THRESHOLD_MS)
        - name: MAX_ERROR_RATE
          value: $(params.MAX_ERROR_RATE)
        - name: FAIL_ON_THRESHOLD
          value: $(params.FAIL_ON_THRESHOLD)
      script: |
        #!/bin/sh
        # grafana/k6 is a minimal Alpine image with busybox /bin/sh and NO bash — the shebang must be sh.
        set -uo pipefail
        echo "▶ k6 load test (perf gate) against ${TARGET_URL}"
        echo "  load: ${VUS} VUs for ${DURATION}   gate: p95<${P95_THRESHOLD_MS}ms, errors<${MAX_ERROR_RATE}"
        export HOME="$(pwd)"
        # The load profile: read-only hits on the claims API + health endpoint — safe, idempotent, and
        # representative of the service's hot path. Thresholds live in options{} so k6's own exit code
        # (non-zero on breach) IS the gate.
        cat > load-test.js <<'EOF'
        import http from 'k6/http';
        import { check, sleep } from 'k6';

        const BASE = __ENV.TARGET_URL;

        export const options = {
          vus: Number(__ENV.VUS) || 10,
          duration: __ENV.DURATION || '30s',
          thresholds: {
            http_req_duration: [`p(95)<${Number(__ENV.P95_THRESHOLD_MS) || 800}`],
            http_req_failed: [`rate<${Number(__ENV.MAX_ERROR_RATE) || 0.01}`],
          },
        };

        export default function () {
          const list = http.get(`${BASE}/api/claims`);
          check(list, { 'GET /api/claims -> 200': (r) => r.status === 200 });

          const health = http.get(`${BASE}/q/health/ready`);
          check(health, { 'GET /q/health/ready -> 200': (r) => r.status === 200 });

          sleep(1);
        }
        EOF
        # k6's built-in web dashboard writes one self-contained HTML report at the end of the run — the
        # "load-test report" artifact (analogous to the ZAP HTML report), saved to the k6-work workspace.
        export K6_WEB_DASHBOARD=true
        export K6_WEB_DASHBOARD_EXPORT=k6-report.html
        k6 run load-test.js
        RC=$?
        # k6 exits 0 when every threshold held, non-zero when a threshold was breached (or on error).
        if [ "$RC" -eq 0 ]; then
          echo "✅ perf gate passed — p95 within ${P95_THRESHOLD_MS}ms budget (report in k6-work)"
          printf 'true' > "$(results.perf-passed.path)"
          exit 0
        fi
        # WRITTEN ONCE, BEFORE THE MODE IS CONSULTED, AND NEVER REWRITTEN BELOW. A second
        # `printf 'true'` on the report-only branch is the defect described in this file's header:
        # it makes a run that blew its latency budget publish a PASS. Do not put one back.
        printf 'false' > "$(results.perf-passed.path)"
        if [ "${FAIL_ON_THRESHOLD}" = "false" ]; then
          echo "⚠️  perf thresholds breached — REPORTING ONLY (FAIL_ON_THRESHOLD=false), so this gate"
          echo "   did NOT stop the pipeline. Result perf-passed=false: the breach is real and still"
          echo "   open. Findings: the k6 threshold summary above (the ✗ rows), and the HTML report"
          echo "   in the k6-work workspace (k6-report.html)."
          # An honest report has to say when it is reporting NOTHING. The web dashboard export is
          # written at the END of a completed run, so its presence separates "the app really missed
          # its budget" from "k6 never reached the target" (a non-zero exit covers both). Message
          # only — the exit status is 0 either way, deliberately: report-only must not turn an
          # unreachable target into a stop.
          if [ -f k6-report.html ]; then
            echo "   (k6 completed the run and wrote its report, so this is a real perf finding)"
          else
            echo "   (NOTE: no k6-report.html was written — k6 may never have reached the target."
            echo "    Read the output above: 'not measured' is not 'fast enough'.)"
          fi
          exit 0
        fi
        echo "❌ perf gate FAILED — a latency/error threshold was breached under load."
        echo "   fix: profile the hot path (DB round-trips, cold start, a missing index), raise resources,"
        echo "        or re-tune the budget to the cluster, then re-run."
        exit "$RC"
