# sonar-scan — curated Parasol "company task library" Task (app-security-testing DevSecOps SAST gate).
#
# WHY THIS EXISTS: the org's SAST step. Runs a SonarQube (Community Build) analysis of a Maven service
# and GATES the pipeline on a red quality gate — sonar.qualitygate.wait=true polls the compute-engine
# task and returns a NON-ZERO exit on a red gate, so the pipeline fails when new issues cross the gate
# (e.g. a hardcoded credential, rule S2068). Three steps: generate-settings, compile (Java rules need
# bytecode), then scan.
#
# WHY IT HAS A CACHE WORKSPACE, AND WHY NOTHING IN THIS REPO BINDS IT (2026-08-07 → 2026-08-08).
# The `compile` step invoked /usr/bin/mvn with no settings file, so Maven's local repository lived in
# the container filesystem and died with the TaskRun pod. The optional maven-cache workspace was
# added to fix that; it is KEPT, because a curated org library should offer the capability, and
# because MAVEN_MIRROR_URL and the settings.xml generation ride in the same step.
#
# The capstone STOPPED binding it on 2026-08-08, and an adopter should read why before turning it on.
# Two findings, both measured on cluster-6xxpf (OCP 4.22.8 / Pipelines 1.23.1):
#   * IT COULD NOT RUN. Binding it beside `source` gives the TaskRun two PVC-backed workspaces, and
#     Tekton's Affinity Assistant permits one in its default `coschedule: workspaces` mode. Every
#     capstone run failed at its first Maven gate in seconds — before a step started, so no logs.
#   * IT WAS NOT WORTH THE WORKAROUND. With coschedule=pipelineruns (which lifts the cap), three
#     real runs of the sibling pipeline gave: cold cache 806s, warm cache 670s, NO cache 678s. A
#     warm cache saved 1.2%; the cold run every attendee actually pays cost 19% MORE than none.
# The "six red-gate → fix → re-run iterations" argument that motivated this does not survive those
# numbers: six times 1.2% of a run is under a minute of a capstone.
#
# The design is mirrored from pipelines/tasks/maven-jdk21.yaml — optional maven-cache workspace, one
# generate-settings step that writes a single settings.xml, and the MAVEN_MIRROR_URL param — so the
# curated library has ONE Maven-caching pattern and not two. The settings generation stays in its
# own step even though `compile` already has a shell (maven-jdk21 needed a separate step because its
# mvn step is command/args and has none): a maintainer fixing the XML escaping or the unbound-
# workspace hint should find the same block in the same place in both Tasks.
#
# CONTRACT: a Secret `sonar-auth` in the run namespace with keys `sonar-token` (a SonarQube analysis
# token) and `sonar-host-url` (the in-cluster web URL). The appsec stack mints it in
# sonarqube/sonar-ci-token; the app-security-testing entry state copies it per-user into {user}-cicd. The token is never
# echoed. The community edition has no branch/PR analysis — this is main-revision analysis + a gate.
#
# REPORT MODE IS `FAIL_ON_VIOLATION=false`, AND IT IS *NOT* `QUALITY_GATE_WAIT=false`. That
# distinction is the whole point and it is easy to get backwards, so it is spelled out here.
# QUALITY_GATE_WAIT is the DETECTOR: `sonar.qualitygate.wait=false` makes sonar-scanner submit the
# analysis and return WITHOUT polling the compute engine, so its exit status is 0 no matter what the
# gate says. This Task would then take its success branch, print "✅ SonarQube quality gate PASSED"
# and write quality-gate-passed=true — on a run whose gate is red and whose S2068 finding is sitting
# on the dashboard. A "report" that asserts a pass is worse than no report, for the same reason
# roxctl-deployment-check spells out at length: a security gate that reports GREEN because it did
# not look is worse than no gate at all.
# So report mode weakens ENFORCEMENT only, never DETECTION: QUALITY_GATE_WAIT stays "true", the
# scanner still polls and still returns non-zero on a red gate, the Task still writes
# quality-gate-passed=FALSE — and only the exit code is softened to 0 so the pipeline continues, with
# a ⚠️ line that says in words that the gate did not enforce. Same shape, same param NAME and same
# polarity as acs-image-check and roxctl-deployment-check in this library.
#
# CANONICAL SOURCE. The identical Task is installed into the shared parasol-tasks library by the
# workshop layer (gitops/workshop-config/templates/parasol-tasks.yaml) — kept in lockstep by
# tools/lint/copy-drift-guard.py (pair "parasol-task-sonar-scan", lint workflow's copy-drift job).
# The library copy is identical to this one except for an injected workshop.redhat.com/owner label.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sonar-scan
  namespace: ogsr-parasol-tasks
  labels:
    app.kubernetes.io/part-of: parasol
    workshop.redhat.com/library: parasol-tasks
spec:
  description: >-
    Runs a SonarQube (Community Build) SAST analysis of a Maven project and fails the build on a red
    quality gate (sonar.qualitygate.wait=true). Reads the SonarQube endpoint + analysis token from the
    sonar-auth Secret in the run namespace. Reuses a persistent Maven local repository when the
    optional maven-cache workspace is bound, and honours a repository mirror via MAVEN_MIRROR_URL.
  params:
    - name: SONAR_PROJECT_KEY
      type: string
      description: SonarQube project key. Per-user is recommended (e.g. parasol-claims-user1).
      default: parasol-claims
    - name: SONAR_PROJECT_NAME
      type: string
      description: Human-readable project name shown on the dashboard.
      default: "Parasol Claims"
    - name: SUBDIRECTORY
      type: string
      description: Path within the workspace that holds the pom.xml.
      default: "."
    - name: QUALITY_GATE_WAIT
      type: string
      description: >-
        The DETECTOR, not the report switch. "true" (default) polls the compute engine so the scanner
        learns the gate's verdict and exits non-zero when it is red. "false" makes the scanner return
        immediately with status 0 whatever the gate says — which blinds this Task, so it is NOT how
        you run a reporting pass. Use FAIL_ON_VIOLATION=false for that.
      default: "true"
    - name: FAIL_ON_VIOLATION
      type: string
      description: >-
        "true" (default) gates the build on a red quality gate; "false" runs REPORT MODE — the
        analysis and the gate poll still happen, quality-gate-passed still records the TRUTH, and the
        Task exits 0 so the pipeline continues. Same name/polarity as acs-image-check and
        roxctl-deployment-check, so one pipeline param can drive every gate in this library.
      default: "true"
    - name: MAVEN_MIRROR_URL
      type: string
      description: >-
        Repository mirror URL (a corporate Nexus/Artifactory) for the compile step. Empty — the
        default — leaves Maven pointed at its own repositories. Same param NAME and semantics as the
        shipped upstream `maven` Task and as the curated maven-jdk21 (mirror id "mirror.default",
        mirrorOf "central"), so an org adopting this library configures both Tasks the same way.
      default: ""
  workspaces:
    # The source checkout (git-clone writes here); compile + scan run against it in place.
    - name: source
    # The Maven local repository (~/.m2/repository), as a volume that OUTLIVES the TaskRun pod.
    # OPTIONAL for the same reason it is optional on maven-jdk21: this Task is referenced by cluster
    # resolver from pipelines this repo does not own, and a required workspace would break every
    # existing caller the moment it landed. A caller that does not bind it still runs, just uncached
    # — see generate-settings, which prints exactly that and how to fix it. Bind it to an EXISTING
    # PersistentVolumeClaim, NOT a volumeClaimTemplate: a template is created and destroyed per run,
    # so it caches nothing between runs, which is the whole defect.
    - name: maven-cache
      optional: true
  volumes:
    # Carries the generated settings.xml from generate-settings to compile. NOT the source
    # workspace: a stray file there lands in what SonarQube analyses (sonar.sources) and in any
    # later build context. Not the cache workspace either — it must exist when the cache is unbound.
    - name: maven-settings
      emptyDir: {}
  results:
    - name: quality-gate-passed
      description: '"true" if the SonarQube quality gate passed, else "false".'
  steps:
    - name: generate-settings
      # Same image as the compile step below, so this costs no extra pull: it is already on the node.
      #
      # PINNED BY DIGEST, NOT `:latest` (2026-08-07), for the reason maven-jdk21 gives at length:
      # Module 4 teaches the mutable-tag trap and the supply-chain module teaches promote-by-digest,
      # so a curated org-standard Task has to model the org standard. Here it also protects the gate
      # itself — a floating tag means the bytecode SonarQube analyses can come from a different JDK
      # build between two runs of the same pipeline, which is precisely the kind of unrecorded
      # variable a SAST gate must not have.
      #
      # TAG → DIGEST, resolved 2026-08-07 against registry.access.redhat.com:
      #   ubi9/openjdk-21:latest
      #     → sha256:24dad82bd5d25d9b0c85f0e9c976e47ccce787cc73792355462bf54fe03d9a77
      #   image 1.24-3.1785873424, built 2026-08-04; JAVA_VERSION=21, MAVEN_VERSION=3.9.
      # The multi-arch INDEX digest, deliberately not one of its four per-arch children (amd64
      # 49df3da0…, arm64 8c2ea9b9…, ppc64le c9c27093…, s390x 5bb5f9b1…), which would pin the Task to
      # one node architecture. Same digest as maven-jdk21 on purpose: one image for the library.
      # Re-resolve — this prints the index digest the tag points at TODAY:
      #   oc image info --show-multiarch registry.access.redhat.com/ubi9/openjdk-21:latest
      image: registry.access.redhat.com/ubi9/openjdk-21@sha256:24dad82bd5d25d9b0c85f0e9c976e47ccce787cc73792355462bf54fe03d9a77
      volumeMounts:
        - name: maven-settings
          mountPath: /maven-settings
      env:
        # "true"/"false". An UNBOUND optional workspace resolves $(workspaces.maven-cache.path) to
        # the EMPTY STRING, so -Dmaven.repo.local=$(…path) would expand to `-Dmaven.repo.local=` and
        # break Maven outright. `.bound` is the only honest discriminator.
        - name: CACHE_BOUND
          value: $(workspaces.maven-cache.bound)
        - name: CACHE_PATH
          value: $(workspaces.maven-cache.path)
        - name: MAVEN_MIRROR_URL
          value: $(params.MAVEN_MIRROR_URL)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        SETTINGS=/maven-settings/settings.xml

        # XML-escape the mirror URL before it goes into an element: an `&` in a query string makes
        # settings.xml unparseable and Maven then fails with "Non-parseable settings", which reads
        # like a broken Task rather than a bad parameter. `&` first — escaping it after `<`/`>`
        # would double-escape the ampersands those two just introduced.
        MIRROR_ESC="$(printf '%s' "${MAVEN_MIRROR_URL}" \
          | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')"

        if [ "${CACHE_BOUND}" = "true" ]; then
          mkdir -p "${CACHE_PATH}/repository"
        fi

        {
          echo '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">'
          # <localRepository> rather than -Dmaven.repo.local, so the ONE generated file carries both
          # the cache and the mirror and the compile step below stays a plain `mvn` invocation.
          if [ "${CACHE_BOUND}" = "true" ]; then
            echo "  <localRepository>${CACHE_PATH}/repository</localRepository>"
          fi
          if [ -n "${MAVEN_MIRROR_URL}" ]; then
            echo '  <mirrors>'
            echo '    <mirror>'
            echo '      <id>mirror.default</id>'
            echo "      <url>${MIRROR_ESC}</url>"
            echo '      <mirrorOf>central</mirrorOf>'
            echo '    </mirror>'
            echo '  </mirrors>'
          fi
          echo '</settings>'
        } > "${SETTINGS}"

        if [ "${CACHE_BOUND}" = "true" ]; then
          echo "✅ Maven local repository: ${CACHE_PATH}/repository (persistent — survives this run)"
        else
          echo "ℹ️  no maven-cache workspace bound — Maven resolves into this pod's own filesystem,"
          echo "   so the dependency tree is fetched on every run. That is what the Parasol"
          echo "   pipelines do on purpose: measured 2026-08-08, a warm cache was worth 1.2% of an"
          echo "   11-minute run, and the Affinity Assistant's default coschedule=workspaces mode"
          echo "   allows one PVC-backed workspace per TaskRun — which \`source\` already is."
          echo "   An org whose build really is download-bound can bind this workspace to an"
          echo "   EXISTING PersistentVolumeClaim (never a volumeClaimTemplate) once its cluster"
          echo "   sets TektonConfig spec.pipeline.coschedule to pipelineruns to make room for it."
        fi
        if [ -n "${MAVEN_MIRROR_URL}" ]; then
          echo "✅ repository mirror: ${MAVEN_MIRROR_URL} (mirrorOf central)"
        fi
    - name: compile
      # SonarQube Java rules need compiled bytecode (sonar.java.binaries) — produce target/classes with
      # the same UBI9 OpenJDK 21 runner as the parasol-tasks maven-jdk21 Task.
      # THE SAME DIGEST as generate-settings above, on purpose: one pull, and the settings that step
      # wrote provably belong to this Maven. Change both or neither; provenance is on that step.
      image: registry.access.redhat.com/ubi9/openjdk-21@sha256:24dad82bd5d25d9b0c85f0e9c976e47ccce787cc73792355462bf54fe03d9a77
      workingDir: $(workspaces.source.path)/$(params.SUBDIRECTORY)
      volumeMounts:
        - name: maven-settings
          mountPath: /maven-settings
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "▶ compiling for SonarQube analysis (Java rules require bytecode)…"
        # -s points Maven at the generated settings.xml, which is what carries the persistent local
        # repository (and the mirror) — without it this step re-downloads the whole tree every run.
        /usr/bin/mvn -s /maven-settings/settings.xml -B -ntp -DskipTests compile
    - name: sonar-scanner
      # SonarScanner CLI 12.x, digest-pinned (verified live 2026-07-15). Third-party OSS.
      image: docker.io/sonarsource/sonar-scanner-cli:12@sha256:23ca0f137965d9dff2198074043fd48d386280bc5d0ccac8c8349cea4cf096a9
      workingDir: $(workspaces.source.path)/$(params.SUBDIRECTORY)
      env:
        # Endpoint + token from the run-namespace secret; the token value is never echoed.
        - name: SONAR_HOST_URL
          valueFrom:
            secretKeyRef:
              name: sonar-auth
              key: sonar-host-url
        - name: SONAR_TOKEN
          valueFrom:
            secretKeyRef:
              name: sonar-auth
              key: sonar-token
        # Writable scanner cache/home under restricted-v2 SCC (random UID cannot write the image HOME).
        - name: SONAR_USER_HOME
          value: /tmp/.sonar
        - name: PROJECT_KEY
          value: $(params.SONAR_PROJECT_KEY)
        - name: PROJECT_NAME
          value: $(params.SONAR_PROJECT_NAME)
        - name: QUALITY_GATE_WAIT
          value: $(params.QUALITY_GATE_WAIT)
        - name: FAIL_ON_VIOLATION
          value: $(params.FAIL_ON_VIOLATION)
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        echo "▶ SonarQube analysis: ${PROJECT_KEY} → ${SONAR_HOST_URL}"
        # sonar-scanner reads SONAR_HOST_URL + SONAR_TOKEN from env. qualitygate.wait=true polls the
        # compute engine and returns a non-zero exit on a RED gate — this is the SAST gate.
        sonar-scanner \
          -Dsonar.projectKey="${PROJECT_KEY}" \
          -Dsonar.projectName="${PROJECT_NAME}" \
          -Dsonar.sources=src/main \
          -Dsonar.java.binaries=target/classes \
          -Dsonar.qualitygate.wait="${QUALITY_GATE_WAIT}"
        RC=$?
        if [ "$RC" -eq 0 ]; then
          echo "✅ SonarQube quality gate PASSED"
          printf 'true' > "$(results.quality-gate-passed.path)"
          exit 0
        fi
        # THE RESULT IS WRITTEN BEFORE THE MODE IS CONSULTED, and is never rewritten below. Report
        # mode changes what this Task does to the PIPELINE (exit 0 instead of exit RC); it does not
        # change what this Task SAYS about the code. Anything that reassigns this to 'true' on a
        # non-zero RC has re-created the defect the header describes.
        printf 'false' > "$(results.quality-gate-passed.path)"
        if [ "${FAIL_ON_VIOLATION}" = "false" ]; then
          echo "⚠️  SonarQube quality gate did NOT pass — REPORTING ONLY (FAIL_ON_VIOLATION=false),"
          echo "   so this gate did NOT stop the pipeline. Result quality-gate-passed=false."
          echo "   findings: ${SONAR_HOST_URL}/dashboard?id=${PROJECT_KEY}  → Issues"
          # An honest report has to say when it is reporting NOTHING. report-task.txt is written by
          # the scanner the moment the analysis is accepted by the server, i.e. before any gate poll,
          # so its presence separates "the gate really is red" from "the scanner never got that far"
          # (bad token, unreachable host, no bytecode). Message only — the exit status above is the
          # same either way, deliberately: report mode must not turn a broken scanner into a stop.
          if [ -f .scannerwork/report-task.txt ]; then
            echo "   (the analysis reached SonarQube — .scannerwork/report-task.txt exists — so this"
            echo "    is a real gate verdict, not a scanner failure)"
          else
            echo "   (NOTE: no .scannerwork/report-task.txt — the analysis may never have reached"
            echo "    SonarQube. Read the scanner output above: 'not measured' is not 'clean'.)"
          fi
          exit 0
        fi
        echo "❌ SonarQube quality gate FAILED (or analysis error)."
        echo "   dashboard: ${SONAR_HOST_URL}/dashboard?id=${PROJECT_KEY}"
        echo "   fix: resolve the new issues (e.g. remove the hardcoded credential — rule S2068), then re-run."
        exit "$RC"
