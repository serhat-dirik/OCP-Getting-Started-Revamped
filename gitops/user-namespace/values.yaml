# Usage: helm template gitops/user-namespace --set user=user1 --set suffixes=dev,stage,prod
# Rendered by an Argo CD Application (attendees cannot create Namespace/ResourceQuota themselves —
# verified with a real server-side dry-run as user1, both Forbidden — so `ws` materializes
# namespaces by pointing an Application at this chart, not by applying anything itself).
#
# `suffixes` is a comma-separated SCALAR STRING, split by the chart itself (splitList ","), NOT a
# Helm list parameter: Argo CD's helm.parameters does not expand `{a,b,c}` list literals the way
# the `helm` CLI does, so a list-typed parameter would silently render wrong when Argo (not a human
# running `helm template`) is the one setting it. One Application covers a whole module's
# namespaces this way (e.g. config-multienv needs dev+stage+prod in one Application). A single
# suffix (`--set suffixes=dev`) works identically to a comma-joined list of one.
#
# Both values are required and FAIL LOUDLY (helm `fail`, see templates/_helpers.tpl
# assertInputs) if empty or if any suffix isn't one of the 13 gitops/workshop-config renders today.
user: ""
suffixes: ""

# Argo CD instance ATTENDEES write to (ADR-0002 amendment 1,
# gitops/workshop-config/templates/student-argocd.yaml). MUST match gitops/workshop-config
# values.yaml's studentArgoNamespace: a namespace-scoped GitOps operator's managed-by enrollment
# keys off THIS NAMESPACE VALUE (not the ArgoCD CR's .metadata.name, which stays unprefixed on
# purpose for Route-host stability). SEV1 2026-07-18 was caused by exactly this value drifting
# between the two files that independently carry it — if you ever change one, change both.
studentArgoNamespace: ogsr-student-gitops
