apiVersion: v2
name: user-namespace
description: >-
  Renders the COMPLETE object set for ONE per-user workshop namespace
  (Namespace + ResourceQuota + LimitRange + RoleBinding(s)), parameterized by
  `user` and `suffix` — `helm template gitops/user-namespace --set user=user1
  --set suffix=dev` and nothing else. Lets `ws prep` materialize namespaces on
  demand instead of gitops/workshop-config's eager userCount x 13-suffix
  render. This chart is a faithful re-encoding of
  gitops/workshop-config/templates/per-user-*.yaml — it does not change any
  value, label, or RBAC grant those templates already produce; see that
  chart's per-template header comments for the incidents that justify each
  number/label (SEV1s etc.) — they are carried over verbatim here.
type: application
version: 0.1.0
appVersion: "1.0"
