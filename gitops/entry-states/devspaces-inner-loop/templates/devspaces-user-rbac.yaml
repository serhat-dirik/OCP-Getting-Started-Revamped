{{/*
The attendee's rights in their own {user}-devspaces, granted at prep. Dev Spaces binds exactly these
two ClusterRoles itself, but only when the attendee first signs in to its dashboard, which is
exercise 1. Until then the attendee could not read the namespace or the workspace this chart creates
(so `ws prep` could never say "ready"), and `ws reset` could not delete the workspace before the
namespace goes (see purge_devworkspaces in tools/ws/ws). Our own names, so Dev Spaces' bindings, added
at sign-in, sit beside these instead of fighting them; the owner label keeps purge_ns from removing them.
*/}}
{{- range .Values.cheUserClusterRoles }}
---
# why: {{ $.Values.user }} gets Dev Spaces' own per-user rights in {{ $.Values.user }}-devspaces from prep onward.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ogsr-{{ . }}
  namespace: {{ $.Values.user }}-devspaces
  labels:
    workshop.redhat.com/module: devspaces-inner-loop
    workshop.redhat.com/user: {{ $.Values.user | quote }}
    {{- include "user-namespace.ownerLabels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ . }}
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: {{ $.Values.user | quote }}
{{- end }}
