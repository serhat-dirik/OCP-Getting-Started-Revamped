# Injected by ws start (helm parameters); defaults here serve local `helm template` dev.
user: user1
clusterDomain: apps.example.com
# ws solve sets true → devspaces-inner-loop has NO extra END state to render: its end state is a running
# Dev Spaces workspace + a code change (human/IDE artifacts that can't be materialized as
# manifests), so `ws solve devspaces-inner-loop` == `ws start devspaces-inner-loop`. The demo is performed live from here.
# The key must exist so `ws solve` doesn't refuse the module.
solve: false
# Where the in-cluster Gitea lives and which repo each user forks (independent of build-deliver).
giteaNamespace: ogsr-gitea
sourceOrg: parasol
sourceRepo: parasol-claims

# BEGIN gen-entry-namespaces manageNamespaces — GENERATED by tools/gen-entry-namespaces.sh, DO NOT EDIT
# This chart's own Namespace/ResourceQuota/LimitRange/RoleBinding render
# (templates/ns-user-namespaces.yaml) is a no-op while this is false. gitops/workshop-config still
# creates all 13 per-user namespaces eagerly today (verified live 2026-08-02: user4-dev carries
# tracking-id workshop-config:/Namespace:openshift-gitops/user4-dev, and the workshop-config
# Application runs prune=true/selfHeal=true) — if this chart ALSO rendered the same Namespace while
# workshop-config still owns it, two Applications would fight over the same object (this chart's
# sync-wave/sync-options annotations stripped by workshop-config's selfHeal, re-added by this
# chart, forever). Flipping this to true is a DELIBERATE migration step that MUST land in the SAME
# change as removing workshop-config's per-user namespace rendering, never before.
manageNamespaces: false
# END gen-entry-namespaces manageNamespaces

# ── Dev Spaces editor resolution ────────────────────────────────────────────────────────────────
# Same mechanism and same values as gitops/entry-states/ai-assisted-development — see the long
# DECISION comment on that chart's `contributions:` block for why the dashboard editor API is the
# permanent answer and not an interim hack. Kept as values so a service rename is an override, not
# a template edit.
cheEditorId: che-incubator/che-code/latest
cheDashboardService: devspaces-dashboard
cheDashboardNamespace: openshift-devspaces
cheDashboardPort: "8080"
