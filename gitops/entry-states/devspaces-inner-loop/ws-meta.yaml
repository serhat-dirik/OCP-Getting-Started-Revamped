# Namespaces this module needs to EXIST before its entry state can materialize. Consumed by
# `ws prep` -> the per-user namespace Application, so a namespace is created on demand rather
# than all 13 existing up front. NOT the same list as purgeNamespaces below: that answers
# "what do I empty on reset", and at least one module (multi-tenancy-workload-security) needs a
# namespace it deliberately must NOT purge, because a cohabitant module's work lives there.
namespaces:
  - "dev"

# ws reset purges user-created leftovers from these namespaces before re-materializing.
# devspaces-inner-loop's entry state is "claims app + DB in {user}-dev" (build-deliver end state, composed directly).
# {user}-devspaces holds the Dev Spaces workspace the attendee starts during the lab — purge
# it too so reset removes the workspace pod + PVC (the namespace is auto-provisioned by the
# Dev Spaces dashboard on first login, so it may not exist yet; the purge no-ops if absent).
purgeNamespaces:
  - "${USER}-dev"
  - "${USER}-devspaces"
# Same claims-stack workloads as build-deliver/config-multienv/storage-stateful — coexisting entry apps deadlock (G3-config-multienv);
# ws start/solve evicts these before materializing; platform-orientation is listed too (shares {user}-dev — same-namespace = conflict, 2026-07-10 policy). Only cross-namespace modules (jobs-batch-kueue) truly coexist.
conflictsWith:
  - platform-orientation
  - build-deliver
  - config-multienv
  - storage-stateful
  - gitops-fundamentals
  - gitops-at-scale
  - developer-hub-golden-paths
  - observability-health-scale
  - application-logging
  - securing-apps-keycloak
  - multi-tenancy-workload-security
  - networking-dev-devops
  - deployment-targets-scheduling
  - registry-images-catalog-governance
  - serverless-zero-to-hero
  - eventing-deep-dive
  - ai-assisted-development
  - packaging-distributing

# Representative attendee muscle devspaces-inner-loop leans on, beyond the generic cockpit/identity battery.
# The lab itself runs INSIDE the Dev Spaces IDE, so the cockpit can only assert the world the workspace
# reaches back into: (1) the claims-db Service is what the dev-mode Quarkus process resolves by cluster
# DNS, and (2) exercise 3 curls $CLAIMS_HOST — read off this Route — to prove the pushed change is live.
# Deliberately NOT `oc get devworkspace -n {user}-devspaces`: neither this chart nor workshop-config
# grants {user} any RoleBinding there (grepped 2026-08-05), and `oc auth can-i get devworkspaces
# -n user1-devspaces --as=user1 --as-group=workshop-attendees` answered `no` — though with the namespace
# absent at the time, so that read is INCONCLUSIVE about whether Che's operator adds one when it adopts
# the namespace. Risking a guaranteed false red on an otherwise-healthy workspace is not worth it; if a
# later pass proves the read IS permitted on a materialized {user}-devspaces, promote it to a third command.
# ${USER} resolves per-run. QUOTING: single-quotes only, no double-quotes (meta_list strips them).
smokeCommands:
  - "oc get svc claims-db -n ${USER}-dev -o name"
  - oc get route parasol-claims -n ${USER}-dev -o jsonpath='{.spec.host}' | grep -q .
