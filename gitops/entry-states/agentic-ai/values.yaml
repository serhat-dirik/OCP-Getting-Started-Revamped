# Injected by ws start (helm parameters user, clusterDomain, solve); defaults here serve local
# `helm template` dev.
user: user1
clusterDomain: apps.example.com
# ws solve sets true → renders the module END state (instructor/demo/testing).
#
# The entry state deploys the full agent WORLD (both MCP servers + parasol-agent, Ready) because the
# module is about driving an agent, not about building one. What entry does NOT ship is a working
# GROUNDING: parasol-agent-grounding carries a weak first-draft system prompt that never mentions
# tools. solve=true renders the strengthened prompt into that ConfigMap and, via the checksum
# annotation on the agent's pod template, rolls the agent onto it.
#
# So entry and end genuinely differ, in the object the lab asks the attendee to write. Until chart
# 0.1.8 they did not: solve rendered byte-identically to prep and the verify script had to
# manufacture an outcome by POSTing /agent/ask itself. Verify's mode-split now grades the ConfigMap —
# entry = no tool-directing prompt yet; end = the attendee's strengthened prompt, live in the pod —
# with the model call kept only as corroboration.
solve: false

# --- shared prebuilt images (parasol-images, built ONCE, tag 1.0) -----------------------------
# The three agentic-ai app images are built once into the shared parasol-images namespace (binary build,
# immutable tag 1.0) and pulled cross-namespace by the {user}-ai default ServiceAccount — the group
# system:serviceaccounts:{user}-ai holds system:image-puller on parasol-images (workshop-config
# parasol-images-pull.yaml, `ai` suffix). The per-user entry state deploys FROM these; it never runs
# a BuildConfig per user.
agentImage: image-registry.openshift-image-registry.svc:5000/ogsr-parasol-images/parasol-agent:1.0
claimsDbImage: image-registry.openshift-image-registry.svc:5000/ogsr-parasol-images/claims-db:1.0
policyDocsImage: image-registry.openshift-image-registry.svc:5000/ogsr-parasol-images/policy-docs:1.0

# --- MCP wiring (in-cluster HTTP-SSE) ---------------------------------------------------------
# The agent's @McpToolBox({"claims-db","policy-docs"}) connects to the two MCP servers over the
# legacy SSE endpoint (/mcp/sse) at their in-cluster Service names on 8080. claims-db is embedded
# H2 (self-contained → module-independence, rule 2); policy-docs is an embedded corpus. The agent's
# readiness (/q/health/ready) pings BOTH, so a Ready agent has proven its tool wiring.
claimsDbMcpUrl: http://claims-db:8080/mcp/sse
policyDocsMcpUrl: http://policy-docs:8080/mcp/sse

# --- MaaS credentials for the agent (resolve → VALIDATE → stage) -------------------------------
# The agent calls an OpenAI-compatible Models-as-a-Service endpoint. endpoint + model are NOT secret
# (attendee-readable maas-config ConfigMap); the API key IS a secret and is resolved at sync time by
# a hook Job with its own least-privilege SA, VALIDATED against the endpoint, and only then staged
# into a maas-credentials Secret here. Default model llama-scout-17b: the per-user MaaS key is
# model-scoped and only grants this model (HTTP 401 key_model_access_denied against the prior
# qwen3-14b default — root-caused live by the task #67 QA gate); matches the FSC litemaas.model
# contract default (field-sourced-content-note.md §3). A source secret carrying its own
# model/endpoint keys converges the ConfigMap to those without a chart edit.
maasEndpoint: https://maas-rhdp.apps.maas.redhatworkshops.io/v1
maasModel: "set-from-ogsr-maas-credentials"
# PREFERRED source — the workshop's OWN credential, written by bootstrap from vars.yaml maas.api_key.
# It exists whether or not OpenShift Lightspeed was adopted, which is the whole point: on a cluster
# whose Lightspeed is wired to Azure OpenAI the adopted secret below holds an Azure AD JWT for a
# different provider entirely (M23 502'd for every attendee on a live cluster, 2026-07-29).
maasWorkshopNamespace: ogsr-system
maasWorkshopSecret: ogsr-maas-credentials
# FALLBACK source — an adopted OpenShift Lightspeed provider secret. A guess: used ONLY after the
# hook proves it against the endpoint. maasSourceKey is the first key name tried; the hook also tries
# the known aliases (an adopted install carries `Bearer`, one we create carries `apitoken`).
maasSourceNamespace: openshift-lightspeed
maasSourceSecret: credentials
maasSourceKey: apitoken

