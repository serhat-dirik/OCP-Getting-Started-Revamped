# Per-user ServiceMonitor — tells user-workload monitoring (already cluster-wide via the
# monitoring-uwm component) to scrape parasol-agent's /q/metrics, so exercise 5's console query
# (Observe → Metrics: gen_ai_client_token_usage_total / langchain4j_aiservices_timed_seconds_count)
# has datapoints. Without it UWM never scrapes the agent and the query returns "No datapoints
# found" on every cluster. UWM auto-discovers ServiceMonitors in user namespaces — no platform
# change needed; same pattern as observability-health-scale's parasol-claims ServiceMonitor.
# Selects the parasol-agent Service by label and scrapes its named http port (8080) at /q/metrics
# (the endpoint the lab's CLI tab curls). The default-ish 30s interval is deliberate: the lab reads
# monotonic token counters — no alert-timing beat depends on scrape phase here (unlike the 10s
# load-bearing interval in observability-health-scale), and the lab prose tells the attendee a
# metric appears up to ~30s after first use.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: parasol-agent
  namespace: {{ include "agentic-ai.namespace" . }}
  labels:
    app: parasol-agent
    workshop.redhat.com/module: agentic-ai
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
spec:
  selector:
    matchLabels:
      app: parasol-agent
  endpoints:
    - port: http
      path: /q/metrics
      interval: 30s
