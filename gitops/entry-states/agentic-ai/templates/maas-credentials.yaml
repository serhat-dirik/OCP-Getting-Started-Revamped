# MaaS wiring for the parasol-agent in {user}-ai. endpoint + model are NOT secret and live in a
# ConfigMap (attendee-readable, attendee-editable — the lab can point the agent at another model); the
# API key IS a secret and is RESOLVED, VALIDATED and staged at sync time into a maas-credentials Secret
# by a hook Job with its own ServiceAccount and least-privilege RBAC (get on the TWO named source
# secrets; create/patch in this namespace only). Same pattern as jobs-batch-kueue/app-modernization/
# ai-assisted-development, suffixed -agentic-ai-{user}.
#
# SOURCE PREFERENCE (fixed 2026-07-29 after M23 502'd for every attendee on a live cluster):
#   1. the WORKSHOP'S OWN credential — ogsr-system/ogsr-maas-credentials, written by bootstrap from
#      vars.yaml maas.api_key. Authoritative: the operator configured it FOR this workshop.
#   2. an ADOPTED OpenShift Lightspeed provider secret — a GUESS, used only if it proves itself.
# The old code had only source 2 and trusted it blindly. On a cluster whose Lightspeed is wired to
# Azure OpenAI that secret's `Bearer` key is an Azure AD JWT for a completely different provider; the
# copy succeeded, the hook exited 0, and the breakage surfaced hours later as a 502 from the agent
# ("LiteLLM Virtual Key expected … expected to start with 'sk-'"). A credential that is merely PRESENT
# proves nothing — hence the validation below.
#
# VALIDATION (cheap gate then honest gate): reject a 3-segment JWT outright (never an OpenAI-compatible
# key), then spend ONE token on a real /chat/completions call against the endpoint+model this module
# will actually use. Only a 2xx stages the credential. The probe captures the STATUS CODE ONLY —
# LiteLLM's 401 body echoes the whole token back, so capturing the body would put the credential in
# the pod log. A 401/403 is a verdict; anything else (000/5xx) is inconclusive and never condemns a key.
#
# PER-CLUSTER MODEL/ENDPOINT: model + endpoint are read from the SAME secret the credential came from
# (a credential and an endpoint from different sources are an unvalidated pairing — exactly how a live cluster
# broke), falling back to the chart values (values.yaml maasModel/maasEndpoint — default
# llama-scout-17b, task #67) when absent. WHY prefer the secret: the per-user MaaS key is model-scoped
# and the two clusters' keys are scoped to OPPOSITE models (llama-scout-17b vs qwen3-14b — inverted-scope
# incident 2026-07-19), so any hardcoded chart default breaks one cluster.
#
# agentic-ai TWIST vs app-modernization: the agent REQUIRES the key to function, so the Job ALWAYS
# materializes the maas-credentials Secret (wave 1) — with the validated token, or an EMPTY key when
# no usable credential exists (graceful degradation). Either way the agent Deployment (wave 2) can
# START and report Ready via its MCP clients; the missing key only makes the MODEL call return a clean
# 502 authFailure (the app handles it), never a stuck pod. The verdict is recorded in maas-config
# (aiPathAvailable/aiPathReason) so `ws verify` reports a broken AI path instead of a green ✅.
#
# EXIT DISCIPLINE: absent credential = a CHOICE the operator made → degrade, exit 0. A rejected
# WORKSHOP-OWNED credential = a MISTAKE nobody chooses → exit 1, loud, with the fix named. A rejected
# ADOPTED-Lightspeed credential is only a failed guess → degrade with a loud ❌ log, exit 0 (the
# module still stands up so the operator can wire a key and re-sync).
---
# why: endpoint + model for the agent + attendee to read (attendee-editable, not sensitive). The chart
# owns this ConfigMap's EXISTENCE — verify hard-checks it on every cluster — and the Sync-hook Job below
# is its ONLY writer.
#
# NO `data` IS RENDERED HERE, AND THAT IS THE FIX. These values do not come from git: they come from the
# cluster's own MaaS credential Secret, whose `model` is per-cluster (the per-user key is model-scoped,
# and two clusters' keys were scoped to OPPOSITE models — inverted-scope incident 2026-07-19). Rendering
# the chart default meant Helm wrote llama-scout-17b and the hook patched it to the cluster's real scope
# seconds later, so the live object STRUCTURALLY diverged from the rendered template — and with selfHeal
# off for entry Applications that diff never self-corrects. The whole Application then read OutOfSync
# forever over one ConfigMap key, which is why `ws start`/`prep`/`reset` had to be told to ignore the
# Synced signal altogether (ws-meta expectOutOfSync) — trading the sync signal of every other resource
# in the module for this one field. Measured on a live cluster 2026-07-29: last-applied held {endpoint, model},
# live held model=qwen3-14b, and this ConfigMap was the ONLY OutOfSync resource in all three AI apps.
#
# A key the chart never renders is not part of the diff — which is why the hook's aiPathAvailable,
# aiPathReason and credentialSource have always been written here without making anything OutOfSync.
# Making model and endpoint hook-only puts them in that same class. The chart default is NOT gone: it
# is passed to the hook as FALLBACK_MODEL/FALLBACK_ENDPOINT and still stands where the secret is silent.
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-config
  namespace: {{ include "agentic-ai.namespace" . }}
  labels:
    workshop.redhat.com/module: agentic-ai
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-copy-agentic-ai-{{ .Values.user }}
  namespace: {{ include "agentic-ai.namespace" . }}
  labels:
    workshop.redhat.com/module: agentic-ai
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
---
# why: read ONLY the one named WORKSHOP-OWNED MaaS secret (bootstrap writes it from vars.yaml
# maas.api_key). This is the PREFERRED source — pinned by resourceNames, no blanket secret read in a
# shared namespace. Distinct name suffix `-ws` so it never collides with the Lightspeed Role below
# even if an operator points both at the same namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maas-copy-ws-agentic-ai-{{ .Values.user }}
  namespace: {{ .Values.maasWorkshopNamespace }}
  labels:
    workshop.redhat.com/module: agentic-ai
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.maasWorkshopSecret | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maas-copy-ws-agentic-ai-{{ .Values.user }}
  namespace: {{ .Values.maasWorkshopNamespace }}
  labels:
    workshop.redhat.com/module: agentic-ai
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maas-copy-ws-agentic-ai-{{ .Values.user }}
subjects:
  - kind: ServiceAccount
    name: maas-copy-agentic-ai-{{ .Values.user }}
    namespace: {{ include "agentic-ai.namespace" . }}
---
# why: read ONLY the one named source secret in the platform Lightspeed namespace (resourceNames pins
# it to `credentials` — no blanket secret read in a shared namespace). FALLBACK source only: what it
# holds belongs to Lightspeed's provider, not to us, so the hook probes it before trusting it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maas-copy-agentic-ai-{{ .Values.user }}
  namespace: {{ .Values.maasSourceNamespace }}
  labels:
    workshop.redhat.com/module: agentic-ai
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.maasSourceSecret | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maas-copy-agentic-ai-{{ .Values.user }}
  namespace: {{ .Values.maasSourceNamespace }}
  labels:
    workshop.redhat.com/module: agentic-ai
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maas-copy-agentic-ai-{{ .Values.user }}
subjects:
  - kind: ServiceAccount
    name: maas-copy-agentic-ai-{{ .Values.user }}
    namespace: {{ include "agentic-ai.namespace" . }}
---
# why: let the copy Job write the resulting maas-credentials Secret AND converge the maas-config
# ConfigMap's model/endpoint to the platform's on-cluster values — both in {user}-ai.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maas-copy-agentic-ai-{{ .Values.user }}
  namespace: {{ include "agentic-ai.namespace" . }}
  labels:
    workshop.redhat.com/module: agentic-ai
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    # patch maas-config with the model/endpoint the copy Job resolves (from the source secret or fallback).
    resources: ["configmaps"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maas-copy-agentic-ai-{{ .Values.user }}
  namespace: {{ include "agentic-ai.namespace" . }}
  labels:
    workshop.redhat.com/module: agentic-ai
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maas-copy-agentic-ai-{{ .Values.user }}
subjects:
  - kind: ServiceAccount
    name: maas-copy-agentic-ai-{{ .Values.user }}
    namespace: {{ include "agentic-ai.namespace" . }}
---
# Sync-hook Job: converges maas-config (model/endpoint) and materializes maas-credentials (key
# GENAI_API_KEY). Re-runs on every sync (BeforeHookCreation) and is idempotent (apply/patch converge).
# Wave 1 = after the RBAC (wave 0) and before the agent (wave 2), so the Secret exists when the agent
# pod starts. The token is never decoded or logged — the base64 value is passed straight through.
apiVersion: batch/v1
kind: Job
metadata:
  name: maas-copy-agentic-ai-{{ .Values.user }}
  namespace: {{ include "agentic-ai.namespace" . }}
  labels:
    workshop.redhat.com/module: agentic-ai
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: maas-copy-agentic-ai
        workshop.redhat.com/module: agentic-ai
    spec:
      serviceAccountName: maas-copy-agentic-ai-{{ .Values.user }}
      restartPolicy: Never
      containers:
        - name: copy
          # ose-cli ships oc; no custom image to maintain (same choice as jobs-batch-kueue/app-modernization).
          image: registry.redhat.io/openshift4/ose-cli:latest
          # `oc` is a large Go binary — 128Mi OOMKills it; 512Mi limit gives it headroom.
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: 300m, memory: 512Mi}
          env:
            # PREFERRED source: the workshop's own MaaS credential (bootstrap ← vars.yaml maas.api_key).
            - name: WS_NS
              value: {{ .Values.maasWorkshopNamespace | quote }}
            - name: WS_SECRET
              value: {{ .Values.maasWorkshopSecret | quote }}
            # FALLBACK source: an adopted OpenShift Lightspeed provider secret (validated, never trusted).
            - name: SRC_NS
              value: {{ .Values.maasSourceNamespace | quote }}
            - name: SRC_SECRET
              value: {{ .Values.maasSourceSecret | quote }}
            - name: SRC_KEY
              value: {{ .Values.maasSourceKey | quote }}
            - name: DST_NS
              value: {{ include "agentic-ai.namespace" . | quote }}
            - name: DST_USER
              value: {{ .Values.user | quote }}
            # Fallback used when the source Lightspeed secret does NOT carry model/endpoint keys: the
            # chart default (values.yaml) stands — llama-scout-17b (task #67; FSC litemaas.model default).
            - name: FALLBACK_MODEL
              value: {{ .Values.maasModel | quote }}
            - name: FALLBACK_ENDPOINT
              value: {{ .Values.maasEndpoint | quote }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              # Read one key of one Secret as PLAINTEXT. Decoding is deliberate: shape and live
              # validation cannot be done on base64. The value lives in a shell variable and is
              # re-encoded on the way out — never echoed, never persisted, never in a log line.
              # $( ) also strips a trailing newline, silently fixing a key pasted into vars.yaml with one.
              read_key() {  # <ns> <secret> <key>
                oc get secret "$2" -n "$1" -o jsonpath="{.data.$3}" 2>/dev/null | base64 -d 2>/dev/null || true
              }
              # A 3-segment JWT is a control-plane bearer for SOME OTHER provider — an adopted
              # Azure-OpenAI Lightspeed writes exactly this into its `Bearer` key. It can never be an
              # OpenAI-compatible API key, so reject it without spending a network round-trip.
              is_jwt() { [[ "$1" == eyJ* ]] && [[ "$(printf '%s' "$1" | tr -cd '.' | wc -c | tr -d ' ')" -ge 2 ]]; }
              # THE HONEST GATE: one real token against the endpoint+model this module will use.
              # 0 = usable · 1 = endpoint REJECTED it · 2 = inconclusive (we could not ask).
              # STATUS CODE ONLY: LiteLLM's 401 body echoes the whole token back, so capturing the body
              # would put the credential in the pod log. The token travels in a 0600 curl config file
              # rather than argv, so it is not visible to `ps` inside the container either.
              probe_endpoint() {  # <token> <endpoint> <model>
                local tok="$1" ep="${2%/}" model="$3" code cfg="/tmp/.maas-probe.$$"
                command -v curl >/dev/null 2>&1 || return 2
                ( umask 077; printf 'header = "Authorization: Bearer %s"\n' "$tok" > "$cfg" )
                code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 \
                          --config "$cfg" -H 'content-type: application/json' -X POST \
                          "${ep}/chat/completions" \
                          -d "{\"model\":\"${model}\",\"max_tokens\":1,\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}]}" \
                          2>/dev/null || echo 000)"
                rm -f "$cfg"
                case "$code" in
                  2*)      echo "  probe: HTTP ${code} — the endpoint accepted the credential"; return 0 ;;
                  401|403) echo "  probe: HTTP ${code} — the endpoint REJECTED the credential"; return 1 ;;
                  *)       echo "  probe: HTTP ${code} — inconclusive (no usable verdict from the endpoint)"; return 2 ;;
                esac
              }

              # 1. resolve a candidate: workshop-owned first (authoritative), adopted Lightspeed second (a guess).
              echo "▶ resolving a MaaS credential — workshop-owned (${WS_NS}/${WS_SECRET}) first, adopted Lightspeed (${SRC_NS}/${SRC_SECRET}) second…"
              TOK=""; CAND_SRC="none"
              for _ in $(seq 1 12); do
                TOK="$(read_key "$WS_NS" "$WS_SECRET" apitoken)"
                if [[ -n "$TOK" ]]; then CAND_SRC="workshop"; break; fi
                # The adopted install's key name is not stable across clusters: one WE create writes
                # `apitoken`, an adopted one carries `Bearer` (measured on a live cluster). Try the configured
                # name, then the known aliases.
                for k in "${SRC_KEY}" apitoken Bearer bearer api_key apiToken; do
                  TOK="$(read_key "$SRC_NS" "$SRC_SECRET" "$k")"
                  if [[ -n "$TOK" ]]; then CAND_SRC="adopted-lightspeed(${k})"; break; fi
                done
                if [[ -n "$TOK" ]]; then break; fi
                sleep 5
              done

              # 2. model + endpoint come from the SAME secret the credential came from — a credential and
              # an endpoint from different sources are an unvalidated pairing, which is exactly how a live cluster
              # broke. Chart fallback where the winning secret carries neither (task #67 default).
              if [[ "$CAND_SRC" == "workshop" ]]; then FROM_NS="$WS_NS"; FROM_SECRET="$WS_SECRET"; else FROM_NS="$SRC_NS"; FROM_SECRET="$SRC_SECRET"; fi
              SRC_MODEL="$(read_key "$FROM_NS" "$FROM_SECRET" model)"
              SRC_ENDPOINT="$(read_key "$FROM_NS" "$FROM_SECRET" endpoint)"
              MODEL="${SRC_MODEL:-$FALLBACK_MODEL}"
              ENDPOINT="${SRC_ENDPOINT:-$FALLBACK_ENDPOINT}"
              if [[ -n "$SRC_MODEL" ]]; then
                echo "▶ model/endpoint sourced from ${FROM_NS}/${FROM_SECRET}: model=${MODEL}"
              else
                echo "▶ source secret carries no model key — using chart fallback: model=${MODEL}"
              fi

              # 3. VALIDATE before staging. A credential that is merely PRESENT proves nothing.
              AI_STATE="false"; AI_REASON="no-maas-credential"; STAGE_TOKEN=""; REJECT_WHY=""
              if [[ -n "$TOK" ]]; then
                if is_jwt "$TOK"; then
                  AI_REASON="credential-is-a-jwt-not-an-api-key"
                  REJECT_WHY="it is a 3-segment JSON Web Token — a control-plane bearer for another provider (an adopted Azure-OpenAI Lightspeed writes one), never an OpenAI-compatible API key"
                else
                  echo "▶ probing ${ENDPOINT} with the ${CAND_SRC} credential (1 token, status code only)…"
                  rc=0; probe_endpoint "$TOK" "$ENDPOINT" "$MODEL" || rc=$?
                  case "$rc" in
                    0) AI_STATE="true";       AI_REASON="probe-ok";                          STAGE_TOKEN="$TOK" ;;
                    1) AI_REASON="credential-rejected-by-endpoint"
                       REJECT_WHY="the endpoint answered 401/403 — the key is not valid for ${ENDPOINT}, or not entitled to model ${MODEL}" ;;
                    # Unreachable is not a verdict on the credential: stage it (shape is plausible) and
                    # mark the state unverified so verify prints ⚠ and skips rather than a false ❌.
                    *) AI_STATE="unverified"; AI_REASON="endpoint-unreachable-from-cluster"; STAGE_TOKEN="$TOK" ;;
                  esac
                fi
              fi
              if [[ "$AI_STATE" == "false" && -n "$TOK" ]]; then
                echo "❌ the MaaS credential in ${CAND_SRC} CANNOT work against ${ENDPOINT} (model ${MODEL}) — refusing to stage it."
                echo "   why: ${REJECT_WHY}"
                echo "   fix: put a working OpenAI-compatible key in bootstrap/vars.yaml (maas.api_key, plus maas.endpoint"
                echo "        and maas.model) and re-run ./bootstrap/install.sh — it writes ${WS_NS}/${WS_SECRET}, which this"
                echo "        hook prefers over any adopted OpenShift Lightspeed secret. Then: ws reset agentic-ai --user ${DST_USER}"
                echo "   (the credential value itself is never printed — it was checked in memory only)"
              elif [[ "$AI_STATE" == "false" ]]; then
                echo "▶ no MaaS credential on this cluster — AI path unavailable (graceful degradation, not an error)."
              elif [[ "$AI_STATE" == "unverified" ]]; then
                echo "⚠ could not reach ${ENDPOINT} from this cluster — staging the ${CAND_SRC} credential UNVERIFIED."
              fi

              # 4. Converge the attendee-readable maas-config to the effective values AND record the
              # verdict, so `ws verify`/`ws doctor` can tell working from broken from unknown instead of
              # inferring health from a Secret's existence. selfHeal is off for entry Apps → Argo keeps
              # this edit; a `ws reset` re-converges it.
              oc patch configmap maas-config -n "${DST_NS}" --type merge \
                -p "{\"data\":{\"model\":\"${MODEL}\",\"endpoint\":\"${ENDPOINT}\",\"aiPathAvailable\":\"${AI_STATE}\",\"aiPathReason\":\"${AI_REASON}\",\"credentialSource\":\"${CAND_SRC}\"}}"

              # 5. Stage the Secret. The agent reads GENAI_API_KEY here and GENAI_ENDPOINT/GENAI_MODEL from
              # maas-config (see parasol-agent.yaml). An EMPTY key is the degraded path and is deliberate:
              # the agent still starts and reports Ready via its MCP clients, and a model call returns a
              # clean 502 authFailure. A key that FAILED validation is never written — that was the bug.
              TOKEN_B64="$(printf %s "$STAGE_TOKEN" | base64 | tr -d '\n')"
              echo "▶ materializing maas-credentials in ${DST_NS} (base64, never logged)…"
              oc apply -f - <<EOF
              apiVersion: v1
              kind: Secret
              metadata:
                name: maas-credentials
                namespace: ${DST_NS}
                labels:
                  workshop.redhat.com/module: agentic-ai
                  workshop.redhat.com/user: ${DST_USER}
              type: Opaque
              data:
                GENAI_API_KEY: ${TOKEN_B64}
              EOF
              echo "✅ maas-credentials ready in ${DST_NS} (model ${MODEL}, aiPathAvailable=${AI_STATE})"

              # 6. EXIT DISCIPLINE. A rejected WORKSHOP-OWNED credential is an operator mistake nobody
              # chooses — fail the sync loudly so it cannot pass unnoticed a second time. Everything else
              # (nothing configured, or a failed guess at an adopted Lightspeed secret) degrades cleanly:
              # the module still stands up, and maas-config says why the AI path is down.
              if [[ "$AI_STATE" == "false" && "$CAND_SRC" == "workshop" ]]; then
                echo "❌ failing this hook on purpose: the workshop's OWN MaaS credential does not work."
                exit 1
              fi
