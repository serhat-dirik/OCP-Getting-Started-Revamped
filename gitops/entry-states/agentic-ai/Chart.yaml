apiVersion: v2
name: agentic-ai-entry
description: "Agentic AI on OpenShift — the per-user agent world in the workshop-owned {user}-ai namespace: an entry marker, MaaS credentials wired via the jobs-batch-kueue/app-modernization hook pattern (apitoken copied from openshift-lightspeed/credentials into a maas-credentials Secret; model + endpoint sourced per-cluster from the SAME secret with a chart-values fallback — default llama-scout-17b, task #67: the per-user MaaS key is model-scoped and only grants this model), and the deployed app layer — the two MCP servers (claims-db, policy-docs) THEN parasol-agent (Quarkus LangChain4j direct-to-MaaS, @McpToolBox over HTTP-SSE). All three run from the SHARED prebuilt parasol-images (built once, tag 1.0), not a per-user build. {user}-ai (quota/limits/RBAC) is created by the workshop layer (per-user-ai.yaml), NOT this chart (same as {user}-modernize/{user}-batch). The graded path is direct-to-MaaS; the later Llama Stack / TrustyAI guardrails / vector-db components are a separate platform phase. ws solve proves the END state (the agent answers a tool-grounded query — POST /agent/ask 'status of claim CLM-1001?' → a get_claim-grounded answer)."
type: application
# 0.1.4: + parasol-agent ServiceMonitor (UWM scrape for the Ex5 Observe → Metrics beat). Chart-version
# bump is load-bearing: Argo's manifest cache is keyed on it (a stale render can survive SHA changes).
# 0.1.5: the MaaS hook now RESOLVES (workshop-owned secret before adopted Lightspeed), VALIDATES
# (JWT shape gate + a 1-token live probe) and only then STAGES the key — the old code copied whatever
# the adopted Lightspeed secret held, which on an Azure-OpenAI cluster is an Azure AD JWT: staged
# green, 502'd every attendee (a live cluster, 2026-07-29). The verdict lands in maas-config
# (aiPathAvailable/aiPathReason) so verify can no longer pass on a broken AI path. MUST bump: this is
# a hook-only change, and Argo's manifest cache is keyed on the chart version — a stale render can
# re-apply the old hook minutes later on an unrelated reconcile.
# 0.1.6: imagePullPolicy: Always on every workshop-BUILT image in this chart. Their tags
# (1.0/1.1) are MUTABLE and rebuilt in place, so the kubelet's IfNotPresent default kept serving a
# node-cached layer and a rebuilt image never reached a running pod (measured on a live cluster, 2026-07-29:
# the IS tag moved to a new digest, `oc rollout restart` brought the OLD digest back up). Upstream
# images pinned to a digest or an immutable tag are deliberately left on IfNotPresent. MUST bump:
# Argo's manifest cache is keyed on the chart version.
# 0.1.7: maas-config (and, in ai-assisted-development, maas-config-env) no longer renders model/
# endpoint from chart values — the Sync hook is their sole writer. Helm wrote the chart default and the
# hook patched it to the cluster's real per-key model scope seconds later, so the live ConfigMap
# permanently diverged from the render; with selfHeal off the whole Application read OutOfSync forever
# over one key, and ws-meta had to declare expectOutOfSync to keep `ws start`/`prep`/`reset` from
# failing on a healthy world. A value that comes from cluster state does not belong in the rendered
# manifest. MUST bump: Argo's manifest cache is keyed on the chart version.
# 0.1.8: the module gets a REAL end state. Its entry state used to BE its finished state — all four
# agent tools are read-only, the attendee changed nothing durable, and `ws solve` rendered
# byte-identically to `ws prep` (34020 bytes each, empty diff; .Values.solve was referenced by zero
# templates). The agent's system prompt is now externalized to a parasol-agent-grounding ConfigMap:
# entry ships a WEAK draft that never mentions tools, solve ships the strengthened one, and the
# agent pod template carries a checksum of it so solve actually ROLLS the pods instead of leaving
# them serving the old prompt from their existing environment. Grounding is the thing the attendee
# writes, which is also the module's own lesson. MUST bump: Argo's manifest cache is keyed on the
# chart version.
version: 0.1.8
