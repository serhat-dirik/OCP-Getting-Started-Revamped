# The workload-security centrepiece. ENTRY (solve=false): a Deployment that DEMANDS root
# (securityContext.runAsUser: 0) under its own least-privilege SA (root-demander), which can use only
# restricted-v2 — so the pod is REJECTED at admission ("unable to validate against any security context
# constraint"). It ships at replicas: 0 so the entry Argo app is HEALTHY (a 0-replica Deployment is
# Healthy; nothing is scheduled yet) and `ws prep` converges; the attendee then `oc scale --replicas=1`
# and reads the deterministic admission failure (selfHeal is off, so the scale sticks). SOLVE
# (solve=true): the FIXED variant — no forced root, restricted-v2-compliant, scaled to 1 and running
# (the honest "fix the image" resolution; the scoped-SCC grant is the [INSTRUCTOR-DEMO] alternative,
# taught in content, not shipped here to avoid contradicting the fix).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: root-demander
  namespace: {{ .Values.user }}-dev
  labels:
    app: root-demander
    workshop.redhat.com/module: multi-tenancy-workload-security
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
spec:
  # Entry: 0 (nothing scheduled → app Healthy; attendee scales up to see the rejection).
  # Solve: 1 (the fixed image actually runs).
  replicas: {{ if .Values.solve }}1{{ else }}0{{ end }}
  selector:
    matchLabels:
      app: root-demander
  template:
    metadata:
      labels:
        app: root-demander
        workshop.redhat.com/module: multi-tenancy-workload-security
    spec:
      # Dedicated workload SA so the [INSTRUCTOR-DEMO] scoped-SCC grant targets exactly this identity.
      serviceAccountName: root-demander
      containers:
        - name: app
          # Internal imagestream (RHEL-based tools image) — always present, no external pull secret,
          # handles an arbitrary assigned UID (the fixed variant runs as a random non-root UID).
          #
          # DELIBERATELY NOT PINNED, and this is the third audit to ask — so here is the measurement
          # (cluster-m24jn, OCP 4.22, 2026-08-12) rather than another round of reasoning:
          #   oc get is tools -n openshift -o jsonpath='{.spec.tags[*].name}'   ->  latest
          #   oc get istag tools:latest -n openshift -o jsonpath='{.image.dockerImageReference}'
          #     -> quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:15a4864a…
          # `latest` is the ONLY tag this imagestream publishes, so there is no versioned tag to pin
          # to — unlike `openshift/postgresql:15-el9` and `openshift/nodejs:20-ubi9`, which this repo
          # DOES pin at all 21 of their sites precisely because the cluster publishes one. And a
          # digest is worse than the tag here: the value above comes from THIS cluster's release
          # payload (note the include.release.openshift.io/* annotations — the CVO owns it), so it
          # differs on every cluster and moves on every upgrade. Pinning it would make the module
          # ImagePullBackOff on any cluster but the one the pin was taken on, which is a real outage
          # traded for a theoretical one.
          #
          # The floating-tag risk is also a different one from the failure that motivated the sweep.
          # `ose-cli:latest` was dangerous because it was FROZEN on a stale build carrying unapplied
          # Critical errata. This tag tracks the cluster's own release payload, so "whatever the
          # registry serves" is "whatever this cluster's OCP version ships" — which for a tools image
          # is the desired behaviour, not a hazard.
          #
          # Same call at the other 6 `openshift/tools:latest` sites (5 entry-state values.yaml files
          # + this one) and at platform-portfolio/components/oadp/bsl-glue.yaml's `openshift/cli`.
          # digest-pin-guard.py encodes it too: its `t2-incluster-floating` canary asserts tier 2
          # must NOT fire on this exact string.
          image: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
          {{- if .Values.solve }}
            # FIXED: run as a non-root UID (restricted-v2 assigns one from the namespace range) and
            # satisfy the restricted profile — this admits and runs cleanly.
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          {{- else }}
            # DEMANDS root — restricted-v2 (MustRunAsRange, no uid 0) rejects this pod at admission.
            # This is the failure the attendee reads; the fix is the solve variant above (or a scoped SCC).
            runAsUser: 0
          {{- end }}
