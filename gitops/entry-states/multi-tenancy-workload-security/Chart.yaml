apiVersion: v2
name: multi-tenancy-workload-security-entry
description: "Multi-Tenancy & Workload Security — reframes the standing {user}-dev/stage/prod as a 'payments team' sandbox: seeds 2 synthetic teammate ServiceAccounts (payments-ci, payments-ops) to govern, a workload ServiceAccount (root-demander), and a root-demanding Deployment (scaled to 0, forces runAsUser:0) the attendee scales up to watch restricted-v2 reject at admission. ws solve materializes the END state: the workload FIXED to run non-root (running), plus the team RBAC (payments-ci edit-in-dev/view-in-prod, payments-ops a custom 'deployer' Role — deployments yes, secrets no). Quotas/limits are reused from the workshop layer, never chart-owned."
type: application
# 0.1.1: COMMENT-ONLY. The root-workload container records why its `openshift/tools:latest` reference
# stays floating — measured on cluster: that imagestream publishes no tag but `latest`, and its digest
# comes from the cluster's own release payload, so a pin would ImagePullBackOff everywhere else. No
# rendered object changes (Argo parses YAML, comments do not survive), so this bump buys nothing
# mechanically; it is here because the repo's rule is to bump any chart that is edited, and a version
# that silently stays put while the chart moves is how the rule stops being trusted.
version: 0.1.1
