# Ephemeral PostgreSQL for the claims service in {user}-cicd — the datasource the pipeline-built
# app connects to, so the deployed app comes up HEALTHY (the app does drop-and-create at boot and
# crash-loops with no DB). Same shape as the pipelines-fundamentals claims-db (composed, never chained: ADR-0001).
# Ephemeral (emptyDir) — this module is about the supply chain, not persistence.
---
# why: claims datasource credentials, consumed by BOTH the DB (to init) and the app. HOST is
# included so the deploy task's envFrom secret/claims-db gives the app the full contract
# (POSTGRESQL_HOST/DATABASE/USER/PASSWORD; the app defaults PORT to 5432). The DB image ignores HOST.
apiVersion: v1
kind: Secret
metadata:
  name: claims-db
  namespace: {{ .Values.user }}-cicd
  labels:
    app: claims-db
    workshop.redhat.com/module: trusted-supply-chain
    workshop.redhat.com/owner: ogsr
type: Opaque
stringData:
  POSTGRESQL_HOST: claims-db
  POSTGRESQL_DATABASE: claimsdb
  POSTGRESQL_USER: claims
  POSTGRESQL_PASSWORD: claims-demo-pw
---
# why: the PostgreSQL 16 server the claims app reads/writes; env-driven from the Secret above.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-db
  namespace: {{ .Values.user }}-cicd
  labels:
    app: claims-db
    workshop.redhat.com/module: trusted-supply-chain
    workshop.redhat.com/owner: ogsr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-db
  template:
    metadata:
      labels:
        app: claims-db
        workshop.redhat.com/module: trusted-supply-chain
    spec:
      containers:
        - name: postgresql
          # Digest-pinned, NOT the internal postgresql:15-el9 tag: in this policy-controller namespace the
          # webhook rewrites a tag to tag@digest at admission, and Argo then reads the Deployment as
          # OutOfSync forever (measured on user22). Same pin as storage-stateful's solve end state.
          image: registry.redhat.io/rhel9/postgresql-16@sha256:1149c78dbc442a419d6d9073dd5b60dd40d5639070b8cd8cd8dfab30ef88a913
          ports:
            - containerPort: 5432
          # Explicit, so the database does not take the 1500m LimitRange default out of the
          # namespace's CPU limits quota that the pipeline's own pods need.
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          envFrom:
            - secretRef:
                name: claims-db
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -h 127.0.0.1 -p 5432"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        # Ephemeral on purpose — persistence is storage-stateful's lesson.
        - name: data
          emptyDir: {}
---
# why: the stable in-cluster address the claims app resolves as claims-db.{user}-cicd.svc:5432.
apiVersion: v1
kind: Service
metadata:
  name: claims-db
  namespace: {{ .Values.user }}-cicd
  labels:
    app: claims-db
    workshop.redhat.com/module: trusted-supply-chain
    workshop.redhat.com/owner: ogsr
spec:
  selector:
    app: claims-db
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
