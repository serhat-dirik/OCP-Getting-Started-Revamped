# Per-user scan wiring: copy the SHARED RHACS CI token into {user}-cicd, because the curated
# acs-image-check Task reads Secret rox-api-token from the namespace it runs in:
#   • stackrox/rox-api-token → {user}-cicd/rox-api-token
# Least-privilege cross-namespace RBAC: read ONLY that one Secret; write only in {user}-cicd.
# The token value is moved base64-to-base64 (never echoed as plaintext).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trusted-supply-chain-secrets
  namespace: {{ .Values.user }}-cicd
  labels:
    workshop.redhat.com/module: trusted-supply-chain
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
---
# read the shared RHACS CI token (stackrox), scoped to that one Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trusted-supply-chain-read-rox-token-{{ .Values.user }}
  namespace: {{ .Values.stackroxNamespace }}
  labels:
    workshop.redhat.com/module: trusted-supply-chain
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["rox-api-token"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trusted-supply-chain-read-rox-token-{{ .Values.user }}
  namespace: {{ .Values.stackroxNamespace }}
  labels:
    workshop.redhat.com/module: trusted-supply-chain
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trusted-supply-chain-read-rox-token-{{ .Values.user }}
subjects:
  - kind: ServiceAccount
    name: trusted-supply-chain-secrets
    namespace: {{ .Values.user }}-cicd
---
# write the copy in the attendee's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trusted-supply-chain-write-secrets
  namespace: {{ .Values.user }}-cicd
  labels:
    workshop.redhat.com/module: trusted-supply-chain
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trusted-supply-chain-write-secrets
  namespace: {{ .Values.user }}-cicd
  labels:
    workshop.redhat.com/module: trusted-supply-chain
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trusted-supply-chain-write-secrets
subjects:
  - kind: ServiceAccount
    name: trusted-supply-chain-secrets
    namespace: {{ .Values.user }}-cicd
---
# Argo Sync hook (BeforeHookCreation): re-runs every ws start / ws reset so the copies stay fresh
# (e.g. if the trust stack rotated the token). Idempotent (apply). Wave 0 — before any pipeline run.
apiVersion: batch/v1
kind: Job
metadata:
  name: trusted-supply-chain-secrets-{{ .Values.user }}
  namespace: {{ .Values.user }}-cicd
  labels:
    workshop.redhat.com/module: trusted-supply-chain
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: trusted-supply-chain-secrets-{{ .Values.user }}
    spec:
      serviceAccountName: trusted-supply-chain-secrets
      restartPolicy: Never
      containers:
        - name: copy
          # Digest-pinned; el8 `ose-cli:latest` was frozen on v4.15.0 with unapplied Critical errata.
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22@sha256:f8bbc73242af3eae3f8361a9611b29384d3577dba4d5e5b62f4beb2750862c19
          env:
            - name: NS
              value: {{ .Values.user }}-cicd
            - name: ROX_NS
              value: {{ .Values.stackroxNamespace | quote }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "▶ waiting for the shared RHACS CI token (${ROX_NS}/rox-api-token)…"
              for _ in $(seq 1 60); do
                oc get secret rox-api-token -n "$ROX_NS" >/dev/null 2>&1 && break
                sleep 10
              done
              oc get secret rox-api-token -n "$ROX_NS" >/dev/null 2>&1 \
                || { echo "❌ ${ROX_NS}/rox-api-token missing — is the trust stack installed?"; exit 1; }

              # Move the token base64-to-base64 (never echoed as plaintext).
              B64TOKEN="$(oc get secret rox-api-token -n "$ROX_NS" -o jsonpath='{.data.rox-api-token}')"
              B64EP="$(oc get secret rox-api-token -n "$ROX_NS" -o jsonpath='{.data.rox-central-endpoint}')"
              cat <<EOF | oc apply -f - >/dev/null
              apiVersion: v1
              kind: Secret
              metadata:
                name: rox-api-token
                namespace: ${NS}
                labels:
                  workshop.redhat.com/module: trusted-supply-chain
              type: Opaque
              data:
                rox-api-token: ${B64TOKEN}
                rox-central-endpoint: ${B64EP}
              EOF
              echo "  ✓ rox-api-token copied into ${NS} (value not shown)"

              echo "✅ trusted-supply-chain scan token ready in ${NS}"
