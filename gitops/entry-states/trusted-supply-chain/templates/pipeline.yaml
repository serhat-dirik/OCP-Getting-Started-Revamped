# The trusted-supply-chain Pipeline, one per attendee in {user}-cicd:
#   fetch-source → build-image → scan + sbom → verify-conforma → deploy
# Signing is NOT a task: Tekton Chains (a controller outside the pipeline) signs the image build-image
# pushed, and its SLSA provenance, keyless through Trusted Artifact Signer, seconds after that TaskRun
# ends. verify-conforma checks that signature and provenance before deploy pins the Deployment to the
# digest. Shared Tasks come by cluster resolver (git-clone/buildah from openshift-pipelines, the curated
# acs-image-check/verify-conforma from ogsr-parasol-tasks); only sbom and deploy are inline.
#
# Every default is filled in, so the console's Actions → Start form (shared-workspace =
# VolumeClaimTemplate) or `tkn pipeline start --use-param-defaults` runs it as is. Memory: buildah needs
# no override, the -cicd LimitRange default limit (2Gi) is sized for this Maven build (proven by
# pipelines-fundamentals' plain console runs); the inline sbom step carries its own request.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: parasol-claims-trusted-build
  namespace: {{ .Values.user }}-cicd
  labels:
    app.kubernetes.io/part-of: parasol-claims
    workshop.redhat.com/module: trusted-supply-chain
    workshop.redhat.com/owner: ogsr
spec:
  params:
    - name: git-url
      type: string
      description: Source repository, this attendee's Gitea fork (in-cluster address).
      default: http://gitea.{{ .Values.giteaNamespace }}.svc:3000/{{ .Values.user }}/parasol-claims.git
    - name: git-revision
      type: string
      description: Branch to build. main is clean; seed-vulnerable carries a known-vulnerable dependency.
      default: main
    - name: image
      type: string
      description: Image repository to push to (pushed as :latest; every later task uses the digest).
      default: image-registry.openshift-image-registry.svc:5000/{{ .Values.user }}-cicd/parasol-claims-secure
  workspaces:
    # One PVC-backed workspace: the checkout git-clone writes and buildah + sbom read.
    - name: shared-workspace
  results:
    # IMAGE_URL + IMAGE_DIGEST name the built image; SBOM_SHA256 ties the SBOM to it in the run's provenance.
    - name: IMAGE_URL
      value: $(tasks.build-image.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.build-image.results.IMAGE_DIGEST)
    - name: SBOM_SHA256
      value: $(tasks.sbom.results.SBOM_SHA256)
  tasks:
    # Clone the fork into the shared workspace.
    - name: fetch-source
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: git-clone}
          - {name: namespace, value: openshift-pipelines}
      params:
        - {name: URL, value: $(params.git-url)}
        - {name: REVISION, value: $(params.git-revision)}
      workspaces:
        - {name: output, workspace: shared-workspace}

    # Build the Containerfile and push; IMAGE_URL/IMAGE_DIGEST are what Chains signs.
    # TLS_VERIFY=false: the internal registry serves a service-CA certificate the build pod does not trust.
    - name: build-image
      runAfter: [fetch-source]
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: buildah}
          - {name: namespace, value: openshift-pipelines}
      params:
        - {name: IMAGE, value: $(params.image)}
        - {name: DOCKERFILE, value: ./Containerfile}
        # The Containerfile's own `mvn package` resolves through the in-cluster Maven mirror.
        - name: BUILD_ARGS
          value:
            - MAVEN_MIRROR_URL=http://maven-mirror.ogsr-maven-mirror.svc:8080
        - {name: TLS_VERIFY, value: "false"}
      workspaces:
        - {name: source, workspace: shared-workspace}

    # RHACS build-time policy check of the pushed digest; fails the run on an enforced violation
    # (the seed-vulnerable branch's Log4Shell), so nothing after it runs.
    - name: scan
      runAfter: [build-image]
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: acs-image-check}
          - {name: namespace, value: ogsr-parasol-tasks}
      params:
        - {name: IMAGE, value: "$(tasks.build-image.results.IMAGE_URL)@$(tasks.build-image.results.IMAGE_DIGEST)"}

    # CycloneDX SBOM of the source, stored as ConfigMap parasol-claims-sbom; its sha256 is a result,
    # so it is recorded in the provenance Chains signs for this run.
    - name: sbom
      runAfter: [build-image]
      params:
        - {name: image-digest, value: $(tasks.build-image.results.IMAGE_DIGEST)}
      workspaces:
        - {name: source, workspace: shared-workspace}
      taskSpec:
        params:
          - {name: image-digest, type: string}
        workspaces:
          - name: source
        results:
          - name: SBOM_SHA256
            description: sha256 of the CycloneDX SBOM (stored in ConfigMap parasol-claims-sbom)
        volumes:
          - name: sbom
            emptyDir: {}
        steps:
          - name: cyclonedx
            # Same runner, byte-identical, as the curated maven-jdk21 Task (pipelines/tasks/maven-jdk21.yaml):
            # the multi-arch INDEX digest of ubi9/openjdk-21 1.24-3.1785873424. Change both or neither.
            image: registry.access.redhat.com/ubi9/openjdk-21@sha256:24dad82bd5d25d9b0c85f0e9c976e47ccce787cc73792355462bf54fe03d9a77
            workingDir: $(workspaces.source.path)
            computeResources:
              requests: {memory: 1Gi}
              limits: {memory: 1536Mi}
            volumeMounts:
              - {name: sbom, mountPath: /sbom}
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              echo "▶ generating the CycloneDX SBOM…"
              # Resolve through the in-cluster Maven mirror (Central + Red Hat GA, warmed at install).
              printf '<settings><mirrors><mirror><id>mirror.default</id><url>%s</url><mirrorOf>central</mirrorOf></mirror></mirrors></settings>' \
                "http://maven-mirror.ogsr-maven-mirror.svc:8080" > /tmp/settings.xml
              /usr/bin/mvn -B -ntp -s /tmp/settings.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeBom
              # makeBom from the CLI writes the plugin's default name (target/bom.json), not the pom's outputName.
              SBOM="$(ls -1 target/parasol-claims-sbom.json target/bom.json target/*cyclonedx.json 2>/dev/null | head -1 || true)"
              [[ -n "$SBOM" ]] || { echo "❌ no CycloneDX SBOM produced under target/"; exit 1; }
              cp "$SBOM" /sbom/sbom.json
              # The purl carries the exact version, e.g. pkg:maven/…/log4j-core@2.14.1
              if HIT="$(grep -oE 'log4j-core@[0-9][0-9.]*' /sbom/sbom.json | head -1)"; then
                echo "⚠️  the SBOM lists ${HIT} (CVE-2021-44228, Log4Shell)"
              else
                echo "✅ no log4j-core in the SBOM"
              fi
              sha256sum /sbom/sbom.json | cut -d' ' -f1 | tr -d '\n' > "$(results.SBOM_SHA256.path)"
              echo "▶ SBOM sha256: $(cat "$(results.SBOM_SHA256.path)")"
          - name: publish
            # Digest-pinned; el8 `ose-cli:latest` was frozen on v4.15.0 with unapplied Critical errata.
            image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22@sha256:f8bbc73242af3eae3f8361a9611b29384d3577dba4d5e5b62f4beb2750862c19
            # Small and explicit: the -cicd LimitRange default (1500m CPU limit per container) counts
            # against the namespace's 8-CPU limits quota and stalled concurrent runs (measured on user22).
            computeResources:
              requests: {cpu: 10m, memory: 64Mi}
              limits: {cpu: 200m, memory: 256Mi}
            volumeMounts:
              - {name: sbom, mountPath: /sbom}
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              # create, never apply: apply would copy the ~600 KB SBOM into an annotation and pass 1 MiB.
              oc delete configmap parasol-claims-sbom --ignore-not-found >/dev/null
              oc create configmap parasol-claims-sbom --from-file=sbom.json=/sbom/sbom.json >/dev/null
              oc annotate configmap parasol-claims-sbom \
                workshop.redhat.com/image-digest="$(params.image-digest)" \
                workshop.redhat.com/pipelinerun="$(context.pipelineRun.name)" >/dev/null
              echo "✅ SBOM stored: configmap/parasol-claims-sbom (image $(params.image-digest))"

    # Conforma (`ec validate image`): the image signature and SLSA provenance verify against Tekton
    # Chains' keyless identity and Rekor, and the policy holds. Waits for Chains to finish signing.
    - name: verify-conforma
      runAfter: [scan, sbom]
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: verify-conforma}
          - {name: namespace, value: ogsr-parasol-tasks}
      # The signer must be Tekton Chains' SPIFFE identity (trust domain = the apps domain), certified by
      # Fulcio against this cluster's SPIRE OIDC issuer. EXPECTED_PIPELINE/EXPECTED_TASK default to this
      # Pipeline and build-image; REKOR_URL/TUF_URL/WAIT_SECONDS keep the Task's in-cluster defaults.
      params:
        - {name: IMAGE, value: "$(tasks.build-image.results.IMAGE_URL)@$(tasks.build-image.results.IMAGE_DIGEST)"}
        - {name: CERTIFICATE_IDENTITY, value: "spiffe://{{ .Values.clusterDomain }}/ns/openshift-pipelines/sa/tekton-chains-controller"}
        - {name: CERTIFICATE_OIDC_ISSUER, value: "https://oidc-discovery.{{ .Values.clusterDomain }}"}

    # Deploy parasol-claims pinned to the digest Conforma just verified, then wait for the rollout.
    # Runs as the operator-provided `pipeline` SA, which already holds `edit` in this namespace.
    - name: deploy
      runAfter: [verify-conforma]
      params:
        - name: image-ref
          value: "$(tasks.build-image.results.IMAGE_URL)@$(tasks.build-image.results.IMAGE_DIGEST)"
      taskSpec:
        params:
          - {name: image-ref, type: string}
        steps:
          - name: deploy
            # Digest-pinned; el8 `ose-cli:latest` was frozen on v4.15.0 with unapplied Critical errata.
            image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22@sha256:f8bbc73242af3eae3f8361a9611b29384d3577dba4d5e5b62f4beb2750862c19
            computeResources:
              requests: {cpu: 10m, memory: 64Mi}
              limits: {cpu: 200m, memory: 256Mi}
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              IMG="$(params.image-ref)"
              echo "▶ deploying parasol-claims at ${IMG}"
              oc apply -f - <<EOF
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: parasol-claims
                labels:
                  app: parasol-claims
                  app.kubernetes.io/part-of: parasol-claims
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: parasol-claims
                template:
                  metadata:
                    labels:
                      app: parasol-claims
                  spec:
                    containers:
                      - name: parasol-claims
                        image: ${IMG}
                        # The entry state's ephemeral claims-db (the app creates its schema at boot).
                        envFrom:
                          - secretRef:
                              name: claims-db
                        ports:
                          - containerPort: 8080
                        # Explicit, so the app does not take the 1500m LimitRange default out of the
                        # namespace's CPU limits quota that the pipeline's own pods need.
                        resources:
                          requests:
                            cpu: 50m
                            memory: 256Mi
                          limits:
                            cpu: 500m
                            memory: 768Mi
                        readinessProbe:
                          tcpSocket:
                            port: 8080
                          periodSeconds: 5
              ---
              apiVersion: v1
              kind: Service
              metadata:
                name: parasol-claims
                labels:
                  app: parasol-claims
              spec:
                selector:
                  app: parasol-claims
                ports:
                  - port: 8080
                    targetPort: 8080
              EOF
              oc rollout status deployment/parasol-claims --timeout=300s
              echo "✅ parasol-claims runs $(oc get deployment parasol-claims -o jsonpath='{.spec.template.spec.containers[0].image}')"
