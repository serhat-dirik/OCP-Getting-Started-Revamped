# Injected by ws start (helm parameters user, clusterDomain, solve); defaults here serve local
# `helm template` dev.
user: user1
clusterDomain: apps.example.com
# NOTE: the CLEAN main image is now built at EVERY prep by warm-clean-image.yaml (always-on), NOT gated
# on solve — the owner's 2026-07-18 "pre-scanned image" rebalance needs the warm signed image present for
# the LAB, not just the demo. `solve` is kept for ws-solve compatibility (it still lands on the same warm
# end state: a scanned-clean, Chains-signed parasol-claims:latest); it no longer toggles a distinct hook.
solve: false
# In-cluster Gitea coordinates: the fork job forks {upstreamOrg}/parasol-claims into {user} and makes
# the fork's seed-vulnerable branch carry the seeded flaws (older base tag + log4j-core CVE).
giteaNamespace: ogsr-gitea
upstreamOrg: parasol
mirrorRepo: ocp-getting-started
# Shared trust-stack sources the per-user hook copies FROM (workshop-agnostic secret contracts):
#   stackrox/rox-api-token         → the RHACS CI scan token (minted by the trust stack)
#   openshift-pipelines/chains-cosign-pub → the Tekton Chains cosign PUBLIC key (trust-signing export)
stackroxNamespace: stackrox
pipelinesNamespace: openshift-pipelines

# BEGIN gen-entry-namespaces manageNamespaces — GENERATED by tools/gen-entry-namespaces.sh, DO NOT EDIT
# This chart's own Namespace/ResourceQuota/LimitRange/RoleBinding render
# (templates/ns-user-namespaces.yaml) is a no-op while this is false. gitops/workshop-config still
# creates all 13 per-user namespaces eagerly today (verified live 2026-08-02: user4-dev carries
# tracking-id workshop-config:/Namespace:openshift-gitops/user4-dev, and the workshop-config
# Application runs prune=true/selfHeal=true) — if this chart ALSO rendered the same Namespace while
# workshop-config still owns it, two Applications would fight over the same object (this chart's
# sync-wave/sync-options annotations stripped by workshop-config's selfHeal, re-added by this
# chart, forever). Flipping this to true is a DELIBERATE migration step that MUST land in the SAME
# change as removing workshop-config's per-user namespace rendering, never before.
manageNamespaces: false
# END gen-entry-namespaces manageNamespaces
