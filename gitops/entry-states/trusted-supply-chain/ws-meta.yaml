# Namespaces this module needs to EXIST before its entry state can materialize. Consumed by
# `ws prep` -> the per-user namespace Application, so a namespace is created on demand rather
# than all 13 existing up front. NOT the same list as purgeNamespaces below: that answers
# "what do I empty on reset", and at least one module (multi-tenancy-workload-security) needs a
# namespace it deliberately must NOT purge, because a cohabitant module's work lives there.
namespaces:
  - "cicd"

# ws reset purges user-created leftovers from these namespaces before re-materializing.
# trusted-supply-chain lives ENTIRELY in {user}-cicd: the build→scan→sign pipeline, the copied RHACS token + Chains
# public key, the copied parasol-claims-trusted image, and (in the lab) the attendee's admission-test pods.
# The signature policy itself is the install's ClusterImagePolicy, never per-user state.
# `oc delete all,pvc` + the engine's pipelinerun cleanup clear it back to the entry state
# (the platform-owned quota/limitrange/rbac and the pipeline SA are untouched). The per-user Gitea
# fork is re-created idempotently by the fork job and is NOT purged (attendees push to it).
purgeNamespaces:
  - "${USER}-cicd"
# trusted-supply-chain shares {user}-cicd with pipelines-fundamentals and re-materializes into it, so the two are MUTUAL conflicts
# (ADR-0001 amendment 4: same-namespace modules must declare each other, both directions). Starting
# or preparing trusted-supply-chain evicts pipelines-fundamentals's entry app + purges {user}-cicd, and vice versa. the {user}-dev modules
# and jobs-batch-kueue ({user}-batch) are disjoint namespaces → they coexist untouched (trusted-supply-chain deliberately keeps its
# admission beat in {user}-cicd, NOT {user}-dev, to stay self-contained — see build-note deviation).
conflictsWith:
  - pipelines-fundamentals
  - app-security-testing
# The trusted-image-copy hook copies the cohort's install-time signed image into {user}-cicd in ~1s.
# The long window only matters right after install, while that one shared build may still be running
# (the hook waits for it, activeDeadlineSeconds 1500); on a settled cluster prep returns in about a minute.
waitSeconds: 1500
# Two representative attendee commands the trust lab leans on: the pre-scanned, Chains-signed image must
# be present AND readable by {user} (RBAC/identity) — cosign verify, attestation and admission target
# it — and the install's signature policy must be readable (exercise 5 prints it; platform-observer
# grants the read). The generic smoke battery already covers cockpit/identity/isolation/freshness.
smokeCommands:
  - "oc get imagestreamtag parasol-claims-trusted:latest -n ${USER}-cicd"
  - "oc get clusterimagepolicy ogsr-signed-parasol-claims"
