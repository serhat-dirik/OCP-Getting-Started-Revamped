# Namespaces this module needs to EXIST before its entry state can materialize. Consumed by
# `ws prep` -> the per-user namespace Application, so a namespace is created on demand rather
# than all 13 existing up front. NOT the same list as purgeNamespaces below: that answers
# "what do I empty on reset", and at least one module (multi-tenancy-workload-security) needs a
# namespace it deliberately must NOT purge, because a cohabitant module's work lives there.
namespaces:
  - "cicd"

# ws reset purges user-created leftovers from these namespaces before re-materializing.
# trusted-supply-chain lives ENTIRELY in {user}-cicd: the pipeline, the copied RHACS token, and what the lab
# adds — PipelineRuns, the parasol-claims image/Deployment/Service, the parasol-claims-sbom ConfigMap, the
# out-of-chain BuildConfig and its :unsigned image. The image policy itself is cluster state (RHTAS policy
# controller), never per-user. `oc delete all,pvc` + the engine's pipelinerun/configmap cleanup clear it back
# to the entry state (the platform-owned quota/limitrange/rbac and the pipeline SA are untouched). The per-user
# Gitea fork is re-created idempotently by the fork job and is NOT purged (attendees push to it).
purgeNamespaces:
  - "${USER}-cicd"
# trusted-supply-chain shares {user}-cicd with pipelines-fundamentals and re-materializes into it, so the two are MUTUAL conflicts
# (ADR-0001 amendment 4: same-namespace modules must declare each other, both directions). Starting
# or preparing trusted-supply-chain evicts pipelines-fundamentals's entry app + purges {user}-cicd, and vice versa. the {user}-dev modules
# and jobs-batch-kueue ({user}-batch) are disjoint namespaces → they coexist untouched (trusted-supply-chain deliberately keeps its
# admission beat in {user}-cicd, NOT {user}-dev, to stay self-contained — see build-note deviation).
conflictsWith:
  - pipelines-fundamentals
  - app-security-testing
  - developer-hub-golden-paths
# Prep itself is ~1 min (token copy, namespace label, fork). The window is for `ws solve`, whose hook runs the
# whole pipeline and waits for it (solve-endstate.yaml activeDeadlineSeconds); keep the two equal.
waitSeconds: 1800
# Representative attendee commands the lab leans on: the pipeline is readable, the namespace carries the
# policy-controller opt-in label, the attendee may create a BuildConfig (the out-of-chain build), and the
# cluster's SPIFFE OIDC issuer is readable (the local `cosign verify` names Chains' keyless identity by it;
# a platform-observer grant), and so is the admission policy the lab prints. The generic smoke battery already covers cockpit/identity/isolation/freshness.
smokeCommands:
  - "tkn pipeline describe parasol-claims-trusted-build -n ${USER}-cicd"
  - "oc get namespace ${USER}-cicd --show-labels | grep -q policy.rhtas.com/include=true"
  - "oc auth can-i create buildconfigs.build.openshift.io -n ${USER}-cicd"
  - "oc get spireoidcdiscoveryprovider cluster"
  - "oc get clusterimagepolicies.policy.sigstore.dev ogsr-parasol-claims-keyless"
