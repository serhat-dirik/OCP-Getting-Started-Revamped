apiVersion: v2
name: app-modernization-entry
description: "Application Modernization (MTA + AI) — the per-user modernization world in the workshop-owned {user}-modernize namespace: an entry marker, MaaS credentials for Developer Lightspeed for MTA ([ADS], graceful-degradation best-effort), and a Gitea fork of the legacy migration target parasol-legacy-claims ({user}/parasol-legacy-claims — Spring-on-Tomcat/JWS, JDK 8, hardcoded config: the app MTA 8 analyzes). The shared MTA Hub (mta-operator + Tackle in openshift-mta) is installed by the platform-portfolio mta stack, NOT this chart; {user}-modernize (quota/limits/RBAC) is created by the workshop layer (per-user-modernize.yaml), NOT this chart (Rule 13). ws solve materializes the END state: the modernized parasol-claims service deployed to {user}-modernize (legacy Tomcat WAR -> modern container on OpenShift)."
type: application
# 0.1.4: drop the inert automount label/annotation from maas-credentials (the DevWorkspace operator
# only automounts same-namespace Secrets; workspaces live in {user}-devspaces) — the lab now teaches
# an explicit workspace-terminal export. Bump busts the Argo manifest cache.
# 0.1.5: the MaaS hook now RESOLVES (workshop-owned secret before adopted Lightspeed), VALIDATES
# (JWT shape gate + a 1-token live probe) and only then STAGES the key — the old code copied whatever
# the adopted Lightspeed secret held, which on an Azure-OpenAI cluster is an Azure AD JWT: staged
# green, rejected at model-call time (ksls5, 2026-07-29). MUST bump: this is a hook-only change, and
# Argo's manifest cache is keyed on the chart version — a stale render can re-apply the old hook
# minutes later on an unrelated reconcile.
# 0.1.6: imagePullPolicy: Always on every workshop-BUILT image in this chart. Their tags
# (1.0/1.1) are MUTABLE and rebuilt in place, so the kubelet's IfNotPresent default kept serving a
# node-cached layer and a rebuilt image never reached a running pod (measured on ksls5, 2026-07-29:
# the IS tag moved to a new digest, `oc rollout restart` brought the OLD digest back up). Upstream
# images pinned to a digest or an immutable tag are deliberately left on IfNotPresent. MUST bump:
# Argo's manifest cache is keyed on the chart version.
version: 0.1.6
