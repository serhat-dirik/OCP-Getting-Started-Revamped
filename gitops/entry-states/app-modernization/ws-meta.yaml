# Namespaces this module needs to EXIST before its entry state can materialize. Consumed by
# `ws prep` -> the per-user namespace Application, so a namespace is created on demand rather
# than all 13 existing up front. NOT the same list as purgeNamespaces below: that answers
# "what do I empty on reset", and at least one module (multi-tenancy-workload-security) needs a
# namespace it deliberately must NOT purge, because a cohabitant module's work lives there.
namespaces:
  - "modernize"

# ws reset purges user-created leftovers from these namespaces before re-materializing.
# app-modernization's in-namespace state lives entirely in {user}-modernize: the entry marker, the MaaS credentials
# (ConfigMap + Secret), and — at solve / lab — the modernized claims Deployment/Service, plus any Dev
# Spaces DevWorkspace the attendee starts and any MTA analysis artifacts. `oc delete all,pvc` clears
# the Deployments/Services/PVCs; the ws engine's purge_ns ALSO deletes DevWorkspaces (devspaces-inner-loop+ idiom) and
# any namespaced tackle.konveyor.io CRs (defensive — MTA's per-user portfolio state lives in the shared
# Hub DB, not as k8s CRs, but a future lab beat could drop a namespaced Task/Addon here).
# NOTE: the {user}-modernize NAMESPACE, its quota, LimitRange and RBAC are WORKSHOP-LAYER-owned
# (gitops/workshop-config/templates/per-user-modernize.yaml — the workshop-entries AppProject blacklists
# ResourceQuota/LimitRange, so an entry chart cannot create them; same as {user}-batch/{user}-mesh).
# Like those, the namespace SURVIVES reset with the same UID; the entry Application owns only the
# in-namespace objects.
# NO expectOutOfSync, DELIBERATELY — and it is not an oversight that it is gone. It was declared here on
# 2026-07-29 (243efc0) because the maas-copy Sync hook patched maas-config's `model` to the cluster's
# real per-key scope while the chart rendered its own default into the same key: the live ConfigMap
# diverged from the template forever (entry apps run selfHeal=false), so `ws start`/`prep`/`reset` sat
# the full waitSeconds and exited RED on a perfectly healthy module. agentic-ai had hit the same thing
# on 2026-07-19; the sibling modules were only exposed once their hooks started resolving a credential
# and actually reached the patch.
#
# The CAUSE is gone at chart 0.1.7: the chart renders no values into maas-config at all, and the hook is
# its sole writer, so there is nothing left to diverge from. Measured on ksls5 2026-07-29 —
# (1) maas-config was the ONLY OutOfSync resource in this Application; (2) a data key that is live-only
# (in the object, absent from the render) reads Synced, proven by four sibling entry apps whose
# claims-db Secret carries 3-4 such keys and reports Synced. Do not re-add this without re-measuring:
# declaring it trades the sync signal of every OTHER resource in the module for one ConfigMap field.

purgeNamespaces:
  - "${USER}-modernize"
# NO conflictsWith: app-modernization is the ONLY module that materializes into {user}-modernize (a dedicated
# namespace, like jobs-batch-kueue's {user}-batch and service-mesh-advanced-gateways's {user}-mesh). It shares no namespace with any other
# module, so its entry app coexists with every dev-namespace module untouched — no reciprocal edits
# needed (ADR-0001 same-namespace policy). Key omitted deliberately (meta_list returns empty).
# Representative app-modernization attendee muscle the generic battery does NOT cover: prove the attendee is admin on
# their dedicated {user}-modernize namespace (the workshop-layer per-user-modernize RBAC landed — a new
# namespace/new RBAC, the exact class the generic isolation checks don't reach for this module).
# ${USER} resolves per-run.
smokeCommands:
  - "oc auth can-i create deployment -n ${USER}-modernize"

# MTA portfolio entries this module's attendee creates BY HAND in the Hub console, which `ws prep`
# must clear so the "add app" beat starts clean (U8-F-01b).
#
# Why this key exists at all: MTA state lives in the Hub's OWN database, in a namespace shared with
# the whole cohort — not in ${USER}-modernize. purgeNamespaces above cannot see it, so a reset left
# the previous run's application behind and the lab had to tell the attendee to go delete it
# manually in a web UI first. Self-service prep means nobody does that.
#
# EXACT names only, never a prefix or wildcard: the Hub is shared AND unauthenticated (verified live
# 2026-08-05 — GET /hub/applications answers 200 anonymously, which is finding U8-F-01a), so a loose
# match here would delete a colleague's work. ${USER} resolves per-run, and the name below must stay
# in step with what the lab tells the attendee to type in the "Create new application" drawer.
purgeMtaApps:
  - "parasol-legacy-claims-${USER}"
