# The "under load generator" half of the observability-health-scale entry state (spec: "claims app (instrumented build)
# under load generator in {user}-dev"). A single, gentle curl loop against the in-cluster claims
# Service — enough continuous traffic that golden-signal metrics, the custom counter, and traces are
# always flowing for the PromQL/dashboard/trace beats, without pinning CPU (so the HPA scale-up in the
# scale beat is visible and BOUNDED per the load-generator-sizing watchout). Each cycle:
#   * GET  /api/claims                       — list traffic (http_server_requests golden signals)
#   * GET  /api/claims/CLM-1001/history      — the deliberate N+1 (6 JDBC spans → the slow trace)
#   * POST /api/claims                       — increments claims_created_total (the custom metric)
#   * GET  /api/claims/CLM-0000              — a 404 (a small, steady error rate for the alert beat)
# Uses ose-cli (bash + curl on every connected cluster; no custom image). Resources are tiny and
# capped so it never dominates the {user}-dev quota.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-load
  namespace: {{ .Values.user }}-dev
  labels:
    app: claims-load
    workshop.redhat.com/module: observability-health-scale
    workshop.redhat.com/owner: ogsr
    # Generates red telemetry ON PURPOSE — see entry-states/README.md rule 7 and `ws by-design`.
    # Not gated on solve: the load (and its deliberate error rate) is what makes the module's
    # dashboards, PromQL and traces show anything at all, in both states.
    workshop.redhat.com/by-design: "true"
  annotations:
    # The only object here that is anomalous in a DASHBOARD rather than in `oc get`. Whoever opens
    # the console's monitoring view for {{ .Values.user }}-dev sees a standing 4xx rate and a slow
    # trace on parasol-claims and has every reason to treat it as a sick app — it is a generator.
    workshop.redhat.com/by-design-symptom: >-
      steady 404 error rate and a deliberately slow multi-span trace on parasol-claims in this
      namespace; PrometheusRule alerts fire on cue during exercise 3
    workshop.redhat.com/by-design-reason: >-
      observability-health-scale: this pod curls parasol-claims in a loop, and two of its four calls
      are meant to look bad — GET /api/claims/CLM-0000 404s to give the alert beat a small steady
      error rate, and GET /api/claims/CLM-1001/history exercises the app's deliberate N+1 (6 JDBC
      spans) so there is a slow trace to find in Tempo. parasol-claims is healthy; the traffic is
      synthetic. Scaling this Deployment to 0 silences the module's own teaching signal.
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-load
  template:
    metadata:
      labels:
        app: claims-load
        workshop.redhat.com/module: observability-health-scale
    spec:
      containers:
        - name: load
          # Digest-pinned; el8 `ose-cli:latest` was frozen on v4.15.0 with unapplied Critical errata.
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22@sha256:f8bbc73242af3eae3f8361a9611b29384d3577dba4d5e5b62f4beb2750862c19
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          env:
            - name: TARGET
              value: http://parasol-claims:8080
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -uo pipefail
              echo "▶ claims load generator → ${TARGET} (gentle steady baseline)"
              # Wait for the claims API to answer readiness before driving load (avoids a burst of
              # connection errors during the initial rollout that would skew the first metrics).
              until curl -sf -o /dev/null "${TARGET}/q/health/ready"; do sleep 3; done
              echo "  ✓ claims ready — generating traffic"
              while true; do
                curl -s  -o /dev/null "${TARGET}/api/claims"
                curl -s  -o /dev/null "${TARGET}/api/claims/CLM-1001/history"
                curl -s  -o /dev/null -X POST "${TARGET}/api/claims" \
                  -H 'Content-Type: application/json' \
                  -d '{"claimant":"Load Generator","type":"auto","amount":100.00}'
                curl -s  -o /dev/null "${TARGET}/api/claims/CLM-0000"
                sleep 2
              done
