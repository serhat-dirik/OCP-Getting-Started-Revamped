apiVersion: v2
name: observability-health-scale-entry
description: "Observability, Health & Scale — the INSTRUMENTED parasol-claims build (image 1.1: /q/metrics, claims_created_total, N+1 /history, OTLP export ON → the shared ogsr-observability-workshop collector) + an ephemeral claims-db + a gentle curl load generator, all in {user}-dev, with a per-user ServiceMonitor scraping /q/metrics into user-workload monitoring. ws solve adds the lab's END state: a CPU HorizontalPodAutoscaler, an error-rate PrometheusRule alert, and a PodDisruptionBudget."
type: application
# 0.1.1: imagePullPolicy: Always on every workshop-BUILT image in this chart. Their tags
# (1.0/1.1) are MUTABLE and rebuilt in place, so the kubelet's IfNotPresent default kept serving a
# node-cached layer and a rebuilt image never reached a running pod (measured on a live cluster, 2026-07-29:
# the IS tag moved to a new digest, `oc rollout restart` brought the OLD digest back up). Upstream
# images pinned to a digest or an immutable tag are deliberately left on IfNotPresent. MUST bump:
# Argo's manifest cache is keyed on the chart version.
version: 0.1.2
