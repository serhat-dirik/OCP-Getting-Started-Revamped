# Provisions the attendee's scaffold target and keeps it a clean slate. The golden-path scaffolder
# (publish:gitea) publishes into a Gitea ORGANIZATION, not a personal namespace (verified live —
# publish:gitea's checkGiteaOrg rejects a user namespace), so each attendee gets a dedicated org
# {user}-{{ .Values.scaffoldOrgSuffix }} they own. This hook (a) creates that org (idempotent, Sudo
# {user} so the attendee owns it) and (b) DELETES every repo in it, so re-running the "New Parasol
# microservice" template never 409s (publish fails if the repo already exists). The org is isolated
# from the attendee's personal Gitea namespace (seeded forks like {user}/claims-config live there and
# are never touched). Gitea orgs/repos are not k8s objects, so ws reset's purge_ns can't reach them —
# this hook is how the scaffold slate is reset. Runs on EVERY entry-state sync (ws start / reset /
# prep): BeforeHookCreation clears the prior Job so a re-sync always re-fires; every step is
# idempotent. Same admin-credential-discovery + Sudo idiom as the config-multienv/gitops-fundamentals/gitops-at-scale fork jobs (compose,
# don't chain). Wave 1 = before the solve hook (wave 2), so solve's demo repo survives the empty pass.
#
# It also lays the platform team's per-team CI wiring for the parasol-golden-path template:
#   (d) a fresh Gitea token for {user} (scope write:repository) + a webhook secret, as Secret
#       golden-pac-secret in {user}-cicd: Pipelines-as-Code reads the repo and reports status with
#       it, and the pipelines commit promotions to the GitOps repo with it
#   (e) two ORG webhooks on {user}-svcs, so every repo the template creates is wired at birth:
#       push -> Pipelines-as-Code (runs .tekton/), push -> the attendees' Argo CD (syncs in seconds)
#   (f) the shared RHACS CI token copied into {user}-cicd for the pipeline's image check
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-scaffold-org-developer-hub-golden-paths-{{ .Values.user }}
  namespace: {{ .Values.giteaNamespace }}
  labels:
    workshop.redhat.com/module: developer-hub-golden-paths
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
---
# why: read the Gitea CR status (admin password) + admin secret + route host to call the API.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-scaffold-org-developer-hub-golden-paths-{{ .Values.user }}
  namespace: {{ .Values.giteaNamespace }}
  labels:
    workshop.redhat.com/module: developer-hub-golden-paths
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
rules:
  - apiGroups: ["pfe.rhpds.com"]
    # the rhpds CRD's plural is literally "gitea" (not "giteas") — verified live 2026-07-09
    resources: ["gitea"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-scaffold-org-developer-hub-golden-paths-{{ .Values.user }}
  namespace: {{ .Values.giteaNamespace }}
  labels:
    workshop.redhat.com/module: developer-hub-golden-paths
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-scaffold-org-developer-hub-golden-paths-{{ .Values.user }}
subjects:
  - kind: ServiceAccount
    name: gitea-scaffold-org-developer-hub-golden-paths-{{ .Values.user }}
    namespace: {{ .Values.giteaNamespace }}
---
# why: write the CI Secrets (golden-pac-secret, rox-api-token) into the attendee's own {user}-cicd.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-scaffold-org-developer-hub-golden-paths-{{ .Values.user }}
  namespace: {{ .Values.user }}-cicd
  labels:
    workshop.redhat.com/module: developer-hub-golden-paths
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
  # ws solve (solve-endstate.yaml) follows the golden path's own runs to completion.
  - apiGroups: ["pipelinesascode.tekton.dev"]
    resources: ["repositories"]
    verbs: ["get", "list"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["get", "list"]
---
# why (ws solve only reads it): solve waits until prod's Rollout is available.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-scaffold-org-developer-hub-golden-paths-{{ .Values.user }}
  namespace: {{ .Values.user }}-prod
  labels:
    workshop.redhat.com/module: developer-hub-golden-paths
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-scaffold-org-developer-hub-golden-paths-{{ .Values.user }}
  namespace: {{ .Values.user }}-prod
  labels:
    workshop.redhat.com/module: developer-hub-golden-paths
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-scaffold-org-developer-hub-golden-paths-{{ .Values.user }}
subjects:
  - kind: ServiceAccount
    name: gitea-scaffold-org-developer-hub-golden-paths-{{ .Values.user }}
    namespace: {{ .Values.giteaNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-scaffold-org-developer-hub-golden-paths-{{ .Values.user }}
  namespace: {{ .Values.user }}-cicd
  labels:
    workshop.redhat.com/module: developer-hub-golden-paths
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-scaffold-org-developer-hub-golden-paths-{{ .Values.user }}
subjects:
  - kind: ServiceAccount
    name: gitea-scaffold-org-developer-hub-golden-paths-{{ .Values.user }}
    namespace: {{ .Values.giteaNamespace }}
---
# why: read the shared RHACS CI token (that one Secret only) to copy it into {user}-cicd.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer-hub-golden-paths-read-rox-token-{{ .Values.user }}
  namespace: {{ .Values.stackroxNamespace }}
  labels:
    workshop.redhat.com/module: developer-hub-golden-paths
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["rox-api-token"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-hub-golden-paths-read-rox-token-{{ .Values.user }}
  namespace: {{ .Values.stackroxNamespace }}
  labels:
    workshop.redhat.com/module: developer-hub-golden-paths
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: developer-hub-golden-paths-read-rox-token-{{ .Values.user }}
subjects:
  - kind: ServiceAccount
    name: gitea-scaffold-org-developer-hub-golden-paths-{{ .Values.user }}
    namespace: {{ .Values.giteaNamespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-scaffold-org-developer-hub-golden-paths-{{ .Values.user }}
  namespace: {{ .Values.giteaNamespace }}
  labels:
    workshop.redhat.com/module: developer-hub-golden-paths
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: gitea-scaffold-org-developer-hub-golden-paths-{{ .Values.user }}
    spec:
      serviceAccountName: gitea-scaffold-org-developer-hub-golden-paths-{{ .Values.user }}
      restartPolicy: Never
      containers:
        - name: scaffold-org
          # ose-cli ships oc + curl + python3 on every connected cluster; no custom image.
          # Digest-pinned; el8 `ose-cli:latest` was frozen on v4.15.0 with unapplied Critical errata.
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22@sha256:f8bbc73242af3eae3f8361a9611b29384d3577dba4d5e5b62f4beb2750862c19
          env:
            - name: GITEA_NS
              value: {{ .Values.giteaNamespace | quote }}
            - name: FORK_USER
              value: {{ .Values.user | quote }}
            - name: SCAFFOLD_ORG
              value: {{ printf "%s-%s" .Values.user .Values.scaffoldOrgSuffix | quote }}
            # In-cluster RHDH base — the cleanup also deregisters the attendee's catalog Location(s) so
            # a re-prep leaves no orphan Component on the SHARED portal (guest token; svc URL is stable).
            - name: RHDH_URL
              value: {{ .Values.rhdhInClusterUrl | quote }}
            - name: CICD_NS
              value: {{ .Values.user }}-cicd
            - name: ROX_NS
              value: {{ .Values.stackroxNamespace | quote }}
            # Org webhook targets: the Pipelines-as-Code controller and the attendees' Argo CD.
            - name: PAC_URL
              value: "https://pipelines-as-code-controller-openshift-pipelines.{{ .Values.clusterDomain }}"
            - name: ARGO_WEBHOOK_URL
              value: "https://student-gitops-server-student-gitops.{{ .Values.clusterDomain }}/api/webhook"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              NS="${GITEA_NS}"

              echo "▶ waiting for the Gitea route…"
              for i in $(seq 1 60); do
                HOST="$(oc get route gitea -n "$NS" -o jsonpath='{.spec.host}' 2>/dev/null || true)"
                [[ -n "$HOST" ]] && break
                sleep 5
              done
              [[ -n "${HOST:-}" ]] || { echo "❌ gitea route not found after 5m"; exit 1; }
              GITEA_URL="https://${HOST}"

              echo "▶ discovering admin credentials (CR status is authoritative; secret is a fallback)…"
              ADMIN_USER="$(oc get gitea gitea -n "$NS" -o jsonpath='{.spec.giteaAdminUser}' 2>/dev/null || echo gitea-admin)"
              ADMIN_PASS=""
              for i in $(seq 1 60); do
                ADMIN_PASS="$(oc get gitea gitea -n "$NS" -o jsonpath='{.status.adminPassword}' 2>/dev/null || true)"
                [[ -z "$ADMIN_PASS" ]] && ADMIN_PASS="$(oc get secret gitea-admin-credentials -n "$NS" -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || true)"
                [[ -n "$ADMIN_PASS" ]] && break
                sleep 5
              done
              [[ -n "$ADMIN_PASS" ]] || { echo "❌ no Gitea admin password after 5m"; exit 1; }
              AUTH="${ADMIN_USER}:${ADMIN_PASS}"

              echo "▶ waiting for the Gitea API…"
              for i in $(seq 1 30); do
                curl -ksf -u "$AUTH" "${GITEA_URL}/api/v1/version" >/dev/null && break
                sleep 5
              done
              curl -ksf -u "$AUTH" "${GITEA_URL}/api/v1/version" >/dev/null || { echo "❌ Gitea API not answering (or admin creds wrong)"; exit 1; }

              echo "▶ ensuring org ${SCAFFOLD_ORG} (owned by ${FORK_USER}) + clean scaffold slate…"
              GITEA_URL="$GITEA_URL" AUTH="$AUTH" FORK_USER="$FORK_USER" SCAFFOLD_ORG="$SCAFFOLD_ORG" python3 - <<'PY'
              import base64, json, os, ssl, urllib.request, urllib.error
              base = os.environ["GITEA_URL"].rstrip("/"); auth = os.environ["AUTH"]
              user = os.environ["FORK_USER"]; org = os.environ["SCAFFOLD_ORG"]
              ctx = ssl._create_unverified_context()
              def api(method, path, body=None, sudo=False):
                  h = {"Authorization": "Basic " + base64.b64encode(auth.encode()).decode(),
                       "Content-Type": "application/json"}
                  if sudo: h["Sudo"] = user
                  data = json.dumps(body).encode() if body is not None else None
                  req = urllib.request.Request(base + path, data=data, headers=h, method=method)
                  try:
                      with urllib.request.urlopen(req, context=ctx) as r:
                          return r.status, json.loads(r.read().decode() or "[]")
                  except urllib.error.HTTPError as e:
                      return e.code, None

              # (a) create the org owned by the attendee (idempotent — 422 = already exists)
              st, _ = api("GET", f"/api/v1/orgs/{org}")
              if st == 200:
                  print(f"  ✓ org {org} already exists")
              else:
                  cst, _ = api("POST", "/api/v1/orgs", {"username": org, "visibility": "public"}, sudo=True)
                  print(f"  {'✓ created' if cst in (201,) else '! create returned HTTP '+str(cst)} org {org} (owner {user})")

              # (b) empty it — delete every repo (dedicated scaffold org → a clean slate for the template)
              deleted = 0; page = 1
              while True:
                  st, repos = api("GET", f"/api/v1/orgs/{org}/repos?limit=50&page={page}")
                  if st != 200 or not repos:
                      break
                  for repo in repos:
                      name = repo.get("name")
                      dst, _ = api("DELETE", f"/api/v1/repos/{org}/{name}")
                      if dst in (204, 200):
                          deleted += 1; print(f"  ✓ deleted {org}/{name}")
                  if len(repos) < 50:
                      break
              print(f"✅ {org} ready to scaffold into ({deleted} stale repo(s) cleared)")
              PY

              # (c) deregister any RHDH catalog Location(s) that point at this org — the scaffolder's
              # catalog:register step leaves a Location per scaffolded service on the SHARED portal, and
              # emptying Gitea does NOT remove it (it is a catalog object, not a Gitea repo). Without this
              # the {user}-svcs Components orphan across ws reset/prep (G3 multi-tenancy FAIL). Best-effort:
              # a guest token + list/match/DELETE by id; if RHDH is unreachable the Gitea slate is already
              # clean and the entry verify's clean-slate check flags any lingering orphan.
              echo "▶ deregistering catalog Location(s) for ${SCAFFOLD_ORG} on the shared RHDH portal…"
              RHDH_URL="$RHDH_URL" SCAFFOLD_ORG="$SCAFFOLD_ORG" python3 - <<'PY' || echo "  ! catalog dereg errored (non-fatal; entry verify flags any orphan)"
              import json, os, ssl, urllib.request, urllib.error
              base = os.environ["RHDH_URL"].rstrip("/"); org = os.environ["SCAFFOLD_ORG"]
              ctx = ssl._create_unverified_context()
              def req(method, path, token=None):
                  h = {}
                  if token: h["Authorization"] = "Bearer " + token
                  r = urllib.request.Request(base + path, headers=h, method=method)
                  try:
                      with urllib.request.urlopen(r, context=ctx, timeout=20) as resp:
                          return resp.status, resp.read().decode()
                  except urllib.error.HTTPError as e:
                      return e.code, ""
                  except Exception:
                      return 0, ""
              st, body = req("GET", "/api/auth/guest/refresh")
              tok = ""
              if st == 200:
                  try: tok = json.loads(body).get("backstageIdentity", {}).get("token", "")
                  except Exception: tok = ""
              if not tok:
                  print(f"  ! RHDH guest token unavailable (HTTP {st}); skipping catalog dereg")
              else:
                  st, body = req("GET", "/api/catalog/locations", tok)
                  try: locs = json.loads(body) if st == 200 else []
                  except Exception: locs = []
                  needle = f"/{org}/"
                  matched = [((e.get("data", e) or {}).get("id"), (e.get("data", e) or {}).get("target", ""))
                             for e in locs if isinstance(e, dict) and needle in ((e.get("data", e) or {}).get("target") or "")]
                  if not matched:
                      print(f"  ✓ no catalog Location points at {org} — nothing to deregister")
                  removed = 0
                  for lid, target in matched:
                      dst, _ = req("DELETE", f"/api/catalog/locations/{lid}", tok)
                      if dst in (204, 200):
                          removed += 1; print(f"  ✓ deregistered {lid} -> {target}")
                      else:
                          print(f"  ! HTTP {dst} deregistering {lid} -> {target}")
                  print(f"✅ catalog dereg for {org}: {removed} Location(s) removed")
              PY
              # (d)+(e) CI token Secret + org webhooks. Secret values go Gitea -> python -> oc stdin; never echoed.
              echo "▶ golden-path CI wiring for ${SCAFFOLD_ORG}: token Secret in ${CICD_NS} + org webhooks…"
              ARGO_SECRET="$(oc get secret argo-webhook-secret -n "$NS" -o jsonpath='{.data.secret}' 2>/dev/null | base64 -d || true)"
              GITEA_URL="$GITEA_URL" AUTH="$AUTH" FORK_USER="$FORK_USER" SCAFFOLD_ORG="$SCAFFOLD_ORG" \
              ARGO_SECRET="$ARGO_SECRET" python3 - <<'PY'
              import base64, json, os, secrets, ssl, subprocess, urllib.request, urllib.error
              base = os.environ["GITEA_URL"].rstrip("/"); auth = os.environ["AUTH"]
              user = os.environ["FORK_USER"]; org = os.environ["SCAFFOLD_ORG"]; ns = os.environ["CICD_NS"]
              pac_url = os.environ["PAC_URL"]; argo_url = os.environ["ARGO_WEBHOOK_URL"]
              argo_secret = os.environ.get("ARGO_SECRET", "")
              ctx = ssl._create_unverified_context()
              def api(method, path, body=None):
                  h = {"Authorization": "Basic " + base64.b64encode(auth.encode()).decode(),
                       "Content-Type": "application/json"}
                  data = json.dumps(body).encode() if body is not None else None
                  req = urllib.request.Request(base + path, data=data, headers=h, method=method)
                  try:
                      with urllib.request.urlopen(req, context=ctx) as r:
                          raw = r.read().decode()
                          return r.status, (json.loads(raw) if raw else None)
                  except urllib.error.HTTPError as e:
                      return e.code, None
              # (d) Gitea shows a token once, so mint a fresh one each run (the old one is deleted).
              api("DELETE", f"/api/v1/users/{user}/tokens/golden-path")
              st, tok = api("POST", f"/api/v1/users/{user}/tokens", {"name": "golden-path", "scopes": ["write:repository"]})
              if st != 201 or not (tok or {}).get("sha1"):
                  raise SystemExit(f"❌ could not create the golden-path token for {user} (HTTP {st})")
              hook_secret = secrets.token_hex(16)
              secret = {"apiVersion": "v1", "kind": "Secret", "type": "Opaque",
                        "metadata": {"name": "golden-pac-secret", "namespace": ns,
                                     "labels": {"workshop.redhat.com/module": "developer-hub-golden-paths"}},
                        "stringData": {"token": tok["sha1"], "webhook-secret": hook_secret}}
              subprocess.run(["oc", "apply", "-f", "-"], input=json.dumps(secret).encode(), check=True,
                             stdout=subprocess.DEVNULL)
              print(f"  ✓ Secret golden-pac-secret in {ns} (token + webhook secret, values not shown)")
              # (e) org webhooks: replace ours (the secret changed), leave any other hook alone.
              st, hooks = api("GET", f"/api/v1/orgs/{org}/hooks")
              for hk in (hooks or []):
                  if (hk.get("config") or {}).get("url") in (pac_url, argo_url):
                      api("DELETE", f"/api/v1/orgs/{org}/hooks/{hk['id']}")
              want = [("gitea", pac_url, hook_secret, "Pipelines-as-Code")]
              if argo_secret:
                  want.append(("gogs", argo_url, argo_secret, "Argo CD"))
              else:
                  print("  ! argo-webhook-secret not present yet: Argo CD falls back to polling (~3 min)")
              for typ, url, sec, label in want:
                  st, _ = api("POST", f"/api/v1/orgs/{org}/hooks",
                              {"type": typ, "active": True, "events": ["push"],
                               "config": {"url": url, "content_type": "json", "secret": sec}})
                  print(f"  {'✓' if st == 201 else '! HTTP ' + str(st)} org webhook -> {label}")
              PY

              # (f) the shared RHACS CI token, moved base64-to-base64 (never echoed).
              echo "▶ copying the RHACS CI token into ${CICD_NS}…"
              if oc get secret rox-api-token -n "$ROX_NS" >/dev/null 2>&1; then
                B64TOKEN="$(oc get secret rox-api-token -n "$ROX_NS" -o jsonpath='{.data.rox-api-token}')"
                B64EP="$(oc get secret rox-api-token -n "$ROX_NS" -o jsonpath='{.data.rox-central-endpoint}')"
                printf '{"apiVersion":"v1","kind":"Secret","type":"Opaque","metadata":{"name":"rox-api-token","namespace":"%s","labels":{"workshop.redhat.com/module":"developer-hub-golden-paths"}},"data":{"rox-api-token":"%s","rox-central-endpoint":"%s"}}' \
                  "$CICD_NS" "$B64TOKEN" "$B64EP" | oc apply -f - >/dev/null
                echo "  ✓ rox-api-token in ${CICD_NS} (value not shown)"
              else
                echo "  ! ${ROX_NS}/rox-api-token missing: the pipeline's image check will fail until the trust stack mints it"
              fi
              echo "✅ ${FORK_USER} can scaffold via the golden path into ${SCAFFOLD_ORG}"
