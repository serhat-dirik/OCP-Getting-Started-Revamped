{{- if .Values.solve }}
# END state for instructor demos / `ws solve networking-dev-devops` / testing: the micro-segmentation + exposure the
# attendee builds by hand. Assert OUTCOMES in verify (a Route answers; the policy blocks an
# unauthorized pod), never the mechanism, so any correct solution stays green (template rule 14).
#
# NetworkPolicies below implement default-deny → precise-allow across the 3 tiers. They are
# correct-by-construction; behavioural proof needs the parasol app images running (parasol-images
# build) and the web→claims REST hop (app-developer work — see the build note spec deltas), so the
# verify end-checks that exercise them are guarded accordingly.
---
# why: the baseline — deny ALL ingress and egress in {user}-dev; every legitimate flow is then
# re-opened explicitly below. This is the "app breaks, now write allows" starting point.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .Values.user }}-dev
  labels:
    workshop.redhat.com/module: networking-dev-devops
    workshop.redhat.com/owner: ogsr
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# why: default-deny-egress also blocks DNS — the classic "the fix looks broken for the wrong reason".
# Re-open egress to the cluster DNS service (openshift-dns) for every pod. NOTE the ports are the
# CoreDNS pods' NAMED ports (dns/dns-tcp = containerPort 5353), NOT the Service's port 53: OVN-K
# evaluates a NetworkPolicy egress port against the destination POD's port (post-DNAT), so a rule
# for `port: 53` silently fails to admit DNS (verified live on C1 2026-07-13 — OCP 4.21.22). Named
# ports track the CoreDNS container regardless of number and are what OpenShift's own operators use
# (e.g. openshift-cluster-olm-operator's allow-egress-to-openshift-dns).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ .Values.user }}-dev
  labels:
    workshop.redhat.com/module: networking-dev-devops
    workshop.redhat.com/owner: ogsr
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: dns
        - protocol: TCP
          port: dns-tcp
---
# why: let the OpenShift router reach the frontend so the edge Route works under default-deny. The
# openshift-ingress namespace carries policy-group.network.openshift.io/ingress (verified on C2) — the
# OVN-Kubernetes-sanctioned selector for admitting ingress-controller traffic through NetworkPolicy.
# [CAPTURE-VERIFY]: end-to-end Route-through-default-deny needs the parasol images running to prove.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-from-router
  namespace: {{ .Values.user }}-dev
  labels:
    workshop.redhat.com/module: networking-dev-devops
    workshop.redhat.com/owner: ogsr
spec:
  podSelector:
    matchLabels:
      app: parasol-web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
---
# why: "api only from web" — parasol-claims accepts ingress on 8080 ONLY from parasol-web pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-claims-from-web
  namespace: {{ .Values.user }}-dev
  labels:
    workshop.redhat.com/module: networking-dev-devops
    workshop.redhat.com/owner: ogsr
spec:
  podSelector:
    matchLabels:
      app: parasol-claims
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: parasol-web
      ports:
        - protocol: TCP
          port: 8080
---
# why: egress counterpart — parasol-web may reach parasol-claims on 8080 (egress is default-denied).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-to-claims-egress
  namespace: {{ .Values.user }}-dev
  labels:
    workshop.redhat.com/module: networking-dev-devops
    workshop.redhat.com/owner: ogsr
spec:
  podSelector:
    matchLabels:
      app: parasol-web
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: parasol-claims
      ports:
        - protocol: TCP
          port: 8080
---
# why: "db only from api" — claims-db accepts ingress on 5432 ONLY from parasol-claims pods. This is
# the one east-west hop that is real today (parasol-claims→claims-db:5432).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-from-claims
  namespace: {{ .Values.user }}-dev
  labels:
    workshop.redhat.com/module: networking-dev-devops
    workshop.redhat.com/owner: ogsr
spec:
  podSelector:
    matchLabels:
      app: claims-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: parasol-claims
      ports:
        - protocol: TCP
          port: 5432
---
# why: egress counterpart — parasol-claims may reach claims-db on 5432 (egress is default-denied).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-claims-to-db-egress
  namespace: {{ .Values.user }}-dev
  labels:
    workshop.redhat.com/module: networking-dev-devops
    workshop.redhat.com/owner: ogsr
spec:
  podSelector:
    matchLabels:
      app: parasol-claims
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: claims-db
      ports:
        - protocol: TCP
          port: 5432
---
# why: the external workhorse exposure — an edge Route on parasol-web (the deterministic north-south
# path on this bare-metal cluster; `oc create route edge` semantics, never plain oc expose).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: parasol-web
  namespace: {{ .Values.user }}-dev
  labels:
    app: parasol-web
    workshop.redhat.com/module: networking-dev-devops
    workshop.redhat.com/owner: ogsr
spec:
  to:
    kind: Service
    name: parasol-web
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Allow
---
# why: the second exposure beat — edge encrypts client→router but leaves router→pod in PLAINTEXT on the
# cluster network. Re-encrypt closes that last hop, and is the mode enterprises most often mandate.
#
# NO destinationCACertificate here, deliberately: the backend's cert comes from the Service's
# service.beta.openshift.io/serving-cert-secret-name annotation (see parasol-web.yaml), so it is issued
# by the cluster's service CA — which the router already trusts. A hand-rolled backend cert WOULD need
# the CA pinned here; that difference is the teaching point.
#
# Kept as a SEPARATE Route rather than converting the edge one, so the lab can show both side by side
# and the attendee can curl each. Verify matches on termination mode, not on this name, so an attendee
# who names theirs differently still passes.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: parasol-web-secure
  namespace: {{ .Values.user }}-dev
  labels:
    app: parasol-web
    workshop.redhat.com/module: networking-dev-devops
    workshop.redhat.com/owner: ogsr
spec:
  to:
    kind: Service
    name: parasol-web
  port:
    targetPort: https
  tls:
    # No insecureEdgeTerminationPolicy, matching what the lab's
    # `oc create route reencrypt … --port=https` actually produces (the flag defaults to unset). Solve
    # must reproduce the attendee's end state exactly, not an improved variant of it.
    termination: reencrypt
---
# === GATEWAY API END STATE (exercise 6) — the attendee's own Gateway + HTTPRoute, published by a Route.
# why: the listener, on the platform's openshift-default class. The annotation asks the implementation
# for a ClusterIP Service instead of its default LoadBalancer one, which stays <pending> on a cluster
# with no LB provider (Programmed=False, AddressNotAssigned — measured on cluster-5vqxc 2026-11-12).
# It must be a METADATA annotation: the same key under spec.infrastructure.annotations was not honoured
# for the Service type (the Service stayed LoadBalancer — measured the same day).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: parasol-gateway
  namespace: {{ .Values.user }}-dev
  annotations:
    networking.istio.io/service-type: ClusterIP
    # The Gateway API CRDs are installed and lifecycled by the cluster ingress operator, not by us.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    workshop.redhat.com/module: networking-dev-devops
    workshop.redhat.com/owner: ogsr
spec:
  gatewayClassName: openshift-default
  # One proxy at 50m/128Mi requests, 500m/512Mi limits instead of the class default (2 x 2 CPU) — the
  # workshop layer's per-namespace ConfigMap (gitops/workshop-config per-user-gateway-params.yaml).
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: ogsr-gateway-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
# why: the app team's half — attach to the Gateway above and send everything to parasol-web.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: parasol-web
  namespace: {{ .Values.user }}-dev
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true   # CRD from the ingress operator
  labels:
    workshop.redhat.com/module: networking-dev-devops
    workshop.redhat.com/owner: ogsr
spec:
  parentRefs:
    - name: parasol-gateway
  rules:
    - backendRefs:
        - name: parasol-web
          port: 8080
---
# why: the Gateway's Envoy pods run in {user}-dev, so default-deny-all applies to them. They need the
# router in (port 80), istiod in openshift-ingress (15012 — xDS + certificates; without it they never
# go Ready), and parasol-web out (8080).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway
  namespace: {{ .Values.user }}-dev
  labels:
    workshop.redhat.com/module: networking-dev-devops
    workshop.redhat.com/owner: ogsr
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: parasol-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
          podSelector:
            matchLabels:
              app: istiod
      ports:
        - protocol: TCP
          port: 15012
    - to:
        - podSelector:
            matchLabels:
              app: parasol-web
      ports:
        - protocol: TCP
          port: 8080
---
# why: the matching ingress side — parasol-web accepts 8080 from the Gateway's pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-from-gateway
  namespace: {{ .Values.user }}-dev
  labels:
    workshop.redhat.com/module: networking-dev-devops
    workshop.redhat.com/owner: ogsr
spec:
  podSelector:
    matchLabels:
      app: parasol-web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: parasol-gateway
      ports:
        - protocol: TCP
          port: 8080
---
# why: publish the ClusterIP Gateway — what the lab's
# `oc create route edge parasol-gw --service=parasol-gateway-openshift-default --port=http --insecure-policy=Allow`
# produces. The Service is created by the Gateway implementation, named <gateway>-<gatewayclass>.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: parasol-gw
  namespace: {{ .Values.user }}-dev
  labels:
    workshop.redhat.com/module: networking-dev-devops
    workshop.redhat.com/owner: ogsr
spec:
  to:
    kind: Service
    name: parasol-gateway-openshift-default
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Allow
{{- end }}
