# Injected by ws start (helm parameters user, clusterDomain, solve); defaults here serve local
# `helm template` dev.
user: user1
clusterDomain: apps.example.com
# ws solve sets true → renders the module END state (instructor/demo/testing): default-deny +
# precise-allow NetworkPolicies in {user}-dev, an edge and a re-encrypt Route on parasol-web, and the
# exercise-6 Gateway API objects (a ClusterIP-backed Gateway on openshift-default, an HTTPRoute to
# parasol-web, the two policies its Envoy pods need, and the Route that publishes it). Entry (false) =
# the pre-lab world: the 3-tier app on ClusterIP-only Services with no policy and no exposure, which
# the attendee builds by hand.
solve: false
# Per-namespace Layer2 UDN subnet for {user}-partner. Each partner namespace is its own isolated
# L2 segment, so the same range is safe across users; kept off the default pod (10.128/14) and
# service (172.30/16) networks.
partnerSubnet: "10.20.0.0/16"
# In-cluster verification pod image (curl/openssl) — the RHEL tools imagestream is always present,
# needs no external pull secret, and handles the restricted-v2 random UID. The content builder may
# swap this for a UDI image if a jq-carrying client is wanted.
demoClientImage: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest

# BEGIN gen-entry-namespaces manageNamespaces — GENERATED by tools/gen-entry-namespaces.sh, DO NOT EDIT
# This chart's own Namespace/ResourceQuota/LimitRange/RoleBinding render
# (templates/ns-user-namespaces.yaml) is a no-op while this is false. gitops/workshop-config still
# creates all 13 per-user namespaces eagerly today (verified live 2026-08-02: user4-dev carries
# tracking-id workshop-config:/Namespace:openshift-gitops/user4-dev, and the workshop-config
# Application runs prune=true/selfHeal=true) — if this chart ALSO rendered the same Namespace while
# workshop-config still owns it, two Applications would fight over the same object (this chart's
# sync-wave/sync-options annotations stripped by workshop-config's selfHeal, re-added by this
# chart, forever). Flipping this to true is a DELIBERATE migration step that MUST land in the SAME
# change as removing workshop-config's per-user namespace rendering, never before.
manageNamespaces: false
# END gen-entry-namespaces manageNamespaces
