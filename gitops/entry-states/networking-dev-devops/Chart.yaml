apiVersion: v2
name: networking-dev-devops-entry
description: "Networking for Dev & DevOps — the 3-tier claims app (parasol-web + parasol-claims + ephemeral claims-db) in {user}-dev with ClusterIP-only Services (the attendee builds every exposure themselves), a demo-client UDI pod as the in-cluster verification substrate, and a Layer2 Primary UserDefinedNetwork + workload in the workshop-owned {user}-partner namespace (native L2 isolation, no NetworkPolicy). ws solve materializes the END state: default-deny + precise-allow NetworkPolicies (incl. DNS egress, db-from-claims, claims-from-web), an edge Route on parasol-web, a re-encrypt Route, and the exercise-6 Gateway API objects (a ClusterIP-backed Gateway on openshift-default + an HTTPRoute to parasol-web + the two NetworkPolicies its Envoy pods need + the edge Route that publishes it)."
type: application
# 0.1.6: Gateway/HTTPRoute drop SkipDryRunOnMissingResource — their CRDs ship with every OpenShift (ingress
# operator) and the CRD field guard now carries their schema snapshots, so they are checked, not skipped.
# 0.1.5: the solve Gateway opts into the workshop's ogsr-gateway-proxy sizing (1 proxy, 500m/512Mi).
# 0.1.4: the Gateway API end state is no longer gated behind gatewayApi (an LB provider): solve renders the
# attendee's exercise-6 ClusterIP Gateway + HTTPRoute + policies + Route. gatewayApi/certIssuerName removed.
# 0.1.3: imagePullPolicy: Always on every workshop-BUILT image in this chart. Their tags
# (1.0/1.1) are MUTABLE and rebuilt in place, so the kubelet's IfNotPresent default kept serving a
# node-cached layer and a rebuilt image never reached a running pod (measured on a live cluster, 2026-07-29:
# the IS tag moved to a new digest, `oc rollout restart` brought the OLD digest back up). Upstream
# images pinned to a digest or an immutable tag are deliberately left on IfNotPresent. MUST bump:
# Argo's manifest cache is keyed on the chart version.
version: 0.1.6
