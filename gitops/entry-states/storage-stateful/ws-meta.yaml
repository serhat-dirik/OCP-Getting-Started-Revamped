# Namespaces this module needs to EXIST before its entry state can materialize. Consumed by
# `ws prep` -> the per-user namespace Application, so a namespace is created on demand rather
# than all 13 existing up front. NOT the same list as purgeNamespaces below: that answers
# "what do I empty on reset", and at least one module (multi-tenancy-workload-security) needs a
# namespace it deliberately must NOT purge, because a cohabitant module's work lives there.
namespaces:
  - "dev"

# ws reset purges user-created leftovers from these namespaces before re-materializing.
# storage-stateful's entire lesson is storage, so the purge MUST remove the PVCs the attendee creates:
#   - claims-db-data          the Deployment PVC added with `oc set volume` (persistence exercise)
#   - data-pg-sts-0 / -pg-sts-1  the StatefulSet volumeClaimTemplate PVCs
# The StatefulSet PVCs are the important case: they SURVIVE `oc delete statefulset` (Kubernetes
# never garbage-collects volumeClaimTemplate PVCs), so a naive delete leaks storage. The ws CLI
# runs `oc delete all,pvc --all` in each namespace below, which removes every PVC here — proving
# on reset that a fresh entry state has zero PVCs in {user}-dev.
purgeNamespaces:
  - "${USER}-dev"
# Same claims-stack workloads as build-deliver/devspaces-inner-loop/config-multienv — coexisting entry apps deadlock (G3-config-multienv);
# ws start/solve evicts these before materializing; platform-orientation is listed too (shares {user}-dev — same-namespace = conflict, 2026-07-10 policy). Only cross-namespace modules (jobs-batch-kueue) truly coexist.
conflictsWith:
  - platform-orientation
  - build-deliver
  - devspaces-inner-loop
  - config-multienv
  - gitops-fundamentals
  - gitops-at-scale
  - developer-hub-golden-paths
  - observability-health-scale
  - securing-apps-keycloak
  - multi-tenancy-workload-security
  - networking-dev-devops
  - deployment-targets-scheduling
  - registry-images-catalog-governance
  - serverless-zero-to-hero
  - eventing-deep-dive
  - ai-assisted-development
  - packaging-distributing

# Representative attendee muscle storage-stateful leans on, beyond the generic cockpit/identity battery.
# (1) Exercise 2 opens on `oc get storageclass` and every later beat picks its RWO/RWX class out of that
# list — an attendee who cannot list classes cluster-wide has no lab at all. Deliberately the REAL read
# and not `oc auth can-i get storageclasses`: can-i on a CLUSTER-SCOPED resource can answer a false YES
# off a namespaced RoleBinding to a ClusterRole carrying the rule, and it emits a "not namespace scoped"
# warning besides. The read is permitted (verified as user1 + workshop-attendees, 2026-08-05). (2) The
# entry DB is deliberately EPHEMERAL and the attendee converts it — creating PVCs is the lesson.
# ${USER} resolves per-run. QUOTING: single-quotes only, no double-quotes (meta_list strips them).
smokeCommands:
  - "oc get storageclass -o name | grep -q ."
  - "oc auth can-i create persistentvolumeclaims -n ${USER}-dev"
