name: storage-stateful-entry
description: "Storage & Stateful Apps — claims app + an EPHEMERAL PostgreSQL in {user}-dev (data lost on pod restart, by design); ws solve adds the persistent DB (PVC) and a 2-replica PostgreSQL StatefulSet + headless Service"
