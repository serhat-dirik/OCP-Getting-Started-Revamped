# The claims service already deployed (as in build-deliver's end state), wired to claims-db via env.
# Runs the SHARED prebuilt image so storage-stateful never depends on build-deliver's build having happened.
---
# why: the running claims REST API; %prod datasource is env-driven at the Service claims-db.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parasol-claims
  namespace: {{ .Values.user }}-dev
  labels:
    app: parasol-claims
    workshop.redhat.com/module: storage-stateful
    workshop.redhat.com/owner: ogsr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parasol-claims
  template:
    metadata:
      labels:
        app: parasol-claims
        workshop.redhat.com/module: storage-stateful
    spec:
      containers:
        - name: parasol-claims
          # Shared image built once into parasol-images (independent of any per-user build).
          image: image-registry.openshift-image-registry.svc:5000/ogsr-parasol-images/parasol-claims:1.0
          # Mutable workshop tag - rebuilt in place, so a node-cached IfNotPresent layer served the OLD image (measured 2026-07-29).
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            # Point the %prod datasource at the claims-db Service in this namespace.
            - name: POSTGRESQL_HOST
              value: claims-db
            # storage-stateful is the storage module: the app must NOT drop-and-recreate the schema on boot
            # (the image default) or it would wipe/reseed on every restart and mask the storage
            # lesson. `update` keeps whatever the persistent volume holds — so what survives a
            # DB restart is decided by the VOLUME, not by the app. This is the whole point of storage-stateful.
            # `update` also means import.sql never runs (Quarkus loads sql-load-script only under
            # drop-and-create/create), so the database this module starts from is genuinely EMPTY and the
            # lab's first three creates are CLM-1001/1002/1003. The claim_number_seq those numbers come from
            # is created at app startup by ClaimNumberSequence, positioned past whatever the database
            # already holds — which is why POST works here without a seed script. Do NOT "fix" a failing
            # create by switching this to drop-and-create; that reseeds 30 claims and breaks the module.
            - name: QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY
              value: update
          envFrom:
            # POSTGRESQL_USER / _PASSWORD / _DATABASE — the same Secret the DB was initialized with.
            - secretRef:
                name: claims-db
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
---
# why: stable in-cluster address for the claims API (port 8080).
apiVersion: v1
kind: Service
metadata:
  name: parasol-claims
  namespace: {{ .Values.user }}-dev
  labels:
    app: parasol-claims
    workshop.redhat.com/module: storage-stateful
    workshop.redhat.com/owner: ogsr
spec:
  selector:
    app: parasol-claims
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# why: publishes the claims API at parasol-claims-{user}-dev.{clusterDomain} (host auto-generated).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: parasol-claims
  namespace: {{ .Values.user }}-dev
  labels:
    app: parasol-claims
    workshop.redhat.com/module: storage-stateful
    workshop.redhat.com/owner: ogsr
spec:
  to:
    kind: Service
    name: parasol-claims
  port:
    targetPort: http
  tls:
    # Browser-facing Route: MUST be edge-terminated. A plain HTTP Route answers 200 on http:// and
    # 503 on https:// — and the console renders route links as https, while browsers upgrade via
    # HSTS, so an attendee clicking through gets "Application is not available". Measured on this
    # very route 2026-07-26 (http 200 / https 503).
    # insecureEdgeTerminationPolicy: Allow, NOT Redirect — Redirect makes `curl http://...` return
    # an empty 302, which breaks the terminal steps that drive traffic with curl.
    termination: edge
    insecureEdgeTerminationPolicy: Allow
