# Namespaces this module needs to EXIST before its entry state can materialize. Consumed by
# `ws prep` -> the per-user namespace Application, so a namespace is created on demand rather
# than all 13 existing up front. NOT the same list as purgeNamespaces below: that answers
# "what do I empty on reset", and at least one module (multi-tenancy-workload-security) needs a
# namespace it deliberately must NOT purge, because a cohabitant module's work lives there.
namespaces:
  - "dev"

# ws reset purges user-created leftovers from these namespaces before re-materializing.
# application-logging's whole world is {user}-dev: claims-db + parasol-claims + Service + Route
# (this chart), and the claims-logging ConfigMap the LAB creates. `oc delete all,cm` is what returns
# the namespace to entry — the ConfigMap sweep is the load-bearing half here, because exercise 3
# creates claims-logging with the CREATE-only verb at a FIXED name, so a survivor is a collision
# ("already exists"), not residue. The DB is ephemeral (emptyDir), so no PVC survives; the
# platform-owned quota/limitrange/rbac are untouched (this chart never ships them).
purgeNamespaces:
  - "${USER}-dev"
# application-logging materializes the SAME named workloads into {user}-dev that the rest of the dev
# cohort own (parasol-claims / claims-db), so coexisting entry apps deadlock on SharedResourceWarning
# (G3-config-multienv). Same-namespace modules are MUTUAL conflicts (ADR-0001 amendment, 2026-07-10
# policy): ws start/prep/solve evicts the conflicting entry app and purges {user}-dev before
# materializing. THE RECIPROCAL HALF IS NOT IN THIS FILE and must land beside it: gc_conflicts()
# reads only the STARTING module's list, so until each module below lists application-logging back,
# starting one of THEM over a materialized application-logging leaves a dormant
# entry-application-logging orphan (the exact G4 SEV2 shape observability-health-scale hit on
# 2026-07-12). jobs-batch-kueue ({user}-batch), pipelines-fundamentals/trusted-supply-chain
# ({user}-cicd) and resilience-multicluster-dr ({user}-client/-site-a/-site-b) are disjoint
# namespaces → they truly coexist untouched.
conflictsWith:
  - platform-orientation
  - build-deliver
  - devspaces-inner-loop
  - config-multienv
  - storage-stateful
  - gitops-fundamentals
  - gitops-at-scale
  - developer-hub-golden-paths
  - observability-health-scale
  - securing-apps-keycloak
  - multi-tenancy-workload-security
  - networking-dev-devops
  - deployment-targets-scheduling
  - registry-images-catalog-governance
  - serverless-zero-to-hero
  - eventing-deep-dive
  - ai-assisted-development
  - packaging-distributing

# Representative attendee muscle application-logging leans on, beyond the generic cockpit/identity
# battery. (1) `jq` is not optional decoration here — every exercise from 2 onward pipes the log
# through it, and the instructor guide's own pre-flight sends the reader to `adm smoke
# application-logging` for exactly this answer. It is a property of the COCKPIT IMAGE, not of the
# entry state, so nothing else in this module's lifecycle would ever notice it disappearing.
# (2) Reading a Deployment's pod log as the attendee is the module's central verb, and it is a
# SUBRESOURCE (pods/log) rather than the pods read the generic battery covers — the two are granted
# separately, so a namespace where `oc get pods` works and `oc logs` does not is a real, reachable
# state that would kill the module from its first command. ${USER} resolves per-run.
# QUOTING: single-quotes only, no double-quotes (meta_list strips them).
smokeCommands:
  - "command -v jq"
  - "oc logs deploy/parasol-claims -n ${USER}-dev --tail=1"
