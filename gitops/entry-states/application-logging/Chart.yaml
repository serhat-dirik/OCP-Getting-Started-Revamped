apiVersion: v2
name: application-logging-entry
description: "Application Logging — the claims service + ephemeral PostgreSQL in {user}-dev at ONE replica, carrying a readiness probe on /q/health/ready (load-bearing: it is what keeps the old pod serving while the deliberately-broken one crash-loops in exercise 1) and NO logging configuration of any kind: no claims-logging ConfigMap, QUARKUS_LOG_CONSOLE_JSON_ENABLED unset, root level at the image default. Every one of those is something the attendee creates, so the entry state must not. solve=true renders the END state a completed lab produces: a claims-logging ConfigMap carrying QUARKUS_LOG_CONSOLE_JSON_ENABLED=true and QUARKUS_LOG_CATEGORY__COM_PARASOL__LEVEL=DEBUG, sourced by the Deployment, at three replicas. {user}-dev (quota/limits/RBAC) is workshop-layer-owned (per-user-namespaces.yaml), NOT this chart — this chart only fills it, so application-logging shares {user}-dev and conflictsWith that cohort."
type: application
# 0.1.0: first release. Chart version MUST be bumped on every change: Argo's manifest cache is keyed
# on it, so an edited template with an unchanged version can serve the OLD render to a new sync.
version: 0.1.0
