apiVersion: v2
name: application-logging-entry
description: "Application Logging — the claims service + ephemeral PostgreSQL in {user}-dev at ONE replica, carrying a readiness probe on /q/health/ready (load-bearing: it is what keeps the old pod serving while the deliberately-broken one crash-loops in exercise 1), with Parasol's own code (the com.parasol category) at DEBUG so that exercise 3's correlation query has a record per read to find, and otherwise NO logging configuration: QUARKUS_LOG_CONSOLE_JSON_ENABLED unset, root level at the image default. solve=true renders the END state a completed lab produces: the same Deployment with QUARKUS_LOG_CONSOLE_JSON_ENABLED=true at three replicas. {user}-dev (quota/limits/RBAC) is workshop-layer-owned (per-user-namespaces.yaml), NOT this chart — this chart only fills it, so application-logging shares {user}-dev and conflictsWith that cohort."
type: application
# 0.1.0: first release. 0.2.0 (2026-11-15): Parasol's code starts at DEBUG; solve no longer renders a
# claims-logging ConfigMap. Chart version MUST be bumped on every change: Argo's manifest cache is keyed
# on it, so an edited template with an unchanged version can serve the OLD render to a new sync.
version: 0.2.0
