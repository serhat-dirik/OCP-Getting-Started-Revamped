# Proves the entry-state engine ran for this user+module; ws verify checks it, and ws reset
# preserves exactly this one marker while purging everything else out of the namespace.
# application-logging's whole world is one namespace, so there is one marker.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ws-entry-application-logging
  namespace: {{ .Values.user }}-dev
  labels:
    workshop.redhat.com/module: application-logging
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
data:
  module: application-logging
  materializedFor: {{ .Values.user | quote }}
  role: dev
  # Says what the attendee will find, and — more usefully — what they will NOT: the logging
  # configuration is the lab, so the entry state ships none of it.
  note: "claims app (1 replica) + PostgreSQL run here; no claims-logging ConfigMap and no logging env — you create those"
