{{- if .Values.solve }}
# END state for instructor demos / `ws solve application-logging`: the one object a completed lab
# leaves behind. Everything else the lab does to the world is a change to the claims Deployment, so
# it lives in parasol-claims.yaml's own solve branch (envFrom this ConfigMap, three replicas) rather
# than here — same split as observability-health-scale, where the shared Deployment carries the
# solve replica count and this file carries the objects the attendee created.
#
# WHOLLY GATED by .Values.solve, and that gate is what makes the entry-only verify honest: it
# asserts claims-logging is ABSENT, which can only be a true statement about a correctly-materialized
# entry state if nothing outside this `if` can ever render it.
---
# why: the logging configuration the attendee builds in exercise 3, in the object configuration
# belongs in rather than as an ad-hoc `oc set env` on a Deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-logging
  namespace: {{ .Values.user }}-dev
  labels:
    app: parasol-claims
    workshop.redhat.com/module: application-logging
    workshop.redhat.com/owner: ogsr
data:
  # Structured output on — the switch exercise 2 discovers and exercise 3 moves in here.
  QUARKUS_LOG_CONSOLE_JSON_ENABLED: "true"
  # DEBUG, not INFO. The lab creates this key at INFO and flips it to DEBUG in the same exercise, so
  # DEBUG is where a completed lab ends — and the demo depends on it being DEBUG: beat 5's captured
  # output is TEN records for one request id, which is nine DEBUG "claim list served" lines from nine
  # GETs plus the one INFO line from the POST. At INFO the same query returns a single record and the
  # closing beat of the arc falls flat. The double underscores around the quoted segment are the
  # property name, not a typo: quarkus.log.category."com.parasol".level. With single underscores it
  # is simply an unrecognized environment variable and Quarkus logs no warning at all.
  QUARKUS_LOG_CATEGORY__COM_PARASOL__LEVEL: "DEBUG"
{{- end }}
