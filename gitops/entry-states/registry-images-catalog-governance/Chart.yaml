apiVersion: v2
name: registry-images-catalog-governance-entry
description: "Registry, Images & Catalog Governance — seeds {user}-dev with a per-user ImageStream (parasol-claims @ the seed tag, a pull-through/referencePolicy-Local reference to the shared parasol-images build) for the tag/promote beat, a SAMPLE private-registry pull Secret (inert, example.com — the deploy-from-private-registry beat), and the entry marker. The cluster-wide governance surface it inspects (image.config, samples Config, ImagePruner, IDMS/ITMS, OperatorHub sources, ConsoleSamples) is READ-ONLY substrate reached via the workshop-config platform-observer role — never chart-owned (ADR-0001 Rule 13; the install sets allowedRegistriesForImport, mirroring is concept-only). ws solve materializes the END state: the promoted parasol-claims:{promoteTag} istag, an ext-ubi scheduled-import ImageStream, the nginx ImageStream imported from an approved registry (exercise 6), a namespaced custom catalog Template in {user}-dev, and a Deployment wired to pull with the sample registry secret."
type: application
# 0.1.1: imagePullPolicy: Always on every workshop-BUILT image in this chart. Their tags
# (1.0/1.1) are MUTABLE and rebuilt in place, so the kubelet's IfNotPresent default kept serving a
# node-cached layer and a rebuilt image never reached a running pod (measured on a live cluster, 2026-07-29:
# the IS tag moved to a new digest, `oc rollout restart` brought the OLD digest back up). Upstream
# images pinned to a digest or an immutable tag are deliberately left on IfNotPresent. MUST bump:
# Argo's manifest cache is keyed on the chart version.
# 0.1.2: solve's parasol-registry-demo Deployment now runs the PUBLIC pullDemoImage instead of the
# internal sourceImageStream. It names the sample pull secret, and naming one replaces the SA's injected
# default-dockercfg-* — so the internal image could never be pulled and the solved state was permanently
# ImagePullBackOff (user6 field test F-11; re-measured as a controlled pair 2026-08-05). Now a twin of
# the attendee lab's exercise-4 mechanic-B manifest. Bumped so Argo re-renders.
# 0.1.3: solve renders exercise 6's outcome — an nginx ImageStream imported from an APPROVED registry
# (approvedImportRef) — now that the import allowlist is install-set and attendees hit it themselves
# instead of watching an instructor demo. Bumped so Argo re-renders.
version: 0.1.3
