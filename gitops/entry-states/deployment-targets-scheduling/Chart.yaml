apiVersion: v2
name: deployment-targets-scheduling-entry
description: "Deployment Targets & Scheduling — a multi-component claims app in {user}-dev (parasol-web + parasol-claims @ 2 replicas + ephemeral claims-db) with NO scheduling shaping, a statement-batch worker with NO toleration/nodeSelector (the attendee pins it onto the dedicated batch pool), and a dropped-request-tallying load generator against the claims API. The batch pool (a labeled+tainted worker) and any synthetic zones are CLUSTER-SCOPED workshop substrate created ONCE at bootstrap — never by this per-user chart (ADR-0001 Rule 13). ws solve materializes the END state: parasol-claims gains required podAntiAffinity (distinct hostnames) + topologySpreadConstraints + a tuned zero-downtime RollingUpdate + preStop/terminationGracePeriodSeconds; statement-batch gains the toleration + batch-pool nodeSelector; and a PodDisruptionBudget protects the claims API during a node drain."
type: application
# 0.1.3: imagePullPolicy: Always on every workshop-BUILT image in this chart. Their tags
# (1.0/1.1) are MUTABLE and rebuilt in place, so the kubelet's IfNotPresent default kept serving a
# node-cached layer and a rebuilt image never reached a running pod (measured on a live cluster, 2026-07-29:
# the IS tag moved to a new digest, `oc rollout restart` brought the OLD digest back up). Upstream
# images pinned to a digest or an immutable tag are deliberately left on IfNotPresent. MUST bump:
# Argo's manifest cache is keyed on the chart version.
# 0.1.4: files/import.sql re-copied from apps/parasol-claims (the claims-seed copy-drift pair) after
# a stale module number was corrected in its header comment. Comment-only — no SQL statement, id or
# seed row changed — but the pair is compared in "bytes" mode, so the copy must move with the source
# or copy-drift fails, and the version must move with the copy or Argo serves the cached render.
version: 0.1.4
