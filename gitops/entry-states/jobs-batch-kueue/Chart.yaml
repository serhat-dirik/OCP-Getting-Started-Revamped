apiVersion: v2
name: jobs-batch-kueue-entry
description: "Jobs, Batch & Queued Workloads — {user}-batch namespace with a seeded claims-data dataset, a Kueue LocalQueue bound to the per-user ClusterQueue, and MaaS batch-inference credentials, ready for the batch lab"
type: application
# 0.1.5: the MaaS hook now RESOLVES (workshop-owned secret before adopted Lightspeed), VALIDATES
# (JWT shape gate + a 1-token live probe) and only then STAGES the key — the old code copied whatever
# the adopted Lightspeed secret held, which on an Azure-OpenAI cluster is an Azure AD JWT: staged
# green, rejected at model-call time (a live cluster, 2026-07-29). MUST bump: this is a hook-only change, and
# Argo's manifest cache is keyed on the chart version — a stale render can re-apply the old hook
# minutes later on an unrelated reconcile.
# 0.1.6: define DST_USER. 0.1.5 referenced it in the rejected-credential guidance but never set it,
# and the script runs under `set -u` — so the hook died mid-sentence while printing its own error and
# never reached the exit-0 degrade. Job failed 5/5, maas-config was never patched, and the module's
# sync failed on precisely the clusters that were supposed to degrade quietly (no workshop MaaS key).
# Same manifest-cache reasoning as 0.1.5: hook-only change, MUST bump.
# 0.1.7: maas-config (and, in ai-assisted-development, maas-config-env) no longer renders model/
# endpoint from chart values — the Sync hook is their sole writer. Helm wrote the chart default and the
# hook patched it to the cluster's real per-key model scope seconds later, so the live ConfigMap
# permanently diverged from the render; with selfHeal off the whole Application read OutOfSync forever
# over one key, and ws-meta had to declare expectOutOfSync to keep `ws start`/`prep`/`reset` from
# failing on a healthy world. A value that comes from cluster state does not belong in the rendered
# manifest. MUST bump: Argo's manifest cache is keyed on the chart version.
# 0.1.8: the claims-data-seed Sync hook now records its actual row count into the
# ws-entry-jobs-batch-kueue marker ConfigMap (seededRows, live-only key — never rendered by the
# chart, same trick as maas-config's hook-only keys above) instead of only reaching Job Complete.
# Added narrowly-scoped RBAC (ServiceAccount + Role + RoleBinding, get/patch pinned by
# resourceNames to that one ConfigMap) and switched the seed container's image from
# ubi9-minimal to ose-cli because the patch needs `oc` (memory limit raised 128Mi -> 512Mi to
# match: oc OOMs under 512Mi elsewhere in this repo). Hook-only + RBAC change: MUST bump, or a
# re-sync with nothing else drifted will not re-execute the Sync-phase hook and this silently
# never takes effect (a deleted hook Job or a forced resource sync is needed either way).
# 0.1.10: all three solve-endstate container images move off `registry.access.redhat.com/ubi9/
# ubi-minimal:latest` onto the digest that tag resolved to on 2026-08-12 (index digest 7c372902…,
# labels version=9.8 release=1786380870, freshness A). A floating tag meant every cohort could run a
# different image than the one this end state was measured against — and `ws solve` is what an
# instructor projects. Rendering change to three pod templates, so the bump is load-bearing against
# Argo's manifest cache. Re-resolve with `oc image info --show-multiarch <ref>`; the provenance and
# the auth-free catalog-API command are in the file, at the monthly-statement worker.
version: 0.1.10
