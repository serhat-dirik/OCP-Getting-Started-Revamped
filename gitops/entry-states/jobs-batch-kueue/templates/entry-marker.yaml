# Proves the entry-state engine ran for this user+module; ws verify checks it.
#
# `seededRows` is DELIBERATELY NOT RENDERED HERE. It is written live by the claims-data-seed Sync
# hook (templates/claims-data.yaml) after it counts the rows it actually wrote to the PVC — the
# chart cannot know that count at render time. Same trick as maas-config's aiPathAvailable/
# aiPathReason/credentialSource (templates/maas-credentials.yaml): a key the chart never renders is
# not part of Argo's diff, so the hook can freely patch it in without making this ConfigMap
# OutOfSync (entry Applications run selfHeal=false — see ws-meta.yaml's expectOutOfSync history for
# why that distinction matters here). `ws verify` reads `seededRows` to assert the DATA exists,
# instead of proxying through the seed Job's Complete condition (whose pod logs get GC'd).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ws-entry-jobs-batch-kueue
  namespace: {{ include "jobs-batch-kueue.namespace" . }}
  labels:
    workshop.redhat.com/module: jobs-batch-kueue
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
data:
  module: jobs-batch-kueue
  materializedFor: {{ .Values.user | quote }}
  # The batch world lives here, not in {user}-dev — this module's namespace is {user}-batch.
  namespace: {{ include "jobs-batch-kueue.namespace" . }}
  localQueue: user-queue
  clusterQueue: {{ include "jobs-batch-kueue.clusterQueue" . | quote }}
