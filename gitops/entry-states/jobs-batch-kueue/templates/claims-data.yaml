# The shared input dataset for the batch lab: 200 deterministic claim records that the
# monthly-statement, Indexed, CronJob and inference Jobs all mount read-only at /data (/data/claims.csv).
#
# A ConfigMap, not a PVC (chart 0.1.11). It used to be a ReadWriteMany PVC on a CephFS class, filled
# by a Sync-hook seed Job; on a cluster with block storage only (EBS gp2/gp3) the claim stayed Pending
# forever and `ws prep` hung. Parallel readers need the same file on every node and nothing more: a
# ConfigMap gives them that with no StorageClass, no access mode and no seed step.
#
# files/claims.csv is byte-identical to what that seed wrote (generated once from its own loop, which
# is in git history at chart 0.1.10), so every expected output in the lab still holds: 200 rows, total
# exposure 2853700, five shard subtotals. Ceiling: a ConfigMap holds at most 1 MiB; this file is ~8 KiB.
# Default sync wave, like the PVC it replaces; within a wave Argo applies ConfigMaps before Jobs, so
# the solve Jobs never start ahead of their input.
apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-data
  namespace: {{ include "jobs-batch-kueue.namespace" . }}
  labels:
    app: claims-data
    workshop.redhat.com/module: jobs-batch-kueue
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
data:
{{ (.Files.Glob "files/claims.csv").AsConfig | indent 2 }}
