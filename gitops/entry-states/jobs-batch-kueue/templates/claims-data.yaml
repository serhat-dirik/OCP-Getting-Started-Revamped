# The shared input dataset for the batch lab: a small, deterministic CSV of claim records the
# monthly-statement / indexed / inference Jobs all read. It is a PVC (not a ConfigMap) on purpose
# — "reuse a seeded PVC as shared input to parallel Jobs" is part of the lesson.
#
# ACCESS MODE = ReadWriteMany. The statement Job (parallelism 3) and inference Job (parallelism 2)
# run pods the scheduler spreads across nodes, and they all mount this volume at once. The default
# block class (RWO) can only attach to one node at a time, so parallel pods on other nodes would
# fail with Multi-Attach — RWX (CephFS here) is required. This is a deliberate deviation from a
# plain "default StorageClass" PVC, and it is itself a teaching point (access modes, callback to
# the storage module).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claims-data
  namespace: {{ include "jobs-batch-kueue.namespace" . }}
  labels:
    app: claims-data
    workshop.redhat.com/module: jobs-batch-kueue
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
spec:
  accessModes:
    - {{ .Values.datasetAccessMode }}
  storageClassName: {{ .Values.datasetStorageClass }}
  resources:
    requests:
      storage: {{ .Values.datasetSize }}
---
# why: let the seed hook record how many rows it actually wrote into the ONE named marker
# ConfigMap it needs (get to read-merge, patch to write) — nothing broader. This is the fix for
# "the check can only prove the Job reached Complete, not that the data exists": the marker's
# seededRows field is what `ws verify` will assert on instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claims-seed-jobs-batch-kueue-{{ .Values.user }}
  namespace: {{ include "jobs-batch-kueue.namespace" . }}
  labels:
    workshop.redhat.com/module: jobs-batch-kueue
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claims-seed-jobs-batch-kueue-{{ .Values.user }}
  namespace: {{ include "jobs-batch-kueue.namespace" . }}
  labels:
    workshop.redhat.com/module: jobs-batch-kueue
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["ws-entry-jobs-batch-kueue"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claims-seed-jobs-batch-kueue-{{ .Values.user }}
  namespace: {{ include "jobs-batch-kueue.namespace" . }}
  labels:
    workshop.redhat.com/module: jobs-batch-kueue
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: claims-seed-jobs-batch-kueue-{{ .Values.user }}
subjects:
  - kind: ServiceAccount
    name: claims-seed-jobs-batch-kueue-{{ .Values.user }}
    namespace: {{ include "jobs-batch-kueue.namespace" . }}
---
# Sync-hook Job: seeds claims-data with ~200 deterministic claim rows. Runs on every entry-state
# sync (ws start / reset); BeforeHookCreation clears the prior Job so a re-sync re-fires, and the
# write is idempotent (it rewrites the same file), so re-runs are safe. Wave 1 = after the PVC
# and after the marker ConfigMap + RBAC above (those render at the default wave, i.e. before hooks).
#
# 0.1.8: the seed used to only prove itself via its own Complete condition + a best-effort log grep
# ("seeded N claim rows") — unreliable, because a completed Job keeps Complete long after its pod's
# logs are garbage-collected, so `ws verify` was asserting the JOB ran, never that the DATA exists.
# Now the hook also patches its row count into the ws-entry-jobs-batch-kueue marker ConfigMap
# (RBAC above), so verify can assert seededRows instead. Image switched ubi9-minimal -> ose-cli
# because the patch needs `oc`; ose-cli needs >=512Mi (measured OOM at 256Mi elsewhere in this
# repo) — bumped the memory limit accordingly. MUST bump the chart version: this is a hook-only
# change and Argo will not re-execute an unchanged Sync-phase hook on its own.
apiVersion: batch/v1
kind: Job
metadata:
  name: claims-data-seed-jobs-batch-kueue-{{ .Values.user }}
  namespace: {{ include "jobs-batch-kueue.namespace" . }}
  labels:
    workshop.redhat.com/module: jobs-batch-kueue
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: claims-data-seed
        workshop.redhat.com/module: jobs-batch-kueue
    spec:
      serviceAccountName: claims-seed-jobs-batch-kueue-{{ .Values.user }}
      restartPolicy: Never
      containers:
        - name: seed
          # ose-cli ships oc (needed to patch the marker ConfigMap) and bash; same image choice as
          # the sibling maas-copy hook in this chart.
          # Digest-pinned; el8 `ose-cli:latest` was frozen on v4.15.0 with unapplied Critical errata.
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22@sha256:f8bbc73242af3eae3f8361a9611b29384d3577dba4d5e5b62f4beb2750862c19
          # `oc` is a large Go binary — 256Mi OOMKills it; 512Mi limit gives it headroom (same
          # numbers as the maas-copy hook in this chart).
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: 200m, memory: 512Mi}
          env:
            - name: MARKER_NS
              value: {{ include "jobs-batch-kueue.namespace" . | quote }}
            - name: MARKER_CM
              value: "ws-entry-jobs-batch-kueue"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              OUT=/data/claims.csv
              echo "id,claimant,type,region,amount,status" > "$OUT"
              # Deterministic pseudo-data: fixed lists indexed by the row number, so every seed
              # produces byte-identical content (reproducible shards for the Indexed Job exercise).
              i=1
              while [ "$i" -le 200 ]; do
                names="Rahman Fletcher Das Okonkwo Nguyen Ivanova Silva Haddad Kowalski Reyes"
                types="auto home life travel commercial"
                regions="north south east west central"
                statuses="new triage review approved denied"
                name=$(echo $names   | cut -d' ' -f$(( (i % 10) + 1 )))
                type=$(echo $types    | cut -d' ' -f$(( (i % 5) + 1 )))
                region=$(echo $regions | cut -d' ' -f$(( (i % 5) + 1 )))
                status=$(echo $statuses | cut -d' ' -f$(( (i % 5) + 1 )))
                amount=$(( 500 + (i * 137) % 49500 ))
                printf 'CLM-%04d,%s,%s,%s,%d,%s\n' "$i" "$name" "$type" "$region" "$amount" "$status" >> "$OUT"
                i=$(( i + 1 ))
              done
              ROWS=$(( $(wc -l < "$OUT") - 1 ))
              echo "seeded ${ROWS} claim rows into $OUT"
              head -3 "$OUT"
              # THE FIX: record the count durably so verify can assert the DATA, not just the Job's
              # Complete condition. seededRows is deliberately absent from the chart's rendered
              # ConfigMap (see templates/entry-marker.yaml) so this patch never fights the render.
              echo "▶ recording row count in ${MARKER_NS}/${MARKER_CM} (seededRows=${ROWS})…"
              oc patch configmap "${MARKER_CM}" -n "${MARKER_NS}" --type merge \
                -p "{\"data\":{\"seededRows\":\"${ROWS}\"}}"
              echo "✅ marker updated — verify can assert seededRows instead of proxying through Job status"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: claims-data
