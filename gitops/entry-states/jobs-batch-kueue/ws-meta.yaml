# ws reset purges user-created leftovers from these namespaces before re-materializing.
# jobs-batch-kueue's in-namespace state lives in {user}-batch, so the purge removes every Job/CronJob/Pod the
# attendee created AND the chart-owned claims-data PVC — the ws CLI runs `oc delete all,pvc --all`
# here. The chart then re-materializes the seeded dataset, the LocalQueue, and the MaaS credentials,
# so a reset returns a clean entry state.
# NOTE: the {user}-batch NAMESPACE, its quota, its LimitRange, and its RBAC are WORKSHOP-LAYER-owned
# (gitops/workshop-config/templates/per-user-batch.yaml — the workshop-entries AppProject blacklists
# ResourceQuota/LimitRange, so an entry chart cannot create them; G3-jobs-batch-kueue F1). Like {user}-dev/stage/
# prod/cicd, the namespace SURVIVES reset with the same UID — the entry Application owns only the
# in-namespace objects listed above, and deleting it prunes those, never the namespace.
# The maas-copy Sync hook patches maas-config's `model` to the cluster's real per-key scope (the
# credential Secret's `model` key wins over the chart default), so the live ConfigMap STRUCTURALLY
# diverges from the rendered template — and because entry apps run selfHeal=false, that diff never
# self-corrects. The app is permanently OutOfSync BY DESIGN. Without this, `ws start`/`ws prep`/
# `ws reset` sit the full waitSeconds and exit RED on a perfectly healthy module.
#
# agentic-ai learned this on 2026-07-19 and declared it; these modules share the identical hook but
# were never caught, because until 2026-07-29 their hooks did not reach the patch — either the chart
# default happened to match, or the credential was rejected and the hook degraded without writing a
# model. Making the credential resolve correctly is exactly what exposed them: all three went
# OutOfSync the moment they started working. A fix that turns healthy modules red is not finished.
expectOutOfSync: true

purgeNamespaces:
  - "${USER}-batch"
