# Namespaces this module needs to EXIST before its entry state can materialize. Consumed by
# `ws prep` -> the per-user namespace Application, so a namespace is created on demand rather
# than all 13 existing up front. NOT the same list as purgeNamespaces below: that answers
# "what do I empty on reset", and at least one module (multi-tenancy-workload-security) needs a
# namespace it deliberately must NOT purge, because a cohabitant module's work lives there.
namespaces:
  - "dev"
  - "gitops"
  - "prod"
  - "stage"

# ws reset purges user-created leftovers from these namespaces before re-materializing.
# gitops-at-scale's entry state is the gitops-fundamentals END STATE (claims GitOps-managed in {user}-dev + {user}-stage via two
# student Applications) + a {user}/claims-config fork extended with the rollouts/ + applicationset
# source + per-user analysis prereqs in {user}-prod. During the lab the attendee converts the envs to
# an ApplicationSet and converts {user}-prod to an Argo Rollout (canary + analysis). Reset must clear
# (a) claims workloads in dev/stage/prod — purgeNamespaces — and (b) the attendee's Application/
# ApplicationSet CRs, which under ADR-0002 amendment 1 (option B) live in the student-gitops CONTROL
# PLANE, not in a purge namespace — purgeApps* below. The fork is NOT purged (entry state), but the
# fork job RE-ASSERTS its canonical content on every start/reset (factory-fresh). {user}-prod is
# purged too (gitops-at-scale reaches prod, unlike gitops-fundamentals) so a canary/analysis left mid-flight is cleared; the
# analysis SA + gitops-at-scale-canary-control knob are re-materialized by the entry hooks. {user}-gitops is
# purged (workspace/marker ns) so any kustomize scratch is cleared; purge_ns keeps the current marker.
purgeNamespaces:
  - "${USER}-gitops"
  - "${USER}-dev"
  - "${USER}-stage"
  - "${USER}-prod"
# Attendee-created Argo Applications AND ApplicationSets live outside every purge namespace
# (student-gitops control plane), so the engine deletes them by AppProject: ws reset AND conflict
# eviction call purge_apps, which removes every Application in purgeAppsNamespace whose
# .spec.project == purgeAppsProject. This project overlaps gitops-fundamentals's (same student instance, same
# proj-{user}) — that is CORRECT: purge is per-project, and both modules' resets clean attendee apps.
# (ApplicationSet-generated child Applications also carry proj-{user}; deleting the ApplicationSet
# prunes them, and any that outlive it are swept by the same project selector.)
purgeAppsNamespace: ogsr-student-gitops
purgeAppsProject: proj-${USER}
# gitops-at-scale deploys claims into {user}-dev/stage (gitops-fundamentals end state) AND {user}-prod (Rollout), the SAME
# namespaces platform-orientation-storage-stateful own AND gitops-fundamentals reaches. Starting gitops-at-scale evicts those entry apps + their attendee apps
# (gc calls purge_apps for each conflicting module) and purges dev/stage/prod, so the attendee starts
# clean. platform-orientation-storage-stateful AND gitops-fundamentals reciprocally list gitops-at-scale (PM-sanctioned both-directions edit 2026-07-11), so
# switching either direction is clean. jobs-batch-kueue ({user}-batch) and pipelines-fundamentals ({user}-cicd) are disjoint.
conflictsWith:
  - platform-orientation
  - build-deliver
  - devspaces-inner-loop
  - config-multienv
  - storage-stateful
  - gitops-fundamentals
  - developer-hub-golden-paths
  - observability-health-scale
  - securing-apps-keycloak
  - multi-tenancy-workload-security
  - networking-dev-devops
  - deployment-targets-scheduling
  - registry-images-catalog-governance
  - serverless-zero-to-hero
  - eventing-deep-dive
  - ai-assisted-development
  - packaging-distributing
# The entry hook BLOCKS while the two gitops-fundamentals-end-state student Applications deploy claims into
# {user}-dev and {user}-stage (~4-6 min cold: image pull + claims-db + app startup, both envs); solve
# adds a third (prod Rollout) synced to Healthy. ws start/solve wait windows must outlive it; the
# hook Jobs' activeDeadlineSeconds (900) is the hard stop.
waitSeconds: 900

# Representative attendee muscle gitops-at-scale leans on, beyond the generic cockpit/identity battery.
# This module is the only one whose entry state is ANOTHER module's end state, so the two cheapest proofs
# that the hand-off actually materialized are: (1) the promoted stage app from the gitops-fundamentals
# end-state Job — absent means the attendee starts exercise 1 with nothing to scale out from; and (2) the
# canary knob the AnalysisRun beat flips (`oc patch cm gitops-at-scale-canary-control ... verdict=fail`),
# which comes from analysis-prereqs.yaml rather than the inherited end state, so it fails independently.
# Both are namespaced reads the attendee holds in their own namespaces.
# ${USER} resolves per-run. QUOTING: single-quotes only, no double-quotes (meta_list strips them).
smokeCommands:
  - "oc get deploy parasol-claims -n ${USER}-stage -o name"
  - "oc get cm gitops-at-scale-canary-control -n ${USER}-prod -o name"
