# Proves the entry-state engine ran for this user+module; ws verify + ws prep check it.
# Lives in {user}-gitops (gitops-at-scale's home namespace: where the attendee's Argo CD Applications live).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ws-entry-gitops-at-scale
  namespace: {{ .Values.user }}-gitops
  labels:
    workshop.redhat.com/module: gitops-at-scale
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
data:
  module: gitops-at-scale
  materializedFor: {{ .Values.user | quote }}
{{- range $env := list "dev" "stage" "prod" }}
---
# Same marker in {user}-{{ $env }}: this entry state deploys claims into dev/stage itself (the
# gitops-fundamentals end state) and the lab converts prod, so ws prep's leftover scan (workloads
# without a ws-entry-<module> marker) must not call a freshly prepared world "leftovers" (SEV2 2026-11-12).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ws-entry-gitops-at-scale
  namespace: {{ $.Values.user }}-{{ $env }}
  labels:
    workshop.redhat.com/module: gitops-at-scale
    workshop.redhat.com/user: {{ $.Values.user | quote }}
    workshop.redhat.com/owner: ogsr
data:
  module: gitops-at-scale
  materializedFor: {{ $.Values.user | quote }}
{{- end }}
