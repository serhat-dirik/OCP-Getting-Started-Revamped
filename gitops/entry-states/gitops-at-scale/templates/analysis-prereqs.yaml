# Per-user canary-analysis prerequisites in {user}-prod — the PLATFORM half of gitops-at-scale's automated
# analysis (the attendee's AnalysisTemplate in the fork references these by name). The job-provider
# AnalysisTemplate runs its probe Job under the claims-analysis SA and reads the gitops-at-scale-canary-control
# ConfigMap knob; both must exist BEFORE the attendee converts prod to a Rollout, so the entry state
# owns them (not the fork). Deliberately NOT the Prometheus/thanos-querier + cluster-monitoring-view
# path the build note sketched: the job provider needs only a namespaced configmaps-read grant, so the
# per-user footprint is one SA + a tiny Role — no cluster-scoped monitoring RBAC (see the
# progressive-delivery stack README for the metrics-source decision).
#
# These are plain resources (not Argo hooks): the entry app owns them, so they are pruned on reset and
# re-created on the next start. The verdict knob defaults to "pass" (healthy) — the attendee flips it
# to "fail" to trigger the deterministic auto-rollback beat.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claims-analysis
  namespace: {{ .Values.user }}-prod
  labels:
    workshop.redhat.com/module: gitops-at-scale
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
---
# why: the analysis probe Job reads the gitops-at-scale-canary-control ConfigMap to honor the verdict knob.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claims-analysis
  namespace: {{ .Values.user }}-prod
  labels:
    workshop.redhat.com/module: gitops-at-scale
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claims-analysis
  namespace: {{ .Values.user }}-prod
  labels:
    workshop.redhat.com/module: gitops-at-scale
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: claims-analysis
subjects:
  - kind: ServiceAccount
    name: claims-analysis
    namespace: {{ .Values.user }}-prod
---
# Deterministic analysis knob: verdict=pass → real canary health probe; verdict=fail → forced failed
# assessment (the "ship a bad release" beat). Mutable by the attendee (oc patch) — the analysis Job
# reads it fresh on every run.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitops-at-scale-canary-control
  namespace: {{ .Values.user }}-prod
  labels:
    workshop.redhat.com/module: gitops-at-scale
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
    # Fails ON PURPOSE when flipped — see entry-states/README.md rule 7 and `ws by-design`.
    # Not gated on solve: the knob is the knob in both states, and its "fail" position is reachable
    # at any time by the attendee (or the instructor driving the demo by hand).
    workshop.redhat.com/by-design: "true"
  annotations:
    # A Rollout that goes Degraded and auto-rolls-back is a page on any other cluster. Here it is the
    # scripted climax of exercise 4, and the trigger is one word in this ConfigMap — which is invisible
    # from the Rollout, from the AnalysisRun, and from the Argo dashboard.
    workshop.redhat.com/by-design-symptom: >-
      Rollout Degraded with a failed canary AnalysisRun and an automatic rollback, whenever
      data.verdict is "fail"
    workshop.redhat.com/by-design-reason: >-
      gitops-at-scale: this is a deterministic failure switch, not a health signal. verdict=pass is
      a real canary probe; the attendee patches it to "fail" to force the "ship a bad release" beat
      and watch Argo Rollouts roll back on its own. If a Rollout in {{ .Values.user }}-prod is
      Degraded, read this key first — `oc get cm gitops-at-scale-canary-control -n {{ .Values.user }}-prod
      -o jsonpath='{.data.verdict}'`. Setting it back to "pass" clears the forced failure.
data:
  verdict: "pass"
