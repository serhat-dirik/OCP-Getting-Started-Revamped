# why: lab section 6 builds a function ON the cluster (`kn func deploy --remote`), and that pipeline's
# buildah step pushes to image-registry.openshift-image-registry.svc over TLS signed by the service CA.
# OpenShift Pipelines mounts this ConfigMap into every step at /tekton-custom-certs (SSL_CERT_DIR), and
# the service-ca operator fills it via the inject-cabundle annotation. The Pipelines operator creates it
# once per namespace, but `ws prep`/`ws reset` purge every ConfigMap not on their allowlist and the
# operator never recreates it (it marks the namespace done). Without it the push fails
# `x509: certificate signed by unknown authority` (measured 2026-11-12, user10-dev). Shipping it here
# makes every materialize restore it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-service-cabundle
  namespace: {{ .Values.user }}-dev
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    service.beta.openshift.io/inject-cabundle: "true"
  labels:
    workshop.redhat.com/module: serverless-zero-to-hero
    workshop.redhat.com/owner: ogsr
