# Namespaces this module needs to EXIST before its entry state can materialize. Consumed by
# `ws prep` -> the per-user namespace Application, so a namespace is created on demand rather
# than all 13 existing up front. NOT the same list as purgeNamespaces below: that answers
# "what do I empty on reset", and at least one module (multi-tenancy-workload-security) needs a
# namespace it deliberately must NOT purge, because a cohabitant module's work lives there.
namespaces:
  - "dev"

# ws reset purges user-created leftovers (workloads/builds/services/routes/pvcs) from
# these namespaces before re-materializing — build-deliver's entry state is "an EMPTY dev namespace
# plus the Gitea forks". The forks themselves are NOT purged (they are entry state; the
# fork job re-creates them idempotently on the next start).
purgeNamespaces:
  - "${USER}-dev"
# Modules whose entry/solve charts materialize the SAME named workloads (parasol-claims /
# claims-db in ${USER}-dev). Coexisting Argo apps deadlock over them (SharedResourceWarning,
# both OutOfSync — G3-config-multienv evidence), so `ws start`/`ws solve` evicts these before materializing.
# platform-orientation is listed too: it shares {user}-dev, and same-namespace modules are conflicts by policy
# (2026-07-10). Only cross-namespace modules (jobs-batch-kueue {user}-batch) truly coexist.
conflictsWith:
  - platform-orientation
  - devspaces-inner-loop
  - config-multienv
  - storage-stateful
  - gitops-fundamentals
  - gitops-at-scale
  - developer-hub-golden-paths
  - observability-health-scale
  - application-logging
  - securing-apps-keycloak
  - multi-tenancy-workload-security
  - networking-dev-devops
  - deployment-targets-scheduling
  - registry-images-catalog-governance
  - serverless-zero-to-hero
  - eventing-deep-dive
  - ai-assisted-development
  - packaging-distributing

# Representative attendee muscle build-deliver leans on, beyond the generic cockpit/identity battery.
# (1) Exercise 4 runs `oc process openshift//parasol-postgresql-ephemeral | oc apply -f -` — the shared
# Template in the `openshift` namespace is a bootstrap-seeded prerequisite that lives OUTSIDE the entry
# chart, so nothing else in this module's lifecycle notices when it is missing; the attendee finds out
# mid-lab. The read is permitted to attendees even though the `openshift` PROJECT is not (verified as
# user1 + workshop-attendees, 2026-08-05 — same shape as registry-images-catalog-governance's `oc get is
# java-21 -n openshift`). (2) Every build beat in the module is a BuildConfig the attendee creates
# themselves. ${USER} resolves per-run. QUOTING: single-quotes only, no double-quotes (meta_list strips them).
smokeCommands:
  - "oc get template parasol-postgresql-ephemeral -n openshift -o name"
  - "oc auth can-i create buildconfig -n ${USER}-dev"
