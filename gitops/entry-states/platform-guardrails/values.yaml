# Injected by ws start (helm parameters); defaults here serve local `helm template` dev.
user: user1
clusterDomain: apps.example.com
# ws solve sets true → render the END state a completed lab produces (see solve-endstate.yaml and
# the seed script in openbao.yaml): OpenBao's parasol/claims-db has been WRITTEN TWICE, so kv-v2
# reports current_version 2, and the ExternalSecret has re-synced Secret claims-creds to the second
# value. The version counter — not the password itself — is what entry and end differ by, because
# the attendee picks their own rotation value and grading an exact string would print ❌ over
# correct work. ws verify's end mode grades exactly that pair: current_version >= 2, and the
# Kubernetes Secret still equal to what OpenBao holds right now.
solve: false

# The password this chart seeds into OpenBao at pod start, and therefore the one PostgreSQL is
# initialized with and the claims app authenticates with. `parasol` is the same well-known workshop
# credential every other dev-cohort chart uses (application-logging's claims-db Secret, config-multienv's
# overlays) — it is a workshop fixture, not a secret, and the privacy guard treats it as such.
#
# WHY A FIXED VALUE, when the module's whole point is "not in Git". Two reasons, and the second is
# the load-bearing one:
#   1. What the lesson claims is that the APP's credential is not in Git, and that stays true —
#      but state it PRECISELY, because a repo-wide grep does not back the loose version. There IS a
#      `kind: Secret` named claims-creds in this repository: gitops/promotion/claims-config-template/
#      base/claims-creds-secret.yaml, config-multienv's teaching fixture, carrying
#      POSTGRESQL_PASSWORD: parasol in plaintext stringData. Same name, same value, different module.
#      Measured 2026-08-23 while capturing this module's lab — an attendee running the grep the lab
#      invites WILL find it. That is not a problem to hide; the lab uses it, side by side, as the
#      anti-pattern this module replaces. The precise claim: nothing in THIS module's chart creates
#      claims-creds, and the Secret in {user}-dev exists only
#      because ESO materialized it from OpenBao. Seeding the vault is the ops bootstrap step that a
#      human or a pipeline does out-of-band in production; here the chart stands in for that human.
#   2. A randomly-generated seed was tried first and is WRONG here: OpenBao dev mode keeps its kv
#      in memory, so any restart of that pod would mint a NEW password, the ExternalSecret would
#      re-sync it, and the already-running PostgreSQL — initialized with the OLD one — would start
#      refusing the app. A fixed seed makes an OpenBao restart a no-op, which is what an entry state
#      that must re-apply safely requires.
claimsDbPassword: "parasol"
# The value `ws solve` rotates TO. Only ever written when solve=true, and only as the SECOND kv
# write, so the end state is reached the same way an attendee reaches it — by rotating — rather than
# by seeding a different world. Any value differing from claimsDbPassword works; this one is
# self-describing in a `bao kv get` an instructor runs during a demo.
claimsDbPasswordRotated: "parasol-rotated"

# How often ESO re-reads OpenBao. 15s because the rotation exercise is "run one command, then WATCH
# the Secret change": a minute of nothing reads as a broken lab, and the attendee reaches for
# `oc delete externalsecret` to force it. Verified at this value on the eso-probe reference
# implementation, and re-measured in this chart (see the module's verify script).
refreshInterval: 15s

# OpenBao dev server, pinned to the version proven on-cluster rather than :latest — a workshop that
# reads `bao` output in its lab text cannot afford the CLI's help or JSON shape moving under it
# between two runs of the same session. 2.6.2 is what the eso-probe reference implementation
# resolved to (quay.io/openbao/openbao@sha256:11fd73a2…, read 2026-08-23).
openbaoImage: quay.io/openbao/openbao:2.6.2

# BEGIN gen-entry-namespaces manageNamespaces — GENERATED by tools/gen-entry-namespaces.sh, DO NOT EDIT
# This chart's own Namespace/ResourceQuota/LimitRange/RoleBinding render
# (templates/ns-user-namespaces.yaml) is a no-op while this is false. gitops/workshop-config still
# creates all 13 per-user namespaces eagerly today (verified live 2026-08-02: user4-dev carries
# tracking-id workshop-config:/Namespace:openshift-gitops/user4-dev, and the workshop-config
# Application runs prune=true/selfHeal=true) — if this chart ALSO rendered the same Namespace while
# workshop-config still owns it, two Applications would fight over the same object (this chart's
# sync-wave/sync-options annotations stripped by workshop-config's selfHeal, re-added by this
# chart, forever). Flipping this to true is a DELIBERATE migration step that MUST land in the SAME
# change as removing workshop-config's per-user namespace rendering, never before.
manageNamespaces: false
# END gen-entry-namespaces manageNamespaces
