apiVersion: v2
name: platform-guardrails-entry
description: "Platform Guardrails — the claims stack in {user}-dev whose ONLY database credential comes from an OpenBao dev server through External Secrets: OpenBao holds parasol/claims-db, a SecretStore reaches it, an ExternalSecret materializes Secret claims-creds, and BOTH claims-db and parasol-claims read POSTGRESQL_PASSWORD from that Secret. No manifest in this chart carries the app's password — that absence is the lesson, and it is checkable (`grep -r POSTGRESQL_PASSWORD gitops/entry-states/platform-guardrails` finds only key names). The kv-v2 version counter is the entry/end discriminator: entry seeds ONCE (current_version 1), so the rotation exercise has a change left to show. The policy half needs nothing from this chart — the ValidatingAdmissionPolicy ogsr-attendee-entry-app-guard the attendee reads and violates is live cluster-wide, owned by gitops/workshop-config. solve=true renders the END state: the seed writes a SECOND version (current_version 2), the ExternalSecret re-syncs, and the workloads come up on the rotated value. {user}-dev (quota/limits/RBAC) is workshop-layer-owned (per-user-namespaces.yaml), NOT this chart — this chart only fills it, so platform-guardrails shares {user}-dev and conflictsWith that cohort."
type: application
# 0.1.0: first release. Chart version MUST be bumped on every change: Argo's manifest cache is keyed
# on it, so an edited template with an unchanged version can serve the OLD render to a new sync.
version: 0.1.0
