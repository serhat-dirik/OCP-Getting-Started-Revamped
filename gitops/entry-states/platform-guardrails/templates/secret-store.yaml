# The ESO half of the credential path: a namespaced SecretStore pointing at this user's own OpenBao,
# and the ExternalSecret that turns parasol/claims-db into Kubernetes Secret claims-creds.
#
# NAMESPACED SecretStore, never ClusterSecretStore. A ClusterSecretStore is a cluster-scoped object,
# so an attendee could not own one (they hold namespace admin and nothing at cluster scope), the
# entry Application's AppProject whitelists exactly one cluster-scoped kind (Namespace), and one
# object shared by 12 attendees would let any of them read every other's vault. Namespaced also means
# `tokenSecretRef` resolves in THIS namespace, which is where openbao-token lives.
#
# THE ONE PIECE THIS CHART CANNOT SHIP, and the failure it produces:
# the ESO operator installs `eso-sys-deny-all-traffic` in its operand namespace (podSelector {},
# Ingress AND Egress) plus allow-lists for the API server and DNS only. The controller therefore
# cannot open a TCP connection to port 8200 in ANY tenant namespace until something grants that
# egress — and the error it reports is
#     invalid vault credentials: context deadline exceeded
# on the SecretStore, which reads as a bad token and is in fact a blocked connection. Hours go into
# re-checking the token before anyone looks at the network.
# The grant is a NetworkPolicy in the ESO operand namespace, which is platform-layer state: it is
# outside every entry AppProject's destinations, and rule 1 of this repo puts it in the portfolio
# rather than in a chart an attendee owns. It is `stacks: [secrets]` in modules.yaml. Until that
# stack exists, this module depends on a NetworkPolicy applied out of band — tools/verify/platform-guardrails.sh
# names it in the hint on the SecretStore check so the failure points at the cause. Shape that works
# (verified on-cluster 2026-08-23): namespace external-secrets, podSelector
# app.kubernetes.io/name=external-secrets, Egress to namespaceSelector workshop.redhat.com/owner=ogsr
# on TCP 8200 — every workshop namespace carries that label, so ONE policy covers all users.
---
# why: tells ESO where this user's vault is and which token to present. kv-v2 at mount `parasol`.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: parasol-bao
  namespace: {{ .Values.user }}-dev
  annotations:
    # Sync-wave "1": applied only after OpenBao (wave "0") reports Ready, and Ready there means
    # SEEDED (see the readiness probe in openbao.yaml). ESO validates a SecretStore by actually
    # talking to the backend, so applying this against a vault that is not yet up would park it in
    # `store validation failed` for a refresh interval on a world that is fine.
    argocd.argoproj.io/sync-wave: "1"
    # external-secrets.io is a THIRD-PARTY operator's API group, not a core one: on a cluster where
    # the ESO operator is still installing (the `secrets` stack and this entry app can land in the
    # same window), Argo's server-side dry run of this object fails with "no matches for kind" and the
    # whole sync fails before the CRD it is waiting for arrives. Skipping the dry run for a missing
    # resource is the supported answer, and tools/lint/crd-unknown-field-guard.py requires it on any
    # kind it holds no CRD schema snapshot for — which is the same class of object, seen from CI.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app: openbao
    workshop.redhat.com/module: platform-guardrails
    workshop.redhat.com/owner: ogsr
spec:
  provider:
    vault:
      # The Service, not the Pod IP — this is a cross-namespace call from the ESO operand namespace.
      server: http://openbao.{{ .Values.user }}-dev.svc:8200
      # kv-v2, and it must be v2: `bao kv put` writes a NEW VERSION rather than replacing the value,
      # and the version counter is what ws verify grades a rotation by (v1 at entry, v2+ after).
      version: v2
      path: parasol
      auth:
        # Resolved in THIS namespace — the reason this is a SecretStore and not a ClusterSecretStore.
        tokenSecretRef:
          name: openbao-token
          key: token
---
# why: materializes Secret claims-creds from parasol/claims-db, and keeps it in step with the vault.
# THIS OBJECT IS THE LESSON: it names a location, never a value. `grep -r POSTGRESQL_PASSWORD
# gitops/entry-states/platform-guardrails` finds this key NAME and nothing else — the password
# reaches the cluster without ever being in Git, which is the claim the module makes and the one an
# attendee can check for themselves in about ten seconds.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claims-creds
  namespace: {{ .Values.user }}-dev
  annotations:
    # Sync-wave "2": after the SecretStore exists, before the workloads (waves 3-4) that mount the
    # Secret it produces. Argo's health check for ExternalSecret reads the Ready condition, so wave 3
    # genuinely waits for SecretSynced rather than for the object merely existing — and if a cluster's
    # Argo lacks that customization, the kubelet's own retry on a missing envFrom Secret converges
    # anyway, a few seconds later.
    argocd.argoproj.io/sync-wave: "2"
    # Same reason as the SecretStore above: a third-party CRD that may not exist yet at first sync.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app: openbao
    workshop.redhat.com/module: platform-guardrails
    workshop.redhat.com/owner: ogsr
spec:
  # 15s: the rotation exercise is "run one command, then watch". A minute of nothing reads as a
  # broken lab and sends the attendee off deleting objects to force a re-sync.
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: parasol-bao
  target:
    name: claims-creds
    # Owner (the default, written out because it is load-bearing here): ESO owns the Secret, so
    # deleting this ExternalSecret takes claims-creds with it — which is what makes `ws reset`'s
    # Argo prune leave nothing behind, and what makes exercise "delete it and watch it come back"
    # honest.
    creationPolicy: Owner
  data:
    # POSTGRESQL_PASSWORD, and that exact name, because BOTH claims-db (to initialize the database)
    # and parasol-claims (to connect to it) consume this Secret with `envFrom` and the postgresql
    # image reads that variable. One key, one owner, one rotation point.
    - secretKey: POSTGRESQL_PASSWORD
      remoteRef:
        key: claims-db
        property: password
