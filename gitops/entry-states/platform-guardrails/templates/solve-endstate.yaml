{{- if .Values.solve }}
# END state for instructor demos / `ws solve platform-guardrails`. THE END STATE OF THIS MODULE IS NOT AN
# OBJECT — it is a second version in OpenBao's kv-v2 store, written by the seed script in
# openbao.yaml's `solve` branch, and the re-synced Secret that follows from it. That is deliberate:
# the attendee's rotation produces no new Kubernetes object either, so an end state made of objects
# would grade something the lab never creates.
#
# So this file renders exactly one thing: a marker recording that `ws solve` — rather than a human
# doing the lab — is what rotated the credential. tools/verify/platform-guardrails.sh asserts it ONLY under
# --solve (SOLVE_MODE), never in a plain `ws verify`: an attendee who rotated by hand has a fully
# correct end state and no marker, and a ❌ over correct work destroys trust in every other ✅.
---
# why: tells an instructor (and `ws verify --solve`) that the rotation in this namespace came from
# `ws solve`, and what to expect when they go looking for it in the vault.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ws-solve-platform-guardrails
  namespace: {{ .Values.user }}-dev
  labels:
    workshop.redhat.com/module: platform-guardrails
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
data:
  module: platform-guardrails
  solvedFor: {{ .Values.user | quote }}
  # Named, not hidden: a demo that says "watch the Secret follow the vault" should be able to show
  # both sides. `oc exec deploy/openbao -- bao kv get -mount=parasol claims-db` prints version 2.
  note: "ws solve rotated parasol/claims-db to kv version 2; Secret claims-creds carries the rotated value and both workloads were brought up on it"
{{- end }}
