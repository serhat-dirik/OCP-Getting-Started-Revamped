# Proves the entry-state engine ran for this user+module; ws verify checks it, and ws reset
# preserves exactly this one marker while purging everything else out of the namespace.
# platform-guardrails' whole world is one namespace, so there is one marker.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ws-entry-platform-guardrails
  namespace: {{ .Values.user }}-dev
  labels:
    workshop.redhat.com/module: platform-guardrails
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
data:
  module: platform-guardrails
  materializedFor: {{ .Values.user | quote }}
  role: dev
  # Says what the attendee will find, and — more usefully — what they will NOT: no manifest in this
  # namespace carries the database password, and OpenBao has been written exactly once, so the
  # rotation exercise still has a version to add.
  note: "claims app + PostgreSQL run here on a password ESO pulled from OpenBao (Secret claims-creds); parasol/claims-db is at kv version 1 — you rotate it"
