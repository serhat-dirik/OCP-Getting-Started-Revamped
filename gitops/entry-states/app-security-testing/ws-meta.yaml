# Namespaces this module needs to EXIST before its entry state can materialize. Consumed by
# `ws prep` -> the per-user namespace Application, so a namespace is created on demand rather
# than all 13 existing up front. NOT the same list as purgeNamespaces below: that answers
# "what do I empty on reset", and at least one module (multi-tenancy-workload-security) needs a
# namespace it deliberately must NOT purge, because a cohabitant module's work lives there.
namespaces:
  - "cicd"

# ws reset purges user-created leftovers from these namespaces before re-materializing.
# app-security-testing lives ENTIRELY in {user}-cicd: the parasol-claims-devsecops capstone Pipeline, an ephemeral
# claims-db, the copied sonar-auth + rox-api-token Secrets, and (in the lab) the PipelineRuns +
# deployed parasol-claims + its Route. `oc delete all,pvc` + the engine's pipelinerun cleanup clear it
# back to the entry state (the platform-owned quota/limitrange/rbac and the pipeline SA are untouched).
purgeNamespaces:
  - "${USER}-cicd"
# app-security-testing shares {user}-cicd with pipelines-fundamentals and trusted-supply-chain (all three materialize a parasol-claims pipeline + claims-db
# there), so the three are MUTUAL conflicts (ADR-0001 amendment 4: same-namespace modules must declare
# each other, both directions). Starting/preparing app-security-testing evicts pipelines-fundamentals/trusted-supply-chain's entry app + purges {user}-cicd,
# and vice versa. the {user}-dev modules and jobs-batch-kueue ({user}-batch) are disjoint → they coexist with app-security-testing.
conflictsWith:
  - pipelines-fundamentals
  - trusted-supply-chain
# The solve hook BLOCKS while the 12-stage capstone runs on clean main (SAST + SCA + unit-test +
# build + image scan/report + sign + deployment-check + deploy + DAST + perf — measured 1414s and
# 1419s green end-to-end on cluster-m24jn 2026-08-13, ~24 min; a cold cluster is longer, and the
# same pipeline is 821s once the {user}-cicd CPU default is raised — see values.yaml), so ws
# start/solve wait windows must outlive it. Count and enumeration re-derived
# from pipelines/pipeline/parasol-claims-devsecops.yaml on 2026-08-12 — it said 11 and omitted
# perf-k6, which is how it drifted: the perf gate was added after this line was written and nothing
# here pointed at the pipeline as the source. Re-derive rather than trust this line:
#   python3 -c "import yaml;print(len(yaml.safe_load(open('pipelines/pipeline/parasol-claims-devsecops.yaml'))['spec']['tasks']))"
#
# THE OUTERMOST OF FOUR NESTED CLOCKS, and the only one of them that is NOT derived — this file is
# read by `ws`, not rendered by Helm, so it cannot compute itself. The other three live in
# values.yaml's "ONE CLOCK" block, which is the authority; read it before touching this number.
# The ordering that must hold, innermost first:
#   PipelineRun spec.timeouts.pipeline   2100  (values.yaml solvePipelineTimeoutSeconds)
#   solve hook poll budget               2280  (+ solveHookGraceSeconds)
#   solve Job activeDeadlineSeconds      2340  (+ 60)
#   waitSeconds (this line)              2400
# Lowering this below the Job's activeDeadlineSeconds re-creates the inversion fixed on 2026-08-13,
# where the PipelineRun declared no timeout at all and could run an hour while the hook gave up at
# 1700s — and where this line and activeDeadlineSeconds were BOTH 1800, so ws stopped waiting at
# the same instant the hook was killed. Engine default is 300s; the solve Job's own
# activeDeadlineSeconds is the hard stop under this one.
waitSeconds: 2400

# Representative attendee muscle app-security-testing leans on, beyond the generic cockpit/identity battery.
# Same shape as pipelines-fundamentals (both are tkn-driven -cicd modules, and module independence means
# each declares its own): (1) proves tkn is on the interactive PATH, the devsecops Pipeline materialized,
# and the attendee may read it — one command, three facts; (2) every gate exercise re-runs the pipeline,
# which needs the create verb on PipelineRuns in the attendee's own namespace, and describe only proves
# the read half. ${USER} resolves per-run.
# QUOTING: single-quotes only, no double-quotes (meta_list strips them).
smokeCommands:
  - "tkn pipeline describe parasol-claims-devsecops -n ${USER}-cicd"
  - "oc auth can-i create pipelineruns.tekton.dev -n ${USER}-cicd"
