apiVersion: v2
name: app-security-testing-entry
description: "DevSecOps [OCP] — in {user}-cicd: the 12-stage parasol-claims-devsecops capstone Pipeline (SAST SonarQube · SCA Trivy · unit-test · build · image-scan RHACS · image-size report · sign Tekton Chains · config-check roxctl · deploy+Route · DAST ZAP · perf k6), an ephemeral claims-db, and per-user copies of the SonarQube CI token (sonar-auth) + RHACS CI token (rox-api-token). Assumes the platform appsec stack (SonarQube), the trust stack (RHACS + Chains), and the parasol-tasks library (incl. the five app-security-testing tasks)."
type: application
# 0.1.12: comment only. The dast-zap stage note now records the SECOND cause of the DAST gate's false
# pass, which only surfaced on a live report-mode run (2026-08-16, user5-cicd): zap-baseline handed
# ZAP `-I` in reporting mode, suppressing the WARN exit code its own reporting branch tested for, so
# the branch was dead and the gate published dast-passed=true on an app serving none of the five
# security headers. Fixed in workshop-config 0.3.10 by deleting the flag. The note carries the rule
# rather than just the incident — report mode may change what a gate DOES, never what it MEASURES —
# because this Pipeline is where the next gate gets added. No rendered field's value changes, but the
# Pipeline's comments are in the render on a chart Argo caches, so the bump is load-bearing.
# 0.1.11: comment + metadata only — no rendered Kubernetes object changes value. The dast-zap stage's
# ⚠️ note said report mode was "only half-honest" at the DAST and perf gates because zap-baseline and
# k6-load-test overwrote their own result with `true`; workshop-config 0.3.9 fixed both Tasks, so the
# note now records what they used to do and why it mattered, and the header states plainly that ALL
# SIX gate results stay truthful on a report run. Also three counts that were simply wrong: this
# chart's description said 11-stage (the Pipeline has 12 numbered stages) and "four app-security-
# testing tasks" (there are five: sonar-scan, trivy-scan, roxctl-deployment-check, zap-baseline,
# k6-load-test), and fork-and-seed.yaml said FOUR flaws in its header and "4" in its closing echo
# while publishing five (SAST, SCA, image, config, DAST) — values.yaml carried the same wrong number.
# Rendering change on a chart Argo caches (the Pipeline's comments and the seed Job's echo are in the
# render), so the bump is load-bearing even though no field's value moves.
# 0.1.10: the capstone Pipeline gains ONE param, `enforce-gates` (default "true"), fanned out to all
# six security gates. At the default the rendered run is unchanged — the two stages that previously
# hardcoded "true" (dast-zap's FAIL_ON_WARN, perf-k6's FAIL_ON_THRESHOLD) now read the param, which
# defaults to that same "true", and the four others gain a mapping they did not have. At "false" the
# run is a REPORTING pass: every stage executes, every scanner runs, every finding is readable, and
# no gate blocks — which is what a "tour the whole chain in one run" beat needs.
# The polarity is positive on purpose: Tekton cannot negate a param value, and four of the six gates
# already spell their switch true-means-enforce, so a `report-only` param would need an inversion
# inside Tasks this file does not own. Every mapping is therefore a plain pass-through.
# Report mode is NOT "nothing can stop the run": unit-test, build-image and sign-check have no
# toggle and still fail the run. None of them is seeded to fail, so a report run reaches stage 12.
# (0.1.10 shipped with a known half-truth: zap-baseline and k6-load-test overwrote their own result
# with `true` on the reporting branch, so `dast-passed`/`perf-passed` could not be trusted on a report
# run. Fixed in workshop-config 0.3.9; see 0.1.11 above. All six results are truthful now.)
# Rendering change on a chart Argo caches, so the bump is load-bearing.
# (0.1.9 shipped with no note here; this entry does not describe it.)
# 0.1.8: the solve hook's TIMEOUT INVERSION is fixed. The solve PipelineRun declared no
# spec.timeouts.pipeline at all, so it silently took Tekton's built-in 1h default while the hook
# waiting for it polled for 1700s (`seq 1 170` × `sleep 10`) under an activeDeadlineSeconds of 1800
# — the hook was guaranteed to die first on a slow run and leave an orphaned PipelineRun behind a
# failed Argo sync. Now values.yaml carries ONE authoritative number
# (solvePipelineTimeoutSeconds) that the PipelineRun's own cap uses, and the Job's
# activeDeadlineSeconds and the poll budget are DERIVED from it rather than retyped; the hook also
# re-asserts the ordering at run time against the object it created, so a hand-edited ConfigMap
# cannot re-open the gap. Rendering change on every synced world, so the bump is load-bearing.
# The Pipeline itself is unchanged in 0.1.8 — two speed leads were tried on cluster-m24jn on
# 2026-08-13 and BOTH measured out at nothing, and the Pipeline's own comments now carry the
# numbers so they are not tried a third time. See pipelines/pipeline/parasol-claims-devsecops.yaml:
# an intra-run Maven repository (admissible: one claim, two subPaths) moved unit-test 491s → 497s,
# and parallelising sca-trivy with unit-test would cost the lab's red-gate ladder more than it
# saves. What this capstone is actually bound by is the {user}-cicd LimitRange default.cpu of 500m.
# 0.1.7: the maven-cache PVC, its binder Job, and BOTH of the capstone Pipeline's maven-cache
# mappings (sast-sonar, unit-test) are REMOVED — see gitops/entry-states/pipelines-fundamentals/Chart.yaml
# 0.1.5 and the header note in pipelines/pipeline/parasol-claims-build.yaml. The 0.1.4 claim below
# ("turning a capability into an actual saving") was never measured; when it was, the saving was
# 1.2% and the binding made every run of this capstone fail validation before its first gate.
# Deletes resources from every synced world, so the bump is load-bearing.
# 0.1.4: the capstone Pipeline maps maven-cache into the sast-sonar task, turning workshop-config
# 0.3.3's sonar-scan cache workspace from a capability into an actual saving — until now sonar-scan
# ran unbound and printed its own "no cache bound" hint while the capstone paid a full dependency
# download every run. sast-sonar runs FIRST (runAfter fetch-source), before unit-test, so the
# binding also warms the repository maven-jdk21 reads later: even a cold first run now pays the
# download once instead of twice. Rendering change, so the bump is load-bearing against Argo's
# manifest cache. Safe because the library Task already declares the workspace (workshop-config
# 0.3.3, verified live in ogsr-parasol-tasks) — mapping a workspace a Task does not declare fails
# the run outright rather than degrading to uncached.
# 0.1.3: the per-user maven-cache PVC + the capstone Pipeline's optional maven-cache workspace + the
# solve run's binding to it. Rendering change, so the bump is load-bearing against Argo's cache.
version: 0.1.12
