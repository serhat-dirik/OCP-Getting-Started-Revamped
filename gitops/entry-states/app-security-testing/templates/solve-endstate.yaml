{{- if .Values.solve }}
# END state for instructor demos (`ws solve app-security-testing`): run the DevSecOps capstone on the CLEAN main branch
# so EVERY gate passes (SAST/SCA/image-scan/sign/config-check/DAST) and the scanned+signed image is
# deployed with its edge Route — the module's green outcome really exists. The PostSync hook Job
# launches the PipelineRun and WAITS for it: "demo-ready" must not print while the pipeline still has
# minutes to go (the pipelines-fundamentals/trusted-supply-chain lesson — a blocking hook keeps the Argo sync OPERATION Running, which ws's
# wait gates on, sized by ws-meta waitSeconds). backoffLimit 0: a retry would launch a SECOND run.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-security-testing-solve-run-{{ .Values.user }}
  namespace: {{ .Values.user }}-cicd
  labels:
    workshop.redhat.com/module: app-security-testing
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
data:
  pipelinerun.yaml: |
    apiVersion: tekton.dev/v1
    kind: PipelineRun
    metadata:
      generateName: solve-devsecops-
      labels:
        app.kubernetes.io/part-of: parasol-claims
        workshop.redhat.com/module: app-security-testing
    spec:
      pipelineRef:
        name: parasol-claims-devsecops
      params:
        # The CLEAN branch — every gate passes, image deployed + Route created (the fixed end state).
        - name: git-revision
          value: main
        # Per-user Sonar project key: Community Build has no branch analysis, so N users sharing one
        # project would overwrite each other's results. Each solve writes its own project.
        - name: sonar-project-key
          value: parasol-claims-{{ .Values.user }}
      taskRunTemplate:
        serviceAccountName: pipeline
      # THE AUTHORITATIVE CLOCK for this end-state (values.yaml solvePipelineTimeoutSeconds). Nothing
      # declared one before, so this run inherited Tekton's built-in 1h default and could outlive the
      # hook below by half an hour. Everything that waits on this run derives from THIS number.
      timeouts:
        pipeline: {{ .Values.solvePipelineTimeoutSeconds }}s
      workspaces:
        - name: shared-workspace
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
        - name: zap-work
          emptyDir: {}
        - name: k6-work
          emptyDir: {}
        # EXACTLY ONE of these three is a PVC (shared-workspace); zap-work and k6-work are emptyDir
        # and the Affinity Assistant does not count them. A fourth binding a persistent Maven cache
        # by claimName was here 2026-08-07 → 2026-08-08 and made every solve fail validation. See
        # the header note in pipelines/pipeline/parasol-claims-build.yaml.
      # No per-task taskRunSpecs: the {user}-cicd namespace default is sized 2Gi for these Maven-heavy
      # steps (gitops/workshop-config/templates/per-user-limits.yaml). The identical block was dropped
      # from pipelines/pipelinerun/parasol-claims-devsecops-run.yaml in b39c31a when that default rose
      # to 2Gi — the stale cap under-provisioned the build (SEV3-J). Size the namespace, not the run.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: app-security-testing-solve-{{ .Values.user }}
  namespace: {{ .Values.user }}-cicd
  labels:
    workshop.redhat.com/module: app-security-testing
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
  annotations:
    # PostSync: run after the pipeline + the copied tokens + claims-db have synced, so the run finds them.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  # DERIVED, never retyped: the PipelineRun's own timeout + the hook's poll grace + 60s, so this
  # Job outlives its own poll loop, which outlives the run it is polling. See values.yaml's
  # "ONE CLOCK" block for the full ordering and why it is derived rather than written out.
  activeDeadlineSeconds: {{ add .Values.solvePipelineTimeoutSeconds .Values.solveHookGraceSeconds 60 }}
  template:
    metadata:
      labels:
        app: app-security-testing-solve-{{ .Values.user }}
    spec:
      # The operator-provisioned pipeline SA (edit) can create PipelineRuns in its own namespace.
      serviceAccountName: pipeline
      restartPolicy: Never
      volumes:
        - name: solve
          configMap:
            name: app-security-testing-solve-run-{{ .Values.user }}
      containers:
        - name: solve
          # Digest-pinned; el8 `ose-cli:latest` was frozen on v4.15.0 with unapplied Critical errata.
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22@sha256:f8bbc73242af3eae3f8361a9611b29384d3577dba4d5e5b62f4beb2750862c19
          # THIS BLOCK EXISTS TO STOP ws solve DEADLOCKING AGAINST ITSELF. Measured 2026-08-14: with
          # no resources declared, this container inherited the namespace default (1500m as of
          # 13ed4ef) and held it for the WHOLE poll — while waiting for a PipelineRun whose
          # sast-sonar needs 4500m (three steps x 1500m). Against claims-db 1500m +
          # parasol-claims 1500m + the affinity assistant 50m, the run it was waiting for could
          # never be admitted:
          #     exceeded quota: workshop-quota, requested: limits.cpu=4500m,
          #     used: limits.cpu=4550m, limited: limits.cpu=8
          # and because the failure is an admission refusal rather than an error, the hook simply
          # polled until activeDeadlineSeconds — `ws solve` failing after ~39 MINUTES with nothing
          # obviously wrong. It only bites when the namespace ALREADY has the app deployed, which is
          # why a clean entry state (7550m of 8000m, 5.6% headroom) never showed it at build time.
          #
          # A poller needs almost no CPU, so capping it here returns 1400m to the quota and the
          # contended case fits with room. Memory stays at 512Mi because ose-cli OOMs at 256Mi
          # (recorded in the session card) — this is a CPU fix, not a memory one.
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 100m
              memory: 512Mi
          volumeMounts:
            - name: solve
              mountPath: /solve
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              # POLL_BUDGET is DERIVED from the PipelineRun's own timeout (values.yaml
              # solvePipelineTimeoutSeconds + solveHookGraceSeconds) and never typed independently —
              # see the "ONE CLOCK" block there. POLL_STEP is the sleep, so the loop count follows
              # from the budget instead of being a third number that can drift out of step with it.
              POLL_STEP=10
              POLL_BUDGET={{ add .Values.solvePipelineTimeoutSeconds .Values.solveHookGraceSeconds }}
              echo "▶ launching the DevSecOps capstone on main (solve end-state)…"
              PR="$(oc create -o name -f /solve/pipelinerun.yaml)"

              # STRUCTURAL ASSERT, at run time, against the object actually created — not against
              # what this template believes it rendered. If the PipelineRun's hard stop is ever
              # allowed to reach or exceed this hook's poll budget, the hook is guaranteed to die
              # first and orphan a still-running PipelineRun behind a failed Argo sync. That is the
              # exact defect this block exists to make impossible, so it fails LOUDLY and cleans up
              # rather than waiting ~28 minutes to fail confusingly.
              PIPELINE_TIMEOUT="$(oc get "$PR" -o jsonpath='{.spec.timeouts.pipeline}' 2>/dev/null || true)"
              case "${PIPELINE_TIMEOUT}" in
                *[0-9]s)
                  PIPELINE_TIMEOUT_S="${PIPELINE_TIMEOUT%s}" ;;
                *)
                  echo "  ❌ the PipelineRun declares no seconds-valued spec.timeouts.pipeline (got: '${PIPELINE_TIMEOUT:-<none>}')."
                  echo "     Without it the run inherits Tekton's 1h default and outlives this hook."
                  oc delete "$PR" --ignore-not-found >/dev/null 2>&1 || true
                  exit 1 ;;
              esac
              if [ "${POLL_BUDGET}" -le "${PIPELINE_TIMEOUT_S}" ]; then
                echo "  ❌ budget inversion: this hook waits ${POLL_BUDGET}s but the PipelineRun may run ${PIPELINE_TIMEOUT_S}s."
                echo "     Fix values.yaml (solvePipelineTimeoutSeconds / solveHookGraceSeconds), not this script."
                oc delete "$PR" --ignore-not-found >/dev/null 2>&1 || true
                exit 1
              fi

              echo "  ✓ started ${PR#*/} — waiting up to ${POLL_BUDGET}s for a run capped at ${PIPELINE_TIMEOUT_S}s"
              echo "    (SAST + SCA + unit-test + build + scans + sign + deploy + DAST + perf ≈ 24 min)…"
              for i in $(seq 1 $((POLL_BUDGET / POLL_STEP))); do
                s="$(oc get "$PR" -o jsonpath='{.status.conditions[?(@.type=="Succeeded")].status}' 2>/dev/null || true)"
                case "$s" in
                  True)
                    echo "  ✓ pipeline Succeeded — parasol-claims scanned clean, signed, deployed with its Route"
                    exit 0;;
                  False)
                    echo "  ❌ pipeline FAILED — inspect: tkn pipelinerun logs ${PR##*/}"
                    exit 1;;
                esac
                sleep "${POLL_STEP}"
              done
              # Unreachable on a healthy cluster: the run's own ${PIPELINE_TIMEOUT_S}s cap fires
              # first and flips the condition to False, which the loop above reports.
              echo "  ❌ pipeline still not finished after ${POLL_BUDGET}s — inspect: oc get ${PR}"
              exit 1
{{- end }}
