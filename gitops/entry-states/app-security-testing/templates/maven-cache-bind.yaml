# Binds the maven-cache PVC during the entry-state sync, by being the thing that mounts it.
#
# WHY THIS EXISTS — the same P1 wedge measured in pipelines-fundamentals on cluster-65prs
# 2026-08-07, present here in identical shape and found by reading rather than by a second outage.
# maven-cache.yaml declares no storageClassName (portfolio rule: auto-detect), so the claim takes
# the cluster default. On this cluster — and on most, since it is the OpenShift Data Foundation
# default and the same is true of gp3-csi on AWS — that class is `volumeBindingMode:
# WaitForFirstConsumer`. NOTHING in the entry state mounted the claim: only solve-endstate.yaml
# does, and that renders only under `solve: true`. So the PVC sat:
#
#     Pending   waiting for first consumer to be created before binding
#
# which is the CORRECT behaviour for WFC and looks like a defect in nothing. But Argo grades a
# Pending PVC `Progressing`, the claim carried no sync-wave (so wave 0), and the Gitea fork Job is
# a Sync hook at wave 1 — so wave 1 never ran. Measured 16 minutes into a sync:
#
#     op=Running  msg=waiting for healthy state of /PersistentVolumeClaim/maven-cache
#
# with the fork Job simply absent while its siblings for other users existed. In THIS module the
# same three facts hold: the claim has no storageClassName and no sync-wave (so wave 0), the only
# thing mounting it is solve-endstate.yaml (which renders only under `solve: true`), and
# fork-and-seed.yaml is a Sync hook at wave 1. Consequences, in order of severity: the attendee's fork 404s, so exercises 3 and 4 — the
# break-fix device and the supply-chain beats — cannot be performed at all;
# `ws start` burns its full 1800s and ends "entry state not ready"; and the verify script's
# missing-fork hint says "re-run ws start", which is the wedged command.
#
# WHY A BINDER JOB RATHER THAN THE OBVIOUS ALTERNATIVES.
#   - Pinning storageClassName to an Immediate class would hard-code one cluster's storage into a
#     portfolio that is meant to auto-detect, and would break on any cluster lacking that class.
#   - Moving the PVC to a wave AFTER the fork hook fixes the fork but not `ws start`: the claim is
#     still Pending at the end, the app is still Progressing, and the wait still times out.
#   - Mounting it from a real workload would mean inventing a workload the module does not want.
# A one-shot Job is the smallest thing that is a genuine first consumer. It is also what
# storage-stateful already does implicitly by shipping its PVC and the Deployment that mounts it
# together — this is that pattern, made explicit for a claim whose real consumer is a PipelineRun
# that does not exist yet.
#
# IT EARNS ITS KEEP TWICE. Binding at prep time means a broken or absent default StorageClass
# surfaces during `ws start`, where an operator is watching and the message says so — not twenty
# minutes into an attendee's first pipeline run, where it reads as "the build is slow".
#
# It leaves the cache EMPTY. Creating the repository directory is all it does; the first real run
# still pays a cold download, which is what the entry state's contract promises.
apiVersion: batch/v1
kind: Job
metadata:
  name: maven-cache-bind-{{ .Values.user }}
  namespace: {{ .Values.user }}-cicd
  labels:
    app: maven-cache
    workshop.redhat.com/module: app-security-testing
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
  annotations:
    # Wave 0, same as the claim it binds — so both are healthy before the wave-1 fork hook runs.
    argocd.argoproj.io/sync-wave: "0"
spec:
  # One attempt is not enough: on a cluster whose CSI is briefly unavailable the first pod can fail
  # to attach, and a permanently-failed binder would re-create the exact wedge this file removes.
  backoffLimit: 4
  # Keep the object briefly after success so `ws start` and an operator can see it Completed, then
  # let it clear itself rather than accumulating one per reset.
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: maven-cache
        workshop.redhat.com/owner: ogsr
    spec:
      restartPolicy: Never
      containers:
        - name: bind
          # ubi9-minimal, not ose-cli: this touches a directory and talks to no API server, so it
          # needs no oc and no ServiceAccount beyond default. ose-cli also needs >=512Mi or it OOMs,
          # which would be 512Mi of an attendee's quota for a mkdir.
          image: registry.access.redhat.com/ubi9-minimal:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /cache/repository
              echo "maven-cache bound and writable: $(df -h /cache | tail -1)"
          volumeMounts:
            - name: maven-cache
              mountPath: /cache
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: maven-cache
          persistentVolumeClaim:
            claimName: maven-cache
