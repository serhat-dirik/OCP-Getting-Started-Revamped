{{- if .Values.solve }}
# END state for `ws solve health-resources-autoscaling`: the HPA exercise 4 creates. The probes,
# requests/limits and the 2-replica floor come from parasol-claims.yaml's solve branch.
---
# why: scale parasol-claims on CPU under load (autoscaling/v2, Utilization = actual / the 200m request),
# the object `oc autoscale deploy/parasol-claims --cpu=60% --min=2 --max=4` creates. Max 4 fits the
# {user}-dev quota (4 x 200m requests, 4 x 500m limits). The lab may scale past the floor — verify
# checks are >=, never ==.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: parasol-claims
  namespace: {{ .Values.user }}-dev
  labels:
    app: parasol-claims
    {{- include "hra.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: parasol-claims
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
{{- end }}
