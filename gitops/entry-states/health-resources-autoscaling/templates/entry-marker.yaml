# Proves the entry-state engine ran for this user+module; ws verify + ws prep check it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ws-entry-health-resources-autoscaling
  namespace: {{ .Values.user }}-dev
  labels:
    {{- include "hra.labels" . | nindent 4 }}
    workshop.redhat.com/user: {{ .Values.user | quote }}
data:
  module: health-resources-autoscaling
  materializedFor: {{ .Values.user | quote }}
  # The claims app ships WITHOUT probes, explicit resources or an HPA on purpose — adding them is the lab.
  note: "claims app + PostgreSQL + load generator run here; no probes, no requests/limits, no HPA yet"
