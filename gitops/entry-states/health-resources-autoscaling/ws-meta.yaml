# Namespaces this module needs to EXIST before its entry state can materialize. Consumed by
# `ws prep` -> the per-user namespace Application, so a namespace is created on demand rather
# than all 13 existing up front. NOT the same list as purgeNamespaces below: that answers
# "what do I empty on reset".
namespaces:
  - "dev"

# ws reset purges user-created leftovers from these namespaces before re-materializing.
# The whole module lives in {user}-dev: the claims app + DB + load generator from the chart, and the
# probes, resources, HPA and claims-burst pod the lab adds. `oc delete all` covers the HPA and the
# burst pod; the chart re-renders parasol-claims without probes or resources.
purgeNamespaces:
  - "${USER}-dev"
# Same claims stack in {user}-dev as every module below — coexisting entry apps deadlock on
# SharedResourceWarning (G3-config-multienv), so same-namespace modules are MUTUAL conflicts
# (2026-07-10 policy). The list is config-multienv's, plus config-multienv itself; integration adds
# this slug to each listed module's own conflictsWith.
conflictsWith:
  - platform-orientation
  - build-deliver
  - devspaces-inner-loop
  - config-multienv
  - storage-stateful
  - gitops-fundamentals
  - gitops-at-scale
  - developer-hub-golden-paths
  - observability-health-scale
  - application-logging
  - securing-apps-keycloak
  - multi-tenancy-workload-security
  - networking-dev-devops
  - deployment-targets-scheduling
  - registry-images-catalog-governance
  - platform-guardrails
  - serverless-zero-to-hero
  - eventing-deep-dive
  - packaging-distributing

# Representative attendee muscle this module leans on, beyond the generic cockpit/identity battery.
# (1) claims-load is what keeps the app's CPU off zero and its readiness endpoint exercised; without it
# the autoscaling exercise has no baseline. (2) Exercise 4 has the attendee CREATE an HPA — a namespaced
# verb check, so no cluster-scope can-i trap. ${USER} resolves per-run.
# QUOTING: single-quotes only, no double-quotes (meta_list strips them).
smokeCommands:
  - "oc get deploy claims-load -n ${USER}-dev -o name"
  - "oc auth can-i create horizontalpodautoscalers -n ${USER}-dev"
