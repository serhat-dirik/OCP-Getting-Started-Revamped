# Namespaces this module needs to EXIST before its entry state can materialize. Consumed by
# `ws prep` -> the per-user namespace Application, so a namespace is created on demand rather
# than all 13 existing up front. NOT the same list as purgeNamespaces below: that answers
# "what do I empty on reset", and at least one module (multi-tenancy-workload-security) needs a
# namespace it deliberately must NOT purge, because a cohabitant module's work lives there.
namespaces:
  - "dev"

# ws reset purges user-created leftovers (workloads/services/routes/pvcs) from these
# namespaces before re-materializing — platform-orientation's entry state is "an EMPTY dev namespace".
purgeNamespaces:
  - "${USER}-dev"
# Same-namespace modules are CONFLICTS by policy (2026-07-10): purge-based prep/reset wipes
# namespace cohabitants, and with selfHeal off their apps go silently stale (proven live —
# an platform-orientation app reported Synced/Healthy while its workload was gone after an storage-stateful prep).
# build-deliver-storage-stateful all materialize into {user}-dev alongside platform-orientation's parasol-web. Only cross-namespace
# modules (jobs-batch-kueue in {user}-batch) truly coexist. ws prep/start/solve evicts these.
conflictsWith:
  - build-deliver
  - devspaces-inner-loop
  - config-multienv
  - storage-stateful
  - gitops-fundamentals
  - gitops-at-scale
  - developer-hub-golden-paths
  - observability-health-scale
  - application-logging
  - securing-apps-keycloak
  - multi-tenancy-workload-security
  - networking-dev-devops
  - deployment-targets-scheduling
  - registry-images-catalog-governance
  - serverless-zero-to-hero
  - eventing-deep-dive
  - ai-assisted-development
  - packaging-distributing

# Representative attendee muscle platform-orientation leans on, beyond the generic cockpit/identity battery.
# (1) The module's whole arc is "deploy your first app" — `oc new-app` into {user}-dev — so the one thing
# that must be true before exercise 1 is that the attendee is admin on their own namespace. (2) The
# LimitRange is not decoration here: exercise 2 reads the `kubernetes.io/limit-ranger` annotation off the
# pod and teaches injected defaults from it, so a namespace without workshop-limits silently turns that
# beat into an empty output. Both are attendee-scoped reads (verified as user1 + workshop-attendees,
# 2026-08-05). ${USER} resolves per-run. QUOTING: single-quotes only, no double-quotes (meta_list strips them).
smokeCommands:
  - "oc auth can-i create deployment -n ${USER}-dev"
  - "oc get limitrange workshop-limits -n ${USER}-dev -o name"
