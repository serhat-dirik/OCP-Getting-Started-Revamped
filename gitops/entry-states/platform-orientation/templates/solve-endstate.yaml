{{- if .Values.solve }}
# END state for instructor demos (`ws solve platform-orientation`): the lab completed — parasol-web at 3 replicas
# behind a Route, exactly what an attendee finishes with.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parasol-web
  namespace: {{ .Values.user }}-dev
  labels:
    app: parasol-web
    workshop.redhat.com/module: platform-orientation
    workshop.redhat.com/owner: ogsr
spec:
  replicas: 3
  selector:
    matchLabels:
      deployment: parasol-web
  template:
    metadata:
      labels:
        deployment: parasol-web
        app: parasol-web
    spec:
      containers:
        - name: parasol-web
          image: image-registry.openshift-image-registry.svc:5000/ogsr-parasol-images/parasol-web:1.0
          # Mutable workshop tag - rebuilt in place, so a node-cached IfNotPresent layer served the OLD image (measured 2026-07-29).
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /q/health/ready, port: 8080}
          livenessProbe:
            httpGet: {path: /q/health/live, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: parasol-web
  namespace: {{ .Values.user }}-dev
  labels:
    app: parasol-web
    workshop.redhat.com/module: platform-orientation
    workshop.redhat.com/owner: ogsr
spec:
  selector:
    deployment: parasol-web
  ports:
    - name: 8080-tcp
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: parasol-web
  namespace: {{ .Values.user }}-dev
  labels:
    app: parasol-web
    workshop.redhat.com/module: platform-orientation
    workshop.redhat.com/owner: ogsr
spec:
  to:
    kind: Service
    name: parasol-web
  port:
    targetPort: 8080-tcp
  tls:
    # Browser-facing Route: MUST be edge-terminated. A plain HTTP Route answers 200 on http:// and
    # 503 on https:// — and the console renders route links as https, while browsers upgrade via
    # HSTS, so an attendee clicking through gets "Application is not available". Measured on this
    # very route 2026-07-26 (http 200 / https 503).
    # insecureEdgeTerminationPolicy: Allow, NOT Redirect — Redirect makes `curl http://...` return
    # an empty 302, which breaks the terminal steps that drive traffic with curl.
    termination: edge
    insecureEdgeTerminationPolicy: Allow
{{- end }}
