apiVersion: v2
name: service-mesh-advanced-gateways-entry
description: "Service Mesh 3 & Advanced Gateways — the multi-service Parasol app (parasol-web -> parasol-claims -> parasol-fraud -> ephemeral claims-db) deployed UN-MESHED in the workshop-owned {user}-mesh namespace on ClusterIP-only Services, a demo-client UDI pod pinned OUT of the mesh (sidecar.istio.io/inject=false) as the in-cluster verification substrate, and a legacy-partner raw-TCP claim-feed backend for the advanced-ingress exercises. The shared OSSM3 control plane (Istio + IstioCNI + Kiali in istio-system) is installed by the platform-portfolio mesh stack, NOT this chart; {user}-mesh is created + istio-discovery-labelled by the workshop layer (per-user-mesh.yaml), NOT this chart (Rule 13). ws solve materializes the END state: the app tier enrolled (per-pod injection), STRICT mTLS PeerAuthentication, a fraud v2 Deployment + DestinationRule subsets, a 90/10 weighted + header-routed VirtualService with timeout/retry/circuit-breaker/outlierDetection, and an AuthorizationPolicy allowing only claims -> fraud."
type: application
# 0.1.1: imagePullPolicy: Always on every workshop-BUILT image in this chart. Their tags
# (1.0/1.1) are MUTABLE and rebuilt in place, so the kubelet's IfNotPresent default kept serving a
# node-cached layer and a rebuilt image never reached a running pod (measured on a live cluster, 2026-07-29:
# the IS tag moved to a new digest, `oc rollout restart` brought the OLD digest back up). Upstream
# images pinned to a digest or an immutable tag are deliberately left on IfNotPresent. MUST bump:
# Argo's manifest cache is keyed on the chart version.
version: 0.1.1
