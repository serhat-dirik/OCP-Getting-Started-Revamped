apiVersion: v2
name: config-multienv-entry
description: "Config, Secrets & Multi-Environment — claims app + PostgreSQL in {user}-dev (wired via env, NO probes/resources yet — the lab adds them), empty {user}-stage/-prod, and a per-user Gitea fork of the claims-config promotion repo"
type: application
# 0.2.0: Replace=true on the parasol-claims Deployment. `ws start` could not re-materialize this
# module's own namespace after its own lab had run — exercise 2 rewrites the chart's inline env
# `value:` entries as `valueFrom:`, a merge patch re-adds both keys, the API rejects the object,
# and the entry Application parked at Failed permanently. See the annotation's comment in
# templates/parasol-claims.yaml for the measured rejection and why SSA does not fix it.
# 0.1.1: imagePullPolicy: Always on every workshop-BUILT image in this chart. Their tags
# (1.0/1.1) are MUTABLE and rebuilt in place, so the kubelet's IfNotPresent default kept serving a
# node-cached layer and a rebuilt image never reached a running pod (measured on a live cluster, 2026-07-29:
# the IS tag moved to a new digest, `oc rollout restart` brought the OLD digest back up). Upstream
# images pinned to a digest or an immutable tag are deliberately left on IfNotPresent. MUST bump:
# Argo's manifest cache is keyed on the chart version.
version: 0.2.1
