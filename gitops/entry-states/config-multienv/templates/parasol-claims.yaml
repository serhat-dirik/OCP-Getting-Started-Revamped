# The claims service deployed the NAIVE way in {user}-dev: it runs and serves, but it is
# deliberately under-configured so the lab can improve it. Specifically it has:
#   * ALL config AND credentials crammed inline as plain env vars — including the database
#     PASSWORD in the Deployment spec, readable by anyone with view on the namespace. The lab
#     externalizes the non-secret keys into a ConfigMap and the credentials into a Secret;
#   * NO health probes — the lab adds liveness/readiness/startup and breaks/fixes readiness;
#   * NO explicit requests/limits — the lab sets them and then busts the namespace quota.
# Inline env vars are used (not an envFrom secretRef) precisely because they are what the lab
# removes with `oc set env KEY-` as it refactors — the deliberate "before" state. The values
# are the throwaway demo credentials (parasol/parasol), the same ones already in the claims-db
# init Secret; nothing here is a real secret.
# Runs the SHARED prebuilt image so config-multienv never depends on any per-user build having happened.
---
# why: the running claims REST API (%prod profile); datasource is env-driven at claims-db.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parasol-claims
  namespace: {{ .Values.user }}-dev
  # Replace=true, and ONLY on this Deployment. Without it, `ws start config-multienv` cannot
  # re-materialize its own namespace once the lab has been performed, and the entry Application
  # parks at Failed PERMANENTLY — a dead end for any attendee who re-runs the module.
  #
  # Measured on cluster 2, 2026-08-01, after performing exercise 2 verbatim:
  #   Deployment.apps "parasol-claims" is invalid: spec.template.spec.containers[0].env[0]
  #   .valueFrom: Invalid value: "": may not be specified when `value` is not empty
  #   (and the same for env[1], env[2], env[3])
  #
  # Why: `containers[].env` is a strategic-merge list keyed on `name`. This chart renders five
  # INLINE `value:` vars — the deliberate "before" the lab teaches. Exercise 2 runs
  # `oc set env deploy/parasol-claims --from=configmap/claims-config`, rewriting those same names
  # as `valueFrom:`. A merge patch then re-adds `value:` onto entries already carrying `valueFrom:`
  # and the API rejects the object. Entry apps carry no `automated` sync block, so it surfaces only
  # at the next explicit `ws start` — and gc_conflicts purges a DIFFERENT module's leftovers, never
  # its own, so re-running never recovers. `ws reset` does, but nothing tells the attendee that.
  #
  # Replace, not merge, because on re-materialize this Deployment's spec SHOULD come from the chart
  # wholesale, discarding whatever the attendee refactored it into. Server-side apply does not fix
  # it: another field manager owns the `valueFrom` entries, so both keys coexist and it is rejected
  # identically.
  #
  # Do NOT "fix" this by rendering valueFrom here instead. Exercise 1 shows the attendee that every
  # setting including the database password is hardcoded inline, and exercise 3 opens on
  # "POSTGRESQL_PASSWORD=parasol is still sitting in plain text". Starting from valueFrom deletes
  # the lesson this module exists to teach.
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  labels:
    app: parasol-claims
    workshop.redhat.com/module: config-multienv
    workshop.redhat.com/owner: ogsr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parasol-claims
  template:
    metadata:
      labels:
        app: parasol-claims
        workshop.redhat.com/module: config-multienv
    spec:
      containers:
        - name: parasol-claims
          # Shared image built once into parasol-images (independent of any per-user build).
          image: image-registry.openshift-image-registry.svc:5000/ogsr-parasol-images/parasol-claims:1.0
          # Mutable workshop tag - rebuilt in place, so a node-cached IfNotPresent layer served the OLD image (measured 2026-07-29).
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
{{- if .Values.solve }}
          # SOLVE (end state): the fully-externalized dev app the lab produces — config from a
          # ConfigMap, creds from a Secret (both rendered by solve-endstate.yaml), all three
          # probes, and explicit requests/limits.
          envFrom:
            - configMapRef:
                name: claims-config
            - secretRef:
                name: claims-creds
          startupProbe:
            httpGet:
              path: /q/health/started
              port: 8080
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
{{- else }}
          env:
            # Everything inline — the deliberate anti-pattern. Non-secret config (host/port/db)
            # AND the credentials (user/password) are hardcoded in the Deployment spec. The lab
            # moves the first group to a ConfigMap and the second to a Secret.
            - name: POSTGRESQL_HOST
              value: claims-db
            - name: POSTGRESQL_PORT
              value: "5432"
            - name: POSTGRESQL_DATABASE
              value: parasol
            - name: POSTGRESQL_USER
              value: parasol
            - name: POSTGRESQL_PASSWORD
              value: parasol
          # NOTE: intentionally no readiness/liveness/startup probes and no resources block.
          # The container inherits the namespace LimitRange defaults (request 100m/256Mi,
          # limit 500m/1Gi) until the lab sets explicit values.
{{- end }}
---
# why: stable in-cluster address for the claims API (port 8080).
apiVersion: v1
kind: Service
metadata:
  name: parasol-claims
  namespace: {{ .Values.user }}-dev
  labels:
    app: parasol-claims
    workshop.redhat.com/module: config-multienv
    workshop.redhat.com/owner: ogsr
spec:
  selector:
    app: parasol-claims
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# why: publishes the claims API at parasol-claims-{user}-dev.{clusterDomain} (host auto-generated).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: parasol-claims
  namespace: {{ .Values.user }}-dev
  labels:
    app: parasol-claims
    workshop.redhat.com/module: config-multienv
    workshop.redhat.com/owner: ogsr
spec:
  to:
    kind: Service
    name: parasol-claims
  port:
    targetPort: http
  tls:
    # Browser-facing Route: MUST be edge-terminated. A plain HTTP Route answers 200 on http:// and
    # 503 on https:// — and the console renders route links as https, while browsers upgrade via
    # HSTS, so an attendee clicking through gets "Application is not available". Measured on this
    # very route 2026-07-26 (http 200 / https 503).
    # insecureEdgeTerminationPolicy: Allow, NOT Redirect — Redirect makes `curl http://...` return
    # an empty 302, which breaks the terminal steps that drive traffic with curl.
    termination: edge
    insecureEdgeTerminationPolicy: Allow
