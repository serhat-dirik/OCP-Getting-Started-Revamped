# Namespaces this module needs to EXIST before its entry state can materialize. Consumed by
# `ws prep` -> the per-user namespace Application, so a namespace is created on demand rather
# than all 13 existing up front. NOT the same list as purgeNamespaces below: that answers
# "what do I empty on reset", and at least one module (multi-tenancy-workload-security) needs a
# namespace it deliberately must NOT purge, because a cohabitant module's work lives there.
namespaces:
  - "dev"
  - "prod"
  - "stage"

# ws reset purges user-created leftovers from these namespaces before re-materializing.
# config-multienv's entry state is a claims app + DB in {user}-dev (composed directly) plus empty
# {user}-stage / {user}-prod. The lab hand-configures dev (ConfigMap, Secret, probes,
# resources, a quota-busting deployment) and PROMOTES the app into stage and prod, so all
# three namespaces accumulate user-created workloads — purge all three back to entry.
# The DBs are ephemeral (emptyDir), so no PVCs survive; `oc delete all,cm,secret` clears the
# ConfigMaps/Secrets the lab creates (the platform-owned quota/limitrange/rbac are untouched).
purgeNamespaces:
  - "${USER}-dev"
  - "${USER}-stage"
  - "${USER}-prod"
# Same claims-stack workloads as build-deliver/devspaces-inner-loop/storage-stateful — coexisting entry apps deadlock (G3-config-multienv);
# ws start/solve evicts these before materializing; platform-orientation is listed too (shares {user}-dev — same-namespace = conflict, 2026-07-10 policy). Only cross-namespace modules (jobs-batch-kueue) truly coexist.
conflictsWith:
  - platform-orientation
  - build-deliver
  - devspaces-inner-loop
  - storage-stateful
  - gitops-fundamentals
  - gitops-at-scale
  - developer-hub-golden-paths
  - observability-health-scale
  - application-logging
  - securing-apps-keycloak
  - multi-tenancy-workload-security
  - networking-dev-devops
  - deployment-targets-scheduling
  - registry-images-catalog-governance
  - serverless-zero-to-hero
  - eventing-deep-dive
  - ai-assisted-development
  - packaging-distributing

# Representative attendee muscle config-multienv leans on, beyond the generic cockpit/identity battery.
# (1) The dev app is the object every exercise mutates (ConfigMap ref, Secret ref, promotion source), so
# its absence makes the module unperformable from the first beat. (2) This is the only module in the dev
# family that spans THREE namespaces, and the promotion story dies quietly if the per-user RBAC landed in
# {user}-dev but not in {user}-prod — a namespaced verb check, so no cluster-scope can-i trap (verified as
# user1 + workshop-attendees, 2026-08-05). ${USER} resolves per-run.
# QUOTING: single-quotes only, no double-quotes (meta_list strips them).
smokeCommands:
  - "oc get deploy parasol-claims -n ${USER}-dev -o name"
  - "oc auth can-i create deployment -n ${USER}-prod"
