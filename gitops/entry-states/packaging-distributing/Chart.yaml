apiVersion: v2
name: packaging-distributing-entry
description: "Packaging & Distributing Your App (Helm/OLM) — the per-user packaging world in the workshop-owned {user}-dev namespace: an entry marker, a Gitea fork {user}/parasol-notifications (the Helm target — polyglot Node/Python, port 8080, GET /health, SITE env, no DB), and a prebuilt parasol-notifications:1.0 istag S2I-built into {user}-dev from the parasol org seed so `helm install` has a pullable image WITHOUT assuming build-deliver built it (compose-don't-chain). The OLM half is a read-only dissection of a LIVE operator (Pipelines) via the workshop-layer platform-observer ClusterRole (extended for CSV/Subscription/InstallPlan/CRD/ClusterCatalog reads) — this chart installs no operator. {user}-dev (quota/limits/RBAC) is workshop-layer (per-user-namespaces.yaml), NOT this chart. ws solve materializes the END state: the notifications app deployed to {user}-dev (the outcome of the helm install/upgrade/rollback lab)."
type: application
# 0.1.1: imagePullPolicy: Always on every workshop-BUILT image in this chart. Their tags
# (1.0/1.1) are MUTABLE and rebuilt in place, so the kubelet's IfNotPresent default kept serving a
# node-cached layer and a rebuilt image never reached a running pod (measured on ksls5, 2026-07-29:
# the IS tag moved to a new digest, `oc rollout restart` brought the OLD digest back up). Upstream
# images pinned to a digest or an immutable tag are deliberately left on IfNotPresent. MUST bump:
# Argo's manifest cache is keyed on the chart version.
# 0.1.2: the BuildConfig now declares the build API's own defaults (runPolicy,
# {successful,failed}BuildsHistoryLimit, postCommit, nodeSelector) and no longer sends `triggers: []`,
# which the API drops on write. Those six fields were the entire desired-vs-live delta, so the app was
# PERMANENTLY OutOfSync with selfHeal off and ws-meta had to declare expectOutOfSync — which disables
# the Synced gate for the whole module and would hide any real future drift behind a green banner. The
# render now round-trips byte-identically (verified live on cluster-65prs 2026-08-05: applied to
# user5-dev and read back, persisted spec == rendered spec), so the waiver is gone and this module has
# a real Synced gate again. MUST bump: Argo's manifest cache is keyed on the chart version.
version: 0.1.2
