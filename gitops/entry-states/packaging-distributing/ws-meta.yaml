# Namespaces this module needs to EXIST before its entry state can materialize. Consumed by
# `ws prep` -> the per-user namespace Application, so a namespace is created on demand rather
# than all 13 existing up front. NOT the same list as purgeNamespaces below: that answers
# "what do I empty on reset", and at least one module (multi-tenancy-workload-security) needs a
# namespace it deliberately must NOT purge, because a cohabitant module's work lives there.
namespaces:
  - "dev"

# ws reset purges user-created leftovers from these namespaces before re-materializing.
# packaging-distributing's in-namespace state lives entirely in {user}-dev: the entry marker, the notifications
# ImageStream/BuildConfig/builds (the prebuilt istag), and — after the lab / at solve — the Helm
# release of parasol-notifications (Deployment/Service/Route + its helm.sh/release.v1 Secret). The
# ws engine's purge runs `oc delete all,pvc --all` here, which removes the ImageStream, BuildConfig,
# Builds AND the Helm-created Deployment/Service/Route (all in the `all` category — verified live
# 2026-07-15); its Secret/ConfigMap sweep then removes the Helm RELEASE secrets (they are not system
# objects), so a reset purges the user's Helm releases + istag exactly as required. The chart then
# re-materializes the seeded fork, a fresh istag, and the marker → a clean entry state.
# NOTE: the {user}-dev NAMESPACE, its quota, LimitRange and RBAC are WORKSHOP-LAYER-owned
# (gitops/workshop-config/templates/per-user-namespaces.yaml); like build-deliver this chart only fills it.
purgeNamespaces:
  - "${USER}-dev"

# Modules whose entry/solve charts materialize into the SAME namespace ({user}-dev). Coexisting Argo
# apps that own workloads in one namespace deadlock (SharedResourceWarning, both OutOfSync — G3-config-multienv),
# so `ws start`/`ws solve` evicts the conflicting module before materializing (gc_conflicts). This is
# the same {user}-dev cohort build-deliver declares (same-namespace = conflict by policy, 2026-07-10); packaging-distributing joins
# it. Cross-namespace modules (jobs-batch-kueue {user}-batch, pipelines-fundamentals {user}-cicd, service-mesh-advanced-gateways {user}-mesh, app-modernization {user}-modernize)
# are NOT conflicts and coexist untouched.
# ⚠ RECIPROCAL EDITS REQUIRED (both directions): each module below must add `packaging-distributing` to ITS conflictsWith
# so that starting IT after packaging-distributing evicts packaging-distributing's world too. Those edits touch files outside this chart
# (and include deployment-targets-scheduling, fenced off this session) — left for PM integration; see the platform report.
conflictsWith:
  - platform-orientation
  - build-deliver
  - devspaces-inner-loop
  - config-multienv
  - storage-stateful
  - gitops-fundamentals
  - gitops-at-scale
  - developer-hub-golden-paths
  - observability-health-scale
  - securing-apps-keycloak
  - multi-tenancy-workload-security
  - networking-dev-devops
  - deployment-targets-scheduling
  - registry-images-catalog-governance
  - serverless-zero-to-hero
  - eventing-deep-dive
  - ai-assisted-development

# The build-runner hook runs an S2I build (pull the nodejs builder + build + push the istag); on a
# cold node that can take a couple of minutes, plus the fork job. Give the sync a generous window so
# `ws start` blocks until the image is genuinely pullable (no sleep-and-hope) rather than timing out.
waitSeconds: 360

# NO expectOutOfSync, DELIBERATELY — and it is not an oversight that it is gone. It was declared here
# on 2026-07-16 because this entry seeds an OpenShift BuildConfig: the build API defaults spec fields
# the chart did not set (runPolicy: Serial, {successful,failed}BuildsHistoryLimit: 5, postCommit: {},
# nodeSelector: null) and silently DROPS the `triggers: []` the chart did set, so the live object could
# never equal the render. Entry apps run selfHeal=false, so the app sat PERMANENTLY OutOfSync while
# every workload was Healthy and the sync op Succeeded; the waiver kept `ws start`/`prep` from looping
# to timeout and exiting non-zero under `set -e` on a materialization that had actually worked.
#
# The CAUSE is gone since chart 0.1.2: templates/notifications-image.yaml omits `triggers` entirely,
# so the rendered BuildConfig round-trips through the API unchanged and there is nothing left to diff.
# Measured on a live cluster 2026-08-05 — (1) the BuildConfig was the ONLY OutOfSync resource in this
# Application (every other resource read Synced, which also proves Argo's own tracking metadata is not
# a diff source here); (2) the rendered manifest was applied to user5-dev for real and read back, and
# the persisted spec was byte-identical to the render, key for key.
#
# CORRECTION at chart 0.1.3 — do NOT use the paragraph above as a reason to declare API defaults.
# The "the build API defaults spec fields the chart did not set ... so the live object could never
# equal the render" half of the 2026-07-16 diagnosis is FALSE: a server-ADDED field cannot produce
# OutOfSync under either diff strategy, and this cluster runs SERVER-SIDE diff (Argo CD v3.4.4, on by
# built-in default — `controller.diff.server.side` is set in none of argocd-cm, argocd-cmd-params-cm
# or the ArgoCD CR, no Application carries a compare-options annotation, and 1606/1606 logged applies
# report serverSideDiff:true), whose SSA dry-run receives the very same defaulting the live object did.
# Proof on this resource kind, a live cluster 2026-08-06: the nine workshop-config BuildConfigs send
# neither postCommit nor nodeSelector, the API stores postCommit:{}/nodeSelector:null/resources:{} on
# all nine, and workshop-config reads Synced with selfHeal=true. So postCommit and nodeSelector were
# removed from the chart; runPolicy and the two BuildsHistoryLimits stay for behavioural reasons that
# have nothing to do with diffing (see the template's header comment). Only `triggers: []` — a field
# the chart SENT and the API DROPPED — was ever a candidate cause, and that attribution predates this
# measurement and was not re-verified here.
#
# Keeping the waiver would have been the expensive option, not the safe one: it sets wait_healthy
# require_sync=false, which disables the Synced gate for this module FOREVER — trading away the sync
# signal of every other resource in the chart so that one BuildConfig could stay quiet. Any real future
# drift here would then materialize behind a green banner. Do not re-add it to silence a diff; measure
# the diff and remove its cause, or accept the red as the signal it is.

# Representative attendee commands packaging-distributing genuinely leans on (the generic battery covers cockpit/identity/
# isolation). ws smoke runs each as {user} in the live cockpit and asserts exit 0. ${USER} resolves
# per-run. (1) the OLM dissection READ works read-only for the attendee via the extended
# platform-observer — fully-qualified to dodge the bare-name Knative Subscription trap; (2) the OCI-
# capable helm client is on PATH in the cockpit (verified live: helm v3.17.1).
smokeCommands:
  - "oc get subscriptions.operators.coreos.com -n openshift-operators openshift-pipelines-operator-rh"
  - "helm version --short"
