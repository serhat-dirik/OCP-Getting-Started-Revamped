apiVersion: v2
name: pipelines-fundamentals-entry
description: "Pipelines Fundamentals & Task Libraries — in {user}-cicd: the parasol-claims build-test-deploy Pipeline (all tasks by cluster resolver into the shared parasol-tasks library), an ephemeral claims-db, a per-user Gitea fork of parasol-claims with .tekton/ seeded, and a PaC Repository. Assumes the workshop-layer parasol-tasks library."
type: application
# 0.1.5: the maven-cache PVC, its binder Job, and the Pipeline's maven-cache workspace are all
# REMOVED. 0.1.2-0.1.4 built a between-run Maven cache that was never run on a cluster; when it was,
# it made every run of this Pipeline fail validation in 27s ("more than one PersistentVolumeClaim is
# bound" — the Affinity Assistant allows one PVC-backed workspace per TaskRun in its default mode),
# and with the cluster mode changed so it COULD run, three measured runs put a warm cache at 1.2% of
# an 11-minute pipeline and a cold one at 19% WORSE than no cache. This bump also DELETES two
# resources from every synced world, so it must reach Argo: bump is load-bearing.
# 0.1.2: the per-user maven-cache PVC + the Pipeline's optional maven-cache workspace + the solve
# run's binding to it. Rendering change, so the bump is load-bearing against Argo's manifest cache.
version: 0.1.5
