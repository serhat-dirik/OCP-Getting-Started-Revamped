# Namespaces this module needs to EXIST before its entry state can materialize. Consumed by
# `ws prep` -> the per-user namespace Application, so a namespace is created on demand rather
# than all 13 existing up front. NOT the same list as purgeNamespaces below: that answers
# "what do I empty on reset", and at least one module (multi-tenancy-workload-security) needs a
# namespace it deliberately must NOT purge, because a cohabitant module's work lives there.
namespaces:
  - "cicd"

# ws reset purges user-created leftovers from these namespaces before re-materializing.
# pipelines-fundamentals's entry state is the build-test-deploy Pipeline + an ephemeral claims-db in {user}-cicd
# (plus the per-user Gitea fork, which the fork job re-creates idempotently and reset does NOT
# purge). The lab runs pipelines that create PipelineRuns, TaskRun pods, per-run PVCs
# (volumeClaimTemplate) and a parasol-claims Deployment — `oc delete all,pvc` clears them back
# to the entry state (the platform-owned quota/limitrange/rbac and the pipeline SA are untouched).
purgeNamespaces:
  - "${USER}-cicd"
# pipelines-fundamentals shares {user}-cicd with trusted-supply-chain (both materialize the parasol-claims pipeline world there), so the
# two are MUTUAL conflicts (ADR-0001 amendment 4: same-namespace modules must declare each other, both
# directions). Starting/preparing pipelines-fundamentals evicts trusted-supply-chain's entry app + purges {user}-cicd, and vice versa.
# the {user}-dev modules and jobs-batch-kueue ({user}-batch) are disjoint namespaces → they still coexist with pipelines-fundamentals.
# app-security-testing (DevSecOps) also materializes a parasol-claims pipeline + claims-db in {user}-cicd → mutual conflict.
conflictsWith:
  - trusted-supply-chain
  - app-security-testing
# The solve hook BLOCKS while the build-test-deploy pipeline runs (~9 min; cold cluster longer),
# so ws start/solve wait windows must outlive it. Engine default is 300s; the solve Job's own
# activeDeadlineSeconds (1200) is the hard stop.
waitSeconds: 1200

# Representative attendee muscle pipelines-fundamentals leans on, beyond the generic cockpit/identity battery.
# (1) `tkn` is THE tool of this module — the lab drives describe/start/logs from the terminal — and this
# one command proves three things at once: tkn is on the interactive PATH, the entry Pipeline actually
# materialized, and the attendee may read it. tkn's presence in the live cockpit is grounded on a real
# attendee-terminal run of this very module (`tkn pipeline describe` / `tkn pipeline start`, smoke notes).
# (2) `tkn pipeline start` needs the create verb on PipelineRuns in the attendee's own -cicd namespace;
# describe only proves the read half. ${USER} resolves per-run.
# QUOTING: single-quotes only, no double-quotes (meta_list strips them).
smokeCommands:
  - "tkn pipeline describe parasol-claims-build-test-deploy -n ${USER}-cicd"
  - "oc auth can-i create pipelineruns.tekton.dev -n ${USER}-cicd"
