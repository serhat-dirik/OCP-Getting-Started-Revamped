# Takes {user}-cicd OUT of the RHTAS policy controller before this module's objects sync.
# trusted-supply-chain labels the namespace policy.rhtas.com/include=true, and `ws` cannot remove the
# label when it evicts that module (purge runs as the attendee). Left on, the webhook rewrites every
# image tag here to tag@digest at admission, so this chart's claims-db (an internal-registry tag)
# reads OutOfSync forever, and Deployments the pipeline creates by tag change shape under it.
# PreSync hooks, all four: the label is gone before any resource syncs, and the SA, Role and
# RoleBinding exist only while the sync runs (HookSucceeded), so nothing here keeps the right to
# relabel the namespace. Same pattern as trusted-supply-chain's admission-label.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ogsr-ns-unlabel
  namespace: {{ .Values.user }}-cicd
  labels:
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
---
# why: get + patch THIS namespace object only (labels), for the hook Job below.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ogsr-ns-unlabel
  namespace: {{ .Values.user }}-cicd
  labels:
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: [{{ printf "%s-cicd" .Values.user | quote }}]
    verbs: ["get", "patch"]
---
# why: binds the Role above to the hook SA for the duration of the sync.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ogsr-ns-unlabel
  namespace: {{ .Values.user }}-cicd
  labels:
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ogsr-ns-unlabel
subjects:
  - kind: ServiceAccount
    name: ogsr-ns-unlabel
    namespace: {{ .Values.user }}-cicd
---
# why: removes the label; idempotent (a missing label is a no-op), re-runs on every ws prep/reset.
apiVersion: batch/v1
kind: Job
metadata:
  name: ogsr-ns-unlabel-{{ .Values.user }}
  namespace: {{ .Values.user }}-cicd
  labels:
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Retries cover the RoleBinding reaching the authorizer cache a moment after it is created.
  backoffLimit: 4
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: ogsr-ns-unlabel-{{ .Values.user }}
    spec:
      serviceAccountName: ogsr-ns-unlabel
      restartPolicy: Never
      containers:
        - name: unlabel
          # Digest-pinned; el8 `ose-cli:latest` was frozen on v4.15.0 with unapplied Critical errata.
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22@sha256:f8bbc73242af3eae3f8361a9611b29384d3577dba4d5e5b62f4beb2750862c19
          env:
            - name: NS
              value: {{ .Values.user }}-cicd
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              oc label namespace "$NS" policy.rhtas.com/include- >/dev/null
              echo "✅ ${NS} is not enrolled in the RHTAS policy controller"
