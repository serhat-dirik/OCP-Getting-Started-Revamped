# Injected by ws start (helm parameters user, clusterDomain, solve); defaults here serve local
# `helm template` dev.
user: user1
clusterDomain: apps.example.com
# ws solve sets true → additionally runs the build-test-deploy PipelineRun to completion (a real
# build of the attendee's fork) and leaves the deployed claims app HEALTHY against claims-db —
# the demo/instructor END state. See templates/solve-endstate.yaml.
solve: false
# In-cluster Gitea coordinates: where the source org + the monorepo mirror live. The fork job
# forks {upstreamOrg}/parasol-claims into {user} and seeds .tekton/ from the mirror's pipelines/.
giteaNamespace: ogsr-gitea
upstreamOrg: parasol
mirrorRepo: ocp-getting-started

# Size of the per-user Maven local-repository claim (templates/maven-cache.yaml). One claim per
# attendee, on the cluster's default StorageClass. 2Gi is headroom, not a measurement: the
# parasol-claims test dependency tree has not been sized on disk — see the module's timing note.
# Lower it on a storage-tight cluster; the {user}-cicd quota caps the NUMBER of claims (10), not
# their bytes, so this value never trips the quota. Changing it AFTER a claim exists does not
# resize that claim — the API rejects a shrink and only expands when the StorageClass allows it, so
# a changed value takes effect on the next `ws reset` (which deletes the claim) or not at all.
mavenCacheSize: 2Gi

