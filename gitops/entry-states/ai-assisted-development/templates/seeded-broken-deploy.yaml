# ⚠ INTENTIONAL FLAW — DO NOT "FIX" IN THE CHART. This is the deterministic diagnosis target of ai-assisted-development.
# parasol-claims:1.0 (shared parasol-images; Quarkus, real health at /q/health/ready on 8080) deployed
# with a WRONG readinessProbe.httpGet.path (badProbePath → HTTP 404). Result at entry (solve=false):
#   • pod Running but 0/1 Ready (readiness fails);
#   • the Service has NO ready endpoints;
#   • `oc get events` shows ONE crisp "Readiness probe failed … statuscode: 404" line;
#   • NO restart loop — liveness is deliberately OMITTED (readiness-only ⇒ non-flapping, low-temperature
#     friendly for the agent).
# The agent diagnoses this read-only (pods_list / events_list / resources_get / pods_log), then — once
# the attendee grants a scoped write — FIXES it with a one-field patch to goodProbePath. ws solve
# renders goodProbePath directly (Running 1/1) as the END state. Wave 1 (alongside the MCP server).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.seedName }}
  namespace: {{ include "ai-assisted-development.namespace" . }}
  labels:
    app: {{ .Values.seedName }}
    app.kubernetes.io/component: diagnosis-target
    workshop.redhat.com/module: ai-assisted-development
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
    {{- if not .Values.solve }}
    # Broken ON PURPOSE — the one selector that finds every such object cluster-wide; see
    # entry-states/README.md rule 7 for the full contract and `ws by-design` for the operator view.
    # ENTRY ONLY: solve renders the correct path, and a fault marker left on a healthy object is
    # noise that teaches people to ignore the marker.
    workshop.redhat.com/by-design: "true"
    {{- end }}
  annotations:
    # HIGHEST sync-wave on purpose: this Deployment is Running 0/1 BY DESIGN (the diagnosis target), so
    # it never goes Healthy. In an earlier/shared wave Argo gates the sync on its health, hits the
    # Deployment progress deadline, and the WHOLE sync operation fails + retries forever — so `ws start`
    # hangs (proven live on C1, 2026-07-16). As the last wave nothing waits on it: Argo applies it and
    # the operation Succeeds; the app is then Degraded by design, which `ws start` tolerates via the
    # ws-meta `expectDegraded` flag (wait_materialized). Do NOT lower this wave.
    argocd.argoproj.io/sync-wave: "3"
    {{- if not .Values.solve }}
    # The two halves an operator needs the moment they hit this: WHAT they are looking at, and WHY it
    # is fine. The Application already carries workshop.redhat.com/degraded-by-design (stamped by ws's
    # render_app from ws-meta expectDegraded) — but nobody reaches this pod through the Application.
    # They reach it through `oc get pods -n {user}-dev` or `oc describe deploy/parasol-claims`, where
    # 0/1 had no explanation at all: the project lead started debugging it, and the owner would have
    # lost a morning to it (2026-08-13). Split across two keys because a label VALUE cannot hold prose
    # (63 chars, no spaces) and an annotation cannot be selected on — README.md rule 7 has the rest.
    workshop.redhat.com/by-design-symptom: "Degraded — pod Running 0/1, Service endpoints empty"
    workshop.redhat.com/by-design-reason: >-
      ai-assisted-development seeds this readinessProbe path WRONG on purpose ({{ .Values.badProbePath }}
      → HTTP 404, no liveness so there is no restart loop). Root-causing it with an AI agent over MCP
      is the entire module. Do NOT "fix" it here — to see the repaired end state run
      `ws solve ai-assisted-development --user {{ .Values.user }}`, which renders {{ .Values.goodProbePath }}.
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.seedName }}
  template:
    metadata:
      labels:
        app: {{ .Values.seedName }}
        workshop.redhat.com/module: ai-assisted-development
    spec:
      containers:
        - name: {{ .Values.seedName }}
          image: {{ .Values.seedImage }}
          # Mutable workshop tag - rebuilt in place, so a node-cached IfNotPresent layer served the OLD image (measured 2026-07-29).
          imagePullPolicy: Always
          env:
            # parasol-claims is a PostgreSQL-backed Quarkus service — run it DB-FREE so the seed is
            # SELF-CONTAINED and the ONLY fault is the readiness path. WITHOUT this it CrashLoops on a
            # missing parasol-db (UnknownHostException) instead of the clean Running 0/1 we need
            # (verified live 2026-07-15). This is the documented same-image pattern the app ships for
            # resilience-multicluster-dr's per-site responder (apps/parasol-claims/src/main/resources/application.properties).
            - name: QUARKUS_DATASOURCE_ACTIVE
              value: "false"
            - name: QUARKUS_HIBERNATE_ORM_ACTIVE
              value: "false"
          ports:
            - name: http
              containerPort: {{ .Values.seedPort }}
          # THE FAULT (entry) / THE FIX (solve): badProbePath 404s → 0/1; goodProbePath → 1/1. One field.
          readinessProbe:
            httpGet:
              path: {{ include "ai-assisted-development.probePath" . }}
              port: {{ .Values.seedPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          # NO livenessProbe on purpose: a readiness-only fault keeps the pod Running (no CrashLoop),
          # so the single 404 signal stays clean and deterministic.
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
# why: the Service whose endpoints stay EMPTY while the pod is 0/1 — part of the diagnosis signal
# (name MUST be seedName so the agent + attendee reference it by the app name).
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.seedName }}
  namespace: {{ include "ai-assisted-development.namespace" . }}
  labels:
    app: {{ .Values.seedName }}
    workshop.redhat.com/module: ai-assisted-development
    workshop.redhat.com/owner: ogsr
    {{- if not .Values.solve }}
    workshop.redhat.com/by-design: "true"
    {{- end }}
  {{- if not .Values.solve }}
  annotations:
    # Marked as well as the Deployment: "no endpoints" is a second, independently-alarming symptom —
    # whoever chases the empty Service is not necessarily the person who saw the 0/1 pod.
    workshop.redhat.com/by-design-symptom: "no ready endpoints"
    workshop.redhat.com/by-design-reason: >-
      ai-assisted-development: empty endpoints are downstream of the deliberately-broken readiness
      probe on Deployment/{{ .Values.seedName }} in this namespace — read that object's
      workshop.redhat.com/by-design-reason. The Service itself is correct.
  {{- end }}
spec:
  selector:
    app: {{ .Values.seedName }}
  ports:
    - name: http
      port: {{ .Values.seedPort }}
      targetPort: http
