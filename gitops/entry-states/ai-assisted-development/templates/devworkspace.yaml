# The Dev Spaces workspace that carries the neutral mcp-agent-cli client configured against MaaS + the
# in-cluster MCP server. Co-located in {user}-dev so: (a) the MCP server is reachable by short DNS, and
# (b) the auto-mounted maas-credentials Secret (GENAI_API_KEY) is same-namespace. started:false → the
# entry state creates ZERO workspace pods (no quota/token cost); the attendee starts it in the lab.
# EDITOR RESOLUTION — design call #40, CLOSED 2026-07-18 (full decision + rationale at the
# `contributions` field below): the che-code editor resolves via the in-cluster Dev Spaces dashboard
# editor API, permanently — this is no longer an interim fix. ws reset purges DevWorkspaces
# (devspaces-inner-loop+ idiom).
#
# CREDS/CONFIG INTO THE WORKSPACE (all cluster-correct, no devfile edit): GENAI_API_KEY arrives via the
# DevWorkspace Operator auto-mount of the labelled maas-credentials Secret, and GENAI_ENDPOINT/GENAI_MODEL
# via the auto-mounted maas-config-env ConfigMap — both CONVERGED per-cluster by the hook (see
# maas-credentials.yaml; chart default llama-scout-17b, task #67). A devfile container env (schemaVersion
# 2.2.0) can't configMapKeyRef, so these three are injected by the operator, NOT hardcoded here —
# hardcoding model/endpoint here would pin one model onto every cluster regardless of what its MaaS key
# actually grants. Only static, non-MaaS env is literal below.
apiVersion: workspace.devfile.io/v1alpha2
kind: DevWorkspace
metadata:
  name: {{ .Values.devWorkspaceName }}
  namespace: {{ include "ai-assisted-development.namespace" . }}
  labels:
    workshop.redhat.com/module: ai-assisted-development
    workshop.redhat.com/user: {{ .Values.user | quote }}
    workshop.redhat.com/owner: ogsr
spec:
  started: false
  routingClass: che
  contributions:
    # DECISION (#40, closed 2026-07-18): this dashboard-API uri is the PERMANENT editor-resolution
    # mechanism, not an interim step, against the 3-criteria bar (reliable start / survives operator
    # upgrades / simplest-that-works):
    # 1. Reliable start, no external registry: in-cluster svc DNS only. The DS 3.x embedded PLUGIN
    #    registry is OpenVSX-proxy-only and serves no editor devfiles — the earlier bare plugin-registry
    #    `id:` 404'd ("plugin editor does not specify a registryUrl"). The DASHBOARD's editor API is a
    #    different, working path: verified Running on C2 (a cluster with zero custom Dev Spaces config).
    # 2. Survives operator upgrades: this is Eclipse Che's OWN documented pattern for injecting an editor
    #    into a DevWorkspace authored via the Kubernetes API (see "Managing workspaces with Kubernetes
    #    APIs", Eclipse Che docs) — a maintained integration surface, not a reverse-engineered path.
    # 3. Simplest that satisfies 1+2: considered and rejected a custom che-code "editor definition"
    #    ConfigMap in the controller namespace (Che's "Configuring editors definitions" admin mechanism).
    #    That mechanism is for CUSTOM/non-bundled editors; che-code ships BUNDLED with every Dev Spaces
    #    install and already resolves through this same endpoint with zero admin config — the ConfigMap
    #    would add a portfolio-owned resource in openshift-devspaces for no robustness gain.
    # cheDashboardService/-Namespace/-Port (values.yaml) keep the host out of the literal so a future
    # rename is a values override, not a template edit. cheEditorId is the che-editor query id. This is
    # the MCP-capable IDE surface ai-assisted-development's in-IDE beat runs in.
    - name: editor
      uri: {{ include "ai-assisted-development.cheEditorUri" . | quote }}
  template:
    # NO `schemaVersion:` and NO `metadata:` HERE, DELIBERATELY — do not "restore" them. They are devfile
    # DOCUMENT keys; `spec.template` is a DevWorkspaceTemplateSpec, which is a different (smaller) schema.
    # Read off this cluster's own CRD 2026-08-06 (the v1alpha2 openAPIV3Schema itself, NOT `oc explain`):
    # spec.template accepts exactly attributes, commands, components, dependentProjects, events, parent,
    # projects, starterProjects and variables, and sets no x-kubernetes-preserve-unknown-fields — so the
    # API server PRUNES both keys at admission. The chart sent them, the object never carried them, and
    # entry apps run selfHeal=false: Argo diffed two fields that can never persist, and
    # entry-ai-assisted-development-* read OutOfSync FOREVER on an otherwise-healthy world. Permanent red
    # is not free — it teaches attendees and SAs to ignore red.
    #
    # THE SCHEMA ABOVE IS THE MECHANISM; THIS IS THE PROOF — a single-variable experiment that has already
    # run on cluster-65prs, 2026-08-05. Chart 0.1.8 sent the two keys; 0.1.9 (this file) does not, and that
    # is the ONLY difference between the two renders. Across the change the LIVE object was never touched:
    # user8-dev/parasol-ai-assist is still generation 1, managedFields time 16:31:47Z, and the Application's
    # operationState is still pinned to the 0.1.8 revision — no sync ran. Yet the controller logged
    # `Updated sync status: OutOfSync -> Synced` for entry-ai-assisted-development-user8 at 23:59:04Z, the
    # moment the Gitea mirror advanced past the commit. Same object, same Argo, one variable, red to green.
    # (The object's last-applied annotation still carries schemaVersion + metadata; the object carries only
    # `components` — sent, pruned, and diffed, exactly as claimed.)
    #
    # TRAP — do NOT re-add these on the strength of the controller log; that misread has already cost two
    # investigations. The log carries a `serverSideDiff` field reading `true`, and under a genuine
    # server-side diff a pruned field would be INVISIBLE (Argo's SSA dry-run gets pruned identically), which
    # makes the paragraph above look impossible. That field is not a readout of the comparison mode:
    # measured 2026-08-06, all 3694 occurrences sit on `Applying resource … in cluster:` lines — the
    # sync/apply path — and not one sits on a comparison, in a log covering ~58 Applications reconciling on
    # a 2-minute resync. The four surfaces that DO configure the mode (argocd-cm, argocd-cmd-params-cm, the
    # ArgoCD CR's extraConfig, and the controller's command line) set it on NONE, and the measured behaviour
    # is legacy three-way. Behaviour outranks both the flag and the config: if you believe this comment is
    # wrong, re-run the experiment, do not re-infer from a log field.
    #
    # Removing them changes NOTHING on-cluster (they were pruned either way) and costs no waiver. The two
    # alternatives were both worse, in order of cost: ws-meta expectOutOfSync would have muted the sync
    # signal of every OTHER resource in the Application; a path-scoped `ignoreDifferences` would have muted
    # only these two paths, but Applications are built in tools/ws/ws — so one chart's manifest bug would
    # have put a permanent exception into the shared entry-state engine. Deleting fields the API cannot
    # store beats both. Same call packaging-distributing made on its BuildConfig (notifications-image.yaml):
    # match what the API actually stores, do not muzzle the gate.
    #
    # The operator ALSO adds `components[].container.sourceMapping: /projects` (a CRD-level default —
    # `jq .default` on the CRD's sourceMapping schema returns "/projects"). It is deliberately NOT declared
    # here: a field that is live-only — present on the object, absent from the render — does not make Argo
    # OutOfSync. Measured on the same cluster, same CRD, same field: devspaces-inner-loop's DevWorkspace
    # (user5-devspaces/parasol-claims — NOT user5-dev, it is a separate namespace) sends no sourceMapping in
    # its last-applied, carries the operator-added one on the object, and entry-devspaces-inner-loop-user5
    # reads Synced. Declaring it would pin a default we do not own. If a future Dev Spaces release ever DOES
    # make it diff, that is a signal to re-measure, not a licence to re-add a waiver.
    # SCOPE that experiment honestly: it rules sourceMapping OUT, and nothing more. inner-loop's chart never
    # sends a pruned key (its last-applied template keys are commands/components/projects), so it is NOT a
    # control for pruning and never was — the 0.1.8→0.1.9 experiment above is the one that carries that load.
    components:
      - name: tools
        container:
          # The Dev Spaces Universal Developer Image (oc + JDK 21) — the terminal the attendee runs the
          # CLI agent from. Pulled with the cluster global pull secret (registry.redhat.io).
          image: {{ .Values.udiImage }}
          memoryLimit: 2Gi
          mountSources: true
          env:
            # GENAI_ENDPOINT / GENAI_MODEL / GENAI_API_KEY are auto-mounted as env by the DevWorkspace
            # Operator (maas-config-env ConfigMap + maas-credentials Secret), converged per-cluster — so
            # they are deliberately NOT listed here (a devfile env can't configMapKeyRef, and a literal
            # would pin one model onto every cluster regardless of what its MaaS key actually grants).
            # The in-cluster MCP server the CLI agent binds its tools to (SSE on the short Service DNS).
            - name: MCP_SERVER_URL
              value: {{ include "ai-assisted-development.mcpSseUrl" . | quote }}
            # Client-side read-only filter (defence-in-depth). --allow-writes / MCP_READ_ONLY=false flips
            # it; on-cluster it is then RBAC, not this flag, that stops a disallowed write.
            - name: MCP_READ_ONLY
              value: {{ .Values.mcpReadOnly | quote }}
            # Caps the agentic loop → bounds MaaS token spend.
            - name: MCP_MAX_STEPS
              value: {{ .Values.maxSteps | quote }}
            # The provided neutral CLI image the lab runs (e.g. `oc run mcp-agent-cli --image=$AGENT_CLI_IMAGE …`).
            - name: AGENT_CLI_IMAGE
              value: {{ .Values.agentCliImage | quote }}
