# Namespaces this module needs to EXIST before its entry state can materialize. Consumed by
# `ws prep` -> the per-user namespace Application, so a namespace is created on demand rather
# than all 13 existing up front. NOT the same list as purgeNamespaces below: that answers
# "what do I empty on reset", and at least one module (multi-tenancy-workload-security) needs a
# namespace it deliberately must NOT purge, because a cohabitant module's work lives there.
namespaces:
  - "dev"

# ws reset purges user-created leftovers from these namespaces before re-materializing.
# ai-assisted-development's in-namespace state lives entirely in {user}-dev: the entry marker, the mcp-agent SA + view
# RoleBinding, the digest-pinned MCP server (Deployment/Service), the seeded broken parasol-claims
# (Deployment/Service), the MaaS credentials (ConfigMap + hook-created Secret), and the DevWorkspace.
# `oc delete all,pvc` clears the Deployments/Services; the ws engine's purge also deletes the
# hook-created maas-credentials Secret (secret sweep), the DevWorkspace (devspaces-inner-loop+ idiom), and — because the
# SA + RoleBindings are user-scoped, not system objects — the mcp-agent SA and its bindings, so the
# next start re-materializes a clean read-only sandbox and re-runs the copy hook.
# NOTE: the {user}-dev NAMESPACE, its quota, LimitRange and RBAC are WORKSHOP-LAYER-owned
# (gitops/workshop-config/templates/per-user-namespaces.yaml); like build-deliver/packaging-distributing this chart only fills it.
# NO expectOutOfSync, and it is gone for two independent reasons — neither of which is "we stopped
# caring". It was declared here on 2026-07-29 (243efc0) because the maas-copy Sync hook patched
# maas-config's `model` to the cluster's real per-key scope while the chart rendered its own default
# into the same key, so the live ConfigMap diverged from the template forever (entry apps run
# selfHeal=false).
#
#   1. THE CAUSE IS GONE at chart 0.1.7: neither maas-config nor maas-config-env renders any value from
#      the chart — the hook is their sole writer — so there is nothing left to diverge from. Measured on
#      the sibling AI modules on ksls5 2026-07-29: maas-config was the ONLY OutOfSync resource in each,
#      and a data key that is live-only (in the object, absent from the render) reads Synced.
#   2. IT WAS INERT HERE ANYWAY. This module declares expectDegraded, and every consumer of these two
#      flags treats expectDegraded as covering the sync state too: `ws start`/`solve` take the
#      wait_materialized branch and never consult meta_require_sync at all (ws:803, ws:1056), and
#      entry_app_ok short-circuits on expectDegraded before it looks at Synced (ws:2519).
#
# What is no longer claimed is that maas-config is the reason, because it is not.
#
# NOR is the DevWorkspace, and that claim used to live right here. Until chart 0.1.9 this file said the
# app "may still legitimately read OutOfSync … ships an operator-managed DevWorkspace" — measured on
# cluster-65prs 2026-08-05, that was WRONG, and it was the sentence that made a permanent red look
# expected. The DevWorkspace was the only OutOfSync resource in the whole Application, and the entire
# diff was two devfile DOCUMENT keys (template.schemaVersion, template.metadata) that the chart sent and
# the API server PRUNES — spec.template is a DevWorkspaceTemplateSpec and has neither field. Not operator
# defaulting: our manifest asking for fields that cannot exist. The operator's own addition
# (container.sourceMapping, a CRD default) is invisible to Argo — devspaces-inner-loop ships the same
# operator-managed DevWorkspace, gets the same added field, and reads Synced. Chart 0.1.9 stops sending
# the two pruned keys, so this Application's expected reading is now Synced/Degraded — Degraded from the
# seeded fault below, and nothing else. An OutOfSync here is a REAL signal again: investigate it.

purgeNamespaces:
  - "${USER}-dev"

# Modules whose entry/solve charts materialize into the SAME namespace ({user}-dev). Coexisting Argo
# apps that own workloads in one namespace deadlock (SharedResourceWarning, both OutOfSync), so
# `ws start`/`ws solve` evicts the conflicting module before materializing (gc_conflicts). ai-assisted-development joins
# the {user}-dev cohort (same as build-deliver/packaging-distributing). Cross-namespace modules (jobs-batch-kueue {user}-batch, pipelines-fundamentals {user}-cicd,
# service-mesh-advanced-gateways {user}-mesh, app-modernization {user}-modernize, agentic-ai {user}-ai) are NOT conflicts and coexist untouched.
# ⚠ RECIPROCAL EDITS REQUIRED (both directions): each module below must add `ai-assisted-development` to ITS conflictsWith.
# Those edits touch files outside this chart and are handled by PM integration — this file sets only
# the ai-assisted-development→others direction.
conflictsWith:
  - platform-orientation
  - build-deliver
  - devspaces-inner-loop
  - config-multienv
  - storage-stateful
  - gitops-fundamentals
  - gitops-at-scale
  - developer-hub-golden-paths
  - observability-health-scale
  - securing-apps-keycloak
  - multi-tenancy-workload-security
  - networking-dev-devops
  - deployment-targets-scheduling
  - registry-images-catalog-governance
  - serverless-zero-to-hero
  - eventing-deep-dive
  - packaging-distributing

# This module SEEDS AN INTENTIONAL FAULT (parasol-claims 0/1 via a wrong readiness probe — the diagnosis
# target), so its Argo app is DEGRADED by design and Healthy never holds. expectDegraded makes
# `ws start`/`ws solve` wait for the sync OPERATION to land rather than for Healthy — otherwise ws's
# `set -e` fails every start. `ws verify ai-assisted-development` is the correctness gate.
# SCOPE, deliberately narrowed at chart 0.1.9: this covers HEALTH ONLY. It is not a licence for the app
# to read OutOfSync — a Degraded Deployment still reads Synced (measured: parasol-claims sync=Synced
# health=Degraded), and the one resource that did diff no longer does. Do not widen this back into a sync
# waiver to quiet a red; find what actually drifted.
expectDegraded: true

# The MaaS copy hook (up to ~60s of source-secret retries) plus a cold-node pull of the ghcr MCP server
# image and the shared parasol-claims image — widen the sync-wait window (the cap on wait_materialized,
# which returns as soon as the sync op lands) so a cold materialization has room.
waitSeconds: 360

# Representative ai-assisted-development attendee muscle the generic battery (cockpit/identity/isolation) does NOT cover:
# the MCP server world materialized into the attendee's own {user}-dev and the attendee (namespace
# admin) can read it. ${USER} resolves per-run; ws smoke runs it as {user} in the live cockpit.
smokeCommands:
  - "oc get deployment kubernetes-mcp-server -n ${USER}-dev"
