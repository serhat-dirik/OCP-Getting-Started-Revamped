apiVersion: v2
name: ai-assisted-development-entry
description: "AI-Assisted Development on OpenShift (vibe coding, safely) — the per-user AI-assist world in the workshop-owned {user}-dev namespace: an entry marker; a DIGEST-PINNED OpenShift/Kubernetes MCP server (containers/kubernetes-mcp-server v0.0.65) run as a dedicated least-privilege ServiceAccount mcp-agent whose ONLY grant is a namespaced RoleBinding to the built-in `view` ClusterRole (read-only on {user}-dev, no secrets, no cross-namespace) — so RBAC, not the server's --read-only flag, is the security boundary (the CVE-2026-46519 lesson); a DETERMINISTIC broken deployment (parasol-claims:1.0 with a wrong readinessProbe path → Running 0/1, one probe-404 event, no restart loop) that the agent diagnoses read-only and later fixes with a one-field patch once the attendee grants a scoped write; MaaS credentials wired via the jobs-batch-kueue/agentic-ai hook (apitoken copied from openshift-lightspeed/credentials into a maas-credentials Secret, model+endpoint sourced per-cluster with a chart-values fallback) and auto-mounted into the workspace; and a Dev Spaces DevWorkspace (started:false) carrying the neutral mcp-agent-cli client configured against MaaS + the in-cluster MCP server. All state is namespaced in {user}-dev (non-invasive; nothing cluster-wide). {user}-dev (quota/limits/RBAC) is workshop-layer-owned (per-user-namespaces.yaml), NOT this chart — this chart only fills it, so ai-assisted-development shares {user}-dev and conflictsWith that cohort. ws solve renders the END state: the seeded deployment's probe patched to the correct path (Running 1/1), i.e. the outcome after the agent's scoped-write fix."
type: application
# 0.1.5: the MaaS hook now RESOLVES (workshop-owned secret before adopted Lightspeed), VALIDATES
# (JWT shape gate + a 1-token live probe) and only then STAGES the key — the old code copied whatever
# the adopted Lightspeed secret held, which on an Azure-OpenAI cluster is an Azure AD JWT: staged
# green, rejected at model-call time (a live cluster, 2026-07-29). MUST bump: this is a hook-only change, and
# Argo's manifest cache is keyed on the chart version — a stale render can re-apply the old hook
# minutes later on an unrelated reconcile.
# 0.1.6: imagePullPolicy: Always on every workshop-BUILT image in this chart. Their tags
# (1.0/1.1) are MUTABLE and rebuilt in place, so the kubelet's IfNotPresent default kept serving a
# node-cached layer and a rebuilt image never reached a running pod (measured on a live cluster, 2026-07-29:
# the IS tag moved to a new digest, `oc rollout restart` brought the OLD digest back up). Upstream
# images pinned to a digest or an immutable tag are deliberately left on IfNotPresent. MUST bump:
# Argo's manifest cache is keyed on the chart version.
# 0.1.7: maas-config (and, in ai-assisted-development, maas-config-env) no longer renders model/
# endpoint from chart values — the Sync hook is their sole writer. Helm wrote the chart default and the
# hook patched it to the cluster's real per-key model scope seconds later, so the live ConfigMap
# permanently diverged from the render; with selfHeal off the whole Application read OutOfSync forever
# over one key, and ws-meta had to declare expectOutOfSync to keep `ws start`/`prep`/`reset` from
# failing on a healthy world. A value that comes from cluster state does not belong in the rendered
# manifest. MUST bump: Argo's manifest cache is keyed on the chart version.
# 0.1.8: the entry marker now records `seedImage`. With the scoped write of exercise 3 granted, a
# tool-calling model does not always narrate — it can ACT, and act WRONG: twice on 2026-07-31 the
# agent hand-authored a replacement parasol-claims Deployment carrying a literal `image: <image>`
# placeholder instead of the value it had just read, leaving InvalidImageName (checkpoint 3's 1/1
# unreachable) while its own answer reported success. The lab's documented fallback patched only the
# readiness probe, which repairs nothing of that. Recording the image gives the lab an in-place
# recovery instead of a full re-materialization. MUST bump: Argo's manifest cache is keyed on the
# chart version.
# 0.1.9: the DevWorkspace no longer sends `template.schemaVersion` / `template.metadata`. Those are
# devfile DOCUMENT keys; the CRD's spec.template is a DevWorkspaceTemplateSpec and has neither, so the
# API server PRUNED both at admission — the chart asked for two fields the object could never carry, and
# with selfHeal=false the Application read OutOfSync permanently on a healthy world. The operator-added
# sourceMapping was NOT a second cause: a live-only field does not diff, and devspaces-inner-loop proves
# it (same CRD, same added field, Synced). Behaviour-identical on-cluster, and it buys back a REAL Synced
# signal instead of an ignoreDifferences or expectOutOfSync waiver. MUST bump: Argo's manifest cache is
# keyed on the chart version, so a stale render would keep re-applying the pruned keys.
# 0.1.9 CONFIRMED LIVE, re-measured 2026-08-06 on-cluster: entry-ai-assisted-development-user8 reads
# Synced with an EMPTY out-of-sync resource list, and the controller logged the transition itself —
# `Updated sync status: OutOfSync -> Synced` at 2026-08-05T23:59:04Z, with no sync operation in between and
# the live DevWorkspace untouched at generation 1. Only the render changed, so causation is settled, not
# inferred. Health is still Degraded, correctly and solely from the seeded parasol-claims fault.
# NO BUMP for that re-measurement: it corrected COMMENTS in templates/devworkspace.yaml only, and YAML
# comments are stripped when Argo parses the manifest — the rendered objects are unchanged, so there is no
# stale render to bust. Bump when the rendered OBJECTS change, not when the prose around them does.
version: 0.1.9
