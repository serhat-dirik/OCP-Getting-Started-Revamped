# Namespaces this module needs to EXIST before its entry state can materialize. Consumed by
# `ws prep` -> the per-user namespace Application, so a namespace is created on demand rather
# than all 13 existing up front. NOT the same list as purgeNamespaces below: that answers
# "what do I empty on reset", and at least one module (multi-tenancy-workload-security) needs a
# namespace it deliberately must NOT purge, because a cohabitant module's work lives there.
namespaces:
  - "dev"

# ws reset purges user-created leftovers from these namespaces before re-materializing.
# securing-apps-keycloak's whole world lives in {user}-dev: parasol-web + parasol-claims + claims-db (entry), plus the
# parasol-fraud service the solve/lab adds. `oc delete all,pvc` clears the workloads; secrets/configmaps
# the attendee created are purged too (ws engine). The per-user realm-{user} in ns sso-workshop is
# workshop-layer state (seeded once, import-once) and is deliberately NOT touched by reset — like every
# other per-user platform object it survives (Rule 13; this chart never ships it).
purgeNamespaces:
  - "${USER}-dev"
# securing-apps-keycloak materializes the SAME {user}-dev claims stack (parasol-web/parasol-claims/claims-db) that platform-orientation-storage-stateful
# and gitops-fundamentals-observability-health-scale own, so their entry apps would deadlock on SharedResourceWarning if they coexisted. Same-
# namespace modules are MUTUAL conflicts (ADR-0001 amendment): ws start/prep/solve evicts the conflicting
# entry app and purges {user}-dev first. jobs-batch-kueue ({user}-batch) and pipelines-fundamentals/trusted-supply-chain ({user}-cicd) are disjoint → they
# coexist untouched.
conflictsWith:
  - platform-orientation
  - build-deliver
  - devspaces-inner-loop
  - config-multienv
  - storage-stateful
  - gitops-fundamentals
  - gitops-at-scale
  - developer-hub-golden-paths
  - observability-health-scale
  - application-logging
  - multi-tenancy-workload-security
  - networking-dev-devops
  - deployment-targets-scheduling
  - registry-images-catalog-governance
  - serverless-zero-to-hero
  - eventing-deep-dive
  - ai-assisted-development
  - packaging-distributing

# Representative attendee muscle securing-apps-keycloak leans on, beyond the generic cockpit/identity battery.
# (1) The module is a curl-and-jq lab end to end — seventeen jq invocations, every token fetched and
# decoded by hand in the cockpit terminal. Neither tool is asserted anywhere else, and without jq the
# token-inspection beats (roles, aud, exp) produce nothing an attendee can read. Both are present in the
# live cockpit (evidenced by a real attendee-terminal run of THIS module recorded in its smoke notes).
# (2) parasol-web is the browser-facing half of the entry state and the subject of the 302-to-login beat;
# resolving its Route host is the cheapest proof it materialized with an addressable front door.
# ${USER} resolves per-run. QUOTING: single-quotes only, no double-quotes (meta_list strips them).
smokeCommands:
  - "command -v jq >/dev/null && command -v curl >/dev/null"
  - oc get route parasol-web -n ${USER}-dev -o jsonpath='{.spec.host}' | grep -q .
