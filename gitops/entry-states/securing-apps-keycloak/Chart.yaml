apiVersion: v2
name: securing-apps-keycloak-entry
description: "Securing Apps with Keycloak — parasol-web (frontend) + parasol-claims API + an ephemeral claims-db in {user}-dev, deployed UNPROTECTED (the OIDC tenant ships disabled, so this is the pre-lab world). The per-user realm-{user} is seeded by the workshop layer. ws solve materializes the END state: parasol-web protected with auth-code+PKCE, parasol-claims as a bearer API enforcing the claims-adjuster role, and parasol-fraud (bearer, aud-guarded) for the RFC 8693 token-exchange encore."
type: application
# 0.1.1: imagePullPolicy: Always on every workshop-BUILT image in this chart. Their tags
# (1.0/1.1) are MUTABLE and rebuilt in place, so the kubelet's IfNotPresent default kept serving a
# node-cached layer and a rebuilt image never reached a running pod (measured on a live cluster, 2026-07-29:
# the IS tag moved to a new digest, `oc rollout restart` brought the OLD digest back up). Upstream
# images pinned to a digest or an immutable tag are deliberately left on IfNotPresent. MUST bump:
# Argo's manifest cache is keyed on the chart version.
version: 0.1.1
