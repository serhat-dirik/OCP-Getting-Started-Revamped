# Etherpad cohort board (templates/etherpad.yaml) — the workshop's ENTRY POINT. One pad, one URL the
# instructor shares with the room: what the workshop is, how to start, the numbered attendee slots
# people claim by typing their name next to one, and a questions-and-problems section at the bottom.
# Renders into .Values.showroom.namespace beside the cockpits, and derives its claim list from
# userCount/userPrefix/showroom.pilotUser so the links cannot drift from the Routes that exist.
# Requires showroom.enabled (that template owns the namespace); disable for a delivery that hands out
# cockpit URLs some other way.
etherpad:
  enabled: true
  # The pad the instructor shares: https://<hostPrefix>.<clusterDomain>/p/<padId>. Keep both short —
  # this is a URL someone reads out loud. `ogsr-` prefixed because the host lands on the cluster's
  # shared apps domain and must not collide with anything the cluster's owner already runs there.
  hostPrefix: ogsr-pad
  padId: workshop
  # Shown in the browser tab and at the top of the board.
  title: "OpenShift Application Platform — Getting Started"
  # Upstream image, version-pinned. etherpad/etherpad:3.3.3 was the current release on Docker Hub
  # 2026-08-05 (tags 3, 3.3, 3.3.3 and latest all resolved to the same digest, pushed 2026-07-29).
  # 3.x is what the template is written against: its API defaults to OIDC, so templates/etherpad.yaml
  # sets AUTHENTICATION_METHOD=apikey — do not move this to a 2.x tag without re-reading that.
  # The image is built for arbitrary-UID platforms (EP_UID=5001, EP_GID=0), which is why it runs
  # under the restricted SCC unmodified.
  image: docker.io/etherpad/etherpad:3.3.3
  # Pad database (DirtyDB file). Tiny — this holds one pad's text and its revision history.
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
