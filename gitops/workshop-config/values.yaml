# Injected by bootstrap/install.sh (helm parameters userCount, clusterDomain); the rest are stable
# defaults. Local dev: `helm template gitops/workshop-config --set userCount=2`.
userCount: 5
userPrefix: user
# Ingress apps domain (e.g. apps.cluster-x.example.com); "" is fine — currently informational only.
clusterDomain: ""
# Comma-joined slugs of modules DISABLED for this delivery (bootstrap/install.sh + helm/bootstrap
# resolve mNN/slug tokens to canonical slugs, then pass them here). "" = every module visible. Each
# listed slug hides that module from the attendee showroom: templates/showroom.yaml injects a
# `module-<slug>-hidden` Antora attribute into each cockpit's content build, and content/modules/ROOT
# (nav-workshop.adoc + index.adoc) wraps that module's nav entry + library row in ifndef guards. A
# scalar CSV, not a YAML list, because Argo helm.parameters can't carry a list reliably.
modulesDisabledCSV: ""
# Where the in-cluster git service and its user-seeding job live.
giteaNamespace: ogsr-gitea
mirrorOrg: parasol
mirrorRepo: ocp-getting-started
# Argo CD instance that owns the entry-state AppProject (platform instance per ADR-0002).
argoNamespace: openshift-gitops
# Argo CD instance ATTENDEES write to (ADR-0002 amendment 1, student-argocd.yaml) — a DIFFERENT
# instance from argoNamespace above. The operator's namespace-scoped managed-by enrollment keys off
# this NAMESPACE (not the ArgoCD CR's .metadata.name, which stays 'student-gitops' unprefixed on
# purpose for Route-host stability — see student-argocd.yaml header). SEV1 2026-07-18: this value
# didn't exist yet when per-user-namespaces.yaml's managed-by label was written during the ogsr-
# rename, so it kept the bare 'student-gitops' string — the operator silently never enrolled
# {user}-dev/stage/prod. Same default already used by the gitops-fundamentals/gitops-at-scale entry
# states (their own values.yaml) — kept identical here on purpose; if you ever change one, change all.
studentArgoNamespace: ogsr-student-gitops
# Owner-labeled home for the ogsr-uninstall-state ConfigMap. Matches the hardcoded STATE_NS in
# bootstrap/install.sh, bootstrap/ogsr-uninstall.sh, and .Values.namespaces.system in
# helm/bootstrap/values.yaml — all three MUST agree, so change this only in lockstep with those.
systemNamespace: ogsr-system

# Where the portfolio's observability stack (Tempo + the OTel collector) lands. Must match
# platform-portfolio/components/tempo/*.yaml. Only consumed by tempo-jaegerui-access.yaml, which
# grants attendees the pods/get the Jaeger UI's oauth-proxy performs a SubjectAccessReview against.
observabilityNamespace: ogsr-observability-workshop

# securing-apps-keycloak (Securing Apps with Keycloak) workshop auth. When the portfolio `auth` stack is installed,
# bootstrap sets sso.enabled=true so per-user realm-{user} imports render (templates/per-user-sso-realm.yaml)
# into the workshop Keycloak's namespace. Off by default — a workshop without securing-apps-keycloak needs no Keycloak.
sso:
  enabled: false
  namespace: sso-workshop

# app-security-testing attendee accounts in SonarQube (templates/sonarqube-user-seed.yaml). SonarQube 10+
# forces authentication, so without these an attendee sent to the SonarQube dashboard by M08 hits a
# login wall — the shared workshop password is NOT a SonarQube identity by itself. Enabled by default
# because the portfolio's `devsecops` stack ships SonarQube; the seed Job is a no-op cost on a cluster
# that has it, and this flag turns it off entirely for a delivery that dropped the module.
sonarqube:
  enabled: true
  namespace: sonarqube

# Console plugins (richer console views for Pipelines/GitOps/ACS — backlog #24), ON by default
# (owner 2026-07-19: these are mostly console links, not worth a deployer decision). The merge stays
# strictly non-invasive: templates/console-plugins-enable.yaml runs a late sync-wave hook Job that
# MERGES `names` into
# consoles.operator.openshift.io/cluster .spec.plugins — append-if-absent, and ONLY for a name that
# already has a matching ConsolePlugin CR on the cluster (an operator we didn't install is skipped
# with a note, never added as a dangling reference). Anything already present — the org's own, or an
# operator's self-registered default — is left untouched and never claimed as ours. Names the Job
# actually appends are recorded into ogsr-uninstall-state (key console_plugins_added) so
# bootstrap/ogsr-uninstall.sh removes exactly those on uninstall, nothing it did not add. Flipping
# enabled back to false stops the Job from adding MORE plugins on future syncs; it does not retract
# ones already added (uninstall is the only removal path — same preserve-biased design as sso/
# lightspeed elsewhere in this chart). Real CR names verified live on C1 2026-07-18 (`oc get
# consoleplugins`); reconfirm on your cluster before relying on this list — operator releases do
# rename their plugin CRs occasionally.
consolePlugins:
  enabled: true
  names:
    - pipelines-console-plugin
    - gitops-plugin
    - advanced-cluster-security

# App-repo seed: publishes the standalone parasol/* app repos into Gitea by splitting monorepo
# subdirs, so entry-state fork jobs have something to fork. Design: docs/research/app-repo-seed-design.md.
# ENABLED per project direction (2026-07-10, second live review): the standard workshop pattern is
# that attendee repos are populated automatically AS PART OF PROVISIONING — the monorepo is the
# enforced single source of truth for the parasol/* seed repos; hand-edits to them are not a
# supported workflow. (Shipped disabled at first because a force-push into shared repos needed that
# sign-off; the pipelines-fundamentals break-fix P1 — seed repo missing the new test, every fork stale — is exactly
# the failure mode this closes.)
appRepoSeed:
  enabled: true
  revision: main
  repos:
    - repo: parasol-claims
      subdir: apps/parasol-claims
    - repo: parasol-notifications
      subdir: apps/parasol-notifications
    - repo: parasol-web
      subdir: apps/parasol-web
    - repo: parasol-fraud
      subdir: apps/parasol-fraud
    - repo: parasol-service-template
      subdir: apps/parasol-service-template
    - repo: parasol-legacy-claims
      subdir: apps/parasol-legacy-claims
    - repo: claims-config-template
      subdir: gitops/promotion/claims-config-template

# Shared prebuilt Parasol app images (parasol-claims, parasol-web) that MANY entry states pull by full
# in-cluster-registry spec (image-registry...svc:5000/<namespace>/<app>:<tag>) — no entry state builds
# them itself. Declarative build (templates/parasol-images-build.yaml) replaces the historical one-time
# manual binary build + `oc tag` (apps/parasol-claims/README.md, apps/parasol-web/README.md "Building the
# image in-cluster") that left a fresh cluster's ogsr-parasol-images namespace EMPTY — only the Namespace
# + RBAC (templates/parasol-images-pull.yaml) existed — until someone remembered to run it by hand. THE
# BUILDCONFIGS OWN THIS NOW; rebuild = `oc start-build parasol-claims -n <namespace>` (or parasol-web) —
# see the template's header comment for the 1.0-was-historically-frozen tradeoff this simplification makes.
parasolImages:
  namespace: ogsr-parasol-images
  build:
    # DEFAULT ONLY — bootstrap/install.sh overrides this from vars.yaml repo_url, so a fork install
    # builds from the fork. Same repo the showroom antora-ext build clones (showroom.build below).
    repoUrl: https://github.com/serhat-dirik/OCP-Getting-Started-Revamped.git
    revision: main

# Reserved-session guard (templates/showroom.yaml). Each listed user's showroom Deployment is frozen
# against pod-spec rollouts: a chart change that would Recreate-roll the cockpit is NOT rendered into
# their pod template, so Argo self-heal never restarts a live session. Guards the Argo vector the ws
# CLI cannot — WS_RESERVED_USERS (same default) only spares `ws git-refresh --restart-terminals`.
# A reserved user takes pending pod-spec changes only via a DELIBERATE update (remove them here, then
# sync during their maintenance window) — see docs/sa-provisioning-guide.md. Empty list = no guard
# (every showroom tracks the chart); on a fresh/replicable install with no live session, set to [].
# [] as the shipped default (2026-08-05). user5 was a standing reservation for the project owner's
# own demo slot; that reservation was retracted 2026-07-15 — user5 is a normal attendee slot and the
# whole cohort is provisioned identically. Left populated, this freezes user5's cockpit pod-spec, so
# a `ws git-refresh --restart-terminals --all` and anything else that rolls the cockpit silently skip
# that one user — a hole that only shows up as "user5's cockpit is serving old content".
# Re-populate it deliberately, per delivery, to protect a LIVE session mid-workshop (see the comment
# above and docs/sa-provisioning-guide.md) — not as a persistent default.
reservedUsers: []

# Showroom cockpit: per-attendee RHDP Showroom shell (instructions + embedded terminals + tool tabs),
# rendered by templates/showroom.yaml. Serves OUR content from the in-cluster mirror; terminals log
# the attendee in as {user}. See showroom/ui-config.yml for the canonical UI layout.
showroom:
  enabled: true
  # Two-phase rollout gate: when set, deploy Showroom for ONLY this user (pilot). The PM verifies the
  # pilot before it scales. Set to "" (empty) to render one instance per user (1..userCount).
  # Pilot PASSED 2026-07-10 (route/tabs/double-terminal/identity/personalization all verified) → scaled.
  pilotUser: ""
  namespace: ogsr-showroom
  # Git ref the deployer clones/builds from the mirror (matches the workshop-config app revision).
  contentRef: main
  # Per-attendee terminal home PVC (kubeconfig + scratch work; survives pod restarts).
  homeStorage: 5Gi
  # nookbag UI bundle overlaid by the content image (verified latest release 2026-07-10).
  nookbagBundle: https://github.com/rhpds/nookbag/releases/download/nookbag-v0.3.7/nookbag-v0.3.7.zip
  # Pinned image tags — all verified current on quay.io/github 2026-07-10 (verify-never-recall).
  # NOTE: the antora build image is NOT a pinned literal here. It is built IN-CLUSTER by the antora-ext
  # BuildConfig (templates/showroom-antora-build.yaml) and consumed by the cockpit initContainers at
  # image-registry.openshift-image-registry.svc:5000/<showroom.namespace>/antora-ext:latest — templated
  # from showroom.namespace via the workshop-config.antoraImage helper so the pull path can never drift
  # from the ImageStream's namespace (it did: the ogsr- rename left it at .../showroom/antora-ext, so
  # every cockpit ImagePullBackOff'd on a fresh install). Manual rebuild = `oc start-build antora-ext -n
  # <showroom.namespace>`.
  images:
    gitCloner: quay.io/rhpds/git-cloner:v1.1.5
    content: quay.io/rhpds/showroom-content:v1.4.2
    terminal: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-04-07
    nginx: quay.io/rhpds/nginx:1.25
  # antora-ext image build (declarative — replaces the one-time manual `oc new-build`). The BuildConfig
  # layers our pinned Antora extensions (repo package.json/package-lock.json → `npm ci`, the SAME set
  # CI validates) onto the stock rhpds antora image at /opt/antora-ext, which showroom/site.yml requires
  # by absolute path. Source is the PUBLIC GitHub repo (not the in-cluster mirror) so the first build
  # has no mirror-readiness dependency — see templates/showroom-antora-build.yaml.
  build:
    # Base image the extensions are layered onto (rhpds antora; quay tag verified 2026-07-11 & -18).
    baseImage: quay.io/rhpds/antora:v1.3.0
    # DEFAULT ONLY — bootstrap/install.sh overrides this from vars.yaml repo_url. The BuildConfig
    # clones it for package.json + package-lock.json (the pinned npm deps, not workshop content).
    repoUrl: https://github.com/serhat-dirik/OCP-Getting-Started-Revamped.git
    revision: main
    # Build context = repo root (where package.json / package-lock.json live). "" = root.
    contextDir: ""
  # MaaS (Model-as-a-Service) attributes surfaced into showroom-userdata-{user}'s user_data.yml,
  # overriding content/antora.yml's static maas_model/maas_endpoint soft defaults so docs render the
  # model THIS cluster's key actually serves. Per-user MaaS keys are model-scoped, and two clusters
  # this project has used were scoped to opposite models, so no single static default is ever right
  # everywhere. DEFAULTED to antora.yml's current values (0 regression if left unset).
  # THERE IS NO DEFAULT MODEL. Project owner's ruling, 2026-07-30: "this may change in every setup,
  # whatever available the workshop should work with it. there is no default, only expected
  # parameters." These are therefore placeholders that are OBVIOUSLY unset, not plausible values.
  #
  # They used to read `llama-scout-17b` and `https://maas.example.com/v1`, and that combination was
  # live and wrong on this cluster: `ws maas show` reports every AI namespace correctly converged on
  # qwen3-14b from the workshop credential, while the DOCS rendered llama-scout-17b — a model this
  # cluster's key answers with HTTP 401. An attendee reading the instructions and pasting that model
  # name into a curl got a failure the page had told them to expect success from. A wrong-but-
  # plausible value is worse than a visibly-empty one precisely because nobody questions it.
  #
  # Authoritative source: the ogsr-system/ogsr-maas-credentials Secret (keys apitoken/model/endpoint),
  # which is what the entry charts already converge from. Set these to match it at install time —
  # `ws maas show` prints the values to use. Wiring the showroom chart to read that Secret directly,
  # so this cannot drift again, is the real fix and is not done here.
  maasModel: "<set-from-ogsr-maas-credentials>"
  maasEndpoint: "<set-from-ogsr-maas-credentials>"
  # Small footprint (Rule 13): the terminal is the only sized container; nginx/content stay tiny.
  terminalResources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# SA-Demos cockpit: ONE shared presenter cockpit (not per-attendee) serving the DEMO rendering,
# rendered by templates/showroom-demos.yaml, so an SA can run a customer/exec demo from a browser
# tab (Say/Show/Do talk track) instead of stitching module pages together by hand. See that
# template's header comment for the design calls (no terminal, replica count, naming). Disable for
# an attendee-only deployment (no SA presenting live demos) by setting enabled: false.
showroomDemos:
  enabled: true
  # "" = inherit .Values.showroom.namespace (co-locate with attendee cockpits in the same shared
  # namespace — isolation from attendees is by RBAC/terminal-identity there, not namespace, and
  # this cockpit has neither, so co-locating adds no exposure). Set explicitly only if the SA
  # cockpit should live in its own namespace. Leaving this empty means the upcoming ogsr- rename of
  # showroom.namespace carries this cockpit along for free — no second literal to remember.
  namespace: ""
  # Git ref the deployer clones/builds from the mirror. Independent of showroom.contentRef so the
  # SA cockpit can track a pinned tag while attendee cockpits follow main, or vice versa.
  contentRef: main

# BEGIN gen-module-slugs — GENERATED by tools/gen-module-slugs.sh, DO NOT EDIT
