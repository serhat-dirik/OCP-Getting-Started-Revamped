# Lets attendees actually OPEN the Tempo Jaeger UI (observability-health-scale exercise 4).
#
# WHY THIS EXISTS. The Jaeger UI Route the TempoMonolithic publishes is fronted by oauth-proxy,
# which runs with a SubjectAccessReview instead of a plain login check:
#
#   --openshift-sar={"namespace": "ogsr-observability-workshop", "resource": "pods", "verb": "get"}
#
# So the OAuth round-trip SUCCEEDS and the proxy then returns "403 Permission Denied" — verified
# live as user1 on 2026-07-26, and reproduced independently by the project owner from the
# /oauth/callback URL. It reads like a login failure and is not one: it is authorization.
# `oc auth can-i get pods -n ogsr-observability-workshop --as=user1` returned "no" before this.
#
# WHY NAMESPACED, not a rule on platform-observer. platform-observer is bound CLUSTER-WIDE to the
# attendee group. A cluster-wide `pods` read there would let every attendee read every other
# attendee's pods — precisely the cross-tenant leak its own header warns about (the namespaces
# grant was removed 2026-07-11 for exactly this). Scoping to the one platform namespace satisfies
# the proxy's SAR and nothing else.
#
# WHY workshop-config, not the module's entry state. Entry states render once PER USER, and this
# grants a GROUP in a SHARED namespace — eight per-user Applications rendering the same
# cluster-scoped-by-name object would fight over its ownership on every sync. It belongs in the
# layer that renders exactly once.
#
# SCOPE — and this changed on 2026-07-26, so read it rather than assuming. Multitenancy IS now
# enabled on the TempoMonolithic (mode: openshift), the collector exports through
# tempo-traces-gateway, and the console's Observe -> Traces page WORKS for attendees: real
# parasol-claims traces were queried back through the gateway. Task #86 is closed.
#
# So this Role is no longer the only way in. It remains because the Jaeger UI route still exists
# and its oauth-proxy still performs this exact SubjectAccessReview — without the grant, an SA or
# instructor opening that route gets a 403 that reads like a login failure.
#
# DO NOT point ATTENDEE content at the Jaeger UI. On load it prints its own banner: "Jaeger UI is
# deprecated and will be removed in a future release. Install the Cluster Observability Operator
# and the distributed tracing UI plugin to search and visualize traces in the OpenShift Console."
# Teaching it would breach the no-deprecated-tech rule, and the console path it points at now
# works. The lab stays on Observe -> Traces.
#
# VERIFYING THIS GRANT: `oc auth can-i get pods -n ogsr-observability-workshop --as=user1`
# returns "no" even when it is working. `--as` impersonates the USER WITHOUT their GROUPS, and
# this binds a group. Use:
#   oc auth can-i get pods -n ogsr-observability-workshop --as=user1 --as-group=workshop-attendees
# which returns "yes", while --as-group + a peer namespace (user2-dev) and -A both stay "no".
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tempo-jaegerui-viewer
  namespace: {{ .Values.observabilityNamespace }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
rules:
  # Exactly the verb+resource the oauth-proxy SAR asks for — nothing wider. Attendees never need
  # to read these pods' contents; the proxy only performs the access review.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tempo-jaegerui-viewer
  namespace: {{ .Values.observabilityNamespace }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tempo-jaegerui-viewer
subjects:
  # Group-level, so growing the cohort with `ws scale-users` needs no change here.
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: workshop-attendees
