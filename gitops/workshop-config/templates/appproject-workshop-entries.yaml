# ADMIN / FALLBACK AppProject for entry-state Applications. No longer the attendee path: each attendee
# now gets their own `entries-{user}` project (appproject-entries-per-user.yaml) and the admission guard
# permits an attendee NOTHING else. This one survives for two reasons, both real:
#   1. tools/ws/ws argo_project() falls back to it when `entries-{user}` is absent — a cluster whose
#      workshop-config predates the per-user projects, or a --user outside .Values.userCount. Falling
#      back here is vastly better than falling back to stock `default` (which permits "*" everywhere).
#   2. WS_ARGO_PROJECT lets an instructor pin every entry app to one project for triage.
# Keep its rules identical in spirit to the per-user projects; the shared destinations come from the
# same helper so the two can never drift.
#
# Tradeoff: sourceRepos is "*" — the in-cluster Gitea route host can't be templated reliably, so
# containment comes from the destination + resource whitelists rather than the repo allowlist.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workshop-entries
  namespace: {{ .Values.argoNamespace }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
spec:
  description: Per-user module entry states (materialized by the ws CLI)
  sourceRepos:
    - "*"
  # Destinations are ENUMERATED, not "*". Attendees hold unscoped `create` on Applications -- k8s
  # RBAC cannot scope a create by name, because the name does not exist when permission is checked --
  # and the controller that reconciles them is cluster-admin. The admission guard bounds WHAT they
  # may create (name, project, source path); this bounds WHERE the result may land.
  #
  # THE EMPTY ENTRY IS LOAD-BEARING. Do not "tidy" it away.
  # Entry-state Applications carry NO spec.destination.namespace -- the entry chart creates its own
  # namespaces, so the Application names none (see render_app in tools/ws/ws). "*" matched empty; an
  # enumerated list without "" does not, and a first attempt at this narrowing (8490ddf) put every
  # entry app on both clusters into InvalidSpecError/Unknown and left `ws reset` dropping attendees
  # into an empty namespace. Reverted in 317e444.
  #
  # Permitting "" does NOT reopen the hole, and that was measured rather than assumed. Argo checks
  # the project TWICE: once against the Application's own spec.destination, and again against EACH
  # RESOURCE's namespace at sync time. Proved on-cluster with a throwaway project allowing only "":
  #   Route/parasol-claims ns=user1-dev SyncFailed:
  #     namespace user1-dev is not permitted in project 'ogsr-dest-probe'
  # So "" satisfies the spec check while every manifest still has to land in a listed namespace.
  #
  # PEER-NAMESPACE RESIDUAL — no longer accepted, and no longer reachable by an attendee. This project
  # still lists every user's namespaces because an ADMIN materializing on behalf of any attendee may
  # legitimately land on it (fallback path above). Attendees cannot use it at all: the admission guard
  # requires spec.project == 'entries-<their own username>'.
  #
  # The shared namespaces are NOT decoration and must not be trimmed — the helper's header documents
  # which kind each entry chart puts in each, and how to re-derive the list. Two of them
  # (ogsr-student-gitops, openshift-pipelines) were MISSING from the enumeration this project shipped
  # with in 7b526ac, which would have failed `ws start gitops-at-scale` and `ws start
  # trusted-supply-chain` at sync time on any cluster; both had simply not been materialized since.
  destinations:
    - namespace: ""
      server: https://kubernetes.default.svc
{{- range $i := until (int .Values.userCount) }}
    - namespace: "{{ $.Values.userPrefix }}{{ add $i 1 }}-*"
      server: https://kubernetes.default.svc
{{- end }}
{{- include "workshop-config.entryDestinationsShared" . | trim | nindent 4 }}
  # Entry charts may create their module-extra namespaces (e.g. {user}-mesh) — nothing else cluster-scoped.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  # Quotas/limits belong to the workshop layer and must survive ws reset — entry charts can't set them.
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
