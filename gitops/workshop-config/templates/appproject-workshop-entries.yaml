# AppProject that boxes entry-state Applications (created by `ws start`): they may create per-user
# namespaces but nothing else at cluster scope, and may NOT touch the workshop layer's quotas/limits.
# Tradeoff: sourceRepos is "*" — the in-cluster Gitea route host can't be templated reliably, so
# containment comes from the destination + resource whitelists rather than the repo allowlist.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workshop-entries
  namespace: {{ .Values.argoNamespace }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
spec:
  description: Per-user module entry states (materialized by the ws CLI)
  sourceRepos:
    - "*"
  # Destinations are ENUMERATED, not "*" (owner decision 2026-07-31). Attendees hold unscoped
  # `create` on Applications -- k8s RBAC cannot scope create by name -- and the controller that
  # reconciles them is cluster-admin, so this list is what stops an attendee-authored Application
  # writing into the CUSTOMER's namespaces. The admission guard already forces the Application's
  # name, project and source path; this bounds where the result can land.
  #
  # KNOWN RESIDUAL, deliberately accepted for now: every attendee shares this one project, so the
  # list permits all attendee namespaces and an attendee can therefore still target a PEER's. That
  # is a cooperative-classroom risk, not a customer-data one. Closing it properly means one
  # AppProject per attendee, mirroring the proj-{user} pattern the student Argo instance already
  # uses -- tracked, not done here.
  #
  # The five shared namespaces below are NOT decoration and must not be trimmed "for tidiness":
  # entry charts genuinely manage objects in each, verified live rather than assumed --
  #   ogsr-gitea            ConfigMap, Job, Role, RoleBinding, ServiceAccount  (per-user repo seeding)
  #   ogsr-system           Role, RoleBinding
  #   openshift-lightspeed  Role, RoleBinding
  #   sonarqube             Role, RoleBinding                                  (app-security-testing)
  #   stackrox              Role, RoleBinding                                  (RHACS reads)
  # Narrowing to attendee namespaces alone would break `ws start` for every module that needs one.
  # REVERTED to "*" on 2026-07-31 after the enumerated list broke 13 live Applications.
  #
  # What went wrong, recorded so the next attempt does not repeat it: entry-state Applications
  # declare an EMPTY spec.destination.namespace -- the entry chart creates its own namespaces, so
  # the Application itself names none. "*" matched empty; an enumerated list does not, and every
  # entry app went InvalidSpecError / Unknown with
  #   "namespace '' do not match any of the allowed destinations".
  #
  # The verification that missed it checked the namespaces the Applications MANAGE
  # (status.resources) and confirmed none would be rejected. That was the wrong object: the project
  # check runs against spec.destination.namespace, which is a different field and was empty in all
  # of them. Checking the thing next to the thing.
  #
  # A correct narrowing must permit the empty destination explicitly AND still bound where manifests
  # land -- which for these apps is governed by the manifests' own namespaces, not the Application's
  # destination. Containment today therefore comes from the admission guard (name, project, source
  # path) plus clusterResourceWhitelist below, as it did before.
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  # Entry charts may create their module-extra namespaces (e.g. {user}-mesh) — nothing else cluster-scoped.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  # Quotas/limits belong to the workshop layer and must survive ws reset — entry charts can't set them.
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
