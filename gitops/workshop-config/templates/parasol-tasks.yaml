{{- /*
  parasol-tasks — the shared "company task library" for pipelines-fundamentals (Pipelines Fundamentals).

  WHY THIS LIVES IN THE WORKSHOP LAYER (not platform-portfolio): it is Parasol-branded workshop
  content (the image-size-report teaching Task, the JDK 21 build Task for Parasol's apps) and its
  read-RBAC is parameterized by the workshop's per-user model (userCount/userPrefix) — the portfolio
  has no concept of "users" and must stay workshop-agnostic (hard rule 2). Structurally this is the
  twin of parasol-images-pull.yaml: a shared namespace + curated objects + per-user SA-group grants.

  Shared + survives `ws reset` (entry-states README rule 2: shared namespaces are workshop-layer).
  The per-user pipeline SA + workspace PVC are materialized per-run by the pipelines-fundamentals entry state, NOT here.

  LOCKSTEP: the EIGHT Task bodies below (acs-image-check, image-size-report, k6-load-test,
  maven-jdk21, roxctl-deployment-check, sonar-scan, trivy-scan, zap-baseline) duplicate the
  canonical standalone artifacts in pipelines/tasks/*.yaml, which the module + PipelineRuns
  reference. Helm cannot read files outside its chart, so the definitions are duplicated on purpose
  (same pattern as gitops/entry-states/config-multienv _helpers.tpl ↔ gitops/promotion base). Each
  body here is identical to its artifact EXCEPT for the injected workshop.redhat.com/owner label.
  No longer kept in sync by hand alone: tools/lint/copy-drift-guard.py gates all eight pairs (one
  pair per Task, so a failure names the Task) and runs in the lint workflow's copy-drift job. They
  DID drift before that gate existed (fixed in 9549990).
*/ -}}
# The shared library namespace — every attendee's pipeline resolves Tasks from here by cluster resolver.
apiVersion: v1
kind: Namespace
metadata:
  name: ogsr-parasol-tasks
  labels:
    workshop.redhat.com/shared: "true"
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
---
# image-size-report — flagship curated Task: reports a built image's pull size and checks a budget.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: image-size-report
  namespace: ogsr-parasol-tasks
  labels:
    app.kubernetes.io/part-of: parasol
    workshop.redhat.com/library: parasol-tasks
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
spec:
  description: >-
    Reports a container image's total pull size and checks it against a size budget.
    A curated Parasol library Task, referenced from app pipelines via the cluster resolver.
  params:
    - name: IMAGE
      type: string
      description: Fully-qualified image reference to inspect (registry/namespace/name:tag).
    - name: MAX_SIZE_MB
      type: string
      description: Soft budget in MB; the Task flags (does not fail) an image over budget.
      default: "500"
    - name: TLS_VERIFY
      type: string
      description: Verify registry TLS. "false" for the in-cluster registry (service-CA cert).
      default: "false"
  results:
    - name: image-size-bytes
      description: Total image size in bytes (sum of layer + config descriptor sizes).
    - name: image-size-mb
      description: Total image size in whole MB (bytes / 1000000).
    - name: within-budget
      description: '"true" if image-size-mb <= MAX_SIZE_MB, else "false".'
  steps:
    - name: report
      # ose-cli ships `oc` (and `oc image info`) on every connected cluster — no custom image.
      # Digest-pinned; el8 `ose-cli:latest` was frozen on v4.15.0 with unapplied Critical errata.
      # The canonical artifact (pipelines/tasks/image-size-report.yaml) carries the full provenance
      # and the re-resolve command; this copy must match it byte-for-value or the copy-drift job's
      # "parasol-task-image-size-report" pair fails.
      image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22@sha256:f8bbc73242af3eae3f8361a9611b29384d3577dba4d5e5b62f4beb2750862c19
      env:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: MAX_SIZE_MB
          value: $(params.MAX_SIZE_MB)
        - name: TLS_VERIFY
          value: $(params.TLS_VERIFY)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # Authenticate to the registry with the pod's ServiceAccount token (username is
        # arbitrary for the internal registry; the bearer token is the password). Never echoed.
        REG="${IMAGE%%/*}"
        TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
        AUTH="$(printf 'pipeline:%s' "${TOKEN}" | base64 -w0)"
        CFG="$(mktemp -d)/config.json"
        printf '{"auths":{"%s":{"auth":"%s"}}}' "${REG}" "${AUTH}" > "${CFG}"

        INSECURE=""
        [ "${TLS_VERIFY}" = "false" ] && INSECURE="--insecure"

        echo "▶ inspecting ${IMAGE}"
        if ! oc image info "${IMAGE}" ${INSECURE} -a "${CFG}" -o json > /tmp/info.json 2>/tmp/err; then
          echo "❌ could not read ${IMAGE}"
          echo "   fix: confirm the image exists and the pipeline SA has image-puller on it."
          # Precautionary, not a known leak: this prints the raw stderr of a command we just handed a
          # ServiceAccount bearer token (via ${CFG}). No registry error is known to echo it back, but
          # this is an unfiltered error stream from a credential-consuming command, so blank anything
          # JWT-shaped by shape rather than trusting the wording to stay harmless.
          sed -E -e 's#(eyJ)[A-Za-z0-9._~+/=-]{8,}#\1<redacted>#g' -e 's#^#   #' /tmp/err
          exit 1
        fi

        # Sum every layer/config descriptor size. The config descriptor is a few KB, so the total
        # tracks the pull size closely; no jq needed (ose-cli has none).
        BYTES="$(grep -oE '"size": *[0-9]+' /tmp/info.json | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')"
        MB=$(( BYTES / 1000000 ))

        WITHIN="true"
        [ "${MB}" -gt "${MAX_SIZE_MB}" ] && WITHIN="false"

        # Machine-readable results for downstream tasks / the console.
        printf '%s' "${BYTES}"   | tee "$(results.image-size-bytes.path)" >/dev/null
        printf '%s' "${MB}"      | tee "$(results.image-size-mb.path)"    >/dev/null
        printf '%s' "${WITHIN}"  | tee "$(results.within-budget.path)"    >/dev/null

        echo "────────────────────────────────────────────"
        echo "  image        : ${IMAGE}"
        echo "  size         : ${MB} MB (${BYTES} bytes)"
        echo "  budget       : ${MAX_SIZE_MB} MB"
        if [ "${WITHIN}" = "true" ]; then
          echo "  verdict      : ✅ within budget"
        else
          echo "  verdict      : ⚠️  OVER budget by $(( MB - MAX_SIZE_MB )) MB"
          echo "  hint         : slim the base image or use a smaller runtime layer."
        fi
        echo "────────────────────────────────────────────"
---
# maven-jdk21 — curated Task: the org's JDK 21 Maven runner (the bundled maven task is JDK 17).
# LOCKSTEP with pipelines/tasks/maven-jdk21.yaml — read that file's header for WHY the optional
# maven-cache workspace exists, why NOTHING in this repo binds it (three measured runs, 2026-08-08:
# a warm cache saved 1.2% of an 11-minute pipeline and a cold one cost 19% more than no cache), and
# why the mirror param is back. The cache workspace is OPTIONAL, so every existing caller still runs.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: maven-jdk21
  namespace: ogsr-parasol-tasks
  labels:
    app.kubernetes.io/part-of: parasol
    workshop.redhat.com/library: parasol-tasks
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
spec:
  description: >-
    Runs Maven goals against a workspace checkout using a JDK 21 runner (Red Hat UBI9 OpenJDK 21,
    Maven 3.9). The Parasol org standard for building/testing its JDK 21 services. Reuses a
    persistent local repository when the optional maven-cache workspace is bound, and honours a
    repository mirror via MAVEN_MIRROR_URL.
  params:
    - name: GOALS
      type: array
      description: Maven goals and flags to run.
      default:
        - -B
        - -ntp
        - test
    - name: SUBDIRECTORY
      type: string
      description: Path within the workspace that holds the pom.xml.
      default: "."
    - name: MAVEN_MIRROR_URL
      type: string
      description: >-
        Repository mirror URL (a corporate Nexus/Artifactory). Empty — the default — leaves Maven
        pointed at its own repositories. Same param NAME and semantics as the shipped upstream
        `maven` Task (mirror id "mirror.default", mirrorOf "central"), which this curated copy had
        dropped: an org adopting the library could not point it at their own mirror without forking
        the Task, which is the opposite of what a curated library is for.
      default: ""
  workspaces:
    # The source checkout (git-clone writes here); Maven runs against it in place.
    - name: source
    # The Maven local repository (~/.m2/repository), as a volume that OUTLIVES the TaskRun pod.
    # OPTIONAL: an unbound caller still runs, just uncached. Bind it to an EXISTING PVC — a
    # volumeClaimTemplate is per-run and would cache nothing between runs. The per-user PVC lives in
    # the entry states that own {user}-cicd (pipelines-fundamentals, app-security-testing).
    - name: maven-cache
      optional: true
  volumes:
    # Carries the generated settings.xml from the first step to the second. NOT the source
    # workspace: that directory is the buildah build context, and a stray file there changes what
    # gets built. Not the cache workspace either — it must exist when the cache is unbound.
    - name: maven-settings
      emptyDir: {}
  steps:
    - name: generate-settings
      # Same image as the build step below, so this costs no extra pull: it is already on the node.
      # PINNED BY DIGEST, not `:latest` — the org-standard Task models the org standard the
      # supply-chain module teaches, and the shipped `maven` Task it replaces is digest-pinned too.
      # TAG → DIGEST resolved 2026-08-07: ubi9/openjdk-21:latest → sha256:24dad82…, image
      # 1.24-3.1785873424, JAVA_VERSION=21, MAVEN_VERSION=3.9. This is the multi-arch INDEX digest,
      # not a per-arch child, so the library Task is not pinned to one node architecture.
      # Re-resolve: oc image info --show-multiarch registry.access.redhat.com/ubi9/openjdk-21:latest
      image: registry.access.redhat.com/ubi9/openjdk-21@sha256:24dad82bd5d25d9b0c85f0e9c976e47ccce787cc73792355462bf54fe03d9a77
      volumeMounts:
        - name: maven-settings
          mountPath: /maven-settings
      env:
        # "true"/"false". An UNBOUND optional workspace resolves $(workspaces.maven-cache.path) to
        # the EMPTY STRING, so -Dmaven.repo.local=$(…path) would expand to `-Dmaven.repo.local=` and
        # break Maven outright. `.bound` is the only honest discriminator, and reading it needs a
        # shell — which is why this Task now has one step that is a script. (Same shape as the
        # library's roxctl-deployment-check, which reads $(workspaces.source.bound) the same way.)
        - name: CACHE_BOUND
          value: $(workspaces.maven-cache.bound)
        - name: CACHE_PATH
          value: $(workspaces.maven-cache.path)
        - name: MAVEN_MIRROR_URL
          value: $(params.MAVEN_MIRROR_URL)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        SETTINGS=/maven-settings/settings.xml

        # XML-escape the mirror URL before it goes into an element: an `&` in a query string makes
        # settings.xml unparseable and Maven then fails with "Non-parseable settings", which reads
        # like a broken Task rather than a bad parameter. `&` first — escaping it after `<`/`>`
        # would double-escape the ampersands those two just introduced.
        MIRROR_ESC="$(printf '%s' "${MAVEN_MIRROR_URL}" \
          | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')"

        if [ "${CACHE_BOUND}" = "true" ]; then
          mkdir -p "${CACHE_PATH}/repository"
        fi

        {
          echo '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">'
          # <localRepository> rather than -Dmaven.repo.local, so the ONE generated file carries both
          # the cache and the mirror and the build step below stays a plain `mvn` invocation.
          if [ "${CACHE_BOUND}" = "true" ]; then
            echo "  <localRepository>${CACHE_PATH}/repository</localRepository>"
          fi
          if [ -n "${MAVEN_MIRROR_URL}" ]; then
            echo '  <mirrors>'
            echo '    <mirror>'
            echo '      <id>mirror.default</id>'
            echo "      <url>${MIRROR_ESC}</url>"
            echo '      <mirrorOf>central</mirrorOf>'
            echo '    </mirror>'
            echo '  </mirrors>'
          fi
          echo '</settings>'
        } > "${SETTINGS}"

        if [ "${CACHE_BOUND}" = "true" ]; then
          echo "✅ Maven local repository: ${CACHE_PATH}/repository (persistent — survives this run)"
        else
          echo "ℹ️  no maven-cache workspace bound — Maven resolves into this pod's own filesystem,"
          echo "   so the dependency tree is fetched on every run. That is what the Parasol"
          echo "   pipelines do on purpose: measured 2026-08-08, a warm cache was worth 1.2% of an"
          echo "   11-minute run, and the Affinity Assistant's default coschedule=workspaces mode"
          echo "   allows one PVC-backed workspace per TaskRun — which \`source\` already is."
          echo "   An org whose build really is download-bound can bind this workspace to an"
          echo "   EXISTING PersistentVolumeClaim (never a volumeClaimTemplate) once its cluster"
          echo "   sets TektonConfig spec.pipeline.coschedule to pipelineruns to make room for it."
        fi
        if [ -n "${MAVEN_MIRROR_URL}" ]; then
          echo "✅ repository mirror: ${MAVEN_MIRROR_URL} (mirrorOf central)"
        fi
    - name: mvn-goals
      # UBI9 OpenJDK 21 builder image — ships Maven 3.9 at /usr/bin/mvn; JDK 21 matches the app.
      # THE SAME DIGEST as generate-settings above, on purpose: one pull, and both steps provably
      # run the same JDK. Change both or neither; provenance is on that step.
      image: registry.access.redhat.com/ubi9/openjdk-21@sha256:24dad82bd5d25d9b0c85f0e9c976e47ccce787cc73792355462bf54fe03d9a77
      workingDir: $(workspaces.source.path)/$(params.SUBDIRECTORY)
      volumeMounts:
        - name: maven-settings
          mountPath: /maven-settings
      command:
        - /usr/bin/mvn
      # Array param expands to individual args (e.g. -B -ntp test); no shell in THIS step, which is
      # what keeps the attendee-facing "the Task just runs mvn" reading true. The conditional work
      # lives in generate-settings above and reaches Maven as a plain -s file. Deliberately NOT a
      # single `script:` step consuming $(params.GOALS[*]) as "$@": Tekton overwrites a script
      # step's command and its own source comments the intent as "we'll clear out the Args", so
      # relying on args surviving into a script would be relying on a documented non-contract.
      args:
        - -s
        - /maven-settings/settings.xml
        - $(params.GOALS[*])
---
# acs-image-check — curated Task: the RHACS build-time scan gate (trusted-supply-chain Trusted Software Supply Chain).
# LOCKSTEP with pipelines/tasks/acs-image-check.yaml. Contract: a `rox-api-token` Secret (keys
# rox-api-token + rox-central-endpoint) in the run namespace — the trust stack mints it in stackrox,
# the trusted-supply-chain entry state copies it per-user into {user}-cicd.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: acs-image-check
  namespace: ogsr-parasol-tasks
  labels:
    app.kubernetes.io/part-of: parasol
    workshop.redhat.com/library: parasol-tasks
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
spec:
  description: >-
    Runs an RHACS build-time image check (roxctl) against a built image and fails the build on an
    enforced policy violation (the trusted-supply-chain scan gate). Reads Central's endpoint + a CI token from the
    rox-api-token Secret in the run namespace.
  params:
    - name: IMAGE
      type: string
      description: Fully-qualified image reference to check (registry/namespace/name:tag).
    - name: FAIL_ON_VIOLATION
      type: string
      description: '"true" gates the build on an enforced violation; "false" reports only.'
      default: "true"
    - name: POLICY_CATEGORIES
      type: string
      description: >-
        Comma-separated RHACS policy categories to evaluate. Defaults to "Supply Chain Security" so the
        gate keys ONLY on the deterministic trust-stack policies (e.g. Block Log4Shell), NOT the default
        build-breaking "Fixable Severity at least Important" which fires on drifting base-image CVEs.
      default: "Supply Chain Security"
  results:
    - name: check-passed
      description: '"true" if no enforced build policy was violated, else "false".'
  steps:
    - name: image-check
      # RHACS roxctl image (digest-pinned, verified live 2026-07-11 — RHACS 4.11.1). Refresh the
      # digest when the trust stack's RHACS minor moves; Central serves a version-matched roxctl too.
      image: registry.redhat.io/advanced-cluster-security/rhacs-roxctl-rhel9@sha256:979f329cbe0d0dd1c41e63b471c246294780c5daf029c239ebd7d48129e75a15
      env:
        # Endpoint + token from the run-namespace secret; the token value is never echoed.
        - name: ROX_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: rox-api-token
              key: rox-central-endpoint
        - name: ROX_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: rox-api-token
              key: rox-api-token
        - name: IMAGE
          value: $(params.IMAGE)
        - name: FAIL_ON_VIOLATION
          value: $(params.FAIL_ON_VIOLATION)
        - name: POLICY_CATEGORIES
          value: $(params.POLICY_CATEGORIES)
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        echo "▶ RHACS build-time image check: ${IMAGE} (categories: ${POLICY_CATEGORIES})"
        # --insecure-skip-tls-verify: Central serves its own service cert; the call is cluster-internal.
        # --categories scopes the gate to the deterministic trust-stack policies (see POLICY_CATEGORIES).
        # --retries/--retry-delay are roxctl's OWN flags for a backend that is not ready yet
        # (help: "number of retries before exiting as error"). Using them means a scanner still
        # warming up resolves itself instead of surfacing as a workshop failure at all.
        OUT="$(roxctl image check --endpoint "${ROX_ENDPOINT}" --insecure-skip-tls-verify \
                 --retries 6 --retry-delay 10 \
                 --categories "${POLICY_CATEGORIES}" --image "${IMAGE}" 2>&1)"
        RC=$?
        printf '%s\n' "$OUT"
        if [ "$RC" -eq 0 ]; then
          echo "✅ image check passed — no enforced build-time policy violations"
          printf 'true' > "$(results.check-passed.path)"
          exit 0
        fi

        # DO NOT infer "policy violated" from a non-zero exit. roxctl documents no exit-code
        # taxonomy — verified against the pinned image's own `image check --help`, which describes
        # retries and nothing about distinguishing a violation from a backend error — so the exit
        # code cannot tell the two apart. Deciding it means "violated" is how a clean build was
        # told to "remove the vulnerable dependency" while the real cause was RHACS reporting
        # `matcher is not initialized`, i.e. the scanner had not finished loading. In the module
        # that teaches people to TRUST security gates, a gate that cries wolf on clean code
        # teaches the opposite lesson, and the attendee cannot tell the difference.
        #
        # The discriminator is whether roxctl produced a policy ASSESSMENT at all. If it never
        # evaluated policies, we have no grounds to claim one was violated — whatever the exit
        # code. The known-signature check below only sharpens the message; the assessment test is
        # what makes this correct for infrastructure failures nobody has seen yet.
        if printf '%s' "$OUT" | grep -qiE 'matcher is not initialized|scanner is not ready|context deadline exceeded|connection refused|no such host|unavailable desc'; then
          echo "⏳ image check COULD NOT RUN — RHACS is not ready yet, this is NOT a policy result."
          echo "   Your build is not implicated. Wait for the scanner to finish loading and re-run."
          echo "   check: oc get pods -n stackrox | grep scanner"
          exit "$RC"
        fi
        if ! printf '%s' "$OUT" | grep -qiE 'policy|violation'; then
          echo "⏳ image check COULD NOT RUN — roxctl exited ${RC} without assessing any policy."
          echo "   That is an infrastructure or connectivity failure, NOT a finding about your image."
          echo "   Your build is not implicated. See the output above, then re-run."
          exit "$RC"
        fi

        printf 'false' > "$(results.check-passed.path)"
        if [ "${FAIL_ON_VIOLATION}" = "false" ]; then
          echo "⚠️  policy violation(s) found (reporting only — FAIL_ON_VIOLATION=false)"
          exit 0
        fi
        echo "❌ image check FAILED — an enforced build policy was violated (e.g. Log4Shell)."
        echo "   fix: remove the vulnerable dependency / bump the base image, then re-run."
        exit "$RC"
---
# sonar-scan — curated Task: the SonarQube (Community Build) SAST gate (app-security-testing DevSecOps).
# LOCKSTEP with pipelines/tasks/sonar-scan.yaml. Contract: a `sonar-auth` Secret (keys sonar-token +
# sonar-host-url) in the run namespace — the appsec stack mints it in sonarqube/sonar-ci-token, the
# app-security-testing entry state copies it per-user into {user}-cicd.
# Read that file's header for WHY the optional maven-cache workspace exists and why the capstone
# stopped binding it on 2026-08-08: bound beside `source` it gives the TaskRun a second PVC, which
# the Affinity Assistant refuses in its default mode, and once that was worked around a warm cache
# measured out at 1.2% of a run. Same design as maven-jdk21, deliberately — one Maven-caching
# pattern in the library, not two.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sonar-scan
  namespace: ogsr-parasol-tasks
  labels:
    app.kubernetes.io/part-of: parasol
    workshop.redhat.com/library: parasol-tasks
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
spec:
  description: >-
    Runs a SonarQube (Community Build) SAST analysis of a Maven project and fails the build on a red
    quality gate (sonar.qualitygate.wait=true). Reads the SonarQube endpoint + analysis token from the
    sonar-auth Secret in the run namespace. Reuses a persistent Maven local repository when the
    optional maven-cache workspace is bound, and honours a repository mirror via MAVEN_MIRROR_URL.
  params:
    - name: SONAR_PROJECT_KEY
      type: string
      description: SonarQube project key. Per-user is recommended (e.g. parasol-claims-user1).
      default: parasol-claims
    - name: SONAR_PROJECT_NAME
      type: string
      description: Human-readable project name shown on the dashboard.
      default: "Parasol Claims"
    - name: SUBDIRECTORY
      type: string
      description: Path within the workspace that holds the pom.xml.
      default: "."
    - name: QUALITY_GATE_WAIT
      type: string
      description: '"true" blocks on the quality gate and exits non-zero when it is red (the SAST gate).'
      default: "true"
    - name: MAVEN_MIRROR_URL
      type: string
      description: >-
        Repository mirror URL (a corporate Nexus/Artifactory) for the compile step. Empty — the
        default — leaves Maven pointed at its own repositories. Same param NAME and semantics as the
        shipped upstream `maven` Task and as the curated maven-jdk21 (mirror id "mirror.default",
        mirrorOf "central"), so an org adopting this library configures both Tasks the same way.
      default: ""
  workspaces:
    # The source checkout (git-clone writes here); compile + scan run against it in place.
    - name: source
    # The Maven local repository, reused BETWEEN runs. OPTIONAL: an unbound caller still runs, just
    # uncached. Bind it to an EXISTING PVC — a volumeClaimTemplate is per-run and caches nothing
    # between runs. The per-user PVC lives in the app-security-testing entry state that owns
    # {user}-cicd, which is the same PVC the capstone Pipeline already gives unit-test.
    - name: maven-cache
      optional: true
  volumes:
    # Carries the generated settings.xml from generate-settings to compile. NOT the source
    # workspace: a stray file there lands in what SonarQube analyses (sonar.sources) and in any
    # later build context. Not the cache workspace either — it must exist when the cache is unbound.
    - name: maven-settings
      emptyDir: {}
  results:
    - name: quality-gate-passed
      description: '"true" if the SonarQube quality gate passed, else "false".'
  steps:
    - name: generate-settings
      # Same image as the compile step below, so this costs no extra pull: it is already on the node.
      # PINNED BY DIGEST, not `:latest` — and here it also protects the gate: a floating tag means
      # the bytecode SonarQube analyses can come from a different JDK build between two runs of the
      # same pipeline, which is exactly the unrecorded variable a SAST gate must not have.
      # TAG → DIGEST resolved 2026-08-07: ubi9/openjdk-21:latest → sha256:24dad82…, image
      # 1.24-3.1785873424, JAVA_VERSION=21, MAVEN_VERSION=3.9. Multi-arch INDEX digest, not a
      # per-arch child. Same digest as maven-jdk21 on purpose: one image for the library.
      # Re-resolve: oc image info --show-multiarch registry.access.redhat.com/ubi9/openjdk-21:latest
      image: registry.access.redhat.com/ubi9/openjdk-21@sha256:24dad82bd5d25d9b0c85f0e9c976e47ccce787cc73792355462bf54fe03d9a77
      volumeMounts:
        - name: maven-settings
          mountPath: /maven-settings
      env:
        # "true"/"false". An UNBOUND optional workspace resolves $(workspaces.maven-cache.path) to
        # the EMPTY STRING, so -Dmaven.repo.local=$(…path) would expand to `-Dmaven.repo.local=` and
        # break Maven outright. `.bound` is the only honest discriminator.
        - name: CACHE_BOUND
          value: $(workspaces.maven-cache.bound)
        - name: CACHE_PATH
          value: $(workspaces.maven-cache.path)
        - name: MAVEN_MIRROR_URL
          value: $(params.MAVEN_MIRROR_URL)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        SETTINGS=/maven-settings/settings.xml

        # XML-escape the mirror URL before it goes into an element: an `&` in a query string makes
        # settings.xml unparseable and Maven then fails with "Non-parseable settings", which reads
        # like a broken Task rather than a bad parameter. `&` first — escaping it after `<`/`>`
        # would double-escape the ampersands those two just introduced.
        MIRROR_ESC="$(printf '%s' "${MAVEN_MIRROR_URL}" \
          | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')"

        if [ "${CACHE_BOUND}" = "true" ]; then
          mkdir -p "${CACHE_PATH}/repository"
        fi

        {
          echo '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">'
          # <localRepository> rather than -Dmaven.repo.local, so the ONE generated file carries both
          # the cache and the mirror and the compile step below stays a plain `mvn` invocation.
          if [ "${CACHE_BOUND}" = "true" ]; then
            echo "  <localRepository>${CACHE_PATH}/repository</localRepository>"
          fi
          if [ -n "${MAVEN_MIRROR_URL}" ]; then
            echo '  <mirrors>'
            echo '    <mirror>'
            echo '      <id>mirror.default</id>'
            echo "      <url>${MIRROR_ESC}</url>"
            echo '      <mirrorOf>central</mirrorOf>'
            echo '    </mirror>'
            echo '  </mirrors>'
          fi
          echo '</settings>'
        } > "${SETTINGS}"

        if [ "${CACHE_BOUND}" = "true" ]; then
          echo "✅ Maven local repository: ${CACHE_PATH}/repository (persistent — survives this run)"
        else
          echo "ℹ️  no maven-cache workspace bound — Maven resolves into this pod's own filesystem,"
          echo "   so the dependency tree is fetched on every run. That is what the Parasol"
          echo "   pipelines do on purpose: measured 2026-08-08, a warm cache was worth 1.2% of an"
          echo "   11-minute run, and the Affinity Assistant's default coschedule=workspaces mode"
          echo "   allows one PVC-backed workspace per TaskRun — which \`source\` already is."
          echo "   An org whose build really is download-bound can bind this workspace to an"
          echo "   EXISTING PersistentVolumeClaim (never a volumeClaimTemplate) once its cluster"
          echo "   sets TektonConfig spec.pipeline.coschedule to pipelineruns to make room for it."
        fi
        if [ -n "${MAVEN_MIRROR_URL}" ]; then
          echo "✅ repository mirror: ${MAVEN_MIRROR_URL} (mirrorOf central)"
        fi
    - name: compile
      # SonarQube Java rules need compiled bytecode (sonar.java.binaries) — produce target/classes with
      # the same UBI9 OpenJDK 21 runner as the parasol-tasks maven-jdk21 Task.
      # THE SAME DIGEST as generate-settings above, on purpose: one pull, and the settings that step
      # wrote provably belong to this Maven. Change both or neither; provenance is on that step.
      image: registry.access.redhat.com/ubi9/openjdk-21@sha256:24dad82bd5d25d9b0c85f0e9c976e47ccce787cc73792355462bf54fe03d9a77
      workingDir: $(workspaces.source.path)/$(params.SUBDIRECTORY)
      volumeMounts:
        - name: maven-settings
          mountPath: /maven-settings
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "▶ compiling for SonarQube analysis (Java rules require bytecode)…"
        # -s points Maven at the generated settings.xml, which is what carries the persistent local
        # repository (and the mirror) — without it this step re-downloads the whole tree every run.
        /usr/bin/mvn -s /maven-settings/settings.xml -B -ntp -DskipTests compile
    - name: sonar-scanner
      # SonarScanner CLI 12.x, digest-pinned (verified live 2026-07-15). Third-party OSS.
      image: docker.io/sonarsource/sonar-scanner-cli:12@sha256:23ca0f137965d9dff2198074043fd48d386280bc5d0ccac8c8349cea4cf096a9
      workingDir: $(workspaces.source.path)/$(params.SUBDIRECTORY)
      env:
        # Endpoint + token from the run-namespace secret; the token value is never echoed.
        - name: SONAR_HOST_URL
          valueFrom:
            secretKeyRef:
              name: sonar-auth
              key: sonar-host-url
        - name: SONAR_TOKEN
          valueFrom:
            secretKeyRef:
              name: sonar-auth
              key: sonar-token
        # Writable scanner cache/home under restricted-v2 SCC (random UID cannot write the image HOME).
        - name: SONAR_USER_HOME
          value: /tmp/.sonar
        - name: PROJECT_KEY
          value: $(params.SONAR_PROJECT_KEY)
        - name: PROJECT_NAME
          value: $(params.SONAR_PROJECT_NAME)
        - name: QUALITY_GATE_WAIT
          value: $(params.QUALITY_GATE_WAIT)
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        echo "▶ SonarQube analysis: ${PROJECT_KEY} → ${SONAR_HOST_URL}"
        # sonar-scanner reads SONAR_HOST_URL + SONAR_TOKEN from env. qualitygate.wait=true polls the
        # compute engine and returns a non-zero exit on a RED gate — this is the SAST gate.
        sonar-scanner \
          -Dsonar.projectKey="${PROJECT_KEY}" \
          -Dsonar.projectName="${PROJECT_NAME}" \
          -Dsonar.sources=src/main \
          -Dsonar.java.binaries=target/classes \
          -Dsonar.qualitygate.wait="${QUALITY_GATE_WAIT}"
        RC=$?
        if [ "$RC" -eq 0 ]; then
          echo "✅ SonarQube quality gate PASSED"
          printf 'true' > "$(results.quality-gate-passed.path)"
          exit 0
        fi
        printf 'false' > "$(results.quality-gate-passed.path)"
        echo "❌ SonarQube quality gate FAILED (or analysis error)."
        echo "   dashboard: ${SONAR_HOST_URL}/dashboard?id=${PROJECT_KEY}"
        echo "   fix: resolve the new issues (e.g. remove the hardcoded credential — rule S2068), then re-run."
        exit "$RC"

---
# trivy-scan — curated Task: the Trivy SCA gate (dependency CVEs + copyleft licenses; app-security-testing).
# LOCKSTEP with pipelines/tasks/trivy-scan.yaml. No auth; digest-pinned image (never the Trivy Action).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trivy-scan
  namespace: ogsr-parasol-tasks
  labels:
    app.kubernetes.io/part-of: parasol
    workshop.redhat.com/library: parasol-tasks
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
spec:
  description: >-
    Runs a Trivy filesystem scan (dependency CVEs + license policy) and fails the build on
    HIGH/CRITICAL findings; writes a CycloneDX SBOM artifact to the workspace. Digest-pinned image
    (never the compromised GitHub Action).
  params:
    - name: SUBDIRECTORY
      type: string
      description: Path within the workspace to scan (holds the pom.xml).
      default: "."
    - name: SEVERITY
      type: string
      description: Comma-separated severities that gate the build.
      default: "HIGH,CRITICAL"
    - name: SCANNERS
      type: string
      description: Trivy scanners to run — "vuln,license" for SCA + copyleft policy.
      default: "vuln,license"
    - name: EXIT_CODE
      type: string
      description: '"1" gates the build on a finding; "0" reports only.'
      default: "1"
    - name: TRIVY_DB_REPOSITORY
      type: string
      description: OCI repo for the Trivy vuln DB — point at a mirror to avoid rate limits at scale.
      default: "ghcr.io/aquasecurity/trivy-db:2"
  workspaces:
    # The source checkout (git-clone writes here); Trivy scans it in place and writes the SBOM here.
    - name: source
  results:
    - name: scan-passed
      description: '"true" if no gating finding, else "false".'
  steps:
    - name: trivy-scan
      # Trivy 0.67.0, digest-pinned via GHCR (verified live 2026-07-15). Third-party OSS. NOT the Action.
      image: ghcr.io/aquasecurity/trivy:0.67.0@sha256:de2ab931243c724bc5ea97f22027d5cf38f953dd7e806ad3976a42dc5b0174c4
      workingDir: $(workspaces.source.path)/$(params.SUBDIRECTORY)
      env:
        - name: SEVERITY
          value: $(params.SEVERITY)
        - name: SCANNERS
          value: $(params.SCANNERS)
        - name: EXIT_CODE
          value: $(params.EXIT_CODE)
        - name: TRIVY_DB_REPOSITORY
          value: $(params.TRIVY_DB_REPOSITORY)
        # Writable DB/cache dir under restricted-v2 SCC (random UID cannot write the image HOME).
        - name: TRIVY_CACHE_DIR
          value: /tmp/trivycache
      script: |
        #!/bin/sh
        # POSIX sh: the Trivy image is alpine-based and ships NO bash (only /bin/sh).
        set -u
        echo "▶ generating a CycloneDX SBOM artifact…"
        # Report pass (never gates): a bill of materials surfacing every dependency for the attendee.
        trivy fs --quiet --scanners "${SCANNERS}" --format cyclonedx --output ./trivy-sbom.json . || true
        [ -f ./trivy-sbom.json ] && echo "  ✓ SBOM written to the workspace: trivy-sbom.json"

        echo "▶ SCA scan (deps + licenses): severity=${SEVERITY} scanners=${SCANNERS} db=${TRIVY_DB_REPOSITORY}"
        # Gating pass: HIGH/CRITICAL dependency vulnerabilities → non-zero exit (the CVE gate). The
        # license scanner also runs; its findings are surfaced in the SBOM/report, not the exit code.
        trivy fs --scanners "${SCANNERS}" --severity "${SEVERITY}" --exit-code "${EXIT_CODE}" \
          --db-repository "${TRIVY_DB_REPOSITORY}" .
        RC=$?
        if [ "$RC" -eq 0 ]; then
          echo "✅ SCA scan passed — no ${SEVERITY} dependency vulnerabilities"
          printf 'true' > "$(results.scan-passed.path)"
          exit 0
        fi
        printf 'false' > "$(results.scan-passed.path)"
        echo "❌ SCA scan FAILED — a ${SEVERITY} dependency CVE was found."
        echo "   fix: bump or remove the flagged dependency (e.g. commons-collections 3.2.1 → CVE-2015-7501), then re-run."
        exit "$RC"

---
# roxctl-deployment-check — curated Task: the RHACS deploy-time config-security gate (app-security-testing).
# LOCKSTEP with pipelines/tasks/roxctl-deployment-check.yaml. Reuses the rox-api-token Secret (same
# contract as acs-image-check); the app-security-testing entry state copies it per-user into {user}-cicd.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: roxctl-deployment-check
  namespace: ogsr-parasol-tasks
  labels:
    app.kubernetes.io/part-of: parasol
    workshop.redhat.com/library: parasol-tasks
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
spec:
  description: >-
    Runs an RHACS deploy-time check (roxctl deployment check) against a committed Kubernetes Deployment
    manifest and fails the build when it violates a deploy policy at/above FAIL_SEVERITY (the app-security-testing
    config-security gate). Emits JUnit. Reads Central's endpoint + a CI token from the rox-api-token
    Secret in the run namespace.
  params:
    - name: IMAGE
      type: string
      description: Image the rendered Deployment runs (used only when no manifest is found at FILE).
    - name: FILE
      type: string
      description: >-
        Path to the Deployment manifest to check. Relative paths resolve against the source workspace
        (e.g. deploy/parasol-claims-deployment.yaml); an absolute path is used as-is. If it does not
        exist, a minimal parasol-claims Deployment for IMAGE is rendered instead.
      default: "deploy/parasol-claims-deployment.yaml"
    - name: FAIL_SEVERITY
      type: string
      description: 'Lowest violation severity that gates the build: LOW, MEDIUM, HIGH, or CRITICAL.'
      default: "MEDIUM"
    - name: FAIL_ON_VIOLATION
      type: string
      description: '"true" gates the build on a gating violation; "false" reports only.'
      default: "true"
  workspaces:
    # The source checkout (git-clone writes it); the committed manifest at FILE is read from here.
    # Optional so the Task still runs standalone (rendering a minimal Deployment when unbound).
    - name: source
      optional: true
  results:
    - name: check-passed
      description: '"true" if no gating deploy-policy violation, else "false".'
  steps:
    - name: deployment-check
      # RHACS roxctl image (digest-pinned, same as acs-image-check — RHACS 4.11.1). Refresh together.
      image: registry.redhat.io/advanced-cluster-security/rhacs-roxctl-rhel9@sha256:979f329cbe0d0dd1c41e63b471c246294780c5daf029c239ebd7d48129e75a15
      env:
        - name: ROX_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: rox-api-token
              key: rox-central-endpoint
        - name: ROX_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: rox-api-token
              key: rox-api-token
        - name: IMAGE
          value: $(params.IMAGE)
        - name: FILE
          value: $(params.FILE)
        - name: FAIL_SEVERITY
          value: $(params.FAIL_SEVERITY)
        - name: FAIL_ON_VIOLATION
          value: $(params.FAIL_ON_VIOLATION)
        - name: WS_BOUND
          value: $(workspaces.source.bound)
        - name: WS_PATH
          value: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        # Resolve the manifest: FILE in the source workspace, an absolute FILE, or a rendered fallback.
        if [ "${WS_BOUND}" = "true" ] && [ -f "${WS_PATH}/${FILE}" ]; then
          MANIFEST="${WS_PATH}/${FILE}"
        elif [ -n "${FILE}" ] && [ -f "${FILE}" ]; then
          MANIFEST="${FILE}"
        else
          echo "ℹ️  no manifest at '${FILE}' — rendering a minimal Deployment for ${IMAGE}"
          MANIFEST=/tmp/parasol-claims-deploy.yaml
          cat > "${MANIFEST}" <<EOF
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: parasol-claims
          labels:
            app: parasol-claims
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: parasol-claims
          template:
            metadata:
              labels:
                app: parasol-claims
            spec:
              containers:
                - name: parasol-claims
                  image: ${IMAGE}
                  ports:
                    - containerPort: 8080
        EOF
        fi

        echo "▶ RHACS deploy-time check on ${MANIFEST} (gates at ${FAIL_SEVERITY}+)"
        # --insecure-skip-tls-verify: Central serves its own service cert; the call is cluster-internal.
        # Human-readable table (parsed for the gate) + a JUnit artifact of the same run.
        roxctl deployment check --endpoint "${ROX_ENDPOINT}" --insecure-skip-tls-verify \
          --file "${MANIFEST}" -o table 2>&1 | tee /tmp/deployment-check.txt
        roxctl deployment check --endpoint "${ROX_ENDPOINT}" --insecure-skip-tls-verify \
          --file "${MANIFEST}" -o junit > /tmp/deployment-check.junit.xml 2>/dev/null || true

        # roxctl prints a summary line: "(TOTAL: 6, LOW: 1, MEDIUM: 5, HIGH: 0, CRITICAL: 0)".
        SUMMARY="$(grep -oE '\(TOTAL: [0-9]+, LOW: [0-9]+, MEDIUM: [0-9]+, HIGH: [0-9]+, CRITICAL: [0-9]+\)' /tmp/deployment-check.txt | tail -1)"

        # DO NOT infer "no violations" from an unparseable report. When roxctl produces no policy
        # ASSESSMENT — Central unreachable, an expired/rotated rox-api-token, a scanner still
        # loading, or an output format that moved — SUMMARY is empty, every severity below parses
        # as 0, GATING computes to 0, and the gate prints "✅ deployment check passed" and writes
        # check-passed=true. A security gate that reports GREEN because it could not run is worse
        # than no gate at all: the attendee is told their configuration was checked when nothing
        # checked it, and the pipeline deploys on that assurance.
        #
        # Same root cause as the acs-image-check fix in this library — a gate must never claim a
        # result it did not measure — but in the opposite direction: that one inferred a VIOLATION
        # from an exit code with no taxonomy, this one inferred a PASS from a missing assessment.
        # The discriminator is the same and is the presence of the assessment, not the exit code.
        if [ -z "${SUMMARY}" ]; then
          echo "⏳ deployment check COULD NOT RUN — roxctl produced no policy assessment for ${MANIFEST}."
          echo "   This is NOT a verdict on your configuration: nothing was checked."
          echo "   Your manifest is not implicated. Read roxctl's output above, then re-run."
          echo "   check: oc get pods -n stackrox   (is Central up? is the rox-api-token still valid?)"
          exit 1
        fi

        sev() { echo "${SUMMARY}" | grep -oE "$1: [0-9]+" | grep -oE '[0-9]+' || echo 0; }
        LOW="$(sev LOW)"; MED="$(sev MEDIUM)"; HIGH="$(sev HIGH)"; CRIT="$(sev CRITICAL)"
        case "${FAIL_SEVERITY}" in
          CRITICAL) GATING=$(( CRIT ));;
          HIGH)     GATING=$(( HIGH + CRIT ));;
          LOW)      GATING=$(( LOW + MED + HIGH + CRIT ));;
          *)        GATING=$(( MED + HIGH + CRIT ));;   # MEDIUM (default)
        esac

        if [ "${GATING:-0}" -eq 0 ]; then
          echo "✅ deployment check passed — no ${FAIL_SEVERITY}+ deploy-policy violations"
          printf 'true' > "$(results.check-passed.path)"
          exit 0
        fi
        printf 'false' > "$(results.check-passed.path)"
        if [ "${FAIL_ON_VIOLATION}" = "false" ]; then
          echo "⚠️  ${GATING} ${FAIL_SEVERITY}+ deploy-policy violation(s) found (reporting only — FAIL_ON_VIOLATION=false)"
          exit 0
        fi
        echo "❌ deployment check FAILED — ${GATING} ${FAIL_SEVERITY}+ deploy-policy violation(s)."
        echo "   fix: set resource requests/limits, drop excess capabilities, disable privileged, then re-run."
        exit 1

---
# zap-baseline — curated Task: the ZAP (Zed Attack Proxy) DAST gate against the running app (app-security-testing).
# LOCKSTEP with pipelines/tasks/zap-baseline.yaml. Digest-pinned image; targets in-cluster Service DNS.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: zap-baseline
  namespace: ogsr-parasol-tasks
  labels:
    app.kubernetes.io/part-of: parasol
    workshop.redhat.com/library: parasol-tasks
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
spec:
  description: >-
    Runs a ZAP baseline (passive) DAST scan against a running app's in-cluster Service DNS and fails the
    build on ZAP FAIL rules. Writes HTML/Markdown reports to the zap-work workspace.
  params:
    - name: TARGET_URL
      type: string
      description: In-cluster URL of the running app (Service DNS), e.g. http://parasol-claims:8080.
      default: "http://parasol-claims:8080"
    - name: FAIL_ON_WARN
      type: string
      description: '"false" runs ZAP with -I so only FAIL rules gate; "true" also gates on WARN rules.'
      default: "false"
  workspaces:
    # ZAP writes its session + reports to /zap/wrk, which must be writable — mount a run-provided
    # (empty) workspace there (the image /zap/wrk is not writable under the restricted-v2 random UID).
    - name: zap-work
      mountPath: /zap/wrk
  results:
    - name: dast-passed
      description: '"true" if ZAP reported no gating alert, else "false".'
  steps:
    - name: zap-baseline
      # ZAP stable, digest-pinned via GHCR (verified live 2026-07-15). Third-party OSS. The old
      # owasp/zap2docker-* images are deprecated.
      image: ghcr.io/zaproxy/zaproxy:stable@sha256:c558ee87358911ab17278c70991e856f57793e115d9cd0f88ca475cf82907a1a
      workingDir: /zap/wrk
      env:
        - name: TARGET_URL
          value: $(params.TARGET_URL)
        - name: FAIL_ON_WARN
          value: $(params.FAIL_ON_WARN)
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        echo "▶ ZAP baseline (DAST) against ${TARGET_URL}"
        # -c makes ZAP use its Automation Framework, which writes $HOME/zap.yaml; the image HOME isn't
        # writable under the restricted-v2 random UID, so point HOME at the writable workspace (workingDir).
        export HOME="$(pwd)"
        # Tune the gate: IGNORE ZAP's informational passive rules that are NOT "missing security header"
        # findings, so the DAST gate keys on the headers the app must set (CSP 10038, Permissions-Policy
        # 10063, X-Content-Type-Options 10021, anti-clickjacking 10020, HSTS 10035) and NOT on cache
        # storability (10015/10049), suspicious comments (10027), CSP directive-completeness (10055), or
        # timestamp disclosure (10096). A real CI ZAP baseline is always tuned like this — otherwise
        # informational noise makes a clean, hardened app fail. Config format: <ruleId>\t<action>\t<note>.
        printf '10015\tIGNORE\tcache-control\n10027\tIGNORE\tcomments\n10049\tIGNORE\tcacheable\n10055\tIGNORE\tcsp-directives\n10096\tIGNORE\ttimestamp\n' > zap.conf
        FLAGS=(-t "${TARGET_URL}" -c zap.conf -r zap-report.html -w zap-report.md)
        # -I: do NOT fail the exit code on WARN rules (only FAIL rules gate) — the default.
        [ "${FAIL_ON_WARN}" = "false" ] && FLAGS+=(-I)
        zap-baseline.py "${FLAGS[@]}"
        RC=$?
        # zap-baseline.py exit codes: 0 = clean, 1 = a FAIL rule fired, 2 = only WARN rules, 3 = error.
        if [ "$RC" -eq 0 ]; then
          echo "✅ DAST passed — no gating alerts (reports in the zap-work workspace)"
          printf 'true' > "$(results.dast-passed.path)"
          exit 0
        fi
        printf 'false' > "$(results.dast-passed.path)"
        if [ "$RC" -eq 2 ] && [ "${FAIL_ON_WARN}" = "false" ]; then
          echo "⚠️  DAST found WARN-level issues only (not gating) — review the report."
          printf 'true' > "$(results.dast-passed.path)"
          exit 0
        fi
        echo "❌ DAST FAILED — ZAP reported a gating alert on the running app."
        echo "   fix: add the missing security headers (CSP / X-Content-Type-Options / HSTS) and re-run."
        exit "$RC"

---
# k6-load-test — curated Task: the load/performance gate against the running app (DevSecOps perf gate).
# LOCKSTEP with pipelines/tasks/k6-load-test.yaml. Re-implements the reference Gatling perf test on k6
# (container-native, threshold-gated). Targets in-cluster Service DNS; writes an HTML report to k6-work.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: k6-load-test
  namespace: ogsr-parasol-tasks
  labels:
    app.kubernetes.io/part-of: parasol
    workshop.redhat.com/library: parasol-tasks
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
spec:
  description: >-
    Runs a short k6 load test against a running app's in-cluster Service DNS and fails the build when a
    latency (p95) or error-rate threshold is breached. Writes a self-contained HTML report to the
    k6-work workspace.
  params:
    - name: TARGET_URL
      type: string
      description: In-cluster base URL of the running app (Service DNS), e.g. http://parasol-claims:8080.
      default: "http://parasol-claims:8080"
    - name: VUS
      type: string
      description: Virtual users (concurrent load) to sustain for DURATION.
      default: "10"
    - name: DURATION
      type: string
      description: How long to sustain the load (k6 duration string, e.g. 30s, 1m).
      default: "30s"
    - name: P95_THRESHOLD_MS
      type: string
      description: Gate — 95th-percentile request duration budget in milliseconds.
      default: "800"
    - name: MAX_ERROR_RATE
      type: string
      description: Gate — maximum fraction of failed requests tolerated (0.01 = 1%).
      default: "0.01"
    - name: FAIL_ON_THRESHOLD
      type: string
      description: '"true" fails the build on a breached threshold; "false" runs report-only.'
      default: "true"
  workspaces:
    # k6 writes its HTML dashboard report here (the run mounts an empty workspace). The container FS is
    # not writable under the restricted-v2 random UID, so the report + script go to the workspace.
    - name: k6-work
  results:
    - name: perf-passed
      description: '"true" if no latency/error threshold was breached, else "false".'
  steps:
    - name: k6-load-test
      # k6 (Grafana Labs, AGPL-3.0), the container-native load generator. Third-party OSS.
      # Pinned to grafana/k6:latest's multi-arch digest — k6 v2.1.0, verified on-cluster 2026-07-17;
      # honours the K6_WEB_DASHBOARD/_EXPORT flags below. Re-pin with:
      #   oc image info --filter-by-os linux/amd64 -o json docker.io/grafana/k6:latest | jq -r .listDigest
      image: docker.io/grafana/k6@sha256:e7eeddf1ce2361df6920d925297f487c0ba549c44be242c6a9c22f28d9b08efa
      workingDir: $(workspaces.k6-work.path)
      env:
        - name: TARGET_URL
          value: $(params.TARGET_URL)
        - name: VUS
          value: $(params.VUS)
        - name: DURATION
          value: $(params.DURATION)
        - name: P95_THRESHOLD_MS
          value: $(params.P95_THRESHOLD_MS)
        - name: MAX_ERROR_RATE
          value: $(params.MAX_ERROR_RATE)
        - name: FAIL_ON_THRESHOLD
          value: $(params.FAIL_ON_THRESHOLD)
      script: |
        #!/bin/sh
        # grafana/k6 is a minimal Alpine image with busybox /bin/sh and NO bash — the shebang must be sh.
        set -uo pipefail
        echo "▶ k6 load test (perf gate) against ${TARGET_URL}"
        echo "  load: ${VUS} VUs for ${DURATION}   gate: p95<${P95_THRESHOLD_MS}ms, errors<${MAX_ERROR_RATE}"
        export HOME="$(pwd)"
        # The load profile: read-only hits on the claims API + health endpoint — safe, idempotent, and
        # representative of the service's hot path. Thresholds live in options{} so k6's own exit code
        # (non-zero on breach) IS the gate.
        cat > load-test.js <<'EOF'
        import http from 'k6/http';
        import { check, sleep } from 'k6';

        const BASE = __ENV.TARGET_URL;

        export const options = {
          vus: Number(__ENV.VUS) || 10,
          duration: __ENV.DURATION || '30s',
          thresholds: {
            http_req_duration: [`p(95)<${Number(__ENV.P95_THRESHOLD_MS) || 800}`],
            http_req_failed: [`rate<${Number(__ENV.MAX_ERROR_RATE) || 0.01}`],
          },
        };

        export default function () {
          const list = http.get(`${BASE}/api/claims`);
          check(list, { 'GET /api/claims -> 200': (r) => r.status === 200 });

          const health = http.get(`${BASE}/q/health/ready`);
          check(health, { 'GET /q/health/ready -> 200': (r) => r.status === 200 });

          sleep(1);
        }
        EOF
        # k6's built-in web dashboard writes one self-contained HTML report at the end of the run — the
        # "load-test report" artifact (analogous to the ZAP HTML report), saved to the k6-work workspace.
        export K6_WEB_DASHBOARD=true
        export K6_WEB_DASHBOARD_EXPORT=k6-report.html
        k6 run load-test.js
        RC=$?
        # k6 exits 0 when every threshold held, non-zero when a threshold was breached (or on error).
        if [ "$RC" -eq 0 ]; then
          echo "✅ perf gate passed — p95 within ${P95_THRESHOLD_MS}ms budget (report in k6-work)"
          printf 'true' > "$(results.perf-passed.path)"
          exit 0
        fi
        printf 'false' > "$(results.perf-passed.path)"
        if [ "${FAIL_ON_THRESHOLD}" = "false" ]; then
          echo "⚠️  perf thresholds breached (reporting only — FAIL_ON_THRESHOLD=false). Review the k6 summary/report."
          printf 'true' > "$(results.perf-passed.path)"
          exit 0
        fi
        echo "❌ perf gate FAILED — a latency/error threshold was breached under load."
        echo "   fix: profile the hot path (DB round-trips, cold start, a missing index), raise resources,"
        echo "        or re-tune the budget to the cluster, then re-run."
        exit "$RC"

---
# Read grant for the cluster resolver: a pipeline can only resolve a Task it can `get`. This Role
# (get/list/watch tasks in parasol-tasks) is bound to every attendee's -cicd ServiceAccounts below.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: parasol-tasks-reader
  namespace: ogsr-parasol-tasks
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["tasks"]
    verbs: ["get", "list", "watch"]
---
# One binding grants read access to (1) every per-user -cicd SA group — pipelines run there and the
# cluster resolver checks the run's SA can `get` the Task — and (2) the workshop-attendees group, so
# attendees can BROWSE the library (`oc get tasks -n ogsr-parasol-tasks`), which is the pipelines-fundamentals "find/reuse
# tasks" lesson. Same group-subject shape as parasol-images-pull.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: parasol-tasks-readers
  namespace: ogsr-parasol-tasks
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: parasol-tasks-reader
subjects:
{{- range $i := until (int .Values.userCount) }}
{{- $user := printf "%s%d" $.Values.userPrefix (add1 $i) }}
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:serviceaccounts:{{ $user }}-cicd
{{- end }}
  # the attendees themselves, so they can browse the curated library in the console/CLI
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: workshop-attendees
