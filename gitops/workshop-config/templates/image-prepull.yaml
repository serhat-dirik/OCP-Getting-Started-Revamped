{{- /*
  image-prepull — put the workshop's heaviest images on every schedulable node at INSTALL, so no
  attendee pays a cold pull in the middle of an exercise.

  WHAT: one DaemonSet in the shared ogsr-parasol-images namespace. Each image is a container that
  does nothing: the extra images run `true` as init containers and exit, and the pod's one long-lived
  container is parasol-claims running `sleep infinity`. A pod whose containers were created keeps its
  images "in use", so kubelet image GC never evicts them.

  WHY A DAEMONSET OF OUR OWN AND NOT THE CHECLUSTER imagePuller. Turning on
  spec.components.imagePuller makes the Dev Spaces operator subscribe the Kubernetes Image Puller
  operator from the community catalog — a second operator, a catalog this workshop otherwise never
  needs (absent on disconnected or catalog-trimmed clusters), and an edit to a CheCluster that on an
  adopted cluster belongs to the org. It also only pre-pulls for Dev Spaces, while two of the three
  images here are not Dev Spaces images. This is one workshop-owned object in a workshop-owned
  namespace, removed with it by ogsr-uninstall.sh.

  WHAT GETS PULLED, and only when an enabled module needs it (workshop-config.moduleEnabled):
    parasol-claims  always — 18 modules run it, and the shared build here always runs. Main container,
                    so `adm rebuild-images` finds it as a consumer and rolls it onto the new digest.
    UDI, che-code,  devspaces-inner-loop — every image a cold workspace start
    project-clone   pulled (6.9GB; 109s to Running cold on cluster-5vqxc, see values.yaml).
    openshift/tools the seven modules whose entry states run it (multi-tenancy-workload-security first:
                    its lab used to tell attendees to warm it by hand).
    terminal,       whenever the shared cockpit is on — every attendee's terminal pod
    git-cloner      (showroom-shared.yaml) runs them, and a cold start is the attendee's first click.
    spire-agent     trusted-supply-chain — up to 30 attendees start a signer pod on this image in the
                    same minute of exercise 4 (values.yaml imagePrepull.spireAgent).
    8 task images   app-security-testing — every step image of its capstone Pipeline (ZAP alone is
                    1.19GB, sonar-scanner 514MB). The Affinity Assistant puts each attendee's run on
                    whichever node it picks, so a cold node otherwise costs a pull mid-gate. Each digest
                    is COPIED from the Task that runs it (pipelines/tasks/*.yaml + the bundled buildah
                    task); bump both together, or the node caches an image nothing runs. Verified
                    2026-11-12 that all eight run `true` under this pod's securityContext.
  "Schedulable" means what the scheduler means: no tolerations, so a node tainted NoSchedule (the
  batch pool, tainted masters) is skipped — the workloads these images serve cannot land there either.

  Health: Argo reports this DaemonSet Progressing until every node has pulled, so the install's
  workshop-config wait covers the pull. parasol-claims retries (ImagePullBackOff) until its build here
  finishes, ~80s after sync on a measured install.

  ORDERING: sync-wave 6, after every other wave in this chart. Argo starts a wave only once the waves
  before it are Healthy, and this DaemonSet is not Healthy until parasol-claims:1.0 exists — which the
  wave-1 BuildConfig in parasol-images-build.yaml produces. Unwaved (wave 0) it waited for a build that
  could never start: a fresh cluster (2026-11-13) sat at 0/7 pods with 2,300 resources unapplied and
  the install failed at [6/6]. Last also means the cockpits and sign-in accounts land before the pulls.
*/ -}}
{{- define "workshop-config.prepullContainerSpec" -}}
resources:
  requests:
    cpu: 1m
    memory: 8Mi
  limits:
    cpu: 10m
    memory: 32Mi
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
{{- end }}
{{- $udi := false }}
{{- range $slug := list "devspaces-inner-loop" }}
{{- if include "workshop-config.moduleEnabled" (dict "root" $ "slug" $slug) }}{{ $udi = true }}{{ end }}
{{- end }}
{{- $appsec := include "workshop-config.moduleEnabled" (dict "root" $ "slug" "app-security-testing") }}
{{- $tsc := include "workshop-config.moduleEnabled" (dict "root" $ "slug" "trusted-supply-chain") }}
{{- $tools := false }}
{{- range $slug := list "multi-tenancy-workload-security" "deployment-targets-scheduling" "eventing-deep-dive" "networking-dev-devops" "resilience-multicluster-dr" "serverless-zero-to-hero" "service-mesh-advanced-gateways" }}
{{- if include "workshop-config.moduleEnabled" (dict "root" $ "slug" $slug) }}{{ $tools = true }}{{ end }}
{{- end }}
# Pre-pulls the workshop's heavy images onto every schedulable node so first use is a warm start.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ogsr-image-prepull
  namespace: {{ .Values.parasolImages.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  labels:
    app.kubernetes.io/name: ogsr-image-prepull
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ogsr-image-prepull
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ogsr-image-prepull
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 0
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- $term := and .Values.showroom.enabled .Values.showroom.shared.enabled }}
      {{- if or $udi $tools $term $appsec $tsc }}
      initContainers:
      {{- if $udi }}
        - name: udi
          image: {{ .Values.imagePrepull.udi | quote }}
          command: ["true"]
          {{- include "workshop-config.prepullContainerSpec" . | nindent 10 }}
        - name: che-code
          image: {{ .Values.imagePrepull.cheCode | quote }}
          command: ["true"]
          {{- include "workshop-config.prepullContainerSpec" . | nindent 10 }}
        - name: project-clone
          image: {{ .Values.imagePrepull.projectClone | quote }}
          command: ["true"]
          {{- include "workshop-config.prepullContainerSpec" . | nindent 10 }}
      {{- end }}
      {{- if $tools }}
        - name: tools
          # Same reference the labs use, so the node caches it under that exact name.
          image: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest
          command: ["true"]
          {{- include "workshop-config.prepullContainerSpec" . | nindent 10 }}
      {{- end }}
      {{- if $term }}
        - name: terminal
          image: {{ .Values.showroom.images.terminal | quote }}
          command: ["true"]
          {{- include "workshop-config.prepullContainerSpec" . | nindent 10 }}
        - name: git-cloner
          image: {{ .Values.showroom.images.gitCloner | quote }}
          command: ["true"]
          {{- include "workshop-config.prepullContainerSpec" . | nindent 10 }}
      {{- end }}
      {{- if $tsc }}
        - name: spire-agent
          image: {{ .Values.imagePrepull.spireAgent | quote }}
          command: ["true"]
          {{- include "workshop-config.prepullContainerSpec" . | nindent 10 }}
      {{- end }}
      {{- if $appsec }}
      {{- range $name, $image := dict
            "zap-baseline" "ghcr.io/zaproxy/zaproxy:stable@sha256:c558ee87358911ab17278c70991e856f57793e115d9cd0f88ca475cf82907a1a"
            "sonar-scanner" "docker.io/sonarsource/sonar-scanner-cli:12@sha256:23ca0f137965d9dff2198074043fd48d386280bc5d0ccac8c8349cea4cf096a9"
            "trivy" "ghcr.io/aquasecurity/trivy:0.67.0@sha256:de2ab931243c724bc5ea97f22027d5cf38f953dd7e806ad3976a42dc5b0174c4"
            "k6" "docker.io/grafana/k6@sha256:e7eeddf1ce2361df6920d925297f487c0ba549c44be242c6a9c22f28d9b08efa"
            "roxctl" "registry.redhat.io/advanced-cluster-security/rhacs-roxctl-rhel9@sha256:979f329cbe0d0dd1c41e63b471c246294780c5daf029c239ebd7d48129e75a15"
            "openjdk-21" "registry.access.redhat.com/ubi9/openjdk-21@sha256:24dad82bd5d25d9b0c85f0e9c976e47ccce787cc73792355462bf54fe03d9a77"
            "buildah" "registry.redhat.io/rhel9/buildah@sha256:ce2db38cddeedde4489473a689981c532dff4e2e63971d20bb7b3ceca996c18d"
            "ose-cli" "registry.redhat.io/openshift4/ose-cli-rhel9:v4.22@sha256:f8bbc73242af3eae3f8361a9611b29384d3577dba4d5e5b62f4beb2750862c19" }}
        - name: {{ $name }}
          image: {{ $image | quote }}
          command: ["true"]
          {{- include "workshop-config.prepullContainerSpec" $ | nindent 10 }}
      {{- end }}
      {{- end }}
      {{- end }}
      containers:
        - name: parasol-claims
          image: image-registry.openshift-image-registry.svc:5000/{{ .Values.parasolImages.namespace }}/parasol-claims:1.0
          # Workshop-built, rebuilt in place under a mutable tag (entry-states README rule 8).
          imagePullPolicy: Always
          command: ["sleep", "infinity"]
          {{- include "workshop-config.prepullContainerSpec" . | nindent 10 }}
