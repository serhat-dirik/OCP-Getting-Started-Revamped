# Modest per-namespace quota + container defaults so ~N attendees fit one cluster (tune later).
{{- $suffixes := list "dev" "stage" "prod" "cicd" }}
{{- range $i := until (int .Values.userCount) }}
{{- $user := printf "%s%d" $.Values.userPrefix (add $i 1) }}
{{- range $suffix := $suffixes }}
---
# Caps total compute/PVCs/pods a user can request per namespace.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workshop-quota
  namespace: {{ $user }}-{{ $suffix }}
  labels:
    workshop.redhat.com/user: {{ $user | quote }}
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 6Gi
    # RAISED 6 -> 8 on 2026-08-13, together with the LimitRange cpu default below; the two must move
    # together and neither works alone. A step ceiling of D costs 3xD in a 3-step pod, and
    # `sast-sonar` is exactly that: measured peak 5550m of 6000m at a 1500m default, so 6 left no
    # margin, and a 2000m default would need exactly 6000m — leaving ZERO headroom for anything
    # else in the namespace, which is why 6 had to move even though 6000m of 6000m would itself
    # have been admitted.
    #
    # CORRECTION 2026-08-14: this comment used to say such a request would "never be admitted at
    # all". That is wrong, and it was measured wrong: a quota refuses only when used + requested
    # EXCEEDS hard, so equal-to-hard is admitted. Proven by rolling deployment-targets-scheduling
    # at exactly 1675m per replica — peak 1300m + 4 x 1675m = 8000m of 8000m — which succeeded
    # rc 0. The decision to raise the ceiling stands; the reason given for it did not.
    # This is a CEILING, not a reservation — requests.cpu stays at 3 and defaultRequest stays 100m,
    # so nothing extra is scheduled and cluster capacity is untouched until a pipeline actually
    # bursts. Measured headroom at the time of the change: 93 allocatable cores across 6 nodes;
    # eight attendees all running the capstone at once burst to roughly 36.
    limits.cpu: "8"
    limits.memory: 12Gi
    # Headroom for pipeline-heavy modules: app-security-testing's designed fix loop is six
    # sequential PipelineRuns, each holding a workspace PVC until that run is deleted (Tekton's
    # pruner is daily). 5 walled off the module's own final re-run in one sitting (G4 re-drill R1).
    persistentvolumeclaims: "10"
    pods: "30"
---
# Default container requests/limits so bare pods don't consume the whole quota unbounded.
apiVersion: v1
kind: LimitRange
metadata:
  name: workshop-limits
  namespace: {{ $user }}-{{ $suffix }}
  labels:
    workshop.redhat.com/user: {{ $user | quote }}
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        # 500m -> 1500m, 2026-08-13. THIS ONE LINE IS THE WHOLE PIPELINE-SPEED FIX: the capstone
        # went 1414s -> 821s (23m34s -> 13m41s) with nothing else changed, verified by a run whose
        # every step container carried limits.cpu 1500m.
        #
        # Memory was tuned for these steps long ago; CPU never was, so every Maven, Quarkus and ZAP
        # step ran pegged at half a core — `oc adm top pod` showed a flat 499m for an entire compile,
        # and Maven reported "Total time: 01:38" to compile FIVE source files. Quarkus's first boot
        # took 229s here against 55s at four cores.
        #
        # It has to live in the LimitRange and nowhere else. `PipelineTask` has no
        # `computeResources` field (oc explain, Pipelines 1.23.1), and the lab drives runs from the
        # console *Actions -> Start* form, which cannot set taskRunSpecs — so a per-run override
        # reaches neither path. Only the namespace default reaches every run.
        #
        # DO NOT "optimise" this back by adding a Maven dependency cache instead. Measured
        # 2026-08-13 across 500m/1000m/2000m/4000m: warm repo is within noise of cold at EVERY
        # level, so the download was never the cost. A cache was also tried end to end (source and
        # maven-cache on one pipeline workspace at different subPaths — admissible, no Affinity
        # Assistant problem) and moved unit-test 491s -> 497s: what the skipped download saves,
        # writing 154MB through the PVC gives back.
        #
        # Raising this REQUIRES the quota above at 8 — see the note there.
        cpu: 1500m
        # The -cicd namespace runs Tekton image builds (Maven + buildah on a Quarkus app), which need
        # more than the 1Gi app-namespace default or they OOMKill mid-build. Sizing the namespace
        # DEFAULT here — instead of per-PipelineRun taskRunSpecs — is what lets attendees run a pipeline
        # straight from the console *Actions -> Start* form (which cannot set per-task memory) and from a
        # plain `tkn pipeline start` / PaC push. pipelines-fundamentals/trusted-supply-chain/app-security-testing all build in -cicd. Fits the 12Gi limits
        # quota for one serial run. Other suffixes (app runtimes) keep the modest 1Gi default.
        memory: {{ if eq $suffix "cicd" }}2Gi{{ else }}1Gi{{ end }}
      defaultRequest:
        cpu: 100m
        memory: 256Mi
{{- end }}
{{- end }}
