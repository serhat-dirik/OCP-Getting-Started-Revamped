{{- /*
  student-gitops — the SECOND Argo CD instance (ADR-0002), the one ATTENDEES write to.

  WHY A SEPARATE INSTANCE (not per-user AppProjects on the platform instance): a student RBAC slip
  must not be able to touch the entry-state machinery. The operator's cluster-config namespace is
  ONLY openshift-gitops (verified live), so this instance is NAMESPACE-SCOPED — it can deploy only
  into namespaces explicitly granted to it (the argocd.argoproj.io/managed-by label on {user}-dev/
  stage/prod, set in per-user-namespaces.yaml). That is the split failure domain ADR-0002 wants.

  NO spec.sourceNamespaces (ADR-0002 amendment 1, option B, ratified 2026-07-10): the 1.21.1
  operator REFUSES sourceNamespaces on a namespace-scoped instance (verified live four ways — it
  reverts the cmd-params application.namespaces in ~15s). So attendee Application CRs live in THIS
  namespace (ogsr-student-gitops, the instance's own control plane, managed natively — no source config),
  isolated per-user by the Argo RBAC below (proj-{user} scoped) + the per-user AppProjects
  (student-appprojects.yaml) that box each app's DESTINATIONS to {user}-dev/stage/prod. Cluster-
  scoping the instance to unlock sourceNamespaces (option A) was rejected — it would gut this ADR's
  primary promise (a student slip cannot reach the platform machinery).

  WHY IN THE WORKSHOP LAYER (not per-user entry state): it is shared + persistent and must survive
  `ws reset` (PM decision 2026-07-09). Shape copied from the live openshift-gitops CR: Dex +
  openShiftOAuth (sso.keycloak is Removed in the CRD), edge route, annotation tracking.
*/ -}}
{{- /* One literal for the Route host: server.host, the dex redirectURI and the OAuthClient all use it. */ -}}
{{- $argoHost := printf "student-gitops-server-student-gitops.%s" .Values.clusterDomain }}
{{- $dexClientId := "ogsr-student-gitops-dex" }}
{{- $dexSecretName := "student-gitops-dex-oauth-client" }}
apiVersion: v1
kind: Namespace
metadata:
  # SSOT: .Values.studentArgoNamespace (also consumed below and by per-user-namespaces.yaml's
  # managed-by label + the gitops-fundamentals/gitops-at-scale entry states) — one value, never a
  # second literal to drift out of sync (SEV1 2026-07-18: per-user-namespaces.yaml had its own copy
  # of this string and it went stale during the ogsr- rename).
  name: {{ .Values.studentArgoNamespace }}
  labels:
    workshop.redhat.com/layer: workshop-config
    workshop.redhat.com/shared: "true"
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
---
# The attendee-writable Argo CD instance. Login = OpenShift OAuth via Dex (same mechanism the
# default instance proves). Per-user RBAC below scopes each OpenShift user to their own project.
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  # Instance name stays 'student-gitops' (NOT prefixed) on purpose: it drives the Route NAME
  # (student-gitops-server) and — with the spec.server.host pin below — the Route HOST, both of
  # which must stay identical through the ogsr- namespace rename (attendee-facing URL invariant).
  name: student-gitops
  namespace: {{ .Values.studentArgoNamespace }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
spec:
  # OpenShift OAuth login through Dex.
  sso:
    provider: dex
    dex:
      {{- if .Values.clusterDomain }}
      # WHY NOT openShiftOAuth: true. That signs in through the dex ServiceAccount as OAuth client, and
      # SA clients follow the cluster's grantConfig.serviceAccountMethod (prompt) — the "Authorize
      # Access" page. The cockpit embeds this UI in an iframe and oauth-openshift cannot render in a
      # frame, so an attendee's first visit was a blank tab. This is the operator's own generated
      # connector (argocd-operator getOpenShiftDexConfig, read off argocd-cm on GitOps 1.22.3) with ONE
      # change: a real OAuthClient with grantMethod: auto (created by the hook Job below). Same
      # connector type → same preferred_username/groups claims → the RBAC policy below is unchanged.
      config: |
        connectors:
          - type: openshift
            id: openshift
            name: OpenShift
            config:
              issuer: https://kubernetes.default.svc
              clientID: {{ $dexClientId }}
              clientSecret: ${{ $dexSecretName }}:clientSecret
              redirectURI: https://{{ $argoHost }}/api/dex/callback
              insecureCA: true
              groups: []
      {{- else }}
      # No clusterDomain (local render / BYO): the Route host is operator-derived and unknown here, so
      # keep the operator's SA-client connector (shows the approval page once per attendee).
      openShiftOAuth: true
      {{- end }}
      resources:
        requests:
          cpu: 250m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
  # gitops-at-scale beat 1 (Argo CD 3.4 ships NO ApplicationSet UI — 3.5+ only, read-only even there): attendees
  # create their ApplicationSet via the Argo API/CLI. Dex SSO login needs a browser (dead end in a
  # Showroom terminal), so each attendee also gets a LOCAL Argo account whose name == their SSO
  # username, so the RBAC policy below (g, {user}, role:{user}) matches BOTH identities. extraConfig
  # merges accounts.{user}: login into argocd-cm (the operator's native localUsers field only issues
  # API tokens, no password); the shared-password bcrypt is written to argocd-secret by the
  # student-argo-accounts Job (the operator's reconcileExistingArgoSecret preserves custom secret keys
  # — verified live 2026-07-11). Dex SSO users are unaffected (this only ADDS local accounts).
  extraConfig:
    {{- range $i := until (int .Values.userCount) }}
    {{- $u := printf "%s%d" $.Values.userPrefix (add1 $i) }}
    "accounts.{{ $u }}": login
    {{- end }}
  # Per-user isolation. Each OpenShift user maps to a role that can manage ONLY their proj-{user}
  # applications; a non-matching identity gets nothing (defaultPolicy empty). scopes must include
  # preferred_username so `g, {user}, ...` matches the OpenShift username claim from Dex. Proven live:
  # `argocd admin settings rbac can` — userN may sync own proj-userN apps, is denied on proj-userM.
  rbac:
    scopes: '[groups, preferred_username]'
    defaultPolicy: ''
    policy: |
      {{- $lines := list "g, system:cluster-admins, role:admin" "g, admin, role:admin" }}
      {{- range $i := until (int .Values.userCount) }}
      {{- $u := printf "%s%d" $.Values.userPrefix (add1 $i) }}
      {{- $lines = append $lines (printf "p, role:%s, applications, get, proj-%s/*, allow" $u $u) }}
      {{- $lines = append $lines (printf "p, role:%s, applications, create, proj-%s/*, allow" $u $u) }}
      {{- $lines = append $lines (printf "p, role:%s, applications, update, proj-%s/*, allow" $u $u) }}
      {{- $lines = append $lines (printf "p, role:%s, applications, delete, proj-%s/*, allow" $u $u) }}
      {{- $lines = append $lines (printf "p, role:%s, applications, sync, proj-%s/*, allow" $u $u) }}
      {{- $lines = append $lines (printf "p, role:%s, applications, override, proj-%s/*, allow" $u $u) }}
      {{- $lines = append $lines (printf "p, role:%s, applications, action/*, proj-%s/*, allow" $u $u) }}
      {{- $lines = append $lines (printf "p, role:%s, logs, get, proj-%s/*, allow" $u $u) }}
      {{- /* gitops-at-scale beat 1: attendee creates ONE ApplicationSet (env generator) in their own project. */ -}}
      {{- $lines = append $lines (printf "p, role:%s, applicationsets, get, proj-%s/*, allow" $u $u) }}
      {{- $lines = append $lines (printf "p, role:%s, applicationsets, create, proj-%s/*, allow" $u $u) }}
      {{- $lines = append $lines (printf "p, role:%s, applicationsets, update, proj-%s/*, allow" $u $u) }}
      {{- $lines = append $lines (printf "p, role:%s, applicationsets, delete, proj-%s/*, allow" $u $u) }}
      {{- $lines = append $lines (printf "p, role:%s, appprojects, get, proj-%s, allow" $u $u) }}
      {{- $lines = append $lines (printf "g, %s, role:%s" $u $u) }}
      {{- end }}
      {{ join "\n" $lines | indent 6 | trim }}
  # Same resource-tracking + external route shape as the platform instance (live-verified). annotation
  # tracking also stamps deployed workloads with argocd.argoproj.io/tracking-id (verify asserts it).
  resourceTrackingMethod: annotation
  # Watch only what student apps deploy (values.yaml studentArgo.resourceInclusions has the why and
  # the guard). The operator's default resource.exclusions still apply on top.
  resourceInclusions: |
    {{- toYaml .Values.studentArgo.resourceInclusions | nindent 4 }}
  server:
    insecure: true
    # gitops-at-scale beats send attendees to the Argo CD Rollout view four times, which only
    # exists via the Argo Rollouts UI extension. enableRolloutsUI is the operator's OWN field for this
    # (verified live against the argocds.argoproj.io v1beta1 CRD on GitOps 1.21.1: it adds an
    # initContainer that populates /tmp/extensions from the operator-pinned, digest-locked
    # ARGOCD_EXTENSION_IMAGE and sets ARGOCD_SERVER_ENABLE_PROXY_EXTENSION — no hand-rolled
    # initContainer/volume/env needed, no separate version to pin here since the image is locked to
    # the GitOps operator CSV already tracked in versions.yaml). Only this (workshop-owned) instance
    # is touched; openshift-gitops (the platform instance) is untouched.
    #
    # IT DOES NOT ACTUALLY RENDER YET, and this line is set anyway — read before you assume M11's
    # Rollout view works. Live-tested 2026-07-31 on csv v1.21.1: the field DOES do its half (the
    # initContainer runs, /tmp/extensions is populated), but argocd-server serves the assets at NO
    # reachable URL — tried the ticket-assumed .../resources/argo-rollouts/ui/extensions.js, the
    # literal on-disk path .../resources/extension-Rollout.js/extensions-Rollout.js, and the
    # <group>/<kind> convention from argoproj/argo-cd#7454. All 404, through the Route AND through
    # localhost:8080 inside the pod (so it is not the router), with no extension-registration line in
    # any log. The extracted directory is named `extension-Rollout.js` rather than the <group>/<kind>
    # layout the server appears to expect — this looks like a packaging gap in the downstream
    # argocd-extensions-rhel9 image for this CSV, not something config can fix.
    #
    # Kept set because it is the operator's supported mechanism, it costs one server restart at
    # install, and the view starts working with no code change if a later CSV fixes the image. The
    # module's beats are meanwhile staged on CLI output, which is what actually teaches today.
    # Do NOT "fix" this by hand-rolling an initContainer/volume/env — that is rule 7 (GitOps-only)
    # and it would also mask the upstream bug rather than surface it.
    enableRolloutsUI: true
    # Route-host invariant (ogsr- rename): pin the server Route host to its OLD value so the
    # attendee-facing Argo URL does NOT change when the namespace moves to ogsr-student-gitops.
    # The operator otherwise derives the host from <instance>-server-<namespace>, which would
    # become student-gitops-server-ogsr-student-gitops.<domain>. Omitted when clusterDomain is
    # empty (local `helm template` / BYO cluster) so the operator just defaults the host there.
    {{- if .Values.clusterDomain }}
    host: {{ $argoHost }}
    {{- end }}
    route:
      enabled: true
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
    resources:
      requests:
        cpu: 125m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  controller:
    # appSync 90s so drift/self-heal reverts feel responsive in the gitops-fundamentals lab (default
    # 180s measured as a ~190s wait).
    appSync: 90s
    # Memory is sized from the cohort (values.yaml studentArgo.controller, INSTALL.md "Sizing"). Each
    # kubectl op of a sync holds short-lived heap, so cap how many run at once (operator default 10)
    # and let the Go GC reclaim that garbage before the cgroup limit instead of at 2x live heap.
    {{- $c := .Values.studentArgo.controller }}
    {{- $limMi := add $c.baseMi (mul $c.perUserMi (int .Values.userCount)) }}
    parallelismLimit: {{ $c.parallelismLimit }}
    env:
      - name: GOMEMLIMIT
        value: {{ printf "%dMiB" (div (mul $limMi 9) 10) | quote }}
    resources:
      requests:
        cpu: 250m
        memory: {{ div $limMi 2 }}Mi
      limits:
        cpu: "1"
        memory: {{ $limMi }}Mi
  repo:
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  redis:
    resources:
      requests:
        cpu: 125m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
  # ApplicationSet controller — gitops-at-scale beat 1 (convert dev/stage/prod to ONE ApplicationSet). Off by
  # default on operator-provisioned instances (verified live 2026-07-11: no applicationset-controller
  # in student-gitops until this block exists). One shared controller per instance (~1 pod), watches
  # ApplicationSets in THIS namespace and generates the per-env Application CRs. gitops-fundamentals does not use it;
  # the block is additive (adding it did not disturb the live gitops-fundamentals apps).
  applicationSet:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
{{- if .Values.clusterDomain }}
---
# ── DEX OAUTH CLIENT BOOTSTRAP (SA + RBAC + Sync hook) ───────────────────────────────────────────
# The OAuthClient the dex connector above signs in with: grantMethod auto, so no "Authorize Access"
# page (frames cannot show it). A hook, not a declared object, for the reason showroom-shared.yaml's
# own client bootstrap gives: the client needs a secret, a secret in the chart is a secret in git, and
# randAlphaNum would change on every Argo render. So it is minted in-cluster ONCE; the Secret is the
# source of truth and the OAuthClient converges to it on every sync. Owner-labelled, so
# bootstrap/ogsr-uninstall.sh's oauthclient sweep removes it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: student-gitops-dex-oauth-bootstrap
  namespace: {{ .Values.studentArgoNamespace }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
---
# why: converge exactly ONE cluster-scoped OAuthClient, by name (create cannot be name-scoped).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ogsr-student-gitops-dex-oauth-bootstrap
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
rules:
  - apiGroups: ["oauth.openshift.io"]
    resources: ["oauthclients"]
    verbs: ["get", "patch"]
    resourceNames: [{{ $dexClientId | quote }}]
  - apiGroups: ["oauth.openshift.io"]
    resources: ["oauthclients"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ogsr-student-gitops-dex-oauth-bootstrap
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ogsr-student-gitops-dex-oauth-bootstrap
subjects:
  - kind: ServiceAccount
    name: student-gitops-dex-oauth-bootstrap
    namespace: {{ .Values.studentArgoNamespace }}
---
# why: read/create the ONE Secret holding the client secret; no list, no delete (cannot rotate it).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: student-gitops-dex-oauth-bootstrap
  namespace: {{ .Values.studentArgoNamespace }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: [{{ $dexSecretName | quote }}]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: student-gitops-dex-oauth-bootstrap
  namespace: {{ .Values.studentArgoNamespace }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: student-gitops-dex-oauth-bootstrap
subjects:
  - kind: ServiceAccount
    name: student-gitops-dex-oauth-bootstrap
    namespace: {{ .Values.studentArgoNamespace }}
---
# Sync hook, wave 1: after the wave-0 namespace + RBAC + ArgoCD CR. If dex starts first it holds an
# unresolved $secret reference for a few seconds; a new part-of=argocd Secret makes argocd-dex re-render
# its config and restart dex (probed live 2026-11-12: "Notifying 1 settings subscribers" in the dex
# log seconds after one appeared). BeforeHookCreation → re-converges every sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: student-gitops-dex-oauth-bootstrap
  namespace: {{ .Values.studentArgoNamespace }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: student-gitops-dex-oauth-bootstrap
    spec:
      serviceAccountName: student-gitops-dex-oauth-bootstrap
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22@sha256:f8bbc73242af3eae3f8361a9611b29384d3577dba4d5e5b62f4beb2750862c19
          # `oc` OOMs at 256Mi (repo-wide hard-won fact), hence the 512Mi limit.
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: 250m, memory: 512Mi}
          env:
            - name: NS
              value: {{ .Values.studentArgoNamespace | quote }}
            - name: SECRET_NAME
              value: {{ $dexSecretName | quote }}
            - name: CLIENT_ID
              value: {{ $dexClientId | quote }}
            - name: REDIRECT_URI
              value: "https://{{ $argoHost }}/api/dex/callback"
          volumeMounts:
            # Memory-backed: the plaintext secret never reaches a disk.
            - name: scratch
              mountPath: /scratch
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              umask 077
              T="$(mktemp -d /scratch/dex.XXXXXXXX)"
              trap 'rm -rf "$T"' EXIT
              # NOTHING here prints the client secret: it lives in $T files and the two API objects.
              # The Secret is minted only on a PROVEN NotFound (any other read error is fatal, never
              # "absent"), and with `oc create`, so a lost race fails and retries instead of rotating.
              if oc get secret "$SECRET_NAME" -n "$NS" -o jsonpath='{.data.clientSecret}' > "$T/b64" 2>"$T/err"; then
                if [[ ! -s "$T/b64" ]]; then
                  echo "❌ ${NS}/${SECRET_NAME} has no clientSecret key. fix: oc delete secret ${SECRET_NAME} -n ${NS}, then re-sync workshop-config" >&2
                  exit 1
                fi
                base64 -d < "$T/b64" > "$T/cs"
                echo "✅ reusing ${NS}/${SECRET_NAME}"
              elif grep -qiE 'notfound|not found' "$T/err"; then
                head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$T/cs"
                {
                  echo 'apiVersion: v1'
                  echo 'kind: Secret'
                  echo 'metadata:'
                  echo "  name: ${SECRET_NAME}"
                  echo "  namespace: ${NS}"
                  echo '  labels:'
                  # Argo CD resolves a $<secret>:<key> reference only from Secrets with this label.
                  echo '    app.kubernetes.io/part-of: argocd'
                  echo '    workshop.redhat.com/layer: workshop-config'
                  echo '    workshop.redhat.com/owner: ogsr'
                  echo 'type: Opaque'
                  echo 'data:'
                  echo "  clientSecret: $(base64 < "$T/cs" | tr -d '\n')"
                } > "$T/secret.yaml"
                oc create -f "$T/secret.yaml" >/dev/null
                echo "✅ created ${NS}/${SECRET_NAME} (value not printed)"
              else
                echo "❌ cannot read ${NS}/${SECRET_NAME}: $(tr '\n' ' ' < "$T/err")" >&2
                exit 1
              fi
              {
                echo 'apiVersion: oauth.openshift.io/v1'
                echo 'kind: OAuthClient'
                echo 'metadata:'
                echo "  name: ${CLIENT_ID}"
                echo '  labels:'
                echo '    workshop.redhat.com/layer: workshop-config'
                echo '    workshop.redhat.com/owner: ogsr'
                # auto = no "Authorize Access" page, which a frame (the cockpit tab) cannot show.
                echo 'grantMethod: auto'
                echo 'redirectURIs:'
                echo "  - ${REDIRECT_URI}"
                echo "secret: $(<"$T/cs")"
              } > "$T/client.yaml"
              # --patch-file / create -f, never -p or apply: the body carries the secret, and an argv or
              # a last-applied annotation would be a second copy of it.
              if oc get oauthclients.oauth.openshift.io "$CLIENT_ID" >/dev/null 2>&1; then
                oc patch oauthclients.oauth.openshift.io "$CLIENT_ID" --type=merge --patch-file "$T/client.yaml" >/dev/null
              else
                oc create -f "$T/client.yaml" >/dev/null
              fi
              LIVE_H="$(oc get oauthclients.oauth.openshift.io "$CLIENT_ID" -o jsonpath='{.secret}' | sha256sum)"
              FILE_H="$(sha256sum < "$T/cs")"
              if [[ "$LIVE_H" != "$FILE_H" ]]; then
                echo "❌ OAuthClient/${CLIENT_ID}.secret does not match ${NS}/${SECRET_NAME} — every Argo CD login would fail" >&2
                exit 1
              fi
              echo "✅ OAuthClient/${CLIENT_ID}: grantMethod auto, redirect ${REDIRECT_URI}, secret matches (sha256, not printed)"
      volumes:
        - name: scratch
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
{{- end }}
