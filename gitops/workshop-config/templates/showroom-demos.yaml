{{- /*
  SA-Demos cockpit — ONE shared presenter cockpit serving the DEMO rendering (site-demo.yml
  equivalent — see showroom/site-demo.yml), so an SA can run a customer/exec demo straight from a
  browser tab using the Say/Show/Do talk track instead of stitching module pages together by hand.
  Owner direction 2026-07-11 (docs/sa-provisioning-guide.md "Demo paths"); this is the plumbing
  half — content (demo-path composition pages, the Quick-Access/Troubleshooting pages queued in
  06-BACKLOG "SA-Demos showroom") lands separately.

  NOT modeled 1:1 on showroom.yaml — it is genuinely a different kind of object (one shared
  instance vs. one Deployment per attendee), so three things deliberately diverge. Each is a
  design call made while implementing this template; flagged here for review, not silently
  decided:

  1. A TERMINAL THAT STARTS LOGGED OUT. Revised 2026-08-12 (owner); the original decision and why
     it changed are both recorded here, because the reasoning is what generalizes.

     ORIGINALLY: no terminal at all. showroom.yaml's terminal does not just run a shell — it
     PRE-AUTHENTICATES as a SPECIFIC attendee ({user}), via an init container that reads the shared
     workshop password from a cross-namespace Secret and runs `oc login`. A shared presenter cockpit
     has no attendee identity to borrow: picking any one real user would be misleading (this cockpit
     is not "logged in as" that person) and would break silently when that user's session is reset.
     Rejecting the borrowed identity meant rejecting the terminal, and that bought a real property —
     the ServiceAccount, the cross-namespace Role, the home PVC and the login step ALL existed only
     to serve the auto-login, so dropping it left this template inventing ZERO new RBAC.

     WHAT CHANGED: "start logged out and let the SA authenticate as themselves" was never the option
     that got rejected — auto-login-as-a-borrowed-attendee was. The logged-out shell beats it on
     every count the original decision cared about: no borrowed identity, no coupling to any
     attendee's session, and it STILL invents zero new RBAC, because we are not reading any
     credential. Auto-login, not the terminal, was the expensive part.

     THE CONSTRAINT THIS DESIGN IS BUILT TO (owner, 2026-08-12): "we don't want to run admin logged
     in terminal." An SA presenting will log in with real authority — often cluster-admin — and this
     Route is edge-TLS with no authentication in front of it, exactly like the attendee cockpits.
     That posture is fine when the identity behind it is a low-privilege attendee and NOT fine for a
     durable admin shell on a guessable URL. So three properties are load-bearing, not stylistic:

       a) NO CREDENTIAL APPEARS ANYWHERE IN THIS TEMPLATE, and nothing in it authenticates. No
          Secret is read, no Secret is even mounted, no token, no password. terminal-prep's only
          executable statements are `mkdir` and one file write — verified by stripping comments
          and echo payloads from the rendered args, because the string `oc login` DOES appear in
          this file and a naive grep for it reports a false positive: it is banner text telling
          the SA to run one, never a command we run. The terminal CANNOT come up already-admin,
          because nothing here knows how to authenticate. That is a structural guarantee, not a
          convention someone has to keep.
          (The banner does run `oc whoami` at SHELL time — a read of whatever kubeconfig the SA
          has, so it prints nothing until they log in. It exists so the identity in play is on
          screen rather than assumed, which is the same reason the rest of this design exists.)
       b) THE HOME IS AN emptyDir, NOT A PVC. Whatever kubeconfig the SA creates lives only in the
          pod, so `oc delete pod -l app.kubernetes.io/instance=showroom-demos -n <ns>` is a logout
          button, and any restart is an implicit logout. A PVC would make a session survive
          restarts indefinitely.

          READ THE LIMIT OF THIS HONESTLY — it was overstated here until an adversarial review
          measured it (2026-08-12). emptyDir bounds the credential's LIFETIME. It does NOT bound
          its AUDIENCE. Measured from outside the cluster with no credentials: GET /tty-top/
          returns 200 with the full ttyd page and POST /tty-top/token returns {"token": ""} — the
          image runs `ttyd … -W /usr/bin/bash` with no `-c`, so there is no authentication and
          sessions are not exclusive. A second visitor gets a second bash in THIS container with
          THIS $HOME. So while a login lives, it is held by anyone who has the URL.

          That exposure is NOT new and NOT specific to this cockpit: showroom-{user}'s /tty-top/
          answers 200 to the same unauthenticated request. It is the accepted posture for
          ephemeral RHDP clusters — accepted because the identity behind an attendee cockpit is a
          low-privilege attendee. What this template must therefore never do is invite a HIGHER
          identity into the same shape. The banner originally said "Copy login command … paste the
          oc login --token= line here", which is precisely an invitation to park cluster-admin
          behind an open shell, and directly contradicts the owner constraint quoted above. It now
          directs the SA to an attendee login and states the exposure in the first screenful.

          A banner is guidance, not a control — this project's own m26 beat 3 is an argument that a
          sentence forbidding something is not a control. The real control is authentication in
          front of the Route (an oauth-proxy, or ttyd's `-c`), and both cost the zero-new-RBAC
          property above. That is a posture trade for the owner, not a call to make at 3am; it is
          filed as the SEV1 "SA-Demos terminal is an unauthenticated shell" task. Until it is
          decided, the honest position is: same exposure as every attendee cockpit, attendee
          identity only, and the limitation written where a presenter will read it.
       c) automountServiceAccountToken: false. Without it the logged-out state still hands a shell
          the `default` SA token. Low-privilege, but "logged out" should mean powerless, and the
          pod genuinely makes no API calls of its own.

     The opening banner (terminal-prep below) tells the SA to log in and tells them the session is
     ephemeral, so the expected first step is on screen rather than a bare `$`.
  2. REPLICAS = 1, same as every per-attendee showroom. It's a single presentation aid viewed by
     one presenter (or a few people on one screen-share) at a time, not a fan-out workload — no
     argument for more, and `Recreate` avoids two pods mid-rebuild serving inconsistent content.
  3. NAMES: Deployment/Service/Route/ConfigMaps are all `showroom-demos` (proxy/userdata
     ConfigMaps suffixed accordingly) — parallel to `showroom-{user}` but without a user segment,
     since there isn't one. Route host `showroom-demos.<domain>` follows the same pattern.

  Deliberately NOT sharing objects with showroom.yaml (own Namespace declaration, own nginx
  ConfigMap, own userdata ConfigMap) even though both usually land in the same namespace: this
  template must produce a working cockpit on its own if someone sets showroomDemos.enabled=true
  with showroom.enabled=false (e.g. a demo-only PoC cluster, no attendee cohort at all). The
  Namespace declaration is safe to duplicate when both render into the same namespace (byte-
  identical objects; Argo/kubectl apply it twice, no drift) — see 01-ARCHITECTURE §4.0.5 (PoC mode
  is first-class) for why self-containment wins over avoiding that cosmetic overlap.

  DOES share showroom.images / showroom.nookbagBundle (same physical images doing the same job —
  duplicating those into a second values block would just be a second place to forget to bump).

  Serving pipeline (per pod, one pod total): init content-clone (mirror → /showroom/repo) → init
  antora-build (showroom/site-demo.yml → /showroom/www, cockpit-level attributes injected, NO
  per-user attributes — see the userdata ConfigMap below) → init terminal-prep (writes the shell
  banner; NO login, see point 1). Runtime containers: nginx (8080 proxy: / → content, /tty-top →
  ttyd) + content (nookbag UI over /showroom/www, :8000) + terminal (ttyd :7681, logged out).
  The Route carries 1h HAProxy timeout/timeout-tunnel annotations for that websocket.
*/ -}}
{{- /*
  ONE SOURCE FOR THIS COCKPIT'S ATTRIBUTES — the ConfigMap's payload and the Deployment's
  checksum/user-data annotation are the same bytes. Same shape, same reasoning and the same
  self-reference problem as showroom.yaml's workshop-config.showroomUserData (read that one's header
  for the full account); this cockpit needs its own template because its payload is genuinely a
  different document — cluster-wide keys only, no `user`/`page-user`, no module-hidden attributes.

  It matters MORE here, not less, despite being one pod. This cockpit's own history is the argument:
  it did not emit maas_model/maas_endpoint at all until 2026-08-07, so an SA demoing the AI track
  read the literal sentinel off their own screen in front of a customer. Wiring the value without
  wiring the restart would have left exactly that failure standing for one more pod lifetime.
*/ -}}
{{- /* A VISIBLE PLACEHOLDER, NOT AN OMISSION — reversed 2026-08-07 after an SSA rehearsing a
           customer demo found this cockpit rendering `NS=user1-ai` into commands they were about
           to paste.

           This file used to state that omitting `user` was safe because {user} "falls back to
           antora.yml's safe user1@ default". The fallback is real; "safe" was an assumption, and
           it is wrong. `user1` is a LIVE ATTENDEE SLOT on any installed cluster, so the demo guide
           was handing a presenter another person's namespace. 102 pages reference {user}, and 17
           demo arcs mix it with $NS shell vars inside a single beat — one M25 beat grants a Role
           in user1-dev while patching an MCP server in the presenter's own namespace. Silent,
           mid-demo, and it reads to the room as "the AI didn't work".

           The header's reasoning still holds: this cockpit has no attendee identity, and naming a
           real one would be a lie about who is logged in. So it names a NON-identity instead.
           `your-user` is not a valid username and renders as itself — `NS=your-user-ai` stops a
           presenter mid-paste, which is the entire job. Unset would have been worse than either:
           the greeting renders with an empty subject rather than an obvious placeholder.

           NOT angle-bracketed, and that is not a style choice: Asciidoctor emits angle brackets
           unescaped inside <code>, the browser parses them as an unknown element and drops them,
           and the reader gets a sentence with a hole where the placeholder was. That exact
           mistake cost this project a SEV1 on the model name.

           A TEMPLATE comment, not a `#` one, for the reason showroom.yaml documents: a `#`
           comment lands in every rendered ConfigMap, so anyone grepping the LIVE object for
           `user1` would get hits off this explanation and conclude the bug is still there. */ -}}
{{- define "workshop-config.showroomDemosUserData" }}
    user: your-user
    page-user: your-user
    cluster_domain: {{ .domain }}
    ocp_console_url: https://console-openshift-console.{{ .domain }}
    gitea_url: https://{{ .giteaHost }}
    devspaces_url: https://devspaces.{{ .domain }}
    # Tool-console URLs. MEASURED MISSING on the live demos cockpit 2026-08-12 (SA demo dry-run):
    # a presenter reading developer-hub-golden-paths, gitops-at-scale, app-modernization,
    # app-security-testing or registry-images-catalog-governance saw `apps.example.com` links —
    # including inside a runnable `curl` — because antora.yml's soft default won wherever this
    # ConfigMap stayed silent.
    #
    # Three of these five were already in showroom.yaml and simply never copied here; two
    # (rhdh_url, student_argo_url) were missing from BOTH cockpits, so attendees saw the placeholder
    # too. That is the third repeat of one defect — showroom.yaml's own comment records the
    # 2026-07-31 instance that "killed the Console tab of exercises 2 and 4 ... on every attendee,
    # silently". It keeps recurring because two files must move together and nothing checks that
    # they did. The durable fix is a gate asserting every attribute content references is emitted by
    # every cockpit; until that exists, these two blocks must be diffed by hand whenever either
    # changes.
    #
    # Hostnames are grounded, not guessed: they are the same URLs this file's own tool tabs already
    # point at, and those tabs work.
    rhdh_url: https://backstage-developer-hub-rhdh.{{ .domain }}
    student_argo_url: https://student-gitops-server-student-gitops.{{ .domain }}
    sonarqube_url: https://sonarqube-sonarqube.{{ .domain }}
    acs_console_url: https://central-stackrox.{{ .domain }}
    mta_url: https://mta-openshift-mta.{{ .domain }}
    {{- /* The cluster's LIVE OpenShift release — same value, same reasoning as showroom.yaml's copy
           (see the long note there): BARE, no `@`, because this ConfigMap merges into the component
           descriptor and must outrank showroom/site-demo.yml's `set-from-cluster@` soft default.
           Omitted, never blanked, when install.sh could not read clusterversion. Shares
           .Values.showroom.ocpVersion rather than owning a showroomDemos copy — one cluster, one
           release, exactly like showroom.images (see this file's header). */ -}}
    {{- if .root.Values.showroom.ocpVersion }}
    cluster_ocp_version: {{ .root.Values.showroom.ocpVersion | quote }}
    {{- end }}
    {{- /* The MaaS model and endpoint, shared from the same values as the attendee cockpit for the
           same one-cluster reason. This cockpit serves the DEMO rendering of the SAME pages, so the
           AI modules reference {maas_model} here too — and until 2026-08-07 this template did not
           emit them at all, so an SA demoing the AI track read the literal sentinel off their own
           screen in front of a customer. Omitted when empty so antora.yml's visible placeholder
           survives rather than a blank swallowing the sentence. `ws doctor`'s "cockpit attributes"
           row grades this cockpit too, so the omission is now a red row rather than something only
           the person presenting can discover. */ -}}
    {{- if .root.Values.showroom.maasModel }}
    maas_model: {{ .root.Values.showroom.maasModel | quote }}
    {{- end }}
    {{- if .root.Values.showroom.maasEndpoint }}
    maas_endpoint: {{ .root.Values.showroom.maasEndpoint | quote }}
    {{- end }}
    guid: sa-demo
    lab_name: OpenShift Application Platform — Getting Started — Demo Guide
{{- end }}
{{- if .Values.showroomDemos.enabled }}
{{- $ns := .Values.showroomDemos.namespace | default .Values.showroom.namespace }}
{{- $domain := .Values.clusterDomain }}
{{- /* Same derivation as showroom.yaml:113 — used ONLY to print a runnable `oc login` in the
       terminal banner. Nothing in this template authenticates; see header point 1(a). */ -}}
{{- $apiHost := printf "api.%s:6443" (trimPrefix "apps." .Values.clusterDomain) }}
{{- $giteaHost := printf "gitea-%s.%s" .Values.giteaNamespace .Values.clusterDomain }}
{{- $mirrorUrl := printf "https://gitea-%s.%s/%s/%s.git" .Values.giteaNamespace .Values.clusterDomain .Values.mirrorOrg .Values.mirrorRepo }}
{{- $img := .Values.showroom.images }}
{{- /* The one context both the userdata ConfigMap and the Deployment's checksum render from. */ -}}
{{- $userData := dict "domain" $domain "giteaHost" $giteaHost "root" $ }}
# The cockpit Namespace is declared ONCE, in templates/showroom-namespace.yaml — see that file.
---
# nginx reverse proxy for the SA-Demos pod: / → nookbag content (:8000), /tty-top and /tty-bottom
# → the one ttyd (:7681), which forks an independent shell per websocket. The names are not free
# choices: click-to-run.js hardcodes /tty-top as DEFAULT_PATH and /tty-bottom as the target for
# `role="execute send-to-tty-bottom"` blocks, so a terminal mounted anywhere else leaves the demo
# rendering's ▶ buttons dead — the exact defect this cockpit gained a terminal to fix. Both
# locations exist because the tab is `type: double-terminal`; see the tabs block for why.
apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-demos-proxy
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  nginx.conf: |
    events {}
    error_log /dev/stdout info;
    http {
      include /etc/nginx/mime.types;
      # REQUIRED by the /tty-top location's `Connection $connection_upgrade`. nginx refuses to start
      # with `unknown "connection_upgrade" variable` if the location is copied without this map, and
      # the pod then CrashLoops on a config error rather than serving the content it otherwise could.
      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }
      server {
        listen 8080;
        absolute_redirect off;
        location / {
          proxy_pass http://127.0.0.1:8000;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /tty-top { return 302 /tty-top/; }
        location /tty-top/ {
          proxy_pass http://127.0.0.1:7681/;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_read_timeout 43200000;
          proxy_set_header Host $http_host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location = /tty-bottom { return 302 /tty-bottom/; }
        location /tty-bottom/ {
          proxy_pass http://127.0.0.1:7681/;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_read_timeout 43200000;
          proxy_set_header Host $http_host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
      }
    }
---
# Cockpit-level Antora attributes → injected as build-time doc attributes, same mechanism
# showroom.yaml uses per-user (mount at /user_data/). Cluster-wide values only (cluster_domain,
# tool URLs) plus `user`/`page-user` as a NON-identity placeholder. This paragraph used to say the
# cockpit deliberately omitted those two keys because {user} would "fall back to antora.yml's safe
# user1@ default" — the fallback is real, "safe" was never measured, and it was wrong: user1 is a
# live attendee slot, so the demo guide handed a presenter another person's namespace. Corrected
# 2026-08-07; the reasoning is in the named template above. `password` stays omitted — that one
# genuinely has no presenter-facing use.
apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-demos-userdata
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  # Body lives in the workshop-config.showroomDemosUserData template at the top of this file — the
  # SAME bytes the Deployment below hashes into checksum/user-data.
  user_data.yml: |
{{- include "workshop-config.showroomDemosUserData" $userData }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: showroom-demos
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    app.kubernetes.io/name: showroom-demos
    app.kubernetes.io/instance: showroom-demos
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: showroom-demos
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        # why: identical to showroom.yaml's — the cockpit builds its content at POD INIT from this
        # ConfigMap, so an attribute that changes here reaches a presenter only when the pod
        # restarts, and editing a ConfigMap restarts nothing. No reserved-session gate on this one:
        # there is no per-user reservation for a single shared cockpit, and any chart change already
        # Recreate-rolls it, so this adds no class of interruption that did not exist.
        checksum/user-data: {{ include "workshop-config.showroomDemosUserData" $userData | sha256sum | quote }}
      labels:
        app.kubernetes.io/name: showroom-demos
        app.kubernetes.io/instance: showroom-demos
    spec:
      # No serviceAccountName override (defaults to `default`): unlike showroom.yaml, nothing in
      # this pod talks to the k8s API — no oc-login step, so no need for the showroom SA or its
      # cross-namespace secret-read Role. See header point 1.
      #
      # ...and because nothing here calls the API, the token is pure liability: it would hand a
      # shell on an unauthenticated Route whatever `default` can do in this namespace. Header point
      # 1(c). Turning it off is what makes "logged out" mean powerless rather than merely
      # unconfigured — the SA's own `oc login` is the ONLY way this terminal gains any authority.
      automountServiceAccountToken: false
      initContainers:
        # 1) Clone the in-cluster monorepo mirror (public repo, valid RHDP wildcard cert → no auth).
        - name: content-clone
          image: {{ $img.gitCloner | quote }}
          env:
            - name: GIT_REPO_URL
              value: {{ $mirrorUrl | quote }}
            - name: GIT_REPO_REF
              value: {{ $.Values.showroomDemos.contentRef | quote }}
            - name: CLONE_DIR
              value: /showroom/repo
          volumeMounts:
            - name: showroom-files
              mountPath: /showroom/repo
              subPath: repo
        # 2) Build the DEMO rendering into /showroom/www — showroom/site-demo.yml, the demo-flavor
        #    sibling of showroom.yaml's showroom/site.yml (see that file's header for why the
        #    in-pod build needs its own playbook rather than referencing content/site-demo.yml
        #    directly).
        # Image path derived from showroom.namespace (helper), where the antora-ext ImageStream is
        # built — NOT this cockpit's $ns, so a split demos namespace still pulls the shared build.
        - name: antora-build
          image: {{ include "workshop-config.antoraImage" $ | quote }}
          # Explicit, not relied-upon-by-default — see showroom.yaml's antora-build initContainer for why
          # (the helper's tag is :latest today; pinning it later would silently flip the k8s default to
          # IfNotPresent and reintroduce the stale-cockpit-build bug).
          imagePullPolicy: Always
          env:
            - name: FILES_DIR
              value: /showroom/repo
            - name: OUTPUT_DIR
              value: /showroom/www
            - name: ANTORA_SITE_FILE
              value: showroom/site-demo.yml
          volumeMounts:
            - name: showroom-files
              mountPath: /showroom/repo
              subPath: repo
            - name: showroom-files
              mountPath: /showroom/www
              subPath: www
            - name: userdata
              mountPath: /user_data/
        # 3) Seed the terminal home with a greeting. This is showroom.yaml's terminal-prep with the
        #    ENTIRE login half removed — no Secret read, no `oc login`, no kubeconfig, and therefore
        #    no ServiceAccount and no RBAC (header point 1(a): the terminal CANNOT come up
        #    authenticated, because nothing here knows how). All it does is write a text file.
        - name: terminal-prep
          image: {{ $img.terminal | quote }}
          command: ["/bin/bash", "-c"]
          env:
            - name: HOME
              value: /home/lab-user
            - name: API_HOST
              value: {{ $apiHost | quote }}
          args:
            - |
              set -euo pipefail
              # DROP-IN under ~/.bashrc.d/, NOT an append to ~/.bashrc — the terminal image's runttyd
              # clobbers ~/.bashrc on first boot of a fresh home, and this home is an emptyDir, so
              # EVERY pod start is a first boot and an appended block would be wiped every time.
              # Both ~/.bashrc and bashrc.base source ~/.bashrc.d/*, which is why the drop-in
              # survives (mechanism verified on-cluster for showroom.yaml, 2026-07-18).
              # Single-quoted echoes, not a heredoc: an indented closing delimiter is invalid both in
              # this YAML block scalar and to bash.
              mkdir -p "$HOME/.bashrc.d"
              {
                echo '# OGSR_DEMO_BANNER — SA-Demos cockpit greeting. Managed by the terminal-prep'
                echo '# init container; sourced by ~/.bashrc via its ~/.bashrc.d/* loop.'
                echo 'if [ -z "${OGSR_DEMO_BANNER_SHOWN:-}" ]; then'
                echo '  export OGSR_DEMO_BANNER_SHOWN=1'
                echo '  echo'
                echo '  echo "  SA-Demos cockpit — this terminal is NOT logged in to any cluster."'
                echo '  echo'
                echo '  echo "  ⚠ THIS SHELL IS REACHABLE BY ANYONE WHO HAS THIS URL."'
                echo '  echo "    There is no authentication in front of it, and sessions are not"'
                echo '  echo "    exclusive — a second visitor gets a second shell in this same"'
                echo '  echo "    container, sharing this same home directory and any kubeconfig in it."'
                echo '  echo'
                echo '  echo "  So log in as an ATTENDEE, never as admin:"'
                echo "  echo \"    oc login https://\${API_HOST:-$API_HOST} -u user1\""
                echo '  echo "    (shared workshop password; every demo arc runs in attendee namespaces,"'
                echo '  echo "     so attendee rights are all a demo needs)"'
                echo '  echo'
                echo '  echo "  Do NOT paste an admin token here. Whatever you log in as, anyone"'
                echo '  echo "  reaching this URL holds until the pod restarts. Deleting the pod is"'
                echo '  echo "  the logout button:  oc delete pod -l app.kubernetes.io/instance=showroom-demos"'
                echo '  echo'
                echo '  if command -v oc >/dev/null 2>&1; then'
                echo '    if _who="$(oc whoami 2>/dev/null)"; then'
                echo '      echo "  Currently logged in as: ${_who}"; echo'
                echo '    fi'
                echo '    unset _who'
                echo '  fi'
                echo 'fi'
              } > "$HOME/.bashrc.d/00-ogsr-demo-banner.sh"
              echo "✓ terminal banner written to $HOME/.bashrc.d/00-ogsr-demo-banner.sh"
          volumeMounts:
            - name: home
              mountPath: /home/lab-user
      containers:
        # nginx proxy — the only container the Route targets.
        - name: nginx
          image: {{ $img.nginx | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: web
              containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-pid
              mountPath: /var/run
        # nookbag content — serves the built demo site + split-screen UI, reading our ui-config.
        - name: content
          image: {{ $img.content | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: GIT_REPO_URL
              value: {{ $mirrorUrl | quote }}
            - name: GIT_REPO_REF
              value: {{ $.Values.showroomDemos.contentRef | quote }}
            - name: ANTORA_PLAYBOOK
              value: showroom/site-demo.yml
            - name: DOMAIN
              value: {{ $domain | quote }}
            - name: ZT_UI_ENABLED
              value: "true"
            - name: ZT_BUNDLE
              value: {{ $.Values.showroom.nookbagBundle | quote }}
            - name: SHOWROOM_UI_CONFIG
              value: |
                ---
                type: showroom
                default_width: 45
                persist_url_state: true
                view_switcher:
                  enabled: true
                  default_mode: split
                antora:
                  name: modules
                tabs:
                  # Terminal first — it is what a presenter drives from, and click-to-run.js posts
                  # to /tty-top by default (its DEFAULT_PATH), which is why the nginx locations
                  # carry those exact names. A terminal mounted anywhere else would leave every ▶
                  # button in the demo rendering still dead, which is the whole reason this exists.
                  #
                  # WHY double-terminal WHEN ZERO DEMO BLOCKS USE THE SECOND PANE (measured: 0
                  # occurrences of send-to-tty-bottom in the entire content tree): `double-terminal`
                  # is the ONLY tab type this repo has ever run. nookbag may well accept a
                  # single-terminal type, but that is unverified — and an unrecognised tab type
                  # fails SILENTLY, rendering no tab at all, which is exactly the failure class
                  # this change was made to remove. Taking the known-working shape costs one extra
                  # nginx location and nothing else: ONE ttyd backs both panes, forking an
                  # independent shell per websocket. Narrow it to a single pane only after somebody
                  # has watched a single-terminal tab actually render in a live cockpit.
                  - name: Terminal 1
                    secondary_name: Terminal 2
                    type: double-terminal
                  # Tool tabs stay external launchers for the same reason showroom.yaml's are:
                  # every one of them sends a frame-blocking header, so cross-origin iframe
                  # embedding is impossible without a cluster-wide IngressController change we
                  # avoid (non-invasive rule).
                  - name: OCP Console
                    url: https://console-openshift-console.{{ $domain }}
                    external: true
                  - name: Gitea
                    url: https://{{ $giteaHost }}
                    external: true
                  - name: Dev Spaces
                    url: https://devspaces.{{ $domain }}
                    external: true
                  - name: Argo CD
                    url: https://student-gitops-server-student-gitops.{{ $domain }}
                    external: true
                  - name: Dev Hub
                    url: https://backstage-developer-hub-rhdh.{{ $domain }}
                    external: true
                  - name: SonarQube
                    url: https://sonarqube-sonarqube.{{ $domain }}
                    external: true
          volumeMounts:
            - name: userdata
              mountPath: /user_data/
            - name: showroom-files
              mountPath: /showroom/repo
              subPath: repo
            - name: showroom-files
              mountPath: /showroom/www
              subPath: www
          ports:
            - containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
        # ttyd terminal — starts LOGGED OUT. Nothing in this chart writes a kubeconfig into this
        # home (header point 1(a)), so the shell holds no cluster authority until the SA runs
        # `oc login` themselves. HOME is overridden for the same reason showroom.yaml overrides it:
        # the image's passwd sets HOME=/data, and our home volume is mounted at /home/lab-user.
        #
        # DELIBERATELY NOT COPIED from showroom.yaml's terminal: its lifecycle.postStart passwd
        # rewrite. That exists so the JVM resolves user.home for `mvn`/`java` in the lab, and it
        # POLLS for up to 10s racing runttyd. A presenter runs `oc` and `curl`, both of which read
        # $HOME directly — importing the hook would import its race to fix a problem this pod does
        # not have. If a future demo ever needs Maven in this terminal, take the hook then.
        - name: terminal
          image: {{ $img.terminal | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /home/lab-user
            - name: API_HOST
              value: {{ $apiHost | quote }}
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 7681
              protocol: TCP
          volumeMounts:
            - name: home
              mountPath: /home/lab-user
          resources:
            requests:
              cpu: {{ $.Values.showroom.terminalResources.requests.cpu | quote }}
              memory: {{ $.Values.showroom.terminalResources.requests.memory | quote }}
            limits:
              cpu: {{ $.Values.showroom.terminalResources.limits.cpu | quote }}
              memory: {{ $.Values.showroom.terminalResources.limits.memory | quote }}
      volumes:
        - name: showroom-files
          emptyDir: {}
        # The presenter's shell home. emptyDir ON PURPOSE, not for want of a PVC — header point
        # 1(b). Whatever kubeconfig the SA's `oc login` writes lives only in this pod, so a restart
        # is an implicit logout and no admin session outlives the pod on an unauthenticated Route.
        - name: home
          emptyDir: {}
        - name: userdata
          configMap:
            name: showroom-demos-userdata
        - name: nginx-config
          configMap:
            name: showroom-demos-proxy
            defaultMode: 420
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-pid
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: showroom-demos
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: showroom-demos
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
# SA-Demos cockpit URL: showroom-demos.<apps-domain>. Carries showroom-{user}'s haproxy timeout
# annotations now that there IS a terminal websocket to keep alive: the default router timeout is
# 30s, which would drop an idle presenter's shell mid-demo — the failure looks like the terminal
# "froze" and is indistinguishable, on stage, from the cluster being broken.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: showroom-demos
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # Same pair showroom-{user} carries. `timeout` covers the HTTP request, `timeout-tunnel` the
    # upgraded websocket — the tunnel one is what actually keeps an idle ttyd alive, and setting
    # only `timeout` looks correct while still dropping the shell.
    haproxy.router.openshift.io/timeout: 1h
    haproxy.router.openshift.io/timeout-tunnel: 1h
spec:
  host: showroom-demos.{{ $domain }}
  to:
    kind: Service
    name: showroom-demos
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
