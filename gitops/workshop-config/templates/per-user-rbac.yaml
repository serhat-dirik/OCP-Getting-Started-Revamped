# Each attendee is admin on their own four namespaces (and nothing else at namespace scope).
# PLUS monitoring-edit: OpenShift's built-in `admin` ClusterRole deliberately OMITS
# monitoring.coreos.com, so without this an attendee cannot create a PrometheusRule or even read
# their own ServiceMonitor — which breaks observability-health-scale (Observability) exercises AND attendee-run
# `ws verify observability-health-scale` (the 15/15 only passed because `ws prep` runs verify as admin). Found at observability-health-scale G1,
# 2026-07-11. monitoring-edit grants create/edit on servicemonitors/podmonitors/prometheusrules.
# PLUS gateway-editor: `admin` covers HTTPRoutes but not Gateways (the Gateway API leaves Gateways to
# platform teams), so an attendee could attach routes to a Gateway but never own one. A Gateway on the
# openshift-default class made in their namespace gets its own Envoy Deployment there; annotated
# `networking.istio.io/service-type: ClusterIP` it needs no cloud load balancer, and an edge Route to
# its `<name>-openshift-default` Service publishes it (proved as user5 on cluster-5vqxc, 2026-11-12).
{{- $suffixes := list "dev" "stage" "prod" "cicd" }}
# Create/manage Gateway API Gateways — bound per attendee namespace below, never cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ogsr-gateway-editor
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways/status"]
    verbs: ["get", "list", "watch"]
{{- range $i := until (int .Values.userCount) }}
{{- $user := printf "%s%d" $.Values.userPrefix (add $i 1) }}
{{- range $suffix := $suffixes }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $user }}-admin
  namespace: {{ $user }}-{{ $suffix }}
  labels:
    workshop.redhat.com/user: {{ $user | quote }}
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: {{ $user | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $user }}-monitoring-edit
  namespace: {{ $user }}-{{ $suffix }}
  labels:
    workshop.redhat.com/user: {{ $user | quote }}
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monitoring-edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: {{ $user | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $user }}-gateway-editor
  namespace: {{ $user }}-{{ $suffix }}
  labels:
    workshop.redhat.com/user: {{ $user | quote }}
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ogsr-gateway-editor
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: {{ $user | quote }}
{{- end }}
{{- end }}
