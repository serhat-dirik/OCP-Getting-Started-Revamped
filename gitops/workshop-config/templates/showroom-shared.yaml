{{- /*
  SHARED COCKPIT — one Showroom deployment behind an OpenShift OAuth front door, serving every
  attendee. Identity is resolved AT REQUEST TIME from the logged-in user instead of being baked in
  at build time, which is what lets a single build serve everyone.

  WHY THIS EXISTS (owner ruling 2026-08-12, reaffirmed 2026-08-14). The shipped per-user cockpits
  (showroom.yaml) publish a Route per attendee with NO authentication and a terminal ALREADY logged
  in as that attendee. Measured from outside the cluster with no credentials: GET /tty-top/ returns
  200 with a live shell, and POST /tty-top/token returns {"token": ""} — ttyd runs `-W /usr/bin/bash`
  with no `-c`, so anyone with the URL gets that attendee's shell. On a disposable RHDP cluster that
  was an accepted posture. On a CUSTOMER cluster it is a gap the workshop itself introduces, which
  collides with the project's non-invasive rule. The owner's framing: "if someone deploys this
  workshop on a customer cluster, they'd complain anybody with the url gain access to that user
  credentials and terminal is already there."

  THE SA-DEMOS CASE IS THE SAME CASE (owner, 2026-08-14). An SA does not get a special identity: they
  "pick one user and login with that one", exactly like an attendee, and anything needing admin they
  do from their own terminal rather than this one. So there is ONE identity model here, not two —
  a demo deployment differs only in which content flavor its playbook builds.

  ADDITIVE BY DESIGN. Renders NOTHING unless .Values.showroom.shared.enabled is true, and touches no
  object showroom.yaml owns. Enabling it stands the shared cockpit up ALONGSIDE the per-user ones so
  the two can be compared on a live cluster before anything is retired.

  ── THE THREE MECHANISMS, each verified on cluster-m24jn 2026-08-14 ──────────────────────────────

  1. IDENTITY IN THE CONTENT — nginx sub_filter.
     The site is built ONCE with `user: __WS_USER__`, and nginx rewrites that sentinel to the
     authenticated username on every response. Verified against the real quay.io/rhpds/nginx:1.25
     (--with-http_sub_module is compiled in) that all four contexts substitute: body text, href
     attributes, id attributes, and <code> blocks — the last matters because click-to-run sends the
     block's text to the terminal, so the command an attendee runs carries their real username.
     Scale of the problem this avoids: 3295 occurrences of the identity in one rendered flavor, 114
     inside href/src and 5 inside id. A client-side DOM walk would have had to special-case
     attributes and anchors; a response-stream rewrite does not distinguish them, which is why it is
     the right layer.

  2. IDENTITY IN THE TERMINAL — one terminal pod per attendee (owner ruling 2026-11-12).
     Until then ONE ttyd in the cockpit pod forked every attendee's shell, all as the same uid, so
     attendee A could rewrite B's ~/.kube/config, ~/.bashrc.d and the session wrapper itself
     (measured on cluster-5vqxc 2026-11-12; kernel.yama.ptrace_scope was 0 too). Now:
       * each attendee has namespace ogsr-term-<user> holding one ttyd pod (rendered at the end of
         this file). Separate namespaces get separate SCC uid ranges, so the kernel separates them;
       * nginx routes /tty-top/ and /tty-bottom/ to terminal.ogsr-term-<X-Forwarded-User>.svc. That
         header is set by oauth-proxy, and nginx listens on 127.0.0.1 only, so no client can forge it;
       * a NetworkPolicy in each terminal namespace admits port 7681 ONLY from the cockpit pods —
         without it any pod on the cluster network could open any attendee's shell;
       * the session wrapper is a read-only ConfigMap mount that names its own attendee; it signs in
         with the shared workshop password and refuses a session the front door names differently.

  3. THE FRONT DOOR — oauth-proxy as a REAL OAuthClient (was: as the ServiceAccount).
     A ServiceAccount-as-OAuth-client is SCOPE-CAPPED, and that cap is what forced this change.
     Measured on this cluster 2026-08-16, on the owner's own real logins:

         oc get oauthclientauthorizations -o custom-columns=CLIENT:.clientName,USER:.userName,SCOPES:.scopes
         system:serviceaccount:ogsr-showroom:showroom-shared   user6   [user:info user:check-access]
         system:serviceaccount:ogsr-showroom:showroom-shared   user7   [user:info user:check-access]

     `user:info user:check-access` is enough to say WHO you are and nothing else — a token minted
     under it cannot read a pod. Real OAuthClient objects on the same cluster (`console`,
     `openshift-cli-client`, `openshift-devspaces-client`) issue `user:full`, which is what `oc login`
     gets. So the SA-as-client had to be replaced by a real client for the terminal half to exist at
     all; the SA remains only as the pod's identity and the auth-delegator holder.

     THE NON-INVASIVE COST, PAID EXPLICITLY. An OAuthClient is CLUSTER-SCOPED — it outlives the
     namespace, which is exactly why the previous design refused one. It is therefore owner-labelled
     and its teardown is wired by hand, because nothing else would reach it: the client is created by
     the bootstrap hook below rather than by Argo (see the hook's own header for why), so the
     uninstall CASCADE cannot prune it. `bootstrap/ogsr-uninstall.sh` step 7 now sweeps
     `oauthclients.oauth.openshift.io` by owner label alongside cluster RBAC, and
     `bootstrap/ogsr-check-clean.sh` reports one while it remains (its cluster-scoped sweep is driven
     by live `oc api-resources --namespaced=false --verbs=list` discovery, which returns
     `oauthclients.oauth.openshift.io` — verified 2026-08-16 — and the hardcoded fallback list it
     uses when discovery fails now names it too).

  ── THE FAILURE MODE THIS GUARDS ─────────────────────────────────────────────────────────────────
  If the identity header is ever absent, a naive sub_filter replaces the sentinel with an EMPTY
  string and serves `ws prep agentic-ai --user  --yes` and `-dev` namespaces — corrupt commands, no
  error, HTTP 200. That is measured, as the negative control of the experiment above, and it is
  exactly the class of defect this project keeps paying for: correct in the source, broken in the
  artefact, reported as success. An empty identity is therefore refused with 503, never rendered.
  The access token oauth-proxy passes stops at nginx: no upstream receives it (see the locations).
*/ -}}
{{- if and .Values.showroom.enabled .Values.showroom.shared.enabled }}
{{- $ns := .Values.showroom.namespace }}
{{- $domain := .Values.clusterDomain }}
{{- $giteaHost := printf "gitea-%s.%s" .Values.giteaNamespace .Values.clusterDomain }}
{{- $mirrorUrl := printf "https://gitea-%s.%s/%s/%s.git" .Values.giteaNamespace .Values.clusterDomain .Values.mirrorOrg .Values.mirrorRepo }}
{{- $img := .Values.showroom.images }}
{{- /* Same derivation as showroom.yaml: a comma-joined scalar, because Argo cannot carry a list. */ -}}
{{- $disabledModules := list }}
{{- range $s := splitList "," (default "" .Values.modulesDisabledCSV) }}{{- if trim $s }}{{- $disabledModules = append $disabledModules (trim $s) }}{{- end }}{{- end }}
{{- $apiUrl := printf "https://api.%s:6443" (trimPrefix "apps." $domain) }}
{{- /* Per-attendee terminal namespaces are <prefix><user>. tools/ws/ws (TERMINAL_NS_PREFIX) must match. */ -}}
{{- $termPrefix := "ogsr-term-" }}
{{- /*
     TWO INSTANCES, ONE DEFINITION. The attendee cockpit and the SA-Demos cockpit differ ONLY in
     which Antora playbook they build — the workshop flavor or the demo flavor (Say/Show/Do). They
     do NOT differ in identity: the owner's ruling (2026-08-14) is that an SA "picks one user and
     logs in with that one", exactly like an attendee, and does anything needing admin from their
     own terminal rather than this one.

     That ruling is what collapses the old second identity model. The shipped SA-Demos cockpit
     hardcodes `user: your-user` — a placeholder that is not an identity, which is why its 40
     `ws prep … --user {user}` pre-flights across 19 modules were unrunnable, while its banner
     hardcoded `-u user1` and would have WIPED a live attendee. Resolving identity from the login
     makes every one of those call sites correct as written, with no content edit at all.
*/ -}}
{{- $instances := list
      (dict "name" "showroom-shared"       "hostPrefix" (default "ogsr-showroom" .Values.showroom.shared.hostPrefix)      "playbook" "showroom/site.yml"      "flavor" "workshop")
      (dict "name" "showroom-shared-demos" "hostPrefix" (default "ogsr-demos"    .Values.showroom.shared.demosHostPrefix) "playbook" "showroom/site-demo.yml" "flavor" "demo") }}
{{- range $inst := $instances }}
{{- $name := $inst.name }}
{{- $playbook := $inst.playbook }}
{{- /* <hostPrefix>.<domain>, NOT <name>-<namespace>.<domain>. The derived form was correct and
       unusable — showroom-shared-ogsr-showroom.<domain> is the single URL an instructor reads out to
       a room. The Deployment keeps its descriptive name; only the human-facing host is short. */ -}}
{{- $host := printf "%s.%s" $inst.hostPrefix $domain }}
{{- $clientId := printf "ogsr-%s" $name }}
{{- $clientSecretName := printf "%s-oauth-client" $name }}
{{- $redirectUri := printf "https://%s/oauth/callback" $host }}
---
# The pod's identity and the auth-delegator holder — NOT the OAuth client any more. The
# `serviceaccounts.openshift.io/oauth-redirectreference.primary` annotation was removed with the move
# to a real OAuthClient (see the header): it registered this SA as a client whose tokens are capped at
# `user:info user:check-access`, and leaving a registration nothing authenticates against is a stale
# grant rather than a spare tyre.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
# oauth-proxy validates tokens and SubjectAccessReviews through the API server, which needs the
# auth-delegator role. Cluster-scoped, therefore owner-labelled so teardown can find and remove it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ogsr-{{ $name }}-auth-delegator
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $ns }}
---
# ── OAUTH CLIENT BOOTSTRAP (SA + RBAC + Sync hook) ───────────────────────────────────────────────
#
# WHY A HOOK AND NOT A DECLARED OAuthClient. The client needs a SECRET, and a secret in a chart is a
# secret in git. Helm's `randAlphaNum` cannot help: Argo re-renders this chart on EVERY sync, so the
# value would be different every reconcile — a new secret mid-workshop invalidates every live login,
# and the app never converges. `lookup` is empty under Argo's `helm template` (values.yaml says so for
# showroom.ocpVersion, same reason). So the value has to be minted IN THE CLUSTER, once, and read back
# on every later sync — which is the established shape here: an idempotent Sync-phase hook Job, the
# same one console-plugins-enable.yaml uses to converge a shared cluster singleton.
#
# THE ALTERNATIVE THAT WAS REJECTED, and why. Argo could own the OAuthClient with the `secret` field
# simply OMITTED, letting this hook patch it in — a field absent from the desired manifest is absent
# from last-applied too, so the three-way diff should ignore it and Argo should stay Synced. "Should"
# is the problem. This repo's own rule is that diff questions are settled by a single-variable
# experiment on a real object, never by reasoning about diff internals, and that experiment cannot be
# run here (the live cockpit is serving a session; this lane does not mutate the cluster). The failure
# mode if the reasoning is wrong is not cosmetic red — selfHeal re-applies the manifest, the `secret`
# field goes empty, and EVERY attendee login breaks with no visible cause. Hook-owned has no such
# dependency, and its one real cost — the cascade cannot prune what Argo does not manage — is a cost
# that can be paid in full and verified: see the teardown wiring named in this file's header.
#
# SECRET IS THE SOURCE OF TRUTH, OAuthClient CONVERGES TO IT. The Job generates the value ONLY when
# the Secret is absent, and then makes OAuthClient.secret equal it on every run. That direction is
# what makes a deleted-and-recreated client (or a changed cluster domain, which changes redirectURIs)
# heal on the next sync without rotating a credential that live sessions still hold.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-oauth-bootstrap
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
# why: create/converge exactly ONE cluster-scoped OAuthClient — ours, by name. `create` is the only
# verb that cannot be resourceName-scoped (the object does not exist yet to be named), the same
# carve-out per-user-argo-rbac.yaml and console-plugins-enable.yaml document for their own creates.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ogsr-{{ $name }}-oauth-bootstrap
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: ["oauth.openshift.io"]
    resources: ["oauthclients"]
    verbs: ["get", "patch"]
    resourceNames: [{{ $clientId | quote }}]
  - apiGroups: ["oauth.openshift.io"]
    resources: ["oauthclients"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ogsr-{{ $name }}-oauth-bootstrap
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ogsr-{{ $name }}-oauth-bootstrap
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-oauth-bootstrap
    namespace: {{ $ns }}
---
# why: hold the generated client secret in ONE namespaced Secret, by name. `patch` is for the owner
# labels the Job stamps after creating it; there is deliberately no `list` and no `delete` — a hook
# that cannot enumerate secrets cannot read another component's, and one that cannot delete cannot
# rotate a credential live sessions are still using.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-oauth-bootstrap
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
    resourceNames: [{{ $clientSecretName | quote }}]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-oauth-bootstrap
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-oauth-bootstrap
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-oauth-bootstrap
    namespace: {{ $ns }}
---
# Argo Sync hook at wave 2 — AFTER the wave-1 RBAC above exists, BEFORE the wave-3 Deployment that
# mounts the Secret this Job creates. A pod cannot start on a missing secret volume, so this ordering
# is load-bearing, not tidiness. BeforeHookCreation so it re-runs (and re-converges) every sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-oauth-bootstrap
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: {{ $name }}-oauth-bootstrap
        workshop.redhat.com/layer: workshop-config
    spec:
      serviceAccountName: {{ $name }}-oauth-bootstrap
      restartPolicy: Never
      containers:
        - name: bootstrap
          # Digest-pinned ose-cli-rhel9, the same reference every other hook Job in this chart uses.
          # `oc` OOMs at 256Mi, hence the 512Mi limit (repo-wide hard-won fact).
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22@sha256:f8bbc73242af3eae3f8361a9611b29384d3577dba4d5e5b62f4beb2750862c19
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: 300m, memory: 512Mi}
          env:
            - name: NS
              value: {{ $ns | quote }}
            - name: SECRET_NAME
              value: {{ $clientSecretName | quote }}
            - name: CLIENT_ID
              value: {{ $clientId | quote }}
            - name: REDIRECT_URI
              value: {{ $redirectUri | quote }}
          volumeMounts:
            # Memory-backed: the plaintext client secret touches this filesystem and nothing else, and
            # a tmpfs never reaches a disk or a node-local layer. Same choice as the credential handoff
            # in the entry-state hooks.
            - name: scratch
              mountPath: /scratch
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              ok()   { echo "✅ $*"; }
              info() { echo "▶ $*"; }
              err()  { echo "❌ $*" >&2; }
              die()  { err "$*"; exit 1; }

              # NOTHING in this script echoes the client secret. It exists in three places only: a
              # shell variable, a 0600 file on the tmpfs below, and the two API objects it belongs in.
              TMPD="$(mktemp -d /scratch/oauth.XXXXXXXX)"
              chmod 0700 "$TMPD"
              trap 'rm -rf "$TMPD"' EXIT
              umask 077

              mint_into() {  # $1 = path — draw a fresh client secret. Never printed, never an argv.
                local raw gen=""
                for _ in 1 2 3 4 5; do
                  # head is FIRST in the pipeline and base64 LAST, so nothing can take SIGPIPE under
                  # `pipefail`; the alnum filter and the length trim are then done without a pipe.
                  raw="$(head -c 48 /dev/urandom | base64)"
                  gen="$(printf '%s' "$raw" | tr -dc 'A-Za-z0-9')"
                  gen="${gen:0:48}"
                  if [[ "${#gen}" -ge 32 ]]; then break; fi
                done
                [[ "${#gen}" -ge 32 ]] || die "could not draw a 32+ character client secret from /dev/urandom in 5 attempts"
                printf '%s' "$gen" > "$1"
                return 0
              }

              # THE ONE THING THIS FUNCTION MUST NEVER DO is mint a replacement for a secret that
              # already exists — every live attendee session is signed out the moment the value moves.
              # So "absent" has to be PROVEN, not inferred from a failed read: an existence probe that
              # swallows stderr cannot tell NotFound from a timed-out etcd, and both look like absent.
              # Three layers, because one is not enough:
              #   1. the read distinguishes NotFound from every other error, and only NotFound mints;
              #   2. `oc create` (never `apply`, never `patch`) means even a wrong "absent" verdict
              #      collides with AlreadyExists instead of overwriting;
              #   3. that collision is handled by RE-READING, so a genuine race between two syncs
              #      converges on the value that won rather than failing the Job.
              # NOTE for anyone editing: no branch here may end a function with `cond && cmd` — this
              # repo has already paid for that shape (an AND-list as a function's last statement
              # returns 1 and `set -e` kills the script). Every path below is an explicit return/die.
              resolve_client_secret() {
                local i out
                for i in 1 2 3; do
                  if out="$(oc get secret "$SECRET_NAME" -n "$NS" -o jsonpath='{.data.clientSecret}' 2>"$TMPD/err")"; then
                    [[ -n "$out" ]] || die "secret ${NS}/${SECRET_NAME} exists but has no clientSecret key — refusing to mint a replacement, because that would sign every live session out. fix: oc delete secret ${SECRET_NAME} -n ${NS} && re-sync workshop-config"
                    # printf is a bash BUILTIN, so the value never becomes an argv another process can read.
                    printf '%s' "$out" | base64 -d > "$TMPD/clientSecret"
                    ok "reusing the client secret already in ${NS}/${SECRET_NAME} (never regenerated on a re-sync — a new value would sign out every live session)"
                    return 0
                  fi
                  grep -qiE 'notfound|not found' "$TMPD/err" \
                    || die "cannot read secret ${NS}/${SECRET_NAME}: $(tr '\n' ' ' < "$TMPD/err") — this is NOT read as 'absent', so nothing is minted; the Job will retry"
                  info "no client secret yet — minting one for OAuthClient/${CLIENT_ID} (attempt ${i}/3)"
                  mint_into "$TMPD/clientSecret"
                  if oc create secret generic "$SECRET_NAME" -n "$NS" \
                       --from-file=clientSecret="$TMPD/clientSecret" 2>"$TMPD/err" >/dev/null; then
                    ok "created secret ${NS}/${SECRET_NAME} (value not printed, here or anywhere)"
                    return 0
                  fi
                  grep -qiE 'alreadyexists|already exists' "$TMPD/err" \
                    || die "cannot create secret ${NS}/${SECRET_NAME}: $(tr '\n' ' ' < "$TMPD/err")"
                  info "another sync created it first — discarding the value just drawn and re-reading theirs"
                done
                die "could not resolve the client secret in 3 attempts — see the errors above"
              }
              resolve_client_secret

              oc label secret "$SECRET_NAME" -n "$NS" --overwrite \
                workshop.redhat.com/layer=workshop-config \
                workshop.redhat.com/owner=ogsr >/dev/null

              # ── STABLE COOKIE SECRET ──────────────────────────────────────────────────────────
              # oauth-proxy signs its session cookie with this. Until 2026-08-16 the Deployment drew
              # it from /dev/urandom in its own command line, so it was NEW ON EVERY POD START and
              # every rollout, drain, OOM kill or reschedule signed out the entire cohort mid-lab.
              # Measured that day: a chart change rolled the pod, and the next request logged
              # "Cookie Signature not valid" for a session eight minutes old. Minting it once here
              # is what makes sessions survive a restart.
              #
              # LENGTH IS LOAD-BEARING AND DIFFERENT FROM THE CLIENT SECRET'S. oauth-proxy requires
              # 16, 24 or 32 bytes after its own base64 decode and EXITS otherwise. 32 alnum
              # characters are valid base64 of length 32, so they decode to exactly 24 bytes
              # (AES-192). Do NOT reuse mint_into here: its 48 characters decode to 36 bytes and the
              # proxy refuses to start.
              mint_cookie_into() {
                local raw gen=""
                for _ in 1 2 3 4 5; do
                  raw="$(head -c 64 /dev/urandom | base64)"
                  gen="$(printf '%s' "$raw" | tr -dc 'A-Za-z0-9')"
                  gen="${gen:0:32}"
                  if [[ "${#gen}" -eq 32 ]]; then break; fi
                done
                [[ "${#gen}" -eq 32 ]] || die "could not draw a 32 character cookie secret from /dev/urandom in 5 attempts"
                printf '%s' "$gen" > "$1"
                return 0
              }

              # Same never-replace rule as the client secret, and for a sharper reason: moving this
              # value signs every live attendee out, which is the exact failure it exists to prevent.
              ensure_cookie_secret() {
                local out
                if out="$(oc get secret "$SECRET_NAME" -n "$NS" -o jsonpath='{.data.cookieSecret}' 2>/dev/null)" && [[ -n "$out" ]]; then
                  ok "reusing the cookie secret already in ${NS}/${SECRET_NAME} — live sessions survive this restart"
                  return 0
                fi
                info "no cookie secret yet — minting one (first install, or an upgrade from the per-pod /dev/urandom version)"
                mint_cookie_into "$TMPD/cookieSecret"
                # Both values come from FILES and the object is rebuilt from what is already in hand,
                # so nothing is echoed and nothing becomes an argv. clientSecret is written back
                # byte-identical to what was just read, so this is a no-op for that key.
                if oc create secret generic "$SECRET_NAME" -n "$NS" \
                     --from-file=clientSecret="$TMPD/clientSecret" \
                     --from-file=cookieSecret="$TMPD/cookieSecret" \
                     --dry-run=client -o yaml 2>"$TMPD/err" | oc apply -f - >/dev/null 2>>"$TMPD/err"; then
                  ok "stored a stable cookie secret in ${NS}/${SECRET_NAME} (value not printed, here or anywhere)"
                  return 0
                fi
                # DELIBERATELY NOT FATAL. Without this key the Deployment falls back to a per-pod
                # random value, which is precisely the old behaviour — degraded, not broken. A
                # cockpit that refuses to come up is a worse outcome than one whose sessions do not
                # survive a restart, and this Job also owns the client secret the cockpit cannot
                # start without.
                err "could not store a cookie secret: $(tr '\n' ' ' < "$TMPD/err")"
                err "the cockpit still starts, but each restart will sign attendees out — re-sync to retry"
                return 0
              }
              ensure_cookie_secret

              # $(<file) is a bash builtin read — no `cat`, no extra process.
              CS_VAL="$(<"$TMPD/clientSecret")"
              [[ -n "$CS_VAL" ]] || die "client secret file is empty after ${NS}/${SECRET_NAME} was read/created"
              {
                echo 'apiVersion: oauth.openshift.io/v1'
                echo 'kind: OAuthClient'
                echo 'metadata:'
                echo "  name: ${CLIENT_ID}"
                echo '  labels:'
                # Owner label = how bootstrap/ogsr-uninstall.sh finds this cluster-scoped object, and
                # how ogsr-check-clean.sh reports it while it is still there. Without it the workshop
                # leaves a permanent trace on a customer cluster.
                echo '    workshop.redhat.com/layer: workshop-config'
                echo '    workshop.redhat.com/owner: ogsr'
                echo 'grantMethod: auto'
                echo 'redirectURIs:'
                echo "  - ${REDIRECT_URI}"
                echo "secret: ${CS_VAL}"
              } > "$TMPD/oauthclient.yaml"
              chmod 0600 "$TMPD/oauthclient.yaml"
              unset CS_VAL

              if oc get oauthclients.oauth.openshift.io "$CLIENT_ID" >/dev/null 2>&1; then
                # --patch-file, NOT -p: a -p body is an argv, and this body carries the secret.
                oc patch oauthclients.oauth.openshift.io "$CLIENT_ID" \
                  --type=merge --patch-file "$TMPD/oauthclient.yaml" >/dev/null
                ok "converged OAuthClient/${CLIENT_ID} → redirect ${REDIRECT_URI}, grantMethod auto, secret == ${NS}/${SECRET_NAME}"
              else
                # `oc create`, not `oc apply`: apply would store the whole body — secret included — in
                # a last-applied annotation on a cluster-scoped object, a second copy nothing needs.
                oc create -f "$TMPD/oauthclient.yaml" >/dev/null
                ok "created OAuthClient/${CLIENT_ID} → redirect ${REDIRECT_URI}, grantMethod auto"
              fi

              # Readiness assertion consumable by `ws doctor`/CI: prove the two agree WITHOUT printing
              # either. Compare hashes, not values.
              LIVE_H="$(oc get oauthclients.oauth.openshift.io "$CLIENT_ID" -o jsonpath='{.secret}' | sha256sum | cut -d' ' -f1)"
              FILE_H="$(sha256sum < "$TMPD/clientSecret" | cut -d' ' -f1)"
              [[ "$LIVE_H" == "$FILE_H" ]] || die "OAuthClient/${CLIENT_ID}.secret does not match ${NS}/${SECRET_NAME} after converging — every login would fail. fix: oc delete oauthclient ${CLIENT_ID} && re-sync workshop-config"
              ok "OAuthClient/${CLIENT_ID} and ${NS}/${SECRET_NAME} agree (sha256 compared, neither value printed)"
      volumes:
        - name: scratch
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
---
# The serving-cert annotation makes the service CA mint the TLS pair oauth-proxy listens with, so the
# Route can be reencrypt and no certificate is ever committed to this repo.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    service.beta.openshift.io/serving-cert-secret-name: {{ $name }}-tls
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ $name }}
  ports:
    - name: https
      port: 8443
      targetPort: 8443
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # Terminal websockets idle for long stretches while an attendee reads. Both timeouts are needed —
    # the tunnel one is what actually keeps an upgraded connection alive.
    haproxy.router.openshift.io/timeout: 1h
    haproxy.router.openshift.io/timeout-tunnel: 1h
spec:
  host: {{ $host }}
  to:
    kind: Service
    name: {{ $name }}
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-proxy
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  nginx.conf: |
    events {}
    error_log /dev/stdout info;
    http {
      include /etc/nginx/mime.types;
      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }
      # An absent identity must never reach sub_filter — see the header. 1 = refuse.
      map $http_x_forwarded_user $ws_identity_missing {
        default 0;
        ''      1;
      }
      # PRESENCE, NEVER VALUE. These two exist so the question "did the front door send it?"
      # is answerable from `oc logs -c nginx` instead of from a rebuild-and-guess cycle. A
      # token in an access log is a credential in a log, so what is logged is 0 or 1 and the
      # value is never interpolated anywhere near log_format.
      map $http_x_forwarded_user         $ws_hdr_user  { default 1; '' 0; }
      map $http_x_forwarded_access_token $ws_hdr_token { default 1; '' 0; }
      log_format ws_identity '$time_iso8601 $request_method $uri upgrade="$http_upgrade" '
                             'hdr_user=$ws_hdr_user hdr_token=$ws_hdr_token -> $status';
      # The attendee's OWN terminal Service, from the front door's identity header. A name that is
      # not a DNS label maps to "" and is refused below, so the header can never steer the host.
      map $http_x_forwarded_user $ws_term {
        default "";
        "~^(?<wsu>[a-z0-9]([-a-z0-9]{0,51}[a-z0-9])?)$" "terminal.{{ $termPrefix }}$wsu.svc.cluster.local";
      }
      # proxy_pass with a variable resolves at request time, so nginx needs a resolver. The
      # cluster DNS Service by NAME, because its IP differs per cluster (172.231.0.10 on 5vqxc).
      resolver dns-default.openshift-dns.svc.cluster.local valid=30s ipv6=off;
      server {
        # LOOPBACK ONLY. oauth-proxy is the one client; on 0.0.0.0 any pod could send its own
        # X-Forwarded-User here and be routed to that attendee's shell.
        listen 127.0.0.1:8080;
        absolute_redirect off;
        location / {
          if ($ws_identity_missing) {
            return 503 "cockpit: no authenticated identity (X-Forwarded-User absent) - refusing to serve content with an empty username";
          }
          proxy_pass http://127.0.0.1:8000;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          # THE CONTENT UPSTREAM MUST NOT SEE THE TOKEN. nginx forwards the client's headers to a
          # proxied server by default, so oauth-proxy's X-Forwarded-Access-Token would reach the
          # content container for free. An EMPTY proxy_set_header value means the field is not passed
          # at all — that is nginx's documented behaviour and the whole point of this line. No
          # upstream needs the token; the terminal location strips it too.
          proxy_set_header X-Forwarded-Access-Token "";
          # sub_filter cannot rewrite a compressed body. The content service is Python SimpleHTTP and
          # sends none today (measured: Content-type text/html, no Content-Encoding), but asking for
          # identity encoding costs nothing and makes this independent of that image's behaviour.
          proxy_set_header Accept-Encoding "";
          sub_filter '__WS_USER__' $http_x_forwarded_user;
          sub_filter_once off;
          # Default is text/html only; the built site also carries the identity inside .js and .json
          # (search index, nookbag config), and a half-substituted site is worse than none.
          sub_filter_types *;
        }
        location ~ ^/tty-(top|bottom)$ { return 302 $uri/; }
        # Both terminal panes hit the SAME ttyd, which forks one shell per websocket.
        location ~ ^/tty-(top|bottom)/ {
          if ($ws_term = "") {
            return 503 "cockpit: no terminal for this sign-in (attendee usernames only)";
          }
          rewrite ^/tty-(?:top|bottom)(/.*)$ $1 break;
          proxy_pass http://$ws_term:7681;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_read_timeout 43200000;
          proxy_set_header Host $http_host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          # The front door's credentials stop here: the token and the session cookie would
          # otherwise cross the pod network to a pod the attendee controls.
          proxy_set_header X-Forwarded-Access-Token "";
          proxy_set_header Cookie "";
          # ttyd reads ONE header (-H) and this is it. Two rules govern its value, both measured on
          # this image on 2026-08-16.
          #
          # RULE 1 — IT MUST NEVER BE EMPTY. ttyd's -H DENIES the websocket when its header is
          # absent, and a denied websocket renders as "reconnecting", forever, with no reason.
          # Composing the value here means ttyd can never deny anyone; the wrapper decides, holds the
          # connection open and says what happened.
          #
          # RULE 2 — IT MUST STAY UNDER ~29 CHARACTERS. ttyd/libwebsockets silently refuses a custom
          # header whose VALUE is longer than that. Measured by bisection through this very nginx,
          # subprotocol tty, one variable:
          #     value length 10 15 20 25 28 -> 101 accepted
          #     value length 30 31 34 40 50 61 -> 502 DENIED
          # An OpenShift access token is 51 characters, so it can NEVER pass through -H — the
          # original design sent it and every terminal died. If a future cockpit needs a secret on
          # the connection, -H is not the channel.
          #
          # The wrapper compares the name with its own attendee and refuses a mismatch, so a routing
          # fault shows as a message instead of somebody else's shell.
          proxy_set_header X-Ws-Session "u=$http_x_forwarded_user;t=";
          access_log /dev/stdout ws_identity;
        }
      }
    }
---
# Build-time attributes for the ONE build. Every environment value is real; only the identity is a
# sentinel, because it is the only one that differs per reader.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-userdata
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  user_data.yml: |
{{- include "workshop-config.showroomUserData" (dict "user" "__WS_USER__" "domain" $domain "giteaHost" $giteaHost "disabledModules" $disabledModules "root" $) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/instance: {{ $name }}
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $name }}
        workshop.redhat.com/layer: workshop-config
    spec:
      serviceAccountName: {{ $name }}
      initContainers:
        # 1) Clone the in-cluster monorepo mirror (public repo, valid RHDP wildcard cert → no auth).
        - name: content-clone
          image: {{ $img.gitCloner | quote }}
          env:
            - name: GIT_REPO_URL
              value: {{ $mirrorUrl | quote }}
            - name: GIT_REPO_REF
              value: {{ $.Values.showroom.contentRef | quote }}
            - name: CLONE_DIR
              value: /showroom/repo
          volumeMounts:
            - name: showroom-files
              mountPath: /showroom/repo
              subPath: repo
        # 2) Build the site ONCE, with __WS_USER__ standing in for the reader's identity.
        - name: antora-build
          image: {{ include "workshop-config.antoraImage" $ | quote }}
          # Explicit, not relied-upon-by-default — see showroom.yaml's note: the helper's tag is
          # :latest, and a later pin would silently flip this to IfNotPresent and reintroduce the
          # stale-cockpit-build bug.
          imagePullPolicy: Always
          env:
            - name: FILES_DIR
              value: /showroom/repo
            - name: OUTPUT_DIR
              value: /showroom/www
            - name: ANTORA_SITE_FILE
              value: {{ $playbook | quote }}
          volumeMounts:
            - name: showroom-files
              mountPath: /showroom/repo
              subPath: repo
            - name: showroom-files
              mountPath: /showroom/www
              subPath: www
            - name: userdata
              mountPath: /user_data/
      containers:
        # ── the front door. Every other container listens on loopback only. ──
        - name: oauth-proxy
          image: {{ $img.oauthProxy | quote }}
          ports:
            - name: https
              containerPort: 8443
          # NO --openshift-sar, and that is deliberate. The obvious-looking guard
          #   --openshift-sar={"namespace":"<showroom-ns>","resource":"services","verb":"get"}
          # LOCKS OUT EVERY ATTENDEE. Measured 2026-08-14:
          #   oc auth can-i get services -n ogsr-showroom --as=user1 --as-group=workshop-attendees → no
          #   oc auth can-i get services -n user1-dev     --as=user1 --as-group=workshop-attendees → yes
          # Attendees hold rights in their OWN namespaces and deliberately none in the showroom
          # namespace ("attendees never touch this namespace directly" — showroom.yaml). A SAR names
          # ONE static namespace, so it cannot express "their own namespace, whoever they are", and
          # any namespace we could name is one they have no rights in. The bar is therefore
          # authentication itself: a signed-in cluster user reaches the cockpit. Against the model
          # this replaces — no authentication whatsoever, a live root-capable shell to anyone holding
          # the URL — that is the whole of the fix, and a broken SAR would have been a worse outcome
          # than none, because it fails CLOSED on the exact people the workshop is for.
          command: ["/bin/bash", "-c"]
          args:
            - |
              # THE COOKIE SECRET MUST OUTLIVE THIS POD. It signs the session cookie, so when it
              # changes every attendee is signed out at once. Drawing it from /dev/urandom here —
              # which is what this file did until 2026-08-16 — means a NEW one on every pod start,
              # so a chart change, a node drain, an OOM kill or any reschedule evicts the whole
              # cohort mid-lab. Measured that day: a rollout, then "Cookie Signature not valid" for
              # a session eight minutes old.
              #
              # The bootstrap Job mints one ONCE into the same Secret that already holds the client
              # secret. The fallback is deliberate and is NOT dead code: on a first install the
              # Deployment can be applied before the hook Job has stored the key, and a cockpit that
              # refuses to start is a worse failure than one whose sessions do not survive a restart.
              # -s not -f: an empty file is as useless as a missing one and must take the fallback.
              if [ -s /etc/oauth-cookie/cookie-secret ]; then
                COOKIE_FLAG="--cookie-secret-file=/etc/oauth-cookie/cookie-secret"
              else
                echo "WARNING: no stored cookie secret — using a per-pod value; attendees will be signed out when this pod restarts" >&2
                COOKIE_FLAG="--cookie-secret=$(head -c 32 /dev/urandom | base64 | head -c 32)"
              fi
              exec /usr/bin/oauth-proxy \
                --https-address=:8443 \
                --http-address= \
                --provider=openshift \
                --client-id={{ $clientId }} \
                --client-secret-file=/etc/oauth/client-secret \
                --redirect-url={{ $redirectUri }} \
                --scope="user:full" \
                --upstream=http://127.0.0.1:8080 \
                --tls-cert=/etc/tls/private/tls.crt \
                --tls-key=/etc/tls/private/tls.key \
                "$COOKIE_FLAG" \
                --cookie-expire=24h \
                --cookie-refresh=4h \
                --pass-access-token=true \
                --pass-user-headers=true
          # Every flag above was read out of THIS image's own `--help` on 2026-08-16, not recalled:
          #   -client-id string / -client-secret-file string "a file containing the client-secret"
          #   -scope string "OAuth scope specification"
          #   -pass-access-token "pass OAuth access_token to upstream via X-Forwarded-Access-Token"
          #   -pass-user-headers "pass X-Forwarded-User and X-Forwarded-Email information to upstream"
          # --client-secret-FILE, never --client-secret: a flag value is an argv, and an argv is
          # readable from the process table. --openshift-service-account is GONE — it is the flag that
          # capped every issued token at `user:info user:check-access` (see the header's measurement).
          # --redirect-url is pinned rather than derived per-request so the value oauth-proxy SENDS is
          # textually the value the OAuthClient REGISTERS; -proxy-prefix defaults to "/oauth", which
          # is where the "/oauth/callback" in both strings comes from.
          # --pass-user-headers STAYS: X-Forwarded-User is what the nginx sub_filter rewrites the
          # __WS_USER__ sentinel with, and that half is verified working with two concurrent logins.
          #
          # --cookie-refresh AND --cookie-expire ARE HYGIENE, NOT THE FIX. An earlier version of this
          # comment claimed they were "why the token arrives". THEY ARE NOT: with
          # `refresh:after 4h0m0s` confirmed live in the startup line, every terminal still failed
          # identically. Keep them — 4h sits inside the cluster's 24h token life so a refresh has
          # something to validate, and 24h expiry stops a session cookie outliving the token it
          # represents (the default 168h let a dead session look alive for six days) — but do not
          # credit them with delivering the token.
          #
          # A FALSIFIED MEASUREMENT LIVED HERE FOR A DAY. It read: "ttyd's -H check — probed through
          # nginx with and without the header: accepted BOTH (101)". That probe was WRONG, and it is
          # recorded rather than deleted because it cost the most time of anything in this file. It
          # omitted `Sec-WebSocket-Protocol: tty`, and ttyd only reaches its auth check on a genuine
          # subprotocol handshake. Re-probed correctly:
          #     subproto tty, NO header  -> 502      subproto tty, WITH header -> 101
          # So -H does enforce, the deny lines in ttyd's log ARE the auth header, and the conclusion
          # drawn from the bad probe sent the search to cookies for hours. If you probe a websocket,
          # send the subprotocol the real client sends, or you are testing a different code path.
          #
          # --pass-access-token WORKS, INCLUDING ON WEBSOCKETS. This was doubted at length, because
          # oauth-proxy routes upgrades through yhat/wsutil rather than its normal reverse proxy
          # (read UpstreamProxy.ServeHTTP), and it was reasonable to suspect that hop dropped the
          # header. It does not — wsutil shallow-copies the whole header map. MEASURED on the real
          # browser request that failed: nginx logged `hdr_user=1 hdr_token=1` on the very
          # /tty-top/ws upgrade ttyd then rejected. Both headers were present. The rejection was
          # ttyd's ~29-character cap on a custom header value, not a missing token.
          #
          # The flag stays even though nginx no longer forwards the token to ttyd: it is what makes
          # hdr_token=1 meaningful in the access log, which is now the standing proof that the front
          # door is healthy. The token reaches nginx and stops there.
          #
          # DIAGNOSING THIS AGAIN: `oc logs -c nginx` now prints hdr_user=0|1 hdr_token=0|1 per tty
          # request (presence only — a token in a log is a credential in a log). That answers "did
          # the front door send it?" outright. Do NOT patch the ConfigMap to add logging: nginx.conf
          # is mounted with subPath so a ConfigMap edit never reaches the container, and Argo's
          # selfHeal reverts it regardless. Change the chart and bump its version.
          volumeMounts:
            - name: tls
              mountPath: /etc/tls/private
            - name: oauth-client
              mountPath: /etc/oauth
              readOnly: true
            # Separate volume from oauth-client ON PURPOSE, because the two keys need opposite
            # failure behaviour. A missing clientSecret must block the pod — oauth-proxy cannot work
            # without it, and failing fast is right. A missing cookieSecret must NOT, because it is
            # absent for the seconds between a first install applying this Deployment and the wave-2
            # hook storing the key. `optional` is a property of the whole volume, so the only way to
            # have both is two volumes.
            - name: oauth-cookie
              mountPath: /etc/oauth-cookie
              readOnly: true
        - name: nginx
          image: {{ $img.nginx | quote }}
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-pid
              mountPath: /var/run
        - name: content
          image: {{ $img.content | quote }}
          imagePullPolicy: IfNotPresent
          env:
            # These four are NOT optional: without ANTORA_PLAYBOOK the content image looks for
            # site.yml at the repo root and dies with "No Antora playbook found" (measured
            # 2026-08-14 — omitting them CrashLoops this container while nginx and oauth-proxy stay
            # happily Ready, so the pod reads 2/4 and the cockpit serves nothing).
            - name: GIT_REPO_URL
              value: {{ $mirrorUrl | quote }}
            - name: GIT_REPO_REF
              value: {{ $.Values.showroom.contentRef | quote }}
            - name: ANTORA_PLAYBOOK
              value: {{ $playbook | quote }}
            - name: DOMAIN
              value: {{ $domain | quote }}
            - name: ZT_UI_ENABLED
              value: "true"
            - name: ZT_BUNDLE
              value: {{ $.Values.showroom.nookbagBundle | quote }}
            - name: SHOWROOM_UI_CONFIG
              value: |
                ---
                type: showroom
                default_width: 45
                persist_url_state: true
                view_switcher:
                  enabled: true
                  default_mode: split
                antora:
                  name: modules
                tabs:
                  - name: Terminal 1
                    secondary_name: Terminal 2
                    type: double-terminal
                  # Tool tabs are EMBEDDED panes. The workshop runs on a dedicated cluster and the installer
                  # rewrites the default router's response headers (bootstrap/install.sh step 2a''''): X-Frame-Options is
                  # removed and every route answers CSP frame-ancestors 'self' https://*.<apps>, so the console, Gitea,
                  # Dev Spaces, Argo CD, Developer Hub and SonarQube render inside the cockpit and keep their logins
                  # (same apps domain, so their cookies are same-site).
                  # Dev Spaces and Argo CD point at their sign-in START endpoints, not their landing pages: every
                  # tab loads when the cockpit loads, right after the cockpit sign-in, while the OpenShift OAuth
                  # session (sessionMaxAgeSeconds 300) is still valid, so their sign-in completes silently. A
                  # landing page waits for a click, and a click after 5 min hits the login page, which no frame shows.
                  - name: OCP Console
                    url: https://console-openshift-console.{{ $domain }}
                  - name: Gitea
                    url: https://{{ $giteaHost }}
                  - name: Dev Spaces
                    url: https://devspaces.{{ $domain }}/oauth/start?rd=%2Fdashboard%2F
                  - name: Argo CD
                    url: https://student-gitops-server-student-gitops.{{ $domain }}/auth/login?return_url=https%3A%2F%2Fstudent-gitops-server-student-gitops.{{ $domain }}%2Fapplications
                  - name: Dev Hub
                    url: https://backstage-developer-hub-rhdh.{{ $domain }}
                  - name: SonarQube
                    url: https://sonarqube-sonarqube.{{ $domain }}
          volumeMounts:
            - name: userdata
              mountPath: /user_data/
            - name: showroom-files
              mountPath: /showroom/repo
              subPath: repo
            - name: showroom-files
              mountPath: /showroom/www
              subPath: www
      volumes:
        - name: showroom-files
          emptyDir: {}
        - name: userdata
          configMap:
            name: {{ $name }}-userdata
        - name: nginx-config
          configMap:
            name: {{ $name }}-proxy
            defaultMode: 420
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-pid
          emptyDir: {}
        - name: tls
          secret:
            secretName: {{ $name }}-tls
        # Created by the wave-2 bootstrap hook above, not by Argo — so this Deployment (wave 3) is
        # ordered after it on purpose: a pod cannot start on a secret volume that does not exist.
        #
        # 288 = 0440, and the 40 is MEASURED, not chosen for looking strict. A projected secret file
        # under restricted-v2 is owned `root:<fsGroup>` while the container runs as a non-root uid
        # that holds fsGroup as a SUPPLEMENTARY group — read live on this pod 2026-08-16:
        #     uid=1002180000 gid=0(root) groups=0(root),1002180000
        #     -rw-r--r--. 1 0 1002180000  tls.crt
        # so the process is never the file's OWNER and reaches it through the GROUP bit. 0400 (owner
        # only) would therefore have made the client secret unreadable and crash-looped oauth-proxy on
        # a file it can see; 0440 is the tightest mode that is still readable, and it is tighter than
        # the 0644 default the sibling tls volume gets. One item, so the volume exposes the single key
        # oauth-proxy needs and nothing else the Secret might grow later.
        - name: oauth-client
          secret:
            secretName: {{ $clientSecretName }}
            defaultMode: 288
            items:
              - key: clientSecret
                path: client-secret
        # Same Secret, second key, and `optional: true` is the whole point — it is what lets a
        # NAMED-BUT-ABSENT key be tolerated instead of wedging the pod in ContainerCreating. The
        # container tests for the file with -s and falls back to a per-pod value, so the only cost
        # of it being missing is that a restart signs attendees out, which is exactly the old
        # behaviour rather than a new failure.
        - name: oauth-cookie
          secret:
            secretName: {{ $clientSecretName }}
            optional: true
            defaultMode: 288
            items:
              - key: cookieSecret
                path: cookie-secret
{{- end }}{{/* range $instances */}}
{{- /* ── PER-ATTENDEE TERMINALS (owner ruling 2026-11-12) ─────────────────────────────────────────
     One namespace per attendee, ogsr-term-<user>, holding ONE ttyd pod that both cockpits route to
     (see header mechanism 2). NOT <user>-dev: labs put NetworkPolicies and quotas there and
     `ws reset` purges its workloads. The namespace carries NO workshop.redhat.com/user label for the
     same reason — cohort-reset purges every namespace that has one. Attendees hold no rights here. */ -}}
{{- $users := list }}
{{- if .Values.showroom.pilotUser }}
{{- $users = list .Values.showroom.pilotUser }}
{{- else }}
{{- range $i := until (int .Values.userCount) }}{{- $users = append $users (printf "%s%d" $.Values.userPrefix (add $i 1)) }}{{- end }}
{{- end }}
---
# Lets each terminal's wrapper read the shared workshop password (non-secret by owner ruling) — the
# same secret the Gitea/SonarQube/Etherpad seeds read, so there is one source of truth and no copy.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ogsr-terminal-session-creds
  namespace: {{ .Values.giteaNamespace }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["workshop-user-creds"]
---
# Binds that read to every attendee's terminal ServiceAccount, and to nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ogsr-terminal-session-creds
  namespace: {{ .Values.giteaNamespace }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ogsr-terminal-session-creds
subjects:
{{- range $u := $users }}
  - kind: ServiceAccount
    name: terminal
    namespace: {{ $termPrefix }}{{ $u }}
{{- end }}
{{- range $u := $users }}
{{- $tns := printf "%s%s" $termPrefix $u }}
---
# The attendee's terminal namespace: its own SCC uid range is what isolates this attendee's shell.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $tns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    workshop.redhat.com/terminal-for: {{ $u | quote }}
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
---
# The terminal pod's identity; its only grant is the password read above.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terminal
  namespace: {{ $tns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
# The session wrapper ttyd runs per websocket. A ConfigMap mount is read-only, so nothing in the
# attendee's shell can change what their next terminal runs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: terminal-session
  namespace: {{ $tns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  ws-session: |
    #!/bin/bash
    # ttyd runs this once per websocket: sign this pod's attendee in, then hand them a shell.
    # No `set -e`: a wrapper that dies on a benign non-zero closes the terminal with no message.
    set -uo pipefail
    umask 077
    WS_USER='{{ $u }}'
    WS_API='{{ $apiUrl }}'
    # The -H header arrives as TTYD_USER; nginx composes it as "u=<front-door user>;t=".
    _hu="${TTYD_USER:-}"; unset TTYD_USER
    _hu="${_hu%%;t=*}"; _hu="${_hu#u=}"
    hold() {  # say why and keep the socket open so it stays readable; never hand out a shell
      echo; echo "  $1"; echo
      echo "  Reload the cockpit page to sign in again, then reopen this terminal."
      exec sleep 3600
    }
    [ "$_hu" = "$WS_USER" ] || hold "This terminal belongs to ${WS_USER}, but the cockpit signed you in as ${_hu:-nobody}."
    export HOME="/homes/${WS_USER}"
    export KUBECONFIG="${HOME}/.kube/config"
    export PATH="/opt/ogsr-bin:${PATH}:/showroom/repo/tools/ws"
    export WS_USER
    { mkdir -p "$HOME/.kube" && chmod 0700 "$HOME/.kube" && cd "$HOME"; } || hold "Cannot prepare ${HOME}."
    # Reuse a live login. Otherwise sign in with the shared workshop password, read through this
    # pod's ServiceAccount (KUBECONFIG=/dev/null = in-cluster credentials), into a temp file that is
    # renamed into place, so two panes connecting at once never read a half-written config.
    if [ "$(oc whoami 2>/dev/null)" != "$WS_USER" ]; then
      _pw="$(KUBECONFIG=/dev/null oc get secret workshop-user-creds -n '{{ $.Values.giteaNamespace }}' -o 'jsonpath={.data.password}' 2>/dev/null | base64 -d 2>/dev/null)"
      [ -n "$_pw" ] || hold "The workshop password is not readable from this terminal. Tell your instructor."
      _kc="$HOME/.kube/.config.$$"
      KUBECONFIG="$_kc" oc login --server="$WS_API" --insecure-skip-tls-verify=true -u "$WS_USER" -p "$_pw" >/dev/null 2>&1
      unset _pw
      if [ "$(KUBECONFIG="$_kc" oc whoami 2>/dev/null)" = "$WS_USER" ] && mv -f "$_kc" "$KUBECONFIG"; then
        oc project "${WS_USER}-dev" >/dev/null 2>&1 || true
      else
        rm -f "$_kc"
        hold "Could not sign in as ${WS_USER}. Tell your instructor."
      fi
    fi
    echo
    echo "  You are signed in as ${WS_USER} — this shell is already logged in to the cluster."
    echo "  Try: oc whoami   ·   ws prep <module>"
    echo
    exec /usr/bin/bash
---
# THE critical control: only the cockpit pods may open a shell here. Without it any pod on the
# cluster network could reach this ttyd and get this attendee's terminal.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ttyd-from-cockpit-only
  namespace: {{ $tns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values: ["showroom-shared", "showroom-shared-demos"]
      ports:
        - protocol: TCP
          port: 7681
---
# What nginx in the cockpit proxies /tty-top/ and /tty-bottom/ to for this attendee.
apiVersion: v1
kind: Service
metadata:
  name: terminal
  namespace: {{ $tns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ogsr-terminal
  ports:
    - name: ttyd
      port: 7681
      targetPort: 7681
---
# The attendee's home (kubeconfig, ~/.m2, clones). Survives a pod restart. Same wave as its
# Deployment: a WaitForFirstConsumer claim cannot bind before its pod exists (sync-wave-pvc-guard).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: terminal-home
  namespace: {{ $tns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ $.Values.showroom.shared.terminalHomeStorage }}
---
# The attendee's ttyd. One pod serves both terminal panes: ttyd forks a shell per websocket.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terminal
  namespace: {{ $tns }}
  labels:
    app.kubernetes.io/name: ogsr-terminal
    workshop.redhat.com/terminal-for: {{ $u | quote }}
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  # The home is an RWO claim, so a second pod could never attach it mid-rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ogsr-terminal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ogsr-terminal
        workshop.redhat.com/terminal-for: {{ $u | quote }}
    spec:
      serviceAccountName: terminal
      initContainers:
        {{- if include "workshop-config.moduleEnabled" (dict "root" $ "slug" "serverless-zero-to-hero") }}
        # Red Hat's Serverless `kn` (with `kn func` v1.17+) from the cluster's own CLI download route,
        # first on the terminal's PATH. The terminal image ships kn/func v1.15.2, whose remote-build
        # request the Pipelines 1.24 webhook rejects (`impossible ParamValues.Type`). Best effort: no
        # Serverless route, no download, and the image's own kn stays.
        - name: kn-cli
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22@sha256:f8bbc73242af3eae3f8361a9611b29384d3577dba4d5e5b62f4beb2750862c19
          command: ["/bin/bash", "-c"]
          args:
            - |
              if curl -ksfL "https://kn-openshift-serverless.{{ $domain }}/kn-linux-amd64.tar.gz" | tar xz -C /opt/ogsr-bin kn; then
                echo "✅ Serverless kn: $(/opt/ogsr-bin/kn version | sed -n 's/^Version: *//p') (kn func $(/opt/ogsr-bin/kn func version))"
              else
                echo "⚠ Serverless kn download unavailable — the terminal keeps the image's kn"
              fi
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - name: ogsr-bin
              mountPath: /opt/ogsr-bin
        {{- end }}
        # The repo clone that puts `ws` on the attendee's PATH, from the in-cluster mirror.
        - name: repo-clone
          image: {{ $img.gitCloner | quote }}
          env:
            - name: GIT_REPO_URL
              value: {{ $mirrorUrl | quote }}
            - name: GIT_REPO_REF
              value: {{ $.Values.showroom.contentRef | quote }}
            - name: CLONE_DIR
              value: /showroom/repo
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - name: repo
              mountPath: /showroom/repo
      containers:
        - name: terminal
          image: {{ $img.terminal | quote }}
          # -W keeps the terminal writable. No -c: authentication is the front door's job. -H makes
          # ttyd hand the X-Ws-Session header to the wrapper, which checks it names this attendee.
          # One shell line, not an argv list: ttyd-auth-header-guard's raw lane reads it from this text.
          command: ["/bin/bash", "-c"]
          args:
            - exec /usr/bin/ttyd -p 7681 -i 0.0.0.0 -W -H X-Ws-Session /opt/ogsr-session/ws-session
          ports:
            - name: ttyd
              containerPort: 7681
          readinessProbe:
            tcpSocket:
              port: 7681
            periodSeconds: 10
          resources:
            {{- toYaml $.Values.showroom.terminalResources | nindent 12 }}
          volumeMounts:
            - name: home
              mountPath: /homes/{{ $u }}
            - name: repo
              mountPath: /showroom/repo
              readOnly: true
            - name: ogsr-bin
              mountPath: /opt/ogsr-bin
              readOnly: true
            - name: session
              mountPath: /opt/ogsr-session
              readOnly: true
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: terminal-home
        - name: repo
          emptyDir: {}
        # Serverless kn fetched by the kn-cli init container (empty when Serverless is not installed).
        - name: ogsr-bin
          emptyDir: {}
        - name: session
          configMap:
            name: terminal-session
            defaultMode: 365
{{- end }}{{/* range $users */}}
{{- end }}
