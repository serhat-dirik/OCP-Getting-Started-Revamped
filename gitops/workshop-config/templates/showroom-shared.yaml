{{- /*
  SHARED COCKPIT — one Showroom deployment behind an OpenShift OAuth front door, serving every
  attendee. Identity is resolved AT REQUEST TIME from the logged-in user instead of being baked in
  at build time, which is what lets a single build serve everyone.

  WHY THIS EXISTS (owner ruling 2026-08-12, reaffirmed 2026-08-14). The shipped per-user cockpits
  (showroom.yaml) publish a Route per attendee with NO authentication and a terminal ALREADY logged
  in as that attendee. Measured from outside the cluster with no credentials: GET /tty-top/ returns
  200 with a live shell, and POST /tty-top/token returns {"token": ""} — ttyd runs `-W /usr/bin/bash`
  with no `-c`, so anyone with the URL gets that attendee's shell. On a disposable RHDP cluster that
  was an accepted posture. On a CUSTOMER cluster it is a gap the workshop itself introduces, which
  collides with the project's non-invasive rule. The owner's framing: "if someone deploys this
  workshop on a customer cluster, they'd complain anybody with the url gain access to that user
  credentials and terminal is already there."

  THE SA-DEMOS CASE IS THE SAME CASE (owner, 2026-08-14). An SA does not get a special identity: they
  "pick one user and login with that one", exactly like an attendee, and anything needing admin they
  do from their own terminal rather than this one. So there is ONE identity model here, not two —
  a demo deployment differs only in which content flavor its playbook builds.

  ADDITIVE BY DESIGN. Renders NOTHING unless .Values.showroom.shared.enabled is true, and touches no
  object showroom.yaml owns. Enabling it stands the shared cockpit up ALONGSIDE the per-user ones so
  the two can be compared on a live cluster before anything is retired.

  ── THE THREE MECHANISMS, each verified on cluster-m24jn 2026-08-14 ──────────────────────────────

  1. IDENTITY IN THE CONTENT — nginx sub_filter.
     The site is built ONCE with `user: __WS_USER__`, and nginx rewrites that sentinel to the
     authenticated username on every response. Verified against the real quay.io/rhpds/nginx:1.25
     (--with-http_sub_module is compiled in) that all four contexts substitute: body text, href
     attributes, id attributes, and <code> blocks — the last matters because click-to-run sends the
     block's text to the terminal, so the command an attendee runs carries their real username.
     Scale of the problem this avoids: 3295 occurrences of the identity in one rendered flavor, 114
     inside href/src and 5 inside id. A client-side DOM walk would have had to special-case
     attributes and anchors; a response-stream rewrite does not distinguish them, which is why it is
     the right layer.

  2. IDENTITY IN THE TERMINAL — ttyd -H + TTYD_USER, fed by the ACCESS TOKEN.
     ttyd forks an independent shell per websocket (not per pod), and in auth-proxy mode (-H) it
     exports the header value to that shell as TTYD_USER. `-H` takes exactly ONE header name
     (`-H, --auth-header  HTTP Header name for auth proxy` — read out of the running ttyd 1.7.7 on
     2026-08-16), so the header it carries is a CHOICE, and this cockpit spends it on
     X-Forwarded-Access-Token rather than X-Forwarded-User. The wrapper turns that token into a
     per-session kubeconfig and derives the name from `oc whoami`, so the shell acts as the real
     attendee for as long as the cluster says the token is good.

     WHY THE HEADER MOVED (defect found by the owner on a live cockpit, 2026-08-16). With
     `-H X-Forwarded-User` the terminal knew a NAME and held no credential, so `oc whoami` in it
     returned `system:serviceaccount:ogsr-showroom:showroom-shared` — the pod's own SA, which holds
     only system:auth-delegator. Reproduced here the same day: pods, secrets and projects all
     Forbidden. Not a privilege leak, a dead end: no `ws` verb works, because `ws` resolves the
     attendee from `oc whoami` (tools/ws/ws user_arg) and refuses to run without a login. The old
     wrapper's answer was to PRINT `oc login … -u $TTYD_USER` and let the human finish the job — an
     instruction, not an identity.

  3. THE FRONT DOOR — oauth-proxy as a REAL OAuthClient (was: as the ServiceAccount).
     A ServiceAccount-as-OAuth-client is SCOPE-CAPPED, and that cap is what forced this change.
     Measured on this cluster 2026-08-16, on the owner's own real logins:

         oc get oauthclientauthorizations -o custom-columns=CLIENT:.clientName,USER:.userName,SCOPES:.scopes
         system:serviceaccount:ogsr-showroom:showroom-shared   user6   [user:info user:check-access]
         system:serviceaccount:ogsr-showroom:showroom-shared   user7   [user:info user:check-access]

     `user:info user:check-access` is enough to say WHO you are and nothing else — a token minted
     under it cannot read a pod. Real OAuthClient objects on the same cluster (`console`,
     `openshift-cli-client`, `openshift-devspaces-client`) issue `user:full`, which is what `oc login`
     gets. So the SA-as-client had to be replaced by a real client for the terminal half to exist at
     all; the SA remains only as the pod's identity and the auth-delegator holder.

     THE NON-INVASIVE COST, PAID EXPLICITLY. An OAuthClient is CLUSTER-SCOPED — it outlives the
     namespace, which is exactly why the previous design refused one. It is therefore owner-labelled
     and its teardown is wired by hand, because nothing else would reach it: the client is created by
     the bootstrap hook below rather than by Argo (see the hook's own header for why), so the
     uninstall CASCADE cannot prune it. `bootstrap/ogsr-uninstall.sh` step 7 now sweeps
     `oauthclients.oauth.openshift.io` by owner label alongside cluster RBAC, and
     `bootstrap/ogsr-check-clean.sh` reports one while it remains (its cluster-scoped sweep is driven
     by live `oc api-resources --namespaced=false --verbs=list` discovery, which returns
     `oauthclients.oauth.openshift.io` — verified 2026-08-16 — and the hardcoded fallback list it
     uses when discovery fails now names it too).

  ── THE FAILURE MODE THIS GUARDS ─────────────────────────────────────────────────────────────────
  If the identity header is ever absent, a naive sub_filter replaces the sentinel with an EMPTY
  string and serves `ws prep agentic-ai --user  --yes` and `-dev` namespaces — corrupt commands, no
  error, HTTP 200. That is measured, as the negative control of the experiment above, and it is
  exactly the class of defect this project keeps paying for: correct in the source, broken in the
  artefact, reported as success. An empty identity is therefore refused with 503, never rendered.

  ── THE HAZARD THE TOKEN INTRODUCES, AND WHERE IT IS CONTAINED ───────────────────────────────────
  ttyd names its exported variable TTYD_USER whatever header feeds it, so on THIS cockpit TTYD_USER
  holds a live bearer token. Every path it could take is closed deliberately, and each one is worth
  naming because the previous wrapper took the first of them:

    * THE BANNER. The old wrapper printed `You are signed in as $TTYD_USER` into the login greeting —
      with this header that echoes a live credential to the screen, into scrollback, and into any
      terminal capture. The wrapper now copies TTYD_USER into a NON-EXPORTED local and `unset`s it on
      the second line; the banner names the user resolved from `oc whoami`.
    * THE PROCESS TABLE. Every session in this pod runs as the SAME uid (measured: 1002180000), so
      `ps eww` and /proc/<pid>/environ are readable across sessions. Unsetting TTYD_USER keeps the
      token out of the environment, and the token never reaches an argv: the kubeconfig is written by
      bash BUILTINS (echo into a redirect), never by `oc login --token=…`.
    * NGINX. `proxy_set_header X-Forwarded-Access-Token ""` on the CONTENT location — an empty value
      means nginx does not pass the header at all — so the token reaches the ttyd upstream and
      nothing else. oauth-proxy's request logging is off by default (`-request-logging`, verified in
      the running image) and nginx's access log format carries no arbitrary headers.
    * AT REST. Exactly one copy exists per attendee: $HOME/.kube/config, written 0600 under a 0700
      ~/.kube, replaced (not appended) on every connection. See the wrapper for the one thing file
      MODE cannot buy here — the homes PVC is shared and so is the uid.
*/ -}}
{{- if and .Values.showroom.enabled .Values.showroom.shared.enabled }}
{{- $ns := .Values.showroom.namespace }}
{{- $domain := .Values.clusterDomain }}
{{- $giteaHost := printf "gitea-%s.%s" .Values.giteaNamespace .Values.clusterDomain }}
{{- $mirrorUrl := printf "https://gitea-%s.%s/%s/%s.git" .Values.giteaNamespace .Values.clusterDomain .Values.mirrorOrg .Values.mirrorRepo }}
{{- $img := .Values.showroom.images }}
{{- /* Same derivation as showroom.yaml: a comma-joined scalar, because Argo cannot carry a list. */ -}}
{{- $disabledModules := list }}
{{- range $s := splitList "," (default "" .Values.modulesDisabledCSV) }}{{- if trim $s }}{{- $disabledModules = append $disabledModules (trim $s) }}{{- end }}{{- end }}
{{- $apiUrl := printf "https://api.%s:6443" (trimPrefix "apps." $domain) }}
{{- /*
     TWO INSTANCES, ONE DEFINITION. The attendee cockpit and the SA-Demos cockpit differ ONLY in
     which Antora playbook they build — the workshop flavor or the demo flavor (Say/Show/Do). They
     do NOT differ in identity: the owner's ruling (2026-08-14) is that an SA "picks one user and
     logs in with that one", exactly like an attendee, and does anything needing admin from their
     own terminal rather than this one.

     That ruling is what collapses the old second identity model. The shipped SA-Demos cockpit
     hardcodes `user: your-user` — a placeholder that is not an identity, which is why its 40
     `ws prep … --user {user}` pre-flights across 19 modules were unrunnable, while its banner
     hardcoded `-u user1` and would have WIPED a live attendee. Resolving identity from the login
     makes every one of those call sites correct as written, with no content edit at all.
*/ -}}
{{- $instances := list
      (dict "name" "showroom-shared"       "playbook" "showroom/site.yml"      "flavor" "workshop")
      (dict "name" "showroom-shared-demos" "playbook" "showroom/site-demo.yml" "flavor" "demo") }}
{{- range $inst := $instances }}
{{- $name := $inst.name }}
{{- $playbook := $inst.playbook }}
{{- $host := printf "%s-%s.%s" $name $ns $domain }}
{{- $clientId := printf "ogsr-%s" $name }}
{{- $clientSecretName := printf "%s-oauth-client" $name }}
{{- $redirectUri := printf "https://%s/oauth/callback" $host }}
---
# The pod's identity and the auth-delegator holder — NOT the OAuth client any more. The
# `serviceaccounts.openshift.io/oauth-redirectreference.primary` annotation was removed with the move
# to a real OAuthClient (see the header): it registered this SA as a client whose tokens are capped at
# `user:info user:check-access`, and leaving a registration nothing authenticates against is a stale
# grant rather than a spare tyre.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
# oauth-proxy validates tokens and SubjectAccessReviews through the API server, which needs the
# auth-delegator role. Cluster-scoped, therefore owner-labelled so teardown can find and remove it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ogsr-{{ $name }}-auth-delegator
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $ns }}
---
# ── OAUTH CLIENT BOOTSTRAP (SA + RBAC + Sync hook) ───────────────────────────────────────────────
#
# WHY A HOOK AND NOT A DECLARED OAuthClient. The client needs a SECRET, and a secret in a chart is a
# secret in git. Helm's `randAlphaNum` cannot help: Argo re-renders this chart on EVERY sync, so the
# value would be different every reconcile — a new secret mid-workshop invalidates every live login,
# and the app never converges. `lookup` is empty under Argo's `helm template` (values.yaml says so for
# showroom.ocpVersion, same reason). So the value has to be minted IN THE CLUSTER, once, and read back
# on every later sync — which is the established shape here: an idempotent Sync-phase hook Job, the
# same one console-plugins-enable.yaml uses to converge a shared cluster singleton.
#
# THE ALTERNATIVE THAT WAS REJECTED, and why. Argo could own the OAuthClient with the `secret` field
# simply OMITTED, letting this hook patch it in — a field absent from the desired manifest is absent
# from last-applied too, so the three-way diff should ignore it and Argo should stay Synced. "Should"
# is the problem. This repo's own rule is that diff questions are settled by a single-variable
# experiment on a real object, never by reasoning about diff internals, and that experiment cannot be
# run here (the live cockpit is serving a session; this lane does not mutate the cluster). The failure
# mode if the reasoning is wrong is not cosmetic red — selfHeal re-applies the manifest, the `secret`
# field goes empty, and EVERY attendee login breaks with no visible cause. Hook-owned has no such
# dependency, and its one real cost — the cascade cannot prune what Argo does not manage — is a cost
# that can be paid in full and verified: see the teardown wiring named in this file's header.
#
# SECRET IS THE SOURCE OF TRUTH, OAuthClient CONVERGES TO IT. The Job generates the value ONLY when
# the Secret is absent, and then makes OAuthClient.secret equal it on every run. That direction is
# what makes a deleted-and-recreated client (or a changed cluster domain, which changes redirectURIs)
# heal on the next sync without rotating a credential that live sessions still hold.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-oauth-bootstrap
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
# why: create/converge exactly ONE cluster-scoped OAuthClient — ours, by name. `create` is the only
# verb that cannot be resourceName-scoped (the object does not exist yet to be named), the same
# carve-out per-user-argo-rbac.yaml and console-plugins-enable.yaml document for their own creates.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ogsr-{{ $name }}-oauth-bootstrap
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: ["oauth.openshift.io"]
    resources: ["oauthclients"]
    verbs: ["get", "patch"]
    resourceNames: [{{ $clientId | quote }}]
  - apiGroups: ["oauth.openshift.io"]
    resources: ["oauthclients"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ogsr-{{ $name }}-oauth-bootstrap
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ogsr-{{ $name }}-oauth-bootstrap
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-oauth-bootstrap
    namespace: {{ $ns }}
---
# why: hold the generated client secret in ONE namespaced Secret, by name. `patch` is for the owner
# labels the Job stamps after creating it; there is deliberately no `list` and no `delete` — a hook
# that cannot enumerate secrets cannot read another component's, and one that cannot delete cannot
# rotate a credential live sessions are still using.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-oauth-bootstrap
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
    resourceNames: [{{ $clientSecretName | quote }}]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-oauth-bootstrap
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-oauth-bootstrap
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-oauth-bootstrap
    namespace: {{ $ns }}
---
# Argo Sync hook at wave 2 — AFTER the wave-1 RBAC above exists, BEFORE the wave-3 Deployment that
# mounts the Secret this Job creates. A pod cannot start on a missing secret volume, so this ordering
# is load-bearing, not tidiness. BeforeHookCreation so it re-runs (and re-converges) every sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-oauth-bootstrap
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: {{ $name }}-oauth-bootstrap
        workshop.redhat.com/layer: workshop-config
    spec:
      serviceAccountName: {{ $name }}-oauth-bootstrap
      restartPolicy: Never
      containers:
        - name: bootstrap
          # Digest-pinned ose-cli-rhel9, the same reference every other hook Job in this chart uses.
          # `oc` OOMs at 256Mi, hence the 512Mi limit (repo-wide hard-won fact).
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22@sha256:f8bbc73242af3eae3f8361a9611b29384d3577dba4d5e5b62f4beb2750862c19
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: 300m, memory: 512Mi}
          env:
            - name: NS
              value: {{ $ns | quote }}
            - name: SECRET_NAME
              value: {{ $clientSecretName | quote }}
            - name: CLIENT_ID
              value: {{ $clientId | quote }}
            - name: REDIRECT_URI
              value: {{ $redirectUri | quote }}
          volumeMounts:
            # Memory-backed: the plaintext client secret touches this filesystem and nothing else, and
            # a tmpfs never reaches a disk or a node-local layer. Same choice as the credential handoff
            # in the entry-state hooks.
            - name: scratch
              mountPath: /scratch
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              ok()   { echo "✅ $*"; }
              info() { echo "▶ $*"; }
              err()  { echo "❌ $*" >&2; }
              die()  { err "$*"; exit 1; }

              # NOTHING in this script echoes the client secret. It exists in three places only: a
              # shell variable, a 0600 file on the tmpfs below, and the two API objects it belongs in.
              TMPD="$(mktemp -d /scratch/oauth.XXXXXXXX)"
              chmod 0700 "$TMPD"
              trap 'rm -rf "$TMPD"' EXIT
              umask 077

              mint_into() {  # $1 = path — draw a fresh client secret. Never printed, never an argv.
                local raw gen=""
                for _ in 1 2 3 4 5; do
                  # head is FIRST in the pipeline and base64 LAST, so nothing can take SIGPIPE under
                  # `pipefail`; the alnum filter and the length trim are then done without a pipe.
                  raw="$(head -c 48 /dev/urandom | base64)"
                  gen="$(printf '%s' "$raw" | tr -dc 'A-Za-z0-9')"
                  gen="${gen:0:48}"
                  if [[ "${#gen}" -ge 32 ]]; then break; fi
                done
                [[ "${#gen}" -ge 32 ]] || die "could not draw a 32+ character client secret from /dev/urandom in 5 attempts"
                printf '%s' "$gen" > "$1"
                return 0
              }

              # THE ONE THING THIS FUNCTION MUST NEVER DO is mint a replacement for a secret that
              # already exists — every live attendee session is signed out the moment the value moves.
              # So "absent" has to be PROVEN, not inferred from a failed read: an existence probe that
              # swallows stderr cannot tell NotFound from a timed-out etcd, and both look like absent.
              # Three layers, because one is not enough:
              #   1. the read distinguishes NotFound from every other error, and only NotFound mints;
              #   2. `oc create` (never `apply`, never `patch`) means even a wrong "absent" verdict
              #      collides with AlreadyExists instead of overwriting;
              #   3. that collision is handled by RE-READING, so a genuine race between two syncs
              #      converges on the value that won rather than failing the Job.
              # NOTE for anyone editing: no branch here may end a function with `cond && cmd` — this
              # repo has already paid for that shape (an AND-list as a function's last statement
              # returns 1 and `set -e` kills the script). Every path below is an explicit return/die.
              resolve_client_secret() {
                local i out
                for i in 1 2 3; do
                  if out="$(oc get secret "$SECRET_NAME" -n "$NS" -o jsonpath='{.data.clientSecret}' 2>"$TMPD/err")"; then
                    [[ -n "$out" ]] || die "secret ${NS}/${SECRET_NAME} exists but has no clientSecret key — refusing to mint a replacement, because that would sign every live session out. fix: oc delete secret ${SECRET_NAME} -n ${NS} && re-sync workshop-config"
                    # printf is a bash BUILTIN, so the value never becomes an argv another process can read.
                    printf '%s' "$out" | base64 -d > "$TMPD/clientSecret"
                    ok "reusing the client secret already in ${NS}/${SECRET_NAME} (never regenerated on a re-sync — a new value would sign out every live session)"
                    return 0
                  fi
                  grep -qiE 'notfound|not found' "$TMPD/err" \
                    || die "cannot read secret ${NS}/${SECRET_NAME}: $(tr '\n' ' ' < "$TMPD/err") — this is NOT read as 'absent', so nothing is minted; the Job will retry"
                  info "no client secret yet — minting one for OAuthClient/${CLIENT_ID} (attempt ${i}/3)"
                  mint_into "$TMPD/clientSecret"
                  if oc create secret generic "$SECRET_NAME" -n "$NS" \
                       --from-file=clientSecret="$TMPD/clientSecret" 2>"$TMPD/err" >/dev/null; then
                    ok "created secret ${NS}/${SECRET_NAME} (value not printed, here or anywhere)"
                    return 0
                  fi
                  grep -qiE 'alreadyexists|already exists' "$TMPD/err" \
                    || die "cannot create secret ${NS}/${SECRET_NAME}: $(tr '\n' ' ' < "$TMPD/err")"
                  info "another sync created it first — discarding the value just drawn and re-reading theirs"
                done
                die "could not resolve the client secret in 3 attempts — see the errors above"
              }
              resolve_client_secret

              oc label secret "$SECRET_NAME" -n "$NS" --overwrite \
                workshop.redhat.com/layer=workshop-config \
                workshop.redhat.com/owner=ogsr >/dev/null

              # $(<file) is a bash builtin read — no `cat`, no extra process.
              CS_VAL="$(<"$TMPD/clientSecret")"
              [[ -n "$CS_VAL" ]] || die "client secret file is empty after ${NS}/${SECRET_NAME} was read/created"
              {
                echo 'apiVersion: oauth.openshift.io/v1'
                echo 'kind: OAuthClient'
                echo 'metadata:'
                echo "  name: ${CLIENT_ID}"
                echo '  labels:'
                # Owner label = how bootstrap/ogsr-uninstall.sh finds this cluster-scoped object, and
                # how ogsr-check-clean.sh reports it while it is still there. Without it the workshop
                # leaves a permanent trace on a customer cluster.
                echo '    workshop.redhat.com/layer: workshop-config'
                echo '    workshop.redhat.com/owner: ogsr'
                echo 'grantMethod: auto'
                echo 'redirectURIs:'
                echo "  - ${REDIRECT_URI}"
                echo "secret: ${CS_VAL}"
              } > "$TMPD/oauthclient.yaml"
              chmod 0600 "$TMPD/oauthclient.yaml"
              unset CS_VAL

              if oc get oauthclients.oauth.openshift.io "$CLIENT_ID" >/dev/null 2>&1; then
                # --patch-file, NOT -p: a -p body is an argv, and this body carries the secret.
                oc patch oauthclients.oauth.openshift.io "$CLIENT_ID" \
                  --type=merge --patch-file "$TMPD/oauthclient.yaml" >/dev/null
                ok "converged OAuthClient/${CLIENT_ID} → redirect ${REDIRECT_URI}, grantMethod auto, secret == ${NS}/${SECRET_NAME}"
              else
                # `oc create`, not `oc apply`: apply would store the whole body — secret included — in
                # a last-applied annotation on a cluster-scoped object, a second copy nothing needs.
                oc create -f "$TMPD/oauthclient.yaml" >/dev/null
                ok "created OAuthClient/${CLIENT_ID} → redirect ${REDIRECT_URI}, grantMethod auto"
              fi

              # Readiness assertion consumable by `ws doctor`/CI: prove the two agree WITHOUT printing
              # either. Compare hashes, not values.
              LIVE_H="$(oc get oauthclients.oauth.openshift.io "$CLIENT_ID" -o jsonpath='{.secret}' | sha256sum | cut -d' ' -f1)"
              FILE_H="$(sha256sum < "$TMPD/clientSecret" | cut -d' ' -f1)"
              [[ "$LIVE_H" == "$FILE_H" ]] || die "OAuthClient/${CLIENT_ID}.secret does not match ${NS}/${SECRET_NAME} after converging — every login would fail. fix: oc delete oauthclient ${CLIENT_ID} && re-sync workshop-config"
              ok "OAuthClient/${CLIENT_ID} and ${NS}/${SECRET_NAME} agree (sha256 compared, neither value printed)"
      volumes:
        - name: scratch
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
---
# The serving-cert annotation makes the service CA mint the TLS pair oauth-proxy listens with, so the
# Route can be reencrypt and no certificate is ever committed to this repo.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    service.beta.openshift.io/serving-cert-secret-name: {{ $name }}-tls
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ $name }}
  ports:
    - name: https
      port: 8443
      targetPort: 8443
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # Terminal websockets idle for long stretches while an attendee reads. Both timeouts are needed —
    # the tunnel one is what actually keeps an upgraded connection alive.
    haproxy.router.openshift.io/timeout: 1h
    haproxy.router.openshift.io/timeout-tunnel: 1h
spec:
  host: {{ $host }}
  to:
    kind: Service
    name: {{ $name }}
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-proxy
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  nginx.conf: |
    events {}
    error_log /dev/stdout info;
    http {
      include /etc/nginx/mime.types;
      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }
      # An absent identity must never reach sub_filter — see the header. 1 = refuse.
      map $http_x_forwarded_user $ws_identity_missing {
        default 0;
        ''      1;
      }
      server {
        listen 8080;
        absolute_redirect off;
        location / {
          if ($ws_identity_missing) {
            return 503 "cockpit: no authenticated identity (X-Forwarded-User absent) - refusing to serve content with an empty username";
          }
          proxy_pass http://127.0.0.1:8000;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          # THE CONTENT UPSTREAM MUST NOT SEE THE TOKEN. nginx forwards the client's headers to a
          # proxied server by default, so oauth-proxy's X-Forwarded-Access-Token would reach the
          # content container for free. An EMPTY proxy_set_header value means the field is not passed
          # at all — that is nginx's documented behaviour and the whole point of this line. The token
          # is needed by exactly one upstream (ttyd, below) and goes to exactly that one.
          proxy_set_header X-Forwarded-Access-Token "";
          # sub_filter cannot rewrite a compressed body. The content service is Python SimpleHTTP and
          # sends none today (measured: Content-type text/html, no Content-Encoding), but asking for
          # identity encoding costs nothing and makes this independent of that image's behaviour.
          proxy_set_header Accept-Encoding "";
          sub_filter '__WS_USER__' $http_x_forwarded_user;
          sub_filter_once off;
          # Default is text/html only; the built site also carries the identity inside .js and .json
          # (search index, nookbag config), and a half-substituted site is worse than none.
          sub_filter_types *;
        }
        location = /tty-top { return 302 /tty-top/; }
        location /tty-top/ {
          proxy_pass http://127.0.0.1:7681/;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_read_timeout 43200000;
          proxy_set_header Host $http_host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          # ttyd reads ONE header (-H) and this is it: the attendee's OAuth access token, which the
          # session wrapper turns into a per-session kubeconfig. Both are set explicitly because
          # proxy_pass rewrites Host and Connection and these must survive that.
          proxy_set_header X-Forwarded-Access-Token $http_x_forwarded_access_token;
          proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        }
        location = /tty-bottom { return 302 /tty-bottom/; }
        location /tty-bottom/ {
          proxy_pass http://127.0.0.1:7681/;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_read_timeout 43200000;
          proxy_set_header Host $http_host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Access-Token $http_x_forwarded_access_token;
          proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        }
      }
    }
---
# Build-time attributes for the ONE build. Every environment value is real; only the identity is a
# sentinel, because it is the only one that differs per reader.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-userdata
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  user_data.yml: |
{{- include "workshop-config.showroomUserData" (dict "user" "__WS_USER__" "domain" $domain "giteaHost" $giteaHost "disabledModules" $disabledModules "root" $) }}
---
# One home per authenticated user, as subdirectories of one claim: the per-user cockpits take one
# PVC each, this takes one for the whole cohort.
#
# SAME sync-wave as the Deployment (3), NOT earlier — the identical rule showroom.yaml states for
# showroom-home-{user}, and this file got it wrong. The default StorageClass on RHDP clusters is
# WaitForFirstConsumer, so this PVC stays Pending until its consuming pod is SCHEDULED. At wave 2
# Argo waits for a wave-2 resource to go Healthy before creating anything in wave 3 — so it waits
# for a PVC that cannot bind until the wave-3 Deployment it is waiting to create actually exists.
# That is a permanent deadlock, and it does not look like one: the Application sits
# Progressing/Running with the honest-but-unhelpful message
#     waiting for healthy state of /PersistentVolumeClaim/{{ $name }}-homes
# and NOTHING is ever created. Measured on cluster-m24jn 2026-08-15: 52 minutes, zero pods.
# Nothing about a Pending PVC is reported as an error, which is why this reads as a slow sync.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-homes
  namespace: {{ $ns }}
  labels:
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ $.Values.showroom.shared.homesStorage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/instance: {{ $name }}
    workshop.redhat.com/layer: workshop-config
    {{- include "workshop-config.ownerLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  # One RWO claim holds every home, so two pods could never both mount it. Recreate states that
  # instead of letting a rollout wedge on an attach that cannot succeed.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $name }}
        workshop.redhat.com/layer: workshop-config
    spec:
      serviceAccountName: {{ $name }}
      initContainers:
        # 1) Clone the in-cluster monorepo mirror (public repo, valid RHDP wildcard cert → no auth).
        - name: content-clone
          image: {{ $img.gitCloner | quote }}
          env:
            - name: GIT_REPO_URL
              value: {{ $mirrorUrl | quote }}
            - name: GIT_REPO_REF
              value: {{ $.Values.showroom.contentRef | quote }}
            - name: CLONE_DIR
              value: /showroom/repo
          volumeMounts:
            - name: showroom-files
              mountPath: /showroom/repo
              subPath: repo
        # 2) Build the site ONCE, with __WS_USER__ standing in for the reader's identity.
        - name: antora-build
          image: {{ include "workshop-config.antoraImage" $ | quote }}
          # Explicit, not relied-upon-by-default — see showroom.yaml's note: the helper's tag is
          # :latest, and a later pin would silently flip this to IfNotPresent and reintroduce the
          # stale-cockpit-build bug.
          imagePullPolicy: Always
          env:
            - name: FILES_DIR
              value: /showroom/repo
            - name: OUTPUT_DIR
              value: /showroom/www
            - name: ANTORA_SITE_FILE
              value: {{ $playbook | quote }}
          volumeMounts:
            - name: showroom-files
              mountPath: /showroom/repo
              subPath: repo
            - name: showroom-files
              mountPath: /showroom/www
              subPath: www
            - name: userdata
              mountPath: /user_data/
        # 3) Only the homes ROOT is prepared. Which users will sign in is unknowable here, and
        #    pre-creating N homes would re-encode the per-user assumption this template removes —
        #    the session wrapper creates a home on first connection instead.
        - name: homes-prep
          image: {{ $img.terminal | quote }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              mkdir -p /homes
              # NO chmod. Under restricted-v2 the PVC is mounted root-owned but group-owned by the
              # namespace's fsGroup, which the container already runs as — so it is ALREADY writable,
              # and chmod on a directory this UID does not own is refused. Measured 2026-08-14:
              # "chmod: changing permissions of '/homes': Operation not permitted", rc 11, uid
              # 1002200000 / fsGroup 1002200000 on OCP 4.22. Assert the property we need instead of
              # trying to impose one we cannot.
              test -w /homes || { echo "FATAL: /homes not writable by uid $(id -u) — per-session homes cannot be created"; exit 1; }
              echo "✅ shared homes root ready (writable by uid $(id -u))"
          volumeMounts:
            - name: homes
              mountPath: /homes
      containers:
        # ── the front door. Every other container listens on loopback only. ──
        - name: oauth-proxy
          image: {{ $img.oauthProxy | quote }}
          ports:
            - name: https
              containerPort: 8443
          # The cookie secret is minted per pod start rather than stored. There is ONE replica with a
          # Recreate strategy, so a restart already invalidates every session — persisting a secret
          # would buy nothing and would put a credential in the repo or in Argo's diff.
          #
          # NO --openshift-sar, and that is deliberate. The obvious-looking guard
          #   --openshift-sar={"namespace":"<showroom-ns>","resource":"services","verb":"get"}
          # LOCKS OUT EVERY ATTENDEE. Measured 2026-08-14:
          #   oc auth can-i get services -n ogsr-showroom --as=user1 --as-group=workshop-attendees → no
          #   oc auth can-i get services -n user1-dev     --as=user1 --as-group=workshop-attendees → yes
          # Attendees hold rights in their OWN namespaces and deliberately none in the showroom
          # namespace ("attendees never touch this namespace directly" — showroom.yaml). A SAR names
          # ONE static namespace, so it cannot express "their own namespace, whoever they are", and
          # any namespace we could name is one they have no rights in. The bar is therefore
          # authentication itself: a signed-in cluster user reaches the cockpit. Against the model
          # this replaces — no authentication whatsoever, a live root-capable shell to anyone holding
          # the URL — that is the whole of the fix, and a broken SAR would have been a worse outcome
          # than none, because it fails CLOSED on the exact people the workshop is for.
          command: ["/bin/bash", "-c"]
          args:
            - |
              exec /usr/bin/oauth-proxy \
                --https-address=:8443 \
                --http-address= \
                --provider=openshift \
                --client-id={{ $clientId }} \
                --client-secret-file=/etc/oauth/client-secret \
                --redirect-url={{ $redirectUri }} \
                --scope="user:full" \
                --upstream=http://127.0.0.1:8080 \
                --tls-cert=/etc/tls/private/tls.crt \
                --tls-key=/etc/tls/private/tls.key \
                --cookie-secret="$(head -c 32 /dev/urandom | base64 | head -c 32)" \
                --cookie-expire=24h \
                --cookie-refresh=4h \
                --pass-access-token=true \
                --pass-user-headers=true
          # Every flag above was read out of THIS image's own `--help` on 2026-08-16, not recalled:
          #   -client-id string / -client-secret-file string "a file containing the client-secret"
          #   -scope string "OAuth scope specification"
          #   -pass-access-token "pass OAuth access_token to upstream via X-Forwarded-Access-Token"
          #   -pass-user-headers "pass X-Forwarded-User and X-Forwarded-Email information to upstream"
          # --client-secret-FILE, never --client-secret: a flag value is an argv, and an argv is
          # readable from the process table. --openshift-service-account is GONE — it is the flag that
          # capped every issued token at `user:info user:check-access` (see the header's measurement).
          # --redirect-url is pinned rather than derived per-request so the value oauth-proxy SENDS is
          # textually the value the OAuthClient REGISTERS; -proxy-prefix defaults to "/oauth", which
          # is where the "/oauth/callback" in both strings comes from.
          # --pass-user-headers STAYS: X-Forwarded-User is what the nginx sub_filter rewrites the
          # __WS_USER__ sentinel with, and that half is verified working with two concurrent logins.
          #
          # --cookie-refresh AND --cookie-expire ARE NOT TUNING. THEY ARE WHY THE TOKEN ARRIVES.
          # First deploy of this design had neither, and every terminal opened, printed the wrapper's
          # "sign-in has expired" and closed — the token never reached ttyd. What was eliminated first,
          # each by measurement rather than by reading, so nobody repeats the search:
          #   * the wrapper           — run by hand in the pod: refuses correctly with no token,
          #                             reports expiry with a bad one. Correct.
          #   * API reachability      — /version from inside the terminal container: 200, and a token
          #                             authenticates there. Correct.
          #   * nginx forwarding      — proxy_set_header X-Forwarded-Access-Token is present in BOTH
          #                             /tty-*/ locations. Correct.
          #   * ttyd's -H check       — probed through nginx with the header and without it: accepted
          #                             BOTH (101), and neither probe added a "denied connection" line.
          #                             So the deny lines in its log are NOT the auth header.
          # What was left was oauth-proxy's own startup line:
          #     Cookie settings: name:_oauth_proxy ... expiry:168h0m0s ... refresh:DISABLED
          # With refresh disabled the session cookie carries identity but not the access token, so on
          # every request AFTER the OAuth exchange there is no token for --pass-access-token to pass —
          # which is exactly why X-Forwarded-User kept working while X-Forwarded-Access-Token did not.
          # The proxy's own log says the token exists at exchange time ("Session{user6 token:true}")
          # and that is the trap: the token is real, it just is not carried forward.
          # 4h is comfortably inside the cluster's 24h token life so a refresh has something to
          # validate, and 24h expiry stops a session cookie outliving the token it represents — the
          # default 168h let a dead session look alive for six days.
          #
          # DIAGNOSING THIS AGAIN: do NOT patch this ConfigMap to add logging. nginx.conf is mounted
          # with subPath, so a ConfigMap edit NEVER reaches the container, and Argo's selfHeal reverts
          # it regardless. Read the proxy's startup "Cookie settings:" line instead — it states the
          # refresh setting outright.
          volumeMounts:
            - name: tls
              mountPath: /etc/tls/private
            - name: oauth-client
              mountPath: /etc/oauth
              readOnly: true
        - name: nginx
          image: {{ $img.nginx | quote }}
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-pid
              mountPath: /var/run
        - name: content
          image: {{ $img.content | quote }}
          imagePullPolicy: IfNotPresent
          env:
            # These four are NOT optional: without ANTORA_PLAYBOOK the content image looks for
            # site.yml at the repo root and dies with "No Antora playbook found" (measured
            # 2026-08-14 — omitting them CrashLoops this container while nginx and oauth-proxy stay
            # happily Ready, so the pod reads 2/4 and the cockpit serves nothing).
            - name: GIT_REPO_URL
              value: {{ $mirrorUrl | quote }}
            - name: GIT_REPO_REF
              value: {{ $.Values.showroom.contentRef | quote }}
            - name: ANTORA_PLAYBOOK
              value: {{ $playbook | quote }}
            - name: DOMAIN
              value: {{ $domain | quote }}
            - name: ZT_UI_ENABLED
              value: "true"
            - name: ZT_BUNDLE
              value: {{ $.Values.showroom.nookbagBundle | quote }}
            - name: SHOWROOM_UI_CONFIG
              value: |
                ---
                type: showroom
                default_width: 45
                persist_url_state: true
                view_switcher:
                  enabled: true
                  default_mode: split
                antora:
                  name: modules
                tabs:
                  - name: Terminal 1
                    secondary_name: Terminal 2
                    type: double-terminal
                  # External launchers, not iframes — see showroom.yaml for the full reasoning: every
                  # one of these tools sends a frame-blocking header, and embedding them would need a
                  # cluster-wide IngressController rewrite or per-tool frame-ancestors config, both of
                  # which change cluster behaviour the workshop must not touch.
                  - name: OCP Console
                    url: https://console-openshift-console.{{ $domain }}
                    external: true
                  - name: Gitea
                    url: https://{{ $giteaHost }}
                    external: true
                  - name: Dev Spaces
                    url: https://devspaces.{{ $domain }}
                    external: true
                  - name: Argo CD
                    url: https://student-gitops-server-student-gitops.{{ $domain }}
                    external: true
                  - name: Dev Hub
                    url: https://backstage-developer-hub-rhdh.{{ $domain }}
                    external: true
                  - name: SonarQube
                    url: https://sonarqube-sonarqube.{{ $domain }}
                    external: true
                  - name: Migration Toolkit
                    url: https://mta-openshift-mta.{{ $domain }}
                    external: true
          volumeMounts:
            - name: userdata
              mountPath: /user_data/
            - name: showroom-files
              mountPath: /showroom/repo
              subPath: repo
            - name: showroom-files
              mountPath: /showroom/www
              subPath: www
        - name: terminal
          image: {{ $img.terminal | quote }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              # The wrapper ttyd execs per websocket. TTYD_USER is set by ttyd from the -H header, so
              # this is the ONLY place the connecting attendee's identity is known — the pod itself
              # has no single user, which is the whole point.
              #
              # ON THIS COCKPIT TTYD_USER IS A BEARER TOKEN, NOT A NAME. ttyd names that variable
              # after its own flag, whatever header feeds it, and -H here carries
              # X-Forwarded-Access-Token. Read the header block for the full leak inventory; the four
              # rules the generated wrapper obeys are:
              #   1. copy it to a NON-EXPORTED local and `unset TTYD_USER` on the next line, so it is
              #      gone from the environment before anything else runs — /proc/<pid>/environ is
              #      readable by every other session in this pod (all of them run as the same uid).
              #   2. never echo it, never let it become an argv (kubeconfig written by builtins).
              #   3. one copy at rest, 0600, under 0700 ~/.kube, replaced per connection.
              #   4. the banner names `oc whoami`, never the variable.
              #
              # WHAT MODE 0600 DOES *NOT* BUY, stated plainly because it looks like it does. /homes is
              # `drwxrwsr-x root:1002180000` and every session in this pod runs as uid 1002180000
              # (measured on the live pod, 2026-08-16) — so the OWNER of every kubeconfig here is the
              # same uid as every other attendee's shell. 0600 removes group and other, which is
              # correct hygiene against any other uid, and it does NOT isolate attendee from attendee:
              # `cat /homes/userN/.kube/config` works from any session. That is a property of one pod
              # shared by a cohort, not of this file, and it is reported to the PM rather than papered
              # over here. What this wrapper CAN do it does: nothing is in the environment, nothing is
              # in a process argument, and there is one file rather than one per connection.
              #
              # ECHO LINES, NOT A HEREDOC — and /tmp, not /usr/local/bin. Both learned the hard way
              # on 2026-08-14. A quoted heredoc delimiter must sit at column 0, which is impossible
              # inside this indented YAML block scalar: bash never closes the heredoc and instead
              # tries to EXECUTE the following lines, which surfaces as the baffling
              # "/bin/bash: line 5: /usr/local/bin/ws-session: Permission denied". showroom-demos.yaml
              # carries the same warning; this is the second time the trap has been paid for. /usr/local/bin
              # is also not writable by the random restricted-v2 UID, so the wrapper lives in /tmp.
              #
              # Single-quoted echoes keep every $VAR literal — they must expand in the ATTENDEE's
              # shell at connection time, not in this container's shell at pod start. The one value
              # that IS resolved here is the API URL, which Helm knows and the shell cannot; it is the
              # ONLY double-quoted generator line below, and it contains no $ of its own.
              #
              # THE GENERATED WRAPPER RUNS WITHOUT `set -e`, deliberately. A session wrapper that dies
              # on a benign non-zero closes the attendee's terminal with no message at all, which is a
              # worse outcome than the non-zero. `-u` and `pipefail` stay; everything that must not
              # fail silently is checked explicitly and prints its own ❌.
              {
                echo '#!/bin/bash'
                echo 'set -uo pipefail'
                echo 'umask 077'
                echo '# Rule 1: token out of the environment before anything else can read it.'
                echo '_tok="${TTYD_USER:-}"'
                echo 'unset TTYD_USER'
                echo "WS_API='{{ $apiUrl }}'"
                echo 'if [ -z "$_tok" ]; then'
                echo '  echo "No authenticated identity on this connection — refusing to open a shell."'
                echo '  echo "Reach this terminal through the cockpit URL so the front door can identify you."'
                echo '  exec sleep 10'
                echo 'fi'
                echo '# Bootstrap kubeconfig, written by BUILTINS into a 0600 mktemp file: no `oc login'
                echo '# --token=…`, because a flag value is visible in the process table to every other'
                echo '# session in this pod. HOME cannot be known yet — it is derived from the identity'
                echo '# this file is what proves — so the first write lands outside the shared PVC.'
                echo '_kc="$(mktemp /tmp/.ws-kube.XXXXXXXXXX)" || { echo "❌ cannot create a session kubeconfig"; exec sleep 10; }'
                echo 'chmod 0600 "$_kc"'
                echo '{'
                echo '  echo "apiVersion: v1"'
                echo '  echo "kind: Config"'
                echo '  echo "clusters:"'
                echo '  echo "- name: ogsr"'
                echo '  echo "  cluster:"'
                echo '  echo "    server: $WS_API"'
                echo '  echo "    insecure-skip-tls-verify: true"'
                echo '  echo "contexts:"'
                echo '  echo "- name: ogsr"'
                echo '  echo "  context:"'
                echo '  echo "    cluster: ogsr"'
                echo '  echo "    user: ogsr"'
                echo '  echo "current-context: ogsr"'
                echo '  echo "users:"'
                echo '  echo "- name: ogsr"'
                echo '  echo "  user:"'
                echo '  echo "    token: $_tok"'
                echo '} > "$_kc"'
                echo '# The name comes from the CLUSTER, never from a header we could be fed. This is'
                echo '# also the expiry probe: a dead token cannot answer whoami.'
                echo 'WS_USER="$(KUBECONFIG="$_kc" oc whoami 2>/dev/null || true)"'
                echo 'if [ -z "$WS_USER" ]; then'
                echo '  rm -f "$_kc"; unset _tok'
                echo '  echo'
                echo '  echo "  Your cockpit sign-in has expired."'
                echo '  echo "  Reload the cockpit page in your browser to sign in again, then reopen"'
                echo '  echo "  this terminal. (Sessions last as long as the cluster allows — 24h by default.)"'
                echo '  echo'
                echo '  exec sleep 15'
                echo 'fi'
                echo '# $HOME is built from this string, so anything that is not a plain name is refused'
                echo '# rather than turned into a path. htpasswd names are plain; an OIDC identity need'
                echo '# not be, and "../.." must never become a home directory.'
                echo 'case "$WS_USER" in'
                echo '  *[!A-Za-z0-9._@-]* | .* | -* )'
                echo '    rm -f "$_kc"; unset _tok'
                echo '    echo "❌ the cluster returned a username this cockpit will not turn into a home directory."'
                echo '    echo "   Ask your instructor — the shared cockpit expects plain workshop usernames."'
                echo '    exec sleep 15 ;;'
                echo 'esac'
                echo 'export HOME="/homes/${WS_USER}"'
                echo 'mkdir -p "$HOME/.kube" "$HOME/.bashrc.d" || { echo "❌ cannot create ${HOME}"; rm -f "$_kc"; exec sleep 10; }'
                echo 'chmod 0700 "$HOME/.kube"'
                echo '# Copy-then-rename INSIDE ~/.kube so the swap is an atomic same-filesystem rename:'
                echo '# a second tab connecting at the same moment can never read a half-written config.'
                echo 'cp -f "$_kc" "$HOME/.kube/.config.$$" && chmod 0600 "$HOME/.kube/.config.$$" \'
                echo '  && mv -f "$HOME/.kube/.config.$$" "$HOME/.kube/config" \'
                echo '  || { echo "❌ cannot write ${HOME}/.kube/config"; rm -f "$_kc" "$HOME/.kube/.config.$$"; exec sleep 10; }'
                echo 'rm -f "$_kc"'
                echo '# Last reference to the token in this shell. It was never exported, so the bash we'
                echo '# exec below would not have inherited it either way — this is belt and braces.'
                echo 'unset _tok'
                echo 'export KUBECONFIG="$HOME/.kube/config"'
                echo 'export WS_USER'
                echo 'cd "$HOME"'
                echo '# ws on PATH, from the clone the content build already made. The attendee'
                echo '# cockpit clones the repo into each home; here one clone at /showroom/repo is'
                echo '# mounted read-only and shared by every session, so N logins do not mean N'
                echo '# clones. This is what makes an SA "just another workshop user" — the owner'
                echo '# ruling is same identity, same tools, and every demo pre-flight is ws prep.'
                echo 'export PATH="$PATH:/showroom/repo/tools/ws"'
                echo 'oc project "${WS_USER}-dev" >/dev/null 2>&1 || true'
                echo '# Printed HERE, not seeded into ~/.bashrc.d. The wrapper already runs exactly'
                echo '# once per websocket, which is the once-per-session semantics the old'
                echo '# OGSR_BANNER_SHOWN guard was imitating — and a fresh /homes/<user> has no'
                echo '# ~/.bashrc, so nothing was sourcing that drop-in in the first place.'
                echo 'echo'
                echo 'echo "  You are signed in as ${WS_USER} — this shell is already logged in to the cluster."'
                echo 'echo "  Try: oc whoami   ·   ws prep <module>"'
                echo 'echo'
                echo 'echo "  If a command comes back Unauthorized, your sign-in has expired: reload the"'
                echo 'echo "  cockpit page in your browser, then reopen this terminal."'
                echo 'echo'
                echo 'echo "  Anything needing cluster-admin belongs in your OWN terminal, not this one."'
                echo 'echo'
                echo 'exec /usr/bin/bash'
              } > /tmp/ws-session
              chmod 0755 /tmp/ws-session
              # -H is what populates TTYD_USER, and it takes exactly ONE header — spent here on the
              # access token, because a name without a credential is the defect this replaces. -W keeps
              # the terminal writable. No -c: authentication is the front door's job, and a second
              # password here would only be theatre.
              exec /usr/bin/ttyd -p 7681 -i 0.0.0.0 -W -H X-Forwarded-Access-Token /tmp/ws-session
          resources:
            {{- toYaml $.Values.showroom.terminalResources | nindent 12 }}
          volumeMounts:
            - name: homes
              mountPath: /homes
            # Read-only, and the SAME clone the content build used — so `ws` on an attendee's PATH
            # is always the revision their instructions were rendered from. A second clone could
            # drift from the page the reader is looking at, which is the bug class this repo keeps
            # paying for.
            - name: showroom-files
              mountPath: /showroom/repo
              subPath: repo
              readOnly: true
      volumes:
        - name: showroom-files
          emptyDir: {}
        - name: userdata
          configMap:
            name: {{ $name }}-userdata
        - name: nginx-config
          configMap:
            name: {{ $name }}-proxy
            defaultMode: 420
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-pid
          emptyDir: {}
        - name: tls
          secret:
            secretName: {{ $name }}-tls
        # Created by the wave-2 bootstrap hook above, not by Argo — so this Deployment (wave 3) is
        # ordered after it on purpose: a pod cannot start on a secret volume that does not exist.
        #
        # 288 = 0440, and the 40 is MEASURED, not chosen for looking strict. A projected secret file
        # under restricted-v2 is owned `root:<fsGroup>` while the container runs as a non-root uid
        # that holds fsGroup as a SUPPLEMENTARY group — read live on this pod 2026-08-16:
        #     uid=1002180000 gid=0(root) groups=0(root),1002180000
        #     -rw-r--r--. 1 0 1002180000  tls.crt
        # so the process is never the file's OWNER and reaches it through the GROUP bit. 0400 (owner
        # only) would therefore have made the client secret unreadable and crash-looped oauth-proxy on
        # a file it can see; 0440 is the tightest mode that is still readable, and it is tighter than
        # the 0644 default the sibling tls volume gets. One item, so the volume exposes the single key
        # oauth-proxy needs and nothing else the Secret might grow later.
        - name: oauth-client
          secret:
            secretName: {{ $clientSecretName }}
            defaultMode: 288
            items:
              - key: clientSecret
                path: client-secret
        - name: homes
          persistentVolumeClaim:
            claimName: {{ $name }}-homes
{{- end }}{{/* range $instances */}}
{{- end }}
