apiVersion: v2
name: workshop-config
description: "Workshop layer: attendee users, platform-observer RBAC, per-user namespaces/quotas, entry-state AppProject, htpasswd IdP, and Gitea user seeding. One Argo CD Application (helm params userCount, clusterDomain)."
type: application
# 0.3.5: BOTH cockpit Deployments gain a checksum/user-data pod-template annotation over their own
# user_data.yml, so an attribute change actually reaches a reader. It is the missing half of 0.3.4
# and 0.1.28: a cockpit builds its content at POD INIT (the antora-build initContainer reads
# /user_data/user_data.yml), so wiring maas_model and cluster_ocp_version put the values in a
# ConfigMap that nothing restarted — they sat there, correct and unread, with Argo, `ws git-refresh`
# and `helm template` all reporting success. Two properties, both measured by rendering rather than
# reasoned about:
#   (1) IT IS THE SAME BYTES. The stock incantation — `include (print $.Template.BasePath
#       "/<cm>.yaml") . | sha256sum` — is unusable here because each ConfigMap and its Deployment
#       live in the SAME file (self-referential include, and it would hash every OTHER user's
#       objects too, rolling the whole cohort on one attendee's change). Hashing a hand-listed set
#       of values instead goes stale the first time somebody adds a key. So each payload moved into
#       a named template (workshop-config.showroomUserData / …DemosUserData) that the ConfigMap
#       `include`s and the Deployment `include | sha256sum`es — they cannot disagree. Verified: all
#       three rendered ConfigMap payloads are BYTE-IDENTICAL to 0.3.4's.
#   (2) IT MOVES ONLY WHEN THE PAYLOAD MOVES. maasModel qwen3-14b→granite-3-8b moves all three
#       checksums; homeStorage 5Gi→10Gi moves none. Presence alone would have been the wrong test.
# Reserved sessions (.Values.reservedUsers) render NO annotation, the same call the postStart block
# in showroom.yaml already makes: an attribute change is a chart change, and a reserved user is a
# live session that a chart change must not Recreate-roll. They take it on the deliberate update.
# Rendering change on a chart Argo caches, so the bump is load-bearing — without it the cockpits
# keep rendering from the cached manifest and the annotation never appears.
# 0.3.4: both cockpits' user_data.yml now carry cluster_ocp_version — the LAST wiring point of an
# attribute that was already defined (softly, `set-from-cluster@`) in content/antora.yml,
# showroom/site.yml and site-demo.yml but never injected, so every page referencing it rendered the
# placeholder on every cluster. New value showroom.ocpVersion (default ""), fed by
# bootstrap/install.sh from `oc get clusterversion version -o jsonpath={.status.desired.version}`.
# Two properties are load-bearing and neither is obvious:
#   (1) BARE, no `@`. Precedence was measured at playbook-hard > component descriptor >
#       playbook-soft; this ConfigMap merges into the component descriptor, so a soft value here
#       would tie with the git-baked placeholder instead of beating it.
#   (2) OMITTED, not blanked, when the value is empty. An emitted "" merges OVER the soft default and
#       the attendee reads a sentence with its subject missing — strictly worse than the placeholder,
#       and it fails silently in both directions (rc-0 build, no warning).
# Rendering change on a chart Argo caches, so the bump is load-bearing: without it the cockpits keep
# rendering from the cached manifest and the attribute never appears, with `ws git-refresh` reporting
# success either way.
# 0.3.3: TWO library Tasks in one bump — do not split it, both bodies are in the same rendered
# template and Argo caches the render, not the file.
#   (1) sonar-scan gets the maven-jdk21 treatment: its `compile` step ran /usr/bin/mvn with no
#       settings file and no cache volume, i.e. the identical uncached-Maven defect 0.3.2 fixed next
#       door. It costs more here — sonar-scan is the FIRST gate in the app-security-testing capstone,
#       so the whole dependency tree was downloaded before any other task in the run started, once
#       per red-gate → fix → re-run iteration. Now: optional maven-cache workspace, a
#       generate-settings step, MAVEN_MIRROR_URL, and `mvn -s`. Same design as maven-jdk21 on
#       purpose — one Maven-caching pattern in the library, not two. NOTE this is a capability until
#       the capstone Pipeline maps its (already declared) maven-cache workspace into the sast-sonar
#       task; unbound, the Task still runs, just uncached.
#   (2) both Tasks' openjdk-21 images move off the floating `:latest` onto the multi-arch index
#       digest sha256:24dad82… (ubi9/openjdk-21:latest, resolved 2026-08-07; image 1.24, JDK 21,
#       Maven 3.9). Module 4 teaches the mutable-tag trap and the supply-chain module teaches
#       promote-by-digest, and the shipped `maven` Task these replace is itself digest-pinned — the
#       org-standard example has to model the org standard. All four image references (2 Tasks x
#       2 steps) carry the SAME digest so neither Task pays a second pull.
# Task-body change on a chart Argo caches, so the bump is load-bearing: without it the library keeps
# serving the old Tasks, and a pipeline that maps maven-cache into sonar-scan resolves a Task that
# does not declare that workspace — which fails the run outright rather than degrading to uncached.
# 0.3.2: the curated maven-jdk21 library Task gains an OPTIONAL maven-cache workspace (its Maven
# local repository used to live in the container filesystem, so every run re-downloaded the whole
# dependency tree — measured 11m20s then 11m33s on two consecutive unit-test runs) and gets the
# upstream MAVEN_MIRROR_URL param back. Task-body change on a chart Argo caches, so the bump is
# load-bearing: without it the library keeps serving the old one-workspace Task, and a pipeline that
# maps maven-cache into it resolves a Task that does not declare that workspace — which fails the
# run outright rather than degrading to uncached.
# 0.3.1: SEV1-E — two templates rendered namespaced resources into namespaces that exist only when a
# specific module is enabled (tempo-jaegerui-access.yaml had no guard at all; sonarqube-user-seed.yaml
# had one whose flag nothing ever set), so a documented `modules_disabled:` entry failed the WHOLE
# workshop-config Argo app. Both now go through the new workshop-config.moduleEnabled helper, which
# derives module enablement from modulesDisabledCSV. Rendering change, so the bump is load-bearing
# against Argo's manifest cache.
# 0.1.29: parasol-notifications joins the shared parasol-images builds (new ImageStream+BuildConfig
# from the new apps/parasol-notifications/Containerfile) — build-deliver's solve end state runs it,
# and `ws doctor` now asserts its 1.0 istag in lockstep with the build list.
# 0.1.28: (1) explicit imagePullPolicy: Always on both cockpits' antora-build initContainer (the
# workshop-built antora-ext image is tagged :latest today, which k8s already defaults to Always, but
# only implicitly — an explicit policy survives a future re-tag). (2) showroom-userdata-{user} now
# surfaces maas_model/maas_endpoint (new Values.showroom.maas{Model,Endpoint}, defaulted to
# antora.yml's current soft-set values) so docs can render the model a given cluster's MaaS key
# actually serves instead of a static default.
# 0.1.27: parasol-tasks hook redacts JWT-shaped material from the raw stderr it prints (the hook
# hands a ServiceAccount token to the command whose errors it echoes). Hook-only change, so the bump
# is load-bearing against Argo's manifest cache.
version: 0.3.6
