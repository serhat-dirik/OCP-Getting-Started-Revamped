apiVersion: v2
name: workshop-config
description: "Workshop layer: attendee users, platform-observer RBAC, per-user namespaces/quotas, entry-state AppProject, htpasswd IdP, and Gitea user seeding. One Argo CD Application (helm params userCount, clusterDomain)."
type: application
# 0.3.11: the shared cockpit's TERMINAL gets an identity. It had none — `oc whoami` in it returned
# `system:serviceaccount:ogsr-showroom:showroom-shared`, the pod's own SA, which holds only
# system:auth-delegator, so pods/secrets/projects were all Forbidden and no `ws` verb could run (`ws`
# resolves the attendee from `oc whoami`). The page half was already correct; the terminal half only
# PRINTED an `oc login` instruction and left the human to finish it.
# The fix passes the attendee's own OAuth access token through to the terminal and builds a
# per-session kubeconfig from it, so the shell acts as the real user until the cluster expires the
# token. That needed the front door to stop being a ServiceAccount-as-OAuth-client: measured on this
# cluster from the owner's real logins, an SA client issues `[user:info user:check-access]` — enough
# to say who you are, not to read a pod — while real OAuthClients on the same cluster issue
# `user:full`. So a real OAuthClient is created, requesting user:full, with the cockpit Route as its
# redirect URI and grantMethod auto.
# ITS SECRET IS THE HARD PART, and the shape chosen is the one this chart already uses elsewhere: an
# idempotent Sync-phase hook Job (wave 2, before the wave-3 Deployment) mints the value ONCE if the
# Secret is absent, reuses it forever after, and converges OAuthClient.secret to it. Helm
# `randAlphaNum` was never an option — Argo re-renders every sync, so the value would churn and sign
# out every live session; `lookup` is empty under `helm template`. The rejected alternative was
# letting Argo own the OAuthClient with `secret` omitted and the hook patching it in; that rests on
# an untested assumption about Argo's three-way diff whose failure mode is selfHeal emptying the
# field and breaking every login invisibly, and this repo's rule is that diff questions are settled
# by experiment, not by reasoning.
# THE TOKEN HAZARD, handled explicitly: ttyd exports its -H header as TTYD_USER whatever that header
# is, so TTYD_USER now holds a bearer token. The old wrapper printed it in the login banner. It is now
# copied to a non-exported local, `unset` immediately, written into the kubeconfig by bash builtins
# (never an argv), kept out of the content upstream by an empty `proxy_set_header`, and never echoed;
# the banner names `oc whoami`. One copy at rest per attendee, 0600 under a 0700 ~/.kube.
# NON-INVASIVE: an OAuthClient is cluster-scoped and hook-created, so the uninstall cascade cannot
# reach it — bootstrap/ogsr-uninstall.sh step 7 now sweeps `oauthclients.oauth.openshift.io` by owner
# label, and ogsr-check-clean.sh names it in its fallback kind list (its live-discovery sweep already
# returned it, verified 2026-08-16).
# Whole feature stays behind showroom.shared.enabled, default false; the flag-off render is unchanged
# byte for byte. Chart-body change on a chart Argo caches, so the bump is load-bearing.
# 0.3.10: zap-baseline stops passing ZAP `-I` in reporting mode. 0.3.9 removed the result-overwrite
# and was CORRECT AND STILL INSUFFICIENT — the branch it fixed could not execute. `-I` means "do not
# return failure on warning", and the script added it on exactly the FAIL_ON_WARN=false path, so a
# WARN-only scan returned 0 instead of 2 while the reporting branch tests for 2. The branch was dead
# code and the run took the genuine-pass branch: measured on a live report-mode capstone run
# (2026-08-16, user5-cicd, seeded branch) the gate printed "✅ DAST passed — no gating alerts" and
# published dast-passed=true while the deployed app served NONE of the five security headers.
# THE RULE THIS ESTABLISHES, and it now has three members plus one former violator: report mode may
# change what a gate DOES, never what it MEASURES. sonar-scan's QUALITY_GATE_WAIT and trivy-scan's
# EXIT_CODE were pinned at their gating values for exactly this reason in 0.3.8; `-I` was the same
# category wearing an enforcement switch's clothes. It is deleted rather than inverted — the flag
# list handed to zap-baseline.py is now identical in both modes and FAIL_ON_WARN is consulted only
# AFTER the exit code is in hand.
# Enforcement is untouched: the old line only ever added `-I` at FAIL_ON_WARN=false, so the capstone's
# gating path never received it. At this Task's own default (false) a WARN-only run still exits 0 and
# still Succeeds; it now returns 2 internally, prints ⚠️, and publishes dast-passed=false.
# The harness could not have caught this and now can: it stubbed the scanner with an INJECTED exit
# code, which assumes away a bug about which exit code the real scanner returns. The stub now derives
# its RC from the flags it was given (modelling `-I`, `--exit-code 0` and `qualitygate.wait=false`)
# and records a DETECTION FINGERPRINT — argv plus every generated config file — so "report mode asks
# the scanner for exactly what enforcement does" is asserted, not assumed. That assertion fails on
# the old line. Verified: 80 checks green across the four gate Tasks, canary exits 1.
# Task-body change on a chart Argo caches, so the bump is load-bearing.
# 0.3.9: zap-baseline and k6-load-test stop overwriting their own result. Each wrote its verdict
# TWICE on the branch its FAIL_ON_* switch selects — the truthful 'false', then a 'true' straight
# over it — so a run that found the missing security headers, or blew its p95 budget, published a
# PASS while the log immediately above said ⚠️ it had found something. The second write is deleted;
# the ⚠️ line and the exit 0 stay, so enforcement behaviour is untouched and only the VERDICT moves.
# It matters because of what reads those results: the capstone's report-mode run publishes all six
# gate results, and tools/verify/app-security-testing.sh grades the six rather than the run's exit
# status. Before this fix an attendee who fixed four of the five seeded findings and left the
# security headers alone would have been told 6-of-6 — the two lanes were each right and jointly
# wrong. Now a report run publishes false for every gate that found something, all six.
# INERTNESS IS NOT SYMMETRIC HERE, and the asymmetry is the thing to check before shipping:
#   * k6-load-test — fully inert. Its own default is FAIL_ON_THRESHOLD=true, where the corrected
#     branch is unreachable.
#   * zap-baseline — its own default is FAIL_ON_WARN=**false**, so a bare `tkn task start` on an
#     app with WARN-level findings DOES change: same exit status (0, still Succeeds), but the
#     published dast-passed goes true → false. That is the defect being fixed, not a regression.
#     The Parasol capstone is unaffected either way — it maps FAIL_ON_WARN explicitly, and at its
#     enforcing value that branch was never reached.
# Verified by executing all four step scripts under a stubbed scanner across the RC×mode truth
# table (56 checks), with a canary run asserting the harness can fail. Task-body change on a chart
# Argo caches, so the bump is load-bearing.
# 0.3.8: sonar-scan and trivy-scan gain a FAIL_ON_VIOLATION param (default "true" — enforcement is
# unchanged) so the app-security-testing capstone can run a REPORTING pass in which every scanner
# still runs and every finding is still published. The name and polarity are acs-image-check's and
# roxctl-deployment-check's, so all four library gates now take the same switch.
# WHAT THIS IS NOT is the point of the change. The knobs that look like report mode — sonar's
# QUALITY_GATE_WAIT=false and trivy's EXIT_CODE=0 — are DETECTOR switches: they stop the tool
# measuring, so the Task takes its success branch and publishes quality-gate-passed=true /
# scan-passed=true on a run whose gate is red and whose CVE table is on the screen above. That is
# the exact defect roxctl-deployment-check's own comment warns about ("a security gate that reports
# GREEN because it could not run is worse than no gate at all"), and a naive report mode reintroduces
# it at four of the six gates at once. FAIL_ON_VIOLATION leaves both detectors at their gating
# defaults and softens only the exit status; each Task writes its result BEFORE consulting the mode
# and never rewrites it. Verified by executing both step scripts under a stubbed scanner across the
# RC×mode truth table: at the default the new code path is not entered and every branch is
# byte-identical to 0.3.7's. Task-body change on a chart Argo caches, so the bump is load-bearing.
# 0.3.5: BOTH cockpit Deployments gain a checksum/user-data pod-template annotation over their own
# user_data.yml, so an attribute change actually reaches a reader. It is the missing half of 0.3.4
# and 0.1.28: a cockpit builds its content at POD INIT (the antora-build initContainer reads
# /user_data/user_data.yml), so wiring maas_model and cluster_ocp_version put the values in a
# ConfigMap that nothing restarted — they sat there, correct and unread, with Argo, `ws git-refresh`
# and `helm template` all reporting success. Two properties, both measured by rendering rather than
# reasoned about:
#   (1) IT IS THE SAME BYTES. The stock incantation — `include (print $.Template.BasePath
#       "/<cm>.yaml") . | sha256sum` — is unusable here because each ConfigMap and its Deployment
#       live in the SAME file (self-referential include, and it would hash every OTHER user's
#       objects too, rolling the whole cohort on one attendee's change). Hashing a hand-listed set
#       of values instead goes stale the first time somebody adds a key. So each payload moved into
#       a named template (workshop-config.showroomUserData / …DemosUserData) that the ConfigMap
#       `include`s and the Deployment `include | sha256sum`es — they cannot disagree. Verified: all
#       three rendered ConfigMap payloads are BYTE-IDENTICAL to 0.3.4's.
#   (2) IT MOVES ONLY WHEN THE PAYLOAD MOVES. maasModel qwen3-14b→granite-3-8b moves all three
#       checksums; homeStorage 5Gi→10Gi moves none. Presence alone would have been the wrong test.
# Reserved sessions (.Values.reservedUsers) render NO annotation, the same call the postStart block
# in showroom.yaml already makes: an attribute change is a chart change, and a reserved user is a
# live session that a chart change must not Recreate-roll. They take it on the deliberate update.
# Rendering change on a chart Argo caches, so the bump is load-bearing — without it the cockpits
# keep rendering from the cached manifest and the annotation never appears.
# 0.3.4: both cockpits' user_data.yml now carry cluster_ocp_version — the LAST wiring point of an
# attribute that was already defined (softly, `set-from-cluster@`) in content/antora.yml,
# showroom/site.yml and site-demo.yml but never injected, so every page referencing it rendered the
# placeholder on every cluster. New value showroom.ocpVersion (default ""), fed by
# bootstrap/install.sh from `oc get clusterversion version -o jsonpath={.status.desired.version}`.
# Two properties are load-bearing and neither is obvious:
#   (1) BARE, no `@`. Precedence was measured at playbook-hard > component descriptor >
#       playbook-soft; this ConfigMap merges into the component descriptor, so a soft value here
#       would tie with the git-baked placeholder instead of beating it.
#   (2) OMITTED, not blanked, when the value is empty. An emitted "" merges OVER the soft default and
#       the attendee reads a sentence with its subject missing — strictly worse than the placeholder,
#       and it fails silently in both directions (rc-0 build, no warning).
# Rendering change on a chart Argo caches, so the bump is load-bearing: without it the cockpits keep
# rendering from the cached manifest and the attribute never appears, with `ws git-refresh` reporting
# success either way.
# 0.3.7: both library Tasks keep their optional maven-cache workspace (a curated library should
# offer the capability) but their unbound-cache log line stops telling the reader to bind a
# `maven-cache` claim — the workshop no longer ships one, and no Parasol pipeline binds the
# workspace. Measured 2026-08-08: bound, it gives the TaskRun a second PVC and the Affinity
# Assistant rejects the run in its default mode; unbound-but-working, a warm cache was worth 1.2%
# of an 11-minute run. Task-body change on a chart Argo caches, so the bump is load-bearing.
# 0.3.3: TWO library Tasks in one bump — do not split it, both bodies are in the same rendered
# template and Argo caches the render, not the file.
#   (1) sonar-scan gets the maven-jdk21 treatment: its `compile` step ran /usr/bin/mvn with no
#       settings file and no cache volume, i.e. the identical uncached-Maven defect 0.3.2 fixed next
#       door. It costs more here — sonar-scan is the FIRST gate in the app-security-testing capstone,
#       so the whole dependency tree was downloaded before any other task in the run started, once
#       per red-gate → fix → re-run iteration. Now: optional maven-cache workspace, a
#       generate-settings step, MAVEN_MIRROR_URL, and `mvn -s`. Same design as maven-jdk21 on
#       purpose — one Maven-caching pattern in the library, not two. NOTE this is a capability until
#       the capstone Pipeline maps its (already declared) maven-cache workspace into the sast-sonar
#       task; unbound, the Task still runs, just uncached.
#   (2) both Tasks' openjdk-21 images move off the floating `:latest` onto the multi-arch index
#       digest sha256:24dad82… (ubi9/openjdk-21:latest, resolved 2026-08-07; image 1.24, JDK 21,
#       Maven 3.9). Module 4 teaches the mutable-tag trap and the supply-chain module teaches
#       promote-by-digest, and the shipped `maven` Task these replace is itself digest-pinned — the
#       org-standard example has to model the org standard. All four image references (2 Tasks x
#       2 steps) carry the SAME digest so neither Task pays a second pull.
# Task-body change on a chart Argo caches, so the bump is load-bearing: without it the library keeps
# serving the old Tasks, and a pipeline that maps maven-cache into sonar-scan resolves a Task that
# does not declare that workspace — which fails the run outright rather than degrading to uncached.
# 0.3.2: the curated maven-jdk21 library Task gains an OPTIONAL maven-cache workspace (its Maven
# local repository used to live in the container filesystem, so every run re-downloaded the whole
# dependency tree — measured 11m20s then 11m33s on two consecutive unit-test runs) and gets the
# upstream MAVEN_MIRROR_URL param back. Task-body change on a chart Argo caches, so the bump is
# load-bearing: without it the library keeps serving the old one-workspace Task, and a pipeline that
# maps maven-cache into it resolves a Task that does not declare that workspace — which fails the
# run outright rather than degrading to uncached.
# 0.3.1: SEV1-E — two templates rendered namespaced resources into namespaces that exist only when a
# specific module is enabled (tempo-jaegerui-access.yaml had no guard at all; sonarqube-user-seed.yaml
# had one whose flag nothing ever set), so a documented `modules_disabled:` entry failed the WHOLE
# workshop-config Argo app. Both now go through the new workshop-config.moduleEnabled helper, which
# derives module enablement from modulesDisabledCSV. Rendering change, so the bump is load-bearing
# against Argo's manifest cache.
# 0.1.29: parasol-notifications joins the shared parasol-images builds (new ImageStream+BuildConfig
# from the new apps/parasol-notifications/Containerfile) — build-deliver's solve end state runs it,
# and `ws doctor` now asserts its 1.0 istag in lockstep with the build list.
# 0.1.28: (1) explicit imagePullPolicy: Always on both cockpits' antora-build initContainer (the
# workshop-built antora-ext image is tagged :latest today, which k8s already defaults to Always, but
# only implicitly — an explicit policy survives a future re-tag). (2) showroom-userdata-{user} now
# surfaces maas_model/maas_endpoint (new Values.showroom.maas{Model,Endpoint}, defaulted to
# antora.yml's current soft-set values) so docs can render the model a given cluster's MaaS key
# actually serves instead of a static default.
# 0.1.27: parasol-tasks hook redacts JWT-shaped material from the raw stderr it prints (the hook
# hands a ServiceAccount token to the command whose errors it echoes). Hook-only change, so the bump
# is load-bearing against Argo's manifest cache.
version: 0.3.15
