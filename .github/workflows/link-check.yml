---
name: link-check
on:
  # NOTE: maintainers commit straight to main (owner decision), so the pull_request
  # trigger below almost never fires and this is effectively a weekly job. That means a
  # link break can sit on main for up to seven days — and a FIX cannot be confirmed
  # until the next Monday either, which is why workflow_dispatch is here: run it from
  # the Actions tab (or `gh workflow run link-check`) right after touching links.
  workflow_dispatch:
  pull_request:
    paths: ['content/**']
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build workshop site
        working-directory: content
        run: npx antora --fetch site-workshop.yml

      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          # Exclude local/dev-default hosts and unresolved {attribute} artifacts;
          # everything else in the rendered HTML must resolve.
          #
          # developers.redhat.com and docs.redhat.com return 403 Forbidden to this job and
          # cannot be checked from CI. Measured 2026-07-28, and it is NOT any of the things
          # it looks like:
          #   - not rate limiting  — throttling to --max-concurrency 8 changed nothing, and
          #                          the site has only 5 distinct redhat.com URLs anyway
          #   - not the user agent — curl 403s with both a bot UA and a full Chrome UA
          #   - not dead links     — they load normally in a real browser
          # It is the WAF. Nothing we can configure here fixes it, so these two hosts are
          # excluded rather than left to redden the gate forever — a permanently-red gate
          # reports nothing at all.
          #
          # CORRECTION 2026-08-05: this note used to add "and the docs.redhat.com one served
          # 200 to curl from a laptop", and to tell you to spot-check these by hand. Both were
          # wrong, so don't reach for curl. Re-measured from a residential IP with a full
          # Chrome UA and -L: all 3 excluded URLs 403 — but so do https://docs.redhat.com/ ,
          # https://developers.redhat.com/ and two deliberately nonsense paths. The 403 is
          # therefore UNINFORMATIVE: it is returned identically for live and dead URLs, so no
          # curl-based check can tell you anything about these links. It is also not purely a
          # datacenter-IP effect, since a laptop gets the same 403. Verifying them needs a real
          # browser session; nothing else counts as a check.
          #
          # THE COST, stated plainly: links to these two hosts are NOT verified. Today that
          # is 3 URLs (2 devspaces-inner-loop lab, 1 devspaces-inner-loop wrapup — recounted
          # 2026-08-05, still accurate). Open them in a browser when touching those pages.
          # If that count ever grows meaningfully, revisit — the right answer then is a
          # scheduled job on a non-datacenter runner, not a longer exclude list.
          args: >-
            --no-progress
            --max-retries 3
            --exclude 'example\.com'
            --exclude 'localhost'
            --exclude '\{[a-z_]+\}'
            --exclude 'developers\.redhat\.com'
            --exclude 'docs\.redhat\.com'
            'www/workshop/**/*.html'
          fail: true
