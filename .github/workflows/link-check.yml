---
name: link-check
on:
  # NOTE: maintainers commit straight to main (owner decision), so the pull_request
  # trigger below almost never fires and this is effectively a weekly job. That means a
  # link break can sit on main for up to seven days — and a FIX cannot be confirmed
  # until the next Monday either, which is why workflow_dispatch is here: run it from
  # the Actions tab (or `gh workflow run link-check`) right after touching links.
  workflow_dispatch:
  pull_request:
    paths: ['content/**']
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build workshop site
        working-directory: content
        run: npx antora --fetch site-workshop.yml

      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          # Exclude local/dev-default hosts and unresolved {attribute} artifacts;
          # everything else in the rendered HTML must resolve.
          #
          # max-concurrency is the important one and it is NOT cosmetic. lychee defaults to
          # 128 concurrent requests, and this site points 150+ links at redhat.com hosts.
          # That burst trips Red Hat's WAF rate limiting and comes back as 403 Forbidden on
          # a handful of links, which reads exactly like a dead link but is not: the three
          # that failed on 2026-07-28 all load fine in a browser, and the docs.redhat.com
          # one returned 200 to a plain curl moments later. Throttling ourselves keeps the
          # coverage (no host exclusions) and removes the false failures.
          args: >-
            --no-progress
            --max-concurrency 8
            --max-retries 3
            --retry-wait-time 4
            --exclude 'example\.com'
            --exclude 'localhost'
            --exclude '\{[a-z_]+\}'
            'www/workshop/**/*.html'
          fail: true
