---
name: pages-preview
on:
  push:
    branches: [main]
    # ONLY REBUILD THE SITE WHEN THE SITE CAN HAVE CHANGED. This is the other half of the
    # starvation fix, and the bigger half. Measured 2026-08-06: 95 commits in one session
    # queued 95 pages-preview runs, and each evicted the previous one — but the large
    # majority touched tools/, apps/, gitops/ or bootstrap/, none of which the site build
    # reads. They could not have changed a single rendered byte, and they were the reason
    # the one run that MATTERED never reached a runner.
    #
    # Safe because the Antora playbook pins its input precisely: content/site-workshop.yml
    # declares `sources: [{url: '..', start_path: content}]`, so the build reads ONLY
    # content/ out of the repo. Verified, not assumed.
    #
    # versions.yaml is deliberately ABSENT. It reaches the site only through
    # content/modules/ROOT/partials/version-attributes.adoc, which is generated and
    # committed, and content-build's version-attribute drift gate forces the two to move in
    # the same commit — so a versions.yaml change that matters always brings a content/
    # change with it. Listing it here would only buy pointless rebuilds.
    #
    # workflow_dispatch below is intentionally NOT filtered: a manual publish must always
    # work, whatever changed.
    paths:
      - 'content/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages-preview.yml'
  # MANUAL TRIGGER — this is not a convenience, it is the fix for a starvation bug that meant the
  # site NEVER published. Measured 2026-08-06: 39 of the last 40 runs concluded `cancelled`, the
  # Pages API reported "status": null (never built once), and the deployed URL 404'd.
  #
  # Cause, proven by the jobs API returning ZERO jobs for every cancelled run: those runs were
  # evicted while still QUEUED, before a job was ever created. GitHub keeps at most one PENDING
  # run per concurrency group, so each push evicted the one before it. A commit lands here every
  # ~20-30 minutes during a working session and the runner queue was not draining inside that
  # window, so no run ever reached a runner. `cancel-in-progress: false` does not help: it
  # protects a RUNNING job, and none of these ever started running.
  #
  # push-only therefore cannot publish this repo on a busy day, by construction. workflow_dispatch
  # gives an unconditional way in: run it from the Actions tab (or `gh workflow run
  # pages-preview.yml`) once commits are quiet, and the site publishes. Deliberately NOT paired
  # with a schedule - a timer would paper over the starvation instead of making it visible.
  workflow_dispatch:

# GitHub Pages deploy needs these; the PM enables Pages (Settings → Pages → GitHub Actions).
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let an in-flight deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build workshop site (with the Pages base URL)
        working-directory: content
        # build-info stamps the home page with the deployed commit + time (CLI attribute
        # overrides the playbook's "Local preview build" default) — the site now answers
        # "is this current?" itself.
        run: |
          npx antora --fetch \
            --url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            --attribute "build-info=Site build ${GITHUB_SHA:0:7} · $(date -u '+%Y-%m-%d %H:%M UTC')" \
            site-workshop.yml

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www/workshop

      - id: deploy
        uses: actions/deploy-pages@v4
