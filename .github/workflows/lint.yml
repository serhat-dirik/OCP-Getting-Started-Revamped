---
name: lint
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Privacy guard (no private domains/emails in tracked files)
        # LITERAL patterns only. The API-key pattern that used to live in this alternation moved to
        # the guard below (task #97): `sk-[A-Za-z0-9]{20}` needs twenty CONSECUTIVE alphanumerics,
        # so a single `_` in the first twenty characters breaks the run — measured 2026-07-29, it
        # does not match a real key of the shape this project actually uses, and this step printed
        # "clean". The fix needs an opacity test that a POSIX ERE cannot express (no lookahead), and
        # more importantly needs a canary, which an inline grep cannot have.
        run: |
          # Ephemeral-cluster domains and personal emails. (The shared RHDP MaaS host is
          # semi-public — referenced in public rhpds repos — and is queued for parameterization
          # in the packaging wave rather than blocked here.)
          #
          # `git grep` exits 0 (match), 1 (no match), or >1 (the invocation itself failed — a bad
          # pattern, a broken pathspec). An `if git grep …; then FAIL; fi` form treats every
          # non-zero the same way, so a >1 error silently falls through to "clean" — the exact
          # negated-existence-test shape (`! oc get X` reporting "clean slate" on a lookup that
          # never ran) this project has been bitten by before. The case below tells "no matches"
          # apart from "grep itself broke" and fails loudly on the latter instead of passing.
          rc=0
          git grep -nE "dynamic2\.redhatworkshops|cluster-qvkd|@gmail\.com" -- . ':!.github/workflows/lint.yml' || rc=$?
          case "$rc" in
            0)
              echo "::error::Private-info pattern found in tracked files (see matches above). Private material belongs in ../Project-Shared (outside the repo) or gitignored vars.yaml."
              exit 1
              ;;
            1)
              echo "Privacy guard clean."
              ;;
            *)
              echo "::error::git grep itself failed (exit $rc) instead of returning a clean scan —" \
                   "the pattern or pathspec is broken. Refusing to treat an error the same as" \
                   "'no matches found'."
              exit 1
              ;;
          esac

      - name: API keys must not be committed, whatever separators they carry
        # Catches a key by SHAPE — token-start `sk-`, >=20 chars of [A-Za-z0-9_-], and an unbroken
        # alphanumeric chunk of >=12 carrying both a letter and a digit. That last layer is what
        # separates a credential (opaque) from a slug (words): it clears all five false positives
        # the naive widening `sk-[A-Za-z0-9_-]{16,}` produces on this tree, including the two
        # `parasol-task-…` names whose `task-` contains `sk-`. Stdlib only — no pip step.
        run: |
          rc=0
          python3 tools/lint/api-key-shape-guard.py --self-test || rc=$?
          # Exactly 1 = every constructed key shape detected AND every benign look-alike ignored.
          # 0 = guard blind; 2 = fixture missing, a shape went undetected, or a benign line fired.
          # Either way detection is unproven, so fail rather than trust a clean tree scan.
          if [ "$rc" -ne 1 ]; then
            echo "::error::api-key-shape-guard self-test must exit 1 (canary shapes detected);" \
                 "got rc=$rc. The guard's detection is unproven — refusing to trust a clean" \
                 "result on the real tree."
            exit 1
          fi
          python3 tools/lint/api-key-shape-guard.py

  click-to-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: An interactive `read` must be the last line of a click-to-run block
        # content/supplemental-ui/js/click-to-run.js sends an ENTIRE [source,...,role=execute]
        # block to the terminal in a single write, so a mid-block interactive `read` swallows the
        # line after it as its own answer. Shipped TWICE (76ae9d3, 2026-07-29): gitops-at-scale's
        # workshop-password read ate the ARGOCD_AUTH_TOKEN export (401 two blocks later), and
        # pipelines-fundamentals' Gitea-token read ate the webhook-secret line (the Secret was
        # never created at all). Both are fixed and carry a "DO NOT merge this block" comment, but
        # nothing else stops a future edit from re-merging them.
        run: |
          rc=0
          python3 tools/lint/click-to-run-guard.py --self-test || rc=$?
          # Exactly 1 = the broken canary case was detected AND every safe form beside it (pipe-fed,
          # explicit-fd, heredoc-body, prose) stayed silent. 0 = guard blind; 2 = fixture missing,
          # the broken case went undetected, or a safe form wrongly fired. Either way detection is
          # unproven, so fail rather than trust a clean result on the real tree.
          if [ "$rc" -ne 1 ]; then
            echo "::error::click-to-run-guard self-test must exit 1 (broken canary case" \
                 "detected, safe forms silent); got rc=$rc. The guard's detection is unproven —" \
                 "refusing to trust a clean result on the real tree."
            exit 1
          fi
          python3 tools/lint/click-to-run-guard.py

  credential-redaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Credential redaction guard (no truncation-as-a-safety)
        # Sibling to the privacy guard: that one catches a secret COMMITTED to the tree, this one
        # catches a secret DISPLAYED at runtime behind a character count. 2026-07-29: a diagnostic
        # showed a gateway error line through `cut -c1-200` and the echoed key started at character
        # 201 — safe by ten characters — while the same shape one module over (`b[:400]`, key at
        # character 75) was already leaking. Neither is visible to a git grep.
        run: |
          rc=0
          python3 tools/lint/credential-redaction-guard.py --self-test || rc=$?
          # Exactly 1 = canary detected. 0 = guard blind; 2 = fixture missing/empty scope. Either
          # way detection is unproven, so fail rather than trust a clean run on the real tree.
          if [ "$rc" -ne 1 ]; then
            echo "::error::credential-redaction-guard self-test must exit 1 (canary detected);" \
                 "got rc=$rc. The guard's detection is unproven — refusing to trust a clean" \
                 "result on the real tree."
            exit 1
          fi
          echo "self-test ok — guard correctly rejected its own canary (rc=1)."
          python3 tools/lint/credential-redaction-guard.py

  # vale + yamllint run locally on maintainer machines (their configs are maintainer tooling,
  # kept out of the public tree per the 2026-07-19 owner review). CI keeps the checks that
  # guard the shipped artifact itself.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck every tracked shell script
        # git ls-files, not a filesystem walk. `find` lints whatever happens to be sitting in the
        # working tree, so the scope silently changes with the machine: on a maintainer laptop the
        # old walk selected 449 files (395 agent worktrees under .claude/, 10 vendored playwright
        # scripts under tools/media/.venv/) against 44 real ones, and the -not -path exclusion list
        # only ever grows after the next vendor dir slips through. The tracked set is the honest
        # definition of "scripts we ship" and is identical in every checkout.
        run: |
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(git ls-files -- '*.sh')
          # Extensionless bash scripts we ship (the ws CLI, utilities/*). Scoped by pathspec on
          # purpose: an unscoped shebang sweep also picks up the eight vendored apps/**/mvnw
          # wrappers, which are upstream Maven artifacts and not ours to lint.
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if head -1 "$f" | grep -qE '^#!.*sh'; then files+=("$f"); fi
          done < <(git ls-files -- 'tools/ws/ws' 'utilities/*')
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::ShellCheck selected zero files. The repo ships shell scripts, so an" \
                 "empty selection means this step is broken — refusing to pass on an empty scope."
            exit 1
          fi
          printf 'shellcheck: %s\n' "${files[@]}"
          shellcheck "${files[@]}"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: helm lint + template every chart
        run: |
          shopt -s nullglob
          charts=(gitops/entry-states/*/Chart.yaml)
          [ -f gitops/workshop-config/Chart.yaml ] && charts+=(gitops/workshop-config/Chart.yaml)
          [ -f helm/bootstrap/Chart.yaml ] && charts+=(helm/bootstrap/Chart.yaml)
          if [ ${#charts[@]} -eq 0 ]; then
            echo "No Helm charts yet."; exit 0
          fi
          rc=0
          for c in "${charts[@]}"; do
            d="$(dirname "$c")"
            echo "::group::helm $d"
            helm lint "$d" || rc=1
            helm template "$d" >/dev/null || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

      # NOTE: the step above renders with DEFAULT values only, which is exactly how a plain-HTTP
      # Route reached a live cluster twice. config-multienv emits its stage/prod Routes only under
      # `solve=true`, so `helm template <dir>` never produced them and never checked them. The guard
      # below renders each chart under the value permutations that change what is emitted.
      - name: Browser-facing Routes must be edge-terminated
        run: ./tools/lint/route-tls-guard.sh

  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize (pinned)
        run: |
          curl -sfL -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.0/kustomize_v5.8.0_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
      - name: kustomize build every tracked platform-portfolio overlay/base
        # git ls-files, not a filesystem walk — the same determinism defect fixed in the shellcheck
        # job (9549990). The walk descends into platform-portfolio/components/*/charts/, which is
        # gitignored (.gitignore:34) and inflated at build time by this very step's --enable-helm.
        # Today the two selections agree exactly (47 = 47) only because the pinned sonarqube chart
        # happens to ship no kustomization.yaml of its own — a property of an upstream tarball we
        # do not control and that is re-decided on every chart bump. The descent is real, not
        # theoretical: a canary kustomization.yaml planted under that directory is picked up by the
        # walk and correctly ignored by git ls-files. The tracked set is what we actually ship.
        #
        # `git ls-files -- <dir> | grep` rather than a '**/' pathspec on purpose: in git PATHSPECS
        # (unlike .gitignore patterns) '**/' does not match zero directories, so
        # 'platform-portfolio/**/kustomization.yaml' silently drops a future top-level
        # platform-portfolio/kustomization.yaml. The grep is the literal equivalent of find's
        # -name — a basename match at any depth — and was verified against both cases.
        run: |
          rc=0
          files=()
          # No `sort`: git ls-files already emits bytewise-sorted paths, and unlike sort(1) that
          # order does not shift with the runner's locale.
          while IFS= read -r k; do files+=("$k"); done < <(
            git ls-files -- platform-portfolio | grep -E '(^|/)kustomization\.yaml$'
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::kustomize selected zero kustomization.yaml files. The portfolio ships" \
                 "dozens, so an empty selection means this step is broken — refusing to pass on" \
                 "an empty scope."
            exit 1
          fi
          for k in "${files[@]}"; do
            d="$(dirname "$k")"
            echo "::group::kustomize build $d"
            if ! kustomize build --enable-helm "$d" >/dev/null; then
              echo "::error::kustomize build failed: $d"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit "$rc"

  image-pull-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same helm pin as the helm/copy-drift jobs so every job reads the same render.
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Install kustomize (pinned)
        # Same pin as the kustomize job — the promotion template is kustomize, not Helm.
        run: |
          curl -sfL -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.0/kustomize_v5.8.0_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML (pinned)
        # Hard dependency: this guard parses rendered manifests rather than pattern-matching them.
        # A missing parser exits 2, which the self-test assertion turns into a failure — it can
        # never degrade into a silent pass.
        run: python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Workshop-built images must be pulled with Always
        # Every image we build is tagged 1.0/1.1 and rebuilt IN PLACE, so the tag is mutable, and
        # Kubernetes defaults any non-:latest tag to IfNotPresent — a node with that tag cached
        # serves the OLD layers. Measured on ksls5 2026-07-29; 4efc931 fixed all 29 sites.
        #
        # This guard RENDERS rather than greps, which is the whole point: config-multienv emits two
        # of its three claims Deployments from a named template in _helpers.tpl, invisible to
        # `grep image: templates/*.yaml`. That blind spot swallowed the chart twice — this sweep and
        # the Route-TLS sweep of 2026-07-27. Every other author-facing check here is line-oriented,
        # so the defect class recurs by construction until one gate renders.
        run: |
          rc=0
          python3 tools/lint/image-pull-policy-guard.py --self-test || rc=$?
          # Exactly 1 = every canary detected. 0 = guard blind; 2 = fixture missing, a canary went
          # undetected, or a dependency is absent. Either way detection is unproven.
          if [ "$rc" -ne 1 ]; then
            echo "::error::image-pull-policy-guard self-test must exit 1 (canaries detected);" \
                 "got rc=$rc. The guard's detection is unproven — refusing to trust a clean" \
                 "result on the real tree."
            exit 1
          fi
          python3 tools/lint/image-pull-policy-guard.py

  hook-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML (pinned)
        run: python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Hook scripts must not reference undefined variables
        # Entry-state Jobs embed bash that runs under `set -euo pipefail`. A ${VAR} that is neither a
        # declared container env var nor assigned in-script is FATAL at the referencing line — and it
        # lands on the least-exercised branch, which is nearly always the error path. Measured on
        # ksls5 2026-07-29: jobs-batch-kueue's hook died with `DST_USER: unbound variable` PART-WAY
        # THROUGH PRINTING ITS OWN ERROR, taking its deliberate exit-0 degrade with it. The Job failed
        # 5/5 and the module's sync failed on exactly the clusters meant to degrade quietly. d53dccb
        # fixed it; this stops it returning.
        run: |
          rc=0
          python3 tools/lint/hook-env-guard.py --self-test || rc=$?
          # Exactly 1 = the DST_USER shape and a Template-nested script are both detected, AND
          # inline/loop/read/local assignments are correctly NOT reported. 0 = blind; 2 = a shape went
          # undetected or a benign assignment fired. Either way detection is unproven.
          if [ "$rc" -ne 1 ]; then
            echo "::error::hook-env-guard self-test must exit 1 (canary shapes detected);" \
                 "got rc=$rc. Detection is unproven — refusing to trust a clean tree scan."
            exit 1
          fi
          python3 tools/lint/hook-env-guard.py

  rebuild-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML (pinned)
        # The recorded cluster is YAML. A missing parser exits 2, which the self-test assertion
        # below turns into a failure — it can never degrade into a silent pass.
        run: python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.2'
      - name: The image-drift scan must still report what a recorded cluster produces
        # `ws rebuild-images --check` and `ws doctor`'s drift row answer "is this pod on the image
        # we think it is". That needs a cluster, so the SCAN cannot run here — but the reporting
        # can, against a recording of one. The point is the failure mode: a wrong answer here is a
        # clean report, never an error, so nothing about it is visible by reading the diff. Its
        # author's first draft shipped four such defects (collapsed CronJob selector column,
        # double-counted Knative Revisions, a service-wide ksvc pod match calling a rolled service
        # stale, an image ref split from the left) and every one was found by running it.
        #
        # This is NOT a substitute for `ws rebuild-images --check` on a live cluster: the recording
        # is of TEMPLATED oc output, so the go-templates inside rebuild_enumerate are data here.
        # Their emptiness guards are pinned statically instead, and the guard's own header says so.
        run: |
          rc=0
          python3 tools/lint/rebuild-scan-guard.py --self-test || rc=$?
          # Exactly 1 = every reintroduced defect was caught AND the unmutated tree passed its own
          # suite. 0 = the guard is blind; 2 = a mutant slipped through, a mutation became a no-op
          # because the code was reworded, the control failed, or a fixture is missing. Either way
          # detection is unproven, so fail rather than trust a clean result on the real tree.
          if [ "$rc" -ne 1 ]; then
            echo "::error::rebuild-scan-guard self-test must exit 1 (every reintroduced defect" \
                 "detected); got rc=$rc. The guard's detection is unproven — refusing to trust a" \
                 "clean result on the real tree."
            exit 1
          fi
          python3 tools/lint/rebuild-scan-guard.py

  module-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nav order matches modules.yaml (Gen-4 catalog guard)
        # Asserts the Antora sidebar order equals the modules.yaml catalog order (position =
        # number). Dependency-light: yq if present, else a built-in awk fallback.
        #
        # --self-test builds a throwaway modules.yaml + nav fixture under mktemp, proves a
        # correctly-ordered fixture passes, then proves a genuine two-slug reorder (not the
        # same-slug no-op swap that produced a false negative on this guard's first hand-test)
        # is caught. Never touches the real tree.
        run: |
          rc=0
          bash tools/check-module-order.sh --self-test || rc=$?
          # Exactly 1 = both proofs held (swap detected, correctly-ordered fixture stays clean).
          # 0/2 = the guard is blind or the fixture harness itself is broken. Either way
          # detection is unproven, so fail rather than trust a clean result on the real tree.
          if [ "$rc" -ne 1 ]; then
            echo "::error::check-module-order.sh self-test must exit 1 (reorder canary" \
                 "detected, correctly-ordered fixture stays clean); got rc=$rc. The guard's" \
                 "detection is unproven — refusing to trust a clean result on the real tree."
            exit 1
          fi
          echo "self-test ok — reorder canary is detected and the good fixture stays clean (rc=1)."
          bash tools/check-module-order.sh

  copy-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The copy side of most pairs is a Helm template, which is not valid YAML until Helm has
      # rendered it. Same pin as the helm job so both read the same render.
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      # setup-python rather than the runner's system python3: this step pip-installs, and a
      # PEP 668 "externally-managed-environment" python would refuse. The tool-cache interpreter
      # has its own site-packages and installs cleanly.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML (pinned)
        # This guard parses YAML properly rather than pattern-matching it, so the parser is a hard
        # dependency and is installed explicitly — not assumed to be in the runner image. If it
        # were ever missing the guard exits 2, which the self-test assertion below turns into a
        # failure; it can never degrade into a silent pass.
        run: python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Hand-maintained copies must stay in sync with their source
        # ABSORBED the former content-build "Claims seed drift gate"
        # (tools/lint/seed-drift-guard.sh, deleted): that one gated a single pair with `cmp -s`,
        # and byte identity could not express the four other pairs — three of them are correctly
        # in sync yet deliberately NOT byte-identical (the chart copy injects a namespace, an owner
        # label, or extra evidence comments), so a byte gate would have reddened main on work that
        # is right. They therefore went unguarded. This guard parses both sides and compares them
        # as data against a per-pair allow-list of INJECTED keys; the seed pair lives on here as
        # mode="bytes". Same self-test discipline as the credential/curl guards — prove the
        # detectors fire on the canary fixtures before believing a clean result on the real tree.
        run: |
          rc=0
          python3 tools/lint/copy-drift-guard.py --self-test || rc=$?
          # Exactly 1 = every canary detected. 0 = guard blind; 2 = fixture missing, a canary went
          # undetected, or a dependency is absent. Either way detection is unproven.
          if [ "$rc" -ne 1 ]; then
            echo "::error::copy-drift-guard self-test must exit 1 (canaries detected); got" \
                 "rc=$rc. The guard's detection is unproven — refusing to trust a clean" \
                 "result on the real tree."
            exit 1
          fi
          python3 tools/lint/copy-drift-guard.py

  namespace-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No bare pre-rename workshop namespaces in namespace-valued positions
        # ogsr- rename drift guard (SEV1 2026-07-18): fails if a pre-rename workshop namespace
        # short-name (student-gitops, gitea, showroom, parasol-tasks, parasol-images,
        # observability-workshop) appears BARE in a namespace-valued position (namespace: field,
        # oc -n flag, managed-by label value, or <svc>.<ns>.svc DNS). Resource/instance NAMEs, the
        # pinned Route host, and the gitea CRD kind are not namespace positions and never trip it.
        #
        # --self-test builds a scratch git repo under mktemp with the exact scan dirs, proves an
        # ogsr-prefixed fixture stays clean, then proves a bare `namespace: gitea` — the precise
        # SEV1 defect shape — is caught. Never touches the real tree.
        run: |
          rc=0
          bash tools/check-namespace-drift.sh --self-test || rc=$?
          # Exactly 1 = both proofs held (bare-namespace canary detected, ogsr-prefixed fixture
          # stays clean). 0/2 = the guard is blind or the fixture harness itself is broken.
          # Either way detection is unproven, so fail rather than trust a clean result on the
          # real tree.
          if [ "$rc" -ne 1 ]; then
            echo "::error::check-namespace-drift.sh self-test must exit 1 (bare-namespace canary" \
                 "detected, ogsr-prefixed fixture stays clean); got rc=$rc. The guard's" \
                 "detection is unproven — refusing to trust a clean result on the real tree."
            exit 1
          fi
          echo "self-test ok — bare-namespace canary is detected and the prefixed fixture stays clean (rc=1)."
          bash tools/check-namespace-drift.sh

  check-clean-copiedfrom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ogsr-check-clean.sh excludes OLM's copied CSVs (offline self-test, no cluster)
        # ogsr-check-clean.sh's CSV_INDEX used to be read with no `-l '!olm.copiedFrom'` filter,
        # unlike ogsr-uninstall.sh's csv_index() and this same file's own section [3/9] orphan-CSV
        # read, both of which already filter OLM's per-namespace copies and document why. OLM
        # copies a CSV into every namespace its OperatorGroup targets — for an AllNamespaces-mode
        # operator that is every namespace on the cluster — so the unfiltered read inflated
        # ns_has_foreign_csv() to answer "yes" for nearly the whole cluster, drowning the one
        # namespace that genuinely hosts an unaccounted operator under false positives. --self-test
        # proves the exclusion fires against a stubbed `oc` (never a real cluster) and that a
        # namespace holding a genuine, unaccounted ORIGINAL CSV is still caught after the fix.
        run: |
          rc=0
          bash bootstrap/ogsr-check-clean.sh --self-test || rc=$?
          # Exactly 1 = both proofs held (copy excluded from CSV_INDEX; a real foreign CSV still
          # caught). 0/2 = the exclusion is missing/broken or the fixture harness itself is broken.
          # Either way detection is unproven, so fail rather than trust the fix on a live cluster.
          if [ "$rc" -ne 1 ]; then
            echo "::error::ogsr-check-clean.sh self-test must exit 1 (copiedFrom exclusion proven," \
                 "real foreign CSV still caught); got rc=$rc. The fix is unproven — refusing to" \
                 "trust it against a live cluster."
            exit 1
          fi
          echo "self-test ok — copied CSVs are excluded and a genuine foreign CSV is still caught (rc=1)."

  maas-model-no-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: content/antora.yml's maas_model default must match versions.yaml's maas.model
        # versions.yaml's maas.model is the audited source of truth (task #67 QA gate: a live
        # HTTP 401 key_model_access_denied corrected the prior qwen3-14b default to
        # llama-scout-17b). content/antora.yml carries its own hand-maintained copy as the
        # asciidoc.attributes.maas_model dev default every {maas_model} reference in the built
        # site resolves from unless a deploy playbook overrides it. Unlike version-attributes.adoc
        # (generated by tools/gen-attributes.sh, gated in content-build's "Version-attribute drift
        # gate"), this pair has no generator and, before this job, no gate — a versions.yaml model
        # correction could ship without anyone touching antora.yml, and every attendee namespace
        # would get a MaaS key scoped to the stale model. Same self-test-first discipline as this
        # workflow's other guards — an unproven detector must not certify a tree.
        run: |
          rc=0
          python3 tools/lint/maas-model-no-default-guard.py --self-test || rc=$?
          # Exactly 1 = the drifted canary was detected AND the clean canary stayed clean. 0 = the
          # detector is blind; 2 = a fixture is missing, the drifted canary went undetected, or the
          # clean canary false-positived. Either way detection is unproven, so fail rather than
          # trust a clean result on the real tree.
          if [ "$rc" -ne 1 ]; then
            echo "::error::maas-model-no-default-guard self-test must exit 1 (drift detected, clean" \
                 "canary stays clean); got rc=$rc. The guard's detection is unproven — refusing" \
                 "to trust a clean result on the real tree."
            exit 1
          fi
          echo "self-test ok — drift is detected and the clean canary stays clean (rc=1)."
          python3 tools/lint/maas-model-no-default-guard.py

  uninstall-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adopted Argo CD controller sizing is recorded on ONE key and actually restored
        # 2026-07-31: the adopted-Argo consent prompt promised "The prior value is recorded and
        # ogsr-uninstall.sh restores it" while recording two keys NOTHING read, next to a teardown
        # branch reading a third key that printed a manual `oc edit` hint instead of restoring. Two
        # keys for one fact, zero restores, under the workshop's hardest promise (leave no trace on
        # someone else's cluster). Invisible to every other gate here: both halves are valid shell
        # that lints clean, and the only symptom is a CR on an adopted cluster nobody inspects.
        #
        # The guard checks (1) key symmetry — every argocd/controller uninstall-state key an
        # installer writes is read by ogsr-uninstall.sh and vice versa, and (2) the restore itself,
        # by executing restore_argocd_controller_resources() against stub oc/state and asserting the
        # patches: empty prior REMOVES the field (merge-patch null, never a number written back),
        # recorded prior is replaced verbatim with a JSON patch, and no-consent / absent-CR /
        # --dry-run all write nothing.
        run: |
          rc=0
          bash tools/lint/uninstall-restore-guard.sh --self-test || rc=$?
          # Exactly 1 = the real tree satisfies the contract AND both canaries (a write-only restore
          # key, and an empty-prior branch that writes 2Gi back instead of removing the field) were
          # detected. 0 = a detector is blind; 2 = the real tree is broken, extraction failed, or the
          # fixture harness is. Either way detection is unproven, so fail rather than trust a clean
          # result on the real tree.
          if [ "$rc" -ne 1 ]; then
            echo "::error::uninstall-restore-guard self-test must exit 1 (real tree clean, both" \
                 "canaries detected); got rc=$rc. The guard's detection is unproven — refusing to" \
                 "trust a clean result on the real tree."
            exit 1
          fi
          echo "self-test ok — both canaries are detected and the real tree stays clean (rc=1)."
          bash tools/lint/uninstall-restore-guard.sh
