---
name: lint
on:
  push:
    branches: [main]
  pull_request:
  # Nightly full run. Added 2026-08-01 with the canary-coverage scoping below: that job now does
  # its expensive mutation sweep only when a guard actually changed, so the schedule is what keeps
  # a whole-tree sweep happening on a fixed cadence regardless of what anyone pushed. Cheap — this
  # repo is public, so Actions minutes are free — and it also re-runs the other 33 jobs against
  # whatever has drifted underneath them (a pinned action, a new shellcheck release).
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:

# Supersede, don't queue. Only the tip's result is interesting on a trunk-only repo, and
# without this every commit queues a fresh run that never self-cancels: 95 commits in one
# session left 17 superseded runs sitting AHEAD of the ones for current HEAD, testing code
# that no longer existed. cancel-in-progress is correct here (unlike for a Pages deploy) —
# an abandoned lint run has nothing to leave half-finished.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Privacy guard (no private domains/emails in tracked files)
        # LITERAL patterns only. The API-key pattern that used to live in this alternation moved to
        # the guard below (task #97): `sk-[A-Za-z0-9]{20}` needs twenty CONSECUTIVE alphanumerics,
        # so a single `_` in the first twenty characters breaks the run — measured 2026-07-29, it
        # does not match a real key of the shape this project actually uses, and this step printed
        # "clean". The fix needs an opacity test that a POSIX ERE cannot express (no lookahead), and
        # more importantly needs a canary, which an inline grep cannot have.
        run: |
          # Ephemeral-cluster domains and personal emails. (The shared RHDP MaaS host is
          # semi-public — referenced in public rhpds repos — and is queued for parameterization
          # in the packaging wave rather than blocked here.)
          #
          # `git grep` exits 0 (match), 1 (no match), or >1 (the invocation itself failed — a bad
          # pattern, a broken pathspec). An `if git grep …; then FAIL; fi` form treats every
          # non-zero the same way, so a >1 error silently falls through to "clean" — the exact
          # negated-existence-test shape (`! oc get X` reporting "clean slate" on a lookup that
          # never ran) this project has been bitten by before. The case below tells "no matches"
          # apart from "grep itself broke" and fails loudly on the latter instead of passing.
          rc=0
          git grep -nE "dynamic2\.redhatworkshops|cluster-qvkd|@gmail\.com" -- . ':!.github/workflows/lint.yml' || rc=$?
          case "$rc" in
            0)
              echo "::error::Private-info pattern found in tracked files (see matches above). Private material belongs in ../Project-Shared (outside the repo) or gitignored vars.yaml."
              exit 1
              ;;
            1)
              echo "Privacy guard clean."
              ;;
            *)
              echo "::error::git grep itself failed (exit $rc) instead of returning a clean scan —" \
                   "the pattern or pathspec is broken. Refusing to treat an error the same as" \
                   "'no matches found'."
              exit 1
              ;;
          esac

      - name: API keys must not be committed, whatever separators they carry
        # Catches a key by SHAPE — token-start `sk-`, >=20 chars of [A-Za-z0-9_-], and an unbroken
        # alphanumeric chunk of >=12 carrying both a letter and a digit. That last layer is what
        # separates a credential (opaque) from a slug (words): it clears all five false positives
        # the naive widening `sk-[A-Za-z0-9_-]{16,}` produces on this tree, including the two
        # `parasol-task-…` names whose `task-` contains `sk-`. Stdlib only — no pip step.
        run: |
          rc=0
          python3 tools/lint/api-key-shape-guard.py --self-test || rc=$?
          # Exactly 1 = every constructed key shape detected AND every benign look-alike ignored.
          # 0 = guard blind; 2 = fixture missing, a shape went undetected, or a benign line fired.
          # Either way detection is unproven, so fail rather than trust a clean tree scan.
          if [ "$rc" -ne 1 ]; then
            echo "::error::api-key-shape-guard self-test must exit 1 (canary shapes detected);" \
                 "got rc=$rc. The guard's detection is unproven — refusing to trust a clean" \
                 "result on the real tree."
            exit 1
          fi
          python3 tools/lint/api-key-shape-guard.py

  click-to-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: An interactive `read` must be the last line of a click-to-run block
        # content/supplemental-ui/js/click-to-run.js sends an ENTIRE [source,...,role=execute]
        # block to the terminal in a single write, so a mid-block interactive `read` swallows the
        # line after it as its own answer. Shipped TWICE (76ae9d3, 2026-07-29): gitops-at-scale's
        # workshop-password read ate the ARGOCD_AUTH_TOKEN export (401 two blocks later), and
        # pipelines-fundamentals' Gitea-token read ate the webhook-secret line (the Secret was
        # never created at all). Both are fixed and carry a "DO NOT merge this block" comment, but
        # nothing else stops a future edit from re-merging them.
        run: |
          rc=0
          python3 tools/lint/click-to-run-guard.py --self-test || rc=$?
          # Exactly 1 = EVERY broken canary case was detected, by name, AND every safe form beside
          # them (pipe-fed, explicit-fd, heredoc-body, tab-indented <<-, prose) stayed silent.
          # 0 = guard blind; 2 = fixture missing, a broken case went undetected, or a safe form
          # wrongly fired. Either way detection is unproven, so fail rather than trust a clean run.
          #
          # The fixture grew from 6 cases to 12 on 2026-08-01. Five of this guard's nine patterns
          # ENABLE detection rather than trigger it, so blinding one only makes the guard quieter —
          # a safe fixture case can never witness them, which is exactly why they went uncovered.
          # Each now has a BROKEN case only it can catch, and the self-test names the offender that
          # went missing rather than reporting "expected 5, got 4".
          if [ "$rc" -ne 1 ]; then
            echo "::error::click-to-run-guard self-test must exit 1 (every broken canary case" \
                 "detected by name, safe forms silent); got rc=$rc. The guard's detection is" \
                 "unproven — refusing to trust a clean result on the real tree."
            exit 1
          fi
          python3 tools/lint/click-to-run-guard.py

  credential-redaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Credential redaction guard (no truncation-as-a-safety)
        # Sibling to the privacy guard: that one catches a secret COMMITTED to the tree, this one
        # catches a secret DISPLAYED at runtime behind a character count. 2026-07-29: a diagnostic
        # showed a gateway error line through `cut -c1-200` and the echoed key started at character
        # 201 — safe by ten characters — while the same shape one module over (`b[:400]`, key at
        # character 75) was already leaking. Neither is visible to a git grep.
        run: |
          rc=0
          python3 tools/lint/credential-redaction-guard.py --self-test || rc=$?
          # Exactly 1 = canary detected. 0 = guard blind; 2 = fixture missing/empty scope. Either
          # way detection is unproven, so fail rather than trust a clean run on the real tree.
          if [ "$rc" -ne 1 ]; then
            echo "::error::credential-redaction-guard self-test must exit 1 (canary detected);" \
                 "got rc=$rc. The guard's detection is unproven — refusing to trust a clean" \
                 "result on the real tree."
            exit 1
          fi
          echo "self-test ok — guard correctly rejected its own canary (rc=1)."
          python3 tools/lint/credential-redaction-guard.py

  # vale + yamllint run locally on maintainer machines (their configs are maintainer tooling,
  # kept out of the public tree per the 2026-07-19 owner review). CI keeps the checks that
  # guard the shipped artifact itself.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck every tracked shell script
        # git ls-files, not a filesystem walk. `find` lints whatever happens to be sitting in the
        # working tree, so the scope silently changes with the machine: on a maintainer laptop the
        # old walk selected 449 files (395 agent worktrees under .claude/, 10 vendored playwright
        # scripts under tools/media/.venv/) against 44 real ones, and the -not -path exclusion list
        # only ever grows after the next vendor dir slips through. The tracked set is the honest
        # definition of "scripts we ship" and is identical in every checkout.
        run: |
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(git ls-files -- '*.sh')
          # Extensionless bash scripts we ship (the ws CLI, utilities/*). Scoped by pathspec on
          # purpose: an unscoped shebang sweep also picks up the eight vendored apps/**/mvnw
          # wrappers, which are upstream Maven artifacts and not ours to lint.
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if head -1 "$f" | grep -qE '^#!.*sh'; then files+=("$f"); fi
          done < <(git ls-files -- 'tools/ws/ws' 'utilities/*')
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::ShellCheck selected zero files. The repo ships shell scripts, so an" \
                 "empty selection means this step is broken — refusing to pass on an empty scope."
            exit 1
          fi
          printf 'shellcheck: %s\n' "${files[@]}"
          shellcheck "${files[@]}"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: helm lint + template every chart
        run: |
          shopt -s nullglob
          charts=(gitops/entry-states/*/Chart.yaml)
          [ -f gitops/workshop-config/Chart.yaml ] && charts+=(gitops/workshop-config/Chart.yaml)
          [ -f helm/bootstrap/Chart.yaml ] && charts+=(helm/bootstrap/Chart.yaml)
          if [ ${#charts[@]} -eq 0 ]; then
            echo "No Helm charts yet."; exit 0
          fi
          rc=0
          for c in "${charts[@]}"; do
            d="$(dirname "$c")"
            echo "::group::helm $d"
            helm lint "$d" || rc=1
            helm template "$d" >/dev/null || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

      # NOTE: the step above renders with DEFAULT values only, which is exactly how a plain-HTTP
      # Route reached a live cluster twice. config-multienv emits its stage/prod Routes only under
      # `solve=true`, so `helm template <dir>` never produced them and never checked them. The guard
      # below renders each chart under the value permutations that change what is emitted.
      - name: Browser-facing Routes must be edge-terminated
        # Measured 2026-08-01: this guard had NO --self-test mode. `route-tls-guard.sh --self-test`
        # — the house flag, spelled correctly — discarded the argument in silence and ran the PLAIN
        # check, which passes on a healthy tree by definition, then exited 0 with a green result. So
        # this step ran the gate with nothing whatsoever asserting that its detection still works,
        # and a maintainer reaching for the documented flag got a tick that proved nothing.
        #
        # The self-test now drives the real check with each of its TWO input halves collapsed in
        # turn — to ZERO and to a genuine TRUNCATION (2 of 56 renders; 2 of 16 gitops manifests;
        # 1 of 2 platform-portfolio manifests) — with the other half left healthy, and plants a
        # TLS-less Route in each half to prove the verdict propagates. Truncation passing outright
        # was a real defect in this file earlier that same night, which is why every half is proven
        # at a non-empty collapse and not just at zero.
        run: |
          rc=0
          ./tools/lint/route-tls-guard.sh --self-test || rc=$?
          # Exactly 1 = every canary correctly caught. 0 = a detector is blind (or the flag was
          # discarded again); 2 = a canary was missed, or the real tree does not pass under the real
          # defaults, which the plain run below would report anyway.
          if [ "$rc" -ne 1 ]; then
            echo "::error::route-tls-guard self-test must exit 1 (TLS-less Route rejected and an" \
                 "edge-terminated one accepted, both input halves caught at zero AND at a" \
                 "truncation, a real finding surfaced through each half); got rc=$rc. The guard's" \
                 "detection is unproven — refusing to trust a clean result on the real tree."
            exit 1
          fi
          echo "self-test ok — detectors fire, both scope halves floor-checked, real tree clean (rc=1)."
          ./tools/lint/route-tls-guard.sh

  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize (pinned)
        run: |
          curl -sfL -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.0/kustomize_v5.8.0_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
      - name: kustomize build every tracked platform-portfolio overlay/base
        # git ls-files, not a filesystem walk — the same determinism defect fixed in the shellcheck
        # job (9549990). The walk descends into platform-portfolio/components/*/charts/, which is
        # gitignored (.gitignore:34) and inflated at build time by this very step's --enable-helm.
        # Today the two selections agree exactly (47 = 47) only because the pinned sonarqube chart
        # happens to ship no kustomization.yaml of its own — a property of an upstream tarball we
        # do not control and that is re-decided on every chart bump. The descent is real, not
        # theoretical: a canary kustomization.yaml planted under that directory is picked up by the
        # walk and correctly ignored by git ls-files. The tracked set is what we actually ship.
        #
        # `git ls-files -- <dir> | grep` rather than a '**/' pathspec on purpose: in git PATHSPECS
        # (unlike .gitignore patterns) '**/' does not match zero directories, so
        # 'platform-portfolio/**/kustomization.yaml' silently drops a future top-level
        # platform-portfolio/kustomization.yaml. The grep is the literal equivalent of find's
        # -name — a basename match at any depth — and was verified against both cases.
        run: |
          rc=0
          files=()
          # No `sort`: git ls-files already emits bytewise-sorted paths, and unlike sort(1) that
          # order does not shift with the runner's locale.
          while IFS= read -r k; do files+=("$k"); done < <(
            git ls-files -- platform-portfolio | grep -E '(^|/)kustomization\.yaml$'
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::kustomize selected zero kustomization.yaml files. The portfolio ships" \
                 "dozens, so an empty selection means this step is broken — refusing to pass on" \
                 "an empty scope."
            exit 1
          fi
          for k in "${files[@]}"; do
            d="$(dirname "$k")"
            echo "::group::kustomize build $d"
            if ! kustomize build --enable-helm "$d" >/dev/null; then
              echo "::error::kustomize build failed: $d"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit "$rc"

  image-pull-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same helm pin as the helm/copy-drift jobs so every job reads the same render.
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Install kustomize (pinned)
        # Same pin as the kustomize job — the promotion template is kustomize, not Helm.
        run: |
          curl -sfL -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.0/kustomize_v5.8.0_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML (pinned)
        # Hard dependency: this guard parses rendered manifests rather than pattern-matching them.
        # A missing parser exits 2, which the self-test assertion turns into a failure — it can
        # never degrade into a silent pass.
        run: python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Workshop-built images must be pulled with Always
        # Every image we build is tagged 1.0/1.1 and rebuilt IN PLACE, so the tag is mutable, and
        # Kubernetes defaults any non-:latest tag to IfNotPresent — a node with that tag cached
        # serves the OLD layers. Measured on a live cluster 2026-07-29; 4efc931 fixed all 29 sites.
        #
        # This guard RENDERS rather than greps, which is the whole point: config-multienv emits two
        # of its three claims Deployments from a named template in _helpers.tpl, invisible to
        # `grep image: templates/*.yaml`. That blind spot swallowed the chart twice — this sweep and
        # the Route-TLS sweep of 2026-07-27. Every other author-facing check here is line-oriented,
        # so the defect class recurs by construction until one gate renders.
        run: |
          rc=0
          python3 tools/lint/image-pull-policy-guard.py --self-test || rc=$?
          # Exactly 1 = every canary detected. 0 = guard blind; 2 = fixture missing, a canary went
          # undetected, or a dependency is absent. Either way detection is unproven.
          if [ "$rc" -ne 1 ]; then
            echo "::error::image-pull-policy-guard self-test must exit 1 (canaries detected);" \
                 "got rc=$rc. The guard's detection is unproven — refusing to trust a clean" \
                 "result on the real tree."
            exit 1
          fi
          python3 tools/lint/image-pull-policy-guard.py

  hook-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML (pinned)
        run: python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Hook scripts must not reference undefined variables
        # Entry-state Jobs embed bash that runs under `set -euo pipefail`. A ${VAR} that is neither a
        # declared container env var nor assigned in-script is FATAL at the referencing line — and it
        # lands on the least-exercised branch, which is nearly always the error path. Measured on
        # a live cluster 2026-07-29: jobs-batch-kueue's hook died with `DST_USER: unbound variable` PART-WAY
        # THROUGH PRINTING ITS OWN ERROR, taking its deliberate exit-0 degrade with it. The Job failed
        # 5/5 and the module's sync failed on exactly the clusters meant to degrade quietly. d53dccb
        # fixed it; this stops it returning.
        run: |
          rc=0
          python3 tools/lint/hook-env-guard.py --self-test || rc=$?
          # Exactly 1 = the DST_USER shape and a Template-nested script are both detected, AND
          # inline/loop/read/local assignments are correctly NOT reported. 0 = blind; 2 = a shape went
          # undetected or a benign assignment fired. Either way detection is unproven.
          if [ "$rc" -ne 1 ]; then
            echo "::error::hook-env-guard self-test must exit 1 (canary shapes detected);" \
                 "got rc=$rc. Detection is unproven — refusing to trust a clean tree scan."
            exit 1
          fi
          python3 tools/lint/hook-env-guard.py

  rebuild-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML (pinned)
        # The recorded cluster is YAML. A missing parser exits 2, which the self-test assertion
        # below turns into a failure — it can never degrade into a silent pass.
        run: python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.2'
      - name: The image-drift scan must still report what a recorded cluster produces
        # `ws rebuild-images --check` and `ws doctor`'s drift row answer "is this pod on the image
        # we think it is". That needs a cluster, so the SCAN cannot run here — but the reporting
        # can, against a recording of one. The point is the failure mode: a wrong answer here is a
        # clean report, never an error, so nothing about it is visible by reading the diff. Its
        # author's first draft shipped four such defects (collapsed CronJob selector column,
        # double-counted Knative Revisions, a service-wide ksvc pod match calling a rolled service
        # stale, an image ref split from the left) and every one was found by running it.
        #
        # This is NOT a substitute for `ws rebuild-images --check` on a live cluster: the recording
        # is of TEMPLATED oc output, so the go-templates inside rebuild_enumerate are data here.
        # Their emptiness guards are pinned statically instead, and the guard's own header says so.
        run: |
          rc=0
          python3 tools/lint/rebuild-scan-guard.py --self-test || rc=$?
          # Exactly 1 = every reintroduced defect was caught AND the unmutated tree passed its own
          # suite. 0 = the guard is blind; 2 = a mutant slipped through, a mutation became a no-op
          # because the code was reworded, the control failed, or a fixture is missing. Either way
          # detection is unproven, so fail rather than trust a clean result on the real tree.
          if [ "$rc" -ne 1 ]; then
            echo "::error::rebuild-scan-guard self-test must exit 1 (every reintroduced defect" \
                 "detected); got rc=$rc. The guard's detection is unproven — refusing to trust a" \
                 "clean result on the real tree."
            exit 1
          fi
          python3 tools/lint/rebuild-scan-guard.py

  module-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nav order matches modules.yaml (Gen-4 catalog guard)
        # Asserts the Antora sidebar order equals the modules.yaml catalog order (position =
        # number). Dependency-light: yq if present, else a built-in awk fallback.
        #
        # --self-test builds a throwaway modules.yaml + nav fixture under mktemp, proves a
        # correctly-ordered fixture passes, then proves a genuine two-slug reorder (not the
        # same-slug no-op swap that produced a false negative on this guard's first hand-test)
        # is caught. Never touches the real tree.
        run: |
          rc=0
          bash tools/check-module-order.sh --self-test || rc=$?
          # Exactly 1 = both proofs held (swap detected, correctly-ordered fixture stays clean).
          # 0/2 = the guard is blind or the fixture harness itself is broken. Either way
          # detection is unproven, so fail rather than trust a clean result on the real tree.
          if [ "$rc" -ne 1 ]; then
            echo "::error::check-module-order.sh self-test must exit 1 (reorder canary" \
                 "detected, correctly-ordered fixture stays clean); got rc=$rc. The guard's" \
                 "detection is unproven — refusing to trust a clean result on the real tree."
            exit 1
          fi
          echo "self-test ok — reorder canary is detected and the good fixture stays clean (rc=1)."
          bash tools/check-module-order.sh

  copy-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The copy side of most pairs is a Helm template, which is not valid YAML until Helm has
      # rendered it. Same pin as the helm job so both read the same render.
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      # setup-python rather than the runner's system python3: this step pip-installs, and a
      # PEP 668 "externally-managed-environment" python would refuse. The tool-cache interpreter
      # has its own site-packages and installs cleanly.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML (pinned)
        # This guard parses YAML properly rather than pattern-matching it, so the parser is a hard
        # dependency and is installed explicitly — not assumed to be in the runner image. If it
        # were ever missing the guard exits 2, which the self-test assertion below turns into a
        # failure; it can never degrade into a silent pass.
        run: python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Hand-maintained copies must stay in sync with their source
        # ABSORBED the former content-build "Claims seed drift gate"
        # (tools/lint/seed-drift-guard.sh, deleted): that one gated a single pair with `cmp -s`,
        # and byte identity could not express the four other pairs — three of them are correctly
        # in sync yet deliberately NOT byte-identical (the chart copy injects a namespace, an owner
        # label, or extra evidence comments), so a byte gate would have reddened main on work that
        # is right. They therefore went unguarded. This guard parses both sides and compares them
        # as data against a per-pair allow-list of INJECTED keys; the seed pair lives on here as
        # mode="bytes". Same self-test discipline as the credential/curl guards — prove the
        # detectors fire on the canary fixtures before believing a clean result on the real tree.
        run: |
          rc=0
          python3 tools/lint/copy-drift-guard.py --self-test || rc=$?
          # Exactly 1 = every canary detected. 0 = guard blind; 2 = fixture missing, a canary went
          # undetected, or a dependency is absent. Either way detection is unproven.
          if [ "$rc" -ne 1 ]; then
            echo "::error::copy-drift-guard self-test must exit 1 (canaries detected); got" \
                 "rc=$rc. The guard's detection is unproven — refusing to trust a clean" \
                 "result on the real tree."
            exit 1
          fi
          python3 tools/lint/copy-drift-guard.py

  namespace-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No bare pre-rename workshop namespaces in namespace-valued positions
        # ogsr- rename drift guard (SEV1 2026-07-18): fails if a pre-rename workshop namespace
        # short-name (student-gitops, gitea, showroom, parasol-tasks, parasol-images,
        # observability-workshop) appears BARE in a namespace-valued position (namespace: field,
        # oc -n flag, managed-by label value, or <svc>.<ns>.svc DNS). Resource/instance NAMEs, the
        # pinned Route host, and the gitea CRD kind are not namespace positions and never trip it.
        #
        # --self-test builds a scratch git repo under mktemp with the exact scan dirs, proves an
        # ogsr-prefixed fixture stays clean, then proves a bare `namespace: gitea` — the precise
        # SEV1 defect shape — is caught. Never touches the real tree.
        run: |
          rc=0
          bash tools/check-namespace-drift.sh --self-test || rc=$?
          # Exactly 1 = both proofs held (bare-namespace canary detected, ogsr-prefixed fixture
          # stays clean). 0/2 = the guard is blind or the fixture harness itself is broken.
          # Either way detection is unproven, so fail rather than trust a clean result on the
          # real tree.
          if [ "$rc" -ne 1 ]; then
            echo "::error::check-namespace-drift.sh self-test must exit 1 (bare-namespace canary" \
                 "detected, ogsr-prefixed fixture stays clean); got rc=$rc. The guard's" \
                 "detection is unproven — refusing to trust a clean result on the real tree."
            exit 1
          fi
          echo "self-test ok — bare-namespace canary is detected and the prefixed fixture stays clean (rc=1)."
          bash tools/check-namespace-drift.sh

  check-clean-copiedfrom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ogsr-check-clean.sh's whole proof suite holds (offline self-test, no cluster)
        # THE JOB KEY IS HISTORICAL. `check-clean-copiedfrom` is named for the FIRST thing this
        # self-test proved; it now runs the script's entire proof suite and the suite keeps growing.
        # The key is kept because it is a stable CI identifier, but do not read it as the scope —
        # a red run here is far more likely to be about something other than copiedFrom.
        #
        # ORIGIN (still proven, now one proof among many). CSV_INDEX used to be read with no
        # `-l '!olm.copiedFrom'` filter, unlike ogsr-uninstall.sh's csv_index() and this same file's
        # section [3/9] orphan-CSV read. OLM copies a CSV into every namespace its OperatorGroup
        # targets — for an AllNamespaces operator, every namespace on the cluster — so the unfiltered
        # read inflated ns_has_foreign_csv() to "yes" for nearly the whole cluster, burying the one
        # namespace genuinely hosting an unaccounted operator.
        #
        # SCOPE TODAY covers at least: that exclusion, the declared-residue ledger in both
        # directions (undeclared leftover fails AND stale declaration fails), residue_lint's
        # malformed shapes, shared-CRD withholding (a foreign CSV co-owns it, or a live instance
        # sits outside our namespaces), the control that a CRD which IS ours alone is still offered
        # for deletion, and fail-closed canaries for every read the decision depends on.
        #
        # NO PROOF COUNT HERE, deliberately — same reason the canary-coverage job carries no guard
        # count. The script prints its own numbered proofs; read them. What this job asserts is the
        # CONTRACT (`--self-test` exits exactly 1 = every canary was correctly detected), and that
        # contract does not change when a proof is added.
        run: |
          rc=0
          bash bootstrap/ogsr-check-clean.sh --self-test || rc=$?
          # Exactly 1 = every proof in the suite held. 0 = at least one canary went UNDETECTED, so
          # some detection is silently broken. 2 = the fixture harness itself could not run, so
          # nothing was proven. All three non-1 outcomes mean detection is unproven — fail rather
          # than trust this script against a live cluster, where its job is to decide what an
          # admin is told to delete.
          if [ "$rc" -ne 1 ]; then
            echo "::error::ogsr-check-clean.sh --self-test must exit exactly 1; got rc=$rc." \
                 "Run it locally and read the numbered proof lines — the FAILING one names what" \
                 "broke. Do not assume this is the copiedFrom check; the suite covers the residue" \
                 "ledger, shared-CRD withholding and the fail-closed canaries too."
            exit 1
          fi
          echo "self-test ok — every proof in the suite held (rc=1)."

  digest-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No floating tag in the curated task library, or on any entitled image the installer pulls
        # WHY THIS JOB EXISTS. pipelines/tasks/image-size-report.yaml shipped
        # `registry.redhat.io/openshift4/ose-cli:latest` for the whole life of the module that
        # TEACHES digest pinning, and nothing in this workflow was looking: there were guards for
        # pull policy, CDN assets, API-key shapes and eight kinds of copy drift, and none asserted
        # that an image reference is immutable.
        #
        # The tag had also drifted somewhere nobody could see from the manifest. On the el8
        # `openshift4/ose-cli` repository `latest` is the ONLY short tag published — v4.16 through
        # v4.22 do not exist there — and it has been frozen on v4.15.0 since 2025-09-25 with
        # freshness grade D and unapplied Critical errata. A floating tag was resolving to a client
        # seven minors OLDER than versions.yaml's own OCP floor.
        #
        # SCOPE IS TWO TIERS, AND THE SECOND ONE ARRIVED LATER ON PURPOSE. Tier 1 is the curated
        # library — every image in it, whatever the registry — because those Tasks are what every
        # app pipeline taskRefs by cluster resolver. Ten of its eleven real step images were already
        # pinned (the twelfth `image:` field is a ${IMAGE} parameter), so pinning the last one made
        # the convention unanimous rather than imposing a new one.
        #
        # Tier 1 shipped ALONE the first day, because a grep for floating `image:` tags returned 55
        # hits outside tools/lint fixtures and 44 were the same `ose-cli:latest` in one-shot hook
        # Jobs. A gate that opens on 44 pre-existing findings gets switched off inside a day and
        # takes the findings that matter with it. Tier 2 landed once those 44 were swept — surveyed
        # by kind, checked against the >=512Mi and no-runtime-dnf constraints, proved on a live
        # cluster, repinned onto ose-cli-rhel9:v4.22@sha256:… — and it now polices every
        # registry.redhat.io reference under gitops/, platform-portfolio/, helm/ and pipelines/
        # (664 files, 53 references, 0 unpinned). It reads any YAML field, not just `image:`,
        # because helm/bootstrap/values.yaml's `images.cli` is one value feeding ten Jobs.
        #
        # UBI base images, in-cluster ImageStreamTags, Dev Spaces UDIs and content/** are still out
        # of scope. The guard's own docstring records each one and why; widen it there, not here.
        run: |
          rc=0
          python3 tools/lint/digest-pin-guard.py --self-test || rc=$?
          # Exactly 1 = every floating-tag and malformed-digest canary fired AND every correct
          # form (bare digest, tag@digest, parameter placeholder, prose in a comment) stayed
          # clean. 0 = the detectors are blind; 2 = a canary went undetected, a correct form was
          # false-positived, or the scope floors did not refuse a collapsed input set. Detection
          # is unproven in every one of those cases, so fail rather than trust a clean tree run.
          if [ "$rc" -ne 1 ]; then
            echo "::error::digest-pin-guard self-test must exit 1 (floating tags detected, correct" \
                 "pins stay clean); got rc=$rc. The guard's detection is unproven — refusing" \
                 "to trust a clean result on the real tree."
            exit 1
          fi
          echo "self-test ok — floating tags fail, correct pins pass, collapsed scope refuses (rc=1)."
          python3 tools/lint/digest-pin-guard.py

  maas-model-no-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: content/antora.yml's maas_model default must match versions.yaml's maas.model
        # versions.yaml's maas.model is the audited source of truth (task #67 QA gate: a live
        # HTTP 401 key_model_access_denied corrected the prior qwen3-14b default to
        # llama-scout-17b). content/antora.yml carries its own hand-maintained copy as the
        # asciidoc.attributes.maas_model dev default every {maas_model} reference in the built
        # site resolves from unless a deploy playbook overrides it. Unlike version-attributes.adoc
        # (generated by tools/gen-attributes.sh, gated in content-build's "Version-attribute drift
        # gate"), this pair has no generator and, before this job, no gate — a versions.yaml model
        # correction could ship without anyone touching antora.yml, and every attendee namespace
        # would get a MaaS key scoped to the stale model. Same self-test-first discipline as this
        # workflow's other guards — an unproven detector must not certify a tree.
        run: |
          rc=0
          python3 tools/lint/maas-model-no-default-guard.py --self-test || rc=$?
          # Exactly 1 = the drifted canary was detected AND the clean canary stayed clean. 0 = the
          # detector is blind; 2 = a fixture is missing, the drifted canary went undetected, or the
          # clean canary false-positived. Either way detection is unproven, so fail rather than
          # trust a clean result on the real tree.
          if [ "$rc" -ne 1 ]; then
            echo "::error::maas-model-no-default-guard self-test must exit 1 (drift detected, clean" \
                 "canary stays clean); got rc=$rc. The guard's detection is unproven — refusing" \
                 "to trust a clean result on the real tree."
            exit 1
          fi
          echo "self-test ok — drift is detected and the clean canary stays clean (rc=1)."
          python3 tools/lint/maas-model-no-default-guard.py

  module-number-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every MNN token names a module that exists, and agrees with any slug beside it
        # WHY. The Gen-4 renumber moved AppSec out of the twenties down to M08 and shifted the
        # modules above it up by one. Its sweeps covered content/ pages and platform-portfolio/ and
        # stopped there, so apps/, bootstrap/, helm/, tools/ and content/antora.yml kept pointing at
        # the old catalogue for three weeks — 189 lines, including strings install.sh PRINTS TO AN
        # OPERATOR mid-install and all five module references in content/antora.yml. A second, older
        # generation was stacked underneath it: tokens in the high twenties and thirties, left from
        # a catalogue that had at least 32 modules.
        #
        # Nothing caught it because nothing could. The build does not change, no test fails, and a
        # reader who follows a wrong number simply lands on the wrong module and believes it.
        #
        # This guard asserts only the two things that are MECHANICAL:
        #   1. range      — every MNN is within 1..len(modules.yaml). Catches the whole
        #                   dead-catalogue class; three distinct dead numbers were live in the tree.
        #   2. agreement  — a line carrying both a module SLUG and a number must not disagree.
        #
        # NOTE this comment deliberately spells the dead numbers out in words. The guard cannot tell
        # a number being QUOTED from one being USED, and exempting this file would blind it on the
        # workflow that runs it — so the prose works around the guard rather than the reverse.
        #
        # It deliberately does NOT judge a bare number with no slug beside it. That needs to know
        # whether the line is a live reference or dated provenance — "(found at M12 G1,
        # 2026-07-11)" records a real finding under the numbering in force that day, and
        # "correcting" it would falsify the record. No regex separates those. That judgment stays
        # human; this covers the part that does not need one.
        run: |
          rc=0
          python3 tools/lint/module-number-drift-guard.py --self-test || rc=$?
          # Exactly 1 = all four canaries behaved: an out-of-range token was caught, a
          # slug/number disagreement was caught, a CORRECT file raised nothing (the negative arm,
          # without which a guard that flagged everything would still "pass"), and the inline-SVG
          # exclusion was proven narrow — the same value ignored inside d="M27 6C…" and still
          # caught on an ordinary line. 0 or 2 means detection is unproven; fail rather than let
          # an unproven detector certify the tree.
          if [ "$rc" -ne 1 ]; then
            echo "::error::module-number-drift-guard self-test must exit exactly 1; got rc=$rc." \
                 "One of the four canaries did not behave, so a clean run on the real tree proves" \
                 "nothing. Read the SELF-TEST FAIL lines above — each names which arm broke."
            exit 1
          fi
          echo "self-test ok — range, agreement, the correct-file negative arm and the narrow"
          echo "inline-SVG exclusion all held (rc=1)."
          python3 tools/lint/module-number-drift-guard.py

  uninstall-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adopted Argo CD controller sizing is recorded on ONE key and actually restored
        # 2026-07-31: the adopted-Argo consent prompt promised "The prior value is recorded and
        # ogsr-uninstall.sh restores it" while recording two keys NOTHING read, next to a teardown
        # branch reading a third key that printed a manual `oc edit` hint instead of restoring. Two
        # keys for one fact, zero restores, under the workshop's hardest promise (leave no trace on
        # someone else's cluster). Invisible to every other gate here: both halves are valid shell
        # that lints clean, and the only symptom is a CR on an adopted cluster nobody inspects.
        #
        # The guard checks (1) key symmetry — every argocd/controller uninstall-state key an
        # installer writes is read by ogsr-uninstall.sh and vice versa, and (2) the restore itself,
        # by executing restore_argocd_controller_resources() against stub oc/state and asserting the
        # patches: empty prior REMOVES the field (merge-patch null, never a number written back),
        # recorded prior is replaced verbatim with a JSON patch, and no-consent / absent-CR /
        # --dry-run all write nothing.
        run: |
          rc=0
          bash tools/lint/uninstall-restore-guard.sh --self-test || rc=$?
          # Exactly 1 = the real tree satisfies the contract AND both canaries (a write-only restore
          # key, and an empty-prior branch that writes 2Gi back instead of removing the field) were
          # detected. 0 = a detector is blind; 2 = the real tree is broken, extraction failed, or the
          # fixture harness is. Either way detection is unproven, so fail rather than trust a clean
          # result on the real tree.
          if [ "$rc" -ne 1 ]; then
            echo "::error::uninstall-restore-guard self-test must exit 1 (real tree clean, both" \
                 "canaries detected); got rc=$rc. The guard's detection is unproven — refusing to" \
                 "trust a clean result on the real tree."
            exit 1
          fi
          echo "self-test ok — both canaries are detected and the real tree stays clean (rc=1)."
          bash tools/lint/uninstall-restore-guard.sh

  uninstall-state-lifetime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The uninstall-state record outlives the teardown that would erase it
        # 2026-07-31: bootstrap/ogsr-uninstall.sh deleted the ogsr-system namespace, which is where
        # the ogsr-uninstall-state ConfigMap lives — so the record of what to undo lived inside the
        # thing being undone. Anything the teardown could NOT put back stayed on the cluster as the
        # workshop's value, and the next install's first-write-wins snapshot recorded it as "the
        # org's original". Measured live: recorded prior 2Gi, live Argo CD controller at our 6Gi, no
        # consent key to authorise the restore — one cycle from 6Gi becoming the permanent baseline.
        #
        # The guard checks the three mechanics that uphold the invariant "a value recorded as the
        # org's original must never be a value we ourselves wrote": (1) every restore path that
        # leaves our value on the org's object records residue, (2) ogsr-system is deleted only when
        # the residue ledger is empty, and (3) both capture paths refuse to re-derive a carried key.
        # Invisible to every other gate here — valid shell, lint-clean, and the only symptom is a CR
        # on a twice-installed cluster nobody inspects.
        run: |
          rc=0
          bash tools/lint/uninstall-state-lifetime-guard.sh --self-test || rc=$?
          # Exactly 1 = the real tree satisfies the contract AND all three canaries (a restore that
          # declines silently, a state-namespace delete that ignores the ledger, and a record_once
          # that re-derives a carried key) were detected. 0 = a detector is blind; 2 = the real tree
          # is broken, extraction failed, or the fixture harness is. Either way detection is
          # unproven, so fail rather than trust a clean result on the real tree.
          if [ "$rc" -ne 1 ]; then
            echo "::error::uninstall-state-lifetime-guard self-test must exit 1 (real tree clean," \
                 "all three canaries detected); got rc=$rc. The guard's detection is unproven —" \
                 "refusing to trust a clean result on the real tree."
            exit 1
          fi
          echo "self-test ok — all three canaries are detected and the real tree stays clean (rc=1)."
          bash tools/lint/uninstall-state-lifetime-guard.sh

  uninstall-operand-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Operands die before their operator, and the CRD list is captured before the cascade
        # 2026-07-31, one teardown, two defects that both reported success.
        #
        # (a) ogsr-uninstall.sh captured `crds_created` — the CRDs that exist because WE installed an
        # operator — inside its CSV-cleanup step, which runs AFTER the cascade has already deleted
        # most of the CSVs it reads. Measured: 17 CRDs recorded while 165 were still registered, and
        # ogsr-check-clean.sh section [9/9] reported those 17 as the complete list in its highest-
        # confidence "exact" mode and called the cluster clean.
        #
        # (b) The Pipelines operator creates TektonConfig for itself, so it carries no Argo
        # tracking-id and no cascade can prune it. After the uninstall the CSV and Subscription were
        # gone while TektonConfig was still up with 18 pods and a bound 1Gi PVC — every pod 1/1,
        # nothing managing it, nothing that would ever remove it.
        #
        # The guard proves four things by EXECUTING the real functions against stubs: the capture runs
        # pre-cascade and refuses an adopted operator's CRDs; the operand step sits between
        # step_stop_reconciliation and the cascade in main; the step deletes only our cluster-scoped,
        # non-Argo-tracked, non-adopted operands, blocking, in two passes; and the checker refuses
        # "exact" without crds_created_capture=pre-cascade. Invisible to every other gate here — both
        # halves are valid, lint-clean shell whose only symptom is a cluster nobody re-inspects.
        run: |
          rc=0
          bash tools/lint/uninstall-operand-order-guard.sh --self-test || rc=$?
          # Exactly 1 = the real tree satisfies all four contracts AND all six canaries (capture call
          # removed, authorization gate removed, operand step moved after the cascade, Argo-tracked
          # guard removed, second pass removed, capture-phase proof removed) were detected. 0 = a
          # detector is blind; 2 = the real tree is broken, extraction failed, or the harness is.
          # Either way detection is unproven, so fail rather than trust a clean result on the real tree.
          if [ "$rc" -ne 1 ]; then
            echo "::error::uninstall-operand-order-guard self-test must exit 1 (real tree clean, all" \
                 "six canaries detected); got rc=$rc. The guard's detection is unproven — refusing" \
                 "to trust a clean result on the real tree."
            exit 1
          fi
          echo "self-test ok — all six canaries are detected and the real tree stays clean (rc=1)."
          bash tools/lint/uninstall-operand-order-guard.sh

  operatorgroup-uniqueness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A second OperatorGroup in an adopted operator's namespace is a hard install failure
        # assert_single_operatorgroup() is the last line of defense against the 2026-07-25 incident:
        # our component applied its own OperatorGroup into a namespace that already had one (an
        # org-owned cert-manager-operator's). OLM then fails EVERY CSV in that namespace silently
        # (phase Failed, reason TooManyOperatorGroups) while the Deployments keep running 1/1 --
        # nothing looks wrong until the org's next upgrade. The assert had never been driven; proving
        # it live means breaking a namespace someone else depends on, so it gets a guard instead.
        #
        # Three scenarios, and the third is what makes this a real gate rather than a blunt one: a
        # clean cluster passes; OUR OperatorGroup landing next to the org's fails with the degradation
        # warning and an undo hint naming ours, never theirs; and a pre-existing collision we did NOT
        # cause still PASSES. A check that failed every multi-OperatorGroup namespace would block
        # installs on states we have no business fixing, and would be switched off the first time it
        # fired on a customer cluster.
        run: |
          rc=0
          bash tools/lint/operatorgroup-uniqueness-guard.sh --self-test || rc=$?
          # Exactly 1 = the real tree satisfies the contract AND the canary (our own collision going
          # unflagged) was detected. 0 = the detector is blind; 2 = the real tree is broken,
          # extraction failed, or the harness is. Either way detection is unproven, so fail rather
          # than trust a clean result on the real tree.
          if [ "$rc" -ne 1 ]; then
            echo "::error::operatorgroup-uniqueness-guard self-test must exit 1 (real tree clean," \
                 "canary detected); got rc=$rc. The guard's detection is unproven -- refusing to" \
                 "trust a clean result on the real tree."
            exit 1
          fi
          echo "self-test ok -- the canary is detected and the real tree stays clean (rc=1)."
          bash tools/lint/operatorgroup-uniqueness-guard.sh

  batch-taint-pending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The batch-pool taint is not silently starving an unrelated pod's scheduling
        # assert_no_batch_taint_pending() exists because of the 2026-07-30 incident: on a 2-worker
        # cluster, tainting one worker for the batch pool left the survivor at 99% memory requests,
        # RHACS central-db Pending for 3h+ and Central crashlooping -- while every Argo application
        # reported Healthy throughout. The assert had never been driven; proving it live means
        # starving a real namespace, so it gets a guard instead.
        #
        # Five scenarios: no taint applied this run skips cleanly and touches oc ZERO times (proven
        # with a call-count file, not by reading the code); zero Pending pods and a Pending pod that
        # tolerates our taint both pass; a pod blocked SOLELY by our taint fails, naming the real
        # incident; and a pod citing an untolerated taint on a node that ALSO carries an unrelated
        # taint does NOT fail but still surfaces the ambiguity -- the exact false positive the
        # function's own header comment warns about.
        run: |
          rc=0
          bash tools/lint/batch-taint-pending-guard.sh --self-test || rc=$?
          # Exactly 1 = the real tree satisfies the contract AND the canary (a Pending pod blocked by
          # our taint going uncounted) was detected. 0 = the detector is blind; 2 = the real tree is
          # broken, extraction failed, or the harness is. Either way detection is unproven, so fail
          # rather than trust a clean result on the real tree.
          if [ "$rc" -ne 1 ]; then
            echo "::error::batch-taint-pending-guard self-test must exit 1 (real tree clean, canary" \
                 "detected); got rc=$rc. The guard's detection is unproven -- refusing to trust a" \
                 "clean result on the real tree."
            exit 1
          fi
          echo "self-test ok -- the canary is detected and the real tree stays clean (rc=1)."
          bash tools/lint/batch-taint-pending-guard.sh

  extract-func-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The shared function extractor does not swallow a one-line function
        # Six guards drive the REAL installer/uninstaller functions by lifting them out of the
        # script with a shared awk walker. The walker used to terminate a function body at a bare
        # closing brace on its own line -- so a ONE-LINE function (ogsr-check-clean.sh's state_get()
        # is a real example) made it consume the rest of the file, including later definitions that
        # then silently OVERRODE the guard's own stubs. The guard still ran and still passed. That is
        # the worst failure shape in this repo: a test that reports success while testing something
        # other than what it claims.
        #
        # The walker is now deduplicated into tools/lint/_extract-func.sh, and its self-test proves
        # the fix by first reproducing the OLD broken walker byte-for-byte, confirming that reference
        # does swallow a following definition, then asserting the real one does not.
        run: |
          rc=0
          bash tools/lint/_extract-func.sh --self-test || rc=$?
          # Exactly 1 = the one-line case is handled AND the broken-reference canary reproduced the
          # defect. 0 = the canary is not actually detecting; 2 = the harness itself is broken.
          if [ "$rc" -ne 1 ]; then
            echo "::error::_extract-func.sh --self-test must exit 1 (fix proven against a" \
                 "reproduction of the old broken walker); got rc=$rc."
            exit 1
          fi
          echo "self-test ok -- the one-line fix is proven against the old walker's behaviour."
          bash tools/lint/_extract-func.sh

  workshop-layer-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The workshop-layer FAILURE branch actually fails, and actually hides the success banner
        # a6407a5 added this gate because install.sh once printed the failure line and then
        # "✅ workshop bootstrap complete", exit 0, on a run whose entire workshop layer never
        # materialized. Anything scripting the installer reads the exit code, and the exit code said
        # fine. The SUCCESS path was proven live; the FAILURE path had only ever been READ, because
        # proving it live meant breaking a cluster others were testing on.
        #
        # The guard drives the real extracted functions under a stubbed `oc`: the poll loop
        # (wait_for_workshop_layer_healthy, both never-healthy and eventual-success) and the verdict
        # (emit_bootstrap_verdict), asserting the exit code AND the banner text as two SEPARATE
        # checks — a gate that exits 1 while still printing "complete" is exactly the false-green
        # this exists to prevent. Its second canary reproduces the original a6407a5 defect
        # byte-for-byte.
        run: |
          rc=0
          bash tools/lint/workshop-layer-gate-guard.sh --self-test || rc=$?
          # Exactly 1 = the real tree satisfies the contract AND both canaries were detected. 0 = a
          # detector is blind; 2 = the real tree, the extraction or the harness is broken. Either way
          # detection is unproven, so fail rather than trust a clean result on the real tree.
          if [ "$rc" -ne 1 ]; then
            echo "::error::workshop-layer-gate-guard self-test must exit 1 (real tree clean, both" \
                 "canaries detected); got rc=$rc. The guard's detection is unproven."
            exit 1
          fi
          echo "self-test ok -- both canaries are detected and the real tree stays clean (rc=1)."
          bash tools/lint/workshop-layer-gate-guard.sh

  owning-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yq (owning_stack_of_app reads the portfolio with it)
        run: |
          sudo curl -sfL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: The OperatorGroup fix-hint names the RIGHT stack, never a guess
        # owning_stack_of_app() supplies the remediation hint that assert_single_operatorgroup()
        # prints. A wrong answer here does not fail an install -- it hands an SA a copy-paste command
        # aimed at the WRONG stack's app-of-apps, while the real offender's sync policy stays armed
        # and keeps re-creating the OperatorGroup that caused the incident. Worse than no hint.
        #
        # Pure yq over platform-portfolio/stacks/**/apps/*.yaml, no cluster dependency, so the real
        # extracted function is driven against fixture trees AND the real portfolio. The canary drops
        # the exact-name comparison so the first glob match always wins -- the actual risk shape.
        run: |
          rc=0
          bash tools/lint/owning-stack-guard.sh --self-test || rc=$?
          # Exactly 1 = real tree clean AND the canary detected. 0 = the detector is blind; 2 = the
          # tree, the extraction or yq is broken. Either way detection is unproven, so fail rather
          # than trust a clean result.
          if [ "$rc" -ne 1 ]; then
            echo "::error::owning-stack-guard self-test must exit 1 (real tree clean, canary" \
                 "detected); got rc=$rc. The guard's detection is unproven."
            exit 1
          fi
          echo "self-test ok -- the canary is detected and the real tree stays clean (rc=1)."
          bash tools/lint/owning-stack-guard.sh

  verify-summary-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: An attendee verify banner may not claim a pass it did not grade
        # 2026-07-31 audit of all 26 modules: _lib.sh had THREE outcomes (pass/fail/skip) and
        # verify_summary knew TWO, so a run whose every GRADED check was skipped still ended
        # "✅ all 7 checks passed", exit 0 — in 11 of 26 scripts. In the worst one every RBAC
        # outcome check sits behind one capability guard, so an attendee without it saw the entire
        # lesson skipped and then a green all-clear. Another prints "this is NOT a pass" and the
        # summary then said all passed.
        #
        # The fix does NOT turn skips into failures — that doctrine is correct, a check that
        # genuinely cannot run must not fail someone who did nothing wrong. The banner is what lied.
        # The guard EXECUTES the real warn()/verify_summary() and pins both halves: the banner tells
        # the truth, and a skip still never becomes a false red.
        run: |
          rc=0
          bash tools/lint/verify-summary-skip-guard.sh --self-test || rc=$?
          # Exactly 1 = the real _lib.sh satisfies the contract AND all three canaries (counter-blind
          # warn, the pre-fix two-outcome banner verbatim, strict-by-default exit) were detected.
          # 0 = a detector is blind; 2 = the tree, the extraction or the harness is broken.
          if [ "$rc" -ne 1 ]; then
            echo "::error::verify-summary-skip-guard self-test must exit 1 (real tree clean, all" \
                 "canaries detected); got rc=$rc. The guard's detection is unproven."
            exit 1
          fi
          echo "self-test ok -- all three canaries are detected and the real tree stays clean (rc=1)."
          bash tools/lint/verify-summary-skip-guard.sh

  module-prep-pairing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML (pinned)
        # Hard dependency: the module catalog is the single source of truth for this check and the
        # guard parses it properly rather than pattern-matching it. A missing parser exits 2, which
        # the self-test assertion turns into a failure — it can never degrade into a silent pass.
        run: python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Every module must OFFER prep on its concept page and CONFIRM it on its lab page
        # 2026-08-05, F-13. `ws prep` takes minutes, so the offer moved to the concept page (it
        # builds while the attendee reads) and the lab page was reduced to confirming it. The pair
        # landed on 26 concept pages and 26 lab pages, and nothing structural holds the halves
        # together.
        #
        # Drop either half and the failure is SILENT — which is why this is a gate and not a review
        # item. Antora still builds, the page still renders, there is no broken link and no missing
        # image; the attendee is simply never told to prepare, and finds out when the first lab
        # command fails for a reason the page never mentioned. The same is true of the attribute the
        # partials interpolate: both open with `ifndef::module-id[:module-id: unset-module-id]`, so a
        # page that forgets `:module-id:` (or sets it BELOW the include, where the ifndef has already
        # won) renders a clean, confident instruction to run `ws prep unset-module-id`.
        #
        # The module list comes from modules.yaml, never from a count written here: the catalog is
        # elastic by design and a hardcoded 26 rots the first time a module is split or combined.
        run: |
          rc=0
          python3 tools/lint/module-prep-pairing-guard.py --self-test || rc=$?
          # Exactly 1 = the clean fixture stayed silent (a comment that MENTIONS an include, and a
          # page carrying no partial at all, are both legitimate) AND all seven canaries were caught
          # by the detector that owns them. 0 = a detector is blind; 2 = a canary was missed, the
          # clean fixture false-positived, or the catalog/page scan is broken.
          if [ "$rc" -ne 1 ]; then
            echo "::error::module-prep-pairing-guard self-test must exit 1 (clean fixture silent," \
                 "every canary caught by its own detector); got rc=$rc. Detection is unproven —" \
                 "refusing to trust a clean scan of the real tree."
            exit 1
          fi
          python3 tools/lint/module-prep-pairing-guard.py

  no-cdn-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A page asset fetched from the internet works in CI and fails in the room
        # 2026-08-05, commit e669f7c. All five playbooks pointed mermaid_library_url at
        # cdn.jsdelivr.net. On an air-gapped or egress-restricted cluster that ES-module import
        # fails and EVERY diagram on EVERY page renders as raw mermaid text — and the Showroom
        # cockpit serves from in-cluster, where egress is not guaranteed. Mermaid is now vendored.
        #
        # Nothing else in CI can see it come back. Antora never FETCHES the URL — it substitutes
        # the string into an emitted <script type="module">import mermaid from '…'</script> — so a
        # build with a CDN URL is rc=0, every link checker passes and www/ looks perfect. The first
        # failing observation is in front of a room. Same for a new <script src="https://…"> in the
        # supplemental UI: writing this guard turned up a SECOND one nobody had noticed (webfonts
        # from fonts.googleapis.com in head-styles.hbs), since vendored alongside.
        #
        # Two regressions carry no "https" in the diff at all, so the guard checks for them by
        # shape rather than by pattern: DELETING mermaid_library_url falls back to the extension's
        # own jsdelivr default (verified in node_modules/@sntke/antora-mermaid-extension/lib/
        # extension.js:11+33, not recalled), and pointing it at upstream's .mjs name instead of the
        # deliberately-renamed vendored .js yields a 404 with the same raw-text symptom.
        run: |
          rc=0
          python3 tools/lint/no-cdn-assets-guard.py --self-test || rc=$?
          # Exactly 1 = the clean fixtures stayed silent (a comment recording the OLD CDN URL, an
          # <a href> to redhat.com, an svg xmlns, data:/relative url(), and the real vendored
          # README that documents the URL it replaced are all legitimate) AND every canary was
          # caught by the detector that owns it. 0 = a detector is blind; 2 = a canary was missed,
          # a clean fixture false-positived, or the playbook/UI scan is broken.
          if [ "$rc" -ne 1 ]; then
            echo "::error::no-cdn-assets-guard self-test must exit 1 (clean fixtures silent," \
                 "every canary caught); got rc=$rc. Detection is unproven — refusing to trust a" \
                 "clean scan of the real tree."
            exit 1
          fi
          python3 tools/lint/no-cdn-assets-guard.py

  backtick-leak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: An AsciiDoc code span that cannot close leaks a backtick into the attendee's prose
        # 2026-08-05. AsciiDoc single-backtick spans are CONSTRAINED: a closing backtick is refused
        # when the next character is a word character, a straight quote or an apostrophe. So
        # `Site`s renders no code span at all — either the backticks stay visible, or the span runs
        # on to the next backtick that IS allowed to close and drags half a sentence into <code>
        # with a stray ` inside it. 101 of these were shipping across 21 modules.
        #
        # Nothing else in CI catches it, and nothing was ever going to: the source reads correctly,
        # Antora exits 0, and vale does not run in CI at all. Only the rendered page shows it, and
        # only if you happen to look at the right one — half the surviving leaks live in
        # [demo-block] Say/Do lines that the workshop rendering removes entirely, so even an
        # HTML-scanning gate would have to build all three sites to see them. The guard reads the
        # source, which is the union of the three renderings by construction, and reports a
        # file:line:column the author can open. Its re-implementation of Asciidoctor's rule was
        # checked against @asciidoctor/core over all 4,943 prose lines carrying a backtick: 0 false
        # positives, 0 false negatives.
        run: |
          rc=0
          python3 tools/lint/backtick-leak-guard.py --self-test || rc=$?
          # Exactly 1 = the clean fixture stayed silent across all eight legitimate backtick
          # constructs (listing and literal blocks, line comments, +passthrough+, pass:[], "`curved
          # quotes`", '`single`', ``unconstrained``) AND the blocked-close and blocked-open canaries
          # were each caught by the detector that owns them. 0 = a detector is blind; 2 = a canary
          # was missed, the clean fixture false-positived, or the tracked-file scan is broken.
          if [ "$rc" -ne 1 ]; then
            echo "::error::backtick-leak-guard self-test must exit 1 (clean fixture silent, both" \
                 "canaries caught by their own detector); got rc=$rc. Detection is unproven —" \
                 "refusing to trust a clean scan of the real tree."
            exit 1
          fi
          python3 tools/lint/backtick-leak-guard.py

  completion-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A module that grades nothing at completion prints a green banner over an untouched world
        # 2026-08-05, the 27-module / 8-attendee verification wave. Its important finding was not the
        # ❌s — it graded lab COMPLETION on worlds where nobody had done the lab, so those were
        # expected. It was the ✅. tools/verify/trusted-supply-chain.sh printed "✅ all 11 checks
        # passed" against a namespace the attendee had never touched, because its FULL mode holds no
        # end-state check at all: all eleven assert what `ws prep` already materialized, and the one
        # mode-split branch only ADDS a check under --entry-only. Before, after, or instead of the
        # lab — same green banner, rc 0.
        #
        # Nothing else in CI can see it. The script is valid shell, shellcheck-clean, sources
        # _lib.sh, calls verify_summary, exits 0. verify-summary-skip-guard asserts the banner tells
        # the truth about the outcomes that RAN; it cannot know they were all entry-state ones.
        # verify-oc-read-guard asserts each check can tell "false" from "could not ask". Both are
        # satisfied by a script that grades the wrong world perfectly. The defect is an ABSENCE.
        #
        # And a false ✅ is worse than a false ❌, which this project already treats as trust-
        # destroying: the false ❌ is contradicted within twenty minutes by an attendee looking at
        # their own cluster, while nothing ever contradicts the false ✅. They close the module
        # believing they did it.
        run: |
          rc=0
          python3 tools/lint/completion-coverage-guard.py --self-test || rc=$?
          # Exactly 1 = three clean fixtures each stayed silent ON THEIR OWN (both live polarities of
          # the ENTRY_ONLY split, plus agentic-ai's hand-rolled VERIFY_FAIL accounting) AND every
          # canary was caught by the detector that owns it: no end-state checks, a completion branch
          # of only warn/na/info, completion checks reachable only under --solve, an inverted gate,
          # accounting with no arm that can reach ❌, a catalogued module with no script, and a stale
          # exemption. 0 = a detector is blind; 2 = a canary was missed, a clean fixture
          # false-positived, or the catalogue/script scan is broken.
          if [ "$rc" -ne 1 ]; then
            echo "::error::completion-coverage-guard self-test must exit 1 (clean fixtures silent," \
                 "every canary caught); got rc=$rc. Detection is unproven — refusing to trust a" \
                 "clean scan of the real tree."
            exit 1
          fi
          python3 tools/lint/completion-coverage-guard.py

  attribute-interpolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: An attribute written into a block that cannot interpolate it renders as literal braces
        # 2026-08-05, during the F-01 sweep. Two testers reported hardcoded usernames in
        # attendee-facing expected output. The obvious fix — write {user}-dev and let Antora
        # substitute — is a TRAP: an AsciiDoc delimited block does not substitute attributes unless
        # its header says subs="attributes". Measured on the tree before this guard existed, only 4
        # of the blocks involved carried it, so a well-meant sweep across the remaining ~124 would
        # have replaced a wrong-but-plausible namespace name with visible template syntax. That is
        # strictly worse: user2-dev at least looks like a namespace, {user}-dev looks broken.
        #
        # Nothing else in CI catches it. The Antora build is rc=0 either way — a literal brace is
        # valid output, just wrong output — so only a check that reads the block header can tell.
        run: |
          rc=0
          python3 tools/lint/attribute-interpolation-guard.py --self-test || rc=$?
          # Exactly 1 = the clean fixture stayed silent (including jsonpath beside subs=, which is
          # legitimate) AND the literal-leak canary was caught. 0 = the detector is blind; 2 = the
          # fixture or the tracked-file scan is broken.
          if [ "$rc" -ne 1 ]; then
            echo "::error::attribute-interpolation-guard self-test must exit 1 (clean fixture" \
                 "silent, leak canary caught); got rc=$rc. Detection is unproven — refusing to" \
                 "trust a clean scan of the real tree."
            exit 1
          fi
          python3 tools/lint/attribute-interpolation-guard.py

  check-coverage-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every guard's driver still calls every detector it declares
        # The house rule "the self-test must exit exactly 1" proves a detector FUNCTION works and
        # says nothing about whether the DRIVER still calls it. Measured across six guards and
        # fifteen call sites: deleting a check_* CALL from run_check() left BOTH the self-test at 1
        # and the real run at 0, because self_test() invokes the detectors directly. Two of those
        # guards gate a destructive teardown of clusters we do not own.
        #
        # Each detector now registers that it ran, and the driver asserts every DECLARED detector
        # did. The expectation comes from `declare -F`, not from a hand-maintained count and not
        # from the driver's own source -- the one place a deleted call site cannot also edit. This
        # step runs the meta-scan too: a NEW guard that skips the wiring fails it. Two guards
        # shipped with this exact hole hours after the audit found it, which is why it is a gate
        # and not a convention.
        run: |
          rc=0
          bash tools/lint/_check-coverage.sh --self-test || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::_check-coverage.sh --self-test must exit 1 (real tree clean, all five" \
                 "canaries detected); got rc=$rc. The coverage assertion is unproven."
            exit 1
          fi
          echo "self-test ok -- the wiring assertion is proven against five canaries."
          bash tools/lint/_check-coverage.sh

  verify-strict-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strict mode must tell a partial run (3) from one that graded nothing (4)
        # The attendee summary gained a third outcome (pass/fail/SKIP) because 11 of 26 verify
        # scripts could report "all N checks passed" having graded nothing. VERIFY_STRICT=1 gives
        # automation a distinct non-zero for "did not fully verify", while the attendee-facing
        # DEFAULT stays 0 -- deliberately, because a non-zero there says "your environment is broken"
        # over a check nobody was permitted to answer, and it is what once drove ws prep's WIPE
        # prompt. A healthy environment must never offer to destroy itself over an inconclusive check.
        #
        # THAT NON-ZERO IS TWO CODES, not one (2026-08-05, measured in a live cockpit):
        #   3  SOME checks skipped and every GRADED one passed -- incomplete, but a legitimate pass.
        #      jobs-batch-kueue lands here for every attendee: 13 passed - 1 SKIPPED, and that skip is
        #      a cluster-scoped read no attendee identity can ever answer.
        #   4  NOTHING was graded (pass+fail == 0) -- the run answered zero checks, so it says nothing
        #      about the lab at all. This is the no-signal run strict mode exists to catch.
        # ws smoke passes G1 on 3 and fails it on 4, so both codes are pinned here SEPARATELY: a
        # regression that merged them back would either make every module carrying a legitimately
        # unanswerable check permanently unpassable, or green-light a verify that read nothing. The
        # nothing-graded cases are ordered before the strict ones they mirror so the "default" cases
        # genuinely run with VERIFY_STRICT never set.
        #
        # This asserts the CONTRACT, not a lab grade: grading a real lab needs a cluster CI does not
        # have, and a job that pretended otherwise would be the false-green this all exists to stop.
        run: |
          set -euo pipefail
          run_case() { ( set -euo pipefail; source tools/verify/_lib.sh; eval "$1"; verify_summary ); }
          rc=0; run_case 'check "passes" true; warn "cannot evaluate"' || rc=$?
          [ "$rc" -eq 0 ] || { echo "::error::default, pass+skip: expected 0, got $rc"; exit 1; }
          rc=0; run_case 'warn "cannot evaluate"' || rc=$?
          [ "$rc" -eq 0 ] || { echo "::error::default, nothing graded: expected 0, got $rc"; exit 1; }
          rc=0; VERIFY_STRICT=1 run_case 'check "passes" true; warn "cannot evaluate"' || rc=$?
          [ "$rc" -eq 3 ] || { echo "::error::strict, pass+skip: expected 3, got $rc"; exit 1; }
          rc=0; VERIFY_STRICT=1 run_case 'warn "cannot evaluate"' || rc=$?
          [ "$rc" -eq 4 ] || { echo "::error::strict, NOTHING graded: expected 4 (not 3 -- rc 3 is a" \
                                    "partial run that passed everything it graded), got $rc"; exit 1; }
          rc=0; VERIFY_STRICT=1 run_case 'check "passes" true' || rc=$?
          [ "$rc" -eq 0 ] || { echo "::error::strict, clean: expected 0, got $rc"; exit 1; }
          rc=0; VERIFY_STRICT=1 run_case 'check "fails" false; warn "cannot evaluate"' || rc=$?
          [ "$rc" -eq 1 ] || { echo "::error::strict, real failure: expected 1, got $rc"; exit 1; }
          echo "contract holds: default 0 (partial and nothing-graded alike) - strict 3 on a partial" \
               "run - strict 4 when nothing was graded - strict 0 clean - strict 1 on failure."

  cohort-ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cohort lifecycle ops (wipe-users / reset) keep their invariants
        # Both scripts are destructive and run on clusters we do not own. The detectors cover the
        # four ways they go silently wrong: hand-deleting what workshop-config's selfHeal simply
        # re-creates, re-implementing the ws purge engine so the two drift, a dry-run that falls
        # through into the real mutations, and the `set -e` + `cond && cmd` shape that once made the
        # uninstall print a step number and stop. Plus the shared helpers must stay ONE library --
        # six copies of a copied walker were deduplicated here after one carried a bug the others
        # did not, and a locally-redefined function shadows the library for one caller only.
        run: |
          rc=0
          bash tools/lint/cohort-ops-guard.sh --self-test || rc=$?
          # Exactly 1 = every canary caught AND the real tree passed. 0 = the guard is blind; 2 = a
          # canary went undetected, the tree already fails, or a detector is declared but never
          # called. Either way detection is unproven, so fail rather than trust a clean scan.
          if [ "$rc" -ne 1 ]; then
            echo "::error::cohort-ops-guard self-test must exit 1 (every canary caught, real tree" \
                 "clean); got rc=$rc. The guard's detection is unproven."
            exit 1
          fi
          bash tools/lint/cohort-ops-guard.sh

  adoption-skippable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A component may not lose adoption-skippability in silence
        # 49a7e28 added ONE ordinary file to a component the installer was allowed to SKIP on
        # clusters already running Pipelines. Eligibility is decided by FILENAME, so that single
        # file revoked it -- and nothing said so. On a customer cluster already running Pipelines
        # we would now install our Subscription over theirs and re-channel an operator we promised
        # not to touch.
        #
        # The pre-existing gate could not have caught it: it proves whatever is CURRENTLY skippable
        # is safe to skip, so a demoted component simply stops being examined. It passed straight
        # through the regression without ever printing the component's name.
        #
        # The expected set is GENERATED from the installer's own classifier, never typed, so the
        # snapshot cannot disagree with the real decision. A demotion becomes one changed line in a
        # reviewable diff.
        run: |
          rc=0
          bash tools/lint/adoption-skippable-guard.sh --self-test || rc=$?
          # Exactly 1 = the tree matches the snapshot AND every canary was caught -- first among them
          # the incident itself, replayed: one extra file added to a skippable component must name
          # that component as demoted. 0 = blind; 2 = the tree drifted, the snapshot is missing, or a
          # detector is declared but never called.
          if [ "$rc" -ne 1 ]; then
            echo "::error::adoption-skippable-guard self-test must exit 1; got rc=$rc." \
                 "Detection is unproven -- refusing to trust a clean result."
            exit 1
          fi
          bash tools/lint/adoption-skippable-guard.sh

  adoption-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize (pinned)
        run: |
          curl -sfL -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.0/kustomize_v5.8.0_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
      - name: Install yq (pinned)
        run: |
          sudo curl -sfL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Skipping an adopted component is safe, and actually removes it
        # This gate has existed since automatic adoption shipped and NO workflow ever ran it. It
        # proves the three properties adoption rests on -- an operator-only component renders nothing
        # but Namespace/OperatorGroup/Subscription; the skip really removes that child Application and
        # nothing else; and skipping it strands no sibling in a namespace only it provides (the
        # keycloak break). It only ever ran when a human remembered. An unrun gate is worse than none:
        # it reads as coverage.
        run: |
          rc=0
          bash platform-portfolio/hack/check-adoption-skip.sh --self-test || rc=$?
          # Exactly 1 = the shared strand detector caught its planted canary AND stayed quiet on the
          # two look-alikes. Any other code means detection is unproven -- refuse to trust a clean run.
          if [ "$rc" -ne 1 ]; then
            echo "::error::check-adoption-skip.sh --self-test must exit 1; got rc=$rc." \
                 "The strand detector is unproven -- refusing to trust a clean result."
            exit 1
          fi
          rc=0
          bash platform-portfolio/hack/check-adoption-skip.sh || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::check-adoption-skip.sh failed (rc=$rc). Adoption would drop resources the" \
                 "workshop needs, would not drop the component at all, or would strand a sibling."
            exit 1
          fi

  verify-mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A verify script GRADES the cluster; it must not WRITE to it
        # 2026-08-01 (fixed in 4445c4c): tools/verify/resilience-multicluster-dr.sh scaled the
        # attendee's primary-site Deployment to 0 and back while grading. The scale itself was behind
        # an opt-in flag; its EXIT trap was not — installed unconditionally above the drill's own
        # prerequisite guard with the restore variable still empty, so `--replicas=${VAR:-3}` became
        # a literal 3 and EVERY end-mode run wrote 3 onto the Deployment, including runs that never
        # entered the drill. resilience-multicluster-dr's lab asks the attendee to scale that exact
        # Deployment to zero and watch the mesh fail over, so running `ws verify` in a second
        # terminal silently ended their exercise. Found by reading the file. The other 25 verify
        # scripts had never been audited.
        #
        # The guard is not a grep: 62 of the 68 mutating-verb occurrences under tools/verify/ sit
        # inside printed `hint "…"` repair strings or comments, and flagging those would be noise
        # that gets the gate switched off. A quote/comment/escape-aware scanner separates executed
        # writes from printed ones, then four detectors run: an executed mutation outside an opt-in
        # region, a mutating trap outside one (the incident shape — a trap body is a quoted string,
        # so the executed-mutation detector cannot see it), a covered mutating trap that is never
        # disarmed, and opt-in marker hygiene.
        run: |
          rc=0
          bash tools/lint/verify-mutation-guard.sh --self-test || rc=$?
          # Exactly 1 = all four canaries detected (D2's is the incident verbatim: a guarded write
          # with an unguarded trap), the NEGATIVE canary of printed/commented/escaped/--dry-run
          # forms stayed silent, and the real tree is clean. 0 = a detector is blind; 2 = a canary
          # was missed, the scanner's own fixture probe failed, or the tree is broken.
          if [ "$rc" -ne 1 ]; then
            echo "::error::verify-mutation-guard self-test must exit 1 (four canaries detected," \
                 "negative canary silent, real tree clean); got rc=$rc. The guard's detection is" \
                 "unproven — refusing to trust a clean result on the real tree."
            exit 1
          fi
          echo "self-test ok — four canaries detected, no false positives, real tree clean (rc=1)."
          bash tools/lint/verify-mutation-guard.sh

  guard-argument-parsing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every guard rejects a mistyped flag instead of silently running the plain check
        # Measured 2026-08-01: `owning-stack-guard.sh --selftest` — one missing hyphen — exited 0
        # with a green tick on 11 of 12 runnable shell files here. The argument was discarded in
        # silence and the PLAIN check ran, which passes on a healthy tree by definition, so a
        # maintainer who typos the flag believes they have just proved detection. CI's
        # exit-exactly-1 assertion catches this on CI; a laptop does not, and the laptop is where
        # guards get run to justify a change.
        #
        # The rejection exits 2, never 1, and that choice is load-bearing: CI asserts a self-test
        # exits EXACTLY 1, so a rejection of 1 would SATISFY that assertion and a CI step with a
        # typo'd flag would report detection as proven — reopening the hole at the one place that
        # currently catches it.
        #
        # This step also runs the meta-scan: a NEW guard added without the shared parser fails it,
        # and an exempted file that starts using the parser fails it too, so the exemption list
        # cannot quietly become a permanent excuse.
        run: |
          rc=0
          bash tools/lint/_parse-guard-args.sh --self-test || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::_parse-guard-args.sh --self-test must exit 1 (tree fully adopted, every" \
                 "rejection and accept canary correct); got rc=$rc. The parser is unproven."
            exit 1
          fi
          echo "self-test ok — typo, flag-with-value and bare positional all rejected 2 and named."
          bash tools/lint/_parse-guard-args.sh

  verify-oc-read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A verify script must not read the cluster BLIND
        # tools/lint/verify-oc-read-guard.sh landed in a4c632f and was never wired into CI at all —
        # a gate that exists in the tree, is documented as a gate, and runs nowhere. Worse, its
        # `--selftest` (one missing hyphen) exited 0 green, so the two ways a maintainer might have
        # convinced themselves it was live both lied.
        #
        # What it pins (commit 51eb1b6): `oc get … 2>/dev/null` cannot tell "the object is not
        # there" (a real ❌) from "the cluster did not answer" (a ⚠ that is never the attendee's
        # fault) — both come back as an empty string. oc_read in tools/verify/_lib.sh keeps stdout
        # and stderr apart and returns three outcomes. Three detectors: [1] a ratchet on new blind
        # reads per file, [2] a module script shadowing a shared predicate with a local copy, and
        # [3] oc_read's three-outcome contract, EXECUTED against stubbed NotFound / Forbidden /
        # connection-refused answers rather than grepped — 51eb1b6's own first draft folded NotFound
        # into "succeeded" and made a missing-PodDisruptionBudget check PASS.
        #
        # 2026-08-01: [1]'s detector matched the literal `2>/dev/null` only and MISSED
        # `>/dev/null 2>&1`, which is the commoner shape here (existence probes and negations) — 58
        # further blind lines across 13 files, tools/verify/networking-dev-devops.sh among them with
        # TEN of them and no table row at all. The detector now matches all three silencing shapes
        # and the baseline table was re-measured honestly rather than absorbing the difference.
        run: |
          rc=0
          bash tools/lint/verify-oc-read-guard.sh --self-test || rc=$?
          # Exactly 1 = every canary caught: the per-file ratchet exceeded, an unlisted file at
          # baseline 0, the two newly-matched silencing shapes, a shadowed predicate, the
          # NotFound-folding regression and a declared-but-never-called detector — while
          # gitea_host's named exclusion, a pure curl probe and the stderr-CAPTURING
          # `2>&1 >/dev/null` form all stayed silent. 0 = a detector is blind (or the flag was
          # discarded); 2 = a canary was missed or the real tree is already over baseline.
          if [ "$rc" -ne 1 ]; then
            echo "::error::verify-oc-read-guard self-test must exit 1 (every canary caught, no" \
                 "false positives, real tree within baseline); got rc=$rc. The guard's detection" \
                 "is unproven — refusing to trust a clean result on the real tree."
            exit 1
          fi
          echo "self-test ok — all canaries caught, negative canaries silent, tree within baseline (rc=1)."
          bash tools/lint/verify-oc-read-guard.sh

  devfile-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The entry chart's devfile copy must match the app's devfile
        # gitops/entry-states/devspaces-inner-loop/files/devfile.yaml is a copy of
        # apps/parasol-claims/devfile.yaml, because Helm can only read files inside its own chart.
        # The chart splices that copy's components and commands into the DevWorkspace it declares
        # (2026-08-02), so the workspace an attendee is handed is exactly what their repo describes.
        #
        # Drift here fails silently and teaches the wrong thing: edit the app devfile, forget the
        # copy, and the attendee's workspace no longer matches the file the lab tells them to open
        # and extend in exercise 4. Nothing errors — it just stops being true.
        run: |
          rc=0
          bash tools/lint/devfile-copy-guard.sh --self-test || rc=$?
          # Exactly 1 = all three canaries caught: identical copies pass, a one-line drift is
          # detected, and a missing copy is reported as "cannot inspect" (2) rather than clean.
          # 0 would mean the comparison went blind; 2 means a canary failed to fire.
          if [ "$rc" -ne 1 ]; then
            echo "::error::devfile-copy-guard self-test must exit 1 (every canary caught); got" \
                 "rc=$rc. Detection is unproven — refusing to trust a clean result on the real tree."
            exit 1
          fi
          echo "self-test ok — drift and a missing copy both caught, identical copies silent (rc=1)."
          bash tools/lint/devfile-copy-guard.sh

  cockpit-smoke-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The smoke gate must run in the attendee's cockpit terminal, not a maintainer shell
        # SEV2-G. The smoke is the only gate that touches the surface attendees touch — the ttyd
        # terminal in showroom-<user>, logged in as <user>. When a smoke ran `ws` from a laptop
        # against a cluster-admin kubeconfig instead, three defect classes walked past it into the
        # owner's first live session: ws missing from the terminal's interactive PATH, the terminal
        # answering as the showroom ServiceAccount instead of the attendee, and peer namespaces
        # listable by an attendee. An admin shell cannot see any of them — it has ws on PATH,
        # cluster-admin rights and a different HOME.
        #
        # THIS JOB IS NOT A SMOKE PASS. CI has no cluster and no cockpit; it cannot run the gate,
        # only assert the CONTRACT that the gate still drives the real terminal (oc exec … -c
        # terminal -- bash -ic) for ws prep, ws verify and the identity check. The real proof stays
        # on-cluster: `tools/ws/ws smoke <module> <userN>` against a live cockpit. Do not let this
        # weaker check be reported as the stronger one.
        run: |
          rc=0
          bash tools/lint/cockpit-smoke-identity-guard.sh --self-test || rc=$?
          # Exactly 1 = every canary caught. Six mutate the real `ws`: a non-interactive exec, a
          # login shell, a missing -c <container>, `ws prep` run host-side, a local cmd_verify
          # call, and a missing file reported as could-not-inspect rather than clean. The rest
          # mutate the TRACKED gate-procedure fixtures under
          # tools/lint/cockpit-smoke-identity-guard.fixtures/agents/ — one per rule, plus a
          # deleted roster entry, an unrostered cockpit procedure, and two malformed rosters.
          # Do not restore a hard-coded count here: it has already gone stale once. 0 would mean
          # the detectors are blind; 2 means a canary failed to fire.
          #
          # NOTE what this CI run does NOT cover. The guard's gate-procedure arm reads
          # .claude/agents/, which is gitignored (maintainer-local, owner directive 2026-07-19),
          # so actions/checkout never contains it. On CI that arm reports NOT INSPECTED and the
          # guard's own success line says so — a green run here is fixture coverage plus `ws`,
          # never proof that the real procedures still bind their auditor to the cockpit.
          if [ "$rc" -ne 1 ]; then
            echo "::error::cockpit-smoke-identity-guard self-test must exit 1 (every canary caught);" \
                 "got rc=$rc. Detection is unproven — refusing to trust a clean result on the real tree."
            exit 1
          fi
          echo "self-test ok — every cockpit-bypass canary caught (rc=1)."
          bash tools/lint/cockpit-smoke-identity-guard.sh

  curl-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Brace expressions must not be eaten as AsciiDoc attribute references
        # This guard shipped canaries, called Scope.self_check(), and ran NOWHERE — measured
        # 2026-08-01. An unrun gate is worse than none: it reads as coverage in review and
        # executes on nothing. Wired here alongside version-anchor, which had the same gap.
        run: |
          rc=0
          python3 tools/lint/curl-format-guard.py --self-test || rc=$?
          # 1 = every canary fired as declared. 0 = the guard is blind. 2 = it could not run at
          # all (bad regex, missing _scope, crash) — which Python used to report as 1, i.e. as
          # proof of detection, until the guards were hardened to exit 2 on any crash.
          if [ "$rc" -ne 1 ]; then
            echo "::error::curl-format-guard self-test must exit 1; got rc=$rc."
            exit 1
          fi
          python3 tools/lint/curl-format-guard.py

  version-anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OpenShift release numbers must not be hardcoded in attendee prose
        run: |
          rc=0
          python3 tools/lint/version-anchor-guard.py --self-test || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::version-anchor-guard self-test must exit 1; got rc=$rc."
            exit 1
          fi
          python3 tools/lint/version-anchor-guard.py

  crd-unknown-field:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Install kustomize (pinned)
        # Same pin as the `kustomize` job, and the same `--enable-helm` at call time: the portfolio
        # half of this guard renders `platform-portfolio/**` with kustomize, not Helm, and one
        # component (sonarqube) inflates an upstream chart. A missing kustomize exits 2 — the guard
        # refuses to report clean over a render path it could not run — so this step can never
        # degrade into a silent half-check.
        run: |
          curl -sfL -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.0/kustomize_v5.8.0_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML (pinned)
        run: python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Rendered custom resources must not carry fields their CRDs do not define
        # Kubernetes PRUNES unknown fields at admission: the field lands in last-applied, never in
        # the stored object, and Argo CD's three-way diff then compares a manifest against an object
        # that can never match it. Measured on 65prs 2026-08-05: ai-assisted-development shipped
        # `spec.template.schemaVersion` and `spec.template.metadata` on a DevWorkspace — neither is
        # in that CRD's structural schema — and `entry-ai-assisted-development-*` read OutOfSync
        # FOREVER on an otherwise-healthy world. Nobody could explain the red, and the accepted
        # story became "operator defaulting", which was wrong. 9c97d80 fixed it; this stops the
        # whole class returning, because permanent red teaches attendees and SAs to ignore red.
        #
        # Schemas come from checked-in snapshots (tools/lint/crd-unknown-field-guard.fixtures),
        # never a live cluster — CI has none. What a MISSING snapshot costs splits by who owns the
        # kind (owner decision, 2026-08-06): a kind this repo defines and controls still exits 2 as
        # UN-CHECKABLE, because we can keep those correct without asking anyone; a kind an adopted or
        # third-party operator brings is NAMED on stdout every run and does not redden this job,
        # because a customer runs whatever operator version they run and pinning a vendor's schema
        # asserts more than we can know. Anything the classifier cannot place falls to the STRICT
        # side. A gate that goes green over something it never inspected is the defect this workflow
        # exists to catch, so the rule is not "skip what we have no schema for" — it is "say, every
        # single run, exactly which objects went unchecked and why".
        #
        # The classifier reads Argo CD's own `SkipDryRunOnMissingResource=true` sync option off the
        # rendered CR — the manifest author's load-bearing statement that this object's CRD arrives
        # with an operator — vetoed by any CustomResourceDefinition the repo's own renders emit. The
        # standing instances are loki-logging's LokiStack and ClusterLogForwarder, which no cluster
        # this project has can snapshot at all; they are named on stdout on every run.
        #
        # Scope covers BOTH render paths as of 2026-08-06: the Helm charts (entry states,
        # workshop-config, helm/bootstrap, user-namespace) and the `platform-portfolio/**` kustomize
        # overlays, which ship the largest hand-written operand CRs in the repo — Central,
        # SecuredCluster, Securesign, Backstage, TempoMonolithic, CheCluster, OLSConfig, Tackle.
        # Which overlays get rendered is DERIVED from the app-of-apps wiring (a component is
        # rendered when a rendered stack Application points at it), and whatever that leaves out is
        # named on stdout on every run — see the guard's docstring.
        run: |
          rc=0
          python3 tools/lint/crd-unknown-field-guard.py --self-test || rc=$?
          # Exactly 1 = every planted defect caught against the REAL CRD snapshots (both
          # DevWorkspace fields of 9c97d80, an unknown field inside an array item, a misspelt root
          # field, a typo inside a map VALUE, a CR nested in an OpenShift Template, a closed-object
          # subtree, a solve=true-only resource, a CR in an always-rendered portfolio overlay, and a
          # CR in a component reachable ONLY by following a stack Application) AND every legal field
          # beside them left unflagged — a false positive here would block authoring, so it is
          # asserted in both directions. The canary declares its own cases in
          # crd-unknown-field-guard.canary/expectations.yaml and the self-test asserts SET EQUALITY
          # against them, so no count belongs in this file: one written here goes stale the day a
          # case is added, and a stale count is how a gate stops asserting what it claims to.
          #
          # It also asserts the wiring rule's own cost — the overlay no stack wires up is REPORTED as
          # outside the render set, naming the kinds in it that have no snapshot, and still carries
          # its planted defect, so the exclusion cannot rot into a green tick over an empty file —
          # and the OWNERSHIP SPLIT in every direction: an un-snapshotted third-party kind is
          # reported and not fatal, an un-snapshotted kind with no ownership evidence is still rc 2,
          # a kind carrying the third-party signal whose CRD the canary SHIPS is vetoed back to
          # strict, a lenient row alone exits 0 while a strict row beside it still exits 2, and an
          # EMPTY schema store collapses a scope floor instead of reporting green over an unchecked
          # tree. 0 = a detector is blind; 2 = a canary was missed, a false-positive control fired or
          # vanished from the fixture, or the harness itself is broken.
          if [ "$rc" -ne 1 ]; then
            echo "::error::crd-unknown-field-guard self-test must exit 1 (every planted pruned" \
                 "field detected and every legal field left alone); got rc=$rc. Detection is" \
                 "unproven — refusing to trust a clean result on the real tree."
            exit 1
          fi
          python3 tools/lint/crd-unknown-field-guard.py

  disabled-module-namespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML (pinned)
        run: python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.2'
      - name: workshop-config must not render into a namespace a disabled module never creates
        run: |
          rc=0
          python3 tools/lint/disabled-module-namespace-guard.py --self-test || rc=$?
          # Exactly 1 = both halves of SEV1-E caught in a chart copy, a NEW template writing into a
          # THIRD conditional namespace caught, an undeclared namespace and one that appears only
          # once a module is disabled both REFUSED at rc 2 rather than assumed fine, and three
          # controls (pristine, a write into an always-installed stack's namespace, and the same
          # write correctly guarded) left silent. That last control is the one that matters: it
          # proves the guard accepts the FIX PATTERN, not merely that it notices a missing `if`.
          #
          # No count belongs in this file. The canary declares its own cases and the self-test
          # asserts against them; a number written here goes stale the day a case is added, and a
          # stale count is how a gate quietly stops asserting what it claims to.
          if [ "$rc" -ne 1 ]; then
            echo "::error::disabled-module-namespace-guard self-test must exit 1 (every planted" \
                 "unguarded render detected and every legal one left alone); got rc=$rc." \
                 "Detection is unproven — refusing to trust a clean scan of the real tree."
            exit 1
          fi
          # rc 2 here is NOT a defect report: it means a namespace could not be traced to any stack,
          # so the guard could not inspect what it claims to. Never a pass.
          python3 tools/lint/disabled-module-namespace-guard.py

  teardown-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Install kustomize (pinned)
        run: |
          curl -sfL -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.0/kustomize_v5.8.0_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
      - name: Install yq (pinned)
        run: |
          curl -sfL -o yq "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64"
          sudo install -m 0755 yq /usr/local/bin/yq
      - name: Operands must outlive the operator that finalizes them
        run: |
          # This check was RED on main and NOTHING RAN IT, which is how it stayed red. Argo applies
          # in ascending sync-wave order and prunes in DESCENDING order, so an operand pruned no
          # later than its operator strands a finalizer that can now never run — the failure mode
          # that left a TektonConfig alive with 18 pods and a bound PVC after a "successful"
          # teardown on 2026-07-31.
          #
          # It has no --self-test of its own; its detector is proven by construction instead, and
          # was demonstrated when the Delete=false exemption was added: stripping that annotation
          # from the TektonConfig makes the ❌ return and rc go 0 → 1. If this job ever needs a
          # canary of its own, that is the shape.
          bash platform-portfolio/hack/check-teardown-invariants.sh

  devspaces-endstate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The Dev Spaces module must grade the attendee's pushed change
        run: |
          rc=0
          python3 tools/lint/devspaces-endstate-guard.py --self-test || rc=$?
          # Exactly 1 = EVERY canary in the suite was correctly detected. The suite grew (2026-08-06
          # it went from 1 of 20 detectors provable-by-blinding to 20 of 20), so this comment states
          # the CONTRACT and the KINDS, never a tally — the script prints its own count and the
          # canary-coverage job proves each detector is individually load-bearing.
          #
          # The kinds, because they are what a reader needs to reason about a red run:
          #   script mutants     planted false passes and false fails in the verify script — a
          #                      degenerate `return 0`; grading EXISTENCE where the lab is about
          #                      CONTENT (that IS F-06); loose or over-pinned regexes; the check
          #                      hoisted OUT of the completion-mode gate so it fires at entry;
          #                      a read the recording does not model.
          #   cross-file anchors the lab renaming the endpoint, and the app source itself growing a
          #                      /ping — which would green every attendee at `ws prep` before they
          #                      had done anything.
          #   derivation canaries the three ClaimResource.java worlds are DERIVED, so each edit must
          #                      be proven to have landed. A substitution that silently stops
          #                      matching degrades a canary into "mutant not caught" — and one such
          #                      branch was found dead on 2026-08-06, unreachable since it was
          #                      written, looking exactly like a working check.
          #   harness canaries   the rc-2 "could not run at all" reports, which used to be
          #                      unwitnessable without deleting a tracked file or editing PATH.
          #
          # A mutant whose text no longer matches is reported as a NO-OP, never skipped — canaries
          # have had to be re-expressed for exactly that reason, and a silently-inapplicable
          # mutation is a canary that proves nothing.
          if [ "$rc" -ne 1 ]; then
            echo "::error::devspaces-endstate-guard self-test must exit 1 (every planted false pass" \
                 "detected); got rc=$rc. Detection is unproven — refusing to trust a clean run."
            exit 1
          fi
          # Runs the REAL, unmodified verify script against four recorded worlds. The three
          # ClaimResource.java variants are DERIVED at run time from the live app source and the
          # lab's own printed snippet, so the fixture cannot drift from either.
          python3 tools/lint/devspaces-endstate-guard.py

  canary-coverage:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0, unlike every other job here: this one has to diff against the base commit
      # to know which guards were TOUCHED, and a shallow clone cannot resolve one. If the base is
      # unresolvable the guard exits 2 rather than quietly sweeping a narrower set — see below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML (pinned)
        # The gate runs the real guards, and three of them parse YAML. Without the parser their
        # unmutated control exits 2, which the gate reports as could-not-inspect — correct, but a
        # dependency failure dressed up as a finding about the guards.
        run: python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Does this run need the full mutation sweep?
        id: scope
        # WHY. This job was the slowest in the workflow by 3x — 155s against a 170s total, so it
        # alone set the wall-clock for every push. The other 33 jobs run in parallel and 30 of them
        # finish inside 15s, which means job COUNT was never the cost; this one job was.
        #
        # Mutation coverage regresses when a GUARD changes, not when a lab page or a chart does. So
        # the sweep runs on a guard edit, a PR, the nightly schedule, or a manual dispatch. A push
        # that touched no guard still runs the self-test below — the gate is never fully unrun,
        # because a green check that inspected nothing is the exact defect this workflow exists to
        # catch.
        #
        # Do NOT "simplify" this to `if: github.event_name == 'pull_request'`. Maintainers commit
        # straight to main, so the PR trigger almost never fires — link-check.yml carries the same
        # warning after learning it the hard way. Gating on PRs alone silently switches the job off.
        env:
          BASE: ${{ github.event_name == 'pull_request'
                    && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # FAIL SAFE in every branch: anything we cannot determine sweeps. Treating an
          # unanswerable question as "nothing changed" is how a gate goes quiet.
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "sweep=true"  >>"$GITHUB_OUTPUT"
            echo "why=event '${{ github.event_name }}' always sweeps" >>"$GITHUB_OUTPUT"
          elif [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
               || ! git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null; then
            echo "sweep=true"  >>"$GITHUB_OUTPUT"
            echo "why=no resolvable base commit — sweeping rather than assuming nothing changed" >>"$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "$GITHUB_SHA" | grep -q '^tools/lint/'; then
            echo "sweep=true"  >>"$GITHUB_OUTPUT"
            echo "why=this push changed tools/lint/" >>"$GITHUB_OUTPUT"
          else
            echo "sweep=false" >>"$GITHUB_OUTPUT"
            echo "why=no guard changed in this push" >>"$GITHUB_OUTPUT"
          fi
      - name: The gate itself must not be blind
        # ALWAYS runs, sweep or no sweep. Exactly 1 = the gate classified a fixture guard with
        # witnessed detectors as proven, one with an unwitnessable detector as UNPROVEN, and
        # rejected both rot directions of both ledgers. 0 = the gate is blind and would pass any
        # tree. 2 = its own harness is broken. A meta-guard that always passes is the exact defect
        # it exists to find, so this is asserted on every push even when the sweep is skipped.
        run: |
          rc=0
          python3 tools/lint/_canary-coverage.py --self-test || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::_canary-coverage self-test must exit 1 (it can tell a proven detector" \
                 "from an unproven one); got rc=$rc. Refusing to trust its verdict on the guards."
            exit 1
          fi
      - name: No guard changed — full sweep deferred to the nightly run
        if: steps.scope.outputs.sweep != 'true'
        # Says out loud what was NOT done. A skipped check that renders as a plain green tick with
        # no explanation is how a gate quietly stops meaning anything.
        run: |
          echo "Mutation sweep SKIPPED: ${{ steps.scope.outputs.why }}."
          echo "The gate's own self-test ran and passed, so this check is not blind — but no"
          echo "detector was blinded on this run. Coverage can only regress when a guard changes,"
          echo "and any push touching tools/lint/ sweeps immediately. A whole-tree sweep runs at"
          echo "03:00 UTC daily, and 'gh workflow run lint' forces one now."
      - name: Every detector in a Python guard must be provable by blinding it
        if: steps.scope.outputs.sweep == 'true'
        # WHY THIS JOB EXISTS. On 2026-08-01 an audit blinded each Python guard's detectors one at
        # a time and required an exit code to change. In one night it found 15 of 21 detectors
        # blindable in rebuild-scan-guard (its two halves counted a mutant caught if EITHER fired,
        # so each signed off the other's regressions), a self-test that re-implemented the pipeline
        # and never called the function the real run uses, two finding kinds masking each other,
        # and a documented predicate that nothing called. Every one of those guards was GREEN in
        # this workflow the whole time: a guard's own job asserts that SOMETHING fires, never that
        # each detector is individually load-bearing. This job asserts the second thing, so the
        # audit does not have to be re-run by hand to stay true.
        #
        # RUNTIME. Within a sweep, the gate covers a guard when the diff touched it (always) or
        # when its projected cost fits --budget (default 240s). Nothing hardcodes which guard is the
        # expensive one — projected cost is measured per run, so a guard that gets slow drops out on
        # its own and a guard that gets fast comes back. Whether a sweep happens AT ALL is decided by
        # the scope step above.
        #
        # NO LIVE COUNTS HERE, DELIBERATELY. This comment used to read "nine of ten guards in
        # ~2 minutes; rebuild-scan-guard costs ~75s per detector" — both written as illustration and
        # read as fact, and both wrong by 2026-08-06: the sweep collected far more than ten guards,
        # with more than one of them over budget. Same rot CLAUDE.md already bans for the CI job
        # count and LEDGERS.md documents for declared-debt tables — a figure in a comment cannot be
        # kept true by anyone, because nothing fails when it rots.
        #
        # A DATED MEASUREMENT is the one number form that survives, because it claims only what was
        # true when taken: "measured 2026-08-06, devspaces-endstate-guard ran a 43.3s baseline over
        # 20 detectors and therefore sat outside this budget." That is provenance, not a live
        # figure. Proof it is the right form: that measurement went stale THE SAME DAY — witnesses
        # landed for all 20 detectors and the baseline grew — and it is still not wrong, because it
        # never claimed to be current. The conclusion held too, which is the actual lesson: reason
        # about the RULE and let the tool supply the arithmetic.
        # If you want the real numbers, MEASURE them — the gate prints proven/total, projected cost
        # and the skip reason for every guard on every run:
        #     python3 tools/lint/_canary-coverage.py --all
        # Do not restore a count here. The reasoning above is what has to stay correct; the arithmetic
        # belongs to the tool.
        env:
          BASE: ${{ github.event_name == 'pull_request'
                    && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # An all-zero SHA is a first push to a branch with no predecessor to diff against. Pass
          # no --changed-from at all there: the budget still sweeps nine guards, and claiming a
          # base we do not have would be worse than sweeping the cheap set.
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            set -- --changed-from "$BASE"
          else
            set --
            echo "no resolvable base commit; sweeping by budget only (touched-guard rule is off)"
          fi
          # rc 1 = a detector can be blinded with no CI signal. rc 2 = the gate could not inspect
          # a guard at all (it does not import, its unmutated control is not 0/1, a mutation
          # failed to land). Both fail this job, and they are deliberately different codes: the
          # first is a finding about a guard, the second is a finding about the sweep.
          python3 tools/lint/_canary-coverage.py "$@"

  doctor-degraded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ws doctor must stay honest in the states nobody is there to see
        # Half of `ws doctor`'s rows have a third outcome — ⚠ "I could not look", which is not "it is
        # broken" and deliberately does not fail the run. Those branches fire only for an identity
        # that cannot read cluster-scoped objects, so on the clusters this project develops on they
        # are never exercised: the degraded report is first rendered on a customer's cluster, in
        # front of an attendee, with nobody watching. It has been wrong there twice — first the rows
        # printed ❌ at attendees whose environment was fine, then the rows were fixed and the
        # SUMMARY still ended "✅ environment looks good" over six ⚠ rows (measured live 2026-08-06).
        #
        # Both failures look like a normal report, so neither is visible by reading the diff. This
        # job runs the real tools/ws/ws against three recorded clusters — an attendee with six
        # Forbidden reads, an admin with nothing wrong, and an attendee on a broken platform — and
        # pins the rows, the closing line and the exit status of each. No cluster and no network:
        # `oc` and `curl` are a recording, and a call the recording does not model is a finding.
        #
        # It is NOT a substitute for `ws doctor` on a live cluster: the recording is of what oc
        # PRINTED, so the jsonpaths inside ws are data here. It says the reporter is honest, never
        # that a cluster is healthy.
        run: |
          rc=0
          bash tools/lint/doctor-degraded-guard.sh --self-test || rc=$?
          # Exactly 1 = the real tree reproduces all three recordings AND all eight reintroduced
          # defects were each caught by the one detector meant to prove them. 0 = the guard is
          # blind; 2 = a canary slipped through, a mutation became a no-op because ws was reworded,
          # or a recording is missing. Detection is unproven either way, so fail rather than trust
          # a clean result on the real tree.
          if [ "$rc" -ne 1 ]; then
            echo "::error::doctor-degraded-guard self-test must exit 1 (every reintroduced defect" \
                 "caught by its own detector); got rc=$rc. Refusing to trust a clean result."
            exit 1
          fi
          bash tools/lint/doctor-degraded-guard.sh

  demo-beat-chip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A demo beat's timing chip can vanish and no build says so
        # WHY THIS IS A JOB AND NOT A BUILD CHECK. Every beat in every demo arc is two block
        # attribute lines above a Say/Show/Do list. Asciidoctor's block STYLE is positional
        # attribute 1, so the second line replaces the first: `demo-block` never reaches the HTML
        # and `TIME 3m` is emitted verbatim into the list wrapper's class attribute, which is what
        # content/supplemental-ui/partials/head-styles.hbs paints the presenter's timing chip from.
        #
        # That makes `[TIME Nm]` a load-bearing hook whose failure is INVISIBLE. Measured end to
        # end 2026-08-08 by moving ONE heading in networking-dev-devops/lab.adoc — the module whose
        # correct form is committed as 17d74b2 — below its `[TIME 3m]` line and building that copy
        # with this repo's own Antora: the page went from 5 rendered chip elements to 4 (site total
        # 104 to 103), and `antora --log-failure-level=warn site-demo.yml` still returned rc 0 with
        # a zero-line log. No build can fail on HTML it considers perfectly valid, so nothing else
        # in this workflow can see it — and a sweep inserting `=== Beat N — label` headings across
        # the catalogue is exactly the edit that introduces it.
        #
        # The rules are narrower than they look, and deliberately so. Nine authored shapes were
        # rendered through the engine Antora builds with and the wrapper's class attribute read
        # directly; four that a stricter guard would have flagged turn out to render the chip
        # perfectly (a blank line, a comment, a block title and a role line between the attribute
        # and its list; and no `[demo-block]` line at all, which that stylesheet's own comment says
        # may be deleted). A guard that fires on correct pages gets switched off, taking the one
        # detector that matters with it.
        run: |
          rc=0
          python3 tools/lint/demo-beat-chip-guard.py --self-test || rc=$?
          # Exactly 1 = every detector fired on a canary line only IT fires on, AND the reference
          # shape, the tolerated variations and the near-miss transposition that still renders
          # every chip all stayed silent. 0 = a detector is blind; 2 = a canary slipped through,
          # the fixture is missing, or the scope ledger broke.
          if [ "$rc" -ne 1 ]; then
            echo "::error::demo-beat-chip-guard self-test must exit 1 (each detector witnessed on" \
                 "its own line, correct shapes silent); got rc=$rc. Detection is unproven —" \
                 "refusing to trust a clean scan of the real tree."
            exit 1
          fi
          python3 tools/lint/demo-beat-chip-guard.py
      - name: What this job does NOT prove
        # Said out loud, because a source-only gate that reads as complete is worse than no gate.
        # The step above reasons about authored source against measured Asciidoctor behaviour. It
        # cannot see a chip lost DOWNSTREAM of the source — a dropped stylesheet rule, an extension
        # that rewrites classes, a theme whose CSS wins the cascade. The guard has a mode that
        # closes exactly that gap by counting rendered chip elements by their opening div tag, and
        # it is not run here because every job in this workflow is checkout-plus-a-script and a
        # gate that needs a site build is a gate that gets skipped. Run it by hand after a build:
        run: |
          echo "Source-only. To check the RENDERED chips as well (needs a build):"
          echo "  cd content && npx antora --to-dir /tmp/demo site-demo.yml"
          echo "  cd content && npx antora --to-dir /tmp/workshop site-workshop.yml"
          echo "  tools/lint/demo-beat-chip-guard.py --built-demo /tmp/demo \\"
          echo "      --built-non-demo /tmp/workshop"
          echo "Measured 2026-08-08 on a fresh build of this tree: 104 source chip sites, 104"
          echo "rendered chip elements in the demo build, 0 in the workshop build."
