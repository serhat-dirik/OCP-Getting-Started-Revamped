---
name: content-build
on:
  push:
    branches: [main]
  pull_request:

# Supersede, don't queue. Only the tip's result is interesting on a trunk-only repo, and
# without this every commit queues a fresh run that never self-cancels: 95 commits in one
# session left 17 superseded runs sitting AHEAD of the ones for current HEAD, testing code
# that no longer existed. cancel-in-progress is correct here (unlike for a Pages deploy) —
# an abandoned lint run has nothing to leave half-finished.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies (pinned)
        run: npm ci

      - name: Install yq (for gen-attributes.sh)
        run: |
          sudo curl -sfL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Version-attribute drift gate
        run: |
          tools/gen-attributes.sh
          if ! git diff --exit-code content/modules/ROOT/partials/version-attributes.adoc; then
            echo "::error::version-attributes.adoc is out of sync with versions.yaml." \
                 "Run tools/gen-attributes.sh and commit the result."
            exit 1
          fi

      - name: Module-slug drift gate
        # Same shape as the version-attribute gate: modules.yaml -> gen-module-slugs.sh ->
        # the moduleSlugs block in gitops/workshop-config/values.yaml (attendee entry-app RBAC).
        run: |
          if ! tools/gen-module-slugs.sh --check; then
            echo "::error::gitops/workshop-config/values.yaml moduleSlugs drifted from modules.yaml." \
                 "Run tools/gen-module-slugs.sh and commit the result."
            exit 1
          fi

      - name: Entry-namespace template drift gate
        # gitops/user-namespace/templates/ -> gen-entry-namespaces.sh -> the ns-user-namespaces.yaml
        # and _ns-helpers.tpl copies in all 26 gitops/entry-states/*/ charts. Those copies exist
        # because an attendee cannot create a namespace (Forbidden) and the admission policy only
        # permits an Application sourced from gitops/entry-states/, so each chart must carry its own
        # copy. Twenty-six hand-maintained copies drift the moment someone edits one; this is the
        # gate that stops it. copy-drift-guard covers the _helpers half structurally; this covers
        # every byte of both files in every chart.
        run: |
          if ! tools/gen-entry-namespaces.sh --check; then
            echo "::error::gitops/entry-states/*/templates/ns-user-namespaces.yaml drifted from" \
                 "gitops/user-namespace/templates/. Run tools/gen-entry-namespaces.sh and commit."
            exit 1
          fi

      - name: Module-stack drift gate
        # modules.yaml `stacks:` -> gen-module-stacks.sh -> the moduleCatalog block in
        # helm/bootstrap/values.yaml (FSC module->stack derivation; Helm can't read modules.yaml).
        run: |
          if ! tools/gen-module-stacks.sh --check; then
            echo "::error::helm/bootstrap/values.yaml moduleCatalog drifted from modules.yaml." \
                 "Run tools/gen-module-stacks.sh and commit the result."
            exit 1
          fi

      # The "Claims seed drift gate" that used to sit here moved to the lint workflow's
      # `copy-drift` job (tools/lint/copy-drift-guard.py, mode "bytes"). It was one of five
      # hand-maintained duplicate pairs in this tree and the only one `cmp -s` could express;
      # the other four now sit in the same declared table instead of nowhere.

      - name: curl format string guard
        # Cheaper pre-flight for the class that reddened content-build for 5h on 2026-07-28
        # (commit 2e6fc1c): subs="attributes" turns %{http_code} into a reference to a missing
        # attribute, and the build below runs antora at --log-failure-level=warn, which fails on
        # exactly that warning. Self-test first — a guard that silently inspects zero files
        # always "passes" (tools/lint/route-tls-guard.sh learned this the hard way).
        run: |
          rc=0
          python3 tools/lint/curl-format-guard.py --self-test || rc=$?
          # Exactly 1 = canary detected. 0 = guard blind; 2 = canary fixture missing/empty
          # scope — either way detection is unproven, so fail rather than trust the real scan.
          if [ "$rc" -ne 1 ]; then
            echo "::error::curl-format-guard self-test must exit 1 (canary detected); got" \
                 "rc=$rc. The guard's detection is unproven — refusing to trust a clean" \
                 "result on the real tree."
            exit 1
          fi
          echo "self-test ok — guard correctly rejected its own canary (rc=1)."
          python3 tools/lint/curl-format-guard.py content

      - name: Version anchor guard (attendee prose names no OpenShift release)
        # Owner directive (Foundations review 2026-07-13/14, re-raised 2026-07-29): attendee pages
        # must not anchor to an OpenShift version — the workshop ships to whatever cluster the SA
        # has. The re-raise found the sharper reason: five sentences read "It is GA on OpenShift
        # {ocp_version}", and {ocp_version} tracks the BUILD cluster, so a fixed product-timeline
        # fact silently re-asserted a different release on every versions.yaml bump (and was wrong
        # in every one of them). instructor.adoc/troubleshooting.adoc are out of scope on purpose:
        # their version lines are provenance, and stripping them would destroy the assertion.
        # Same self-test-first discipline as above — an unproven detector must not certify a tree.
        run: |
          rc=0
          python3 tools/lint/version-anchor-guard.py --self-test || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::version-anchor-guard self-test must exit 1 (canary detected); got" \
                 "rc=$rc. Detection is unproven — refusing to trust a clean result on the real" \
                 "tree. rc=0 means a detector went blind or the opt-out over-suppressed;" \
                 "rc=2 means the canary is missing or a detector failed to fire."
            exit 1
          fi
          echo "self-test ok — all detectors fired and the opt-out suppressed (rc=1)."
          python3 tools/lint/version-anchor-guard.py content/modules/ROOT/pages

      - name: Build all three renderings (warnings fail the build)
        working-directory: content
        run: |
          for flavor in workshop demo instructor; do
            echo "::group::antora site-${flavor}.yml"
            npx antora --fetch --log-failure-level=warn "site-${flavor}.yml"
            echo "::endgroup::"
          done

      # The half of demo-beat-chip-guard that only exists once a site has been BUILT. lint.yml runs
      # its source-side checks on every push; the --built-* comparison needs www/{workshop,demo,
      # instructor}, so it belongs here — the one job that already produces all three. Adding it as a
      # job in lint.yml would mean a second three-flavour Antora build, several minutes of every run
      # for output this job already has on disk.
      #
      # WHAT ONLY THIS CATCHES, and why source-side checks cannot: a chip leaking into the workshop
      # or instructor rendering (the demo-only invariant is a property of the OUTPUT — the source can
      # be correct while an ifdef boundary moves), and a page that came out short, which is how a
      # transposed heading silently deleted a timing chip at rc 0 with a zero-line Antora log.
      #
      # No working-directory: the step above sets it to `content`, but that is step-scoped, and the
      # playbooks write ../www/<flavor> — so www/ is at the repo root from here.
      - name: Demo timing chips, checked in the BUILT renderings
        run: |
          rc=0
          python3 tools/lint/demo-beat-chip-guard.py --self-test || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::demo-beat-chip-guard self-test must exit 1 (canary detected); got" \
                 "rc=$rc. Detection is unproven — refusing to trust a clean result on a built" \
                 "tree. rc=0 means a detector went blind; rc=2 means the canary is missing, a" \
                 "detector failed to fire, or head-styles.hbs lost its PAINTED-VALUES markers" \
                 "(the guard reads the painted set from that stylesheet and will not guess)."
            exit 1
          fi
          echo "self-test ok — every detector fired (rc=1)."
          python3 tools/lint/demo-beat-chip-guard.py \
            --built-demo www/demo \
            --built-non-demo www/workshop \
            --built-non-demo www/instructor

      # The artefact half of demo-region-identifier-guard. Its source half runs in lint.yml on every
      # push; this mode compares the RENDERED shell blocks per flavour, which is the only way to see
      # what Antora actually emitted — a partial resolved differently, or an extension that rewrote a
      # block, is invisible to a source parse. Same reason the demo-beat-chip built comparison lives
      # here: this is the one job that already produces all three renderings, and a second Antora
      # build would cost minutes of every run for output already on disk.
      - name: Demo-region identifiers, checked in the BUILT renderings
        run: |
          python3 tools/lint/demo-region-identifier-guard.py \
            --built-demo www/demo \
            --built-non-demo www/workshop \
            --built-non-demo www/instructor
