---
name: content-build
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies (pinned)
        run: npm ci

      - name: Install yq (for gen-attributes.sh)
        run: |
          sudo curl -sfL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Version-attribute drift gate
        run: |
          tools/gen-attributes.sh
          if ! git diff --exit-code content/modules/ROOT/partials/version-attributes.adoc; then
            echo "::error::version-attributes.adoc is out of sync with versions.yaml." \
                 "Run tools/gen-attributes.sh and commit the result."
            exit 1
          fi

      - name: Module-slug drift gate
        # Same shape as the version-attribute gate: modules.yaml -> gen-module-slugs.sh ->
        # the moduleSlugs block in gitops/workshop-config/values.yaml (attendee entry-app RBAC).
        run: |
          if ! tools/gen-module-slugs.sh --check; then
            echo "::error::gitops/workshop-config/values.yaml moduleSlugs drifted from modules.yaml." \
                 "Run tools/gen-module-slugs.sh and commit the result."
            exit 1
          fi

      - name: Module-stack drift gate
        # modules.yaml `stacks:` -> gen-module-stacks.sh -> the moduleCatalog block in
        # helm/bootstrap/values.yaml (FSC module->stack derivation; Helm can't read modules.yaml).
        run: |
          if ! tools/gen-module-stacks.sh --check; then
            echo "::error::helm/bootstrap/values.yaml moduleCatalog drifted from modules.yaml." \
                 "Run tools/gen-module-stacks.sh and commit the result."
            exit 1
          fi

      # The "Claims seed drift gate" that used to sit here moved to the lint workflow's
      # `copy-drift` job (tools/lint/copy-drift-guard.py, mode "bytes"). It was one of five
      # hand-maintained duplicate pairs in this tree and the only one `cmp -s` could express;
      # the other four now sit in the same declared table instead of nowhere.

      - name: curl format string guard
        # Cheaper pre-flight for the class that reddened content-build for 5h on 2026-07-28
        # (commit 2e6fc1c): subs="attributes" turns %{http_code} into a reference to a missing
        # attribute, and the build below runs antora at --log-failure-level=warn, which fails on
        # exactly that warning. Self-test first — a guard that silently inspects zero files
        # always "passes" (tools/lint/route-tls-guard.sh learned this the hard way).
        run: |
          rc=0
          python3 tools/lint/curl-format-guard.py --self-test || rc=$?
          # Exactly 1 = canary detected. 0 = guard blind; 2 = canary fixture missing/empty
          # scope — either way detection is unproven, so fail rather than trust the real scan.
          if [ "$rc" -ne 1 ]; then
            echo "::error::curl-format-guard self-test must exit 1 (canary detected); got" \
                 "rc=$rc. The guard's detection is unproven — refusing to trust a clean" \
                 "result on the real tree."
            exit 1
          fi
          echo "self-test ok — guard correctly rejected its own canary (rc=1)."
          python3 tools/lint/curl-format-guard.py content

      - name: Version anchor guard (attendee prose names no OpenShift release)
        # Owner directive (Foundations review 2026-07-13/14, re-raised 2026-07-29): attendee pages
        # must not anchor to an OpenShift version — the workshop ships to whatever cluster the SA
        # has. The re-raise found the sharper reason: five sentences read "It is GA on OpenShift
        # {ocp_version}", and {ocp_version} tracks the BUILD cluster, so a fixed product-timeline
        # fact silently re-asserted a different release on every versions.yaml bump (and was wrong
        # in every one of them). instructor.adoc/troubleshooting.adoc are out of scope on purpose:
        # their version lines are provenance, and stripping them would destroy the assertion.
        # Same self-test-first discipline as above — an unproven detector must not certify a tree.
        run: |
          rc=0
          python3 tools/lint/version-anchor-guard.py --self-test || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::version-anchor-guard self-test must exit 1 (canary detected); got" \
                 "rc=$rc. Detection is unproven — refusing to trust a clean result on the real" \
                 "tree. rc=0 means a detector went blind or the opt-out over-suppressed;" \
                 "rc=2 means the canary is missing or a detector failed to fire."
            exit 1
          fi
          echo "self-test ok — all detectors fired and the opt-out suppressed (rc=1)."
          python3 tools/lint/version-anchor-guard.py content/modules/ROOT/pages

      - name: Build all three renderings (warnings fail the build)
        working-directory: content
        run: |
          for flavor in workshop demo instructor; do
            echo "::group::antora site-${flavor}.yml"
            npx antora --fetch --log-failure-level=warn "site-${flavor}.yml"
            echo "::endgroup::"
          done
