---
name: apps-test

# Runs the test suites of every Java service under apps/.
#
# Why this exists (2026-07-29): there was no CI job that ran Maven at all — a
# `grep -rn 'mvn|maven|java|jdk|temurin' .github/workflows/` over the tree returned
# nothing. Commit 51ac270 fixed the parasol-claims claim-numbering defect and shipped
# good regression tests for it, and nothing ever executed them; the next image build
# would have carried a defect of that class straight into a module. The suites were
# fine. The gate was missing. This is the gate.
#
# Deliberately NOT triggered by gitops/** or helm/** chart changes. These are
# @QuarkusTest suites that boot each app against in-memory H2 and its own
# src/main/resources; a Helm chart is not on their classpath and cannot move a single
# assertion, so a chart-triggered run has no detection power and buys only noise and
# queue time. The one genuine chart-to-app coupling — the hand-copied claims seed in
# gitops/entry-states/deployment-targets-scheduling/files/import.sql — is already
# covered by the "Claims seed drift gate" in content-build.yml, which is the right
# tool for it: it diffs the two files, which is what actually drifts.

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/apps-test.yml'
  pull_request:
    paths:
      - 'apps/**'
      - '.github/workflows/apps-test.yml'

# Supersede, don't queue. Only the tip's result is interesting on a trunk-only repo, and
# without this every commit queues a fresh run that never self-cancels: 95 commits in one
# session left 17 superseded runs sitting AHEAD of the ones for current HEAD, testing code
# that no longer existed. cancel-in-progress is correct here (unlike for a Pages deploy) —
# an abandoned lint run has nothing to leave half-finished.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.enumerate.outputs.modules }}
    steps:
      - uses: actions/checkout@v4

      - name: Enumerate apps/ modules that carry a test suite
        id: enumerate
        # Walked, not hardcoded. The hardcoded list this job was specced with named 3
        # modules; the tree actually has 7 with suites. A list that was wrong the day it
        # was written will be wrong again — a tree walk cannot drift.
        run: |
          modules=()
          while IFS= read -r pom; do
            d="$(dirname "$pom")"
            # This is the TEST gate, so a pom with no suite is out of scope. Exactly one
            # falls out here: apps/parasol-legacy-claims, a deliberately-legacy Java 8 WAR
            # kept as raw material for the modernization module. It has no src/test at all.
            if [ ! -d "$d/src/test/java" ]; then continue; fi
            # Backstage/RHDH software-template skeletons are not buildable Maven projects:
            # their coordinates are scaffolder placeholders (dollar-brace-brace), which Maven
            # rejects outright with "does not match a valid id pattern". The regex below is
            # written escaped so this file does not contain that literal sequence, which
            # Actions would try to evaluate as an expression. Verified against
            # apps/parasol-service-template/skeleton, which does have a src/test/java and
            # would otherwise redden this job on its very first run.
            if grep -qE '\$\{\{' "$pom"; then
              echo "skip (scaffolder template, not a buildable POM): $d"
              continue
            fi
            modules+=("$d")
          done < <(find apps -name pom.xml | sort)

          printf 'discovered: %s\n' "${modules[@]}"

          # A discovery step that finds nothing is a green job that tested nothing — the
          # exact failure mode tools/lint/route-tls-guard.sh already learned the hard way.
          # Two floors: non-empty, and parasol-claims present by name, since that is the
          # module whose unrun tests created this job. If the walk stops finding it, the
          # walk is broken, not the tree.
          if [ ${#modules[@]} -eq 0 ]; then
            echo "::error::Discovered zero testable modules under apps/. Either the tree" \
                 "moved or this walk is broken — refusing to report a green test gate that" \
                 "ran no tests."
            exit 1
          fi
          case " ${modules[*]} " in
            *" apps/parasol-claims "*) ;;
            *)
              echo "::error::apps/parasol-claims has a test suite but discovery did not" \
                   "find it. Discovery is broken; a green run here would be meaningless."
              exit 1
              ;;
          esac

          # slug = path with slashes flattened; upload-artifact rejects '/' in names.
          json="$(printf '%s\n' "${modules[@]}" \
            | jq -R '{path: ., slug: (. | gsub("/"; "-"))}' | jq -sc .)"
          echo "modules=$json" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One red module must not hide a second red module — always run every leg.
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    name: test (${{ matrix.module.path }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Every discovered pom sets <maven.compiler.release>21</maven.compiler.release>;
          # read from the poms, not assumed. (apps/parasol-legacy-claims is the only Java 8
          # pom in the tree and is out of scope here — it has no tests.)
          java-version: '21'

      # One shared cache across all matrix legs: they resolve the same Quarkus BOM
      # (3.33.3.1), so per-leg caches would store the same ~1 GB seven times and blow
      # through the repo cache budget. The legs race to save and the losers log a benign
      # "cache already exists" warning; that is a warning, not a failure.
      # ~/.m2 rather than ~/.m2/repository so the Maven wrapper's own distribution
      # (~/.m2/wrapper/dists) is cached too.
      - name: Cache ~/.m2
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: >-
            m2-${{ runner.os }}-${{ hashFiles('apps/**/pom.xml',
            'apps/**/maven-wrapper.properties') }}
          restore-keys: |
            m2-${{ runner.os }}-

      # ./mvnw, not the runner's preinstalled mvn: the wrapper pins Maven 3.9.9 for every
      # module, so CI runs what a contributor runs. (Measured: the same container that
      # ships mvn 3.9.16 resolves ./mvnw to 3.9.9.) `test` and not `verify` on purpose —
      # verify would also run the CycloneDX SBOM plugin bound to `package` in
      # parasol-claims, which is build-artifact work this gate does not need.
      - name: mvn test
        working-directory: ${{ matrix.module.path }}
        run: ./mvnw -B -ntp test

      - name: Name the failing tests
        if: failure()
        working-directory: ${{ matrix.module.path }}
        env:
          MODULE: ${{ matrix.module.path }}
        # Surefire's own tail already lists failures, but it scrolls off inside a matrix
        # leg. This republishes them as ::error:: annotations (which surface on the PR
        # without opening the log) and into the run summary, each one prefixed with the
        # module so "which app broke" is answerable at a glance.
        run: |
          shopt -s nullglob
          reports=(target/surefire-reports/*.txt)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error title=$MODULE::Failed before any test reported — compile error," \
                 "dependency resolution failure, or a crashed test JVM. Read the mvn output" \
                 "in the step above."
            exit 0
          fi
          {
            echo "### Failed tests in \`$MODULE\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          found=0
          for r in "${reports[@]}"; do
            while IFS= read -r line; do
              found=1
              echo "::error title=$MODULE::$line"
              echo "- \`$line\`" >> "$GITHUB_STEP_SUMMARY"
            done < <(
              grep -hE '<<< (FAILURE|ERROR)!' "$r" \
                | grep -v '^Tests run:' \
                | sed -E 's/[[:space:]]*--[[:space:]]*Time elapsed.*//'
            )
          done
          if [ "$found" -eq 0 ]; then
            echo "::error title=$MODULE::mvn test failed but no surefire report names a" \
                 "failing test — look for a crashed fork or a plugin error above."
            echo "(no per-test failure lines in the surefire reports)" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.module.slug }}
          path: ${{ matrix.module.path }}/target/surefire-reports/
          retention-days: 7

  # apps/parasol-legacy-claims is the single module the discovery walk above deliberately drops
  # (no src/test/java, and it never will have one — it is the deliberately-legacy Java 8 WAR that
  # app-modernization hands to MTA as raw material). That exclusion is correct, but it left the
  # module with no gate of ANY kind: nothing checked that it even compiles.
  #
  # It is not inert. gitops/workshop-config/values.yaml seeds this directory verbatim into every
  # attendee's Gitea fork; MTA analyzes it in SOURCE mode, which resolves the Maven tree to build
  # the analyzer's classpath; and its own devfile.yaml ships the default build command
  # `mvn -B -DskipTests package`, which attendees run inside Dev Spaces. So a pom that stops
  # resolving does not fail here — it fails live, in front of a room, as a broken IDE build or as a
  # shifted effort score in a report whose numbers the lab quotes verbatim ("twenty-four story
  # points", "six mandatory"). Twelve of those coordinates are external, including a proprietary
  # Oracle driver (com.oracle.database.jdbc:ojdbc8:21.1.0.0) whose presence on Central is the least
  # guaranteed of the set.
  #
  # Compile-only, on purpose. The anti-patterns MTA flags — hardcoded IP, Oracle pin, Java 8,
  # create-drop — are the POINT of this module; a linter or a test suite here would gate away the
  # very thing being taught. This asserts exactly one thing: the declared dependencies still
  # resolve and the sources still compile.
  legacy-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The toolchain is the container, not setup-java + the runner's preinstalled mvn: this pom
    # targets Java 8 while the matrix above uses 21, and pinning the image is what makes a local
    # reproduction identical to CI. Verified locally against this exact tag — it carries Maven
    # 3.9.16 on Temurin 1.8.0_492, and git 2.43.0, which actions/checkout needs to avoid silently
    # falling back to its tarball path.
    container: maven:3.9-eclipse-temurin-8
    steps:
      - uses: actions/checkout@v4

      # No ~/.m2 cache by design. Measured cold: 62 jars / 38 MB in ~19 s. Restoring the matrix
      # legs' ~1 GB Quarkus cache to save that would cost more time than it saves, and would add a
      # seventh racer to the shared cache key whose contention the comment above already flags.
      # These dependencies are disjoint from the Quarkus BOM anyway.
      - name: mvn package (resolve + compile the legacy WAR)
        working-directory: apps/parasol-legacy-claims
        # The devfile's own default build command, so CI runs what the attendee runs in Dev Spaces.
        # Plain `mvn`, not ./mvnw — this module ships no wrapper.
        run: mvn -B -ntp -DskipTests package

  # apps/parasol-notifications ships TWO implementations - node/ and python/ - and the discovery
  # walk at the top of this file (find apps -name pom.xml) cannot see either of them: neither is a
  # Maven module. Audited 2026-07-30: nothing anywhere ran either implementation's code.
  # node/package.json already declares "test": "node --test", but running it today finds zero
  # test files and exits 0 ("0 tests, 0 pass, 0 fail") - wiring that in as-is would have added a
  # gate that passes while inspecting nothing, which is worse than no gate: it would read as
  # coverage on the PR checks list without providing any. These two jobs are the real gate: they
  # run genuine behavioural tests against each implementation's actual HTTP responses (status
  # codes and bodies), not just "did it throw". Each also has its own floor so a future deletion of
  # the test file(s) fails loudly instead of quietly reporting green on nothing.
  notifications-node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/parasol-notifications/node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches package.json's engines.node (>=20) and the nodejs:22-ubi9 S2I builder the lab
          # itself uses (see apps/parasol-notifications/Containerfile) - CI runs the same major.
          node-version: '22'

      - name: Refuse to report green if the test file is gone (anti-vacuity floor)
        run: |
          if [ ! -f test/server.test.js ]; then
            echo "::error::apps/parasol-notifications/node/test/server.test.js is missing." \
                 "node --test would exit 0 having run nothing - refusing to report a green gate" \
                 "that tested nothing."
            exit 1
          fi

      - name: node --test (zero-dependency service - no npm install needed)
        run: npm test

  notifications-python-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/parasol-notifications/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the python:3.12-ubi9 S2I builder the build-deliver lab uses to import this
          # service (content/modules/ROOT/pages/build-deliver/lab.adoc).
          python-version: '3.12'

      - name: Refuse to report green if the test file is gone (anti-vacuity floor)
        run: |
          if [ ! -f test_app.py ]; then
            echo "::error::apps/parasol-notifications/python/test_app.py is missing. Refusing to" \
                 "report a green gate that tested nothing."
            exit 1
          fi

      - name: Install runtime + test dependencies
        # requirements-test.txt is test-only (pytest + httpx for FastAPI's TestClient) and
        # deliberately kept out of requirements.txt, which is what the S2I build installs into the
        # running service image.
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: pytest
        # pytest itself exits 5 ("no tests ran") if collection finds nothing, which already fails
        # this step - the explicit file-presence floor above is defense in depth, not the only gate.
        run: python -m pytest -v
