---
# Showroom (nookbag) UI config — the attendee cockpit layout.
#
# CANONICAL / LOCAL-DEV COPY. The authoritative runtime copy is templated per-user by
# gitops/workshop-config/templates/showroom.yaml (SHOWROOM_UI_CONFIG env), which substitutes
# the real apps domain for ${DOMAIN}. Keep the two in sync; this file documents intent and
# lets `podman run ... ghcr.io/juliaaano/antora-viewer` render the shell locally.
#
# Schema: https://github.com/rhpds/nookbag/blob/main/docs/UI-CONFIG.md
type: showroom

# Left column = instructions (our Antora content); right column = terminals + tool tabs.
# 45% keeps commands readable while leaving the terminal a usable width (project ruling 2026-07-10).
default_width: 45
# Browser refresh must not reset which page/tab the attendee was on.
persist_url_state: true

# Right-edge popout to flip between Instructions-only / Split / Tabs-only (Alt+V cycles).
view_switcher:
  enabled: true
  default_mode: split

# Antora content shown in the left panel. `name` is our component (content/antora.yml → modules);
# `dir` defaults to www for type: showroom. No modules[] list — Antora's own nav-workshop.adoc
# drives navigation (27 modules eventually), so we do not duplicate the nav here.
antora:
  name: modules

tabs:
  # Two terminals (double-terminal → /tty-top + /tty-bottom on port 443, proxied to one ttyd
  # that forks a fresh shell per connection). This workshop is full of watch-in-one / act-in-the-
  # other beats, so both shells share the attendee's home and identity (logged in as {user}).
  - name: Terminal 1
    secondary_name: Terminal 2
    type: double-terminal

  # Tool tabs are EMBEDDED panes. The workshop runs on a dedicated cluster and the installer
  # rewrites the default router's response headers (bootstrap/install.sh step 2a''''): X-Frame-Options is
  # removed and every route answers CSP frame-ancestors 'self' https://*.<apps>, so the console, Gitea,
  # Dev Spaces, Argo CD, Developer Hub and SonarQube render inside the cockpit and keep their logins
  # (same apps domain, so their cookies are same-site).
  # On the cluster the six tool tabs come from the workshop-config.toolTabs helper: showroom.toolTabs
  # (vars.yaml cockpit_tool_tabs) adds `external: true` to all of them (external) or to Console, Dev Spaces
  # and Argo CD (mixed: OpenShift shows its own sign-in page there, which no frame shows). This copy is embedded.
  - name: OCP Console
    url: 'https://console-openshift-console.${DOMAIN}'
  - name: Gitea
    # Host is gitea-<giteaNamespace>.<domain>; giteaNamespace is ogsr-gitea (gitops/workshop-config/
    # values.yaml), so gitea-gitea.${DOMAIN} (the value this file carried until now) never resolved —
    # it drifted from the authoritative $giteaHost template in showroom.yaml/showroom-demos.yaml,
    # which both correctly render gitea-ogsr-gitea.<domain>. Fixed to match (2026-07-30 audit).
    url: 'https://gitea-ogsr-gitea.${DOMAIN}'
  - name: Dev Spaces
    url: 'https://devspaces.${DOMAIN}/oauth/start?rd=%2Fdashboard%2F'
  - name: Argo CD
    url: 'https://student-gitops-server-student-gitops.${DOMAIN}/auth/login?return_url=https%3A%2F%2Fstudent-gitops-server-student-gitops.${DOMAIN}%2Fapplications'
  - name: Dev Hub
    url: 'https://backstage-developer-hub-rhdh.${DOMAIN}'
  - name: SonarQube
    url: 'https://sonarqube-sonarqube.${DOMAIN}'
